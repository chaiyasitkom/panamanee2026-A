<style>
:root{
  --primary:#1E40AF;
  --primary-dark:#1E3A8A;
  --primary-darker:#172554;
  --accent:#3B82F6;
  --accent-soft:#DBEAFE;
  --bg:#F3F4F6;
  --card:#FFFFFF;
  --text:#0F172A;
  --muted:#64748B;
  --line:#E5E7EB;
  --line-soft:#F1F5F9;
  --success:#10B981;
  --warning:#F59E0B;
  --danger:#EF4444;
  --info:#0EA5E9;
  --violet:#8B5CF6;
  --amber:#D97706;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.03);
  --shadow:0 4px 14px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
  --shadow-lg:0 20px 40px -8px rgba(15,23,42,.18);
  --radius:12px;
  --radius-sm:8px;
  --radius-lg:16px;
  --row-h:52px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:"Kanit",system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html{scroll-behavior:smooth}
button{font-family:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:inherit;text-decoration:none}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
.login-brand{position:relative;overflow:hidden;padding:56px;color:#fff;background:linear-gradient(135deg,#172554 0%,#1E3A8A 45%,#1E40AF 100%);display:flex;flex-direction:column;justify-content:space-between;}
.login-brand::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 10%, rgba(59,130,246,.35), transparent 45%),radial-gradient(circle at 80% 90%, rgba(139,92,246,.25), transparent 50%);pointer-events:none;}
.login-brand .grid-bg{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:48px 48px}
.login-logo{display:flex;align-items:center;gap:12px;font-weight:600;font-size:18px;position:relative;z-index:1}
.login-logo .mark{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.2)}
.login-hero{position:relative;z-index:1}
.login-hero h1{font-size:44px;line-height:1.15;margin:0 0 16px;font-weight:600;letter-spacing:-.01em}
.login-hero p{font-size:17px;color:rgba(255,255,255,.75);max-width:440px;margin:0 0 28px;line-height:1.55}
.login-hero .chips{display:flex;gap:8px;flex-wrap:wrap}
.login-hero .chip{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-size:13px}
.login-foot{position:relative;z-index:1;font-size:13px;color:rgba(255,255,255,.55)}
.login-card-wrap{display:grid;place-items:center;padding:40px}
.login-card{width:100%;max-width:420px}
.login-card h2{font-size:28px;margin:0 0 6px;font-weight:600}
.login-card .sub{color:var(--muted);margin:0 0 28px}
.login-card label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.login-card .field{margin-bottom:16px;position:relative}
.login-card input{width:100%;padding:13px 14px 13px 42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.1)}
.login-card .field i{position:absolute;left:14px;top:40px;color:var(--muted);font-size:14px}
.login-btn{width:100%;padding:13px;border-radius:10px;background:var(--primary);color:#fff;font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .05s}
.login-btn:hover{background:var(--primary-dark)}
.login-btn:active{transform:translateY(1px)}
@media (max-width:900px){.login-wrap{grid-template-columns:1fr}.login-brand{padding:32px;min-height:200px}.login-hero h1{font-size:28px}.login-hero p{font-size:15px}}
/* ===== One Workspace Login ===== */
.ow-login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.05fr .95fr;background:var(--bg)}
.ow-brand{position:relative;overflow:hidden;padding:56px 60px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:40px;background:radial-gradient(125% 125% at 0% 0%,#1E3A8A 0%,#172554 55%,#0B1220 100%);}
.ow-aurora{position:absolute;inset:0;pointer-events:none;background:radial-gradient(40% 40% at 16% 12%,rgba(59,130,246,.45),transparent 60%),radial-gradient(46% 46% at 86% 86%,rgba(139,92,246,.34),transparent 60%),radial-gradient(30% 30% at 78% 14%,rgba(14,165,233,.28),transparent 60%);}
.ow-grid-bg{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(120% 100% at 50% 0%,#000 42%,transparent 100%);mask-image:radial-gradient(120% 100% at 50% 0%,#000 42%,transparent 100%);}
.ow-top,.ow-hero,.ow-foot{position:relative;z-index:1}
.ow-logo{display:flex;align-items:center;gap:13px}
.ow-logo-mark{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 24px -6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.ow-logo-name{font-size:19px;font-weight:600;letter-spacing:.2px}
.ow-logo-sub{font-size:12px;font-weight:300;color:rgba(255,255,255,.55);margin-top:1px;letter-spacing:.3px}
.ow-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:#BFDBFE;padding:6px 13px;border-radius:999px;background:rgba(59,130,246,.16);border:1px solid rgba(147,197,253,.28);margin-bottom:22px}
.ow-hero h1{font-size:46px;line-height:1.12;margin:0 0 18px;font-weight:600;letter-spacing:-.02em}
.ow-accent{background:linear-gradient(90deg,#60A5FA,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}
.ow-hero p{font-size:16px;color:rgba(255,255,255,.72);max-width:460px;margin:0 0 30px;line-height:1.6}
.ow-modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:480px}
.ow-mod{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:transform .2s,background .2s,border-color .2s}
.ow-mod.is-ready:hover{background:rgba(255,255,255,.11);border-color:rgba(147,197,253,.4);transform:translateY(-2px)}
.ow-mod-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:14px;flex:0 0 auto;background:rgba(59,130,246,.2);color:#93C5FD}
.ow-mod.is-soon .ow-mod-icon{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
.ow-mod-name{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ow-mod.is-soon .ow-mod-name{color:rgba(255,255,255,.6)}
.ow-mod-dot{width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 0 3px rgba(52,211,153,.2);flex:0 0 auto}
.ow-mod-soon{font-size:10.5px;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.16);padding:2px 7px;border-radius:999px;flex:0 0 auto;white-space:nowrap}
.ow-foot{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,.5);gap:12px}
.ow-foot i{margin-right:6px}
.ow-auth{display:grid;place-items:center;padding:40px}
.ow-card{width:100%;max-width:400px}
.ow-logo-mark.is-img,.ow-card-badge.is-img{background:#fff;padding:7px;overflow:hidden}.ow-logo-mark.is-img img,.ow-card-badge.is-img img{width:100%;height:100%;object-fit:contain;display:block}.ow-logo-mark.is-img{width:88px;height:88px;border-radius:20px}.ow-card-badge.is-img{width:96px;height:96px;border-radius:22px}@media (max-width:600px){.ow-logo-mark.is-img{width:64px;height:64px;border-radius:16px}.ow-card-badge.is-img{width:72px;height:72px;border-radius:18px}}
.ow-card-badge{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:22px;color:#fff;margin-bottom:20px;background:linear-gradient(145deg,var(--accent),var(--primary));box-shadow:0 12px 28px -8px rgba(30,64,175,.55)}
.ow-card h2{font-size:27px;margin:0 0 7px;font-weight:600;letter-spacing:-.01em}
.ow-card-sub{color:var(--muted);margin:0 0 30px;font-size:14.5px;line-height:1.5}
.ow-field{display:block;margin-bottom:18px}
.ow-field-label{display:block;font-size:13px;color:var(--text);font-weight:500;margin-bottom:8px}
.ow-input{position:relative;display:flex;align-items:center}
.ow-input>i{position:absolute;left:15px;color:var(--muted);font-size:14px;pointer-events:none}
.ow-input input{width:100%;padding:14px 15px 14px 44px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:14.5px;transition:border-color .15s,box-shadow .15s}
.ow-input input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.ow-eye{position:absolute;right:8px;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ow-eye:hover{background:var(--line-soft);color:var(--text)}
.ow-submit{width:100%;padding:14px;border-radius:12px;color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:6px;background:linear-gradient(135deg,var(--accent),var(--primary));box-shadow:0 10px 24px -8px rgba(30,64,175,.5);transition:filter .15s,transform .05s,box-shadow .15s}
.ow-submit:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px rgba(30,64,175,.6)}
.ow-submit:active{transform:translateY(1px)}
.ow-hint{margin-top:22px;padding:13px 15px;border-radius:12px;background:var(--line-soft);border:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.5;display:flex;gap:9px;align-items:flex-start}
.ow-hint>i{color:var(--primary);margin-top:2px;flex:0 0 auto}
@media (max-width:960px){.ow-login{grid-template-columns:1fr}.ow-brand{padding:36px 30px;gap:28px}.ow-hero h1{font-size:33px}}
@media (max-width:600px){.ow-brand{padding:28px 22px}.ow-hero h1{font-size:27px}.ow-hero p{font-size:14px}.ow-modules{grid-template-columns:1fr}.ow-auth{padding:28px 20px}.ow-foot{flex-direction:column;align-items:flex-start;gap:6px}}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh;min-height:100dvh}
.sidebar{background:linear-gradient(180deg,#1E3A8A 0%,#172554 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:20;}
.sidebar .brand{padding:22px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .brand .mark{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;border:1px solid rgba(255,255,255,.18)}
.sidebar .brand .t{font-weight:600;font-size:15px;line-height:1.2}
.sidebar .brand .t small{display:block;font-weight:300;font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}
.sidebar .nav{flex:1;padding:14px 10px;overflow-y:auto}
.sidebar .nav .section{font-size:11px;color:rgba(255,255,255,.4);padding:14px 12px 6px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,.75);font-size:14px;cursor:pointer;transition:background .12s,color .12s;margin-bottom:2px;font-weight:400}
.nav-item i{width:18px;text-align:center;font-size:14px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(59,130,246,.25);color:#fff;box-shadow:inset 2px 0 0 var(--accent);font-weight:500}
.nav-item .badge{margin-left:auto;background:rgba(255,255,255,.14);font-size:11px;padding:1px 7px;border-radius:999px;font-weight:500}
.sidebar .me{border-top:1px solid rgba(255,255,255,.08);padding:14px;display:flex;align-items:center;gap:10px}
.sidebar .me .avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);display:grid;place-items:center;font-weight:500}
.sidebar .me .who{flex:1;min-width:0}
.sidebar .me .who .name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar .me .who .role{font-size:11px;color:rgba(255,255,255,.55)}
.sidebar .me .logout{color:rgba(255,255,255,.55);padding:6px;border-radius:8px}
.sidebar .me .logout:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar-toggle{display:none;position:fixed;top:14px;left:14px;z-index:30;width:44px;height:44px;border-radius:12px;background:#fff;box-shadow:var(--shadow);color:var(--text);place-items:center;font-size:16px}
.sidebar-scrim{display:none}
@media (max-width:1024px){
  .shell{grid-template-columns:1fr;overflow-x:clip;max-width:100vw}
  .sidebar{position:fixed;left:0;top:0;width:280px;transform:translateX(-100%);transition:transform .22s ease-out;height:100dvh;z-index:25}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar-toggle{display:grid}
  .sidebar-scrim.show{display:block;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:19;backdrop-filter:blur(2px)}
  .main{padding:70px 18px 80px !important}
  .topbar{margin-bottom:16px;flex-wrap:wrap}
  .topbar .actions{width:100%;order:2;flex-wrap:wrap}
  .topbar .actions .search-input{display:none}
  .search-input input{width:100%}
  .role-quick{flex:1}
  .charts-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .machines-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .filters .search-input input{width:100%}
}
@media (max-width:640px){
  .main{padding:62px 12px 60px !important}
  .topbar{flex-direction:column;align-items:stretch;gap:10px}
  .topbar .title h1{font-size:19px}
  .topbar .title .crumb{font-size:12px}
  .topbar .actions{flex-wrap:wrap;gap:8px}
  .topbar .actions .btn-primary{flex:1;justify-content:center}
  .topbar .actions .search-input{display:none}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:13px}
  .stat .val{font-size:22px}
  .stat .ic{width:34px;height:34px;margin-bottom:10px}
  .card-h{padding:13px 14px}
  .card-body{padding:14px}
  .filters{flex-direction:column;align-items:stretch;padding:10px;gap:8px}
  .filters .search-input input,.filters select{width:100%;min-width:0}
  .filters .spacer{display:none}
  table.data{font-size:12.5px}
  table.data th,table.data td{padding:9px 10px}
  .cell-title{max-width:160px}
  .modal{max-height:94dvh;border-radius:16px 16px 0 0;align-self:end}

  .modal-h{padding:14px 16px}
  .modal-f{padding:12px 16px;flex-wrap:wrap;gap:8px}
  .modal-f .btn{flex:1;min-width:0;justify-content:center}
  .form-grid{grid-template-columns:1fr !important}
  .form-grid .full{grid-column:1/-1}
  .detail-grid{grid-template-columns:1fr !important}
  .detail-header{grid-template-columns:1fr !important}
  .kpi-line{grid-template-columns:1fr !important}
  .machines-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .status-actions{gap:4px}
  .quick-action{flex:1;justify-content:center;font-size:11.5px;padding:6px 8px}
  .login-wrap{grid-template-columns:1fr}
  .login-brand{padding:22px;min-height:auto}
  .login-hero h1{font-size:24px}
  .login-hero p{font-size:13.5px}
  .login-card-wrap{padding:22px 18px}
  .sidebar-toggle{top:10px;left:10px;width:40px;height:40px}
  .ticket-id{font-size:11px;padding:2px 6px}
  .badge{font-size:11px;padding:2px 8px}
  .cat-chip{font-size:11px;padding:2px 7px}

  .ia{width:28px;height:28px}

@media (max-width:420px){
  .main{padding:58px 10px 56px !important}
  .topbar .title h1{font-size:17px}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{padding:11px}
  .stat .val{font-size:20px}
  .stat .ic{width:30px;height:30px;font-size:14px;margin-bottom:8px}
  .machines-grid{grid-template-columns:1fr}
  .btn{padding:8px 12px;font-size:13px}
  .login-hero h1{font-size:20px}
  .login-card h2{font-size:22px}
  .modal-h h3{font-size:15px}
}

@media (min-width:641px) and (max-width:900px){.stat-grid{grid-template-columns:repeat(3,1fr)}.charts-grid{grid-template-columns:1fr}.machines-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
.main{padding:28px 32px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.topbar .title h1{font-size:24px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
.topbar .title .crumb{color:var(--muted);font-size:13px}
.topbar .actions{display:flex;gap:10px;align-items:center}
.search-input{position:relative}
.search-input input{padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:#fff;width:260px;outline:none;font-size:13.5px}
.search-input input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.search-input i{position:absolute;left:12px;top:11px;color:var(--muted);font-size:13px}
.role-quick{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13px}
.role-quick select{border:0;background:transparent;outline:none;font-weight:500;color:var(--primary);padding-right:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:500;border:1px solid transparent;transition:background .12s,border-color .12s,color .12s,transform .05s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}

  if(!/Android/i.test(navigator.userAgent || "")) return;
  if(sessionStorage.getItem("rms_use_web") === "1") return;

  var APP_PACKAGE = "com.panamanee.repairmanagement";
  var APP_SCHEME = "repairapp";
  var DOWNLOAD_URL = "https://panamanee2026.onrender.com/download-app.html";
  var appOpened = false;

  function markOpened(){ appOpened = true; }
  document.addEventListener("visibilitychange", function(){ if(document.hidden) markOpened(); });
  window.addEventListener("blur", markOpened);
  window.addEventListener("pagehide", markOpened);

  window.location.href = "intent://open#Intent;scheme=" + APP_SCHEME + ";package=" + APP_PACKAGE + ";end";

  setTimeout(function(){
    if(appOpened) return;
    showAppPrompt();
  }, 1200);

  function showAppPrompt(){
    var overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:99999;font-family:'Kanit',sans-serif;padding:20px";
    overlay.innerHTML =
      '<div style="background:#fff;border-radius:20px;max-width:360px;width:100%;padding:28px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)">' +
        '<div style="width:56px;height:56px;border-radius:16px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px">🔧</div>' +
        '<h3 style="margin:0 0 6px;font-size:17px;color:#0F172A">เปิดผ่านแอปหรือเว็บ?</h3>' +
        '<p style="margin:0 0 20px;font-size:13px;color:#64748B;line-height:1.6">ดูเหมือนยังไม่ได้ติดตั้งแอปบนอุปกรณ์นี้ เลือกวิธีที่ต้องการใช้งาน</p>' +
        '<button id="__goApp" style="width:100%;padding:13px;border-radius:12px;background:#1E40AF;color:#fff;font-weight:600;font-size:14.5px;margin-bottom:10px;font-family:inherit;border:0">📲 ดาวน์โหลด/เปิดแอป</button>' +
        '<button id="__goWeb" style="width:100%;padding:13px;border-radius:12px;background:#F1F5F9;color:#475569;font-weight:600;font-size:14.5px;font-family:inherit;border:0">🌐 ใช้งานผ่านเว็บ</button>' +
      '</div>';
    document.body.appendChild(overlay);
    document.getElementById("__goApp").onclick = function(){
      window.location.href = DOWNLOAD_URL;
    };
    document.getElementById("__goWeb").onclick = function(){
      overlay.remove();
      try { sessionStorage.setItem("rms_use_web", "1"); } catch(e){}
    };
  }
})();

  }
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Apps Script error');
  return json.data;
}

async function _nextId(collection, prefix, pad) {
  const snap = await _db.ref('/' + collection).get();
  const items = Object.values(snap.val() || {});
  let max = 0;
  items.forEach(item => {
    const m = String(item.id || '').match(/\d+/);
    if (m) max = Math.max(max, parseInt(m[0], 10));
  });
  return prefix + String(max + 1).padStart(pad, '0');
}

// เลขที่ใบแจ้งซ่อม: RE-<รหัสโครงการ>-<ปีพ.ศ.><เดือน>/<ลำดับ>  เช่น RE-PRJ-A1-256807/001
// ลำดับเริ่มนับใหม่ทุกเดือน แยกตามโครงการ
function _buildRunning(projectName, repairs, projects) {
  const proj = (projects || []).find(p => p && p.name === projectName);
  const code = String((proj && proj.code) || projectName || 'GEN').trim().replace(/\s+/g, '-').toUpperCase();
  const d = new Date();
  const ym = String(d.getFullYear() + 543) + String(d.getMonth() + 1).padStart(2, '0');
  const prefix = 'RE-' + code + '-' + ym + '/';
  let max = 0;
  (repairs || []).forEach(r => {
    const s = String((r && r.running) || '');
    if (s.slice(0, prefix.length) === prefix) {
      const n = parseInt(s.slice(prefix.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return prefix + String(max + 1).padStart(3, '0');
}

      };

      return { ...repair, timeline: Object.values(repair.timeline) };
    }

    case 'loadAssetRegistry': {
      const snap = await _assetDb.ref('/assets').get();
      return Object.entries(snap.val() || {}).map(([key, v]) => ({ key, ...(v || {}) }));
    }

    case 'saveAssetRegistry': {
      const { key, asset } = payload;
      const clean = { ...(asset || {}) };
      delete clean.key;
      // เพิ่มใหม่ = ให้ Firebase ออก key ให้ (รหัสทรัพย์สินมีอักขระที่ใช้เป็น key ไม่ได้)
      const ref = key ? _assetDb.ref('/assets/' + key) : _assetDb.ref('/assets').push();
      const id = key || ref.key;
      clean.id = clean.id || clean.assetCode || id;
      clean.quantity = Number(clean.quantity) || 0;
      clean.updatedAt = new Date().toISOString();
      await ref.set(clean);
      return { key: id, ...clean };
    }

    case 'deleteAssetRegistry': {
      const { key } = payload;
      await _assetDb.ref('/assets/' + key).remove();
      return { deleted: true };
    }

    // ย้ายทรัพย์สินไปโครงการปลายทาง + ออกใบส่งของ (DO) ในคราวเดียว
    // moves: [{key, qty}] — ย้ายไม่ครบจำนวนได้ (เช่น แผ่นเหล็ก 10 แผ่น ย้ายแค่ 4)
    // ย้ายครบ = ย้ายทั้งรายการ · ย้ายบางส่วน = ตัดจำนวนต้นทางลง แล้วแตกรายการใหม่ที่ปลายทาง
    case 'transferAssets': {
      const { moves, toProject, note, by, doc } = payload;
      const when = new Date().toISOString();
      const snap = await _assetDb.ref('/assets').get();
      const all = snap.val() || {};
      const updates = {};
      const items = [];
      (moves || []).forEach(mv => {
        const k = mv && mv.key;
        const a = k && all[k];
        if (!a) return;
        const total = Number(a.quantity) || 0;
        const qty = Math.min(Math.max(Number(mv.qty) || 0, 0), total || Number(mv.qty) || 0);
        if (qty <= 0) return;
        const from = a.site || '';
        const partial = total > 0 && qty < total;
        const entry = { from, to: toProject, when, by: by || '', note: note || '', docNo: (doc && doc.docNo) || '', qty, partial };
        const hist = Array.isArray(a.transferHistory) ? a.transferHistory.slice() : [];

        if (!partial) {
          updates['/assets/' + k + '/site'] = toProject;
          updates['/assets/' + k + '/transferHistory'] = hist.concat([entry]);
          updates['/assets/' + k + '/updatedAt'] = when;
        } else {
          // ต้นทางเหลือของเดิม, ปลายทางเป็นรายการใหม่ (รหัสทรัพย์สินเดิม อาจว่างได้)
          updates['/assets/' + k + '/quantity'] = total - qty;
          updates['/assets/' + k + '/transferHistory'] = hist.concat([{ ...entry, splitOut: qty }]);
          updates['/assets/' + k + '/updatedAt'] = when;
          const newKey = _assetDb.ref('/assets').push().key;
          updates['/assets/' + newKey] = {
            ...a, quantity: qty, site: toProject, updatedAt: when,
            splitFrom: k, transferHistory: hist.concat([entry]),
          };
        }
        items.push({
          key: k, assetCode: a.assetCode || a.id || '', name: a.name || '',
          brand: a.brand || '', model: a.model || '', serial: a.serial || '',
          quantity: qty, totalBefore: total, partial, unit: a.unit || '', from,
        });
      });
      if (!items.length) throw new Error('ไม่พบทรัพย์สินที่เลือก หรือจำนวนที่ย้ายเป็น 0');
      const docKey = String((doc && doc.docNo) || ('DO-' + when)).replace(/[.#$/\[\]]/g, '-');
      const record = { ...(doc || {}), key: docKey, toProject, note: note || '', by: by || '', when, items };
      updates['/deliveryOrders/' + docKey] = record;
      await _assetDb.ref().update(updates);
      return { doc: record, when, items };
    }

    case 'loadDeliveryOrders': {
      const snap = await _assetDb.ref('/deliveryOrders').get();
      return Object.entries(snap.val() || {}).map(([key, v]) => ({ key, ...(v || {}) }));
    }

    case 'deleteDeliveryOrder': {
      const { key } = payload;
      await _assetDb.ref('/deliveryOrders/' + key).remove();
      return { deleted: true };
    }

    // แก้ไขข้อมูลใบส่งของ (DO)
    // adjustStock=false : แก้เฉพาะข้อมูลบนเอกสาร ไม่กระทบสต๊อก
    // adjustStock=true  : แก้จำนวนแล้วปรับสต๊อกทรัพย์สินตามส่วนต่าง (ต้นทาง<->ปลายทาง) ในทรานแซกชันเดียว
    //   - อ้างอิงตำแหน่งจริงจากใบส่งของเดิม (ปลายทาง=doc.toProject, ต้นทาง=item.from) การแก้ชื่อโครงการบนเอกสารไม่ย้ายสต๊อก
    //   - จับคู่ทรัพย์สินด้วยรหัส (assetCode) + โครงการ; รายการที่ไม่มีรหัสจะข้ามการปรับสต๊อก
    //   - ตรวจจำนวนให้พอก่อนเสมอ ถ้าไม่พอจะยกเลิกทั้งใบ (ไม่เขียนบางส่วน)
    case 'updateDeliveryOrder': {
      const { key, patch, by, adjustStock } = payload;
      if (!key) throw new Error('ไม่พบรหัสใบส่งของ');
      const when = new Date().toISOString();
      const updates = {};
      const warnings = [];

      if (adjustStock) {
        const [doSnap, aSnap] = await Promise.all([
          _assetDb.ref('/deliveryOrders/' + key).get(),
          _assetDb.ref('/assets').get(),
        ]);
        const old = doSnap.val() || {};
        const assets = aSnap.val() || {};
        const toArr = (v) => Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : []);
        const oldItems = toArr(old.items);
        const newItems = Array.isArray(patch.items) ? patch.items : oldItems;
        const destSite = old.toProject || '';
        const docNo = old.docNo || (patch && patch.docNo) || '';

        const curQty = {};
        const getQty = (k) => (curQty[k] !== undefined ? curQty[k] : (Number(assets[k].quantity) || 0));
        const histAdd = {};
        const pushHist = (k, e) => { (histAdd[k] = histAdd[k] || []).push(e); };
        const newAssets = {};
        const findAsset = (code, site) => Object.keys(assets).find((k) => {
          const a = assets[k] || {};
          return String(a.assetCode || a.id || '') === String(code) && String(a.site || '') === String(site);
        });

        newItems.forEach((ni, i) => {
          const oi = oldItems[i] || {};
          const oldQty = Number(oi.quantity) || 0;
          const newQty = Number(ni.quantity) || 0;
          const delta = newQty - oldQty;
          if (delta === 0) return;
          const code = ni.assetCode || oi.assetCode || '';
          const srcSite = oi.from || ni.from || '';
          const label = ni.name || oi.name || code || ('รายการที่ ' + (i + 1));
          if (!code) { warnings.push(label + ': ไม่มีรหัสทรัพย์สิน จึงไม่ปรับสต๊อกให้'); return; }

          if (delta > 0) {
            // ย้ายเพิ่ม delta หน่วย จากต้นทาง -> ปลายทาง
            const sk = srcSite ? findAsset(code, srcSite) : null;
            if (sk) {
              const have = getQty(sk);
              if (have < delta) throw new Error(`สต๊อกต้นทางไม่พอสำหรับ ${code} ที่ ${srcSite} (มี ${have}, ต้องเพิ่ม ${delta})`);
              curQty[sk] = have - delta;
              pushHist(sk, { from: srcSite, to: destSite, when, by: by || '', note: 'ปรับลดจากการแก้ไขใบส่งของ', docNo, qty: delta, adjust: true, splitOut: delta });
            } else {
              warnings.push(`${code}: ไม่พบทรัพย์สินต้นทางที่ ${srcSite || '-'} จึงเพิ่มจำนวนปลายทางโดยไม่ตัดต้นทาง`);
            }
            const dk = findAsset(code, destSite);
            if (dk) {
              curQty[dk] = getQty(dk) + delta;
              pushHist(dk, { from: srcSite, to: destSite, when, by: by || '', note: 'ปรับเพิ่มจากการแก้ไขใบส่งของ', docNo, qty: delta, adjust: true });
            } else {
              const base = sk ? assets[sk] : { assetCode: code, name: ni.name || '', unit: ni.unit || '', brand: ni.brand || '', model: ni.model || '', serial: ni.serial || '' };
              const nk = _assetDb.ref('/assets').push().key;
              newAssets[nk] = { ...base, quantity: delta, site: destSite, updatedAt: when, transferHistory: [{ from: srcSite, to: destSite, when, by: by || '', note: 'สร้างจากการแก้ไขใบส่งของ', docNo, qty: delta, adjust: true }] };
            }
          } else {
            // ลดจำนวน => คืน need หน่วย จากปลายทาง -> ต้นทาง
            const need = -delta;
            const dk = findAsset(code, destSite);
            if (!dk) throw new Error(`ไม่พบทรัพย์สินปลายทางที่ ${destSite || '-'} สำหรับ ${code} จึงลดจำนวนไม่ได้`);
            const have = getQty(dk);
            if (have < need) throw new Error(`จำนวนปลายทางไม่พอลดสำหรับ ${code} ที่ ${destSite} (มี ${have}, ต้องลด ${need})`);
            curQty[dk] = have - need;
            pushHist(dk, { from: destSite, to: srcSite, when, by: by || '', note: 'ปรับลด/คืนจากการแก้ไขใบส่งของ', docNo, qty: need, adjust: true, splitOut: need });
            const sk = srcSite ? findAsset(code, srcSite) : null;
            if (sk) {
              curQty[sk] = getQty(sk) + need;
              pushHist(sk, { from: destSite, to: srcSite, when, by: by || '', note: 'คืนจำนวนจากการแก้ไขใบส่งของ', docNo, qty: need, adjust: true });
            } else if (srcSite) {
              const base = assets[dk] ? assets[dk] : { assetCode: code, name: ni.name || '', unit: ni.unit || '' };
              const nk = _assetDb.ref('/assets').push().key;
              newAssets[nk] = { ...base, quantity: need, site: srcSite, updatedAt: when, transferHistory: [{ from: destSite, to: srcSite, when, by: by || '', note: 'คืนจากการแก้ไขใบส่งของ', docNo, qty: need, adjust: true }] };
            } else {
              warnings.push(`${code}: ไม่ทราบโครงการต้นทาง จึงลดปลายทางโดยไม่คืนต้นทาง`);
            }
          }
        });

        Object.keys(curQty).forEach((k) => {
          updates['/assets/' + k + '/quantity'] = curQty[k];
          updates['/assets/' + k + '/updatedAt'] = when;
        });
        Object.keys(histAdd).forEach((k) => {
          const cur = Array.isArray(assets[k] && assets[k].transferHistory) ? assets[k].transferHistory.slice() : [];
          updates['/assets/' + k + '/transferHistory'] = cur.concat(histAdd[k]);
        });
        Object.keys(newAssets).forEach((k) => { updates['/assets/' + k] = newAssets[k]; });
      }

      const clean = { ...(patch || {}) };
      delete clean.key; delete clean.when;
      clean.updatedAt = when;
      clean.updatedBy = by || '';
      Object.keys(clean).forEach((kk) => { updates['/deliveryOrders/' + key + '/' + kk] = clean[kk]; });

      await _assetDb.ref().update(updates);
      return { ok: true, warnings };
    }

    case 'deleteRepair': {
      const { id, role } = payload;
      if (role !== 'Admin') throw new Error('เฉพาะผู้ดูแลระบบ (Admin) เท่านั้นที่ลบใบแจ้งซ่อมได้');
      await _db.ref('/repairs/' + id).remove();
      return { deleted: true };
    }

    case 'updateRepairProblems': {
      const { id, problems, status, by, note } = payload;
      const tlKey = _db.ref('/repairs/' + id + '/timeline').push().key;
      const upd = {
        problems: problems || [],
        updatedAt: new Date().toISOString(),
        ['timeline/' + tlKey]: { id: tlKey, status: status || '', when: new Date().toISOString(), by: by || '', note: note || 'ปรับสถานะรายการอาการ' },
      };
      if (status !== undefined) upd.status = status;
      await _db.ref('/repairs/' + id).update(upd);
      return { ok: true };
    }

    case 'updateRepair': {
      const { id, patch, by } = payload;
      const clean = { ...patch };
      clean.updatedAt = new Date().toISOString();
      delete clean.id; delete clean.running; delete clean.timeline;
      const tlKey = _db.ref('/repairs/' + id + '/timeline').push().key;
      clean['timeline/' + tlKey] = {
        id: tlKey, status: clean.status || '', when: new Date().toISOString(), by: by || '', note: 'แก้ไขข้อมูลโดย Admin'
      };
      await _db.ref('/repairs/' + id).update(clean);
      return { ok: true };
    }

    case 'updateRepairStatus': {
      const { id, status, by, note, cost, patch: extraPatch } = payload;
      const ALLOW = ['title','desc','repairNote','siteId','machineCode','project','categoryId','reporterName','assignedId','parts','laborCost'];
      const clean = {};
      ALLOW.forEach(k => { if (extraPatch && extraPatch[k] !== undefined) clean[k] = extraPatch[k]; });
      clean.updatedAt = new Date().toISOString();
      if (status !== undefined) clean.status = status;
      if (cost !== undefined) clean.cost = cost;
      const tlKey = _db.ref('/repairs/' + id + '/timeline').push().key;
      clean['timeline/' + tlKey] = {
        id: tlKey, status: status || '', when: new Date().toISOString(), by: by || '', note: note || ''
      };
      await _db.ref('/repairs/' + id).update(clean);
      return { ok: true };
    }

    case 'getLoginLogs': {
      const snap = await _db.ref('/loginLogs').get();
      const logs = snap.val() ? Object.values(snap.val()) : [];
      logs.sort((a,b) => new Date(b.when) - new Date(a.when));
      return { logs };
    }

    default:
      throw new Error('Unknown action: ' + action);
  }
}

window.api = api;
</script>

<script type="text/babel">
// Data layer — connects to Firebase Realtime Database

const STATUSES = [
  { key:"new",      label:"ใหม่",             className:"b-new",      icon:"fa-circle-plus" },
  { key:"assess",   label:"รอประเมินราคา",    className:"b-assess",   icon:"fa-magnifying-glass-dollar" },

  { key:"cancel",   label:"ยกเลิก",           className:"b-cancel",   icon:"fa-ban" },
];

const ERP_SYSTEMS = [
  { id:"repairs", name:"งานซ่อม", desc:"แจ้งซ่อม ติดตามงาน และบริหารงานซ่อม", icon:"fa-screwdriver-wrench", status:"ready", startPage:"dashboard" },
  { id:"production", name:"Production", desc:"รอพัฒนา", icon:"fa-industry", status:"soon" },
  { id:"assets", name:"Asset", desc:"ทะเบียนและข้อมูลทรัพย์สิน/เครื่องจักร", icon:"fa-boxes-stacked", status:"ready", startPage:"machines" },
  { id:"consume", name:"Consume", desc:"เบิกจ่าย/เช็คสต๊อก · เปิดใช้เฉพาะผู้ดูแลระบบ (Admin)", icon:"fa-box-open", status:"ready", startPage:"withdrawals", roles:["Admin"] },
  { id:"pc", name:"PC (Petty Cash)", desc:"รอพัฒนา", icon:"fa-money-bill-wave", status:"soon" },
  { id:"hr-time", name:"บุคลากร/เวลาทำงาน", desc:"รอพัฒนา", icon:"fa-users", status:"soon" },
];

function fmtDate(d){ if(!d) return ""; if(typeof d==="string") d=new Date(d); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtDateTime(d){ if(!d) return ""; if(typeof d==="string") d=new Date(d); return `${fmtDate(d)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

window.__DATA = {
  users: [],
  categories: [],
  machines: [],
  repairs: [],
  projects: [],
  withdrawals: [],
  assetRegistry: null,   // โหลดแบบ lazy ตอนเปิดหน้าทะเบียนทรัพย์สิน (คนละ Firebase project)
  deliveryOrders: null,  // ใบส่งของ (DO) — โหลดแบบ lazy เช่นกัน
  statuses: STATUSES,
  erpSystems: ERP_SYSTEMS,
  activeErp: null,
  activeProject: "",
  fmtDate, fmtDateTime
};

window.__DATA.bootstrap = async function(){
  const d = await window.api("bootstrap");
  (d.repairs||[]).forEach(r=>{
    r.createdAt = r.createdAt ? new Date(r.createdAt) : new Date();
    if (!Array.isArray(r.timeline)) r.timeline = [];
    r.timeline.forEach(t => { if(t.when) t.when = new Date(t.when); });
    r.timeline.sort((a,b) => (a.when||0) - (b.when||0));
  });
  (d.repairs||[]).sort((a,b) => b.createdAt - a.createdAt);
  window.__DATA.users      = d.users      || [];
  window.__DATA.categories = d.categories || [];
  window.__DATA.machines   = d.machines   || [];
  window.__DATA.repairs    = d.repairs    || [];
  window.__DATA.projects   = d.projects   || [];
  window.__DATA.withdrawals = d.withdrawals || [];
  return window.__DATA;
};

window.getStatus = (key) => STATUSES.find(s=>s.key===key) || STATUSES[0];
window.getCategory = (id) => window.__DATA.categories.find(c=>c.id===id) || {name:"-",color:"#64748B",icon:"fa-circle"};
window.getUser = (id) => window.__DATA.users.find(u=>u.id===id);
// รหัสโครงการจากชื่อโครงการ (โครงการที่ยังไม่ได้ตั้งรหัสจะได้ "")
window.getProjectCode = (name) => {
  if(!name) return "";
  const p = (window.__DATA.projects||[]).find(x => (typeof x==="string" ? x : x.name) === name);
  return (p && p.code) ? String(p.code) : "";
};
window.getActiveProject = (user) => user?.activeProject || window.__DATA.activeProject || "";
window.getActiveErp = (user) => user?.activeErp || window.__DATA.activeErp || null;

// ระบบงานที่จำกัดสิทธิ์ตาม role — ใส่ roles:[...] ไว้ใน ERP_SYSTEMS (ไม่ใส่ = ทุก role ที่ล็อกอินได้)
window.canUseErp = (user, sys) => {
  if(!sys || sys.status !== "ready") return false;
  if(Array.isArray(sys.roles) && sys.roles.length) return sys.roles.includes(user?.role);
  return true;
};

window.userCanSeeAllProjects = (user) => {
  if(!user) return false;
  if(window.getActiveProject(user)) return false;
  if(["Admin","Director"].includes(user.role)) return true;
  if(user.role==="Engineer") return false;
  return !user.projects || !Array.isArray(user.projects) || user.projects.length===0;
};
window.userProjects = (user) => {
  if(!user) return [];
  const activeProject = window.getActiveProject(user);
  if(activeProject) return [activeProject];
  const fromProjects = (window.__DATA.projects||[]).map(p => typeof p === "string" ? p : p.name).filter(Boolean);
  const allNames = fromProjects.length ? fromProjects : Array.from(new Set((window.__DATA.machines||[]).map(m=>m.project).filter(Boolean)));
  if(window.userCanSeeAllProjects(user)) return allNames;
  return (Array.isArray(user.projects) ? user.projects : []).filter(p=>allNames.includes(p));
};
window.getProject = (name) => (window.__DATA.projects||[]).find(p=>p.name===name) || null;
window.userCanSeeProject = (user, project) => {
  const activeProject = window.getActiveProject(user);
  if(activeProject) return !project || project === activeProject;
  if(window.userCanSeeAllProjects(user)) return true;
  if(!project) return true;
  return (user.projects||[]).includes(project);
};
window.filterByUserProjects = (user, items, projectKey="project") => {
  const activeProject = window.getActiveProject(user);
  if(activeProject) return items.filter(x => !x[projectKey] || x[projectKey] === activeProject);
  if(window.userCanSeeAllProjects(user)) return items;
  const allowed = new Set(user.projects||[]);
  return items.filter(x => !x[projectKey] || allowed.has(x[projectKey]));
};

window.avatarColor = (name) => {
  const colors=["#3B82F6","#8B5CF6","#EF4444","#10B981","#F59E0B","#06B6D4","#EC4899","#6366F1"];
  let h=0; for(const c of (name||"")) h=(h*31+c.charCodeAt(0))>>>0;
  return colors[h%colors.length];
};
window.initials = (name) => (name||"").split(" ").map(s=>s[0]).join("").slice(0,2).toUpperCase();
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

function Badge({status}){
  const s = window.getStatus(status);
  return <span className={`badge ${s.className}`}><span className="dot"></span>{s.label}</span>;
}
function CategoryChip({categoryId}){
  const c = window.getCategory(categoryId);
  return <span className="cat-chip" style={{background:c.color+"22",color:c.color}}><i className={`fa-solid ${c.icon}`}></i>{c.name}</span>;
}
function Avatar({name,size=28}){
  const bg = window.avatarColor(name);
  return <span className="avatar-xs" style={{background:bg,width:size,height:size}}>{window.initials(name)}</span>;
}
// ชื่อโครงการ + รหัสโครงการ (รหัสเดียวกับที่ใช้ออกเลขที่ใบแจ้งซ่อม)
function ProjectLabel({name}){
  const code = window.getProjectCode(name);
  if(!name) return <span style={{color:"var(--muted)"}}>—</span>;
  return <>{code && <span className="mono" style={{color:"var(--muted)",marginRight:6}}>[{code}]</span>}{name}</>;
}
function Modal({open,onClose,title,children,footer,size=""}){
  useEffect(()=>{
    if(!open) return;
    const h=(e)=>{ if(e.key==="Escape") onClose(); };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[open,onClose]);
  if(!open) return null;
  return (
    <div className="modal-scrim" onClick={onClose}>
      <div className={`modal ${size}`} onClick={e=>e.stopPropagation()}>
        <div className="modal-h"><h3>{title}</h3><button className="close" onClick={onClose}><i className="fa-solid fa-xmark"></i></button></div>
        <div className="modal-b">{children}</div>
        {footer && <div className="modal-f">{footer}</div>}
      </div>
    </div>
  );
}
function Loading({show,text="กำลังโหลด..."}){
  if(!show) return null;
  return <div className="loading-scrim"><div className="loading-box"><div className="spinner"></div><span>{text}</span></div></div>;
}
function simulate(ms=500){ return new Promise(r=>setTimeout(r,ms)); }
Object.assign(window, { Badge, CategoryChip, Avatar, ProjectLabel, Modal, Loading, simulate });
</script>

<script type="text/babel">

        </div>
