            <input type="date" value={String(f.receivedAt||"").slice(0,10)} onChange={e=>up("receivedAt",e.target.value)} />
          </div>
          <div className="form-field full">
            <label>หมายเหตุ</label>
            <textarea rows="2" value={f.note||""} onChange={e=>up("note",e.target.value)}></textarea>
          </div>
        </div>
      </form>
    </Modal>
  );
}

      <tbody>${trs}</tbody>
      <tfoot><tr><td colspan="5" style="text-align:right;padding-right:6px">รวม</td><td>${totalQty.toLocaleString("th-TH")}</td><td colspan="2"></td></tr></tfoot>
    </table>
    ${doc.note?`<div style="font-size:16px;margin-top:3mm">หมายเหตุ: ${esc(doc.note)}</div>`:""}

window.downloadDeliveryOrderPdf = async function(doc){
  if(!window.html2pdf){ Swal.fire({icon:"error",title:"ไม่พบตัวสร้าง PDF"}); return; }
  const name = String(doc.docNo||"delivery-order").replace(/[\\/:*?"<>|]/g,"-")+".pdf";
  const el = document.createElement("div");
  el.innerHTML = window.buildDeliveryOrderHtml(doc);
  document.body.appendChild(el);
  try{
    await html2pdf().set({margin:0,filename:name,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(el.firstElementChild).save();
  }finally{ el.remove(); }
};

// หน้ารายการใบส่งของทั้งหมด
function DeliveryOrders({user}){
  const canEdit = ["Admin","Officer","Engineer"].includes(user.role);
  const [rows,setRows] = React.useState(()=>window.__DATA.deliveryOrders || null);
  const [err,setErr] = React.useState("");
  const [q,setQ] = React.useState("");
  const [view,setView] = React.useState(null);
  const [edit,setEdit] = React.useState(null);
  const [transferOpen,setTransferOpen] = React.useState(false);

  const saveEdit = async (doc, patch) => {
    const res = await window.api("updateDeliveryOrder",{key:doc.key, patch, by:user.name, adjustStock:true});
    const upd = rows.map(x=>x.key===doc.key?{...x,...patch}:x);
    window.__DATA.deliveryOrders = upd; setRows(upd);
    window.__DATA.assetRegistry = null;   // ให้หน้าทะเบียนทรัพย์สินโหลดสต๊อกใหม่หลังปรับ
    setEdit(null);
    const warns = (res && res.warnings) || [];
    if(warns.length){
      Swal.fire({icon:"warning",title:"บันทึกแล้ว · แต่มีบางรายการที่ปรับสต๊อกไม่ได้",html:"<div style='text-align:left;font-size:13px'>"+warns.map(w=>"• "+w).join("<br/>")+"</div>",confirmButtonColor:"#1E40AF"});
    }else{
      Swal.fire({icon:"success",title:"บันทึกและปรับสต๊อกแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }
  };

  React.useEffect(()=>{
    if(rows) return;
    let alive = true;
    window.api("loadDeliveryOrders")
      .then(list=>{
        if(!alive) return;
        const sorted = list.slice().sort((a,b)=>String(b.when||"").localeCompare(String(a.when||"")));
        window.__DATA.deliveryOrders = sorted;
        setRows(sorted);
      })
      .catch(e=>{ if(alive) setErr(e.message||String(e)); });
    return ()=>{ alive = false; };
  },[rows]);

  const remove = async (doc) => {
    const { isConfirmed } = await Swal.fire({
      title:"ลบใบส่งของนี้?",
      html:`เลขที่ <b>${doc.docNo||doc.key}</b><br/><span style="color:#64748B">ประวัติการย้ายของทรัพย์สินจะยังอยู่ · การลบไม่สามารถกู้คืนได้</span>`,
      icon:"warning", showCancelButton:true, confirmButtonText:"ใช่, ลบเลย", cancelButtonText:"ยกเลิก", confirmButtonColor:"#EF4444"
    });
    if(!isConfirmed) return;
    try{
      await window.api("deleteDeliveryOrder",{key:doc.key});
      const upd = rows.filter(x=>x.key!==doc.key);
      window.__DATA.deliveryOrders = upd; setRows(upd);
      Swal.fire({icon:"success",title:"ลบแล้ว",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(e){ Swal.fire({icon:"error",title:"ลบไม่สำเร็จ",text:e.message}); }
  };

  if(err) return (
    <div className="card"><div className="card-body"><div className="empty">
      <i className="fa-solid fa-triangle-exclamation" style={{color:"#EF4444"}}></i>
      <div className="t">โหลดใบส่งของไม่สำเร็จ</div><div>{err}</div>
      <button className="btn btn-primary btn-sm" style={{marginTop:12}} onClick={()=>{setErr("");setRows(null);}}><i className="fa-solid fa-rotate"></i> ลองใหม่</button>
    </div></div></div>
  );
  if(!rows) return <Loading show={true} text="กำลังโหลดใบส่งของ..."/>;

  const filtered = rows.filter(d=>!q || [d.docNo,d.toProject,d.fromProjectLabel,d.sender,d.receiver,d.note].join(" ").toLowerCase().includes(q.toLowerCase()));

  return (
    <>
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i>
          <input placeholder="ค้นหาเลขที่ / โครงการ / ผู้ส่ง / ผู้รับ..." value={q} onChange={e=>setQ(e.target.value)} />
        </div>
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>{filtered.length.toLocaleString("th-TH")} / {rows.length.toLocaleString("th-TH")} ใบ</div>
        {canEdit && (
          <button className="btn btn-primary" onClick={()=>setTransferOpen(true)}>
            <i className="fa-solid fa-right-left"></i> ย้ายโครงการ / ออกใบส่งของ
          </button>
        )}
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr>
            <th>เลขที่</th><th>วันที่</th><th className="hide-on-mobile">จากโครงการ</th><th>ไปยังโครงการ</th>
            <th>รายการ</th><th className="hide-on-mobile">ผู้ส่งมอบ</th><th>PDF</th>{canEdit && <th>จัดการ</th>}
          </tr></thead>
          <tbody>
            {filtered.map(d=>(
              <tr key={d.key}>
                <td><span className="ticket-id" style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>setView(d)}>{d.docNo||d.key}</span></td>
                <td style={{whiteSpace:"nowrap",color:"var(--muted)"}}>{d.docDate || window.__DATA.fmtDate(d.when)}</td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{d.fromProjectLabel||"—"}</td>
                <td style={{fontSize:13}}><ProjectLabel name={d.toProject}/></td>
                <td style={{whiteSpace:"nowrap"}}>{(d.items||[]).length} รายการ · {(d.items||[]).reduce((s,x)=>s+(Number(x.quantity)||0),0).toLocaleString("th-TH")} หน่วย</td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{d.sender||"—"}</td>
                <td><button className="btn btn-sm btn-ghost" onClick={()=>window.downloadDeliveryOrderPdf(d)}><i className="fa-solid fa-file-pdf"></i> PDF</button></td>
                {canEdit && <td><div className="row-actions">
                  <button className="ia" title="แก้ไขข้อมูล" onClick={()=>setEdit(d)}><i className="fa-solid fa-pen"></i></button>
                  <button className="ia danger" title="ลบใบส่งของ" onClick={()=>remove(d)}><i className="fa-solid fa-trash"></i></button>
                </div></td>}
              </tr>
            ))}
            {filtered.length===0 && (<tr><td colSpan={canEdit?8:7}><div className="empty">
              <i className="fa-solid fa-file-export"></i>
              <div className="t">ยังไม่มีใบส่งของ</div>
              <div>กดปุ่ม "ย้ายโครงการ / ออกใบส่งของ" ด้านบนเพื่อเริ่มต้น</div>
            </div></td></tr>)}
          </tbody>
        </table>
      </div>
    </div>
    {view && <DeliveryOrderView doc={view} onClose={()=>setView(null)} onEdit={canEdit?(d)=>{setView(null);setEdit(d);}:null}/>}
    {edit && <DeliveryOrderEdit doc={edit} onClose={()=>setEdit(null)} onSave={saveEdit}/>}
    {transferOpen && <TransferAssetsModal user={user} onClose={()=>setTransferOpen(false)} onSaved={()=>{ setTransferOpen(false); setRows(null); }}/>}
    </>
  );
}

function DeliveryOrderView({doc,onClose,onEdit}){
  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className="fa-solid fa-file-export" style={{color:"var(--primary)",marginRight:8}}></i>ใบส่งของ <span className="ticket-id" style={{marginLeft:6}}>{doc.docNo||doc.key}</span></>}
      footer={<>
        <button className="btn btn-ghost" onClick={onClose}>ปิด</button>
        {onEdit && <button className="btn btn-ghost" onClick={()=>onEdit(doc)} style={{color:"#1E40AF"}}><i className="fa-solid fa-pen"></i> แก้ไขข้อมูล</button>}
        <button className="btn btn-primary" onClick={()=>window.downloadDeliveryOrderPdf(doc)}><i className="fa-solid fa-file-pdf"></i> ดาวน์โหลด PDF</button>
      </>}>
      <div className="detail-grid" style={{marginBottom:14}}>
        <div><div className="k">วันที่</div><div className="v">{doc.docDate || window.__DATA.fmtDate(doc.when)}</div></div>
        <div><div className="k">จากโครงการ</div><div className="v">{doc.fromProjectLabel||"—"}</div></div>
        <div><div className="k">ไปยังโครงการ</div><div className="v"><ProjectLabel name={doc.toProject}/></div></div>
        <div><div className="k">ผู้ส่งมอบ</div><div className="v">{doc.sender||"—"}</div></div>
        <div><div className="k">ผู้รับมอบ</div><div className="v">{doc.receiver||"—"}</div></div>
        <div><div className="k">บันทึกโดย</div><div className="v">{doc.by||"—"}</div></div>
      </div>
      {doc.note && <div style={{marginBottom:14,fontSize:13,background:"#F8FAFC",border:"1px solid var(--line)",borderRadius:8,padding:"10px 12px"}}>{doc.note}</div>}
      <div className="table-wrap">
        <table className="data" style={{fontSize:13}}>
          <thead><tr><th>รหัส</th><th>รายการ</th><th>จำนวน</th><th>จากโครงการ</th></tr></thead>
          <tbody>
            {(doc.items||[]).map((it,i)=>(
              <tr key={i}>
                <td>{it.assetCode ? <span className="ticket-id">{it.assetCode}</span> : <span style={{color:"var(--muted)",fontSize:12}}>ไม่มีรหัส</span>}</td>
                <td>{it.name}{it.partial && <span style={{color:"#B45309",fontSize:11,marginLeft:6}}>(แบ่งย้ายจาก {it.totalBefore})</span>}</td>
                <td style={{whiteSpace:"nowrap"}}>{(Number(it.quantity)||0).toLocaleString("th-TH")} {it.unit||""}</td>
                <td style={{color:"var(--muted)"}}>{it.from||"—"}</td>
              </tr>
            ))}

}

function DeliveryOrderEdit({doc,onClose,onSave}){
  const toDateStr = (d)=>{ if(!d) return ""; if(/^\d{4}-\d{2}-\d{2}/.test(String(d))) return String(d).slice(0,10); const dt=new Date(d); return isNaN(dt)?"":dt.toISOString().slice(0,10); };
  const [f,setF] = React.useState({
    docNo: doc.docNo||"",
    docDate: toDateStr(doc.docDate || doc.when),
    fromProjectLabel: doc.fromProjectLabel||"",
    toProject: doc.toProject||"",
    sender: doc.sender||"",
    receiver: doc.receiver||"",
    note: doc.note||"",
  });
  const [items,setItems] = React.useState(()=>(doc.items||[]).map(it=>({...it})));
  const [saving,setSaving] = React.useState(false);
  const set = (k,v)=>setF(prev=>({...prev,[k]:v}));
  const setItem = (i,k,v)=>setItems(prev=>prev.map((it,idx)=>idx===i?{...it,[k]:v}:it));

  const submit = async () => {
    if(!String(f.docNo||"").trim()){ Swal.fire({icon:"warning",title:"กรุณากรอกเลขที่ใบส่งของ"}); return; }
    const patch = {
      docNo: f.docNo.trim(),
      docDate: f.docDate,
      fromProjectLabel: f.fromProjectLabel,
      toProject: f.toProject,
      sender: f.sender,
      receiver: f.receiver,
      note: f.note,
      items: items.map(it=>({...it, name: it.name, quantity: Number(it.quantity)||0, unit: it.unit||""})),
    };
    const changedQty = (doc.items||[]).some((oi,i)=>(Number(oi.quantity)||0)!==(Number((items[i]||{}).quantity)||0));
    if(changedQty){
      const { isConfirmed } = await Swal.fire({
        title:"ยืนยันปรับสต๊อกตามจำนวนใหม่?",
        text:"ระบบจะย้ายส่วนต่างของจำนวนระหว่างโครงการต้นทางและปลายทางให้ตรงกับใบส่งของ",
        icon:"question", showCancelButton:true, confirmButtonText:"ใช่, บันทึกและปรับสต๊อก", cancelButtonText:"ยกเลิก", confirmButtonColor:"#1E40AF"
      });
      if(!isConfirmed) return;
    }
    setSaving(true);
    try{
      await onSave(doc, patch);
    }catch(e){
      Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:e.message});
      setSaving(false);
    }
  };

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className="fa-solid fa-pen" style={{color:"var(--primary)",marginRight:8}}></i>แก้ไขใบส่งของ <span className="ticket-id" style={{marginLeft:6}}>{doc.docNo||doc.key}</span></>}
      footer={<>
        <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit} disabled={saving}><i className="fa-solid fa-floppy-disk"></i> {saving?"กำลังบันทึก...":"บันทึกการแก้ไข"}</button>
      </>}>
      <div className="form-grid">
        <div className="form-field"><label>เลขที่ใบส่งของ</label><input value={f.docNo} onChange={e=>set("docNo",e.target.value)} /></div>
        <div className="form-field"><label>วันที่</label><input type="date" value={f.docDate} onChange={e=>set("docDate",e.target.value)} /></div>
        <div className="form-field"><label>จากโครงการ</label><input value={f.fromProjectLabel} onChange={e=>set("fromProjectLabel",e.target.value)} placeholder="เช่น [PRJ-A1] โรงงาน A" /></div>
        <div className="form-field"><label>ไปยังโครงการ</label><input value={f.toProject} onChange={e=>set("toProject",e.target.value)} /></div>
        <div className="form-field"><label>ผู้ส่งมอบ</label><input value={f.sender} onChange={e=>set("sender",e.target.value)} /></div>
        <div className="form-field"><label>ผู้รับมอบ</label><input value={f.receiver} onChange={e=>set("receiver",e.target.value)} /></div>
        <div className="form-field full"><label>หมายเหตุ</label><textarea className="inp" rows={2} value={f.note} onChange={e=>set("note",e.target.value)} /></div>
      </div>
      <div style={{marginTop:16,fontWeight:500,fontSize:14,display:"flex",alignItems:"center",gap:8}}>
        <i className="fa-solid fa-boxes-stacked" style={{color:"var(--primary)"}}></i>รายการในใบส่งของ ({items.length})
      </div>
      <div className="hint" style={{margin:"4px 0 10px",color:"#B45309"}}><i className="fa-solid fa-triangle-exclamation" style={{marginRight:5}}></i>การแก้ "จำนวน" จะปรับสต๊อกทรัพย์สินตามส่วนต่าง (ย้ายเพิ่ม/คืนระหว่างต้นทาง-ปลายทาง) และบันทึกลงประวัติการย้าย · จับคู่ด้วยรหัสทรัพย์สิน รายการที่ไม่มีรหัสจะปรับสต๊อกให้ไม่ได้</div>
      <div className="table-wrap">
        <table className="data" style={{fontSize:13}}>
          <thead><tr><th>รหัส</th><th>รายการ</th><th style={{width:110}}>จำนวน</th><th style={{width:110}}>หน่วย</th></tr></thead>
          <tbody>
            {items.map((it,i)=>(
              <tr key={i}>
                <td style={{whiteSpace:"nowrap"}}>{it.assetCode ? <span className="ticket-id">{it.assetCode}</span> : <span style={{color:"var(--muted)",fontSize:12}}>ไม่มีรหัส</span>}</td>
                <td><input className="inp" value={it.name||""} onChange={e=>setItem(i,"name",e.target.value)} /></td>
                <td><input className="inp" type="number" min="0" value={it.quantity} onChange={e=>setItem(i,"quantity",e.target.value)} /></td>
                <td><input className="inp" value={it.unit||""} onChange={e=>setItem(i,"unit",e.target.value)} placeholder="เช่น ชิ้น" /></td>
              </tr>
            ))}
            {items.length===0 && (<tr><td colSpan="4"><div className="empty" style={{padding:20}}><div className="t" style={{fontSize:13}}>ไม่มีรายการ</div></div></td></tr>)}
          </tbody>
        </table>
      </div>
    </Modal>
  );
}

<script type="text/babel">
function WorkspacePicker({user,onContinue,onLogout}){
  const erpSystems = window.__DATA.erpSystems || [];
  const projects = window.userProjects(user);
  const [step,setStep] = React.useState("system");
  const [erpId,setErpId] = React.useState("");
  const [project,setProject] = React.useState("");
  const selected = erpSystems.find(x=>x.id===erpId);
  const readySystems = erpSystems.filter(x=>window.canUseErp(user,x));
  const inProject = (item, projectName) => !projectName || !item?.project || item.project === projectName;
  const rowsForSystem = (sys, projectName="") => {
    const id = sys?.id;
    let rows = [];
    if(id==="repairs") rows = window.__DATA.repairs||[];
    else if(id==="assets") rows = window.__DATA.machines||[];
    else if(id==="consume") rows = window.__DATA.withdrawals||[];
    else if(id==="hr-time") return window.__DATA.users||[];
    else return [];
    if(projectName) return rows.filter(x=>inProject(x, projectName));
    return window.filterByUserProjects(user, rows, "project");
  };
  const linkedStats = (projectName="") => ({
    repairs:(window.__DATA.repairs||[]).filter(x=>inProject(x, projectName)).length,
    assets:(window.__DATA.machines||[]).filter(x=>inProject(x, projectName)).length,
    users:(window.__DATA.users||[]).length,
    withdrawals:(window.__DATA.withdrawals||[]).filter(x=>inProject(x, projectName)).length,
  });
  const systemLine = (sys) => {
    const stats = linkedStats("");
    if(sys.id==="repairs") return `${stats.repairs} ใบงาน · เชื่อม Asset ${stats.assets} รายการ`;
    if(sys.id==="assets") return `${stats.assets} รายการ · เชื่อมงานซ่อม ${stats.repairs} ใบงาน`;
    if(sys.id==="production") return `เตรียมเชื่อม Asset ${stats.assets} รายการ`;
    if(sys.id==="consume") return `เตรียมเชื่อมสต๊อก/เบิกจ่าย ${stats.withdrawals} รายการ`;
    if(sys.id==="pc") return `เตรียมเชื่อมผู้ใช้งาน ${stats.users} คน`;
    if(sys.id==="hr-time") return `เชื่อมข้อมูลผู้ใช้งาน ${stats.users} คน`;
    return "พร้อมเชื่อมข้อมูล";
  };
  const optionCount = (projectName) => selected ? rowsForSystem(selected, projectName).length : 0;
  const projectOptions = [{value:"",label:`ดูจัดการทั้งหมด${selected ? ` (${optionCount("")} รายการ)` : ""}`}].concat(
    projects.map(p=>({value:p,label:`${p}${selected ? ` (${optionCount(p)} รายการ)` : ""}`}))
  );
  const selectedProjectLabel = projectOptions.find(p=>p.value===project)?.label || "ดูจัดการทั้งหมด";
  const currentStats = linkedStats(project);

  const submit = (e) => {
    e.preventDefault();
    if(!selected || !window.canUseErp(user,selected)){
      Swal.fire({icon:"warning",title:"กรุณาเลือกระบบงานที่พร้อมใช้งาน"});
      return;
    }
    onContinue({erp:selected, project, projectLabel:selectedProjectLabel});
  };

  const selectSystem = (sys) => {
    if(!window.canUseErp(user,sys)){
      if(sys.status==="ready") Swal.fire({icon:"info",title:"ไม่มีสิทธิ์เข้าใช้ระบบนี้",text:`${sys.name} เปิดใช้เฉพาะ ${(sys.roles||[]).join(" / ")}`});
      else Swal.fire({icon:"info",title:"ระบบนี้รอพัฒนา",text:sys.name});
      return;
    }
    setErpId(sys.id);
    setStep("project");
  };

  return (
    <div className="login-wrap">
      <div className="login-brand">
        <div className="grid-bg"></div>
        <div className="login-logo">
          <div className="mark"><i className="fa-solid fa-layer-group"></i></div>
          <div style={{lineHeight:1.3}}>
            <div>ศูนย์ระบบงาน</div>
            <div style={{fontSize:12,fontWeight:300,color:"rgba(255,255,255,.6)",marginTop:2}}>เลือกงานและโครงการ</div>
          </div>
        </div>
        <div className="login-hero">
          <h1>{step==="system" ? "เลือกระบบงาน" : "เลือกโครงการ"}<br/>ก่อนเข้าใช้งาน</h1>
          <p>{step==="system" ? "เลือกว่าจะเข้าใช้งานระบบใด รายการที่รอพัฒนาจะแสดงไว้เพื่อเตรียมต่อยอดในอนาคต" : "เลือกโครงการที่ต้องการทำงาน หรือเลือกดูจัดการทั้งหมดตามสิทธิ์ของบัญชีนี้"}</p>
          <div className="chips">
            <span className="chip"><i className="fa-solid fa-user-check" style={{marginRight:6}}></i>{user.name}</span>
            <span className="chip"><i className="fa-solid fa-shield-halved" style={{marginRight:6}}></i>{user.role}</span>
            {selected && <span className="chip"><i className={`fa-solid ${selected.icon}`} style={{marginRight:6}}></i>{selected.name}</span>}
          </div>
        </div>
        <div className="login-foot">Repair Management System</div>
      </div>
      <div className="login-card-wrap">
        <form className="login-card" onSubmit={submit}>
          {step==="system" ? (
            <>
              <h2>เลือกระบบงาน</h2>
              <p className="sub">ระบบที่พร้อมใช้งานเลือกต่อได้ทันที</p>
              <div style={{display:"grid",gap:10,marginBottom:16}}>
                {erpSystems.map(s=>{
                  const ready = window.canUseErp(user,s);
                  const restricted = !ready && s.status==="ready";
                  return (
                    <button key={s.id} type="button" onClick={()=>selectSystem(s)}
                      style={{display:"flex",alignItems:"center",gap:12,textAlign:"left",padding:"13px 14px",border:"1.5px solid var(--line)",borderRadius:10,background:ready?"#fff":"#F8FAFC",color:ready?"var(--text)":"var(--muted)",opacity:ready?1:.75}}>
                      <span style={{width:38,height:38,borderRadius:10,display:"grid",placeItems:"center",background:ready?"var(--accent-soft)":"var(--line-soft)",color:ready?"var(--primary)":"var(--muted)",flex:"0 0 auto"}}>
                        <i className={`fa-solid ${s.icon}`}></i>
                      </span>
                      <span style={{flex:1,minWidth:0}}>
                        <span style={{display:"flex",alignItems:"center",gap:8,fontWeight:600}}>
                          {s.name}
                          {restricted
                            ? <span className="badge" style={{fontSize:11,background:"#E0E7FF",color:"#3730A3"}}>เฉพาะ {(s.roles||[]).join(" / ")}</span>
                            : !ready && <span className="badge" style={{fontSize:11,background:"#FEF3C7",color:"#92400E"}}>รอพัฒนา</span>}
                        </span>
                        <span style={{display:"block",fontSize:12.5,color:"var(--muted)",marginTop:2}}>{s.desc}</span>
                        <span style={{display:"block",fontSize:12,color:ready?"var(--primary)":"var(--muted)",marginTop:4}}>
                          <i className="fa-solid fa-link" style={{marginRight:5}}></i>{systemLine(s)}
                        </span>
                      </span>
                      {ready && <i className="fa-solid fa-chevron-right" style={{color:"var(--muted)"}}></i>}
                    </button>
                  );
                })}
              </div>
              {readySystems.length===0 && <div style={{fontSize:13,color:"var(--danger)",marginBottom:14}}>ยังไม่มีระบบที่พร้อมใช้งาน</div>}
            </>
          ) : (
            <>
              <button type="button" className="btn btn-ghost" onClick={()=>setStep("system")} style={{marginBottom:14}}>
                <i className="fa-solid fa-arrow-left"></i> กลับไปเลือกระบบงาน
              </button>
              <h2>{selected?.name || "เลือกระบบงาน"}</h2>
              <p className="sub">เลือกโครงการที่จะเข้าใช้งาน หรือดูจัดการทั้งหมด</p>
              <div className="field">
                <label>โครงการ</label>
                <i className="fa-solid fa-diagram-project"></i>
                <select value={project} onChange={e=>setProject(e.target.value)} style={{width:"100%",padding:"13px 14px 13px 42px",border:"1.5px solid var(--line)",borderRadius:10,background:"#fff",outline:"none"}}>
                  {projectOptions.map(p=><option key={p.value || "__all"} value={p.value}>{p.label}</option>)}
                </select>
              </div>
              {projects.length===0 && <div style={{fontSize:13,color:"var(--muted)",marginBottom:14}}>ไม่มีโครงการแยกในระบบ จะเข้าเป็นมุมมองจัดการทั้งหมด</div>}
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8,margin:"0 0 14px"}}>
                {[
                  {label:"งานซ่อม",value:currentStats.repairs,icon:"fa-screwdriver-wrench"},
                  {label:"Asset",value:currentStats.assets,icon:"fa-boxes-stacked"},
                  {label:"ผู้ใช้งาน",value:currentStats.users,icon:"fa-users"},
                ].map(x=>(
                  <div key={x.label} style={{border:"1px solid var(--line)",borderRadius:10,padding:"10px 11px",background:"#fff"}}>
                    <div style={{fontSize:12,color:"var(--muted)",display:"flex",alignItems:"center",gap:6}}><i className={`fa-solid ${x.icon}`}></i>{x.label}</div>
                    <div style={{fontSize:20,fontWeight:700,marginTop:2}}>{x.value.toLocaleString("th-TH")}</div>
                  </div>
                ))}
              </div>
              <button className="login-btn" type="submit"><i className="fa-solid fa-arrow-right-to-bracket"></i> เข้าใช้งาน</button>
            </>
          )}
          <button className="btn btn-ghost" type="button" onClick={onLogout} style={{width:"100%",marginTop:10}}>ออกจากระบบ</button>
        </form>
      </div>
    </div>
  );
}

function App(){
  const [user,setUser] = React.useState(null);
  const [workspace,setWorkspace] = React.useState(null);
  const [page,setPage] = React.useState("dashboard");
  const [sbOpen,setSbOpen] = React.useState(false);
  const [booting,setBooting] = React.useState(true);
  const [bootErr,setBootErr] = React.useState(null);

  React.useEffect(()=>{
    (async()=>{
      try{
        await window.__DATA.bootstrap();
        setBooting(false);
      }catch(err){
        setBootErr(err.message||String(err));
        setBooting(false);
      }
    })();
  },[]);

  React.useEffect(()=>{
    if(booting) return;
    const s = localStorage.getItem("rms_user");
    if(s){
      try{
        const u = JSON.parse(s);
        const fresh = window.__DATA.users.find(x=>x.id===u.id);
        if(fresh) {
          setUser(fresh);
          const ws = localStorage.getItem("rms_workspace");
          if(ws) {
            const parsed = JSON.parse(ws);
            // สิทธิ์อาจถูกเปลี่ยนหลังบันทึก workspace ไว้ — ตรวจซ้ำก่อนเข้าใช้งาน
            const erp = (window.__DATA.erpSystems||[]).find(x=>x.id===parsed.erp?.id) || parsed.erp;
            if(window.canUseErp(fresh, erp)){
              window.__DATA.activeErp = erp;
              window.__DATA.activeProject = parsed.project;
              setWorkspace({...parsed, erp});
            }else{
              localStorage.removeItem("rms_workspace");
            }
          }
        }
      }catch(e){}
    }
  },[booting]);

  const login = (u) => {
    setUser(u); localStorage.setItem("rms_user",JSON.stringify(u));
    setWorkspace(null); localStorage.removeItem("rms_workspace");
    setPage(["Admin","Officer","Director"].includes(u.role) ? "dashboard" : u.role==="Technician" ? "dashboard" : "r-dashboard");
  };
  const enterWorkspace = (ws) => {
    window.__DATA.activeErp = ws.erp;
    window.__DATA.activeProject = ws.project;
    setWorkspace(ws);
    localStorage.setItem("rms_workspace", JSON.stringify(ws));
    if(ws.erp?.startPage) {
      setPage(ws.erp.startPage);
    } else {
      setPage(["Admin","Officer","Director"].includes(user.role) ? "dashboard" : user.role==="Technician" ? "dashboard" : "r-dashboard");
    }
  };
  const clearWorkspace = () => {
    window.__DATA.activeErp = null;
    window.__DATA.activeProject = "";
    setWorkspace(null);
    localStorage.removeItem("rms_workspace");
  };
  const logout = () => {
    Swal.fire({title:"ออกจากระบบ?",icon:"question",showCancelButton:true,confirmButtonText:"ออกจากระบบ",cancelButtonText:"ยกเลิก",confirmButtonColor:"#EF4444"}).then(r=>{
      if(r.isConfirmed){
        setUser(null);
        setWorkspace(null);
        localStorage.removeItem("rms_user");
        localStorage.removeItem("rms_workspace");
        window.__DATA.activeErp = null;
        window.__DATA.activeProject = "";
      }
    });
  };

  if(booting) return <div style={{display:"grid",placeItems:"center",minHeight:"100vh",gap:14,background:"var(--bg)",fontFamily:"Kanit"}}>
    <div className="spinner" style={{width:40,height:40,borderWidth:4}}></div>
    <div style={{color:"var(--muted)"}}>กำลังเชื่อมต่อ Firebase...</div>
  </div>;

  if(bootErr) return <div style={{display:"grid",placeItems:"center",minHeight:"100vh",padding:20,background:"var(--bg)"}}>
    <div className="card" style={{maxWidth:520,padding:28,textAlign:"center"}}>
      <i className="fa-solid fa-triangle-exclamation" style={{fontSize:36,color:"var(--danger)",marginBottom:10}}></i>
      <h3 style={{margin:"0 0 6px"}}>เชื่อมต่อ Firebase ไม่สำเร็จ</h3>
      <div style={{color:"var(--muted)",fontSize:13,marginBottom:14,wordBreak:"break-word"}}>{bootErr}</div>
      <div style={{color:"var(--muted)",fontSize:12.5,textAlign:"left",background:"#FAFBFC",border:"1px solid var(--line)",borderRadius:10,padding:14}}>
        <div style={{fontWeight:500,color:"var(--text)",marginBottom:6}}>ตรวจสอบ:</div>
        1. ไปที่ Firebase Console → Realtime Database → <strong>Rules</strong><br/>
        2. ตั้งค่า <span className="mono">{'"'.repeat(1)}.read{'"'.repeat(1)}: true, {'"'.repeat(1)}.write{'"'.repeat(1)}: true</span><br/>
        3. กด Publish แล้วโหลดหน้าใหม่
      </div>
      <button className="btn btn-primary" style={{marginTop:14}} onClick={()=>location.reload()}><i className="fa-solid fa-rotate"></i> ลองใหม่</button>
    </div>
  </div>;

  if(!user) return <Login onLogin={login}/>;
  if(!workspace) return <WorkspacePicker user={user} onContinue={enterWorkspace} onLogout={()=>{setUser(null);setWorkspace(null);localStorage.removeItem("rms_user");localStorage.removeItem("rms_workspace");window.__DATA.activeErp=null;window.__DATA.activeProject="";}}/>;

  const activeUser = {...user, activeErp:workspace.erp, activeProject:workspace.project};
  const systemId = workspace.erp?.id || "repairs";
  const allowedPages = systemId==="assets"
    ? ["machines","asset-registry","asset-do","doc-pj2","transfer-history","projects"]
    : systemId==="consume"
      ? ["withdrawals"]
      : ["dashboard","repairs","machines","users","categories","login-logs","r-dashboard","r-new","r-mine"];
  const safePage = allowedPages.includes(page) ? page : (workspace.erp?.startPage || allowedPages[0]);

  const pageTitles = {
    "dashboard":{t:"แดชบอร์ด",c:"ภาพรวมและสถิติงานซ่อม"},
    "repairs":{t:"รายการแจ้งซ่อม",c:"จัดการและติดตามงานซ่อมทั้งหมด"},
    "users":{t:"จัดการผู้ใช้งาน",c:"Users · เพิ่ม / แก้ไข / ลบ"},
    "categories":{t:"จัดการหมวดหมู่งาน",c:"Categories · เพิ่ม / แก้ไข / ลบ"},
    "machines":{t:"ทะเบียนเครื่องจักร",c:"Machines · ข้อมูลจาก Firebase"},
    "asset-registry":{t:"ทะเบียนทรัพย์สิน",c:"Asset Registry · ข้อมูลจาก Firebase panamanee-3a15a"},
    "asset-do":{t:"ใบส่งของ (DO)",c:"Delivery Order · บันทึกการย้ายทรัพย์สินระหว่างโครงการ"},
    "withdrawals":{t:"รายการเบิกของ",c:"ERP Withdrawal · ใบขอเบิก/ขอสั่งซื้อ 24 แถวต่อหน้า"},
    "doc-pj2":{t:"ปจ2 - เอกสารรับรองการตรวจสอบและทดสอบ",c:"ลิงค์ไฟล์เอกสารตามรายการเครื่องจักร"},
    "transfer-history":{t:"ประวัติการย้ายเครื่องจักร",c:"บันทึกการย้ายโครงการของเครื่องจักรทั้งหมด"},
    "login-logs":{t:"ประวัติการล็อกอิน",c:"บันทึกการเข้าสู่ระบบของผู้ใช้ทั้งหมด · เฉพาะ Admin"},
    "projects":{t:"โครงการ",c:"Projects · จัดการข้อมูลโครงการทั้งหมด"},
    "r-dashboard":{t:"แดชบอร์ด",c:"สรุปงานแจ้งซ่อมของฉัน"},
    "r-new":{t:"แจ้งซ่อมใหม่",c:"กรอกแบบฟอร์มแจ้งซ่อม"},
    "r-mine":{t:"ติดตามสถานะ",c:"รายการแจ้งซ่อมของฉัน"},
  };
  const pt = pageTitles[safePage] || pageTitles.dashboard;

  const renderPage = () => {
    if(safePage==="dashboard") return <Dashboard user={activeUser} goTo={setPage}/>;
    if(safePage==="repairs") return <Repairs user={activeUser}/>;
    if(safePage==="users") return <Users user={activeUser}/>;
    if(safePage==="categories") return <Categories user={activeUser}/>;
    if(safePage==="machines") return <Machines user={activeUser}/>;
    if(safePage==="asset-registry") return <AssetRegistry user={activeUser}/>;
    if(safePage==="asset-do") return <DeliveryOrders user={activeUser}/>;
    if(safePage==="withdrawals") return user.role==="Admin" ? <Withdrawals user={activeUser}/> : null;
    if(safePage==="doc-pj2") return <DocPJ2 user={activeUser}/>;
    if(safePage==="transfer-history") return <MachineTransferHistory user={activeUser}/>;
    if(safePage==="login-logs") return user.role==="Admin" ? <LoginLogs /> : null;
    if(safePage==="projects") return <Projects user={activeUser}/>;
    if(safePage==="r-dashboard") return <ReporterDashboard user={activeUser} goTo={setPage}/>;
    if(safePage==="r-new") return <NewRequest user={activeUser} goTo={setPage}/>;
    if(safePage==="r-mine") return <MyRepairs user={activeUser}/>;
    return null;
  };

  return (
    <div className="shell">
      <button className="sidebar-toggle" onClick={()=>setSbOpen(true)}><i className="fa-solid fa-bars"></i></button>
      <Sidebar user={activeUser} active={safePage} onNav={setPage} onLogout={logout} open={sbOpen} onClose={()=>setSbOpen(false)}/>
      <main className="main">
        <div className="topbar">
          <div className="title"><h1>{pt.t}</h1><div className="crumb">{pt.c}</div></div>
          <div className="actions">
            <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหาทั้งระบบ..."/></div>
            <button className="btn btn-ghost" title={`${workspace.erp?.name || "ระบบงาน"} · ${workspace.projectLabel || workspace.project || "ดูจัดการทั้งหมด"}`} onClick={clearWorkspace} style={{maxWidth:320,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              <i className={`fa-solid ${workspace.erp?.icon || "fa-layer-group"}`}></i> {workspace.erp?.name || "ระบบงาน"} · {workspace.projectLabel || workspace.project || "ดูจัดการทั้งหมด"}
            </button>
            {(safePage==="repairs" && systemId==="repairs" && ["Admin","Officer","Engineer"].includes(user.role)) && (
              <button className="btn btn-primary" onClick={()=>setPage("r-new")}><i className="fa-solid fa-plus"></i> แจ้งซ่อมใหม่</button>
            )}
          </div>
        </div>
        {renderPage()}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
