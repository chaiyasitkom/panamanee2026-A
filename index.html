            <div style={{marginTop:14}}>
              <div style={{fontSize:12,fontWeight:500,color:"#7C3AED",textTransform:"uppercase",letterSpacing:".05em",marginBottom:8}}><i className="fa-solid fa-right-left" style={{marginRight:6}}></i>ประวัติการย้ายโครงการ ({m.transferHistory.length})</div>
              <datalist id="tr-projects">{projectNames.map(n=>(<option key={n} value={n} />))}</datalist>
              <div style={{display:"grid",gap:6}}>
                {[...m.transferHistory].reverse().map((t,i)=>{
                  const actualIdx = m.transferHistory.length-1-i;
                  const isEditing = editTrIdx===actualIdx;
                  return (
                    <div key={i} style={{display:"flex",gap:10,padding:"10px 12px",background:"#F5F3FF",border:`1px solid ${isEditing?"#A78BFA":"#DDD6FE"}`,borderRadius:8,fontSize:13}}>
                      <div style={{color:"#7C3AED",marginTop:1,flexShrink:0}}><i className="fa-solid fa-circle-arrow-right"></i></div>
                      <div style={{flex:1,minWidth:0}}>
                        {isEditing ? (
                          <div style={{display:"grid",gap:8}}>
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                              <div>
                                <div style={trLabelSt}>จากโครงการ</div>
                                <input list="tr-projects" value={editTrForm.from} onChange={e=>setEditTrForm(p=>({...p,from:e.target.value}))} placeholder="ไม่ระบุ" style={trInputSt} />
                              </div>
                              <div>
                                <div style={trLabelSt}>ไปโครงการ *</div>
                                <input list="tr-projects" value={editTrForm.to} onChange={e=>setEditTrForm(p=>({...p,to:e.target.value}))} placeholder="โครงการปลายทาง" style={trInputSt} />
                              </div>
                              <div>
                                <div style={trLabelSt}>วันที่ย้าย</div>
                                <input type="date" value={editTrForm.when} onChange={e=>setEditTrForm(p=>({...p,when:e.target.value}))} style={trInputSt} />
                              </div>
                              <div>
                                <div style={trLabelSt}>ผู้บันทึก</div>
                                <input value={editTrForm.by} onChange={e=>setEditTrForm(p=>({...p,by:e.target.value}))} placeholder="ชื่อผู้บันทึก" style={trInputSt} />
                              </div>
                            </div>
                            <div>
                              <div style={trLabelSt}>หมายเหตุ</div>
                              <textarea rows="2" value={editTrForm.note} onChange={e=>setEditTrForm(p=>({...p,note:e.target.value}))} placeholder="เหตุผลการย้าย..." style={{...trInputSt,resize:"vertical"}}></textarea>
                            </div>
                            {actualIdx===m.transferHistory.length-1 && editTrForm.to.trim() && editTrForm.to.trim()!==m.project && (
                              <div style={{fontSize:11,color:"#B45309",background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:6,padding:"5px 8px"}}>
                                <i className="fa-solid fa-triangle-exclamation"></i> รายการล่าสุด — บันทึกแล้วโครงการปัจจุบันของเครื่องจักรจะเปลี่ยนเป็น <strong>{editTrForm.to.trim()}</strong>
                              </div>
                            )}
                            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                              <button onClick={saveTransferEntry} disabled={savingTr} style={{padding:"4px 12px",background:"#7C3AED",color:"#fff",border:"none",borderRadius:5,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}><i className="fa-solid fa-floppy-disk"></i> {savingTr?"กำลังบันทึก...":"บันทึก"}</button>
                              <button onClick={()=>{setEditTrIdx(null);setEditTrForm(null);}} disabled={savingTr} style={{padding:"4px 10px",background:"none",border:"1px solid #DDD6FE",borderRadius:5,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>ยกเลิก</button>
                              <div style={{flex:1}}></div>
                              <button onClick={()=>deleteTransferEntry(actualIdx,t)} disabled={savingTr} style={{padding:"4px 10px",background:"none",border:"1px solid #FECACA",color:"#DC2626",borderRadius:5,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}><i className="fa-solid fa-trash"></i> ลบรายการนี้</button>
                            </div>
                          </div>
                        ) : (
                          <>
                            <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                              <span style={{color:"#6D28D9",fontWeight:500}}>{t.from||"ไม่ระบุ"}</span>
                              <i className="fa-solid fa-arrow-right" style={{fontSize:10,color:"var(--muted)"}}></i>
                              <span style={{color:"#1E40AF",fontWeight:600}}>{t.to}</span>
                            </div>
                            {t.note && <div style={{color:"#4B5563",marginTop:3,fontSize:12}}>{t.note}</div>}
                            <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3,flexWrap:"wrap"}}>
                              <span style={{color:"var(--muted)",fontSize:11}}>{window.__DATA.fmtDate(t.when)} · {t.by}</span>
                              {t.editedAt && <span style={{color:"var(--muted)",fontSize:10,fontStyle:"italic"}} title={`แก้ไขโดย ${t.editedBy} เมื่อ ${window.__DATA.fmtDate(t.editedAt)}`}><i className="fa-solid fa-pen-to-square"></i> แก้ไขแล้ว</span>}
                              {canEdit && <button onClick={()=>startEditTransfer(actualIdx,t)} title="แก้ไขรายการนี้" style={{padding:"1px 6px",background:"none",border:"1px solid #DDD6FE",borderRadius:4,fontSize:10,cursor:"pointer",color:"#7C3AED",lineHeight:1.6}}><i className="fa-solid fa-pen"></i></button>}
                              {canEdit && <button onClick={()=>deleteTransferEntry(actualIdx,t)} title="ลบรายการนี้" style={{padding:"1px 6px",background:"none",border:"1px solid #FECACA",borderRadius:4,fontSize:10,cursor:"pointer",color:"#DC2626",lineHeight:1.6}}><i className="fa-solid fa-trash"></i></button>}
                            </div>
                          </>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      </div>
      <div style={{borderTop:"1px dashed var(--line)",paddingTop:16}}>
        <div style={{fontWeight:500,marginBottom:10,fontSize:14}}><i className="fa-solid fa-clock-rotate-left" style={{color:"var(--primary)",marginRight:6}}></i>ประวัติการแจ้งซ่อม ({relatedRows.length})</div>
        {relatedRows.length>0 ? (
          <table className="data" style={{border:"1px solid var(--line)",borderRadius:8}}>
            <thead><tr><th>เลขที่</th><th>วันที่</th><th>อาการ</th><th>สถานะ</th>{canEdit&&<th>จัดการ</th>}</tr></thead>
            <tbody>
              {relatedRows.map(r=>(
                <tr key={r.id} style={{cursor:"pointer"}}>
                  <td onClick={()=>setViewRepair(r)}><span className="ticket-id" style={{display:"inline-flex",alignItems:"center",gap:5}}>{r.running}<i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:9,opacity:.5}}></i></span></td>
                  <td onClick={()=>setViewRepair(r)} style={{color:"var(--muted)"}}>{window.__DATA.fmtDate(r.createdAt)}</td>
                  <td onClick={()=>setViewRepair(r)} style={{fontSize:13}}>{r.title}</td>
                  <td onClick={()=>setViewRepair(r)}><Badge status={r.status}/></td>
                  {canEdit&&<td><button className="ia" title="แก้ไขข้อมูล" onClick={e=>{e.stopPropagation();setEditRepair(r);}} style={{color:"#1E40AF"}}><i className="fa-solid fa-user-pen"></i></button></td>}
                </tr>
              ))}
            </tbody>
          </table>
        ) : <div style={{color:"var(--muted)",fontSize:13,padding:"12px 0"}}>ยังไม่มีประวัติการซ่อม</div>}
      </div>
    </Modal>
    {viewRepair && <window.RepairDetail r={viewRepair} user={user} onClose={()=>setViewRepair(null)} onQuick={null} onEdit={canEdit?(r)=>{setViewRepair(null);setEditRepair(r);}:null} onEditParts={null}/>}
    {editRepair && <window.EditRepairModal r={editRepair} onClose={()=>setEditRepair(null)} onSave={saveEdit}/>}
    {transferModal && <TransferMachineModal m={m} onClose={()=>setTransferModal(false)} onSave={(payload)=>{setTransferModal(false);onTransfer(payload);}}/>}
    </>
  );
}
window.Machines = Machines;
</script>

<script type="text/babel">
function WithdrawalLogo(){
  return (
    <svg className="paper-logo" viewBox="0 0 180 210" aria-label="Panamanee logo">
      <path d="M107 24A70 70 0 1 0 77 158" fill="none" stroke="#155E95" strokeWidth="18" strokeLinecap="butt"/>
      <path d="M127 47a70 70 0 0 1 0 86" fill="none" stroke="#F28A23" strokeWidth="18" strokeLinecap="butt"/>
      <path d="M42 130c25-53 61-67 107-63-25 16-40 34-47 59 17-8 32-19 46-36-12 50-50 74-104 78 15-12 26-25 35-41-13 2-25 3-37 3z" fill="#155E95"/>
      <path d="M57 147c20-24 45-39 78-48-12 22-18 43-17 69-19-18-37-24-61-21z" fill="#7BC043"/>
      <path d="M83 83l72-7-47 52 2-29-49 40z" fill="#fff"/>
      <text x="90" y="188" textAnchor="middle" fontFamily="Tahoma,Arial,sans-serif" fontSize="14" fontWeight="700" fill="#155E95">บริษัท พานามณี จำกัด</text>
      <text x="90" y="204" textAnchor="middle" fontFamily="Tahoma,Arial,sans-serif" fontSize="12" fill="#155E95">Panamanee Co., Ltd</text>
    </svg>
  );
}

function WithdrawalPaperPreview({doc,items}){
  const clean = v => String(v ?? "").trim();
  const formatThaiDate = (value) => {
    if(!value) return "";
    const d = new Date(value);
    if(isNaN(d)) return value;
    return d.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"});
  };
  const rows = (items || []).map((x,i)=>({no:i+1,name:clean(x.name),qty:clean(x.qty),unit:clean(x.unit),remark:clean(x.remark)})).filter(x=>x.name||x.qty||x.unit||x.remark);
  while(rows.length < 24) rows.push({no:rows.length+1,name:"",qty:"",unit:"",remark:""});
  return (
    <div className="withdrawal-paper-wrap">
      <div className="withdrawal-paper">
        <div className="paper-head">
          <div><WithdrawalLogo/></div>
          <div className="paper-title-block">
            <div className="company">บริษัท พานามณี จำกัด</div>
            <div className="doc-title">ใบขอเบิก/ขอสั่งซื้อ</div>
          </div>
          <div></div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
          <div className="paper-meta-row">เลขที่ใบเบิก <span className="paper-line">{doc.docNo || ""}</span></div>
          <div className="paper-meta-row">วันที่ <span className="paper-line">{formatThaiDate(doc.docDate)}</span></div>
        </div>
        <div className="paper-meta-row full">หน่วยงาน <span className="paper-line">{doc.department || doc.project || ""}</span></div>
        <table className="item-table">
          <thead>
            <tr><th rowSpan="2" style={{width:"8%"}}>ลำดับ</th><th rowSpan="2" style={{width:"28%"}}>รายการ</th><th colSpan="2" style={{width:"18%"}}>จำนวนเบิก/ขอสั่งซื้อ</th><th rowSpan="2" style={{width:"12%"}}>ยอดคงเหลือ</th><th rowSpan="2" style={{width:"12%"}}>วันที่เบิกล่าสุด</th><th rowSpan="2" style={{width:"8%"}}>ราคา</th><th rowSpan="2" style={{width:"9%"}}>จำนวนเงิน</th><th rowSpan="2">หมายเหตุ</th></tr>
            <tr><th>จำนวน</th><th>หน่วยนับ</th></tr>
          </thead>
          <tbody>{rows.map(item=><tr key={item.no}><td>{item.no}</td><td className="item-name">{item.name}</td><td>{item.qty}</td><td>{item.unit}</td><td>-</td><td>-</td><td>-</td><td>-</td><td>{item.remark}</td></tr>)}</tbody>
        </table>
        <div className="sign-grid"><div><div className="sign-line"></div><div>ผู้ขอเบิก/ขอสั่งซื้อ</div></div><div><div className="sign-line"></div><div>ผู้ตรวจสอบ</div></div><div><div className="sign-line"></div><div>ผู้อนุมัติ</div></div></div>
      </div>
    </div>
  );
}

function Withdrawals({user}){
  const canEdit = ["Admin","Officer","Director","Engineer"].includes(user.role);
  const [rows,setRows] = React.useState(()=>window.__DATA.withdrawals || []);
  const [q,setQ] = React.useState("");
  const [edit,setEdit] = React.useState(null);
  const clean = v => String(v ?? "").trim();
  const safeKey = v => (clean(v) || `WD-${Date.now()}`).replace(/[.#$/\[\]]/g,"-").replace(/\s+/g,"-");
  const parseItems = (doc) => Array.isArray(doc.items) ? doc.items : [];
  const logoSvg = `<svg width="31mm" height="36mm" viewBox="0 0 180 210" xmlns="http://www.w3.org/2000/svg"><path d="M107 24A70 70 0 1 0 77 158" fill="none" stroke="#155E95" stroke-width="18"/><path d="M127 47a70 70 0 0 1 0 86" fill="none" stroke="#F28A23" stroke-width="18"/><path d="M42 130c25-53 61-67 107-63-25 16-40 34-47 59 17-8 32-19 46-36-12 50-50 74-104 78 15-12 26-25 35-41-13 2-25 3-37 3z" fill="#155E95"/><path d="M57 147c20-24 45-39 78-48-12 22-18 43-17 69-19-18-37-24-61-21z" fill="#7BC043"/><path d="M83 83l72-7-47 52 2-29-49 40z" fill="#fff"/><text x="90" y="188" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="14" font-weight="700" fill="#155E95">บริษัท พานามณี จำกัด</text><text x="90" y="204" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="12" fill="#155E95">Panamanee Co., Ltd</text></svg>`;
  const buildPdfHtml = (doc) => {
    const fmt = v => { const d = new Date(v); return v && !isNaN(d) ? d.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"}) : (v||""); };
    const items = parseItems(doc).map((x,i)=>({...x,no:i+1}));
    while(items.length < 24) items.push({no:items.length+1,name:"",qty:"",unit:"",remark:""});
    const trs = items.map(item=>`<tr><td>${item.no}</td><td style="text-align:left;padding-left:8px">${item.name||""}</td><td>${item.qty||""}</td><td>${item.unit||""}</td><td>-</td><td>-</td><td>-</td><td>-</td><td style="text-align:left">${item.remark||""}</td></tr>`).join("");
    return `<div style="font-family:'TH Sarabun PSK','TH Sarabun New','Sarabun','Kanit',Arial,sans-serif;color:#000;width:210mm;min-height:297mm;padding:21mm 9mm 12mm;background:#fff;box-sizing:border-box;position:relative"><style>table.wd{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;margin-top:40px}table.wd th,table.wd td{border:1px solid #000;padding:1px 4px;height:24px;line-height:1.05;text-align:center;vertical-align:middle}table.wd th{background:#F3A26E;font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden}</style><div style="display:grid;grid-template-columns:38mm 1fr 50mm;gap:5mm;align-items:start;margin-bottom:6mm;position:relative;min-height:32mm"><div>${logoSvg}</div><div style="position:absolute;left:50%;top:2mm;transform:translateX(-50%);width:90mm;text-align:center"><div style="font-size:25px;font-weight:400">บริษัท พานามณี จำกัด</div><div style="font-size:24px;font-weight:400;margin-top:1mm">ใบขอเบิก/ขอสั่งซื้อ</div></div><div></div></div><div style="display:flex;justify-content:space-between;align-items:flex-end;font-size:18px;font-weight:400;margin-bottom:7mm"><div>เลขที่ใบเบิก <span style="border-bottom:1px dotted #000;display:inline-block;min-width:34mm;text-align:center">${doc.docNo||""}</span></div><div>วันที่ <span style="border-bottom:1px dotted #000;display:inline-block;min-width:36mm;text-align:center">${fmt(doc.docDate)}</span></div></div><div style="display:flex;align-items:flex-end;gap:2mm;font-size:18px;font-weight:400;margin-bottom:10mm"><span>หน่วยงาน</span><span style="border-bottom:1px dotted #000;display:inline-block;flex:1;padding-left:4mm">${doc.department||doc.project||""}</span></div><table class="wd"><thead><tr><th rowspan="2" style="width:11mm">ลำดับ</th><th rowspan="2" style="width:53mm">รายการ</th><th colspan="2" style="width:34mm">จำนวนเบิก/ขอสั่งซื้อ</th><th rowspan="2" style="width:21mm">ยอดคงเหลือ</th><th rowspan="2" style="width:22mm">วันที่เบิกล่าสุด</th><th rowspan="2" style="width:15mm">ราคา</th><th rowspan="2" style="width:18mm">จำนวนเงิน</th><th rowspan="2">หมายเหตุ</th></tr><tr><th>จำนวน</th><th>หน่วยนับ</th></tr></thead><tbody>${trs}</tbody></table><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12mm;margin-top:7mm;font-size:17px;text-align:center"><div><div style="height:10mm;border-bottom:1px dotted #000"></div><div style="margin-top:2mm">ผู้ขอเบิก/ขอสั่งซื้อ</div></div><div><div style="height:10mm;border-bottom:1px dotted #000"></div><div style="margin-top:2mm">ผู้ตรวจสอบ</div></div><div><div style="height:10mm;border-bottom:1px dotted #000"></div><div style="margin-top:2mm">ผู้อนุมัติ</div></div></div></div>`;
  };
  const pdfName = doc => `${clean(doc.docNo||"withdrawal").replace(/[\\/:*?"<>|]/g,"-")}.pdf`;
  const downloadPdf = async (doc) => {
    if(!window.html2pdf){ Swal.fire({icon:"error",title:"ไม่พบตัวสร้าง PDF"}); return; }
    const el = document.createElement("div"); el.innerHTML = buildPdfHtml(doc); document.body.appendChild(el);
    try{ await html2pdf().set({margin:0,filename:pdfName(doc),image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(el.firstElementChild).save(); }
    finally{ el.remove(); }
  };
  const save = async (form) => {
    const key = form.key || safeKey(form.docNo);
    const saved = await window.api("upsertWithdrawal",{key,doc:{...form,id:form.docNo||key}});
    const upd = rows.some(x=>x.key===saved.key) ? rows.map(x=>x.key===saved.key?saved:x) : [saved,...rows];
    setRows(upd); window.__DATA.withdrawals = upd; setEdit(null);
    Swal.fire({icon:"success",title:"บันทึกรายการเบิกแล้ว",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
  };
  const remove = (doc) => Swal.fire({title:"ลบรายการเบิก?",icon:"warning",showCancelButton:true,confirmButtonText:"ลบ",cancelButtonText:"ยกเลิก",confirmButtonColor:"#EF4444"}).then(async r=>{ if(!r.isConfirmed) return; await window.api("deleteWithdrawal",{key:doc.key}); const upd=rows.filter(x=>x.key!==doc.key); setRows(upd); window.__DATA.withdrawals=upd; });
  const filtered = rows.filter(x=>!q || [x.docNo,x.docDate,x.project,x.department,x.requester].join(" ").toLowerCase().includes(q.toLowerCase()));
  return <><div className="card"><div className="filters"><div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหาเลขที่ใบเบิก / โครงการ / หน่วยงาน..." /></div><div className="spacer"></div>{canEdit&&<button className="btn btn-primary" onClick={()=>setEdit({docNo:"",docDate:window.__DATA.fmtDate(new Date()),project:"",department:"",requester:"",items:[{name:"",qty:"",unit:"",remark:""}],note:""})}><i className="fa-solid fa-plus"></i> เพิ่มรายการเบิก</button>}</div><div className="table-wrap"><table className="data"><thead><tr><th>เลขที่</th><th>วันที่</th><th>หน่วยงาน/โครงการ</th><th>ผู้เบิก</th><th>รายการ</th><th>PDF</th><th></th></tr></thead><tbody>{filtered.map(doc=><tr key={doc.key||doc.docNo}><td><span className="ticket-id">{doc.docNo||"-"}</span></td><td>{doc.docDate||"-"}</td><td>{doc.department||doc.project||"-"}</td><td>{doc.requester||"-"}</td><td>{parseItems(doc).length.toLocaleString("th-TH")}</td><td><button className="btn btn-sm btn-ghost" onClick={()=>downloadPdf(doc)}><i className="fa-solid fa-file-pdf"></i> PDF</button></td><td>{canEdit&&<div className="row-actions"><button className="ia" onClick={()=>setEdit(doc)}><i className="fa-solid fa-pen"></i></button><button className="ia danger" onClick={()=>remove(doc)}><i className="fa-solid fa-trash"></i></button></div>}</td></tr>)}{filtered.length===0&&<tr><td colSpan="7"><div className="empty"><i className="fa-solid fa-file-invoice"></i><div className="t">ยังไม่มีรายการเบิกของ</div><div>กดเพิ่มรายการเบิกเพื่อเริ่มต้น</div></div></td></tr>}</tbody></table></div></div>{edit&&<WithdrawalForm initial={edit} onClose={()=>setEdit(null)} onSave={save}/>}</>;
}

function WithdrawalForm({initial,onClose,onSave}){
  const [f,setF] = React.useState(initial);
  const [items,setItems] = React.useState(()=>Array.isArray(initial.items)&&initial.items.length?initial.items:[{name:"",qty:"",unit:"",remark:""}]);
  const up = (k,v)=>setF(p=>({...p,[k]:v}));
  const upItem = (i,k,v)=>setItems(prev=>prev.map((x,idx)=>idx===i?{...x,[k]:v}:x));
  const addItem = ()=>setItems(prev=>[...prev,{name:"",qty:"",unit:"",remark:""}]);
  const removeItem = i=>setItems(prev=>prev.length<=1?[{name:"",qty:"",unit:"",remark:""}]:prev.filter((_,idx)=>idx!==i));
  const cleanItems = items.map(x=>({name:String(x.name||"").trim(),qty:String(x.qty||"").trim(),unit:String(x.unit||"").trim(),remark:String(x.remark||"").trim()})).filter(x=>x.name||x.qty||x.unit||x.remark);
  const submit = e => { e.preventDefault(); if(!String(f.docNo||"").trim()){ Swal.fire({icon:"warning",title:"กรอกเลขที่ใบเบิกก่อน"}); return; } if(!cleanItems.length){ Swal.fire({icon:"warning",title:"เพิ่มรายการอย่างน้อย 1 รายการ"}); return; } onSave({...f,items:cleanItems}); };
  return <Modal open={true} onClose={onClose} size="xl" title={<><i className="fa-solid fa-file-invoice" style={{marginRight:8,color:"var(--primary)"}}></i>{f.key?"แก้ไขรายการเบิก":"เพิ่มรายการเบิก"}</>} footer={<><button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button><button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-floppy-disk"></i> บันทึก</button></>}><form onSubmit={submit}><div className="form-grid"><div className="form-field"><label>เลขที่ใบเบิก *</label><input value={f.docNo||""} onChange={e=>up("docNo",e.target.value)} placeholder="PN-202604-017" /></div><div className="form-field"><label>วันที่</label><input type="date" value={f.docDate||""} onChange={e=>up("docDate",e.target.value)} /></div><div className="form-field"><label>ผู้เบิก</label><input value={f.requester||""} onChange={e=>up("requester",e.target.value)} /></div><div className="form-field"><label>หน่วยงาน</label><input value={f.department||""} onChange={e=>up("department",e.target.value)} /></div><div className="form-field" style={{gridColumn:"1/-1"}}><label>โครงการ</label><input value={f.project||""} onChange={e=>up("project",e.target.value)} /></div><div className="form-field" style={{gridColumn:"1/-1"}}><label>รายการเบิก</label><div className="table-wrap" style={{border:"1px solid var(--line)",borderRadius:10,overflow:"hidden"}}><table className="data"><thead><tr><th style={{width:44}}>#</th><th>ชื่อรายการ</th><th style={{width:120}}>จำนวน</th><th style={{width:120}}>หน่วย</th><th>หมายเหตุ</th><th style={{width:48}}></th></tr></thead><tbody>{items.map((item,idx)=><tr key={idx}><td style={{textAlign:"center"}}>{idx+1}</td><td><input value={item.name||""} onChange={e=>upItem(idx,"name",e.target.value)} /></td><td><input value={item.qty||""} onChange={e=>upItem(idx,"qty",e.target.value)} /></td><td><input value={item.unit||""} onChange={e=>upItem(idx,"unit",e.target.value)} /></td><td><input value={item.remark||""} onChange={e=>upItem(idx,"remark",e.target.value)} /></td><td><button type="button" className="ia danger" onClick={()=>removeItem(idx)}><i className="fa-solid fa-trash"></i></button></td></tr>)}</tbody></table></div><button type="button" className="btn btn-ghost btn-sm" style={{marginTop:10}} onClick={addItem}><i className="fa-solid fa-plus"></i> เพิ่มแถวรายการ</button></div><div className="form-field" style={{gridColumn:"1/-1"}}><label>หมายเหตุ</label><textarea rows="3" value={f.note||""} onChange={e=>up("note",e.target.value)}></textarea></div></div><div className="withdrawal-preview-title"><span><i className="fa-solid fa-file-lines" style={{color:"var(--primary)",marginRight:8}}></i>แบบฟอร์มใบเบิกที่จะออกเป็น PDF</span><span style={{fontSize:12,color:"var(--muted)",fontWeight:400}}>24 แถวต่อหน้า</span></div><WithdrawalPaperPreview doc={f} items={items}/></form></Modal>;
}

function DocPJ2({user}){
  const [rows,setRows] = React.useState(()=>window.filterByUserProjects(user,window.__DATA.machines,"project"));
  const [q,setQ] = React.useState("");
  const [filterProj,setFilterProj] = React.useState("all");
  const [editCell,setEditCell] = React.useState(null); // {id,field,value}
  const [uploading,setUploading] = React.useState(null); // machineId:slot
  const canEdit = ["Admin","Officer","Engineer"].includes(user.role);
  const today = React.useMemo(()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; },[]);
  const toDateStr = (d) => { try{ return new Date(d).toISOString().slice(0,10); }catch(e){ return ""; } };

  const fileToUpload = (file) => new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || "");
      resolve({
        name: file.name,
        mimeType: file.type || "application/octet-stream",
        data: dataUrl.includes(",") ? dataUrl.split(",").pop() : dataUrl,
      });
    };
    reader.onerror = () => reject(reader.error || new Error("อ่านไฟล์ไม่สำเร็จ"));
    reader.readAsDataURL(file);
  });

  const uploadDoc = async (m, slot, file) => {
    if(!file) return;
    const field = slot==="PL" ? "driveLinkPL" : (slot===2 ? "driveLink2" : "driveLink1");
    const key = `${m.id}:${slot}`;
    setUploading(key);
    try{
      const upload = await fileToUpload(file);
      const saved = await window.api("uploadPJ2Document",{machineId:m.id,machineCode:m.code,slot,upload});
      const patch = {[field]:saved.url};
      await window.api("updateMachine",{id:m.id,patch});
      const upd = rows.map(x=>x.id===m.id?{...x,...patch}:x);
      setRows(upd);
      window.__DATA.machines = window.__DATA.machines.map(x=>x.id===m.id?{...x,...patch}:x);
      if(saved.sharing && saved.sharing.ok===false){
        Swal.fire({icon:"warning",title:"อัปโหลดสำเร็จ แต่แชร์ลิงก์ไม่ได้",text:"ไฟล์ถูกบันทึกใน Drive แล้ว แต่บัญชี Google/Workspace ไม่อนุญาตให้แชร์ Anyone with link",confirmButtonColor:"#1E40AF"});
      } else {
        Swal.fire({icon:"success",title:"อัปโหลดเอกสารสำเร็จ",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
      }
    }catch(err){
      Swal.fire({icon:"error",title:"อัปโหลดไม่สำเร็จ",text:err.message});
    }finally{
      setUploading(null);
    }
  };

  const projects = React.useMemo(()=>[...new Set(rows.map(m=>m.project).filter(Boolean))].sort(),[rows]);
  const filtered = React.useMemo(()=>rows.filter(m=>{
    if(filterProj!=="all" && m.project!==filterProj) return false;
    if(q){ const qq=q.toLowerCase(); if(!([m.code,m.name,m.project,m.serial].map(x=>(x||"").toLowerCase()).join(" ").includes(qq))) return false; }
    return true;
  }).sort((a,b)=>{
    const da = a.nextInspectionDate ? new Date(a.nextInspectionDate) : null;
    const db = b.nextInspectionDate ? new Date(b.nextInspectionDate) : null;
    if(!da && !db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return da - db;
  }),[rows,q,filterProj]);

  const saveDate = async () => {
    if(!editCell) return;
    const {id,field,value} = editCell;
    try{
      await window.api("updateMachine",{id,patch:{[field]:value}});
      const upd = rows.map(m=>m.id===id?{...m,[field]:value}:m);
      setRows(upd); window.__DATA.machines=window.__DATA.machines.map(m=>m.id===id?{...m,[field]:value}:m);
      setEditCell(null);
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const nextDateColor = (val) => {
    if(!val) return null;
    const d=new Date(val); d.setHours(0,0,0,0);
    const diff=Math.floor((d-today)/(1000*60*60*24));
    if(diff<0) return "#EF4444";
    if(diff<=30) return "#F59E0B";
    return "#10B981";
  };

  const renderDateCell = (m,field) => {
    const val = m[field]||"";
    const isEditing = editCell&&editCell.id===m.id&&editCell.field===field;
    const color = field==="nextInspectionDate"?nextDateColor(val):null;
    if(isEditing) return (
      <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
        <input type="date" value={editCell.value} onChange={e=>setEditCell(ec=>({...ec,value:e.target.value}))}
          style={{padding:"3px 7px",border:"1px solid var(--primary)",borderRadius:6,fontSize:12,fontFamily:"Kanit"}} autoFocus/>
        <button onClick={saveDate} style={{padding:"3px 10px",background:"var(--primary)",color:"#fff",border:"none",borderRadius:6,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>บันทึก</button>
        <button onClick={()=>setEditCell(null)} style={{padding:"3px 8px",background:"none",border:"1px solid var(--line)",borderRadius:6,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>ยกเลิก</button>
      </div>
    );
    return (
      <div style={{display:"flex",alignItems:"center",gap:5}}>
        {val ? (
          <span style={{fontSize:12,fontWeight:color?"600":"400",color:color?color:"inherit",background:color?color+"18":"transparent",padding:color?"2px 7px":"0",borderRadius:5,display:"inline-flex",alignItems:"center",gap:4}}>
            {window.__DATA.fmtDate(val)}
            {color==="#EF4444"&&<span style={{fontSize:10}}>⚠ เกินกำหนด</span>}
            {color==="#F59E0B"&&<span style={{fontSize:10}}>ใกล้ถึงกำหนด</span>}
          </span>
        ) : <span style={{color:"var(--muted)",fontSize:12}}>—</span>}
        {canEdit&&<button onClick={()=>setEditCell({id:m.id,field,value:val||toDateStr(new Date())})}
          style={{padding:"1px 5px",background:"none",border:"1px solid var(--line)",borderRadius:4,fontSize:10,cursor:"pointer",color:"var(--muted)"}}>
          <i className={`fa-solid ${val?"fa-pen":"fa-plus"}`}></i>
        </button>}
      </div>
    );
  };

  const linkBtn = (m, slot) => {
    const url = slot==="PL" ? m.driveLinkPL : (slot===2 ? m.driveLink2 : m.driveLink1);
    const key = `${m.id}:${slot}`;
    return (
      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
        {url
          ? <a href={url} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:6,background:"#EFF6FF",border:"1px solid #BFDBFE",color:"#1E40AF",fontSize:12,textDecoration:"none",whiteSpace:"nowrap"}}><i className="fa-brands fa-google-drive" style={{color:"#4285F4"}}></i>เปิดไฟล์<i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:9,opacity:.6}}></i></a>
          : <span style={{color:"var(--muted)"}}>—</span>}
        {canEdit && (
          <label className="btn btn-sm btn-ghost" style={{padding:"4px 8px",fontSize:12,cursor:uploading?"not-allowed":"pointer",opacity:uploading&&uploading!==key ? .7 : 1}}>
            {uploading===key ? <><span className="spinner" style={{width:12,height:12,borderWidth:2}}></span> อัปโหลด...</> : <><i className="fa-solid fa-upload"></i> อัปโหลด</>}
            <input type="file" style={{display:"none"}} disabled={!!uploading} onChange={e=>{ const file=e.target.files&&e.target.files[0]; e.target.value=""; uploadDoc(m,slot,file); }} />
          </label>
        )}
      </div>
    );
  };

  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา รหัส / ชื่อ / ซีเรียล..." value={q} onChange={e=>setQ(e.target.value)}/></div>
        <select value={filterProj} onChange={e=>setFilterProj(e.target.value)}>
          <option value="all">ทุกโครงการ</option>
          {projects.map(p=>(<option key={p} value={p}>{p}</option>))}
        </select>
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>{filtered.length} / {rows.length} รายการ</div>
      </div>
      <div style={{padding:"8px 16px",borderBottom:"1px solid var(--line)",background:"#FAFBFC",display:"flex",gap:16,flexWrap:"wrap",fontSize:12,color:"var(--muted)"}}>
        <span style={{fontWeight:500,color:"var(--text)"}}>หมายเหตุ:</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:"50%",background:"#10B981",display:"inline-block"}}></span>เขียว — ยังไม่ถึงกำหนด (&gt;30 วัน)</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:"50%",background:"#F59E0B",display:"inline-block"}}></span>เหลือง — ใกล้ถึงกำหนด (≤30 วัน)</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:"50%",background:"#EF4444",display:"inline-block"}}></span>แดง — เกินกำหนดแล้ว ⚠</span>
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr>
            <th>รหัส</th>
            <th>เอกสาร (1)</th>
            <th>เอกสาร (2)</th>
            <th>PL (ประกัน)</th>
            <th>ชื่อเครื่องจักร</th>
            <th className="hide-on-mobile">โครงการ</th>
            <th>วันที่ตรวจสอบ</th>
            <th>วันที่ตรวจสอบครั้งถัดไป</th>
          </tr></thead>
          <tbody>
            {filtered.map(m=>(
              <tr key={m.id}>
                <td>
                  <div className="mono" style={{fontSize:12,fontWeight:600}}>{m.code||"—"}</div>
                  {m.serial && <div className="mono" style={{fontSize:11,color:"var(--muted)",marginTop:3}}>SN: {m.serial}</div>}
                </td>
                <td>{linkBtn(m,1)}</td>
                <td>{linkBtn(m,2)}</td>
                <td>{linkBtn(m,"PL")}</td>
                <td><div style={{fontWeight:500,fontSize:13}}>{m.name}</div>{m.brand&&<div style={{fontSize:11,color:"var(--muted)"}}>{m.brand}{m.model?` ${m.model}`:""}</div>}</td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{m.project||"—"}</td>
                <td>{renderDateCell(m,"inspectionDate")}</td>
                <td>{renderDateCell(m,"nextInspectionDate")}</td>
              </tr>
            ))}
            {filtered.length===0&&(<tr><td colSpan="8"><div className="empty"><i className="fa-solid fa-file-circle-xmark"></i><div className="t">ไม่พบข้อมูล</div><div>ลองเปลี่ยนเงื่อนไขการค้นหา</div></div></td></tr>)}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function LoginLogs(){
  const [logs, setLogs] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [err, setErr] = React.useState(null);
  const [q, setQ] = React.useState("");
  const [filterRole, setFilterRole] = React.useState("all");
  const [filterUser, setFilterUser] = React.useState("all");

  const fetchLogs = () => {
    setLoading(true); setErr(null);
    window.api("getLoginLogs").then(r=>{
      setLogs(r.logs||[]);
      setLoading(false);
    }).catch(e=>{
      setErr(e.message||"โหลดข้อมูลไม่สำเร็จ");
      setLoading(false);
    });
  };

  React.useEffect(()=>{ fetchLogs(); },[]);

  const roleColor = {"Admin":"#7C3AED","Officer":"#1D4ED8","Engineer":"#0369A1","Technician":"#047857","Director":"#B45309","Reporter":"#64748B"};

  const todayStr = new Date().toISOString().slice(0,10);
  const todayLogs = logs.filter(l=>(l.when||"").slice(0,10)===todayStr);
  const uniqueToday = new Set(todayLogs.map(l=>l.userId)).size;

  const userNames = React.useMemo(()=>[...new Set(logs.map(l=>l.username).filter(Boolean))].sort(),[logs]);
  const roles = React.useMemo(()=>[...new Set(logs.map(l=>l.role).filter(Boolean))].sort(),[logs]);

  const filtered = React.useMemo(()=>logs.filter(l=>{
    if(filterRole!=="all" && l.role!==filterRole) return false;
    if(filterUser!=="all" && l.username!==filterUser) return false;
    if(q){
      const qq=q.toLowerCase();
      if(![l.username,l.name,l.role,l.dept].map(x=>(x||"").toLowerCase()).join(" ").includes(qq)) return false;
    }
    return true;
  }),[logs,q,filterRole,filterUser]);

  const fmtWhen = (iso) => {
    if(!iso) return "—";
    const d = new Date(iso);
    const date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const time = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
    return `${date} ${time}`;
  };

  const stats = [
    {label:"ล็อกอินทั้งหมด",val:logs.length,icon:"fa-clock-rotate-left",color:"#3B82F6"},
    {label:"ล็อกอินวันนี้",val:todayLogs.length,icon:"fa-calendar-day",color:"#10B981"},
    {label:"ผู้ใช้ที่ active วันนี้",val:uniqueToday,icon:"fa-user-check",color:"#8B5CF6"},
    {label:"ผู้ใช้ทั้งหมด",val:userNames.length,icon:"fa-users",color:"#F59E0B"},
  ];

  return (
    <>
    <div className="stat-grid" style={{marginBottom:18}}>
      {stats.map((s,i)=>(<div className="stat" key={i}><div className="ic" style={{background:s.color+"1a",color:s.color}}><i className={`fa-solid ${s.icon}`}></i></div><div className="label">{s.label}</div><div className="val">{s.val}</div></div>))}
    </div>
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา ชื่อ / Username / แผนก..." value={q} onChange={e=>setQ(e.target.value)}/></div>
        <select value={filterUser} onChange={e=>setFilterUser(e.target.value)}>
          <option value="all">ทุก Username</option>
          {userNames.map(u=>(<option key={u} value={u}>{u}</option>))}
        </select>
        <select value={filterRole} onChange={e=>setFilterRole(e.target.value)}>
          <option value="all">ทุก Role</option>
          {roles.map(r=>(<option key={r} value={r}>{r}</option>))}
        </select>
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>{filtered.length} / {logs.length} รายการ</div>
        <button className="btn btn-ghost" onClick={fetchLogs} disabled={loading} title="โหลดใหม่">
          <i className={`fa-solid fa-rotate${loading?" fa-spin":""}`}></i>
        </button>
      </div>
      {loading ? (
        <div style={{display:"grid",placeItems:"center",padding:60,gap:12}}>
          <div className="spinner" style={{width:32,height:32,borderWidth:3}}></div>
          <div style={{color:"var(--muted)",fontSize:13}}>กำลังโหลด...</div>
        </div>
      ) : err ? (
        <div style={{padding:32,textAlign:"center"}}>
          <i className="fa-solid fa-triangle-exclamation" style={{fontSize:32,color:"var(--danger)",marginBottom:10,display:"block"}}></i>
          <div style={{fontWeight:500,marginBottom:6}}>โหลดข้อมูลไม่สำเร็จ</div>
          <div style={{fontSize:13,color:"var(--muted)",marginBottom:14}}>{err}</div>
          <button className="btn btn-primary" onClick={fetchLogs}><i className="fa-solid fa-rotate"></i> ลองใหม่</button>
        </div>
      ) : logs.length===0 ? (
        <div style={{padding:40,textAlign:"center"}}>
          <i className="fa-solid fa-clock-rotate-left" style={{fontSize:36,color:"var(--muted)",marginBottom:12,display:"block"}}></i>
          <div style={{fontWeight:600,fontSize:15,marginBottom:6}}>ยังไม่มีประวัติการล็อกอิน</div>
          <div style={{fontSize:13,color:"var(--muted)",marginBottom:4}}>ระบบเพิ่งเปิดใช้งานฟีเจอร์นี้</div>
          <div style={{fontSize:13,color:"var(--muted)"}}>Log จะเริ่มบันทึกเมื่อ user แต่ละคน <strong>ออกจากระบบแล้วล็อกอินใหม่</strong></div>
        </div>
      ) : (
        <div className="table-wrap">
          <table className="data">
            <thead><tr>
              <th style={{width:36}}>#</th>
              <th>เวลาที่ล็อกอิน</th>
              <th>ชื่อ-สกุล</th>
              <th>Username</th>
              <th>Role</th>
              <th>แผนก</th>
            </tr></thead>
            <tbody>
              {filtered.map((l,i)=>{
                const rc = roleColor[l.role]||"#64748B";
                const isToday = (l.when||"").slice(0,10)===todayStr;
                return (
                  <tr key={l.id||i} style={isToday?{background:"#F0FDF4"}:{}}>
                    <td style={{color:"var(--muted)",fontSize:11,textAlign:"center"}}>{i+1}</td>
                    <td>
                      <div style={{fontFamily:"JetBrains Mono,monospace",fontSize:12,fontWeight:isToday?600:400,color:isToday?"#065F46":"var(--text)"}}>
                        {fmtWhen(l.when)}
                      </div>
                      {isToday&&<div style={{fontSize:10,color:"#10B981",fontWeight:500,marginTop:1}}>● วันนี้</div>}
                    </td>
                    <td><div style={{fontWeight:500,fontSize:13}}>{l.name||"—"}</div></td>
                    <td><span className="mono" style={{fontSize:12,padding:"2px 7px",background:"#F1F5F9",borderRadius:5}}>{l.username||"—"}</span></td>
                    <td><span style={{padding:"2px 9px",borderRadius:999,fontSize:11,fontWeight:600,background:rc+"18",color:rc}}>{l.role||"—"}</span></td>
                    <td style={{fontSize:13,color:"var(--muted)"}}>{l.dept||"—"}</td>
                  </tr>
                );
              })}
              {filtered.length===0&&(<tr><td colSpan="6"><div className="empty"><i className="fa-solid fa-magnifying-glass"></i><div className="t">ไม่พบข้อมูลที่ค้นหา</div><div>ลองเปลี่ยนเงื่อนไขการค้นหา</div></div></td></tr>)}
            </tbody>
          </table>
        </div>
      )}
    </div>
    </>
  );
}

function MachineTransferHistory({user}){
  const allTransfers = React.useMemo(()=>{
    const visible = window.filterByUserProjects(user, window.__DATA.machines, "project");
    const list=[];
    visible.forEach(m=>{
      (m.transferHistory||[]).forEach(t=>list.push({...t,machineCode:m.code,machineName:m.name,currentProject:m.project}));
    });
    return list.sort((a,b)=>new Date(b.when)-new Date(a.when));
  },[user]);
  const [q,setQ] = React.useState("");
  const [filterProj,setFilterProj] = React.useState("all");
  const projects = React.useMemo(()=>{
    const s=new Set(); allTransfers.forEach(t=>{if(t.from)s.add(t.from);if(t.to)s.add(t.to);}); return [...s].sort();
  },[allTransfers]);
  const filtered = React.useMemo(()=>allTransfers.filter(t=>{
    if(filterProj!=="all" && t.from!==filterProj && t.to!==filterProj) return false;
    if(q){ const qq=q.toLowerCase(); if(!([t.machineCode,t.machineName,t.from,t.to,t.by,t.note].map(x=>(x||"").toLowerCase()).join(" ").includes(qq))) return false; }
    return true;
  }),[allTransfers,q,filterProj]);
  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา รหัส / ชื่อ / โครงการ..." value={q} onChange={e=>setQ(e.target.value)}/></div>
        <select value={filterProj} onChange={e=>setFilterProj(e.target.value)}>
          <option value="all">ทุกโครงการ</option>
          {projects.map(p=>(<option key={p} value={p}>{p}</option>))}
        </select>
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>{filtered.length} รายการ</div>
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr><th>วันที่ย้าย</th><th>รหัส</th><th>ชื่อเครื่องจักร</th><th>จากโครงการ</th><th style={{width:24}}></th><th>ไปโครงการ</th><th className="hide-on-mobile">โดย</th><th className="hide-on-mobile">เหตุผล</th></tr></thead>
          <tbody>
            {filtered.map((t,i)=>(
              <tr key={i}>
                <td style={{color:"var(--muted)",whiteSpace:"nowrap",fontSize:13}}>{window.__DATA.fmtDate(t.when)}</td>
                <td><span className="mono" style={{fontSize:12}}>{t.machineCode||"—"}</span></td>
                <td style={{fontWeight:500,fontSize:13}}>{t.machineName||"—"}</td>
                <td><span style={{background:"#F5F3FF",color:"#6D28D9",padding:"2px 8px",borderRadius:5,fontSize:12,fontWeight:500}}>{t.from||"ไม่ระบุ"}</span></td>
                <td style={{textAlign:"center"}}><i className="fa-solid fa-arrow-right" style={{color:"var(--muted)",fontSize:11}}></i></td>
                <td><span style={{background:"#EFF6FF",color:"#1E40AF",padding:"2px 8px",borderRadius:5,fontSize:12,fontWeight:600}}>{t.to}</span></td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{t.by||"—"}</td>
                <td className="hide-on-mobile" style={{fontSize:12,color:"#4B5563",maxWidth:200}}>{t.note||"—"}</td>
              </tr>
            ))}
            {filtered.length===0&&(<tr><td colSpan="8"><div className="empty"><i className="fa-solid fa-right-left"></i><div className="t">ไม่พบประวัติการย้าย</div><div>ยังไม่มีการย้ายเครื่องจักรระหว่างโครงการ</div></div></td></tr>)}
          </tbody>
        </table>
      </div>
    </div>
  );
}
</script>


<script type="text/babel">

function NewRequest({user,goTo}){
  const allProjects = React.useMemo(()=>{
    return window.userProjects(user);
  },[user]);

  const initProject = window.getActiveProject(user)||"";
  const todayStr = (()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
  const [f,setF] = React.useState({title:"",categoryId:"",project:initProject,machineCode:"",siteId:"",reportDate:todayStr,placeMode:"onsite",placeOnsite:initProject,placeOther:""});
  const [loading,setLoading] = React.useState(false);

  const projectMachines = React.useMemo(()=>{ if(!f.project) return []; return (window.__DATA.machines||[]).filter(m=>m.project===f.project); },[f.project]);
  const filteredMachines = React.useMemo(()=>{ if(!f.categoryId) return projectMachines; return projectMachines.filter(m=>m.categoryId===f.categoryId); },[projectMachines,f.categoryId]);
  const projectCategories = React.useMemo(()=>{ const ids=new Set(projectMachines.map(m=>m.categoryId).filter(Boolean)); return (window.__DATA.categories||[]).filter(c=>ids.has(c.id)); },[projectMachines]);

  // เปลี่ยนโครงการ → เติมชื่อโครงการลงช่อง "ส่งช่างซ่อมหน้างาน ที่" ให้ (ถ้าผู้ใช้ยังไม่ได้แก้เอง)
  const onProjectChange = (p) => setF(prev=>({...prev,project:p,categoryId:"",machineCode:"",placeOnsite:(!prev.placeOnsite||prev.placeOnsite===prev.project)?p:prev.placeOnsite}));
  const onCategoryChange = (cid) => setF(prev=>({...prev,categoryId:cid,machineCode:""}));

  const submit = async () => {
    if(!f.project){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาเลือกโครงการ/หน่วยงานก่อน"}); return; }
    if(!f.categoryId){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาเลือกหมวดหมู่"}); return; }
    const title = (f.title||"").split("\n").map(s=>s.trim()).filter(Boolean).join("\n");
    if(!title){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาระบุอาการ/ปัญหาอย่างน้อย 1 รายการ"}); return; }
    setLoading(true);
    try{
      const repairPlace = {
        mode: f.placeMode,
        onsite: f.placeMode==="onsite" ? (f.placeOnsite||f.project) : "",
        other:  f.placeMode==="other"  ? f.placeOther : "",
        reportAt: "", note: "",
      };
      const createdAt = f.reportDate ? new Date(f.reportDate+"T00:00:00").toISOString() : undefined;
      const repair = {siteId:f.siteId,title,desc:"",problems:title.split("\n").filter(Boolean).map(t=>({text:t,status:"new"})),project:f.project,categoryId:f.categoryId,status:"new",reporterId:user.id,reporterName:user.name,assignedId:"",cost:"",machineCode:f.machineCode,repairPlace,createdAt};
      const saved = await window.api("createRepair",{repair});
      saved.createdAt = new Date(saved.createdAt);
      saved.timeline = [{status:"new",when:new Date(),by:user.name,note:"แจ้งเข้าระบบ"}];
      window.__DATA.repairs = [saved,...window.__DATA.repairs];
      setLoading(false);
      Swal.fire({icon:"success",title:"แจ้งซ่อมสำเร็จ!",html:`เลขที่ใบแจ้งซ่อม: <strong class="mono" style="color:#1E40AF">${saved.running}</strong>`,confirmButtonColor:"#1E40AF"}).then(async ()=>{
        // เปิดหน้าแชร์รูปใบงานให้เลย (shareRepairImage จัดการ error ของตัวเองแล้ว)
        await window.shareRepairImage(saved,user);
        goTo(["Admin","Officer","Engineer"].includes(user.role)?"repairs":"r-mine");
      });
    }catch(err){ setLoading(false); Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  return (
    <>
    <Loading show={loading} text="กำลังบันทึก..."/>
    <div className="card">
      <div className="card-h"><div><h3>แบบฟอร์มแจ้งซ่อม</h3><div className="sub">ระบบจะออกเลขที่ใบแจ้งซ่อมให้อัตโนมัติหลังส่งแบบฟอร์ม</div></div></div>
      <div className="card-body">
        <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
          {[{n:1,l:"เลือกโครงการ",done:!!f.project},{n:2,l:"เลือกหมวดหมู่",done:!!f.categoryId,disabled:!f.project},{n:3,l:"เลือกเครื่องจักร",done:!!f.machineCode,disabled:!f.categoryId},{n:4,l:"รายละเอียดอาการ",done:(f.title||"").split("\n").some(s=>s.trim()),disabled:!f.machineCode}].map(s=>(
            <div key={s.n} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:999,background:s.done?"rgba(16,185,129,.1)":s.disabled?"var(--bg)":"var(--accent-soft)",border:`1px solid ${s.done?"rgba(16,185,129,.3)":s.disabled?"var(--line)":"rgba(30,64,175,.2)"}`,color:s.done?"#047857":s.disabled?"var(--muted)":"var(--primary)",fontSize:13,fontWeight:500,opacity:s.disabled?0.55:1}}>
              <span style={{width:22,height:22,borderRadius:"50%",display:"grid",placeItems:"center",fontSize:11,background:s.done?"#10B981":s.disabled?"var(--line)":"var(--primary)",color:"#fff"}}>{s.done?<i className="fa-solid fa-check"></i>:s.n}</span>
              {s.l}
            </div>
          ))}
        </div>
        <div className="form-grid">
          <div className="form-field full">
            <label><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:20,height:20,borderRadius:"50%",background:"var(--primary)",color:"#fff",fontSize:11,display:"inline-grid",placeItems:"center",fontWeight:600}}>1</span>โครงการ/หน่วยงาน *</span></label>
            <select value={f.project} onChange={e=>onProjectChange(e.target.value)}><option value="">— กรุณาเลือกโครงการ —</option>{allProjects.map(p=>(<option key={p} value={p}>{p}</option>))}</select>
            <div className="hint">เลือกโครงการก่อน เพื่อกรองหมวดหมู่และเครื่องจักรในโครงการนั้น</div>
          </div>
          <div className="form-field full">
            <label><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:20,height:20,borderRadius:"50%",background:f.project?"var(--primary)":"var(--line)",color:"#fff",fontSize:11,display:"inline-grid",placeItems:"center",fontWeight:600}}>2</span>หมวดหมู่ *</span></label>
            <select value={f.categoryId} onChange={e=>onCategoryChange(e.target.value)} disabled={!f.project}><option value="">{!f.project?"— กรุณาเลือกโครงการก่อน —":projectCategories.length===0?"— ไม่พบหมวดหมู่ในโครงการนี้ —":"— เลือกหมวดหมู่ —"}</option>{projectCategories.map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}</select>
            {f.project&&projectCategories.length>0&&<div className="hint">พบ {projectCategories.length} หมวดหมู่ในโครงการ "{f.project}"</div>}
          </div>
          <div className="form-field full">
            <label><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:20,height:20,borderRadius:"50%",background:f.categoryId?"var(--primary)":"var(--line)",color:"#fff",fontSize:11,display:"inline-grid",placeItems:"center",fontWeight:600}}>3</span>เครื่องจักร</span></label>
            <select value={f.machineCode} onChange={e=>setF({...f,machineCode:e.target.value})} disabled={!f.categoryId}><option value="">{!f.project?"— กรุณาเลือกโครงการก่อน —":!f.categoryId?"— กรุณาเลือกหมวดหมู่ก่อน —":filteredMachines.length===0?"— ไม่พบเครื่องจักร —":"— เลือกเครื่องจักร —"}</option>{filteredMachines.map(m=>(<option key={m.id} value={m.code}>{m.code} — {m.name}{m.brand?` (${m.brand}${m.model?` ${m.model}`:""})`:"" }</option>))}</select>
            {f.categoryId&&filteredMachines.length>0&&<div className="hint">พบ {filteredMachines.length} เครื่องจักรในหมวดหมู่นี้</div>}
          </div>
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}><label>อาการ/ปัญหา * <span style={{color:"var(--muted)",fontWeight:400,fontSize:12}}>(เพิ่มได้หลายรายการ)</span></label><ProblemsField value={f.title} onChange={v=>setF({...f,title:v})} /></div>
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}><label>เลขที่ใบแจ้งซ่อม (ที่ไซต์งาน)</label><input value={f.siteId} onChange={e=>setF({...f,siteId:e.target.value})} placeholder="เช่น WR-1234" /><div className="hint">ไม่บังคับ · กรอกเลขที่จากใบงานจริงที่ไซต์</div></div>
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}><label><i className="fa-solid fa-calendar-day" style={{color:"var(--primary)",marginRight:6}}></i>วันที่แจ้ง</label><input type="date" value={f.reportDate} onChange={e=>setF({...f,reportDate:e.target.value})} /><div className="hint">ระบบเติมวันที่ปัจจุบันให้ · แก้ไขได้</div></div>
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}>
            <label><i className="fa-solid fa-location-dot" style={{color:"var(--primary)",marginRight:6}}></i>สถานที่ทำการซ่อม</label>
            <div style={{display:"grid",gap:10,border:"1px solid var(--line)",borderRadius:10,padding:"12px 14px"}}>
              <label style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",margin:0,fontWeight:400}}>
                <input type="radio" name="np-place" style={{width:"auto",flexShrink:0,margin:0}} checked={f.placeMode==="onsite"} onChange={()=>setF({...f,placeMode:"onsite"})} />
                <span style={{whiteSpace:"nowrap"}}>ส่งช่างซ่อมหน้างาน ที่</span>
                <input className="inp" style={{flex:1,minWidth:150}} value={f.placeOnsite} onChange={e=>setF({...f,placeOnsite:e.target.value})} placeholder="ชื่อโครงการ/สถานที่หน้างาน" />
              </label>
              <label style={{display:"flex",alignItems:"center",gap:8,margin:0,fontWeight:400}}>
                <input type="radio" name="np-place" style={{width:"auto",flexShrink:0,margin:0}} checked={f.placeMode==="workshop"} onChange={()=>setF({...f,placeMode:"workshop"})} />
                <span>โรงซ่อมของบริษัทที่แจ้งซ่อม</span>
              </label>
              <label style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",margin:0,fontWeight:400}}>
                <input type="radio" name="np-place" style={{width:"auto",flexShrink:0,margin:0}} checked={f.placeMode==="other"} onChange={()=>setF({...f,placeMode:"other"})} />
                <span>อื่นๆ</span>
                <input className="inp" style={{flex:1,minWidth:150}} value={f.placeOther} onChange={e=>setF({...f,placeOther:e.target.value})} placeholder="ระบุสถานที่" />
              </label>
            </div>
            <div className="hint">ระบบเติมชื่อโครงการให้อัตโนมัติ · แก้ไขได้</div>
          </div>
        </div>
      </div>
      <div style={{padding:"14px 22px",borderTop:"1px solid var(--line)",display:"flex",justifyContent:"flex-end",gap:10,background:"#FAFBFC"}}>
        <button className="btn btn-ghost" onClick={()=>goTo(["Admin","Officer","Engineer"].includes(user.role)?"repairs":"r-dashboard")}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-paper-plane"></i> ส่งคำร้องแจ้งซ่อม</button>
      </div>
    </div>
    </>
  );
}

function MyRepairs({user}){
  const [rows,setRows] = React.useState(()=>{ if(user.role==="Engineer") return window.filterByUserProjects(user,window.__DATA.repairs,"project"); return window.filterByUserProjects(user,window.__DATA.repairs.filter(r=>r.reporterId===user.id),"project"); });
  const [detail,setDetail] = React.useState(null);

  const cancel = (r) => {
    Swal.fire({title:"ยกเลิกคำร้อง?",text:`ต้องการยกเลิกคำร้อง "${r.running}" ใช่หรือไม่?`,icon:"warning",showCancelButton:true,confirmButtonText:"ยกเลิกคำร้อง",cancelButtonText:"ไม่",confirmButtonColor:"#EF4444"}).then(async res=>{
      if(res.isConfirmed){
        try{
          await window.api("updateRepairStatus",{id:r.id,status:"cancel",by:user.name,note:"ผู้แจ้งยกเลิกคำร้อง"});
          const upd=rows.map(x=>x.id===r.id?{...x,status:"cancel",timeline:[...x.timeline,{status:"cancel",when:new Date(),by:user.name,note:"ผู้แจ้งยกเลิกคำร้อง"}]}:x);
          setRows(upd); window.__DATA.repairs=window.__DATA.repairs.map(x=>x.id===r.id?upd.find(y=>y.id===x.id):x);
          Swal.fire({icon:"success",title:"ยกเลิกแล้ว",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
        }catch(err){ Swal.fire({icon:"error",title:"ไม่สำเร็จ",text:err.message}); }
      }
    });
  };

  return (
    <>
      <div className="card">
        <div className="filters"><div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>คำร้องแจ้งซ่อมของฉัน ({rows.length} รายการ)</div></div>
        <div className="table-wrap">
          <table className="data">
            <thead><tr><th>เลขที่</th><th className="hide-on-mobile">วันที่แจ้ง</th><th>อาการ/ปัญหา</th><th className="hide-on-mobile">หมวดหมู่</th><th>สถานะ</th><th className="hide-on-mobile">อัปเดตล่าสุด</th><th>จัดการ</th></tr></thead>
            <tbody>
              {rows.map(r=>{
                const last=r.timeline[r.timeline.length-1];
                return (<tr key={r.id}><td><span className="ticket-id">{r.running}</span></td><td className="hide-on-mobile" style={{color:"var(--muted)",whiteSpace:"nowrap"}}>{window.__DATA.fmtDate(r.createdAt)}</td><td><div className="cell-title">{r.title}</div></td><td className="hide-on-mobile"><CategoryChip categoryId={r.categoryId}/></td><td><Badge status={r.status}/></td><td className="hide-on-mobile" style={{color:"var(--muted)",fontSize:12,whiteSpace:"nowrap"}}>{window.__DATA.fmtDateTime(last.when)}</td><td><div className="row-actions"><button className="ia" onClick={()=>setDetail(r)}><i className="fa-solid fa-eye"></i></button>{r.status==="new"&&<button className="ia danger" onClick={()=>cancel(r)} title="ยกเลิกคำร้อง"><i className="fa-solid fa-ban"></i></button>}</div></td></tr>);
              })}
              {rows.length===0&&(<tr><td colSpan="7"><div className="empty"><i className="fa-solid fa-clipboard"></i><div className="t">ยังไม่มีคำร้อง</div><div>คลิก "แจ้งซ่อมใหม่" ในเมนูด้านซ้ายเพื่อเริ่มต้น</div></div></td></tr>)}
            </tbody>
          </table>
        </div>
      </div>
      {detail && <RepairDetail r={detail} user={user} onClose={()=>setDetail(null)} onQuick={()=>{}}/>}
    </>
  );
}
Object.assign(window,{ReporterDashboard,NewRequest,MyRepairs});
</script>

<script type="text/babel">
// ทะเบียนทรัพย์สิน — ข้อมูลจาก Firebase project "panamanee-3a15a" (/assets)
function AssetRegistry({user}){
  const canEdit = ["Admin","Officer","Engineer"].includes(user.role);
  const [rows,setRows] = React.useState(()=>window.__DATA.assetRegistry || null);
  const [err,setErr] = React.useState("");
  const [q,setQ] = React.useState("");
  const [site,setSite] = React.useState("");
  const [owner,setOwner] = React.useState("");
  const [groupBy,setGroupBy] = React.useState("site");   // none | site | ownership | name
  const [collapsed,setCollapsed] = React.useState({});   // เก็บกลุ่มที่ถูกย่อ
  const [edit,setEdit] = React.useState(null);   // {mode:"add"|"edit", data:{...}}
  const [history,setHistory] = React.useState(null);   // ทรัพย์สินที่กำลังดูประวัติการย้าย

  React.useEffect(()=>{
    if(rows) return;
    let alive = true;
    window.api("loadAssetRegistry")
      .then(list=>{
        if(!alive) return;
        const sorted = list.slice().sort((a,b)=>String(a.assetCode||a.id||"").localeCompare(String(b.assetCode||b.id||""),"th"));
        window.__DATA.assetRegistry = sorted;
        setRows(sorted);
      })
      .catch(e=>{ if(alive) setErr(e.message||String(e)); });
    return ()=>{ alive = false; };
  },[rows]);

  const sites = React.useMemo(()=>[...new Set((rows||[]).map(r=>r.site).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"th")),[rows]);
  const owners = React.useMemo(()=>[...new Set((rows||[]).map(r=>r.ownership).filter(Boolean))].sort(),[rows]);

  const filtered = React.useMemo(()=>{
    const kw = q.trim().toLowerCase();
    return (rows||[]).filter(r=>{
      if(site && r.site!==site) return false;
      if(owner && r.ownership!==owner) return false;
      if(!kw) return true;
      return [r.assetCode,r.name,r.brand,r.model,r.serial,r.site,r.holder,r.note]
        .some(v=>String(v||"").toLowerCase().includes(kw));
    });
  },[rows,q,site,owner]);

  const totalQty = React.useMemo(()=>filtered.reduce((s,r)=>s+(Number(r.quantity)||0),0),[filtered]);

  const GROUP_META = {
    site:      { label:"สถานที่ (โครงการ)", empty:"— ไม่ระบุสถานที่ —", field:r=>r.site },
    ownership: { label:"กรรมสิทธิ์",         empty:"— ไม่ระบุกรรมสิทธิ์ —", field:r=>r.ownership },
    name:      { label:"ชื่อทรัพย์สิน",       empty:"— ไม่ระบุชื่อ —", field:r=>r.name },
  };
  const groups = React.useMemo(()=>{
    if(groupBy==="none") return null;
    const meta = GROUP_META[groupBy];
    const map = new Map();
    filtered.forEach(r=>{
      const raw = String(meta.field(r)||"").trim();
      const gkey = raw || meta.empty;
      if(!map.has(gkey)) map.set(gkey, { key:gkey, label:gkey, rows:[], qty:0 });
      const g = map.get(gkey); g.rows.push(r); g.qty += Number(r.quantity)||0;
    });
    return [...map.values()].sort((a,b)=>String(a.label).localeCompare(String(b.label),"th"));
  },[filtered,groupBy]);

  const toggleGroup = (k)=>setCollapsed(prev=>({...prev,[k]:!prev[k]}));
  const colCount = canEdit?9:8;

  const renderRow = (r)=>(
    <tr key={r.key}>
      <td><span className="ticket-id">{r.assetCode||r.id||"—"}</span></td>
      <td><div className="cell-title">{r.name||"—"}{r.serial&&<div className="desc"><span className="mono">S/N {r.serial}</span></div>}</div></td>
      <td className="hide-on-mobile" style={{fontSize:13}}>{[r.brand,r.model].filter(Boolean).join(" ")||"—"}</td>
      <td className="hide-on-mobile" style={{fontSize:13}}>{r.size||"—"}</td>
      <td style={{whiteSpace:"nowrap"}}>{(Number(r.quantity)||0).toLocaleString("th-TH")} {r.unit||""}</td>
      <td className="hide-on-mobile" style={{fontSize:13}}>{r.ownership||"—"}</td>
      <td className="hide-on-mobile" style={{fontSize:13}}>{r.holder||"—"}</td>
      <td style={{fontSize:13}}>
        {r.site ? <ProjectLabel name={r.site}/> : <span style={{color:"var(--muted)"}}>—</span>}
        {(r.transferHistory||[]).length>0 && (
          <button className="ia" title="ประวัติการย้าย" onClick={()=>setHistory(r)} style={{color:"#7C3AED",marginLeft:4}}>
            <i className="fa-solid fa-clock-rotate-left"></i>
          </button>
        )}
      </td>
      {canEdit && <td><div className="row-actions">
        <button className="ia" title="แก้ไข" onClick={()=>setEdit({mode:"edit",data:{...r}})}><i className="fa-solid fa-pen"></i></button>
        <button className="ia danger" title="ลบ" onClick={()=>remove(r)}><i className="fa-solid fa-trash"></i></button>
      </div></td>}
    </tr>
  );

  const sortRows = (list) => list.slice().sort((a,b)=>String(a.assetCode||a.id||"").localeCompare(String(b.assetCode||b.id||""),"th"));
  const commit = (list) => { const sorted = sortRows(list); window.__DATA.assetRegistry = sorted; setRows(sorted); };

  const save = async (form) => {
    const saved = await window.api("saveAssetRegistry",{ key: form.key || "", asset: form });
    const base = rows || [];
    commit(base.some(x=>x.key===saved.key) ? base.map(x=>x.key===saved.key?saved:x) : base.concat([saved]));
    setEdit(null);
    Swal.fire({icon:"success",title:form.key?"บันทึกการแก้ไขแล้ว":"เพิ่มทรัพย์สินแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
  };

  const remove = async (r) => {
    const { isConfirmed } = await Swal.fire({
      title:"ลบทรัพย์สินนี้?",
      html:`<b>${(r.assetCode||r.id||"")}</b> ${(r.name||"")}<br/><span style="color:#64748B">การลบไม่สามารถกู้คืนได้</span>`,
      icon:"warning", showCancelButton:true,
      confirmButtonText:"ใช่, ลบเลย", cancelButtonText:"ยกเลิก", confirmButtonColor:"#EF4444"
    });
    if(!isConfirmed) return;
    try{
      await window.api("deleteAssetRegistry",{ key:r.key });
      commit((rows||[]).filter(x=>x.key!==r.key));
      Swal.fire({icon:"success",title:"ลบข้อมูลแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(e){ Swal.fire({icon:"error",title:"ลบไม่สำเร็จ",text:e.message}); }
  };

  const blank = {assetCode:"",name:"",brand:"",model:"",serial:"",size:"",quantity:1,unit:"",ownership:"",holder:"",site:"",receivedAt:"",note:""};

  if(err) return (
    <div className="card"><div className="card-body">
      <div className="empty">
        <i className="fa-solid fa-triangle-exclamation" style={{color:"#EF4444"}}></i>
        <div className="t">โหลดทะเบียนทรัพย์สินไม่สำเร็จ</div>
        <div>{err}</div>
        <button className="btn btn-primary btn-sm" style={{marginTop:12}} onClick={()=>{setErr("");setRows(null);}}><i className="fa-solid fa-rotate"></i> ลองใหม่</button>
      </div>
    </div></div>
  );
  if(!rows) return <Loading show={true} text="กำลังโหลดทะเบียนทรัพย์สิน..."/>;

  return (
    <>
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i>
          <input placeholder="ค้นหารหัส / ชื่อ / ยี่ห้อ / รุ่น / Serial / สถานที่..." value={q} onChange={e=>setQ(e.target.value)} />
        </div>
        <select value={site} onChange={e=>setSite(e.target.value)}>
          <option value="">ทุกสถานที่</option>
          {sites.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <select value={owner} onChange={e=>setOwner(e.target.value)}>
          <option value="">ทุกกรรมสิทธิ์</option>
          {owners.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
        <select value={groupBy} onChange={e=>setGroupBy(e.target.value)} title="จัดกลุ่มทรัพย์สิน">
          <option value="none">ไม่จัดกลุ่ม</option>
          <option value="site">จัดกลุ่มตามสถานที่</option>
          <option value="ownership">จัดกลุ่มตามกรรมสิทธิ์</option>
          <option value="name">จัดกลุ่มตามชื่อทรัพย์สิน</option>
        </select>
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>
          {filtered.length.toLocaleString("th-TH")} / {rows.length.toLocaleString("th-TH")} รายการ · รวม {totalQty.toLocaleString("th-TH")} หน่วย
        </div>
        {canEdit && <button className="btn btn-primary" onClick={()=>setEdit({mode:"add",data:{...blank}})}><i className="fa-solid fa-plus"></i> เพิ่มทรัพย์สิน</button>}
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr>
            <th>รหัสทรัพย์สิน</th><th>ชื่อทรัพย์สิน</th>
            <th className="hide-on-mobile">ยี่ห้อ / รุ่น</th><th className="hide-on-mobile">ขนาด</th>
            <th>จำนวน</th><th className="hide-on-mobile">กรรมสิทธิ์</th>
            <th className="hide-on-mobile">ผู้ถือครอง</th><th>สถานที่ (โครงการ)</th>
            {canEdit && <th>จัดการ</th>}
          </tr></thead>
          <tbody>
            {!groups && filtered.map(r=>renderRow(r))}
            {groups && groups.map(g=>{
              const isCollapsed = !!collapsed[g.key];
              return (
                <React.Fragment key={g.key}>
                  <tr className="group-row" onClick={()=>toggleGroup(g.key)} style={{cursor:"pointer",background:"var(--bg)"}}>
                    <td colSpan={colCount} style={{fontWeight:600,fontSize:13.5,padding:"9px 14px",borderTop:"2px solid var(--line)"}}>
                      <i className={`fa-solid ${isCollapsed?"fa-chevron-right":"fa-chevron-down"}`} style={{marginRight:8,color:"var(--muted)",fontSize:11}}></i>
                      {groupBy==="site" ? <ProjectLabel name={g.label}/> : g.label}
                      <span style={{marginLeft:10,fontWeight:400,color:"var(--muted)",fontSize:12.5}}>{g.rows.length.toLocaleString("th-TH")} รายการ · รวม {g.qty.toLocaleString("th-TH")} หน่วย</span>
                    </td>
                  </tr>
                  {!isCollapsed && g.rows.map(r=>renderRow(r))}
                </React.Fragment>
              );
            })}
            {filtered.length===0 && (<tr><td colSpan={colCount}><div className="empty">
              <i className="fa-solid fa-boxes-stacked"></i>
              <div className="t">ไม่พบข้อมูล</div>
              <div>{rows.length===0 ? "ยังไม่มีทรัพย์สินในทะเบียน" : "ลองเปลี่ยนเงื่อนไขการค้นหา"}</div>
            </div></td></tr>)}
          </tbody>
        </table>
      </div>
    </div>
    {edit && <AssetForm mode={edit.mode} initial={edit.data} sites={sites} owners={owners} onClose={()=>setEdit(null)} onSave={save}/>}
    {history && <AssetHistoryModal asset={history} onClose={()=>setHistory(null)}/>}
    </>
  );
}

// ประวัติการย้ายโครงการของทรัพย์สินชิ้นหนึ่ง
function AssetHistoryModal({asset,onClose}){
  const list = (asset.transferHistory||[]).slice().reverse();
  return (
    <Modal open={true} onClose={onClose} size="sm"
      title={<><i className="fa-solid fa-clock-rotate-left" style={{color:"#7C3AED",marginRight:8}}></i>ประวัติการย้ายโครงการ</>}
      footer={<button className="btn btn-ghost" onClick={onClose}>ปิด</button>}>
      <div style={{marginBottom:12,fontSize:13,color:"var(--muted)"}}>
        <span className="ticket-id">{asset.assetCode||asset.id}</span> {asset.name}
      </div>
      <div style={{display:"grid",gap:8}}>
        {list.map((t,i)=>(
          <div key={i} style={{border:"1px solid var(--line)",borderRadius:8,padding:"10px 12px"}}>
            <div style={{fontSize:13,fontWeight:500}}>
              {t.from||"— ไม่ระบุ —"} <i className="fa-solid fa-arrow-right" style={{color:"#7C3AED",margin:"0 6px"}}></i> {t.to}
            </div>
            <div style={{fontSize:12,color:"var(--muted)",marginTop:4}}>
              {window.__DATA.fmtDateTime(t.when)} · โดย {t.by||"—"}
              {t.docNo && <> · ใบส่งของ <span className="mono">{t.docNo}</span></>}
            </div>
            {t.note && <div style={{fontSize:12,marginTop:4}}>{t.note}</div>}
          </div>
        ))}
        {list.length===0 && <div style={{color:"var(--muted)",fontSize:13}}>ยังไม่มีประวัติการย้าย</div>}
      </div>
    </Modal>
  );
}

// เลือกโครงการปลายทาง + ข้อมูลใบส่งของ
// ย้ายโครงการ + ออกใบส่งของ — เลือกทรัพย์สินได้ในตัว (เรียกจากหน้าใบส่งของ)
function TransferAssetsModal({user,onClose,onSaved}){
  const projects = React.useMemo(()=>(window.__DATA.projects||[]).filter(p=>p.status!=="inactive"),[]);
  const [assets,setAssets] = React.useState(()=>window.__DATA.assetRegistry || null);
  const [loadErr,setLoadErr] = React.useState("");
  const [toProject,setToProject] = React.useState("");
  const [docNo,setDocNo] = React.useState("");
  const [docDate,setDocDate] = React.useState(()=>window.__DATA.fmtDate(new Date()));
  const [sender,setSender] = React.useState(user.name||"");
  const [receiver,setReceiver] = React.useState("");
  const [note,setNote] = React.useState("");
  const [busy,setBusy] = React.useState(false);
  const [q,setQ] = React.useState("");
  const [fromFilter,setFromFilter] = React.useState("");
  const [qty,setQty] = React.useState({});   // {assetKey: จำนวนที่จะย้าย} — มีคีย์ = ถูกเลือก

  React.useEffect(()=>{
    if(assets) return;
    let alive = true;
    window.api("loadAssetRegistry")
      .then(list=>{ if(!alive) return; window.__DATA.assetRegistry = list; setAssets(list); })
      .catch(e=>{ if(alive) setLoadErr(e.message||String(e)); });
    return ()=>{ alive=false; };
  },[assets]);

  // เลขที่ใบส่งของ: DO-<รหัสโครงการปลายทาง>-<ปีพ.ศ.><เดือน>/<ลำดับ> — รูปแบบเดียวกับเลขที่ใบแจ้งซ่อม
  React.useEffect(()=>{
    if(!toProject){ setDocNo(""); return; }
    let alive = true;
    window.api("loadDeliveryOrders").then(list=>{
      if(!alive) return;
      const code = String(window.getProjectCode(toProject)||toProject).trim().replace(/\s+/g,"-").toUpperCase();
      const d = new Date();
      const prefix = "DO-"+code+"-"+String(d.getFullYear()+543)+String(d.getMonth()+1).padStart(2,"0")+"/";
      let max = 0;
      list.forEach(x=>{
        const t = String(x.docNo||"");
        if(t.slice(0,prefix.length)===prefix){ const n=parseInt(t.slice(prefix.length),10); if(!isNaN(n)&&n>max) max=n; }
      });
      setDocNo(prefix+String(max+1).padStart(3,"0"));
    }).catch(()=>setDocNo(""));
    return ()=>{ alive=false; };
  },[toProject]);

  const sites = React.useMemo(()=>[...new Set((assets||[]).map(a=>a.site).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"th")),[assets]);

  // ซ่อนรายการที่อยู่โครงการปลายทางอยู่แล้ว
  const candidates = React.useMemo(()=>{
    const kw = q.trim().toLowerCase();
    return (assets||[]).filter(a=>{
      if(toProject && a.site===toProject) return false;
      if(fromFilter && a.site!==fromFilter) return false;
      if(!kw) return true;
      return [a.assetCode,a.name,a.brand,a.model,a.serial,a.site].some(v=>String(v||"").toLowerCase().includes(kw));
    });
  },[assets,q,fromFilter,toProject]);

  const picked = React.useMemo(()=>(assets||[]).filter(a=>qty[a.key]!==undefined),[assets,qty]);
  const totalMoving = picked.reduce((s,a)=>s+(Number(qty[a.key])||0),0);

  const toggle = (a) => setQty(prev=>{
    const n = {...prev};
    if(n[a.key]!==undefined) delete n[a.key];
    else n[a.key] = Number(a.quantity)||0;
    return n;
  });
  const setQtyFor = (a,v) => {
    const max = Number(a.quantity)||0;
    setQty(prev=>({...prev,[a.key]: v==="" ? "" : Math.min(Math.max(Number(v)||0,0),max)}));
  };
  const allShown = candidates.length>0 && candidates.every(a=>qty[a.key]!==undefined);
  const pickAllShown = () => setQty(prev=>{
    const n = {...prev};
    candidates.forEach(a=>{ if(allShown) delete n[a.key]; else n[a.key] = Number(a.quantity)||0; });
    return n;
  });

  const submit = async () => {
    if(!toProject){ Swal.fire({icon:"warning",title:"กรุณาเลือกโครงการปลายทาง"}); return; }
    if(!docNo){ Swal.fire({icon:"warning",title:"ยังออกเลขที่ใบส่งของไม่สำเร็จ",text:"กรุณารอสักครู่แล้วลองใหม่"}); return; }
    const moves = picked.map(a=>({key:a.key, qty:Number(qty[a.key])||0})).filter(x=>x.qty>0);
    if(!moves.length){ Swal.fire({icon:"warning",title:"ยังไม่ได้เลือกทรัพย์สิน",text:"เลือกรายการและระบุจำนวนที่จะย้ายอย่างน้อย 1 รายการ"}); return; }
    const froms = [...new Set(picked.map(a=>a.site||"ไม่ระบุ"))].join(", ");
    setBusy(true);
    try{
      const res = await window.api("transferAssets",{
        moves, toProject, note, by:user.name,
        doc:{ docNo, docDate, sender, receiver, fromProjectLabel:froms },
      });
      // ย้ายบางส่วนจะแตกรายการใหม่ที่ปลายทาง — ล้าง cache ให้ทั้งสองหน้าโหลดใหม่
      window.__DATA.assetRegistry = null;
      window.__DATA.deliveryOrders = null;
      onSaved && onSaved(res);
      const { isConfirmed } = await Swal.fire({
        icon:"success",
        title:"ย้ายโครงการสำเร็จ",
        html:"ย้าย <b>"+res.items.length+"</b> รายการ ไปยัง <b>"+toProject+"</b><br/>ออกใบส่งของเลขที่ <b class='mono'>"+docNo+"</b>",
        showCancelButton:true,
        confirmButtonText:"<i class='fa-solid fa-file-pdf'></i> ดาวน์โหลดใบส่งของ",
        cancelButtonText:"ปิด", confirmButtonColor:"#1E40AF"
      });
      if(isConfirmed) window.downloadDeliveryOrderPdf(res.doc);
    }catch(err){ Swal.fire({icon:"error",title:"ย้ายไม่สำเร็จ",text:err.message}); }
    finally{ setBusy(false); }
  };

  const inSt = {width:"100%",padding:"9px 11px",border:"1px solid var(--line)",borderRadius:8,fontFamily:"Kanit",fontSize:13.5,background:"#fff"};

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className="fa-solid fa-right-left" style={{color:"#7C3AED",marginRight:8}}></i>ย้ายโครงการ / ออกใบส่งของ</>}
      footer={<>

function AssetForm({mode,initial,sites,owners,onClose,onSave}){
  const [f,setF] = React.useState(initial);   // เก็บทุกฟิลด์เดิมไว้ (source/sourceRow ฯลฯ) ไม่ให้หายตอนบันทึกทับ
  const [busy,setBusy] = React.useState(false);
  const projects = React.useMemo(()=>(window.__DATA.projects||[]).filter(p=>p.status!=="inactive"),[]);
  const up = (k,v) => setF(p=>({...p,[k]:v}));

  const submit = async (e) => {
    e?.preventDefault();
    if(!String(f.assetCode||"").trim() || !String(f.name||"").trim()){
      Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณากรอก รหัสทรัพย์สิน และ ชื่อทรัพย์สิน"});
      return;
    }
    setBusy(true);
    try{ await onSave(f); }
    catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
    finally{ setBusy(false); }
  };

  const txt = (k,label,ph) => (
    <div className="form-field">
      <label>{label}</label>
      <input value={f[k]||""} onChange={e=>up(k,e.target.value)} placeholder={ph||""} />
    </div>
  );

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className={`fa-solid ${mode==="edit"?"fa-pen-to-square":"fa-plus"}`} style={{marginRight:8,color:"var(--primary)"}}></i>{mode==="edit"?"แก้ไขทรัพย์สิน":"เพิ่มทรัพย์สินใหม่"}</>}
      footer={<>
        <button className="btn btn-ghost" onClick={onClose} disabled={busy}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit} disabled={busy}>
          {busy ? <><div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> กำลังบันทึก...</> : <><i className="fa-solid fa-floppy-disk"></i> บันทึก</>}
        </button>
      </>}>
      <form onSubmit={submit}>
        <div className="form-grid">
          {txt("assetCode","รหัสทรัพย์สิน *","เช่น ASSET-0123")}
          {txt("name","ชื่อทรัพย์สิน *","เช่น ถังไซโล")}
          {txt("brand","ยี่ห้อ")}
          {txt("model","รุ่น")}
          {txt("serial","Serial No.")}
          {txt("size","ขนาด")}
          <div className="form-field">
            <label>จำนวน</label>
            <input type="number" min="0" value={f.quantity ?? ""} onChange={e=>up("quantity",e.target.value)} />
          </div>
          {txt("unit","หน่วย","เช่น ถัง / ชุด / ตัว")}
          <div className="form-field">
            <label>กรรมสิทธิ์</label>
            <input list="asset-owners" value={f.ownership||""} onChange={e=>up("ownership",e.target.value)} placeholder="เช่น PNM / TFB" />
            <datalist id="asset-owners">{(owners||[]).map(o=><option key={o} value={o}/>)}</datalist>
          </div>
          {txt("holder","ผู้ถือครอง")}
          <div className="form-field">
            <label>สถานที่ (โครงการ)</label>
            <select value={f.site||""} onChange={e=>up("site",e.target.value)}>
              <option value="">— เลือกโครงการ —</option>
              {projects.map(p=>(<option key={p.id} value={p.name}>{p.code?`[${p.code}] `:""}{p.name}</option>))}
              {/* ข้อมูลเก่าที่ยังไม่ตรงกับชื่อโครงการ — คงค่าเดิมไว้ไม่ให้หายตอนแก้ไข */}
              {f.site && !projects.some(p=>p.name===f.site) && <option value={f.site}>{f.site} (ข้อมูลเดิม)</option>}
            </select>
