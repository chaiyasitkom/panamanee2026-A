<script type="text/babel">
function Projects({user}){
  const [rows,setRows] = React.useState(window.__DATA.projects||[]);
  const [edit,setEdit] = React.useState(null);
  const [q,setQ] = React.useState("");

  const filtered = rows.filter(p=>{
    if(!q) return true;
    return (p.name||"").toLowerCase().includes(q.toLowerCase()) || (p.code||"").toLowerCase().includes(q.toLowerCase());
  });

  const save = async (form) => {
    try{
      if(form.id){
        await window.api("updateProject",{id:form.id,patch:form});
        const upd = rows.map(x=>x.id===form.id?form:x);
        setRows(upd); window.__DATA.projects=upd;
      } else {
        const nu = await window.api("createProject",{project:form});
        const upd=[...rows,nu]; setRows(upd); window.__DATA.projects=upd;
      }
      setEdit(null);
      Swal.fire({icon:"success",title:"บันทึกสำเร็จ",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const del = (p) => {
    const machineCount = (window.__DATA.machines||[]).filter(m=>m.project===p.name).length;
    const html = machineCount>0
      ? `ต้องการลบโครงการ "<strong>${p.name}</strong>"?<br/><span style="color:#EF4444;font-size:13px">มีเครื่องจักรในโครงการนี้ ${machineCount} รายการ</span>`
      : `ต้องการลบโครงการ "<strong>${p.name}</strong>" ใช่หรือไม่?`;
    Swal.fire({title:"ลบโครงการ?",html,icon:"warning",showCancelButton:true,confirmButtonText:"ลบ",cancelButtonText:"ยกเลิก",confirmButtonColor:"#EF4444"}).then(async r=>{
      if(r.isConfirmed){
        try{
          await window.api("deleteProject",{id:p.id});
          const upd=rows.filter(x=>x.id!==p.id); setRows(upd); window.__DATA.projects=upd;
          Swal.fire({icon:"success",title:"ลบแล้ว",timer:1000,showConfirmButton:false,toast:true,position:"top-end"});
        }catch(err){ Swal.fire({icon:"error",title:"ลบไม่สำเร็จ",text:err.message}); }
      }
    });
  };

  const STATUS_COLOR = {active:"#10B981",inactive:"#94A3B8"};
  const STATUS_LABEL = {active:"ดำเนินการ",inactive:"ปิดโครงการ"};

  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหาชื่อ / รหัสโครงการ..." value={q} onChange={e=>setQ(e.target.value)}/></div>
        <div className="spacer"></div>
        {["Admin","Officer"].includes(user.role) && (
          <button className="btn btn-primary" onClick={()=>setEdit({name:"",code:"",desc:"",status:"active",color:"#3B82F6"})}>
            <i className="fa-solid fa-plus"></i> เพิ่มโครงการ
          </button>
        )}
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr>
            <th style={{width:44}} className="hide-on-mobile">#</th>
            <th style={{width:100}} className="hide-on-mobile">รหัส</th>
            <th>ชื่อโครงการ</th>
            <th className="hide-on-mobile">รายละเอียด</th>
            <th style={{width:100}}>สถานะ</th>
            <th style={{width:80}} className="hide-on-mobile">เครื่องจักร</th>
            <th style={{width:80}} className="hide-on-mobile">แจ้งซ่อม</th>
            <th style={{width:90}}>จัดการ</th>
          </tr></thead>
          <tbody>
            {filtered.map((p,i)=>{
              const mCnt=(window.__DATA.machines||[]).filter(m=>m.project===p.name).length;
              const rCnt=(window.__DATA.repairs||[]).filter(r=>r.project===p.name).length;
              const sc=STATUS_COLOR[p.status]||"#94A3B8";
              return (
                <tr key={p.id}>
                  <td className="hide-on-mobile" style={{color:"var(--muted)",fontSize:12}}>{i+1}</td>
                  <td className="hide-on-mobile"><span className="mono" style={{fontSize:12,fontWeight:500,color:"var(--primary)",background:"var(--accent-soft)",padding:"2px 8px",borderRadius:6}}>{p.code||"—"}</span></td>
                  <td>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{width:10,height:10,borderRadius:"50%",background:p.color||"#3B82F6",flexShrink:0,display:"inline-block"}}></span>
                      <span style={{fontWeight:500}}>{p.name}</span>
                    </div>
                  </td>
                  <td className="hide-on-mobile" style={{color:"var(--muted)",fontSize:13,maxWidth:260}}><div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.desc||"—"}</div></td>
                  <td><span style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:12,fontWeight:500,padding:"3px 10px",borderRadius:999,background:sc+"22",color:sc}}><span style={{width:6,height:6,borderRadius:"50%",background:sc}}></span>{STATUS_LABEL[p.status]||p.status}</span></td>
                  <td className="hide-on-mobile" style={{textAlign:"center"}}><strong>{mCnt}</strong> <span style={{color:"var(--muted)",fontSize:12}}>รายการ</span></td>
                  <td className="hide-on-mobile" style={{textAlign:"center"}}><strong>{rCnt}</strong> <span style={{color:"var(--muted)",fontSize:12}}>รายการ</span></td>
                  <td>
                    <div className="row-actions">
                      {["Admin","Officer"].includes(user.role) && <>
                        <button className="ia" onClick={()=>setEdit(p)} title="แก้ไข"><i className="fa-solid fa-pen"></i></button>
                        <button className="ia danger" onClick={()=>del(p)} title="ลบ"><i className="fa-solid fa-trash"></i></button>
                      </>}
                    </div>
                  </td>
                </tr>
              );
            })}
            {filtered.length===0 && <tr><td colSpan="8"><div className="empty"><i className="fa-solid fa-diagram-project"></i><div className="t">ยังไม่มีโครงการ</div><div>กดปุ่ม "เพิ่มโครงการ" เพื่อเริ่มต้น</div></div></td></tr>}
          </tbody>
        </table>
      </div>
      {edit && <ProjectForm init={edit} onClose={()=>setEdit(null)} onSave={save}/>}
    </div>
  );
}

function ProjectForm({init,onClose,onSave}){
  const [f,setF] = React.useState(init);
  const palette = ["#3B82F6","#8B5CF6","#EF4444","#10B981","#F59E0B","#06B6D4","#EC4899","#6366F1","#F97316","#14B8A6","#A855F7","#0EA5E9","#DC2626","#16A34A","#D97706","#64748B"];

  return (
    <Modal open={true} onClose={onClose} title={init.id?"แก้ไขโครงการ":"เพิ่มโครงการใหม่"}
      footer={<>
        <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={()=>onSave(f)}><i className="fa-solid fa-floppy-disk"></i> บันทึก</button>
      </>}>
      <div className="form-grid">
        <div className="form-field" style={{gridColumn:"1/-1"}}>
          <label>ชื่อโครงการ *</label>
          <input value={f.name||""} onChange={e=>setF({...f,name:e.target.value})} placeholder="เช่น โรงงาน A - สายการผลิต 1" />
        </div>
        <div className="form-field">
          <label>รหัสโครงการ</label>
          <input className="mono" value={f.code||""} onChange={e=>setF({...f,code:e.target.value})} placeholder="เช่น PRJ-001" />
        </div>
        <div className="form-field">
          <label>สถานะ</label>
          <select value={f.status||"active"} onChange={e=>setF({...f,status:e.target.value})}>
            <option value="active">ดำเนินการ</option>
            <option value="inactive">ปิดโครงการ</option>
          </select>
        </div>
        <div className="form-field" style={{gridColumn:"1/-1"}}>
          <label>รายละเอียด</label>
          <textarea rows="2" value={f.desc||""} onChange={e=>setF({...f,desc:e.target.value})} placeholder="รายละเอียดโครงการ สถานที่ตั้ง ฯลฯ"></textarea>
        </div>
        <div className="form-field" style={{gridColumn:"1/-1"}}>
          <label>สีประจำโครงการ</label>
          <div className="color-grid">
            {palette.map(c=>(
              <button key={c} className={f.color===c?"sel":""} style={{background:c}} onClick={()=>setF({...f,color:c})}></button>
            ))}
          </div>
        </div>
      </div>
      <div style={{marginTop:16,padding:14,background:"#FAFBFC",borderRadius:10,border:"1px dashed var(--line)"}}>
        <div style={{fontSize:11,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:8,fontWeight:500}}>ตัวอย่าง</div>
        <div style={{display:"inline-flex",alignItems:"center",gap:8,padding:"6px 14px",borderRadius:999,background:(f.color||"#3B82F6")+"22",color:f.color||"#3B82F6",fontWeight:500,fontSize:13}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:f.color||"#3B82F6"}}></span>
          {f.code && <span className="mono" style={{fontSize:12}}>{f.code}</span>}
          <span>{f.name||"ชื่อโครงการ"}</span>
        </div>
      </div>
    </Modal>
  );
}

window.Projects = Projects;
</script>


<script type="text/babel">
function Dashboard({user,goTo}){
  const [loading,setLoading] = React.useState(true);
  const [costView,setCostView] = React.useState("category");
  const [dashDetail,setDashDetail] = React.useState(null);
  const [tick,setTick] = React.useState(0);
  const doughnutRef = React.useRef(null);
  const barRef = React.useRef(null);
  const costRef = React.useRef(null);
  const chartsRef = React.useRef({});

  React.useEffect(()=>{
    const t = setTimeout(()=>setLoading(false),350);
    return ()=>clearTimeout(t);
  },[]);

  const repairs = React.useMemo(()=>{
    return window.filterByUserProjects(user, window.__DATA.repairs, "project");
  },[user,tick]);

  const costStats = React.useMemo(()=>{
    const total = repairs.reduce((s,r)=>s+(Number(r.cost)||0),0);
    const done  = repairs.filter(r=>r.status==="done").reduce((s,r)=>s+(Number(r.cost)||0),0);
    const pending = total - done;
    const avg = repairs.length ? total/repairs.length : 0;
    const byCatMap = {};
    repairs.forEach(r=>{
      const c = r.categoryId || "uncat";
      if(!byCatMap[c]) byCatMap[c]={count:0,cost:0};
      byCatMap[c].count++;
      byCatMap[c].cost += Number(r.cost)||0;
    });
    const byCat = Object.entries(byCatMap).map(([id,v])=>{
      const cat = window.getCategory(id);
      return {id, name:cat.name, color:cat.color, icon:cat.icon, ...v};
    }).sort((a,b)=>b.cost-a.cost);
    const byProjMap = {};
    repairs.forEach(r=>{
      const p = r.project || "ไม่ระบุโครงการ";
      if(!byProjMap[p]) byProjMap[p]={count:0,cost:0};
      byProjMap[p].count++;
      byProjMap[p].cost += Number(r.cost)||0;
    });
    const projColors = ["#1E40AF","#8B5CF6","#EF4444","#10B981","#F59E0B","#06B6D4","#EC4899","#6366F1","#14B8A6","#F97316"];
    const byProj = Object.entries(byProjMap).map(([name,v],i)=>({
      name, color:projColors[i%projColors.length], ...v
    })).sort((a,b)=>b.cost-a.cost);
    const byMachMap = {};
    repairs.forEach(r=>{
      const mc = r.machineCode||"ไม่ระบุ";
      if(!byMachMap[mc]) byMachMap[mc]={count:0,cost:0};
      byMachMap[mc].count++;
      byMachMap[mc].cost += Number(r.cost)||0;
    });
    const machColors = ["#0EA5E9","#10B981","#F59E0B","#EF4444","#8B5CF6","#1E40AF","#EC4899","#6366F1","#14B8A6","#F97316"];
    const byMach = Object.entries(byMachMap).map(([name,v],i)=>({
      name, color:machColors[i%machColors.length], ...v
    })).sort((a,b)=>b.cost-a.cost);
    return {total,done,pending,avg,byCat,byProj,byMach};
  },[repairs]);

  const fmtBaht = (n) => "฿" + Math.round(Number(n)||0).toLocaleString();

  // สรุปอาการเสียที่พบบ่อย — รวมทุกอาการจากทุกใบแจ้งซ่อม แล้วจัดอันดับตามจำนวนครั้ง
  const symptomStats = React.useMemo(()=>{
    const map = {};
    repairs.forEach(r=>{
      window.getProblems(r).forEach(p=>{
        const label = String(p.text||"").trim();
        if(!label) return;
        const key = label.toLowerCase().replace(/\s+/g," ");
        if(!map[key]) map[key] = { label, count:0, done:0 };
        map[key].count++;
        if(p.status==="done") map[key].done++;
      });
    });
    const list = Object.values(map).sort((a,b)=>b.count-a.count);
    return { list, total: list.reduce((s,x)=>s+x.count,0), max: list.length?list[0].count:0 };
  },[repairs]);

  const counts = {
    all: repairs.length,
    assess: repairs.filter(r=>r.status==="assess").length,
    approve: repairs.filter(r=>r.status==="new").length,
    progress: repairs.filter(r=>["progress","parts"].includes(r.status)).length,
    done: repairs.filter(r=>r.status==="done").length,
  };

  React.useEffect(()=>{
    if(loading) return;
    if(doughnutRef.current){
      if(chartsRef.current.d) chartsRef.current.d.destroy();
      const catCount = {};
      repairs.forEach(r=>{ catCount[r.categoryId]=(catCount[r.categoryId]||0)+1; });
      const cats = window.__DATA.categories.filter(c=>catCount[c.id]);
      chartsRef.current.d = new Chart(doughnutRef.current,{
        type:"doughnut",
        data:{
          labels:cats.map(c=>c.name),
          datasets:[{data:cats.map(c=>catCount[c.id]),backgroundColor:cats.map(c=>c.color),borderWidth:0,hoverOffset:6}]
        },
        options:{responsive:true,maintainAspectRatio:false,cutout:"68%",plugins:{legend:{position:"right",labels:{font:{family:"Kanit",size:12},usePointStyle:true,pointStyle:"circle",padding:12}},tooltip:{titleFont:{family:"Kanit"},bodyFont:{family:"Kanit"}}}}
      });
    }
    if(barRef.current){
      if(chartsRef.current.b) chartsRef.current.b.destroy();
      const now = new Date();
      const months=[]; const labels=[]; const data=[]; const dataDone=[];
      const mThai = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
      for(let i=5;i>=0;i--){
        const d=new Date(now.getFullYear(),now.getMonth()-i,1);
        months.push(d);
        labels.push(mThai[d.getMonth()]+" "+(d.getFullYear()+543-2500));
      }
      months.forEach(m=>{
        const total = repairs.filter(r=>{const d=new Date(r.createdAt);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth();}).length;
        const done = repairs.filter(r=>{const d=new Date(r.createdAt);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth()&&r.status==="done";}).length;
        data.push(total); dataDone.push(done);
      });
      chartsRef.current.b = new Chart(barRef.current,{
        type:"bar",
        data:{labels,datasets:[{label:"งานทั้งหมด",data,backgroundColor:"#3B82F6",borderRadius:6,barThickness:18},{label:"ปิดงานแล้ว",data:dataDone,backgroundColor:"#10B981",borderRadius:6,barThickness:18}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Kanit"},usePointStyle:true,pointStyle:"circle"}},tooltip:{titleFont:{family:"Kanit"},bodyFont:{family:"Kanit"}}},scales:{x:{grid:{display:false},ticks:{font:{family:"Kanit"}}},y:{beginAtZero:true,grid:{color:"#F1F5F9"},ticks:{font:{family:"Kanit"},precision:0}}}}
      });
    }
    return ()=>{
      if(chartsRef.current.d) chartsRef.current.d.destroy();
      if(chartsRef.current.b) chartsRef.current.b.destroy();
      if(chartsRef.current.c) chartsRef.current.c.destroy();
    };
  },[loading]);

  React.useEffect(()=>{
    if(loading) return;
    if(!costRef.current) return;
    if(chartsRef.current.c) chartsRef.current.c.destroy();
    const src = costView==="category" ? costStats.byCat.map(x=>({label:x.name,val:x.cost,color:x.color})) : costView==="project" ? costStats.byProj.map(x=>({label:x.name,val:x.cost,color:x.color})) : costStats.byMach.map(x=>({label:x.name,val:x.cost,color:x.color}));
    chartsRef.current.c = new Chart(costRef.current,{
      type:"bar",
      data:{labels:src.map(x=>x.label),datasets:[{label:"ค่าใช้จ่าย (บาท)",data:src.map(x=>x.val),backgroundColor:src.map(x=>x.color),borderRadius:6,barThickness:22}]},
      options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{titleFont:{family:"Kanit"},bodyFont:{family:"Kanit"},callbacks:{label:(ctx)=>" ฿"+Math.round(ctx.parsed.x).toLocaleString()}}},scales:{x:{beginAtZero:true,grid:{color:"#F1F5F9"},ticks:{font:{family:"Kanit"},callback:(v)=>"฿"+Number(v).toLocaleString()}},y:{grid:{display:false},ticks:{font:{family:"Kanit",size:11.5}}}}}
    });
  },[loading,costView,costStats]);

  const recent = repairs.filter(r=>r.status!=="done");
  const stats = [
    { key:"all", label:"รายการทั้งหมด", val:counts.all, icon:"fa-clipboard-list", color:"#3B82F6", delta:"+12% vs เดือนก่อน", up:true },
    { key:"assess", label:"รอประเมินราคา", val:counts.assess, icon:"fa-magnifying-glass-dollar", color:"#8B5CF6" },
    { key:"approve", label:"รออนุมัติ", val:counts.approve, icon:"fa-hourglass-half", color:"#F59E0B" },
    { key:"progress", label:"กำลังซ่อม", val:counts.progress, icon:"fa-screwdriver-wrench", color:"#EF4444" },
    { key:"done", label:"เสร็จสิ้น", val:counts.done, icon:"fa-circle-check", color:"#10B981", delta:"-3% vs เดือนก่อน", up:false },
  ];

  return (
    <>
      <Loading show={loading} />
      {!loading && <>
        <div className="stat-grid">
          {stats.map(s=>(
            <div className="stat" key={s.key}>
              <div className="ic" style={{background:s.color+"1a",color:s.color}}><i className={`fa-solid ${s.icon}`}></i></div>
              <div className="label">{s.label}</div>
              <div className="val">{s.val}</div>
              {s.delta && <div className="delta"><span className={s.up?"up":"down"}><i className={`fa-solid fa-arrow-${s.up?"up":"down"}`}></i></span> {s.delta}</div>}
            </div>
          ))}
        </div>
        <div className="charts-grid">
          <div className="card">
            <div className="card-h"><div><h3>สถิติย้อนหลัง 6 เดือน</h3><div className="sub">เปรียบเทียบจำนวนงานแจ้งเข้าและงานที่ปิดแล้ว</div></div><button className="btn btn-ghost btn-sm"><i className="fa-solid fa-download"></i> Export</button></div>
            <div className="card-body" style={{height:320}}><canvas ref={barRef}></canvas></div>
          </div>
          <div className="card">
            <div className="card-h"><div><h3>สัดส่วนตามหมวดหมู่</h3><div className="sub">งานซ่อมทั้งหมดแยกตามประเภท</div></div></div>
            <div className="card-body" style={{height:320}}><canvas ref={doughnutRef}></canvas></div>
          </div>
        </div>
        <div className="card" style={{marginBottom:18}}>
          <div className="card-h"><div><h3>สรุปอาการเสียที่พบบ่อย</h3><div className="sub">จัดอันดับอาการ/ปัญหาที่ถูกแจ้งซ่อมมากที่สุด · {symptomStats.list.length} อาการ · {symptomStats.total} ครั้ง</div></div></div>
          <div className="card-body">
            {symptomStats.list.length===0 ? (
              <div className="empty" style={{padding:30}}><i className="fa-solid fa-clipboard-question"></i><div className="t" style={{fontSize:14}}>ยังไม่มีข้อมูลอาการแจ้งซ่อม</div></div>
            ) : (
              <div style={{display:"grid",gap:12}}>
                {symptomStats.list.slice(0,Math.max(6,Math.min(symptomStats.list.length,8))).map((s,i)=>{
                  const pct = symptomStats.max ? (s.count/symptomStats.max*100) : 0;
                  const share = symptomStats.total ? (s.count/symptomStats.total*100) : 0;
                  const rankColor = ["#EF4444","#F59E0B","#3B82F6","#8B5CF6","#0EA5E9","#10B981","#EC4899","#6366F1"][i%8];
                  return (
                    <div key={i} style={{display:"flex",alignItems:"center",gap:12}}>
                      <span style={{width:26,height:26,flexShrink:0,borderRadius:"50%",background:rankColor+"1a",color:rankColor,display:"grid",placeItems:"center",fontSize:13,fontWeight:600}}>{i+1}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:10,marginBottom:5}}>
                          <span style={{fontSize:14,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.label}</span>
                          <span style={{flexShrink:0,fontSize:13,color:"var(--muted)"}}><strong style={{color:rankColor,fontSize:15}}>{s.count}</strong> ครั้ง · {share.toFixed(0)}%</span>
                        </div>
                        <div style={{height:8,borderRadius:999,background:"var(--bg)",overflow:"hidden"}}><div style={{height:"100%",width:pct+"%",background:rankColor,borderRadius:999,transition:"width .4s"}}></div></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
        <div className="stat-grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",marginBottom:18}}>
          <div className="stat"><div className="ic" style={{background:"rgba(30,64,175,.1)",color:"#1E40AF"}}><i className="fa-solid fa-sack-dollar"></i></div><div className="label">ประเมินค่าใช้จ่ายรวม</div><div className="val" style={{fontSize:22}}>{fmtBaht(costStats.total)}</div></div>
          <div className="stat"><div className="ic" style={{background:"rgba(16,185,129,.1)",color:"#10B981"}}><i className="fa-solid fa-circle-check"></i></div><div className="label">ปิดงาน/จ่ายแล้ว</div><div className="val" style={{fontSize:22}}>{fmtBaht(costStats.done)}</div></div>
          <div className="stat"><div className="ic" style={{background:"rgba(245,158,11,.1)",color:"#F59E0B"}}><i className="fa-solid fa-clock"></i></div><div className="label">ค้างอยู่ในระบบ</div><div className="val" style={{fontSize:22}}>{fmtBaht(costStats.pending)}</div></div>
          <div className="stat"><div className="ic" style={{background:"rgba(139,92,246,.1)",color:"#8B5CF6"}}><i className="fa-solid fa-chart-line"></i></div><div className="label">เฉลี่ย/งาน</div><div className="val" style={{fontSize:22}}>{fmtBaht(costStats.avg)}</div></div>
        </div>
        <div className="card" style={{marginBottom:18}}>
          <div className="card-h">
            <div><h3>ประเมินค่าใช้จ่าย</h3><div className="sub">แยกตาม{costView==="category"?"หมวดหมู่":costView==="project"?"โครงการ":"เครื่องจักร"} · {repairs.length} งาน · รวม {fmtBaht(costStats.total)}</div></div>
            <div className="seg" style={{display:"inline-flex",background:"var(--bg)",border:"1px solid var(--line)",borderRadius:10,padding:3}}>
              <button onClick={()=>setCostView("category")} style={{padding:"7px 14px",borderRadius:7,border:"none",fontSize:13,cursor:"pointer",background:costView==="category"?"var(--primary)":"transparent",color:costView==="category"?"#fff":"var(--muted)",fontFamily:"Kanit"}}><i className="fa-solid fa-tags"></i> หมวดหมู่</button>
              <button onClick={()=>setCostView("project")} style={{padding:"7px 14px",borderRadius:7,border:"none",fontSize:13,cursor:"pointer",background:costView==="project"?"var(--primary)":"transparent",color:costView==="project"?"#fff":"var(--muted)",fontFamily:"Kanit"}}><i className="fa-solid fa-diagram-project"></i> โครงการ</button>
              <button onClick={()=>setCostView("machine")} style={{padding:"7px 14px",borderRadius:7,border:"none",fontSize:13,cursor:"pointer",background:costView==="machine"?"var(--primary)":"transparent",color:costView==="machine"?"#fff":"var(--muted)",fontFamily:"Kanit"}}><i className="fa-solid fa-industry"></i> เครื่องจักร</button>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1.2fr 1fr",gap:0}}>
            <div className="card-body" style={{height:360,borderRight:"1px solid var(--line)"}}><canvas ref={costRef}></canvas></div>
            <div style={{maxHeight:360,overflowY:"auto"}}>
              <table className="data">
                <thead><tr><th>{costView==="category"?"หมวดหมู่":costView==="project"?"โครงการ":"เครื่องจักร"}</th><th style={{textAlign:"right"}}>งาน</th><th style={{textAlign:"right"}}>ค่าใช้จ่าย</th><th style={{textAlign:"right"}}>%</th></tr></thead>
                <tbody>
                  {(costView==="category"?costStats.byCat:costView==="project"?costStats.byProj:costStats.byMach).map((x,i)=>{
                    const pct = costStats.total ? (x.cost/costStats.total*100) : 0;
                    return (
                      <tr key={i}>
                        <td><span style={{display:"inline-flex",alignItems:"center",gap:8}}><span style={{width:10,height:10,borderRadius:"50%",background:x.color,display:"inline-block"}}></span><span style={{fontSize:13}}>{x.name}</span></span></td>
                        <td style={{textAlign:"right",color:"var(--muted)",fontSize:12.5}}>{x.count}</td>
                        <td style={{textAlign:"right",fontWeight:500,fontSize:13}}>{fmtBaht(x.cost)}</td>
                        <td style={{textAlign:"right",color:"var(--muted)",fontSize:12}}>{pct.toFixed(1)}%</td>
                      </tr>
                    );
                  })}
                  {(costView==="category"?costStats.byCat:costView==="project"?costStats.byProj:costStats.byMach).length===0 && (
                    <tr><td colSpan="4"><div className="empty" style={{padding:30}}><i className="fa-solid fa-chart-column"></i><div className="t" style={{fontSize:14}}>ยังไม่มีข้อมูลค่าใช้จ่าย</div></div></td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div className="card">
          <div className="card-h"><div><h3>รายการแจ้งซ่อมที่ยังดำเนินการอยู่</h3><div className="sub">{recent.length} รายการ · ยกเว้นงานที่เสร็จสมบูรณ์แล้ว</div></div><button className="btn btn-ghost btn-sm" onClick={()=>goTo("repairs")}>ดูทั้งหมด <i className="fa-solid fa-arrow-right"></i></button></div>
          <div className="table-wrap">
            <table className="data">
              <thead><tr><th>เลขที่</th><th>อาการ/ปัญหา</th><th className="hide-on-mobile">หมวดหมู่</th><th>สถานะ</th><th className="hide-on-mobile">ผู้แจ้ง</th><th className="hide-on-mobile">วันที่</th></tr></thead>
              <tbody>
                {recent.map(r=>(
                  <tr key={r.id}>
                    <td><span className="ticket-id" style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>setDashDetail(r)}>{r.running}</span></td>
                    <td><div className="cell-title">{r.title}</div></td>
                    <td className="hide-on-mobile"><CategoryChip categoryId={r.categoryId}/></td>
                    <td><Badge status={r.status}/></td>
                    <td className="hide-on-mobile"><Avatar name={r.reporterName}/>{r.reporterName}</td>
                    <td className="hide-on-mobile" style={{color:"var(--muted)"}}>{window.__DATA.fmtDate(r.createdAt)}</td>
                  </tr>
                ))}
                {recent.length===0&&(<tr><td colSpan="6"><div className="empty"><i className="fa-solid fa-circle-check" style={{color:"#10B981"}}></i><div className="t">ไม่มีงานค้างอยู่</div><div>งานทั้งหมดเสร็จสมบูรณ์แล้ว</div></div></td></tr>)}
              </tbody>
            </table>
          </div>
        </div>
      </>}
      {dashDetail && <window.RepairDetail r={dashDetail} onClose={()=>setDashDetail(null)} user={user} onQuick={null} onProblems={()=>setTick(t=>t+1)} onEdit={null} onEditParts={null}/>}
    </>
  );
}
window.Dashboard = Dashboard;
</script>

<script type="text/babel">
function Repairs({user}){
  const visibleRows = React.useMemo(()=>(
    window.filterByUserProjects(user, window.__DATA.repairs, "project")
  ),[user]);

  const [rows,setRows] = React.useState(visibleRows);
  React.useEffect(()=>{ setRows(visibleRows); },[visibleRows]);
  const [q,setQ] = React.useState("");
  const [status,setStatus] = React.useState("all");
  const [cat,setCat] = React.useState("all");
  const [filterProj,setFilterProj] = React.useState("all");
  const [filterMachType,setFilterMachType] = React.useState("all");
  const [detail,setDetail] = React.useState(null);
  const [editFor,setEditFor] = React.useState(null);
  const [loading,setLoading] = React.useState(false);

  const machCatMap = React.useMemo(()=>{
    const m={};
    (window.__DATA.machines||[]).forEach(x=>{if(x.code)m[x.code]=x.categoryId||"";});
    return m;
  },[]);

  const projOptions = React.useMemo(()=>[...new Set(rows.map(r=>r.project).filter(Boolean))].sort(),[rows]);
  const machTypeOptions = React.useMemo(()=>{
    const ids = new Set(rows.map(r=>machCatMap[r.machineCode]).filter(Boolean));
    return window.__DATA.categories.filter(c=>ids.has(c.id));
  },[rows,machCatMap]);

  const filtered = React.useMemo(()=>{
    return rows.filter(r=>{
      if(q){
        const qq = q.toLowerCase();
        if(!(r.running.toLowerCase().includes(qq) || r.title.toLowerCase().includes(qq) || (r.siteId||"").toLowerCase().includes(qq))) return false;
      }
      if(status!=="all" && r.status!==status) return false;
      if(cat!=="all" && r.categoryId!==cat) return false;
      if(filterProj!=="all" && (r.project||"")!==filterProj) return false;
      if(filterMachType!=="all" && machCatMap[r.machineCode]!==filterMachType) return false;
      if(user.role==="Technician"){
        if(!(r.assignedId===user.id || r.status==="new" || r.status==="assess")) return false;
      }
      return true;
    });
  },[rows,q,status,cat,filterProj,filterMachType,machCatMap,user]);

  const [assessFor, setAssessFor] = React.useState(null);

  const quickAction = async (r, next, actionLabel) => {
    if(next==="assess"){ setDetail(null); setAssessFor(r); return; }
    let cost = r.cost;
    if(next==="progress"){
      const { value, isConfirmed } = await Swal.fire({
        title:"อนุมัติซ่อม",
        input:"number",inputLabel:"ค่าใช้จ่ายโดยประมาณ (บาท)",inputValue:cost||"",inputPlaceholder:"เช่น 5000",
        showCancelButton:true,confirmButtonText:"อนุมัติและเริ่มซ่อม",cancelButtonText:"ยกเลิก",confirmButtonColor:"#1E40AF"
      });
      if(!isConfirmed) return;
      cost = Number(value)||cost;
    }
    if(next==="done"){
      const { isConfirmed } = await Swal.fire({title:"ปิดงานนี้หรือไม่?",text:"ยืนยันว่างานซ่อมเสร็จสมบูรณ์แล้ว",icon:"question",showCancelButton:true,confirmButtonText:"ใช่, ปิดงาน",cancelButtonText:"ยกเลิก",confirmButtonColor:"#10B981"});
      if(!isConfirmed) return;
    }
    setLoading(true);
    try{
      await window.api("updateRepairStatus", { id:r.id, status:next, by:user.name, note:actionLabel, cost });
      const updated = {...r, status:next, cost, timeline:[...r.timeline,{status:next,when:new Date(),by:user.name,note:actionLabel}]};
      const newRows = rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs = newRows;
      setLoading(false);
      Swal.fire({icon:"success",title:"อัปเดตสถานะสำเร็จ",text:actionLabel,timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){
      setLoading(false);
      Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message});
    }
  };

  const saveAssess = async (r, {parts, laborCost, cost}) => {
    setLoading(true);
    try{
      await window.api("updateRepairStatus",{id:r.id,status:"assess",by:user.name,note:"เริ่มประเมินราคา",cost,patch:{parts,laborCost}});
      const updated={...r,status:"assess",cost,parts,laborCost,timeline:[...r.timeline,{status:"assess",when:new Date(),by:user.name,note:"เริ่มประเมินราคา"}]};
      const newRows=rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs=newRows;
      setAssessFor(null); setLoading(false);
      Swal.fire({icon:"success",title:"บันทึกการประเมินแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ setLoading(false); Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const [editPartsFor, setEditPartsFor] = React.useState(null);

  const saveEditParts = async (r, {parts, laborCost, cost}) => {
    setLoading(true);
    try{
      await window.api("updateRepairStatus",{id:r.id,status:r.status,by:user.name,note:"แก้ไขรายการอะไหล่",cost,patch:{parts,laborCost}});
      const updated={...r,cost,parts,laborCost,timeline:[...r.timeline,{status:r.status,when:new Date(),by:user.name,note:"แก้ไขรายการอะไหล่"}]};
      const newRows=rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs=newRows;
      setEditPartsFor(null); setLoading(false);
      Swal.fire({icon:"success",title:"บันทึกรายการอะไหล่แล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ setLoading(false); Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const saveEdit = async (r, patch) => {
    setLoading(true);
    try{
      try {
        await window.api("updateRepair", { id:r.id, patch, by:user.name });
      } catch(e1) {
        if(/Unknown action/i.test(String(e1.message||e1))){
          const { status, cost, ...rest } = patch;
          await window.api("updateRepairStatus", {id:r.id,status:status||r.status,cost,by:user.name,note:"แก้ไขข้อมูลโดย Admin",patch:rest});
        } else { throw e1; }
      }
      const updated = {...r,...patch,timeline:[...r.timeline,{status:patch.status||r.status,when:new Date(),by:user.name,note:"แก้ไขข้อมูลโดย Admin"}]};
      const newRows = rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs = window.__DATA.repairs.map(x=>x.id===r.id?updated:x);
      setEditFor(null); setLoading(false);
      Swal.fire({icon:"success",title:"บันทึกการแก้ไขแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){
      setLoading(false);
      Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message});
    }
  };

  const deleteRepair = async (r) => {
    if(user.role!=="Admin") return;
    const { isConfirmed } = await Swal.fire({
      title:"ลบใบแจ้งซ่อมนี้?",
      html:`เลขที่ <b>${r.running}</b><br/><span style="color:#64748B">การลบไม่สามารถกู้คืนได้</span>`,
      icon:"warning",
      showCancelButton:true,
      confirmButtonText:"ใช่, ลบเลย",
      cancelButtonText:"ยกเลิก",
      confirmButtonColor:"#EF4444"
    });
    if(!isConfirmed) return;
    setLoading(true);
    try{
      await window.api("deleteRepair", { id:r.id, role:user.role });
      const newRows = rows.filter(x=>x.id!==r.id);
      setRows(newRows);
      window.__DATA.repairs = window.__DATA.repairs.filter(x=>x.id!==r.id);
      setLoading(false);
      Swal.fire({icon:"success",title:"ลบข้อมูลแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){
      setLoading(false);
      Swal.fire({icon:"error",title:"ลบไม่สำเร็จ",text:err.message});
    }
  };

  return (
    <>
      <Loading show={loading} text="กำลังบันทึก..."/>
      <div className="card">
        <div className="filters">
          <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหาเลขที่ใบงาน / อาการ..." value={q} onChange={e=>setQ(e.target.value)} /></div>
          <select value={status} onChange={e=>setStatus(e.target.value)}>
            <option value="all">ทุกสถานะ</option>
            {window.__DATA.statuses.map(s=>(<option key={s.key} value={s.key}>{s.label}</option>))}
          </select>
          <select value={cat} onChange={e=>setCat(e.target.value)}>
            <option value="all">ทุกหมวดหมู่</option>
            {window.__DATA.categories.map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}
          </select>
          <select value={filterProj} onChange={e=>setFilterProj(e.target.value)}>
            <option value="all">ทุกโครงการ</option>
            {projOptions.map(p=>(<option key={p} value={p}>{p}</option>))}
          </select>
          {machTypeOptions.length>0 && (
            <select value={filterMachType} onChange={e=>setFilterMachType(e.target.value)}>
              <option value="all">ทุกประเภทเครื่องจักร</option>
              {machTypeOptions.map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}
            </select>
          )}
          <div className="spacer"></div>
          <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>{filtered.length} / {rows.length} รายการ</div>
        </div>
        <div className="table-wrap">
          <table className="data">
            <thead><tr><th>เลขที่</th><th className="hide-on-mobile">เลขที่ไซต์งาน</th><th>วันที่แจ้ง</th><th>อาการ/ปัญหา</th><th>โครงการ/หน่วยงาน</th><th className="hide-on-mobile">หมวดหมู่</th><th>สถานะ</th><th className="hide-on-mobile">ผู้แจ้ง</th><th>จัดการ</th></tr></thead>
            <tbody>
              {filtered.map(r=>(
                <tr key={r.id}>
                  <td><span className="ticket-id" style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>setDetail(r)}>{r.running}</span></td>
                  <td className="hide-on-mobile"><span className="site-id">{r.siteId||"—"}</span></td>
                  <td style={{color:"var(--muted)",whiteSpace:"nowrap"}}>{window.__DATA.fmtDate(r.createdAt)}</td>
                  <td><div className="cell-title">{r.title}<div className="desc">{r.machineCode&&<span className="mono" style={{marginRight:6}}>{r.machineCode}</span>}{r.desc.slice(0,60)}{r.desc.length>60?"…":""}</div></div></td>
                  <td style={{fontSize:13}}><ProjectLabel name={r.project}/></td>
                  <td className="hide-on-mobile"><CategoryChip categoryId={r.categoryId}/></td>
                  <td><Badge status={r.status}/></td>
                  <td className="hide-on-mobile"><Avatar name={r.reporterName}/>{r.reporterName}</td>
                  <td>
                    <div className="row-actions">
                      <button className="ia" title="ดูรายละเอียด" onClick={()=>setDetail(r)}><i className="fa-solid fa-eye"></i></button>
                      {user.role==="Admin" && <button className="ia" title="ลบข้อมูล (Admin)" onClick={()=>deleteRepair(r)} style={{color:"#EF4444"}}><i className="fa-solid fa-trash"></i></button>}
                    </div>
                  </td>
                </tr>
              ))}
              {filtered.length===0 && (<tr><td colSpan="9"><div className="empty"><i className="fa-solid fa-folder-open"></i><div className="t">ไม่พบข้อมูล</div><div>ลองเปลี่ยนเงื่อนไขการค้นหา</div></div></td></tr>)}

      {assessFor && <AssessModal r={assessFor} onClose={()=>setAssessFor(null)} onSave={saveAssess}/>}
      {editPartsFor && <AssessModal r={editPartsFor} mode="edit" onClose={()=>setEditPartsFor(null)} onSave={saveEditParts}/>}
    </>
  );
}

function RepairDetail({r,onClose,user,onQuick,onEdit,onEditParts,onProblems}){
  const canAct = ["Admin","Officer","Technician"].includes(user.role) && !!onQuick;
  const [probs,setProbs] = React.useState(()=>window.getProblems(r));
  const setProbStatus = async (i, st) => {
    const next = probs.map((p,idx)=> idx===i?{...p,status:st}:p);
    const newStatus = window.deriveStatus(next, r.status);
    setProbs(next);
    try{
      await window.api("updateRepairProblems",{id:r.id, problems:next, status:newStatus, by:user.name, note:`ปรับสถานะ "${next[i].text}" → ${window.getStatus(st).label}`});
      const idx = window.__DATA.repairs.findIndex(x=>x.id===r.id);
      if(idx>-1){ window.__DATA.repairs[idx].problems = next; window.__DATA.repairs[idx].status = newStatus; }
      r.problems = next; r.status = newStatus;
      if(onProblems) onProblems(r.id, next, newStatus);
    }catch(err){ setProbs(probs); Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

window.getProblems = function(r){
  if(Array.isArray(r.problems) && r.problems.length){
    return r.problems.map(p=>({text:String(p.text||""),status:p.status||r.status||"new"}));
  }
  return String(r.title||"").split("\n").map(s=>s.trim()).filter(Boolean).map(t=>({text:t,status:r.status||"new"}));
};

// สรุปสถานะรวมของใบแจ้งซ่อมจากสถานะรายอาการ — ใบงานจะ "เสร็จสมบูรณ์" ก็ต่อเมื่อทุกอาการเสร็จ
// และจะแสดงสถานะของอาการที่คืบหน้าน้อยที่สุดที่ยังไม่เสร็จ (ยกเว้นอาการที่ถูกยกเลิก)
window.deriveStatus = function(problems, fallback){
  const list = (problems||[]).filter(p=>p && p.status);
  if(!list.length) return fallback || "new";
  const active = list.filter(p=>p.status!=="cancel");
  if(!active.length) return "cancel";
  if(active.every(p=>p.status==="done")) return "done";
  const order = { new:0, assess:1, parts:2, progress:3, done:4 };
  let best = fallback || "new", bestRank = 99;
  active.forEach(p=>{
    if(p.status==="done") return;
    const rank = (p.status in order) ? order[p.status] : 0;
    if(rank < bestRank){ bestRank = rank; best = p.status; }
  });
  return best;
};

window.getRepairPlace = function(r){
  const base = {mode:"", onsite:"", other:"", reportAt:"", note:""};
  const p = r.repairPlace;
  return (p && typeof p==="object" && !Array.isArray(p)) ? Object.assign(base, p) : base;
};

window.buildRepairFormDoc = function(r, user){
  const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const m = (window.__DATA.machines||[]).find(x=>x.code===r.machineCode) || {};
  const cat = (window.getCategory && window.getCategory(r.categoryId)) || {};
  const probs = window.getProblems(r);
  const fmtDate = d => { if(!d) return ""; const dt=new Date(d); if(isNaN(dt)) return ""; const y=(dt.getFullYear()+543)%100; return dt.getDate()+"/"+(dt.getMonth()+1)+"/"+String(y).padStart(2,"0"); };
  const dateStr = fmtDate(r.createdAt);
  // ข้อมูลที่กรอก = ตัวอักษรสีน้ำเงิน (แยกจากตัวฟอร์มที่เป็นสีดำ)
  const fill = v => v?("<span class='fld'>"+esc(v)+"</span>"):"";
  const rp = window.getRepairPlace(r);
  const projCode = window.getProjectCode ? window.getProjectCode(r.project) : "";
  const projLabel = r.project ? (projCode ? "["+projCode+"] "+r.project : r.project) : "";
  const box = on => "<span class='chk'>"+(on?"✓":"")+"</span>";
  const rowCount = Math.max(5, probs.length);
  let rows = "";
  for(let i=0;i<rowCount;i++){ const p=probs[i]; rows += "<tr><td class='c-no'>"+(i+1)+"</td><td class='c-item'>"+fill(p&&p.text)+"</td><td class='c-insp'></td></tr>"; }
  const logo = "<img src='"+window.PNM_LOGO_DATAURL+"' width='92' alt='' style='display:block'>";
  const html = "<!doctype html><html lang='th'><head><meta charset='utf-8'><title>ใบแจ้งซ่อม "+esc(r.running)+"</title><style>"
    + "@page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:'Sarabun',Tahoma,Arial,sans-serif;color:#000;font-size:13px;margin:0}"
    + ".sheet{width:186mm;margin:0 auto}.hd{display:flex;align-items:center;gap:14px;margin-bottom:2px}.hd-title{flex:1;text-align:center}.cn-th{font-size:22px;font-weight:700}.cn-en{font-size:15px;font-weight:700;letter-spacing:.5px}.hd-sp{width:92px}"
    + ".doc-title{text-align:center;font-size:16px;font-weight:700;margin:6px 0 12px}"
    + ".row2{display:flex;justify-content:space-between;margin-bottom:8px}"
    + ".info .ln{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:5px 0}"
    + "b{font-weight:600;white-space:nowrap}"
    + ".dot{border-bottom:1px dotted #000;min-height:16px;padding:0 4px;text-align:center;display:inline-block}"
    + ".f1{flex:1;min-width:70px}.f2{flex:2;min-width:120px}.w180{width:180px}.w120{width:120px}.fwide{flex:1;min-width:300px}"
    + ".box{border:1.5px solid #000;margin:10px 0}.box-hd{text-align:center;font-weight:700;border-bottom:1.5px solid #000;padding:5px;background:#f2f2f2}"
    + ".rt{width:100%;border-collapse:collapse}.rt th,.rt td{border:1px solid #000;padding:5px 8px;font-size:13px}.rt thead th{background:#fafafa}.rt .c-no{width:8%;text-align:center}.rt .c-item{width:64%}.rt .c-insp{width:28%;text-align:center}.rt tbody td{height:26px}"
    + ".sig{width:100%;border-collapse:collapse;margin:10px 0}.sig th,.sig td{border:1px solid #000;text-align:center;padding:6px 4px;font-size:12px}.sig th{font-weight:600}.sig .sig-name td{height:34px;vertical-align:bottom;font-weight:600}.sig .sig-paren td{color:#000}.sig .sig-date td{font-size:12px}"
    + ".loc{padding:8px 10px}.loc .ln{display:flex;align-items:baseline;gap:6px;margin:6px 0;flex-wrap:wrap}.loc .indent{padding-left:120px}"
    + ".chk{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:1.3px solid #000;margin-right:5px;font-size:11px;line-height:1;font-weight:700;vertical-align:middle}"
    + ".fld{color:#1D4ED8;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}"
    + "</style></head><body><div class='sheet'>"
    + "<div class='hd'><div>"+logo+"</div><div class='hd-title'><div class='cn-th'>บริษัท พานามณี จำกัด</div><div class='cn-en'>PANAMANEE COMPANY LIMITED</div></div><div class='hd-sp'></div></div>"
    + "<div class='doc-title'>ใบแจ้งซ่อมเครื่องจักรและอุปกรณ์</div>"
    + "<div class='row2'><div>เลขที่ <span class='dot w180'>"+fill(r.running)+"</span></div><div>วันที่ <span class='dot w120'>"+fill(dateStr)+"</span></div></div>"
    + "<div class='info'>"
    + "<div class='ln'><b>ประเภทเครื่องจักร</b><span class='dot f2'>"+fill(cat.name)+"</span><b>หมายเลขเครื่องจักร</b><span class='dot f2'>"+fill(r.machineCode)+"</span><b>กรรมสิทธิ์</b><span class='dot f1'>"+fill(m.ownership)+"</span></div>"
    + "<div class='ln'><b>ยี่ห้อ</b><span class='dot f1'>"+fill(m.brand)+"</span><b>รุ่น</b><span class='dot f1'>"+fill(m.model)+"</span><b>ขนาด</b><span class='dot f1'>"+fill(m.size)+"</span><b>ปี</b><span class='dot f1'>"+fill(m.year)+"</span><b>ทะเบียน</b><span class='dot f1'></span></div>"
    + "<div class='ln'><b>Serial No.</b><span class='dot f1'>"+fill(m.serial)+"</span><b>Engine No.</b><span class='dot f1'></span><b>Chassis No.</b><span class='dot f1'></span></div>"
    + "<div class='ln'><b>เลขมิเตอร์กิโลเมตร</b><span class='dot f1'></span><b>เลขมิเตอร์ชั่วโมง</b><span class='dot f1'>"+fill(m.hours)+"</span></div>"
    + "<div class='ln'><b>หน่วยงาน</b><span class='dot f1'>"+fill(projLabel)+"</span><b>สถานที่</b><span class='dot f1'>"+fill(m.location)+"</span></div>"
    + "</div>"
    + "<div class='box'><div class='box-hd'>รายการซ่อม (อาการผิดปกติ)</div><table class='rt'><thead><tr><th class='c-no'></th><th class='c-item'>รายการ</th><th class='c-insp'>ผู้ตรวจพบ</th></tr></thead><tbody>"+rows+"</tbody></table></div>"
    + "<table class='sig'><tr><th>พนักงานขับ</th><th>ผู้จัดทำเอกสาร/ ผู้รับแจ้ง</th><th>หัวหน้าแผนกปฏิบัติการ</th><th>ผู้จัดการฝ่ายบริหาร</th></tr>"
    + "<tr class='sig-name'><td>"+fill(m.driverName)+"</td><td>"+fill(r.reporterName)+"</td><td></td><td></td></tr>"
    + "<tr class='sig-paren'><td>( ...................... )</td><td>( ...................... )</td><td>( ...................... )</td><td>( ...................... )</td></tr>"
    + "<tr class='sig-date'><td>วันที่ "+fill(dateStr)+"</td><td>วันที่ "+fill(dateStr)+"</td><td>วันที่ ..............</td><td>วันที่ ..............</td></tr></table>"
    + "<div class='box'><div class='box-hd'>สถานที่ทำการซ่อม</div><div class='loc'>"
    + "<div class='ln'><b>แจ้งซ่อมที่</b><span class='dot fwide'>"+fill(rp.reportAt)+"</span></div>"
    + "<div class='ln'><b>สถานที่ทำการซ่อม</b>"+box(rp.mode==="onsite")+"ส่งช่างซ่อมหน้างาน ที่ <span class='dot f1'>"+fill(rp.onsite)+"</span></div>"
    + "<div class='ln indent'>"+box(rp.mode==="workshop")+"โรงซ่อมของบริษัทที่แจ้งซ่อม</div>"
    + "<div class='ln indent'>"+box(rp.mode==="other")+"อื่นๆ <span class='dot f1'>"+fill(rp.other)+"</span></div>"
    + "<div class='ln'><b>หมายเหตุ</b><span class='dot fwide'>"+fill(rp.note)+"</span></div>"
    + "</div></div>"
    + "</div></body></html>";
  return html;
};

window.printRepairForm = function(r, user){
  const w = window.open("", "_blank");
  if(!w){ Swal.fire({icon:"warning",title:"เปิดหน้าต่างพิมพ์ไม่ได้",text:"กรุณาอนุญาต popup ของเบราว์เซอร์"}); return; }
  w.document.open(); w.document.write(window.buildRepairFormDoc(r,user)); w.document.close(); w.focus();
  w.onload = ()=>{ try{ w.print(); }catch(e){} };
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 500);
};

window.shareRepairImage = async function(r, user){
  const ensureH2C = async () => {
    if(window.html2canvas) return window.html2canvas;
    await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"; s.onload=res; s.onerror=()=>rej(new Error("โหลดตัวแปลงรูปไม่ได้")); document.head.appendChild(s); });
    return window.html2canvas;
  };
  let iframe;
  try{
    Swal.fire({title:"กำลังสร้างรูป...",allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
    const H2C = await ensureH2C();
    iframe = document.createElement("iframe");
    iframe.style.cssText = "position:fixed;left:-100000px;top:0;width:760px;height:1200px;border:0;background:#fff";
    document.body.appendChild(iframe);
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open(); doc.write(window.buildRepairFormDoc(r,user)); doc.close();
    await new Promise(res=>setTimeout(res, 500));
    // เว้นขอบขาวรอบใบงานก่อนแปลงเป็นรูป (แคปทั้ง body ที่ใส่ padding ไว้ — ไม่กระทบตอนสั่งพิมพ์)
    doc.body.style.padding = "28px 24px";
    doc.body.style.background = "#ffffff";
    const node = doc.body;
    const canvas = await H2C(node, {scale:2, backgroundColor:"#ffffff", useCORS:true, windowWidth:node.scrollWidth||760});
    const blob = await new Promise(res=>canvas.toBlob(res,"image/png"));
    const dataUrl = canvas.toDataURL("image/png");
    const fname = "ใบแจ้งซ่อม-"+String(r.running||"").replace(/[\\/]/g,"-")+".png";
    const file = new File([blob], fname, {type:"image/png"});
    Swal.close();
    window.__showShareSheet(r, blob, dataUrl, file, fname);
  }catch(err){
    Swal.close();
    if(!(err && err.name==="AbortError")) Swal.fire({icon:"error",title:"แชร์รูปไม่สำเร็จ",text:(err&&err.message)||String(err)});
  }finally{
    if(iframe) iframe.remove();
  }
};

// ป็อปอัพพรีวิว + ปุ่มแชร์ (ต้องเรียก navigator.share ใน gesture ที่ผู้ใช้กดปุ่มเอง ไม่งั้นมือถือจะบล็อก)
window.__showShareSheet = function(r, blob, dataUrl, file, fname){
  const runTxt = String(r.running||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const canShareFiles = !!(navigator.canShare && navigator.canShare({files:[file]}));
  const canCopy = !!(navigator.clipboard && window.ClipboardItem && window.isSecureContext);
  const hint = canShareFiles
    ? "มือถือ: กด &quot;ส่ง / แชร์&quot; แล้วเลือก LINE&nbsp;&nbsp;·&nbsp;&nbsp;คอม: กด &quot;คัดลอกรูป&quot; แล้ววางในแชท (Ctrl+V)"
    : (canCopy ? "กด &quot;คัดลอกรูป&quot; แล้ววางในแชท LINE ได้เลย (Ctrl+V)" : "กด &quot;ดาวน์โหลด&quot; แล้วส่งรูปเข้า LINE เอง");
  const dl = ()=>{ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); };
  const btn = (act,bg,color,border,label,icon)=>"<button data-act='"+act+"' style='flex:1;min-width:120px;padding:11px 14px;border:"+border+";border-radius:8px;background:"+bg+";color:"+color+";font-weight:600;cursor:pointer'><i class='fa-solid "+icon+"'></i> "+label+"</button>";
  const scrim = document.createElement("div");
  scrim.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px";
  scrim.innerHTML = "<div style='background:#fff;color:#111827;border-radius:14px;max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)'>"
    + "<div style='font-weight:700;font-size:15px;margin-bottom:2px'>ใบแจ้งซ่อม "+runTxt+"</div>"
    + "<div style='font-size:12px;color:#64748B;margin-bottom:10px'>"+hint+"</div>"
    + "<img src='"+dataUrl+"' style='max-width:100%;border:1px solid #e5e7eb;border-radius:8px'/>"
    + "<div style='display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center'>"
    + (canShareFiles?btn("share","#06C755","#fff","0","ส่ง / แชร์","fa-share-nodes"):"")
    + (canCopy?btn("copy","#1E40AF","#fff","0","คัดลอกรูป","fa-copy"):"")
    + btn("dl","#fff","#111","1px solid #cbd5e1","ดาวน์โหลด","fa-download")
    + "</div>"
    + "<button data-act='close' style='margin-top:8px;width:100%;padding:9px;border:0;border-radius:8px;background:#f1f5f9;color:#475569;cursor:pointer'>ปิด</button>"
    + "</div>";
  document.body.appendChild(scrim);
  const close = ()=>scrim.remove();
  scrim.addEventListener("click", e=>{ if(e.target===scrim) close(); });
  scrim.querySelector("[data-act='close']").onclick = close;
  scrim.querySelector("[data-act='dl']").onclick = ()=>{ dl(); close(); };
  const sb = scrim.querySelector("[data-act='share']");
  if(sb) sb.onclick = async ()=>{
    try{ await navigator.share({files:[file], title:"ใบแจ้งซ่อม "+(r.running||""), text:"ใบแจ้งซ่อม "+(r.running||"")}); close(); }
    catch(err){ if(err && err.name!=="AbortError") Swal.fire({icon:"error",title:"แชร์ไม่สำเร็จ",text:(err&&err.message)||String(err)}); }
  };
  const cp = scrim.querySelector("[data-act='copy']");
  if(cp) cp.onclick = async ()=>{
    try{
      await navigator.clipboard.write([new ClipboardItem({[blob.type||"image/png"]: blob})]);
      close();
      Swal.fire({icon:"success",title:"คัดลอกรูปแล้ว",text:"ไปที่แชท LINE แล้ววาง (Ctrl+V) ได้เลย",timer:2600,showConfirmButton:false});
    }catch(e){ Swal.fire({icon:"error",title:"คัดลอกไม่ได้",text:"เบราว์เซอร์นี้อาจไม่รองรับ ลองใช้ดาวน์โหลดแทน"}); }
  };
};

function ProblemsField({value,onChange,disabled,placeholder}){
  const list = (value && value.length) ? value.split("\n") : [""];
  const commit = (arr)=>onChange(arr.join("\n"));
  const setAt = (i,v)=>{ const a=list.slice(); a[i]=v; commit(a); };
  const add = ()=>commit(list.concat([""]));
  const removeAt = (i)=>{ const a=list.filter((_,idx)=>idx!==i); commit(a.length?a:[""]); };
  return (
    <div style={{display:"grid",gap:8}}>
      {list.map((p,i)=>(
        <div key={i} style={{display:"flex",gap:8,alignItems:"center"}}>
          <span style={{width:20,textAlign:"right",color:"var(--muted)",fontSize:13,flexShrink:0}}>{i+1}.</span>
          <input className="inp" style={{flex:1}} value={p} disabled={disabled} onChange={e=>setAt(i,e.target.value)} placeholder={placeholder||"เช่น มอเตอร์ไหม้ ใช้งานไม่ได้"} />
          <button type="button" className="ia" title="ลบอาการนี้" disabled={disabled||list.length<=1} onClick={()=>removeAt(i)} style={{color:"#EF4444",opacity:(disabled||list.length<=1)?0.35:1,flexShrink:0}}><i className="fa-solid fa-trash"></i></button>
        </div>
      ))}
      <div><button type="button" className="btn btn-ghost btn-sm" disabled={disabled} onClick={add}><i className="fa-solid fa-plus"></i> เพิ่มอาการ</button></div>
    </div>
  );
}

function EditRepairModal({r,onClose,onSave}){

  const [f,setF] = React.useState({title:r.title||"",desc:r.desc||"",repairNote:r.repairNote||"",siteId:r.siteId||"",machineCode:r.machineCode||"",project:r.project||"",categoryId:r.categoryId||"",status:r.status||"new",reporterName:r.reporterName||"",assignedId:r.assignedId||"",cost:r.cost||"",createdAt:toDateStr(r.createdAt)});
  const set = (k,v)=>setF(p=>({...p,[k]:v}));
  const submit = () => { const title = (f.title||"").split("\n").map(s=>s.trim()).filter(Boolean).join("\n"); const existing = window.getProblems(r); const problems = title.split("\n").filter(Boolean).map((t,i)=>({text:t, status:(existing[i]&&existing[i].status)||r.status||"new"})); const patch = {...f, title, problems, cost: f.cost===""?"":Number(f.cost)||0, createdAt: f.createdAt ? new Date(f.createdAt).toISOString() : r.createdAt}; onSave(r, patch); };
  const technicians = (window.__DATA.users||[]).filter(u=>["Technician","Officer","Admin","Engineer"].includes(u.role));

      <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",color:"#1E40AF",padding:"10px 14px",borderRadius:8,fontSize:13,marginBottom:16}}>
        <i className="fa-solid fa-pen-to-square" style={{marginRight:6}}></i>โหมดแก้ไข — แก้ไขข้อมูลใบแจ้งซ่อมได้ทุกฟิลด์ ประวัติการแก้ไขจะถูกบันทึกไว้ใน Timeline
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:14}}>
        <div style={{gridColumn:"1 / -1"}}><label className="k">อาการ/ปัญหา</label><ProblemsField value={f.title} onChange={v=>set("title",v)} /></div>
        <div style={{gridColumn:"1 / -1"}}><label className="k">รายละเอียดปัญหา</label><textarea className="inp" rows="2" value={f.desc} onChange={e=>set("desc",e.target.value)} /></div>
        <div style={{gridColumn:"1 / -1"}}><label className="k" style={{color:"var(--primary)",fontWeight:500}}>รายละเอียดการซ่อม <span style={{fontWeight:400,color:"var(--muted)"}}>(บันทึกโดยช่าง/เจ้าหน้าที่)</span></label><textarea className="inp" rows="3" placeholder="บันทึกขั้นตอนการซ่อม วิธีแก้ไข อุปกรณ์ที่ใช้..." value={f.repairNote} onChange={e=>set("repairNote",e.target.value)} /></div>
        <div><label className="k">เลขที่ไซต์งาน</label><input className="inp" value={f.siteId} onChange={e=>set("siteId",e.target.value)} /></div>
        <div><label className="k">รหัสเครื่องจักร</label>
          <input className="inp" list="edit-machine-dl" value={f.machineCode} onChange={e=>{const code=e.target.value;const m=(window.__DATA.machines||[]).find(x=>x.code===code);setF(p=>({...p,machineCode:code,...(m&&!p.project?{project:m.project||""}:{})}));}} placeholder="พิมพ์หรือเลือกรหัสเครื่องจักร..." />

    </Modal>
  );
}
function AssessModal({r, onClose, onSave, mode="assess"}){
  const initParts = (r.parts && r.parts.length>0)
    ? r.parts.map(p=>({name:p.name||"",qty:p.qty||1,unitPrice:p.unitPrice||0,supplier:p.supplier||""}))
    : [{name:"",qty:1,unitPrice:0,supplier:""}];
  const [parts,setParts] = React.useState(initParts);
  const [laborCost,setLaborCost] = React.useState(r.laborCost||"");

  const addPart = () => setParts(p=>[...p,{name:"",qty:1,unitPrice:0,supplier:""}]);
  const removePart = (i) => setParts(p=>p.filter((_,idx)=>idx!==i));
  const upPart = (i,k,v) => setParts(p=>{ const a=[...p]; a[i]={...a[i],[k]:v}; return a; });

  const partsTotal = parts.reduce((s,p)=>s+(Number(p.qty)||0)*(Number(p.unitPrice)||0),0);
  const total = partsTotal + (Number(laborCost)||0);
  const fmt = (n) => Math.round(Number(n)||0).toLocaleString();

  const inStyle = {width:"100%",padding:"7px 10px",border:"1px solid var(--line)",borderRadius:7,fontFamily:"Kanit",fontSize:13,outline:"none",background:"#fff"};

  const submit = () => {
    const cleanParts = parts.filter(p=>p.name.trim()).map(p=>({name:p.name.trim(),qty:Number(p.qty)||1,unitPrice:Number(p.unitPrice)||0,total:(Number(p.qty)||1)*(Number(p.unitPrice)||0),supplier:p.supplier.trim()}));
    onSave(r,{parts:cleanParts,laborCost:Number(laborCost)||0,cost:total});
  };

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={mode==="edit"
        ? <><i className="fa-solid fa-list-check" style={{color:"var(--primary)",marginRight:8}}></i>แก้ไขรายการอะไหล่ · <span className="ticket-id" style={{marginLeft:4}}>{r.running}</span></>

      footer={<>
        <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-floppy-disk"></i> {mode==="edit"?"บันทึกการแก้ไข":"บันทึกการประเมิน"}</button>
      </>}>

      {/* Parts */}
      <div style={{marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{fontWeight:600,fontSize:14}}><i className="fa-solid fa-box-open" style={{color:"var(--primary)",marginRight:6}}></i>รายการอะไหล่</div>
          <button className="btn btn-ghost btn-sm" onClick={addPart}><i className="fa-solid fa-plus"></i> เพิ่มรายการ</button>
        </div>
        <div style={{border:"1px solid var(--line)",borderRadius:10,overflow:"hidden"}}>
          <div className="table-scroll">
          <table style={{width:"100%",minWidth:520,borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:"#FAFBFC"}}>
                <th style={{padding:"9px 12px",textAlign:"left",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)"}}>ชื่ออะไหล่ / รายการ</th>
                <th style={{padding:"9px 10px",textAlign:"left",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:150}}>แหล่งซื้อ</th>
                <th style={{padding:"9px 8px",textAlign:"center",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:72}}>จำนวน</th>

                <th style={{padding:"9px 12px",textAlign:"right",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:100}}>รวม (฿)</th>
                <th style={{width:36,borderBottom:"1px solid var(--line)"}}></th>
              </tr>
            </thead>
            <tbody>
              {parts.map((p,i)=>(
                <tr key={i} style={{borderBottom:i<parts.length-1?"1px solid var(--line-soft)":""}}>

                    <input value={p.name} onChange={e=>upPart(i,"name",e.target.value)} placeholder="เช่น สายพาน, น้ำมันไฮดรอลิก..." style={inStyle}/>

                  </td>
                  <td style={{padding:"4px 6px 4px 0"}}>
                    {parts.length>1 && <button className="ia danger" onClick={()=>removePart(i)} title="ลบ"><i className="fa-solid fa-xmark"></i></button>}
                  </td>
                </tr>
              ))}
            </tbody>

        </div>

        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <input type="number" min="0" value={laborCost} onChange={e=>setLaborCost(e.target.value)} placeholder="0" style={{width:"100%",maxWidth:200,padding:"9px 12px",border:"1px solid var(--line)",borderRadius:10,fontFamily:"Kanit",fontSize:14,outline:"none"}}/>
          <span style={{color:"var(--muted)",fontSize:13}}>บาท</span>
        </div>
      </div>

      {/* Summary */}
      <div style={{background:"linear-gradient(135deg,rgba(30,64,175,.06),rgba(139,92,246,.06))",border:"1px solid rgba(30,64,175,.18)",borderRadius:12,padding:"16px 20px"}}>
        <div style={{fontWeight:600,fontSize:14,color:"var(--primary)",marginBottom:12}}><i className="fa-solid fa-calculator" style={{marginRight:6}}></i>สรุปค่าใช้จ่าย</div>
        <div style={{display:"grid",gap:8}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}>
            <span style={{color:"var(--muted)"}}>ค่าอะไหล่รวม ({parts.filter(p=>p.name.trim()).length} รายการ)</span>
            <span style={{fontWeight:500,fontFamily:"JetBrains Mono,monospace",fontSize:12.5}}>฿{fmt(partsTotal)}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}>
            <span style={{color:"var(--muted)"}}>ค่าแรงช่างซ่อม</span>
            <span style={{fontWeight:500,fontFamily:"JetBrains Mono,monospace",fontSize:12.5}}>฿{fmt(laborCost)}</span>
          </div>

<script type="text/babel">
function Users({user}){
  const [rows,setRows] = React.useState(window.__DATA.users);
  const [edit,setEdit] = React.useState(null);
  const [q,setQ] = React.useState("");
  const filtered = rows.filter(u=>!q||(u.name.toLowerCase()+u.username).includes(q.toLowerCase()));

  const save = async (form) => {
    try{
      if(form.id){
        await window.api("updateUser",{id:form.id, patch:form});
        const upd = rows.map(x=>x.id===form.id?form:x);
        setRows(upd); window.__DATA.users = upd;
        try{
          const cur = JSON.parse(localStorage.getItem("rms_user")||"null");
          if(cur && cur.id===form.id){
            localStorage.setItem("rms_user", JSON.stringify(form));
            Swal.fire({icon:"info",title:"อัปเดตสิทธิ์แล้ว",text:"กำลังโหลดหน้าใหม่เพื่อใช้สิทธิ์ล่าสุด",timer:1500,showConfirmButton:false}).then(()=>location.reload());
            return;
          }
        }catch(e){}
      } else {
        const nu = await window.api("createUser",{user:form});
        const upd = [...rows, nu]; setRows(upd); window.__DATA.users = upd;
      }
      setEdit(null);
      Swal.fire({icon:"success",title:"บันทึกสำเร็จ",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const del = (u) => {
    Swal.fire({title:"ลบผู้ใช้งาน?",text:`ต้องการลบ "${u.name}" ใช่หรือไม่?`,icon:"warning",showCancelButton:true,confirmButtonText:"ลบ",cancelButtonText:"ยกเลิก",confirmButtonColor:"#EF4444"}).then(async r=>{
      if(r.isConfirmed){
        try{
          await window.api("deleteUser",{id:u.id});
          const upd = rows.filter(x=>x.id!==u.id); setRows(upd); window.__DATA.users = upd;
          Swal.fire({icon:"success",title:"ลบแล้ว",timer:1000,showConfirmButton:false,toast:true,position:"top-end"});
        }catch(err){ Swal.fire({icon:"error",title:"ลบไม่สำเร็จ",text:err.message}); }
      }
    });
  };

  const [revealedPw,setRevealedPw] = React.useState({});
  const togglePw = async (u) => {
    if(revealedPw[u.id]!==undefined){ setRevealedPw(p=>{const n={...p};delete n[u.id];return n;}); return; }
    try{
      const {password} = await window.api("getUserPassword",{id:u.id});
      setRevealedPw(p=>({...p,[u.id]:password}));
    }catch(err){ Swal.fire({icon:"error",title:"ไม่สำเร็จ",text:err.message}); }
  };

  const roleColors = {Admin:"#1E40AF",Officer:"#8B5CF6",Technician:"#F59E0B",Engineer:"#06B6D4",Reporter:"#10B981",Director:"#EF4444"};

  const renderProjectAccess = (u) => {
    const hasAll = ["Admin","Director"].includes(u.role) || !Array.isArray(u.projects) || u.projects.length===0;
    if(hasAll) return <span className="badge" style={{background:"rgba(30,64,175,.1)",color:"#1E40AF",fontSize:11.5}}><i className="fa-solid fa-globe" style={{marginRight:4}}></i>ทุกโครงการ</span>;
    if(u.projects.length<=2) return <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{u.projects.map(p=>(<span key={p} className="badge" style={{background:"var(--line-soft)",color:"var(--text)",fontSize:11.5}}>{p}</span>))}</div>;
    return <span className="badge" style={{background:"var(--line-soft)",color:"var(--text)",fontSize:11.5}} title={u.projects.join(", ")}><i className="fa-solid fa-folder" style={{marginRight:4}}></i>{u.projects.length} โครงการ</span>;
  };

  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหาชื่อ หรือ username..." value={q} onChange={e=>setQ(e.target.value)} /></div>
        <div className="spacer"></div>
        <button className="btn btn-primary" onClick={()=>setEdit({username:"",password:"",name:"",role:"Reporter",dept:"",email:"",projects:[]})}><i className="fa-solid fa-plus"></i> เพิ่มผู้ใช้งาน</button>
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr><th>Username</th><th>ชื่อ-นามสกุล</th><th className="hide-on-mobile">ตำแหน่ง</th><th className="hide-on-mobile">หน่วยงาน</th><th className="hide-on-mobile">สิทธิ์เข้าถึงโครงการ</th><th className="hide-on-mobile">อีเมล</th>{user.role==="Admin"&&<th>รหัสผ่าน</th>}<th>จัดการ</th></tr></thead>
          <tbody>
            {filtered.map(u=>(
              <tr key={u.id}>
                <td><span className="mono" style={{background:"var(--line-soft)",padding:"2px 7px",borderRadius:6,fontSize:12.5}}>{u.username}</span></td>
                <td><Avatar name={u.name}/>{u.name}</td>
                <td className="hide-on-mobile"><span className="badge" style={{background:roleColors[u.role]+"22",color:roleColors[u.role]}}><span className="dot"></span>{u.role}</span></td>

                    {revealedPw[u.id]!==undefined ? revealedPw[u.id] : "••••••"}

  const selectAll = () => setF(prev=>({...prev,projects:[...allProjects]}));
  const clearAll = () => setF(prev=>({...prev,projects:[]}));
  const submit = () => {
    if(!f.username||!f.name){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาใส่ Username และชื่อ-นามสกุล"}); return; }

    <Modal open={true} onClose={onClose} size="lg" title={init.id?"แก้ไขผู้ใช้งาน":"เพิ่มผู้ใช้งานใหม่"}

        <div className="form-field"><label>Username *</label><input value={f.username} onChange={e=>setF({...f,username:e.target.value})} /></div>

        <div className="form-field full"><label>ชื่อ-นามสกุล *</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} /></div>
        <div className="form-field"><label>ตำแหน่ง/บทบาท</label><select value={f.role} onChange={e=>setF({...f,role:e.target.value})}>{roles.map(r=>(<option key={r} value={r}>{r}</option>))}</select></div>

          </label>
          {isSuperRole ? (
            <div style={{padding:14,background:"rgba(30,64,175,.06)",border:"1px solid rgba(30,64,175,.2)",borderRadius:10,fontSize:13,color:"var(--primary)"}}>
              <i className="fa-solid fa-shield-halved" style={{marginRight:8}}></i>บทบาท <strong>{f.role}</strong> เห็นข้อมูลได้ทุกโครงการโดยอัตโนมัติ
            </div>
          ) : (
            <>
              <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                <button type="button" className="btn btn-ghost btn-sm" onClick={selectAll}><i className="fa-solid fa-check-double"></i> เลือกทั้งหมด</button>
                <button type="button" className="btn btn-ghost btn-sm" onClick={clearAll}><i className="fa-solid fa-xmark"></i> ยกเลิกทั้งหมด</button>
                <div style={{flex:1}}></div>
                <div style={{fontSize:11.5,color:"var(--muted)",alignSelf:"center"}}>ไม่เลือกเลย = เห็นทุกโครงการ</div>
              </div>
              {allProjects.length===0 ? (
                <div style={{padding:14,background:"var(--bg)",border:"1px dashed var(--line)",borderRadius:10,fontSize:13,color:"var(--muted)",textAlign:"center"}}><i className="fa-solid fa-circle-info"></i> ยังไม่มีโครงการในระบบ</div>
              ) : (
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:8,padding:12,background:"var(--bg)",border:"1px solid var(--line)",borderRadius:10,maxHeight:260,overflowY:"auto"}}>
                  {allProjects.map(p=>{
                    const on = (f.projects||[]).includes(p);
                    return (
                      <label key={p} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:8,cursor:"pointer",background:on?"rgba(30,64,175,.08)":"#fff",border:`1px solid ${on?"rgba(30,64,175,.4)":"var(--line)"}`,fontSize:13,transition:"all .15s"}}>
                        <input type="checkbox" checked={on} onChange={()=>toggleProject(p)} style={{margin:0,cursor:"pointer",accentColor:"var(--primary)",width:16,height:16}} />
                        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p}</span>
                      </label>
                    );
                  })}
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </Modal>
  );
}
window.Users = Users;
</script>
