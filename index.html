<script type="text/babel">
function gdriveThumb(url, sz=600){
  if(!url) return null;
  let m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(!m) m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(!m) return null;
  return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${sz}`;
}

// โหลดไลบรารีสร้างไฟล์ Excel แบบ on-demand (ไม่ถ่วงตอนเปิดเว็บ)
async function ensureXLSX(){
  if(window.XLSX) return window.XLSX;
  await new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload=res; s.onerror=()=>rej(new Error("โหลดตัวสร้างไฟล์ Excel ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต"));
    document.head.appendChild(s);
  });
  return window.XLSX;
}

async function exportMachinesExcel(list){
  if(!list || list.length===0){ Swal.fire({icon:"info",title:"ไม่มีข้อมูลให้ส่งออก"}); return; }
  try{
    Swal.fire({title:"กำลังสร้างไฟล์ Excel...",allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
    const XLSX = await ensureXLSX();
    const data = list.map((m,i)=>({
      "ลำดับ": i+1,
      "รหัสเครื่องจักร": m.code||"",
      "ชื่อเครื่องจักร": m.name||"",
      "หมวดหมู่": (window.getCategory(m.categoryId)||{}).name||"",
      "ยี่ห้อ": m.brand||"",
      "รุ่น": m.model||"",
      "ปีที่ผลิต": m.year||"",
      "ขนาด": m.size||"",
      "หมายเลขเครื่อง (Serial)": m.serial||"",
      "โครงการ": m.project||"",
      "สถานที่": m.location||"",
      "กรรมสิทธิ์": m.ownership||"",
      "สถานะ": m.status||"",
      "พนักงานขับ/ผู้ควบคุม": m.driverName||"",
      "ชั่วโมงใช้งาน": Number(m.hours)||0,
      "บำรุงรักษาล่าสุด": m.lastService||"",
      "วันที่ตรวจสภาพ": m.inspectionDate||"",
      "ตรวจสภาพครั้งถัดไป": m.nextInspectionDate||"",
      "ลิงก์รูปภาพ": m.drivePhoto||"",
      "ลิงก์เอกสาร 1": m.driveLink1||"",
      "ลิงก์เอกสาร 2": m.driveLink2||"",
      "ลิงก์ Part List": m.driveLinkPL||"",
      "หมายเหตุ": m.note||""
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws["!cols"] = Object.keys(data[0]).map(k=>({wch: Math.min(40, Math.max(k.length+4, ...data.map(r=>String(r[k]??"").length+2)))}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "ทะเบียนเครื่องจักร");
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    XLSX.writeFile(wb, `ทะเบียนเครื่องจักร_${stamp}.xlsx`);
    Swal.fire({icon:"success",title:`ส่งออกแล้ว ${data.length} รายการ`,timer:1500,showConfirmButton:false,toast:true,position:"top-end"});
  }catch(err){
    Swal.fire({icon:"error",title:"ส่งออกไม่สำเร็จ",text:err.message});
  }
}

// ตัวกรองแบบติ๊กเลือกหลายรายการ (ไม่ติ๊กเลย = แสดงทั้งหมด)
function CheckFilter({label,icon,options,selected,onChange,minWidth=170}){
  const [open,setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(()=>{
    if(!open) return;
    const onDown = (e)=>{ if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onEsc = (e)=>{ if(e.key==="Escape") setOpen(false); };
    document.addEventListener("mousedown",onDown);
    document.addEventListener("keydown",onEsc);
    return ()=>{ document.removeEventListener("mousedown",onDown); document.removeEventListener("keydown",onEsc); };
  },[open]);
  const toggle = (v)=>onChange(selected.includes(v)?selected.filter(x=>x!==v):[...selected,v]);
  const active = selected.length>0;
  return (
    <div ref={ref} style={{position:"relative",display:"flex"}}>
      <button type="button" onClick={()=>setOpen(o=>!o)}
        style={{flex:1,display:"flex",alignItems:"center",gap:8,padding:"9px 12px",minWidth,borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:13.5,textAlign:"left",
          border:`1px solid ${active?"var(--primary)":"var(--line)"}`,background:active?"var(--accent-soft)":"#fff",color:active?"var(--primary)":"inherit"}}>
        {icon && <i className={`fa-solid ${icon}`} style={{opacity:.7}}></i>}
        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{label}</span>
        {active && <span style={{background:"var(--primary)",color:"#fff",borderRadius:999,fontSize:11,fontWeight:600,padding:"1px 7px"}}>{selected.length}</span>}
        <i className={`fa-solid fa-chevron-${open?"up":"down"}`} style={{fontSize:10,opacity:.6}}></i>
      </button>
      {open && (
        <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:60,minWidth:Math.max(minWidth,230),background:"#fff",border:"1px solid var(--line)",borderRadius:12,boxShadow:"0 12px 32px rgba(15,23,42,.16)",overflow:"hidden"}}>
          <div style={{display:"flex",gap:6,padding:"8px 10px",borderBottom:"1px solid var(--line)",background:"#FAFBFC"}}>
            <button type="button" onClick={()=>onChange(options.map(o=>o.value))} style={{flex:1,padding:"5px 8px",fontSize:12,fontFamily:"inherit",border:"1px solid var(--line)",borderRadius:7,background:"#fff",cursor:"pointer"}}>เลือกทั้งหมด</button>
            <button type="button" onClick={()=>onChange([])} style={{flex:1,padding:"5px 8px",fontSize:12,fontFamily:"inherit",border:"1px solid var(--line)",borderRadius:7,background:"#fff",cursor:"pointer"}}>ล้าง</button>
          </div>
          <div style={{maxHeight:280,overflowY:"auto",padding:6}}>
            {options.length===0 && <div style={{padding:"12px 10px",fontSize:12.5,color:"var(--muted)",textAlign:"center"}}>ไม่มีข้อมูล</div>}
            {options.map(o=>{
              const on = selected.includes(o.value);
              return (
                <label key={o.value} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",borderRadius:8,cursor:"pointer",fontSize:13,background:on?"var(--accent-soft)":"transparent"}}>
                  <input type="checkbox" checked={on} onChange={()=>toggle(o.value)} style={{margin:0,cursor:"pointer",accentColor:"var(--primary)",width:16,height:16}} />
                  {o.color && <span style={{width:9,height:9,borderRadius:"50%",background:o.color,flexShrink:0}}></span>}
                  {o.icon && <i className={`fa-solid ${o.icon}`} style={{color:o.color||"var(--muted)",fontSize:12,width:14}}></i>}
                  <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.label}</span>
                </label>
              );
            })}
          </div>
          <div style={{padding:"7px 12px",borderTop:"1px solid var(--line)",background:"#FAFBFC",fontSize:11,color:"var(--muted)"}}>ไม่ติ๊กเลย = แสดงทั้งหมด</div>
        </div>
      )}
    </div>
  );
}

function Machines({user}){
  const visibleRows = React.useMemo(()=>(window.filterByUserProjects(user, window.__DATA.machines, "project")),[user]);
  const [rows,setRows] = React.useState(visibleRows);
  const [q,setQ] = React.useState("");
  const [catF,setCatF] = React.useState([]);   // ติ๊กหลายหมวดหมู่ได้ — ว่าง = ทุกหมวดหมู่
  const [ownF,setOwnF] = React.useState([]);   // ติ๊กหลายกรรมสิทธิ์ได้ — ว่าง = ทุกกรรมสิทธิ์
  const [sortF,setSortF] = React.useState("none");
  const [detail,setDetail] = React.useState(null);
  const [edit,setEdit] = React.useState(null);
  React.useEffect(()=>{ setRows(visibleRows); },[visibleRows]);

  // ตัวเลือกหมวดหมู่ — แสดงจำนวนเครื่องในแต่ละหมวด + ตัวเลือก "ไม่ระบุ"
  const catOptions = React.useMemo(()=>{
    const count = (id)=>rows.filter(m=>(m.categoryId||"")===id).length;
    const opts = (window.__DATA.categories||[]).map(c=>({value:c.id,label:`${c.name} (${count(c.id)})`,color:c.color,icon:c.icon}));
    const none = count("");
    if(none) opts.push({value:"__none__",label:`— ไม่ระบุ — (${none})`});
    return opts;
  },[rows]);

  // ตัวเลือกกรรมสิทธิ์ — สร้างจากค่าที่มีจริงในข้อมูล (เช่น กรรมสิทธิ์, เช่า, ยืม)
  const ownOptions = React.useMemo(()=>{
    const tally = {};
    rows.forEach(m=>{ const o=(m.ownership||"").trim()||"__none__"; tally[o]=(tally[o]||0)+1; });
    const opts = Object.keys(tally).filter(o=>o!=="__none__").sort((a,b)=>a.localeCompare(b,"th")).map(o=>({value:o,label:`${o} (${tally[o]})`}));
    if(tally.__none__) opts.push({value:"__none__",label:`— ไม่ระบุ — (${tally.__none__})`});
    return opts;
  },[rows]);

  const filtered = rows.filter(m=>{
    if(q){ const qq=q.toLowerCase(); const hay=[m.name,m.code,m.brand,m.model,m.year,m.serial,m.project].map(x=>String(x||"").toLowerCase()).join(" "); if(!hay.includes(qq)) return false; }
    if(catF.length && !catF.includes(m.categoryId||"__none__")) return false;
    if(ownF.length && !ownF.includes((m.ownership||"").trim()||"__none__")) return false;
    return true;
  });

  if(sortF!=="none"){
    // ค่าว่างให้ไปอยู่ท้ายสุดเสมอ
    const txt = (v) => String(v??"").trim();
    const cmp = {
      ownership: (a,b)=>{ const x=txt(a.ownership),y=txt(b.ownership); if(!x!==!y) return x?-1:1; return x.localeCompare(y,"th") || txt(a.name).localeCompare(txt(b.name),"th"); },
      name:      (a,b)=>txt(a.name).localeCompare(txt(b.name),"th"),
      code:      (a,b)=>txt(a.code).localeCompare(txt(b.code),"th",{numeric:true}),
      status:    (a,b)=>txt(a.status).localeCompare(txt(b.status),"th"),
      yearDesc:  (a,b)=>{ const x=Number(a.year)||0,y=Number(b.year)||0; if(!x!==!y) return x?-1:1; return y-x; }
    }[sortF];
    if(cmp) filtered.sort(cmp);
  }

  const statusColor = (s) => ({"ใช้งาน":"#10B981","ซ่อม":"#EF4444","รอซ่อม":"#F59E0B"})[s] || "#64748B";

  const save = async (form) => {
    try{
      if(form.id){
        await window.api("updateMachine",{id:form.id,patch:form});
        const upd = rows.map(x=>x.id===form.id?form:x); setRows(upd); window.__DATA.machines=upd;
      } else {
        const nu = await window.api("createMachine",{m:form});
        const upd=[...rows,nu]; setRows(upd); window.__DATA.machines=upd;
      }
      setEdit(null);
      Swal.fire({icon:"success",title:"บันทึกสำเร็จ",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const remove = (m) => {
    Swal.fire({title:"ลบเครื่องจักร?",html:`คุณต้องการลบ <strong>${m.name}</strong> (${m.code}) ใช่หรือไม่?`,icon:"warning",showCancelButton:true,confirmButtonColor:"#EF4444",confirmButtonText:"ลบ",cancelButtonText:"ยกเลิก"}).then(async r=>{
      if(r.isConfirmed){
        try{
          await window.api("deleteMachine",{id:m.id});
          const upd=rows.filter(x=>x.id!==m.id); setRows(upd); window.__DATA.machines=upd; setDetail(null);
          Swal.fire({icon:"success",title:"ลบแล้ว",timer:1000,showConfirmButton:false,toast:true,position:"top-end"});
        }catch(err){ Swal.fire({icon:"error",title:"ลบไม่สำเร็จ",text:err.message}); }
      }
    });
  };

  const handleTransfer = async (machine, {toProject, note}) => {
    const entry = {from:machine.project||"ไม่ระบุ", to:toProject, when:new Date().toISOString(), by:user.name, note:note||""};
    const transferHistory = [...(machine.transferHistory||[]), entry];
    const patch = {project:toProject, transferHistory};
    try{
      await window.api("updateMachine",{id:machine.id, patch});
      const updated = {...machine, ...patch};
      const upd = rows.map(x=>x.id===machine.id?updated:x);
      setRows(upd); window.__DATA.machines=upd; setDetail(updated);
      Swal.fire({icon:"success",title:"ย้ายโครงการสำเร็จ",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  return (
    <>
    <div className="card" style={{marginBottom:18}}>
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา ชื่อ / รหัส / ยี่ห้อ / ซีเรียล / โครงการ..." value={q} onChange={e=>setQ(e.target.value)} /></div>
        <CheckFilter label="ทุกหมวดหมู่" icon="fa-layer-group" selected={catF} onChange={setCatF} options={catOptions} />
        <CheckFilter label="ทุกกรรมสิทธิ์" icon="fa-handshake" selected={ownF} onChange={setOwnF} options={ownOptions} />
        <select value={sortF} onChange={e=>setSortF(e.target.value)} title="เรียงลำดับ">
          <option value="none">เรียง: ค่าเริ่มต้น</option>
          <option value="ownership">เรียง: กรรมสิทธิ์</option>
          <option value="name">เรียง: ชื่อเครื่องจักร</option>
          <option value="code">เรียง: รหัสเครื่องจักร</option>
          <option value="status">เรียง: สถานะ</option>
          <option value="yearDesc">เรียง: ปีที่ผลิต (ใหม่→เก่า)</option>
        </select>
        <div className="spacer"></div>
        <button className="btn btn-ghost" onClick={()=>exportMachinesExcel(filtered)} title="ส่งออกข้อมูลที่แสดงอยู่เป็นไฟล์ Excel">
          <i className="fa-solid fa-file-excel" style={{color:"#1D6F42"}}></i> ส่งออก Excel
        </button>
        {["Admin","Officer","Engineer"].includes(user.role) && (
          <button className="btn btn-primary" onClick={()=>setEdit({mode:"create",m:{id:"",project:"",code:"",name:"",brand:"",model:"",year:"",size:"",serial:"",ownership:"",categoryId:"",note:"",status:"ใช้งาน",location:"",lastService:window.__DATA.fmtDate(new Date()),hours:0,icon:"fa-gears",driverName:"",drivePhoto:"",driveLink1:"",driveLink2:"",driveLinkPL:"",inspectionDate:"",nextInspectionDate:""}})}>
            <i className="fa-solid fa-plus"></i> เพิ่มเครื่องจักร
          </button>
        )}
      </div>
    </div>
    <div className="machines-grid">
      {filtered.map(m=>{
        const cat = window.getCategory(m.categoryId);
        return (
          <div className="machine-card" key={m.id} onClick={()=>setDetail(m)}>
            <div className="machine-thumb">
              <div className="pattern"></div>
              <div className="ic"><i className={`fa-solid ${m.icon||"fa-gears"}`}></i></div>
              {m.drivePhoto && <img src={gdriveThumb(m.drivePhoto)} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"} />}
              {m.categoryId && <div className="drive-tag" style={{background:cat.color,color:"#fff"}}><i className={`fa-solid ${cat.icon}`}></i> {cat.name}</div>}
              <div className="status-dot" style={{background:statusColor(m.status)}}><span style={{width:5,height:5,borderRadius:"50%",background:"#fff"}}></span>{m.status}</div>
            </div>
            <div className="machine-info">
              <div className="n">{m.name}</div>
              <div className="m">{m.code}{m.brand?` · ${m.brand}`:""}{m.model?` ${m.model}`:""}</div>
              {m.serial && <div className="m mono" style={{fontSize:11,marginTop:1,opacity:.75}}>{m.serial}</div>}
              <div className="meta"><span><i className="fa-solid fa-diagram-project"></i> {m.project||"—"}</span>{m.ownership&&<span><i className="fa-solid fa-handshake"></i> {m.ownership}</span>}</div>
            </div>
          </div>
        );
      })}
      {filtered.length===0 && (<div style={{gridColumn:"1/-1"}} className="card"><div className="empty"><i className="fa-solid fa-industry"></i><div className="t">ยังไม่มีเครื่องจักรในระบบ</div><div>{["Admin","Officer","Engineer"].includes(user.role)?"กดปุ่ม 'เพิ่มเครื่องจักร' ด้านบนเพื่อเริ่มต้น":"รอผู้ดูแลระบบเพิ่มข้อมูล"}</div></div></div>)}
    </div>
    {detail && <MachineDetail m={detail} user={user} onClose={()=>setDetail(null)} onEdit={()=>{setEdit({mode:"edit",m:detail});setDetail(null);}} onDelete={()=>remove(detail)} onTransfer={(payload)=>handleTransfer(detail,payload)} onPatchMachine={async (patch)=>{ try{ await window.api("updateMachine",{id:detail.id,patch}); const updated={...detail,...patch}; const upd=rows.map(x=>x.id===detail.id?updated:x); setRows(upd); window.__DATA.machines=upd; setDetail(updated); }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }}} />}
    {edit && <MachineForm initial={edit.m} mode={edit.mode} onClose={()=>setEdit(null)} onSave={save} />}
    </>
  );
}

function MachineForm({initial,mode,onClose,onSave}){

  const [busy,setBusy] = React.useState(false);
  const projects = React.useMemo(()=>(window.__DATA.projects||[]).filter(p=>p.status!=="inactive"),[]);
  const up = (k,v) => setF(p=>({...p,[k]:v}));

  const submit = async (e) => {
    e?.preventDefault();
    if(!f.code?.trim()||!f.name?.trim()){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณากรอก รหัสเครื่องจักร และ ชื่อเครื่องจักร"}); return; }
    setBusy(true);
    try{ await onSave({...f,hours:Number(f.hours)||0}); } finally { setBusy(false); }
  };

  const icons = ["fa-solid fa-tractor","fa-industry","fa-wind","fa-droplet","fa-snowflake","fa-bolt","fa-truck","fa-boxes-packing","fa-fan","fa-plug","fa-screwdriver-wrench","fa-gauge","fa-tractor","fa-helmet-safety"];

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className={`fa-solid ${mode==="edit"?"fa-pen-to-square":"fa-plus"}`} style={{marginRight:8,color:"var(--primary)"}}></i>{mode==="edit"?"แก้ไขเครื่องจักร":"เพิ่มเครื่องจักรใหม่"}</>}
      footer={<><button className="btn btn-ghost" onClick={onClose} disabled={busy}>ยกเลิก</button><button className="btn btn-primary" onClick={submit} disabled={busy}>{busy?<><div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> กำลังบันทึก...</>:<><i className="fa-solid fa-floppy-disk"></i> บันทึก</>}</button></>}>
      <form onSubmit={submit}>
        <div className="form-grid">
          <div className="form-field">
            <label>โครงการ</label>
            {projects.length===0 ? (
              <div style={{padding:"10px 12px",borderRadius:8,border:"1px dashed var(--line)",background:"#FFFBEB",fontSize:13,color:"#92400E"}}>
                <i className="fa-solid fa-triangle-exclamation" style={{marginRight:6}}></i>
                ยังไม่มีโครงการในระบบ — กรุณาเพิ่มโครงการในเมนู <strong>โครงการ</strong> ก่อน
              </div>
            ) : (
              <>
                <select value={f.project||""} onChange={e=>up("project",e.target.value)}>
                  <option value="">— เลือกโครงการ —</option>
                  {projects.map(p=>(<option key={p.id} value={p.name}>{p.code ? `[${p.code}] ` : ""}{p.name}</option>))}
                </select>

                  return proj ? (
                    <div style={{marginTop:6,display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:999,background:(proj.color||"#3B82F6")+"22",color:proj.color||"#3B82F6",fontSize:12,fontWeight:500}}>
                      <span style={{width:8,height:8,borderRadius:"50%",background:proj.color||"#3B82F6"}}></span>
                      {proj.code && <span className="mono">{proj.code}</span>}
                      {proj.name}
                    </div>
                  ) : null;
                })()}
              </>
            )}
          </div>
          <div className="form-field"><label>รหัสเครื่องจักร *</label><input value={f.code||""} onChange={e=>up("code",e.target.value)} placeholder="เช่น XCMG-001" /></div>
          <div className="form-field" style={{gridColumn:"1/-1"}}><label>เครื่องจักร (ชื่อ) *</label><input value={f.name||""} onChange={e=>up("name",e.target.value)} placeholder="เช่น Drilling Rig, เครื่องกลึง CNC" /></div>
          <div className="form-field"><label>ยี่ห้อ</label><input value={f.brand||""} onChange={e=>up("brand",e.target.value)} placeholder="เช่น XCMG, Komatsu, HITACHI" /></div>
          <div className="form-field"><label>รุ่น</label><input value={f.model||""} onChange={e=>up("model",e.target.value)} placeholder="เช่น XR220D" /></div>

          <div className="form-field"><label>หมวดหมู่</label><select value={f.categoryId||""} onChange={e=>up("categoryId",e.target.value)}><option value="">— เลือกหมวดหมู่ —</option>{(window.__DATA.categories||[]).map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}</select></div>
          <div className="form-field"><label>สถานะ</label><select value={f.status||"ใช้งาน"} onChange={e=>up("status",e.target.value)}><option value="ใช้งาน">ใช้งาน</option><option value="ซ่อม">ซ่อม</option><option value="รอซ่อม">รอซ่อม</option></select></div>

          <div className="form-field"><label>ชั่วโมงทำงานสะสม</label><input type="number" min="0" value={f.hours||0} onChange={e=>up("hours",e.target.value)} /></div>

          <div className="form-field"><label>ชื่อพนักงานขับ / ผู้ควบคุม</label><input value={f.driverName||""} onChange={e=>up("driverName",e.target.value)} placeholder="เช่น นายสมชาย ใจดี" /></div>

            <input value={f.driveLink1||""} onChange={e=>up("driveLink1",e.target.value)} placeholder="https://drive.google.com/..." />
          </div>
          <div className="form-field" style={{gridColumn:"1/-1"}}>
            <label><i className="fa-brands fa-google-drive" style={{marginRight:6,color:"#4285F4"}}></i>ลิงค์ไฟล์ Google Drive (2) <span style={{fontWeight:400,fontSize:12,color:"var(--muted)"}}>เช่น แบบแปลน, ประวัติซ่อมบำรุง</span></label>
            <input value={f.driveLink2||""} onChange={e=>up("driveLink2",e.target.value)} placeholder="https://drive.google.com/..." />
          </div>
          <div className="form-field" style={{gridColumn:"1/-1"}}>
            <label><i className="fa-solid fa-shield-halved" style={{marginRight:6,color:"#059669"}}></i>PL (ประกัน) <span style={{fontWeight:400,fontSize:12,color:"var(--muted)"}}>ลิงค์ไฟล์เอกสารประกัน</span></label>
            <input value={f.driveLinkPL||""} onChange={e=>up("driveLinkPL",e.target.value)} placeholder="https://drive.google.com/..." />
          </div>
          <div className="form-field" style={{gridColumn:"1/-1"}}><label>หมายเหตุ</label><textarea rows="3" value={f.note||""} onChange={e=>up("note",e.target.value)} placeholder="หมายเหตุเพิ่มเติม..."></textarea></div>
        </div>
        <div className="form-field" style={{marginTop:14}}>
          <label>ไอคอน (ใช้แทนเมื่อไม่มีรูป)</label>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(58px,1fr))",gap:8,padding:12,background:"var(--bg)",border:"1px solid var(--line)",borderRadius:10}}>
            {icons.map(ic=>(<button type="button" key={ic} onClick={()=>up("icon",ic)} style={{height:50,borderRadius:10,border:f.icon===ic?"2px solid var(--primary)":"1px solid var(--line)",background:f.icon===ic?"var(--accent-soft)":"#fff",color:f.icon===ic?"var(--primary)":"var(--muted)",fontSize:18,cursor:"pointer",display:"grid",placeItems:"center"}}><i className={`fa-solid ${ic}`}></i></button>))}
          </div>
        </div>
      </form>
    </Modal>
  );
}

function TransferMachineModal({m,onClose,onSave}){
  const projects = (window.__DATA.projects||[]).filter(p=>p.status!=="inactive"&&p.name!==m.project);
  const [toProject,setToProject] = React.useState("");
  const [note,setNote] = React.useState("");
  const inSt = {width:"100%",padding:"9px 11px",border:"1px solid var(--line)",borderRadius:8,fontFamily:"Kanit",fontSize:13.5,background:"#fff"};
  const submit = () => {
    if(!toProject){ Swal.fire({icon:"warning",title:"กรุณาเลือกโครงการปลายทาง"}); return; }
    onSave({toProject,note});
  };
  return (
    <Modal open={true} onClose={onClose} title={<><i className="fa-solid fa-right-left" style={{color:"#7C3AED",marginRight:8}}></i>ย้ายโครงการ</>} size="sm"
      footer={<><button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button><button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-check"></i> ยืนยันการย้าย</button></>}>
      <div style={{display:"grid",gap:16}}>
        <div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:11,color:"#92400E",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>โครงการปัจจุบัน</div>
          <div style={{fontWeight:600,fontSize:15,color:"#78350F"}}>{m.project||"— ไม่ระบุ —"}</div>
        </div>
        <div>
          <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>ย้ายไปยังโครงการ <span style={{color:"#EF4444"}}>*</span></label>
          <select style={inSt} value={toProject} onChange={e=>setToProject(e.target.value)}>
            <option value="">— เลือกโครงการปลายทาง —</option>
            {projects.map(p=>(<option key={p.id} value={p.name}>{p.name}</option>))}
          </select>
          {projects.length===0 && <div style={{fontSize:12,color:"var(--muted)",marginTop:5}}>ไม่มีโครงการอื่นในระบบ กรุณาเพิ่มโครงการก่อน</div>}
        </div>
        <div>
          <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>เหตุผล / หมายเหตุ</label>
          <textarea style={{...inSt,resize:"vertical"}} rows="3" value={note} onChange={e=>setNote(e.target.value)} placeholder="เช่น ย้ายตามแผนปรับโครงสร้าง, ส่งมอบให้โครงการ B..." />
        </div>
      </div>
    </Modal>
  );
}

function MachineDetail({m,user,onClose,onEdit,onDelete,onTransfer,onPatchMachine}){
  const [relatedRows, setRelatedRows] = React.useState(()=>window.__DATA.repairs.filter(r=>r.machineCode===m.code).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));
  const statusColor = ({"ใช้งาน":"#10B981","ซ่อม":"#EF4444","รอซ่อม":"#F59E0B"})[m.status]||"#64748B";
  const canEdit = ["Admin","Officer","Engineer"].includes(user.role);
  const [viewRepair, setViewRepair] = React.useState(null);
  const [editRepair, setEditRepair] = React.useState(null);
  const [transferModal, setTransferModal] = React.useState(false);
  const [editTrIdx, setEditTrIdx] = React.useState(null);
  const [editTrForm, setEditTrForm] = React.useState(null);
  const [savingTr, setSavingTr] = React.useState(false);
  const projectNames = React.useMemo(()=>{
    const names = (window.__DATA.projects||[]).filter(p=>p.status!=="inactive").map(p=>p.name);
    (m.transferHistory||[]).forEach(t=>{ [t.from,t.to].forEach(n=>{ if(n && !names.includes(n)) names.push(n); }); });
    return names;
  },[m.transferHistory]);
  const toDateStr = (d) => { try{ return new Date(d).toISOString().slice(0,10); }catch(e){ return ""; } };
  const trLabelSt = {fontSize:10.5,color:"#6D28D9",fontWeight:500,marginBottom:2};
  const trInputSt = {width:"100%",padding:"5px 8px",border:"1px solid #C4B5FD",borderRadius:6,fontSize:12.5,fontFamily:"Kanit",color:"#3B0764",background:"#fff",outline:"none"};
  const [editDateField, setEditDateField] = React.useState(null);
  const [editDateValue, setEditDateValue] = React.useState("");
  const [savingDate, setSavingDate] = React.useState(false);
  const today = React.useMemo(()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; },[]);
  const nextDateColor = (val) => {
    if(!val) return null;
    const d=new Date(val); d.setHours(0,0,0,0);
    const diff=Math.floor((d-today)/(1000*60*60*24));
    if(diff<0) return "#EF4444";
    if(diff<=30) return "#F59E0B";
    return "#10B981";
  };
  const saveInspectionDate = async () => {
    if(!editDateField) return;
    setSavingDate(true);
    try{ await onPatchMachine({[editDateField]:editDateValue}); setEditDateField(null); }
    catch(e){}
    setSavingDate(false);
  };
  const renderInspectionCell = (field) => {
    const val = m[field]||"";
    const color = field==="nextInspectionDate" ? nextDateColor(val) : null;
    if(editDateField===field) return (
      <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
        <input type="date" value={editDateValue} onChange={e=>setEditDateValue(e.target.value)}
          style={{padding:"3px 7px",border:"1px solid var(--primary)",borderRadius:6,fontSize:12,fontFamily:"Kanit"}} autoFocus/>
        <button onClick={saveInspectionDate} disabled={savingDate} style={{padding:"3px 10px",background:"var(--primary)",color:"#fff",border:"none",borderRadius:6,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>
          {savingDate?"...":"บันทึก"}
        </button>
        <button onClick={()=>setEditDateField(null)} style={{padding:"3px 8px",background:"none",border:"1px solid var(--line)",borderRadius:6,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>ยกเลิก</button>
      </div>
    );
    return (
      <div style={{display:"flex",alignItems:"center",gap:5}}>
        {val ? (
          <span style={{fontSize:12,fontWeight:color?"600":"400",color:color||"inherit",background:color?color+"18":"transparent",padding:color?"2px 7px":"0",borderRadius:5,display:"inline-flex",alignItems:"center",gap:4}}>
            {window.__DATA.fmtDate(val)}
            {color==="#EF4444"&&<span style={{fontSize:10}}>⚠ เกินกำหนด</span>}
            {color==="#F59E0B"&&<span style={{fontSize:10}}>ใกล้ถึงกำหนด</span>}
          </span>
        ) : <span style={{color:"var(--muted)",fontSize:12}}>—</span>}
        {canEdit && <button onClick={()=>{setEditDateField(field);setEditDateValue(val||toDateStr(new Date()));}}
          style={{padding:"1px 5px",background:"none",border:"1px solid var(--line)",borderRadius:4,fontSize:10,cursor:"pointer",color:"var(--muted)"}} title="แก้ไขวันที่">
          <i className={`fa-solid ${val?"fa-pen":"fa-plus"}`}></i>
        </button>}
      </div>
    );
  };
  const startEditTransfer = (idx, t) => {
    setEditTrIdx(idx);
    setEditTrForm({from:t.from||"", to:t.to||"", when:toDateStr(t.when), note:t.note||"", by:t.by||""});
  };

  const saveTransferEntry = async () => {
    if(editTrIdx===null || !editTrForm) return;
    if(!editTrForm.to.trim()){ Swal.fire({icon:"warning",title:"กรุณาระบุโครงการปลายทาง"}); return; }
    const hist = m.transferHistory||[];
    const newHistory = hist.map((t,i)=>i!==editTrIdx?t:({
      ...t,
      from: editTrForm.from.trim(),
      to: editTrForm.to.trim(),
      note: editTrForm.note,
      by: editTrForm.by.trim(),
      when: editTrForm.when ? new Date(editTrForm.when).toISOString() : t.when,
      editedBy: user.name,
      editedAt: new Date().toISOString()
    }));
    // แก้รายการล่าสุด = ปลายทางเปลี่ยน ให้โครงการปัจจุบันของเครื่องจักรตามไปด้วย
    const patch = {transferHistory:newHistory};
    if(editTrIdx===hist.length-1) patch.project = newHistory[editTrIdx].to;
    setSavingTr(true);
    try{
      await onPatchMachine(patch);
      setEditTrIdx(null); setEditTrForm(null);
      Swal.fire({icon:"success",title:"แก้ไขประวัติแล้ว",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    } finally { setSavingTr(false); }
  };

  const deleteTransferEntry = (idx, t) => {
    Swal.fire({
      title:"ลบประวัติการย้าย?",
      html:`<div style="font-size:14px">${t.from||"ไม่ระบุ"} → <strong>${t.to||""}</strong><br><span style="color:#64748B;font-size:12px">${window.__DATA.fmtDate(t.when)}</span></div><div style="margin-top:8px;font-size:12px;color:#B45309">ลบแล้วกู้คืนไม่ได้ และไม่กระทบโครงการปัจจุบันของเครื่องจักร</div>`,
      icon:"warning",showCancelButton:true,confirmButtonColor:"#EF4444",confirmButtonText:"ลบ",cancelButtonText:"ยกเลิก"
    }).then(async r=>{
      if(!r.isConfirmed) return;
      const newHistory = (m.transferHistory||[]).filter((_,i)=>i!==idx);
      await onPatchMachine({transferHistory:newHistory});
      setEditTrIdx(null); setEditTrForm(null);
      Swal.fire({icon:"success",title:"ลบแล้ว",timer:1000,showConfirmButton:false,toast:true,position:"top-end"});
    });
  };

  const saveEdit = async (r, patch) => {
    try{
      try{ await window.api("updateRepair",{id:r.id,patch,by:user.name}); }
      catch(e1){
        if(/Unknown action/i.test(String(e1.message||e1))){
          const {status,cost,...rest}=patch;
          await window.api("updateRepairStatus",{id:r.id,status:status||r.status,cost,by:user.name,note:"แก้ไขข้อมูล",patch:rest});
        } else { throw e1; }
      }
      const updated={...r,...patch,timeline:[...r.timeline,{status:patch.status||r.status,when:new Date(),by:user.name,note:"แก้ไขข้อมูล"}]};
      setRelatedRows(prev=>prev.map(x=>x.id===r.id?updated:x));
      window.__DATA.repairs=window.__DATA.repairs.map(x=>x.id===r.id?updated:x);
      setEditRepair(null);
      Swal.fire({icon:"success",title:"บันทึกการแก้ไขแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };
  return (
    <>
    <Modal open={true} onClose={onClose} title={<>เครื่องจักร <span className="mono" style={{marginLeft:6,color:"var(--primary)"}}>{m.code}</span></>} size="lg"
      footer={<>{canEdit&&<button className="btn btn-danger" onClick={onDelete}><i className="fa-solid fa-trash"></i> ลบ</button>}<div style={{flex:1}}></div><button className="btn btn-ghost" onClick={onClose}>ปิด</button>{canEdit&&<button className="btn btn-ghost" style={{color:"#7C3AED",border:"1px solid #DDD6FE"}} onClick={()=>setTransferModal(true)}><i className="fa-solid fa-right-left"></i> ย้ายโครงการ</button>}{canEdit&&<button className="btn btn-primary" onClick={onEdit}><i className="fa-solid fa-pen-to-square"></i> แก้ไข</button>}</>}>
      <div className="detail-header" style={{display:"grid",gridTemplateColumns:"240px 1fr",gap:22,marginBottom:18}}>
        <div style={{borderRadius:12,overflow:"hidden",aspectRatio:"1",background:"var(--bg)",position:"relative"}}>
          <div className="machine-thumb" style={{position:"absolute",inset:0,borderRadius:0}}>
            <div className="pattern"></div>
            <div className="ic"><i className={`fa-solid ${m.icon||"fa-gears"}`}></i></div>
            {m.drivePhoto && <img src={gdriveThumb(m.drivePhoto)} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"} />}
          </div>
        </div>
        <div>
          <div style={{fontSize:20,fontWeight:600,marginBottom:4}}>{m.name}</div>
          <div style={{color:"var(--muted)",marginBottom:14}}>{m.brand||"—"} {m.model||""} {m.size?`· ${m.size}`:""}</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <span className="badge" style={{background:statusColor+"22",color:statusColor,fontSize:13}}><span className="dot"></span>{m.status}</span>
            {m.categoryId && (()=>{ const cat=window.getCategory(m.categoryId); return <span className="badge" style={{background:cat.color+"22",color:cat.color,fontSize:13}}><i className={`fa-solid ${cat.icon}`} style={{marginRight:4}}></i>{cat.name}</span>; })()}
            {m.ownership && <span className="badge" style={{background:"var(--accent-soft)",color:"var(--primary)",fontSize:13}}><i className="fa-solid fa-handshake" style={{marginRight:4}}></i>{m.ownership}</span>}
          </div>
          <div className="detail-grid" style={{marginTop:16,gridTemplateColumns:"1fr 1fr"}}>
            <div><div className="k">โครงการ</div><div className="v">{m.project||"—"}</div></div>
            <div><div className="k">ซีเรียล</div><div className="v mono" style={{fontSize:12}}>{m.serial||"—"}</div></div>
            <div><div className="k">ปีที่ผลิต</div><div className="v">{m.year||"—"}</div></div>
            <div><div className="k">สถานที่ติดตั้ง</div><div className="v">{m.location||"—"}</div></div>
            <div><div className="k">ซ่อมบำรุงล่าสุด</div><div className="v">{m.lastService||"—"}</div></div>
            <div><div className="k">ชั่วโมงทำงาน</div><div className="v">{Number(m.hours||0).toLocaleString()} ชม.</div></div>
            <div><div className="k">พนักงานขับ / ผู้ควบคุม</div><div className="v">{m.driverName||"—"}</div></div>
          </div>
          <div style={{marginTop:12,padding:"10px 14px",background:"#F5F3FF",border:"1px solid #DDD6FE",borderRadius:10}}>
            <div style={{fontSize:11,fontWeight:600,color:"#7C3AED",textTransform:"uppercase",letterSpacing:".06em",marginBottom:10,display:"flex",alignItems:"center",gap:6}}>
              <i className="fa-solid fa-certificate"></i>ปจ2 — การตรวจสอบและทดสอบ
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div>
                <div style={{fontSize:11,color:"var(--muted)",marginBottom:3}}>วันที่ตรวจสอบ</div>
                {renderInspectionCell("inspectionDate")}
              </div>
              <div>
                <div style={{fontSize:11,color:"var(--muted)",marginBottom:3}}>วันที่ตรวจสอบครั้งถัดไป</div>
                {renderInspectionCell("nextInspectionDate")}
              </div>
            </div>
          </div>
          {(m.driveLink1||m.driveLink2||m.driveLinkPL) && <div style={{marginTop:14,display:"grid",gap:8}}>
            <div style={{fontSize:12,fontWeight:500,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".05em"}}><i className="fa-brands fa-google-drive" style={{color:"#4285F4",marginRight:6}}></i>ไฟล์เอกสาร Google Drive</div>
            {m.driveLink1 && <a href={m.driveLink1} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:8,background:"#EFF6FF",border:"1px solid #BFDBFE",color:"#1E40AF",fontSize:13,textDecoration:"none"}}><i className="fa-brands fa-google-drive" style={{color:"#4285F4"}}></i>ไฟล์เอกสาร (1)<i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:10,opacity:.6,marginLeft:"auto"}}></i></a>}
            {m.driveLink2 && <a href={m.driveLink2} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:8,background:"#EFF6FF",border:"1px solid #BFDBFE",color:"#1E40AF",fontSize:13,textDecoration:"none"}}><i className="fa-brands fa-google-drive" style={{color:"#4285F4"}}></i>ไฟล์เอกสาร (2)<i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:10,opacity:.6,marginLeft:"auto"}}></i></a>}
            {m.driveLinkPL && <a href={m.driveLinkPL} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:8,background:"#ECFDF5",border:"1px solid #A7F3D0",color:"#047857",fontSize:13,textDecoration:"none"}}><i className="fa-solid fa-shield-halved" style={{color:"#059669"}}></i>PL (ประกัน)<i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:10,opacity:.6,marginLeft:"auto"}}></i></a>}
          </div>}
          {m.note && <div style={{marginTop:14,padding:12,background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10,fontSize:13}}><div style={{fontWeight:500,color:"#92400E",marginBottom:4}}><i className="fa-solid fa-note-sticky"></i> หมายเหตุ</div><div style={{color:"#78350F",whiteSpace:"pre-wrap"}}>{m.note}</div></div>}
