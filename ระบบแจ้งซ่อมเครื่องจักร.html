function NewRequest({user,goTo}){
  const allProjects = React.useMemo(()=>{
    return window.userProjects(user);
  },[user]);

  const initProject = window.getActiveProject(user)||"";
  const todayStr = (()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
  const [f,setF] = React.useState({title:"",categoryId:"",project:initProject,subSite:"",machineCode:"",siteId:"",odometerKm:"",hourMeter:"",driverName:"",reportDate:todayStr,placeMode:"onsite",placeOnsite:initProject,placeOther:"",photos:[]});
  const [loading,setLoading] = React.useState(false);

  // เลือกไซต์งานย่อยแล้ว = เห็นเฉพาะเครื่องจักรที่ประจำไซต์นั้น (เครื่องที่ยังไม่ได้ระบุไซต์ยังแสดงอยู่ เพราะเป็นของกลางโครงการ)
  const projectMachines = React.useMemo(()=>{
    if(!f.project) return [];
    return (window.__DATA.machines||[]).filter(m=>{
      if(m.project!==f.project) return false;
      if(f.subSite && (m.subSite||"") && m.subSite!==f.subSite) return false;
      return true;
    });
  },[f.project,f.subSite]);
  const filteredMachines = React.useMemo(()=>{ if(!f.categoryId) return projectMachines; return projectMachines.filter(m=>m.categoryId===f.categoryId); },[projectMachines,f.categoryId]);
  const projectCategories = React.useMemo(()=>{ const ids=new Set(projectMachines.map(m=>m.categoryId).filter(Boolean)); return (window.__DATA.categories||[]).filter(c=>ids.has(c.id)); },[projectMachines]);

  // เปลี่ยนโครงการ → เติมชื่อโครงการลงช่อง "ส่งช่างซ่อมหน้างาน ที่" ให้ (ถ้าผู้ใช้ยังไม่ได้แก้เอง)
  const onProjectChange = (p) => setF(prev=>({...prev,project:p,subSite:"",categoryId:"",machineCode:"",placeOnsite:(!prev.placeOnsite||prev.placeOnsite===prev.project)?p:prev.placeOnsite}));
  const onSubSiteChange = (s) => setF(prev=>({...prev,subSite:s,machineCode:""}));
  const onCategoryChange = (cid) => setF(prev=>({...prev,categoryId:cid,machineCode:""}));
  // เลือกเครื่องจักร → เติมไซต์ / เลขมิเตอร์ชั่วโมง / พนักงานขับ จากทะเบียนเครื่องจักรให้ (ผู้แจ้งแก้ทับได้)
  const onMachineChange = (code) => setF(prev=>{
    const sel = projectMachines.find(m=>m.code===code);
    return {
      ...prev,
      machineCode: code,
      subSite: prev.subSite || (sel && sel.subSite) || "",
      hourMeter: (sel && sel.hours!=null && sel.hours!=="") ? String(sel.hours) : "",
      driverName: (sel && sel.driverName) || "",
      odometerKm: "",
    };
  });

  const submit = async () => {
    if(!f.project){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาเลือกโครงการ/หน่วยงานก่อน"}); return; }
    if(!f.categoryId){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาเลือกหมวดหมู่"}); return; }
    const title = (f.title||"").split("\n").map(s=>s.trim()).filter(Boolean).join("\n");
    if(!title){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาระบุอาการ/ปัญหาอย่างน้อย 1 รายการ"}); return; }
    setLoading(true);
    try{
      const repairPlace = {
        mode: f.placeMode,
        onsite: f.placeMode==="onsite" ? (f.placeOnsite||f.project) : "",
        other:  f.placeMode==="other"  ? f.placeOther : "",
        reportAt: "", note: "",
      };
      const createdAt = f.reportDate ? new Date(f.reportDate+"T00:00:00").toISOString() : undefined;
      const repair = {siteId:f.siteId,title,desc:"",problems:title.split("\n").filter(Boolean).map(t=>({text:t,status:"new"})),project:f.project,subSite:f.subSite||"",categoryId:f.categoryId,status:"new",reporterId:user.id,reporterName:user.name,assignedId:"",cost:"",machineCode:f.machineCode,odometerKm:f.odometerKm||"",hourMeter:f.hourMeter||"",driverName:f.driverName||"",repairPlace,photos:(f.photos||[]).filter(Boolean),createdAt};
      const saved = await window.api("createRepair",{repair});
      saved.createdAt = new Date(saved.createdAt);
      saved.timeline = [{status:"new",when:new Date(),by:user.name,note:"แจ้งเข้าระบบ"}];
      window.__DATA.repairs = [saved,...window.__DATA.repairs];
      setLoading(false);
      Swal.fire({icon:"success",title:"แจ้งซ่อมสำเร็จ!",html:`เลขที่ใบแจ้งซ่อม: <strong class="mono" style="color:#1E40AF">${saved.running}</strong>`,confirmButtonColor:"#1E40AF"}).then(async ()=>{
        // เปิดหน้าแชร์รูปใบงานให้เลย (shareRepairImage จัดการ error ของตัวเองแล้ว)
        await window.shareRepairImage(saved,user);
        goTo(window.isOpsRole(user)?"repairs":"r-mine");
      });
    }catch(err){ setLoading(false); Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  return (
    <>
    <Loading show={loading} text="กำลังบันทึก..."/>
    <div className="card">
      <div className="card-h"><div><h3>แบบฟอร์มแจ้งซ่อม</h3><div className="sub">ระบบจะออกเลขที่ใบแจ้งซ่อมให้อัตโนมัติหลังส่งแบบฟอร์ม</div></div></div>
      <div className="card-body">
        <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
          {[{n:1,l:"เลือกโครงการ",done:!!f.project},{n:2,l:"เลือกหมวดหมู่",done:!!f.categoryId,disabled:!f.project},{n:3,l:"เลือกเครื่องจักร",done:!!f.machineCode,disabled:!f.categoryId},{n:4,l:"รายละเอียดอาการ",done:(f.title||"").split("\n").some(s=>s.trim()),disabled:!f.machineCode}].map(s=>(
            <div key={s.n} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:999,background:s.done?"rgba(16,185,129,.1)":s.disabled?"var(--bg)":"var(--accent-soft)",border:`1px solid ${s.done?"rgba(16,185,129,.3)":s.disabled?"var(--line)":"rgba(30,64,175,.2)"}`,color:s.done?"#047857":s.disabled?"var(--muted)":"var(--primary)",fontSize:13,fontWeight:500,opacity:s.disabled?0.55:1}}>
              <span style={{width:22,height:22,borderRadius:"50%",display:"grid",placeItems:"center",fontSize:11,background:s.done?"#10B981":s.disabled?"var(--line)":"var(--primary)",color:"#fff"}}>{s.done?<i className="fa-solid fa-check"></i>:s.n}</span>
              {s.l}
            </div>
          ))}
        </div>
        <div className="form-grid">
          <div className="form-field full">
            <label><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:20,height:20,borderRadius:"50%",background:"var(--primary)",color:"#fff",fontSize:11,display:"inline-grid",placeItems:"center",fontWeight:600}}>1</span>โครงการ/หน่วยงาน *</span></label>
            <select value={f.project} onChange={e=>onProjectChange(e.target.value)}><option value="">— กรุณาเลือกโครงการ —</option>{allProjects.map(p=>(<option key={p} value={p}>{p}</option>))}</select>
            <div className="hint">เลือกโครงการก่อน เพื่อกรองหมวดหมู่และเครื่องจักรในโครงการนั้น</div>
          </div>
          <SubSiteField project={f.project} value={f.subSite} onChange={onSubSiteChange} className="form-field full"
            hint="ไม่บังคับ · เลือกไซต์แล้วจะเห็นเฉพาะเครื่องจักรที่ประจำไซต์นั้น (รวมเครื่องที่ยังไม่ระบุไซต์)" />

          <div className="form-field full">
            <label><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:20,height:20,borderRadius:"50%",background:f.project?"var(--primary)":"var(--line)",color:"#fff",fontSize:11,display:"inline-grid",placeItems:"center",fontWeight:600}}>2</span>หมวดหมู่ *</span></label>
            <select value={f.categoryId} onChange={e=>onCategoryChange(e.target.value)} disabled={!f.project}><option value="">{!f.project?"— กรุณาเลือกโครงการก่อน —":projectCategories.length===0?"— ไม่พบหมวดหมู่ในโครงการนี้ —":"— เลือกหมวดหมู่ —"}</option>{projectCategories.map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}</select>
            {f.project&&projectCategories.length>0&&<div className="hint">พบ {projectCategories.length} หมวดหมู่ในโครงการ "{f.project}"</div>}
          </div>
          <div className="form-field full">
            <label><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:20,height:20,borderRadius:"50%",background:f.categoryId?"var(--primary)":"var(--line)",color:"#fff",fontSize:11,display:"inline-grid",placeItems:"center",fontWeight:600}}>3</span>เครื่องจักร</span></label>
            <select value={f.machineCode} onChange={e=>onMachineChange(e.target.value)} disabled={!f.categoryId}><option value="">{!f.project?"— กรุณาเลือกโครงการก่อน —":!f.categoryId?"— กรุณาเลือกหมวดหมู่ก่อน —":filteredMachines.length===0?"— ไม่พบเครื่องจักร —":"— เลือกเครื่องจักร —"}</option>{filteredMachines.map(m=>(<option key={m.id} value={m.code}>{m.code} — {m.name}{m.brand?` (${m.brand}${m.model?` ${m.model}`:""})`:""}{m.serial?` · S/N ${m.serial}`:""}</option>))}</select>
            {f.categoryId&&filteredMachines.length>0&&<div className="hint">พบ {filteredMachines.length} เครื่องจักรในหมวดหมู่นี้</div>}
            {(()=>{ const sel=filteredMachines.find(m=>m.code===f.machineCode); return sel ? (
              <div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:8,padding:"9px 12px",background:"var(--accent-soft)",border:"1px solid rgba(30,64,175,.15)",borderRadius:8,fontSize:13}}>
                <span><span style={{color:"var(--muted)"}}>รหัส:</span> <span className="mono">{sel.code}</span></span>
                <span style={{color:"var(--line)"}}>·</span>
                <span><span style={{color:"var(--muted)"}}>ซีเรียล:</span> {sel.serial ? <span className="mono">{sel.serial}</span> : <span style={{color:"var(--muted)"}}>— ไม่ระบุ —</span>}</span>
                {sel.brand&&<><span style={{color:"var(--line)"}}>·</span><span><span style={{color:"var(--muted)"}}>ยี่ห้อ:</span> {sel.brand}{sel.model?` ${sel.model}`:""}</span></>}
              </div>
            ) : null; })()}
          </div>
          {/* ค่ามิเตอร์ ณ วันที่แจ้ง + คนขับ — เติมจากทะเบียนเครื่องจักรให้ก่อน แก้ทับได้ ค่าที่กรอกจะขึ้นบนใบแจ้งซ่อม */}
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}>
            <label><i className="fa-solid fa-gauge" style={{color:"var(--primary)",marginRight:6}}></i>ข้อมูลเครื่อง ณ วันที่แจ้ง</label>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10}}>
              <div>
                <div style={{fontSize:12,color:"var(--muted)",marginBottom:4}}>เลขมิเตอร์กิโลเมตร</div>
                <input type="number" min="0" step="any" value={f.odometerKm} onChange={e=>setF({...f,odometerKm:e.target.value})} placeholder="เช่น 125400" />
              </div>
              <div>
                <div style={{fontSize:12,color:"var(--muted)",marginBottom:4}}>เลขมิเตอร์ชั่วโมง</div>
                <input type="number" min="0" step="any" value={f.hourMeter} onChange={e=>setF({...f,hourMeter:e.target.value})} placeholder="เช่น 8320" />
              </div>
              <div>
                <div style={{fontSize:12,color:"var(--muted)",marginBottom:4}}>พนักงานขับ / ผู้ควบคุม</div>
                <input value={f.driverName} onChange={e=>setF({...f,driverName:e.target.value})} placeholder="เช่น นายสมชาย ใจดี" />
              </div>
            </div>
            <div className="hint">ไม่บังคับ · ระบบเติมเลขชั่วโมงและชื่อคนขับจากทะเบียนเครื่องจักรให้ แก้ให้ตรงกับหน้างานได้</div>
          </div>
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}><label>อาการ/ปัญหา * <span style={{color:"var(--muted)",fontWeight:400,fontSize:12}}>(เพิ่มได้หลายรายการ)</span></label><ProblemsField value={f.title} onChange={v=>setF({...f,title:v})} /></div>
          <div className="form-field full"><label><i className="fa-solid fa-images" style={{color:"var(--primary)",marginRight:6}}></i>รูปภาพประกอบ <span style={{color:"var(--muted)",fontWeight:400,fontSize:12}}>(ไม่บังคับ · สูงสุด 5 รูป)</span></label><PhotosField value={f.photos} onChange={v=>setF({...f,photos:v})} /></div>
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}><label>เลขที่ใบแจ้งซ่อม (ที่ไซต์งาน)</label><input value={f.siteId} onChange={e=>setF({...f,siteId:e.target.value})} placeholder="เช่น WR-1234" /><div className="hint">ไม่บังคับ · กรอกเลขที่จากใบงานจริงที่ไซต์</div></div>
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}><label><i className="fa-solid fa-calendar-day" style={{color:"var(--primary)",marginRight:6}}></i>วันที่แจ้ง</label><input type="date" value={f.reportDate} onChange={e=>setF({...f,reportDate:e.target.value})} /><div className="hint">ระบบเติมวันที่ปัจจุบันให้ · แก้ไขได้</div></div>
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}>
            <label><i className="fa-solid fa-location-dot" style={{color:"var(--primary)",marginRight:6}}></i>สถานที่ทำการซ่อม</label>
            <div style={{display:"grid",gap:10,border:"1px solid var(--line)",borderRadius:10,padding:"12px 14px"}}>
              <label style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",margin:0,fontWeight:400}}>
                <input type="radio" name="np-place" style={{width:"auto",flexShrink:0,margin:0}} checked={f.placeMode==="onsite"} onChange={()=>setF({...f,placeMode:"onsite"})} />
                <span style={{whiteSpace:"nowrap"}}>ส่งช่างซ่อมหน้างาน ที่</span>
                <input className="inp" style={{flex:1,minWidth:150}} value={f.placeOnsite} onChange={e=>setF({...f,placeOnsite:e.target.value})} placeholder="ชื่อโครงการ/สถานที่หน้างาน" />
              </label>
              <label style={{display:"flex",alignItems:"center",gap:8,margin:0,fontWeight:400}}>
                <input type="radio" name="np-place" style={{width:"auto",flexShrink:0,margin:0}} checked={f.placeMode==="workshop"} onChange={()=>setF({...f,placeMode:"workshop"})} />
                <span>โรงซ่อมของบริษัทที่แจ้งซ่อม</span>
              </label>
              <label style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",margin:0,fontWeight:400}}>
                <input type="radio" name="np-place" style={{width:"auto",flexShrink:0,margin:0}} checked={f.placeMode==="other"} onChange={()=>setF({...f,placeMode:"other"})} />
                <span>อื่นๆ</span>
                <input className="inp" style={{flex:1,minWidth:150}} value={f.placeOther} onChange={e=>setF({...f,placeOther:e.target.value})} placeholder="ระบุสถานที่" />
              </label>
            </div>
            <div className="hint">ระบบเติมชื่อโครงการให้อัตโนมัติ · แก้ไขได้</div>
          </div>
        </div>
      </div>
      <div style={{padding:"14px 22px",borderTop:"1px solid var(--line)",display:"flex",justifyContent:"flex-end",gap:10,background:"#FAFBFC"}}>
        <button className="btn btn-ghost" onClick={()=>goTo(window.isOpsRole(user)?"repairs":"r-dashboard")}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-paper-plane"></i> ส่งคำร้องแจ้งซ่อม</button>
      </div>
    </div>
    </>
  );
}

function MyRepairs({user}){
  const [rows,setRows] = React.useState(()=>{ if(user.role==="Engineer") return window.filterByUserProjects(user,window.__DATA.repairs,"project"); return window.filterByUserProjects(user,window.__DATA.repairs.filter(r=>r.reporterId===user.id),"project"); });
  const [detail,setDetail] = React.useState(null);
  const [editFor,setEditFor] = React.useState(null);
  // Reporter แก้เองไม่ได้ทันที ต้องส่งคำขอให้ Admin อนุมัติก่อน
  const needApproval = user.role === "Reporter";
  const { mine: myReqs } = window.useDeleteRequests(user);
  const pendingEditIds = React.useMemo(()=>new Set(
    (myReqs||[]).filter(x=>x.kind==="edit" && x.status==="pending" && x.action==="updateRepair").map(x=>String(x.targetKey))
  ),[myReqs]);
  const pendingDeleteIds = React.useMemo(()=>new Set(
    (myReqs||[]).filter(x=>x.kind!=="edit" && x.status==="pending" && x.action==="deleteRepair").map(x=>String(x.targetKey))
  ),[myReqs]);

  // คำขอถูกอนุมัติ → applyEditLocally แก้แคชกลางให้แล้ว ดึงกลับมาลงตารางด้วย ไม่งั้นหน้าจอยังโชว์ค่าเก่า
  const decidedCount = (myReqs||[]).filter(x=>x.status!=="pending").length;
  React.useEffect(()=>{
    const src = user.role==="Engineer" ? window.__DATA.repairs : window.__DATA.repairs.filter(r=>r.reporterId===user.id);
    setRows(window.filterByUserProjects(user, src, "project"));
  },[decidedCount]);

  const saveEdit = async (r, patch) => {
    const changes = window.diffFields(r, patch, window.REPAIR_FIELD_LABELS);
    if(!changes.length){ Swal.fire({icon:"info",title:"ยังไม่ได้แก้ไขอะไร",text:"ปรับข้อมูลที่ต้องการก่อนบันทึก"}); return; }
    if(needApproval){
      const sent = await window.requestEditApproval({
        user, action:"updateRepair", payload:{ id:r.id, patch },
        entityLabel:"ใบแจ้งซ่อม", targetName:r.running||r.id, project:r.project||"",
        targetInfo:[r.machineCode, r.subSite].filter(Boolean).join(" · "),
        changes,
      });
      if(sent) setEditFor(null);
      return;
    }
    try{
      await window.api("updateRepair",{id:r.id,patch,by:user.name});
      const updated = {...r,...patch,timeline:[...(r.timeline||[]),{status:patch.status||r.status,when:new Date(),by:user.name,note:"แก้ไขข้อมูล"}]};
      setRows(prev=>prev.map(x=>x.id===r.id?updated:x));
      window.__DATA.repairs = window.__DATA.repairs.map(x=>x.id===r.id?updated:x);
      setEditFor(null);
      Swal.fire({icon:"success",title:"บันทึกการแก้ไขแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  // ลบใบแจ้งซ่อม — ผู้แจ้งไม่ใช่ Admin จึงเข้าเส้นทางขออนุมัติเสมอ (deleteWithApproval จัดการให้)
  const remove = async (r) => {
    const done = await window.deleteWithApproval({
      user, action:"deleteRepair", payload:{id:r.id},
      entityLabel:"ใบแจ้งซ่อม", targetName:r.running||r.id, project:r.project||"",
      targetInfo:[r.machineCode, (window.getProblems(r)[0]||{}).text].filter(Boolean).join(" · "),
    });
    if(done){ setRows(prev=>prev.filter(x=>x.id!==r.id)); setDetail(null); }
  };

  const openEdit = (r) => {
    if(pendingEditIds.has(String(r.id))){
      Swal.fire({icon:"info",title:"มีคำขอแก้ไขรออนุมัติอยู่แล้ว",text:'ใบนี้ส่งคำขอไปแล้ว รอผู้ดูแลระบบอนุมัติก่อนจึงจะขอแก้ใหม่ได้ · ติดตามได้ที่เมนู "การแจ้งเตือน"'});
      return;
    }
    setDetail(null);
    setEditFor(r);
  };

  const cancel = (r) => {
    Swal.fire({title:"ยกเลิกคำร้อง?",text:`ต้องการยกเลิกคำร้อง "${r.running}" ใช่หรือไม่?`,icon:"warning",showCancelButton:true,confirmButtonText:"ยกเลิกคำร้อง",cancelButtonText:"ไม่",confirmButtonColor:"#EF4444"}).then(async res=>{
      if(res.isConfirmed){
        try{
          await window.api("updateRepairStatus",{id:r.id,status:"cancel",by:user.name,note:"ผู้แจ้งยกเลิกคำร้อง"});
          const upd=rows.map(x=>x.id===r.id?{...x,status:"cancel",timeline:[...x.timeline,{status:"cancel",when:new Date(),by:user.name,note:"ผู้แจ้งยกเลิกคำร้อง"}]}:x);
          setRows(upd); window.__DATA.repairs=window.__DATA.repairs.map(x=>x.id===r.id?upd.find(y=>y.id===x.id):x);
          Swal.fire({icon:"success",title:"ยกเลิกแล้ว",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
        }catch(err){ Swal.fire({icon:"error",title:"ไม่สำเร็จ",text:err.message}); }
      }
    });
  };

  return (
    <>
      <div className="card">
        <div className="filters"><div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>คำร้องแจ้งซ่อมของฉัน ({rows.length} รายการ)</div></div>
        <div className="table-wrap">
          <table className="data">
            <thead><tr><th>เลขที่</th><th className="hide-on-mobile">วันที่แจ้ง</th><th>อาการ/ปัญหา</th><th className="hide-on-mobile">หมวดหมู่</th><th>สถานะ</th><th className="hide-on-mobile">อัปเดตล่าสุด</th><th>จัดการ</th></tr></thead>
            <tbody>
              {rows.map(r=>{
                const last=r.timeline[r.timeline.length-1];
                const waiting = pendingEditIds.has(String(r.id));
                const waitingDel = pendingDeleteIds.has(String(r.id));
                return (<tr key={r.id}><td><span className="ticket-id">{r.running}</span>{waiting && <div style={{marginTop:3,display:"inline-flex",alignItems:"center",gap:4,padding:"1px 7px",borderRadius:999,background:"#FEF3C7",color:"#B45309",fontSize:10.5,fontWeight:600}} title="ส่งคำขอแก้ไขแล้ว รอผู้ดูแลระบบอนุมัติ"><i className="fa-solid fa-hourglass-half"></i> รออนุมัติแก้ไข</div>}{waitingDel && <div style={{marginTop:3,display:"inline-flex",alignItems:"center",gap:4,padding:"1px 7px",borderRadius:999,background:"#FEE2E2",color:"#B91C1C",fontSize:10.5,fontWeight:600}} title="ส่งคำขอลบแล้ว รอผู้ดูแลระบบอนุมัติ"><i className="fa-solid fa-hourglass-half"></i> รออนุมัติลบ</div>}</td><td className="hide-on-mobile" style={{color:"var(--muted)",whiteSpace:"nowrap"}}>{window.__DATA.fmtDate(r.createdAt)}</td><td><div className="cell-title"><ProblemLines title={r.title} max={4}/></div></td><td className="hide-on-mobile"><CategoryChip categoryId={r.categoryId}/></td><td><Badge status={r.status}/></td><td className="hide-on-mobile" style={{color:"var(--muted)",fontSize:12,whiteSpace:"nowrap"}}>{window.__DATA.fmtDateTime(last.when)}</td><td><div className="row-actions"><button className="ia" title="ดูรายละเอียด" onClick={()=>setDetail(r)}><i className="fa-solid fa-eye"></i></button><button className="ia" title={needApproval?"ขอแก้ไข (ต้องรออนุมัติ)":"แก้ไขข้อมูล"} style={{color:waiting?"#B45309":"#1E40AF"}} onClick={()=>openEdit(r)}><i className="fa-solid fa-pen"></i></button>{r.status==="new"&&<button className="ia" style={{color:"#D97706"}} onClick={()=>cancel(r)} title="ยกเลิกคำร้อง"><i className="fa-solid fa-ban"></i></button>}<button className="ia danger" title={needApproval?"ขอลบใบนี้ (ต้องรออนุมัติ)":"ลบใบแจ้งซ่อม"} onClick={()=>remove(r)}><i className="fa-solid fa-trash"></i></button></div></td></tr>);
              })}
              {rows.length===0&&(<tr><td colSpan="7"><div className="empty"><i className="fa-solid fa-clipboard"></i><div className="t">ยังไม่มีคำร้อง</div><div>คลิก "แจ้งซ่อมใหม่" ในเมนูด้านซ้ายเพื่อเริ่มต้น</div></div></td></tr>)}
            </tbody>
          </table>
        </div>
      </div>
      {detail && <RepairDetail r={detail} user={user} onClose={()=>setDetail(null)} onQuick={()=>{}} onEdit={openEdit}/>}
      {editFor && <EditRepairModal r={editFor} scope={needApproval?"reporter":undefined} onClose={()=>setEditFor(null)} onSave={saveEdit}/>}
    </>
  );
}
Object.assign(window,{ReporterDashboard,NewRequest,MyRepairs});
</script>

<script type="text/babel">
// ทะเบียนทรัพย์สิน — ข้อมูลจาก Firebase project "panamanee-3a15a" (/assets)
const ASSET_NO_NAME = "— ไม่ระบุชื่อ —";
const fmtQtyUnits = (byUnit)=>Object.entries(byUnit).map(([u,n])=>`${n.toLocaleString("th-TH")}${u?" "+u:""}`).join(" + ") || "0";
// สรุปทรัพย์สินแยกตามชื่อ — ใช้ทั้งหน้าจอสรุปและชีตสรุปในไฟล์ Excel
function summarizeAssetsByName(list){
  const map = new Map();
  (list||[]).forEach(r=>{
    const name = String(r.name||"").trim() || ASSET_NO_NAME;
    if(!map.has(name)) map.set(name,{name,count:0,qty:0,byUnit:{},bySite:{},byOwner:{},machines:0});
    const g = map.get(name);
    const n = Number(r.quantity)||0;
    const unit = String(r.unit||"").trim();
    g.count++; g.qty += n;
    g.byUnit[unit] = (g.byUnit[unit]||0) + n;
    const s = String(r.site||"").trim() || "ไม่ระบุสถานที่";
    g.bySite[s] = (g.bySite[s]||0) + n;
    const o = String(r.ownership||"").trim() || "ไม่ระบุ";
    g.byOwner[o] = (g.byOwner[o]||0) + n;
    if(r.__src==="machine") g.machines++;
  });
  return [...map.values()].sort((a,b)=>b.qty-a.qty || a.name.localeCompare(b.name,"th",{numeric:true}));
}

// ส่งออกทะเบียนทรัพย์สิน (รวมเครื่องจักรที่แสดงอยู่) เป็นไฟล์ Excel
async function exportAssetsExcel(list){
  if(!list || list.length===0){ Swal.fire({icon:"info",title:"ไม่มีข้อมูลให้ส่งออก"}); return; }
  try{
    Swal.fire({title:"กำลังสร้างไฟล์ Excel...",allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
    const XLSX = await ensureXLSX();
    const data = list.map((r,i)=>{
      const photos = (r.photos||[]).filter(Boolean);
      return {
        "ลำดับ": i+1,
        "แหล่งข้อมูล": r.__src==="machine" ? "ทะเบียนเครื่องจักร" : "ทะเบียนทรัพย์สิน",
        "รหัสทรัพย์สิน": r.assetCode || r.id || "",
        "ชื่อทรัพย์สิน": r.name || "",
        "ยี่ห้อ": r.brand || "",
        "รุ่น": r.model || "",
        "Serial No.": r.serial || "",
        "ขนาด": r.size || "",
        "จำนวน": Number(r.quantity) || 0,
        "หน่วย": r.unit || "",
        "ราคาต่อหน่วย (บาท)": r.price===""||r.price==null ? "" : Number(r.price)||0,
        "มูลค่ารวม (บาท)": r.price===""||r.price==null ? "" : Math.round((Number(r.price)||0)*(Number(r.quantity)||0)*100)/100,
        "กรรมสิทธิ์": r.ownership || "",
        "ผู้ถือครอง": r.holder || "",
        "สถานที่ (โครงการ)": r.site || "",
        "ไซต์งานย่อย": r.subSite || "",
        "วันที่รับเข้า": String(r.receivedAt||"").slice(0,10),
        "จำนวนรูป": photos.length,
        "ลิงก์รูปที่ 1": photos[0] || "",
        "ลิงก์รูปที่ 2": photos[1] || "",
        "ลิงก์รูปที่ 3": photos[2] || "",
        "หมายเหตุ": r.note || "",
      };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    ws["!cols"] = Object.keys(data[0]).map(k=>({wch: Math.min(42, Math.max(k.length+4, ...data.map(r=>String(r[k]??"").length+2)))}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "ทะเบียนทรัพย์สิน");
    // ชีตสรุปแยกตามชื่อทรัพย์สิน
    const sum = summarizeAssetsByName(list).map((g,i)=>({
      "ลำดับ": i+1,
      "ชื่อทรัพย์สิน": g.name,
      "จำนวนรายการ": g.count,
      "จำนวนรวม": g.qty,
      "จำนวนรวม (แยกหน่วย)": fmtQtyUnits(g.byUnit),
      "จำนวนสถานที่": Object.keys(g.bySite).length,
      "แยกตามสถานที่": Object.entries(g.bySite).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`${s}: ${n}`).join(", "),
      "แยกตามกรรมสิทธิ์": Object.entries(g.byOwner).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`${s}: ${n}`).join(", "),
    }));
    const ws2 = XLSX.utils.json_to_sheet(sum);
    ws2["!cols"] = Object.keys(sum[0]).map(k=>({wch: Math.min(60, Math.max(k.length+4, ...sum.map(r=>String(r[k]??"").length+2)))}));
    XLSX.utils.book_append_sheet(wb, ws2, "สรุปตามชื่อทรัพย์สิน");
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    XLSX.writeFile(wb, `ทะเบียนทรัพย์สิน_${stamp}.xlsx`);
    Swal.fire({icon:"success",title:`ส่งออกแล้ว ${data.length} รายการ`,timer:1500,showConfirmButton:false,toast:true,position:"top-end"});
  }catch(err){
    Swal.fire({icon:"error",title:"ส่งออกไม่สำเร็จ",text:err.message});
  }
}

function AssetRegistry({user}){
  const canEdit = ["Admin","Officer","Engineer"].includes(window.effectiveRole(user));
  const [rows,setRows] = React.useState(()=>window.__DATA.assetRegistry || null);
  const [err,setErr] = React.useState("");
  const [q,setQ] = React.useState("");
  const [site,setSite] = React.useState("");
  const [subSite,setSubSite] = React.useState("");
  const [owner,setOwner] = React.useState("");
  const [nameF,setNameF] = React.useState("");          // กรองตามชื่อทรัพย์สิน
  const [view,setView] = React.useState("list");        // list | summary — ตารางรายการ / สรุปตามชื่อทรัพย์สิน
  const [groupBy,setGroupBy] = React.useState("site");   // none | site | ownership | name
  const [collapsed,setCollapsed] = React.useState({});   // เก็บกลุ่มที่ถูกย่อ
  const [edit,setEdit] = React.useState(null);   // {mode:"add"|"edit", data:{...}}
  const [history,setHistory] = React.useState(null);   // ทรัพย์สินที่กำลังดูประวัติการย้าย
  const [src,setSrc] = React.useState("all");          // all | asset | machine — แหล่งข้อมูลที่แสดง
  const [machineView,setMachineView] = React.useState("");   // รหัสเครื่องจักรที่กำลังดูข้อมูล
  const [moveOpen,setMoveOpen] = React.useState(null);        // เปิดหน้าต่างย้าย/ออกใบส่งของ (null = ปิด, {} = ว่าง, {preset})

  // คำขอแก้ไขทะเบียนทรัพย์สินที่ตัวเองส่งไว้ — ขึ้นป้าย "รออนุมัติ" และโหลดค่าใหม่หลังอนุมัติ
  const { mine: myReqs } = window.useDeleteRequests(user);
  const pendingEditKeys = React.useMemo(()=>new Set(
    (myReqs||[]).filter(x=>x.kind==="edit" && x.status==="pending" && x.action==="saveAssetRegistry").map(x=>String(x.targetKey))
  ),[myReqs]);
  const decidedCount = (myReqs||[]).filter(x=>x.status!=="pending").length;
  React.useEffect(()=>{
    if(Array.isArray(window.__DATA.assetRegistry)) setRows(window.__DATA.assetRegistry.slice());
  },[decidedCount]);

  // ซิงค์ realtime กับใบส่งของ — ย้าย/ยกเลิก/แก้ DO ที่ไหนก็ตาม ตารางนี้อัปเดตเอง
  const [,setSyncTick] = React.useState(0);
  React.useEffect(()=>window.__ASSETSYNC.subscribe(kind=>{
    if(kind==="assets" && window.__ASSETSYNC.assets){ setErr(""); setRows(window.__ASSETSYNC.assets); }
    setSyncTick(t=>t+1);
  }),[]);

  React.useEffect(()=>{
    if(rows) return;
    let alive = true;
    window.api("loadAssetRegistry")
      .then(list=>{
        if(!alive) return;
        const sorted = list.slice().sort((a,b)=>String(a.assetCode||a.id||"").localeCompare(String(b.assetCode||b.id||""),"th"));
        window.__DATA.assetRegistry = sorted;
        setRows(sorted);
      })
      .catch(e=>{ if(alive) setErr(e.message||String(e)); });
    return ()=>{ alive = false; };
  },[rows]);

  // เครื่องจักรจากทะเบียนเครื่องจักร — แปลงให้อยู่ในรูปแบบเดียวกับทรัพย์สิน เพื่อแสดงรวมในตารางเดียว
  // (อ่านอย่างเดียวที่หน้านี้ · แก้ไขจริงที่เมนู "ทะเบียนเครื่องจักร")
  const machineRows = React.useMemo(()=>(window.__DATA.machines||[]).map(m=>({
    key: "MC:" + m.id,
    __src: "machine",
    machineCode: m.code || "",
    assetCode: m.code || "",
    name: m.name || "",
    brand: m.brand || "", model: m.model || "", serial: m.serial || "", size: m.size || "",
    quantity: 1, unit: "เครื่อง",
    ownership: m.ownership || "", holder: m.driverName || "",
    site: m.project || "", subSite: m.subSite || "",
    note: m.note || "",
    photos: window.machinePhotos(m),
    transferHistory: m.transferHistory || [],
  })),[rows]);

  // ทรัพย์สินผูกกับโครงการผ่านฟิลด์ site — กรองตามสิทธิ์โครงการก่อนเสมอ
  const merged = React.useMemo(()=>{
    const assets = src==="machine" ? [] : (rows||[]);
    const machines = src==="asset" ? [] : machineRows;
    return assets.concat(machines);
  },[rows,machineRows,src]);
  const scoped = React.useMemo(()=>window.filterByUserProjects(user, merged, "site"),[merged,user]);
  const sites = React.useMemo(()=>[...new Set(scoped.map(r=>r.site).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"th")),[scoped]);
  const owners = React.useMemo(()=>[...new Set(scoped.map(r=>r.ownership).filter(Boolean))].sort(),[scoped]);
  // ไซต์งานย่อยที่เลือกได้ = ไซต์ของโครงการที่กรองอยู่ (ไม่ได้กรองโครงการ = ทุกไซต์ที่มีในข้อมูล)
  const subSites = React.useMemo(()=>{
    const pool = site ? scoped.filter(r=>r.site===site) : scoped;
    return [...new Set(pool.map(r=>r.subSite).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"th",{numeric:true}));
  },[scoped,site]);

  // ชื่อทรัพย์สินที่เลือกได้ = ชื่อที่มีในโครงการ/ไซต์ที่กรองอยู่
  const names = React.useMemo(()=>{
    const pool = scoped.filter(r=>(!site || r.site===site) && (!subSite || (r.subSite||"")===subSite));
    return [...new Set(pool.map(r=>String(r.name||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"th",{numeric:true}));
  },[scoped,site,subSite]);

  const filtered = React.useMemo(()=>{
    const kw = q.trim().toLowerCase();
    return scoped.filter(r=>{
      if(site && r.site!==site) return false;
      if(subSite && (r.subSite||"")!==subSite) return false;
      if(owner && r.ownership!==owner) return false;
      if(nameF && String(r.name||"").trim()!==nameF) return false;
      if(!kw) return true;
      return [r.assetCode,r.name,r.brand,r.model,r.serial,r.site,r.subSite,r.holder,r.note]
        .some(v=>String(v||"").toLowerCase().includes(kw));
    });
  },[scoped,q,site,subSite,owner,nameF]);

  const totalQty = React.useMemo(()=>filtered.reduce((s,r)=>s+(Number(r.quantity)||0),0),[filtered]);

  // สรุปแยกตามชื่อทรัพย์สิน — จำนวนรายการ, จำนวนรวม (แยกหน่วย), กระจายตามสถานที่/กรรมสิทธิ์
  const nameSummary = React.useMemo(()=>summarizeAssetsByName(filtered),[filtered]);
  const openName = (n)=>{ setNameF(n===ASSET_NO_NAME ? "" : n); setView("list"); };

  const GROUP_META = {
    site:      { label:"สถานที่ (โครงการ)", empty:"— ไม่ระบุสถานที่ —", field:r=>r.site },
    subSite:   { label:"ไซต์งานย่อย",       empty:"— ไม่ระบุไซต์งานย่อย —", field:r=>r.subSite },
    ownership: { label:"กรรมสิทธิ์",         empty:"— ไม่ระบุกรรมสิทธิ์ —", field:r=>r.ownership },
    name:      { label:"ชื่อทรัพย์สิน",       empty:"— ไม่ระบุชื่อ —", field:r=>r.name },
  };
  const groups = React.useMemo(()=>{
    if(groupBy==="none") return null;
    const meta = GROUP_META[groupBy];
    const map = new Map();
    filtered.forEach(r=>{
      const raw = String(meta.field(r)||"").trim();
      const gkey = raw || meta.empty;
      if(!map.has(gkey)) map.set(gkey, { key:gkey, label:gkey, rows:[], qty:0 });
      const g = map.get(gkey); g.rows.push(r); g.qty += Number(r.quantity)||0;
    });
    return [...map.values()].sort((a,b)=>String(a.label).localeCompare(String(b.label),"th"));
  },[filtered,groupBy]);

  const toggleGroup = (k)=>setCollapsed(prev=>({...prev,[k]:!prev[k]}));
  const colCount = canEdit?10:9;

  const renderRow = (r)=>(
    <tr key={r.key}>
      <td>
        <span className="ticket-id">{r.assetCode||r.id||"—"}</span>
        {r.__src==="machine" && (
          <div style={{marginTop:3,display:"inline-flex",alignItems:"center",gap:4,padding:"1px 7px",borderRadius:999,background:"#EDE9FE",color:"#6D28D9",fontSize:10.5,fontWeight:600}} title="ข้อมูลจากทะเบียนเครื่องจักร">
            <i className="fa-solid fa-industry"></i> เครื่องจักร
          </div>
        )}
        {pendingEditKeys.has(String(r.key)) && <div style={{marginTop:3,display:"inline-flex",alignItems:"center",gap:4,padding:"1px 7px",borderRadius:999,background:"#FEF3C7",color:"#B45309",fontSize:10.5,fontWeight:600}} title="ส่งคำขอแก้ไขแล้ว รอผู้ดูแลระบบอนุมัติ"><i className="fa-solid fa-hourglass-half"></i> รออนุมัติแก้ไข</div>}
      </td>
      <td>
        <div className="cell-title">{r.name||"—"}{r.serial&&<div className="desc"><span className="mono">S/N {r.serial}</span></div>}</div>
        {(r.photos||[]).filter(Boolean).length>0 && (
          <div style={{display:"flex",gap:4,marginTop:5,flexWrap:"wrap"}}>
            {(r.photos||[]).filter(Boolean).slice(0,3).map((url,i)=><PhotoThumb key={i} url={url} size={38} />)}
          </div>
        )}
      </td>
      <td className="hide-on-mobile" style={{fontSize:13}}>{[r.brand,r.model].filter(Boolean).join(" ")||"—"}</td>
      <td className="hide-on-mobile" style={{fontSize:13}}>{r.size||"—"}</td>
      <td style={{whiteSpace:"nowrap"}}>{(Number(r.quantity)||0).toLocaleString("th-TH")} {r.unit||""}</td>
      <td className="hide-on-mobile" style={{whiteSpace:"nowrap",textAlign:"right",fontFamily:"JetBrains Mono,monospace",fontSize:12}}>
        {r.price!==""&&r.price!=null ? <>
          <div>฿{(Number(r.price)||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
          {(Number(r.quantity)||0)>1 && <div style={{fontSize:11,color:"var(--primary)",marginTop:2}} title="มูลค่ารวม = ราคาต่อหน่วย × จำนวน">รวม ฿{((Number(r.price)||0)*(Number(r.quantity)||0)).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>}
        </> : <span style={{color:"var(--muted)"}}>—</span>}
      </td>
      <td className="hide-on-mobile" style={{fontSize:13}}>{r.ownership||"—"}</td>
      <td className="hide-on-mobile" style={{fontSize:13}}>{r.holder||"—"}</td>
      <td style={{fontSize:13}}>
        {r.site ? <ProjectLabel name={r.site}/> : <span style={{color:"var(--muted)"}}>—</span>}
        {r.subSite && <div style={{marginTop:3}}><SubSiteTag value={r.subSite} project={r.site}/></div>}
        {(r.transferHistory||[]).length>0 && r.__src!=="machine" && (
          <button className="ia" title="ประวัติการย้าย" onClick={()=>setHistory(r)} style={{color:"#7C3AED",marginLeft:4}}>
            <i className="fa-solid fa-clock-rotate-left"></i>
          </button>
        )}
      </td>
      {canEdit && <td><div className="row-actions">
        {r.__src==="machine" ? (
          <button className="ia" title="ดูข้อมูลเครื่องจักร" onClick={()=>setMachineView(r.machineCode)} style={{color:"#6D28D9"}}><i className="fa-solid fa-eye"></i></button>
        ) : (<>
          <button className="ia" title="ย้ายโครงการ (ออกใบส่งของ)" style={{color:"#7C3AED"}}
            onClick={()=>setMoveOpen({preset:{fromProject:r.site||"", fromSubSite:"", pick: (Number(r.quantity)||0)>0 ? {[r.key]:Number(r.quantity)||0} : {}}})}>
            <i className="fa-solid fa-right-left"></i></button>
          <button className="ia" title="แก้ไข" onClick={()=>setEdit({mode:"edit",data:{...r}})}><i className="fa-solid fa-pen"></i></button>
          <button className="ia danger" title="ลบ" onClick={()=>remove(r)}><i className="fa-solid fa-trash"></i></button>
        </>)}
      </div></td>}
    </tr>
  );

  const sortRows = (list) => list.slice().sort((a,b)=>String(a.assetCode||a.id||"").localeCompare(String(b.assetCode||b.id||""),"th"));
  const commit = (list) => { const sorted = sortRows(list); window.__DATA.assetRegistry = sorted; setRows(sorted); };

  const save = async (form) => {
    // แก้ไขทะเบียนทรัพย์สินต้องผ่านการอนุมัติของ Admin (เพิ่มรายการใหม่ไม่ต้อง)
    if(form.key && user.role !== "Admin"){
      const before = (rows||[]).find(x=>x.key===form.key) || {};
      const changes = window.diffFields(before, form, window.ASSET_FIELD_LABELS);
      const sent = await window.requestEditApproval({
        user, action:"saveAssetRegistry", payload:{ key: form.key, asset: form, by: user.name },
        entityLabel:"ทะเบียนทรัพย์สิน", targetName:`${form.assetCode||form.id||""} ${form.name||""}`.trim(), project:form.site||"",
        targetInfo:[form.brand,form.model,form.serial,form.holder].filter(Boolean).join(" · "),
        changes,
      });
      if(sent) setEdit(null);
      return;
    }
    const saved = await window.api("saveAssetRegistry",{ key: form.key || "", asset: form, by: user.name });
    const base = rows || [];
    commit(base.some(x=>x.key===saved.key) ? base.map(x=>x.key===saved.key?saved:x) : base.concat([saved]));
    setEdit(null);
    Swal.fire({icon:"success",title:form.key?"บันทึกการแก้ไขแล้ว":"เพิ่มทรัพย์สินแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
  };

  const remove = async (r) => {
    const done = await window.deleteWithApproval({
      user, action:"deleteAssetRegistry", payload:{key:r.key},
      entityLabel:"ทะเบียนทรัพย์สิน", targetName:`${r.assetCode||r.id||""} ${r.name||""}`.trim(), project:r.site||"",
      targetInfo:[r.brand,r.model,r.serial,r.holder].filter(Boolean).join(" · "),
    });
    if(done) commit((rows||[]).filter(x=>x.key!==r.key));
  };

  const blank = {assetCode:"",name:"",brand:"",model:"",serial:"",size:"",quantity:1,unit:"",price:"",ownership:"",holder:"",site:"",subSite:"",receivedAt:"",note:"",photos:[]};

  if(err) return (
    <div className="card"><div className="card-body">
      <div className="empty">
        <i className="fa-solid fa-triangle-exclamation" style={{color:"#EF4444"}}></i>
        <div className="t">โหลดทะเบียนทรัพย์สินไม่สำเร็จ</div>
        <div>{err}</div>
        <button className="btn btn-primary btn-sm" style={{marginTop:12}} onClick={()=>{setErr("");setRows(null);}}><i className="fa-solid fa-rotate"></i> ลองใหม่</button>
      </div>
    </div></div>
  );
  if(!rows) return <Loading show={true} text="กำลังโหลดทะเบียนทรัพย์สิน..."/>;

  return (
    <>
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i>
          <input placeholder="ค้นหารหัส / ชื่อ / ยี่ห้อ / รุ่น / Serial / สถานที่..." value={q} onChange={e=>setQ(e.target.value)} />
        </div>
        <select value={site} onChange={e=>{ setSite(e.target.value); setSubSite(""); }}>
          <option value="">ทุกสถานที่</option>
          {sites.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        {subSites.length>0 && (
          <select value={subSite} onChange={e=>setSubSite(e.target.value)} title="ไซต์งานย่อย">
            <option value="">ทุกไซต์งานย่อย</option>
            {subSites.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        )}
        <select value={owner} onChange={e=>setOwner(e.target.value)}>
          <option value="">ทุกกรรมสิทธิ์</option>
          {owners.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
        <select value={nameF} onChange={e=>setNameF(e.target.value)} title="แยกตามชื่อทรัพย์สิน" style={{maxWidth:220}}>
          <option value="">ทุกชื่อทรัพย์สิน ({names.length.toLocaleString("th-TH")})</option>
          {(nameF && !names.includes(nameF) ? [nameF].concat(names) : names).map(n=><option key={n} value={n}>{n}</option>)}
        </select>
        <select value={src} onChange={e=>setSrc(e.target.value)} title="แหล่งข้อมูลที่แสดง">
          <option value="all">ทรัพย์สิน + เครื่องจักร</option>
          <option value="asset">เฉพาะทะเบียนทรัพย์สิน</option>
          <option value="machine">เฉพาะทะเบียนเครื่องจักร</option>
        </select>
        {view==="list" && <select value={groupBy} onChange={e=>setGroupBy(e.target.value)} title="จัดกลุ่มทรัพย์สิน">
          <option value="none">ไม่จัดกลุ่ม</option>
          <option value="site">จัดกลุ่มตามสถานที่</option>
          <option value="subSite">จัดกลุ่มตามไซต์งานย่อย</option>
          <option value="ownership">จัดกลุ่มตามกรรมสิทธิ์</option>
          <option value="name">จัดกลุ่มตามชื่อทรัพย์สิน</option>
        </select>}
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>
          {filtered.length.toLocaleString("th-TH")} / {scoped.length.toLocaleString("th-TH")} รายการ · รวม {totalQty.toLocaleString("th-TH")} หน่วย
          <span style={{marginLeft:10}}><window.AssetSyncBadge/></span>
        </div>
        <button className="btn btn-ghost" onClick={()=>exportAssetsExcel(filtered)} title="ส่งออกข้อมูลที่แสดงอยู่เป็นไฟล์ Excel">
          <i className="fa-solid fa-file-excel" style={{color:"#1D6F42"}}></i> ส่งออก Excel
        </button>
        <button className="btn btn-ghost" title="โหลดข้อมูลล่าสุดจากฐานข้อมูล (เช่น หลังออก/ยกเลิกใบส่งของ)" onClick={()=>{ window.__DATA.assetRegistry=null; setRows(null); }}>
          <i className="fa-solid fa-rotate"></i> รีเฟรช
        </button>
        {canEdit && <button className="btn btn-ghost" style={{color:"#7C3AED",borderColor:"#DDD6FE"}} onClick={()=>setMoveOpen({preset:{fromProject:site||"",fromSubSite:site?(subSite||""):"",pick:{}}})} title="ย้ายทรัพย์สินระหว่างโครงการ พร้อมออกใบส่งของ (DO)"><i className="fa-solid fa-right-left"></i> ย้ายทรัพย์สิน</button>}
        {canEdit && <button className="btn btn-primary" onClick={()=>setEdit({mode:"add",data:{...blank}})}><i className="fa-solid fa-plus"></i> เพิ่มทรัพย์สิน</button>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",padding:"0 16px 12px"}}>
        <div className="seg" style={{display:"inline-flex",background:"var(--bg)",border:"1px solid var(--line)",borderRadius:10,padding:3}}>
          {[{k:"list",l:"รายการทรัพย์สิน",i:"fa-list"},{k:"summary",l:"สรุปตามชื่อทรัพย์สิน",i:"fa-chart-simple"}].map(t=>(
            <button key={t.k} onClick={()=>setView(t.k)}
              style={{padding:"7px 14px",borderRadius:7,border:"none",fontSize:13,cursor:"pointer",fontFamily:"Kanit",
                      background:view===t.k?"var(--primary)":"transparent",color:view===t.k?"#fff":"var(--muted)"}}>
              <i className={`fa-solid ${t.i}`}></i> {t.l}
            </button>
          ))}
        </div>
        {nameF && (
          <span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:999,background:"#DBEAFE",color:"#1E40AF",fontSize:12.5,fontWeight:500}}>
            <i className="fa-solid fa-tag"></i> {nameF}
            <button onClick={()=>setNameF("")} title="ล้างตัวกรองชื่อ" style={{border:"none",background:"transparent",color:"inherit",cursor:"pointer",padding:0}}><i className="fa-solid fa-xmark"></i></button>
          </span>
        )}
        {view==="summary" && <span style={{color:"var(--muted)",fontSize:13}}>{nameSummary.length.toLocaleString("th-TH")} ชื่อทรัพย์สิน</span>}
      </div>
      {view==="summary" && (
      <div className="table-wrap">
        <table className="data">
          <thead><tr>
            <th>ชื่อทรัพย์สิน</th><th>จำนวนรายการ</th><th>จำนวนรวม</th>
            <th>แยกตามสถานที่ (โครงการ)</th><th className="hide-on-mobile">แยกตามกรรมสิทธิ์</th><th></th>
          </tr></thead>
          <tbody>
            {nameSummary.map(g=>(
              <tr key={g.name}>
                <td>
                  <div className="cell-title">{g.name}</div>
                  {g.machines>0 && <div style={{marginTop:3,display:"inline-flex",alignItems:"center",gap:4,padding:"1px 7px",borderRadius:999,background:"#EDE9FE",color:"#6D28D9",fontSize:10.5,fontWeight:600}}><i className="fa-solid fa-industry"></i> เครื่องจักร {g.machines}</div>}
                </td>
                <td style={{whiteSpace:"nowrap"}}>{g.count.toLocaleString("th-TH")}</td>
                <td style={{whiteSpace:"nowrap",fontWeight:600}}>{fmtQtyUnits(g.byUnit)}</td>
                <td style={{fontSize:12.5}}>
                  <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                    {Object.entries(g.bySite).sort((a,b)=>b[1]-a[1]).map(([s,n])=>(
                      <span key={s} style={{padding:"2px 8px",borderRadius:999,background:"var(--bg)",border:"1px solid var(--line)",whiteSpace:"nowrap"}}>
                        {s} <b>{n.toLocaleString("th-TH")}</b>
                      </span>
                    ))}
                  </div>
                </td>
                <td className="hide-on-mobile" style={{fontSize:12.5}}>
                  {Object.entries(g.byOwner).sort((a,b)=>b[1]-a[1]).map(([o,n])=><div key={o}>{o}: <b>{n.toLocaleString("th-TH")}</b></div>)}
                </td>
                <td>
                  {g.name!==ASSET_NO_NAME && <button className="ia" title="ดูรายการของทรัพย์สินนี้" onClick={()=>openName(g.name)}><i className="fa-solid fa-arrow-right"></i></button>}
                </td>
              </tr>
            ))}
            {nameSummary.length>0 && (
              <tr style={{background:"var(--bg)",fontWeight:600}}>
                <td>รวมทั้งหมด</td>
                <td>{filtered.length.toLocaleString("th-TH")}</td>
                <td colSpan={4}>{totalQty.toLocaleString("th-TH")} หน่วย</td>
              </tr>
            )}
            {nameSummary.length===0 && (<tr><td colSpan={6}><div className="empty">
              <i className="fa-solid fa-boxes-stacked"></i>
              <div className="t">ไม่พบข้อมูล</div>
              <div>ลองเปลี่ยนเงื่อนไขการค้นหา</div>
            </div></td></tr>)}
          </tbody>
        </table>
      </div>
      )}
      {view==="list" && <div className="table-wrap">
        <table className="data">
          <thead><tr>
            <th>รหัสทรัพย์สิน</th><th>ชื่อทรัพย์สิน</th>
            <th className="hide-on-mobile">ยี่ห้อ / รุ่น</th><th className="hide-on-mobile">ขนาด</th>
            <th>จำนวน</th><th className="hide-on-mobile" style={{textAlign:"right"}}>ราคา/หน่วย</th><th className="hide-on-mobile">กรรมสิทธิ์</th>
            <th className="hide-on-mobile">ผู้ถือครอง</th><th>สถานที่ (โครงการ)</th>
            {canEdit && <th>จัดการ</th>}
          </tr></thead>
          <tbody>
            {!groups && filtered.map(r=>renderRow(r))}
            {groups && groups.map(g=>{
              const isCollapsed = !!collapsed[g.key];
              return (
                <React.Fragment key={g.key}>
                  <tr className="group-row" onClick={()=>toggleGroup(g.key)} style={{cursor:"pointer",background:"var(--bg)"}}>
                    <td colSpan={colCount} style={{fontWeight:600,fontSize:13.5,padding:"9px 14px",borderTop:"2px solid var(--line)"}}>
                      {/* ห่อไว้ใน .group-label เพื่อให้ชื่อกลุ่มยังเห็นอยู่ตอนเลื่อนตารางแนวนอนบนมือถือ */}
                      <span className="group-label">
                        <i className={`fa-solid ${isCollapsed?"fa-chevron-right":"fa-chevron-down"}`} style={{marginRight:8,color:"var(--muted)",fontSize:11}}></i>
                        {groupBy==="site" ? <ProjectLabel name={g.label}/> : g.label}
                        <span style={{marginLeft:10,fontWeight:400,color:"var(--muted)",fontSize:12.5}}>{g.rows.length.toLocaleString("th-TH")} รายการ · รวม {g.qty.toLocaleString("th-TH")} หน่วย</span>
                      </span>
                    </td>
                  </tr>
                  {!isCollapsed && g.rows.map(r=>renderRow(r))}
                </React.Fragment>
              );
            })}
            {filtered.length===0 && (<tr><td colSpan={colCount}><div className="empty">
              <i className="fa-solid fa-boxes-stacked"></i>
              <div className="t">ไม่พบข้อมูล</div>
              <div>{rows.length===0 ? "ยังไม่มีทรัพย์สินในทะเบียน" : "ลองเปลี่ยนเงื่อนไขการค้นหา"}</div>
            </div></td></tr>)}
          </tbody>
        </table>
      </div>}
    </div>
    {edit && <AssetForm mode={edit.mode} initial={edit.data} sites={sites} owners={owners} user={user} onClose={()=>setEdit(null)} onSave={save}/>}
    {history && <AssetHistoryModal asset={history} onClose={()=>setHistory(null)}/>}
    {machineView && <window.MachineQuickView code={machineView} onClose={()=>setMachineView("")}/>}
    {moveOpen && <TransferAssetsModal user={user} preset={moveOpen.preset} onClose={()=>setMoveOpen(null)} onSaved={()=>setMoveOpen(null)}/>}
    </>
  );
}

      footer={<button className="btn btn-ghost" onClick={onClose}>ปิด</button>}>
      <div style={{marginBottom:12,fontSize:13,color:"var(--muted)"}}>

            </div>
            <div style={{fontSize:12,color:"var(--muted)",marginTop:4}}>

// เลือกโครงการปลายทาง + ข้อมูลใบส่งของ
// ย้ายโครงการ + ออกใบส่งของ — เลือกทรัพย์สินได้ในตัว (เรียกจากหน้าใบส่งของ)
// preset (ไม่บังคับ) = เปิดจากหน้าทะเบียนทรัพย์สิน: {fromProject, fromSubSite, pick:{assetKey: จำนวน}} — เลือกต้นทาง/รายการไว้ให้ก่อน
function TransferAssetsModal({user,onClose,onSaved,preset}){
  const projects = React.useMemo(()=>window.visibleProjects(user),[user]);
  const [assets,setAssets] = React.useState(()=>window.__DATA.assetRegistry || null);
  const [loadErr,setLoadErr] = React.useState("");
  const [toProject,setToProject] = React.useState("");
  const [docNo,setDocNo] = React.useState("");
  const [docDate,setDocDate] = React.useState(()=>window.__DATA.fmtDate(new Date()));
  const [sender,setSender] = React.useState(user.name||"");
  const [receiver,setReceiver] = React.useState("");
  const [approver,setApprover] = React.useState("");
  const [vehicleType,setVehicleType] = React.useState("");
  const [vehiclePlate,setVehiclePlate] = React.useState("");
  const [driverName,setDriverName] = React.useState("");
  const [note,setNote] = React.useState("");
  const [busy,setBusy] = React.useState(false);
  const [q,setQ] = React.useState("");
  const [fromProject,setFromProject] = React.useState((preset&&preset.fromProject)||"");   // โครงการต้นทาง — เลือกก่อน แล้วค่อยเลือกทรัพย์สินในโครงการนั้น
  const [fromSubSite,setFromSubSite] = React.useState((preset&&preset.fromSubSite)||"");   // ไซต์งานย่อยต้นทาง (ไม่เลือก = ทั้งโครงการ)
  const [toSubSite,setToSubSite] = React.useState("");       // ไซต์งานย่อยปลายทาง
  const [qty,setQty] = React.useState(()=>({...((preset&&preset.pick)||{})}));   // {assetKey: จำนวนที่จะย้าย} — มีคีย์ = ถูกเลือก

  // จำนวนคงเหลือต้องเป็นค่าล่าสุดเสมอ (อีกเครื่องอาจย้ายของชิ้นเดียวกันอยู่)
  React.useEffect(()=>window.__ASSETSYNC.subscribe(kind=>{ if(kind==="assets" && window.__ASSETSYNC.assets) setAssets(window.__ASSETSYNC.assets); }),[]);
  React.useEffect(()=>{
    if(assets) return;
    let alive = true;
    window.api("loadAssetRegistry")
      .then(list=>{ if(!alive) return; window.__DATA.assetRegistry = list; setAssets(list); })
      .catch(e=>{ if(alive) setLoadErr(e.message||String(e)); });
    return ()=>{ alive=false; };
  },[assets]);

  // เลขที่ใบส่งของ: DO-<รหัสโครงการต้นทาง>-<ปีพ.ศ.><เดือน>/<ลำดับ> — รูปแบบเดียวกับเลขที่ใบแจ้งซ่อม
  // ลำดับนับแยกตามโครงการต้นทาง (โครงการที่ส่งของออก) รายเดือน
  React.useEffect(()=>{
    if(!fromProject){ setDocNo(""); return; }
    let alive = true;
    window.api("loadDeliveryOrders").then(list=>{
      if(!alive) return;
      const code = String(window.getProjectCode(fromProject)||fromProject).trim().replace(/\s+/g,"-").toUpperCase();
      const d = new Date();
      const prefix = "DO-"+code+"-"+String(d.getFullYear()+543)+String(d.getMonth()+1).padStart(2,"0")+"/";
      let max = 0;
      list.forEach(x=>{
        const t = String(x.docNo||"");
        if(t.slice(0,prefix.length)===prefix){ const n=parseInt(t.slice(prefix.length),10); if(!isNaN(n)&&n>max) max=n; }
      });
      setDocNo(prefix+String(max+1).padStart(3,"0"));
    }).catch(()=>setDocNo(""));
    return ()=>{ alive=false; };
  },[fromProject]);

  const sites = React.useMemo(()=>[...new Set((assets||[]).map(a=>a.site).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"th")),[assets]);

  // ตัวเลือกโครงการต้นทาง = โครงการที่มีสิทธิ์ + ชื่อสถานที่เดิมในทะเบียนที่ยังไม่ตรงกับชื่อโครงการ
  const fromOptions = React.useMemo(()=>{
    const counts = {};
    (assets||[]).forEach(a=>{ if(a.site) counts[a.site] = (counts[a.site]||0)+1; });
    const named = projects.map(p=>({value:p.name, label:(p.code?`[${p.code}] `:"")+p.name, n:counts[p.name]||0}));
    const legacy = sites.filter(s=>!projects.some(p=>p.name===s)).map(s=>({value:s, label:s+" (ข้อมูลเดิม)", n:counts[s]||0}));
    return named.concat(legacy);
  },[projects,sites,assets]);

  // เปลี่ยนต้นทาง = ล้างรายการที่เลือกไว้ ไม่ให้ทรัพย์สินข้ามโครงการติดมาด้วย
  const changeFrom = (v) => { setFromProject(v); setFromSubSite(""); setQty({}); };
  const changeFromSubSite = (v) => { setFromSubSite(v); setQty({}); };

  // แสดงเฉพาะทรัพย์สินที่อยู่โครงการต้นทางที่เลือก (เลือกไซต์ย่อยด้วย = กรองซ้ำอีกชั้น)
  const candidates = React.useMemo(()=>{
    if(!fromProject) return [];
    const kw = q.trim().toLowerCase();
    return (assets||[]).filter(a=>{
      if(a.site!==fromProject) return false;
      if(fromSubSite && (a.subSite||"")!==fromSubSite) return false;
      if(!kw) return true;
      return [a.assetCode,a.name,a.brand,a.model,a.serial,a.site,a.subSite].some(v=>String(v||"").toLowerCase().includes(kw));
    });
  },[assets,q,fromProject,fromSubSite]);

  // เฉพาะของที่ยังอยู่โครงการต้นทางจริง — ถ้าระหว่างเลือกมีคนย้ายออกไปแล้ว จะหลุดจากรายการอัตโนมัติ
  const picked = React.useMemo(()=>(assets||[]).filter(a=>qty[a.key]!==undefined && a.site===fromProject && (!fromSubSite || (a.subSite||"")===fromSubSite)),[assets,qty,fromProject,fromSubSite]);
  const totalMoving = picked.reduce((s,a)=>s+(Number(qty[a.key])||0),0);

  const toggle = (a) => setQty(prev=>{
    const n = {...prev};
    if(n[a.key]!==undefined) delete n[a.key];
    else n[a.key] = Number(a.quantity)||0;
    return n;
  });
  const setQtyFor = (a,v) => {
    const max = Number(a.quantity)||0;
    setQty(prev=>({...prev,[a.key]: v==="" ? "" : Math.min(Math.max(Number(v)||0,0),max)}));
  };
  const allShown = candidates.length>0 && candidates.every(a=>qty[a.key]!==undefined);
  const pickAllShown = () => setQty(prev=>{
    const n = {...prev};
    candidates.forEach(a=>{ if(allShown) delete n[a.key]; else n[a.key] = Number(a.quantity)||0; });
    return n;
  });

  const submit = async () => {
    if(!fromProject){ Swal.fire({icon:"warning",title:"กรุณาเลือกโครงการต้นทาง"}); return; }
    if(!toProject){ Swal.fire({icon:"warning",title:"กรุณาเลือกโครงการปลายทาง"}); return; }
    if(fromProject===toProject){ Swal.fire({icon:"warning",title:"ต้นทางกับปลายทางซ้ำกัน",text:"กรุณาเลือกโครงการปลายทางที่ต่างจากต้นทาง"}); return; }
    if(!docNo){ Swal.fire({icon:"warning",title:"ยังออกเลขที่ใบส่งของไม่สำเร็จ",text:"กรุณารอสักครู่แล้วลองใหม่"}); return; }
    const moves = picked.map(a=>({key:a.key, qty:Number(qty[a.key])||0})).filter(x=>x.qty>0);
    if(!moves.length){ Swal.fire({icon:"warning",title:"ยังไม่ได้เลือกทรัพย์สิน",text:"เลือกรายการและระบุจำนวนที่จะย้ายอย่างน้อย 1 รายการ"}); return; }
    setBusy(true);
    try{
      const res = await window.api("transferAssets",{
        moves, toProject, toSubSite, note, by:user.name,
        doc:{ docNo, docDate, sender, receiver, approver, vehicleType, vehiclePlate, driverName, fromProject, fromSubSite, toSubSite,
              senderId: window.__SIG.resolve(sender,"","",user), receiverId: window.__SIG.resolve(receiver,"","",user),
              approverId: approver ? window.__SIG.resolve(approver,"","",user) : "",
              fromProjectLabel: fromProject + (fromSubSite?` · ${fromSubSite}`:"") },
      });
      // ย้ายบางส่วนจะแตกรายการใหม่ที่ปลายทาง — ล้าง cache ให้ทั้งสองหน้าโหลดใหม่
      window.__DATA.assetRegistry = null;
      window.__DATA.deliveryOrders = null;
      onSaved && onSaved(res);
      const { isConfirmed } = await Swal.fire({
        icon:"success",
        title:"ย้ายโครงการสำเร็จ",
        html:"ย้าย <b>"+res.items.length+"</b> รายการ จาก <b>"+fromProject+(fromSubSite?" · "+fromSubSite:"")+"</b> ไปยัง <b>"+toProject+(toSubSite?" · "+toSubSite:"")+"</b><br/>ออกใบส่งของเลขที่ <b class='mono'>"+docNo+"</b>",
        showCancelButton:true,
        confirmButtonText:"<i class='fa-solid fa-file-pdf'></i> ดาวน์โหลดใบส่งของ",
        cancelButtonText:"ปิด", confirmButtonColor:"#1E40AF"
      });
      if(isConfirmed) window.downloadDeliveryOrderPdf(res.doc);
    }catch(err){ Swal.fire({icon:"error",title:"ย้ายไม่สำเร็จ",text:err.message}); }
    finally{ setBusy(false); }
  };

  const inSt = {width:"100%",padding:"9px 11px",border:"1px solid var(--line)",borderRadius:8,fontFamily:"Kanit",fontSize:13.5,background:"#fff"};

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className="fa-solid fa-right-left" style={{color:"#7C3AED",marginRight:8}}></i>ย้ายโครงการ / ออกใบส่งของ</>}
      footer={<>
        <button className="btn btn-ghost" onClick={onClose} disabled={busy}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit} disabled={busy}>
          {busy ? <><div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> กำลังบันทึก...</> : <><i className="fa-solid fa-check"></i> ยืนยันการย้าย + ออกใบส่งของ</>}
        </button>
      </>}>
      <div style={{display:"grid",gap:14}}>
        <div className="form-grid">
          <div className="form-field full">
            <label>เส้นทางการส่ง — จากต้นทาง ไปยังปลายทาง *</label>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <select style={{...inSt,flex:"1 1 200px",minWidth:0}} value={fromProject} onChange={e=>changeFrom(e.target.value)}>
                <option value="">— เลือกโครงการต้นทาง —</option>
                {fromOptions.map(o=>(<option key={o.value} value={o.value}>{o.label}{o.n?` · ${o.n} รายการ`:" · ไม่มีทรัพย์สิน"}</option>))}
              </select>
              <i className="fa-solid fa-arrow-right" style={{color:"#7C3AED",flex:"0 0 auto"}}></i>
              <select style={{...inSt,flex:"1 1 200px",minWidth:0}} value={toProject} onChange={e=>{ setToProject(e.target.value); setToSubSite(""); }}>
                <option value="">— เลือกโครงการปลายทาง —</option>
                {projects.filter(p=>p.name!==fromProject).map(p=>(<option key={p.id} value={p.name}>{p.code?`[${p.code}] `:""}{p.name}</option>))}
              </select>
            </div>
            {(window.projectSites(fromProject).length>0 || window.projectSites(toProject).length>0) && (
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginTop:8}}>
                <select style={{...inSt,flex:"1 1 200px",minWidth:0}} value={fromSubSite} onChange={e=>changeFromSubSite(e.target.value)} disabled={!window.projectSites(fromProject).length}>
                  <option value="">{window.projectSites(fromProject).length ? "— ทุกไซต์งานย่อยของต้นทาง —" : "— ต้นทางไม่มีไซต์งานย่อย —"}</option>
                  {window.projectSites(fromProject).map(s=><option key={s} value={s}>{s}</option>)}
                </select>
                <i className="fa-solid fa-sitemap" style={{color:"#7C3AED",flex:"0 0 auto",fontSize:12}}></i>
                <select style={{...inSt,flex:"1 1 200px",minWidth:0}} value={toSubSite} onChange={e=>setToSubSite(e.target.value)} disabled={!window.projectSites(toProject).length}>
                  <option value="">{window.projectSites(toProject).length ? "— ทั้งโครงการ (ไม่ระบุไซต์) —" : "— ปลายทางไม่มีไซต์งานย่อย —"}</option>
                  {window.projectSites(toProject).map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            )}
            <div className="hint">ต้นทางใช้เป็น "จากโครงการ" บนใบส่งของ · เลือกต้นทางก่อน แล้วรายการทรัพย์สินด้านล่างจะแสดงเฉพาะของในโครงการ/ไซต์นั้น · ไซต์ปลายทางจะถูกบันทึกให้ทรัพย์สินทุกชิ้นที่ย้าย</div>
          </div>
          <div className="form-field">
            <label>เลขที่ใบส่งของ</label>
            <input value={docNo} onChange={e=>setDocNo(e.target.value)} placeholder={fromProject?"กำลังออกเลขที่...":"เลือกโครงการต้นทางก่อน"} />
          </div>
          <div className="form-field">
            <label>วันที่</label>
            <input type="date" value={docDate} onChange={e=>setDocDate(e.target.value)} />
          </div>
          <div className="form-field"><label>ผู้จัดเตรียม (ต้นทาง / ผู้ส่ง)</label><input value={sender} onChange={e=>setSender(e.target.value)} /></div>
          <div className="form-field"><label>ผู้อนุมัติ (ต้นทาง)</label><input value={approver} onChange={e=>setApprover(e.target.value)} placeholder="ไม่บังคับ" /></div>
          <div className="form-field"><label>ผู้จัดเตรียม (ปลายทาง / ผู้รับ)</label><input value={receiver} onChange={e=>setReceiver(e.target.value)} /></div>
          <div className="form-field"><label>ประเภทรถขนส่ง</label><input value={vehicleType} onChange={e=>setVehicleType(e.target.value)} placeholder="เช่น กระบะ, 6 ล้อ, เทรลเลอร์" /></div>
          <div className="form-field"><label>ทะเบียนรถ</label><input value={vehiclePlate} onChange={e=>setVehiclePlate(e.target.value)} placeholder="เช่น 7808" /></div>
          <div className="form-field"><label>ชื่อพนักงานขับ</label><input value={driverName} onChange={e=>setDriverName(e.target.value)} /></div>
          <div className="form-field full"><label>เหตุผล / หมายเหตุ</label><textarea rows="2" value={note} onChange={e=>setNote(e.target.value)} placeholder="เช่น ย้ายตามแผนงาน, ส่งมอบให้โครงการปลายทาง..."></textarea></div>
        </div>

        <div>
          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8,flexWrap:"wrap"}}>
            <div className="search-input" style={{flex:1,minWidth:180}}>
              <i className="fa-solid fa-magnifying-glass"></i>
              <input placeholder="ค้นหารหัส / ชื่อ / ยี่ห้อ / Serial..." value={q} onChange={e=>setQ(e.target.value)} />
            </div>
            <div style={{fontSize:12.5,color:"var(--muted)",whiteSpace:"nowrap"}}>
              ต้นทาง: <b style={{color:fromProject?"var(--text)":"#B45309"}}>{fromProject||"ยังไม่ได้เลือก"}{fromSubSite?` · ${fromSubSite}`:""}</b>
            </div>
          </div>
          <div style={{fontSize:12,color:"var(--muted)",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
            <span>เลือกทรัพย์สินที่จะย้าย · ระบุจำนวนได้ ย้ายไม่ครบจำนวนก็ได้</span>
            <span>เลือกแล้ว <b style={{color:"var(--primary)"}}>{picked.length}</b> รายการ · รวม <b style={{color:"var(--primary)"}}>{totalMoving.toLocaleString("th-TH")}</b> หน่วย</span>
          </div>
          {loadErr && <div style={{fontSize:13,color:"#B91C1C",marginBottom:8}}>โหลดทะเบียนทรัพย์สินไม่สำเร็จ: {loadErr}</div>}
          {!assets ? <div style={{padding:20,textAlign:"center",color:"var(--muted)",fontSize:13}}>กำลังโหลดทะเบียนทรัพย์สิน...</div> : (
            <div style={{maxHeight:260,overflow:"auto",border:"1px solid var(--line)",borderRadius:8}}>
              <table className="data" style={{fontSize:13}}>
                <thead><tr>
                  <th style={{width:36}}><input type="checkbox" checked={allShown} onChange={pickAllShown} title="เลือกทั้งหมดที่แสดง" /></th>
                  <th>รหัส</th><th>รายการ</th><th style={{width:60}}>มีอยู่</th><th style={{width:110}}>ย้ายจำนวน</th><th>โครงการปัจจุบัน</th>
                </tr></thead>
                <tbody>
                  {candidates.map(a=>{
                    const max = Number(a.quantity)||0;
                    const on = qty[a.key]!==undefined;
                    const v = qty[a.key];
                    const partial = on && Number(v)>0 && Number(v)<max;
                    return (
                      <tr key={a.key} style={on?{background:"var(--accent-soft)"}:null}>
                        <td><input type="checkbox" checked={on} onChange={()=>toggle(a)} /></td>
                        <td>{a.assetCode ? <span className="ticket-id">{a.assetCode}</span> : <span style={{color:"var(--muted)",fontSize:12}}>ไม่มีรหัส</span>}</td>
                        <td>{a.name||"—"}</td>
                        <td style={{whiteSpace:"nowrap"}}>{max.toLocaleString("th-TH")} {a.unit||""}</td>
                        <td>
                          {on ? (<>
                            <input type="number" min="0" max={max} value={v} onChange={e=>setQtyFor(a,e.target.value)}
                              style={{width:"100%",padding:"5px 8px",border:"1px solid var(--line)",borderRadius:6,fontFamily:"Kanit",fontSize:13}} />
                            {partial && <div style={{fontSize:11,color:"#B45309",marginTop:2}}>แบ่งย้าย · เหลือต้นทาง {(max-Number(v)).toLocaleString("th-TH")}</div>}
                          </>) : <span style={{color:"var(--muted)",fontSize:12}}>—</span>}
                        </td>
                        <td style={{color:"var(--muted)"}}>{a.site||"—"}{a.subSite?` · ${a.subSite}`:""}</td>
                      </tr>
                    );
                  })}
                  {candidates.length===0 && (<tr><td colSpan="6"><div className="empty" style={{padding:"18px 10px"}}>
                    <div className="t">{fromProject ? (fromSubSite?`ไม่พบทรัพย์สินในไซต์ ${fromSubSite}`:"ไม่พบทรัพย์สินในโครงการต้นทาง") : "ยังไม่ได้เลือกโครงการต้นทาง"}</div>
                    <div>{fromProject ? "ลองเปลี่ยนคำค้น เลือกไซต์งานย่อยอื่น หรือเลือกโครงการต้นทางอื่น" : "เลือกโครงการต้นทางด้านบนก่อน แล้วรายการทรัพย์สินจะแสดงที่นี่"}</div>
                  </div></td></tr>)}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    </Modal>
  );
}

function AssetForm({mode,initial,sites,owners,user,onClose,onSave}){
  const [f,setF] = React.useState(initial);   // เก็บทุกฟิลด์เดิมไว้ (source/sourceRow ฯลฯ) ไม่ให้หายตอนบันทึกทับ
  const [busy,setBusy] = React.useState(false);
  const projects = React.useMemo(()=>window.visibleProjects(user),[user]);
  const up = (k,v) => setF(p=>({...p,[k]:v}));

  const submit = async (e) => {
    e?.preventDefault();
    if(!String(f.assetCode||"").trim() || !String(f.name||"").trim()){
      Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณากรอก รหัสทรัพย์สิน และ ชื่อทรัพย์สิน"});
      return;
    }
    if(mode==="edit" && (String(initial.site||"")!==String(f.site||"") || String(initial.subSite||"")!==String(f.subSite||""))){
      const c = await Swal.fire({icon:"question",title:"ย้ายโครงการโดยไม่ออกใบส่งของ?",
        html:`จาก <b>${String(initial.site||"-").replace(/</g,"&lt;")}</b> → <b>${String(f.site||"-").replace(/</g,"&lt;")}</b><br/><br/>
          การย้ายของระหว่างโครงการควรทำที่ <b>ใบส่งของ (DO)</b> เพื่อให้มีเอกสารและยกเลิก/คืนของได้<br/>
          <span style="font-size:12.5px;color:#64748B">ถ้ายืนยัน ระบบจะบันทึกในประวัติการย้ายว่า "แก้ไขโดยตรง ไม่มีใบส่งของ"</span>`,
        showCancelButton:true,confirmButtonText:"ยืนยันแก้ไขโดยตรง",cancelButtonText:"กลับไปแก้",confirmButtonColor:"#D97706"});
      if(!c.isConfirmed) return;
    }
    setBusy(true);
    try{ await onSave(f); }
    catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
    finally{ setBusy(false); }
  };

  const txt = (k,label,ph) => (
    <div className="form-field">
      <label>{label}</label>
      <input value={f[k]||""} onChange={e=>up(k,e.target.value)} placeholder={ph||""} />
    </div>
  );

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className={`fa-solid ${mode==="edit"?"fa-pen-to-square":"fa-plus"}`} style={{marginRight:8,color:"var(--primary)"}}></i>{mode==="edit"?"แก้ไขทรัพย์สิน":"เพิ่มทรัพย์สินใหม่"}</>}
      footer={<>
        <button className="btn btn-ghost" onClick={onClose} disabled={busy}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit} disabled={busy}>
          {busy ? <><div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> กำลังบันทึก...</> : <><i className="fa-solid fa-floppy-disk"></i> บันทึก</>}
        </button>
      </>}>
      <form onSubmit={submit}>
        <div className="form-grid">
          {txt("assetCode","รหัสทรัพย์สิน *","เช่น ASSET-0123")}
          {txt("name","ชื่อทรัพย์สิน *","เช่น ถังไซโล")}
          {txt("brand","ยี่ห้อ")}
          {txt("model","รุ่น")}
          {txt("serial","Serial No.")}
          {txt("size","ขนาด")}
          <div className="form-field">
            <label>จำนวน</label>
            <input type="number" min="0" value={f.quantity ?? ""} onChange={e=>up("quantity",e.target.value)} />
          </div>
          {txt("unit","หน่วย","เช่น ถัง / ชุด / ตัว")}
          <div className="form-field">
            <label>ราคาทรัพย์สิน (บาท / หน่วย)</label>
            <input type="number" min="0" step="0.01" value={f.price ?? ""} onChange={e=>up("price",e.target.value)} placeholder="0.00" style={{textAlign:"right"}} />
            {(Number(f.price)||0)>0 && (Number(f.quantity)||0)>1 && <div style={{fontSize:12,color:"var(--muted)",marginTop:4}}>มูลค่ารวม {(Number(f.quantity)||0).toLocaleString("th-TH")} {f.unit||"หน่วย"} = <b style={{color:"var(--primary)"}}>฿{((Number(f.price)||0)*(Number(f.quantity)||0)).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2})}</b></div>}
          </div>
          <div className="form-field">
            <label>กรรมสิทธิ์</label>
            <input list="asset-owners" value={f.ownership||""} onChange={e=>up("ownership",e.target.value)} placeholder="เช่น PNM / TFB" />
            <datalist id="asset-owners">{(owners||[]).map(o=><option key={o} value={o}/>)}</datalist>
          </div>
          {txt("holder","ผู้ถือครอง")}
          <div className="form-field">
            <label>สถานที่ (โครงการ)</label>
            <select value={f.site||""} onChange={e=>setF(p=>({...p,site:e.target.value,subSite:""}))}>
              <option value="">— เลือกโครงการ —</option>
              {projects.map(p=>(<option key={p.id} value={p.name}>{p.code?`[${p.code}] `:""}{p.name}</option>))}
              {/* ข้อมูลเก่าที่ยังไม่ตรงกับชื่อโครงการ — คงค่าเดิมไว้ไม่ให้หายตอนแก้ไข */}
              {f.site && !projects.some(p=>p.name===f.site) && <option value={f.site}>{f.site} (ข้อมูลเดิม)</option>}
            </select>
          </div>
          <SubSiteField project={f.site} value={f.subSite} onChange={v=>up("subSite",v)} showWhenEmpty
            hint="ไซต์งานย่อยที่ทรัพย์สินนี้อยู่ · เปลี่ยนโครงการแล้วต้องเลือกใหม่" />
          <div className="form-field">
            <label>วันที่รับเข้า</label>
            <input type="date" value={String(f.receivedAt||"").slice(0,10)} onChange={e=>up("receivedAt",e.target.value)} />
          </div>
          <div className="form-field full">

            <label><i className="fa-solid fa-images" style={{color:"var(--primary)",marginRight:6}}></i>รูปภาพทรัพย์สิน <span style={{fontWeight:400,color:"var(--muted)"}}>(สูงสุด 3 รูป)</span></label>
            <PhotosField value={f.photos} onChange={v=>up("photos",v)} max={3}

          </div>
        </div>
      </form>

  );
}

window.downloadDeliveryOrderPdf = async function(doc){
  try{
    Swal.fire({title:"กำลังเตรียมไฟล์ PDF...",allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
    await Promise.all([window.__loadPdf(), window.__SIG.preload([doc.senderId, doc.receiverId, doc.approverId])]);
    Swal.close();
  }catch(e){ Swal.fire({icon:"error",title:"ไม่พบตัวสร้าง PDF",text:"โหลดไลบรารีไม่สำเร็จ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต"}); return; }
  const name = String(doc.docNo||"delivery-order").replace(/[\\/:*?"<>|]/g,"-")+".pdf";
  const el = document.createElement("div");
  el.innerHTML = window.buildDeliveryOrderHtml(doc);
  document.body.appendChild(el);
  await window.__waitImages(el);
