                  <button className="ia" title="แก้ไข" onClick={()=>setEditItem({...i})}><i className="fa-solid fa-pen"></i></button>
                  <button className="ia danger" title="ลบ" onClick={()=>removeItem(i)}><i className="fa-solid fa-trash"></i></button>
                </div></td>}
              </tr>); })}
            {shownItems.length===0 && <tr><td colSpan={canManage?7:6}><div className="empty"><i className="fa-solid fa-warehouse"></i><div className="t">{items.length?"ไม่พบรายการ":"ยังไม่มีของในคลัง"}</div><div>{items.length?"ลองเปลี่ยนเงื่อนไขการค้นหา":"กด 'เพิ่มรายการ' หรือ 'นำเข้า Excel' เพื่อตั้งรายการของในคลังของโครงการ"}</div></div></td></tr>}
          </tbody>
        </table></div>
      ) : (
        <div className="table-wrap"><table className="data">
          <thead><tr><th>วันที่</th><th>ประเภท</th><th>รายการ</th><th>จำนวน</th><th className="hide-on-mobile">คงเหลือ</th><th>เลขที่</th><th className="hide-on-mobile">ผู้รับ / ใช้สำหรับ</th><th className="hide-on-mobile">ผู้บันทึก</th></tr></thead>
          <tbody>
            {shownMoves.slice(0,500).map(m=>{ const t=STOCK_TYPE[m.type]||STOCK_TYPE.adjust; const n=Number(m.qty)||0; return (
              <tr key={m.key}>
                <td style={{whiteSpace:"nowrap",fontSize:13}}>{m.date||"—"}</td>
                <td><span className="badge" style={{background:t.bg,color:t.color}}><i className={`fa-solid ${t.icon}`}></i> {t.label}</span></td>
                <td><div className="cell-title">{m.itemName||"—"}</div><div style={{fontSize:12,color:"var(--muted)"}}>{m.project||""}{m.subSite?` · ${m.subSite}`:""}</div></td>
                <td style={{whiteSpace:"nowrap",fontWeight:600,color:t.color}}>{m.type==="adjust"?(n>=0?"+":"−"):t.sign}{fmtQty(Math.abs(n))} {m.unit||""}</td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{fmtQty(m.balance)}</td>
                <td><span className="mono" style={{fontSize:12}}>{m.ref||"—"}</span></td>
                <td className="hide-on-mobile" style={{fontSize:12.5}}>{m.receiver||"—"}{m.purpose&&<div style={{color:"var(--muted)"}}>{m.purpose}</div>}{m.note&&<div style={{color:"var(--muted)"}}>{m.note}</div>}</td>
                <td className="hide-on-mobile" style={{fontSize:12.5}}>{m.by||"—"}</td>
              </tr>); })}
            {shownMoves.length===0 && <tr><td colSpan="8"><div className="empty"><i className="fa-solid fa-clock-rotate-left"></i><div className="t">ยังไม่มีประวัติ</div></div></td></tr>}
          </tbody>
        </table>{shownMoves.length>500&&<div style={{padding:10,fontSize:12,color:"var(--muted)",textAlign:"center"}}>แสดง 500 รายการล่าสุด · ส่งออก Excel เพื่อดูทั้งหมด</div>}</div>
      )}
    </div>
    {move && <StockMoveForm initial={move} items={items} moves={moves} projOpts={projOpts} user={user} onClose={()=>{ setMove(null); setNewItemKey(null); }} onSave={saveMove}
      newItemKey={newItemKey} onNewItem={(proj)=>setEditItem({project:proj,subSite:"",code:"",name:"",category:"",unit:"",minQty:"",qty:"",location:"",note:"",fromMove:true})}/>}
    {editItem && <StockItemForm initial={editItem} items={items} projOpts={projOpts} onClose={()=>setEditItem(null)} onSave={saveItem}/>}
    </>
  );
}

function StockItemForm({initial,items,projOpts,onClose,onSave}){
  const isNew = !initial.key;
  const fromMove = !!initial.fromMove;
  const blankRow = () => ({code:"",name:"",category:"",unit:"",minQty:"",qty:""});
  const [f,setF] = React.useState(()=>{ const {fromMove:_fm, ...rest} = initial; return rest; });   // ส่วนที่ใช้ร่วมกัน (โครงการ, ไซต์, ที่เก็บ, หมายเหตุ)
  const [rows,setRows] = React.useState(()=>[blankRow()]);                       // ใช้ตอนเพิ่มใหม่ — เพิ่ม/ลบบรรทัดได้
  const [busy,setBusy] = React.useState(false);
  const up = (k,v)=>setF(p=>({...p,[k]:v}));
  const setRow = (i,k,v)=>setRows(prev=>prev.map((r,idx)=>idx===i?{...r,[k]:v}:r));
  const addRow = ()=>setRows(prev=>[...prev, blankRow()]);
  const removeRow = i=>setRows(prev=>prev.length<=1?[blankRow()]:prev.filter((_,idx)=>idx!==i));

  // ชื่อที่เคยใช้ (ของในคลังทุกโครงการ + รายการในใบเบิก) — เลือกแล้วเติมหน่วย/หมวด/รหัสให้
  const known = React.useMemo(()=>{
    const map = new Map();
    const add = (o) => {
      const n = String(o&&o.name||"").trim(); if(!n) return;
      const k = n.toLowerCase(); const cur = map.get(k) || {name:n,unit:"",category:"",code:""};
      ["unit","category","code"].forEach(x=>{ if(!cur[x] && o[x]) cur[x] = String(o[x]).trim(); });
      map.set(k, cur);
    };
    (items||[]).forEach(add);
    (window.__DATA.withdrawals||[]).forEach(d=>(Array.isArray(d.items)?d.items:[]).forEach(add));
    return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,"th"));
  },[items]);
  const pickName = (i,v) => setRows(prev=>prev.map((r,idx)=>{
    if(idx!==i) return r;
    const hit = known.find(k=>k.name===v);
    if(!hit) return {...r,name:v};
    return {...r, name:v, unit:r.unit||hit.unit, category:r.category||hit.category, code:r.code||hit.code};
  }));
  const existsIn = (name) => (items||[]).some(x=>x.project===f.project && String(x.name||"").trim().toLowerCase()===String(name||"").trim().toLowerCase());

  const submit = async (e) => {
    e && e.preventDefault && e.preventDefault();
    if(!f.project){ Swal.fire({icon:"warning",title:"เลือกโครงการก่อน"}); return; }
    if(!isNew){
      if(!String(f.name||"").trim() || !String(f.unit||"").trim()){ Swal.fire({icon:"warning",title:"กรอกชื่อรายการและหน่วยนับ"}); return; }
      setBusy(true);
      try{ await onSave({...f, name:f.name.trim(), unit:f.unit.trim(), code:String(f.code||"").trim(), minQty:Number(f.minQty)||0}); }
      finally{ setBusy(false); }
      return;
    }
    const filled = rows.filter(r=>String(r.name||"").trim() || String(r.unit||"").trim() || String(r.code||"").trim());
    if(!filled.length){ Swal.fire({icon:"warning",title:"กรอกรายการอย่างน้อย 1 บรรทัด"}); return; }
    const miss = filled.findIndex(r=>!String(r.name||"").trim() || !String(r.unit||"").trim());
    if(miss>=0){ Swal.fire({icon:"warning",title:`บรรทัดที่ ${rows.indexOf(filled[miss])+1}: กรอกชื่อรายการและหน่วยนับ`}); return; }
    const names = filled.map(r=>r.name.trim().toLowerCase());
    if(new Set(names).size!==names.length){ Swal.fire({icon:"warning",title:"มีชื่อรายการซ้ำกันในฟอร์ม"}); return; }
    const dup = filled.filter(r=>existsIn(r.name));
    if(dup.length){
      const { isConfirmed } = await Swal.fire({icon:"question",title:"มีรายการนี้ในคลังของโครงการแล้ว",
        text:dup.map(r=>r.name.trim()).join(", ")+" — ถ้าจะเพิ่มจำนวน ให้ใช้ 'รับเข้า' แทน · ยังต้องการเพิ่มเป็นรายการใหม่หรือไม่?",
        showCancelButton:true,confirmButtonText:"เพิ่มต่อ",cancelButtonText:"กลับไปแก้",confirmButtonColor:"#1E40AF"});
      if(!isConfirmed) return;
    }
    const common = {project:f.project, subSite:f.subSite||"", location:f.location||"", note:f.note||""};
    setBusy(true);
    try{ await onSave(filled.map(r=>({...common, code:String(r.code||"").trim(), name:r.name.trim(), category:String(r.category||"").trim(),
      unit:r.unit.trim(), minQty:Number(r.minQty)||0, qty: fromMove ? 0 : (Number(r.qty)||0)}))); }
    finally{ setBusy(false); }
  };

  const cellIn = {width:"100%",padding:"7px 9px",border:"1px solid var(--line)",borderRadius:7,fontFamily:"Kanit",fontSize:13.5};
  return (
    <Modal open={true} onClose={onClose} size={isNew?"xl":"lg"}
      title={<><i className="fa-solid fa-warehouse" style={{marginRight:8,color:"var(--primary)"}}></i>{isNew?"เพิ่มรายการในคลังหน้างาน":"แก้ไขรายการในคลัง"}</>}
      footer={<><button className="btn btn-ghost" onClick={onClose} disabled={busy}>ยกเลิก</button><button className="btn btn-primary" onClick={submit} disabled={busy}>{busy?<><div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> กำลังบันทึก...</>:<><i className="fa-solid fa-floppy-disk"></i> บันทึก{isNew&&rows.filter(r=>String(r.name||"").trim()).length>1?` ${rows.filter(r=>String(r.name||"").trim()).length} รายการ`:""}</>}</button></>}>
      <form onSubmit={submit}><div className="form-grid">
        <div className="form-field"><label>โครงการ *</label><select value={f.project||""} onChange={e=>setF(p=>({...p,project:e.target.value,subSite:""}))} disabled={!isNew||fromMove}><option value="">— เลือกโครงการ —</option>{projOpts.map(p=><option key={p} value={p}>{p}</option>)}</select>{!isNew&&<div style={{fontSize:11.5,color:"var(--muted)",marginTop:3}}>ย้ายโครงการไม่ได้ — ให้เบิกออกแล้วรับเข้าที่โครงการใหม่</div>}</div>
        <SubSiteField project={f.project} value={f.subSite} onChange={v=>up("subSite",v)} hint="ไซต์งานย่อยที่เก็บของนี้ (ถ้ามี)" />
        {!isNew && <>
          <div className="form-field"><label>รหัสสินค้า</label><input className="mono" value={f.code||""} onChange={e=>up("code",e.target.value)} placeholder="ถ้ามี" /></div>
          <div className="form-field"><label>หมวด</label><input value={f.category||""} onChange={e=>up("category",e.target.value)} placeholder="เช่น น้ำมัน, วัสดุสิ้นเปลือง, PPE" /></div>
          <div className="form-field" style={{gridColumn:"1/-1"}}><label>ชื่อรายการ *</label><input value={f.name||""} onChange={e=>up("name",e.target.value)} /></div>
          <div className="form-field"><label>หน่วยนับ *</label><input value={f.unit||""} onChange={e=>up("unit",e.target.value)} placeholder="เช่น ลิตร, ถัง, ชิ้น" /></div>
          <div className="form-field"><label>จุดสั่งซื้อ / ขั้นต่ำ</label><input type="number" min="0" value={f.minQty||""} onChange={e=>up("minQty",e.target.value)} placeholder="เตือนเมื่อเหลือเท่านี้" /></div>
        </>}
        {isNew && (
          <div className="form-field" style={{gridColumn:"1/-1"}}>
            <label>รายการ * <span style={{fontWeight:400,fontSize:12,color:"var(--muted)"}}>เพิ่ม/ลบบรรทัดได้ · พิมพ์ชื่อแล้วเลือกจากที่เคยมี ระบบเติมหน่วย/หมวดให้</span></label>
            <div className="table-wrap" style={{border:"1px solid var(--line)",borderRadius:10,overflow:"hidden"}}><table className="data">
              <thead><tr><th style={{width:40}}>#</th><th style={{width:120}}>รหัส</th><th>ชื่อรายการ *</th><th style={{width:150}}>หมวด</th><th style={{width:100}}>หน่วย *</th><th style={{width:100}}>ขั้นต่ำ</th>{!fromMove&&<th style={{width:110}}>ยอดยกมา</th>}<th style={{width:44}}></th></tr></thead>
              <tbody>{rows.map((r,i)=>(
                <tr key={i}>
                  <td style={{textAlign:"center",color:"var(--muted)"}}>{i+1}</td>
                  <td><input className="mono" style={cellIn} value={r.code} onChange={e=>setRow(i,"code",e.target.value)} placeholder="ถ้ามี" /></td>
                  <td><input style={cellIn} value={r.name} list="stock-known-names" onChange={e=>pickName(i,e.target.value)} placeholder="เช่น น้ำมันไฮดรอลิก 68" />
                    {r.name && f.project && existsIn(r.name) && <div style={{fontSize:11,color:"#B45309"}}>มีในคลังโครงการนี้แล้ว — ใช้ "รับเข้า" เพื่อเพิ่มจำนวน</div>}</td>
                  <td><input style={cellIn} value={r.category} onChange={e=>setRow(i,"category",e.target.value)} placeholder="เช่น น้ำมัน" /></td>
                  <td><input style={cellIn} value={r.unit} onChange={e=>setRow(i,"unit",e.target.value)} placeholder="ลิตร" /></td>
                  <td><input style={cellIn} type="number" min="0" value={r.minQty} onChange={e=>setRow(i,"minQty",e.target.value)} /></td>
                  {!fromMove && <td><input style={cellIn} type="number" min="0" step="any" value={r.qty} onChange={e=>setRow(i,"qty",e.target.value)} placeholder="0" /></td>}
                  <td><button type="button" className="ia danger" title="ลบบรรทัดนี้" onClick={()=>removeRow(i)}><i className="fa-solid fa-trash"></i></button></td>
                </tr>
              ))}</tbody>
            </table></div>
            <datalist id="stock-known-names">{known.map(k=><option key={k.name} value={k.name}>{k.unit?`หน่วย: ${k.unit}`:""}</option>)}</datalist>
            <button type="button" className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={addRow}><i className="fa-solid fa-plus"></i> เพิ่มบรรทัด</button>
            {fromMove && <span style={{fontSize:11.5,color:"var(--muted)",marginLeft:10}}>จำนวนที่รับเข้า กรอกในใบรับหลังบันทึก</span>}
          </div>
        )}
        <div className="form-field"><label>ที่เก็บ</label><input value={f.location||""} onChange={e=>up("location",e.target.value)} placeholder="เช่น ตู้คอนเทนเนอร์ 1" /></div>
        <div className="form-field"><label>หมายเหตุ</label><input value={f.note||""} onChange={e=>up("note",e.target.value)} /></div>
      </div></form>
    </Modal>
  );
}

function StockMoveForm({initial,items,moves,projOpts,user,onClose,onSave,newItemKey,onNewItem}){
  const type = initial.type;
  const t = STOCK_TYPE[type];
  const [project,setProject] = React.useState(initial.project||"");
  const [date,setDate] = React.useState(window.__DATA.fmtDate(new Date()));
  const [ref,setRef] = React.useState("");
  const [refAuto,setRefAuto] = React.useState(type!=="adjust");
  const [receiver,setReceiver] = React.useState("");
  const [purpose,setPurpose] = React.useState("");
  const [note,setNote] = React.useState("");
  const [lines,setLines] = React.useState(initial.lines);
  const [busy,setBusy] = React.useState(false);
  React.useEffect(()=>{ if(refAuto && project) setRef(nextStockRef(type, project, moves)); },[project,refAuto]);
  // เพิ่มรายการใหม่จากหน้ารับเข้าแล้ว → เติมเป็นบรรทัดให้เลย
  React.useEffect(()=>{
    const keys = (newItemKey && newItemKey.keys) || [];
    if(!keys.length) return;
    setLines(prev=>{
      const kept = prev.filter(l=>l.itemKey);
      return [...kept, ...keys.filter(k=>!kept.some(l=>l.itemKey===k)).map(k=>({itemKey:k,qty:""}))];
    });
  },[newItemKey]);
  const pool = items.filter(i=>i.project===project);
  const itemOf = k => items.find(i=>i.key===k);
  const setLine = (i,k,v)=>setLines(prev=>prev.map((x,idx)=>idx===i?{...x,[k]:v}:x));
  const machines = React.useMemo(()=>(window.__DATA.machines||[]).filter(m=>m.project===project),[project]);
  const submit = async () => {
    const clean = lines.filter(l=>l.itemKey && l.qty!=="" && l.qty!=null);
    if(!clean.length){ Swal.fire({icon:"warning",title:"เลือกรายการและใส่จำนวนอย่างน้อย 1 รายการ"}); return; }
    if(type!=="adjust" && clean.some(l=>!(Number(l.qty)>0))){ Swal.fire({icon:"warning",title:"จำนวนต้องมากกว่า 0"}); return; }
    if(new Set(clean.map(l=>l.itemKey)).size !== clean.length){ Swal.fire({icon:"warning",title:"มีรายการซ้ำ",text:"รวมจำนวนไว้บรรทัดเดียว"}); return; }
    if(type==="out"){
      const over = clean.find(l=>Number(l.qty) > (Number((itemOf(l.itemKey)||{}).qty)||0));
      if(over){ const it=itemOf(over.itemKey)||{}; Swal.fire({icon:"warning",title:"ของไม่พอเบิก",text:`${it.name} คงเหลือ ${fmtQty(it.qty)} ${it.unit||""}`}); return; }
      if(!receiver.trim()){ Swal.fire({icon:"warning",title:"กรอกชื่อผู้รับของ"}); return; }
    }
    setBusy(true);
    try{ await onSave({type, date, ref:ref.trim(), receiver:receiver.trim(), purpose:purpose.trim(), note:note.trim(), lines:clean.map(l=>({...l,qty:Number(l.qty)}))}); }
    finally{ setBusy(false); }
  };
  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className={`fa-solid ${t.icon}`} style={{marginRight:8,color:t.color}}></i>{type==="adjust"?"ปรับยอดตามที่นับได้จริง":type==="in"?"รับของเข้าคลังหน้างาน":"เบิกจ่ายของหน้างาน"}</>}
      footer={<><button className="btn btn-ghost" onClick={onClose} disabled={busy}>ยกเลิก</button><button className="btn btn-primary" onClick={submit} disabled={busy} style={{background:t.color,borderColor:t.color}}>{busy?<><div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> กำลังบันทึก...</>:<><i className="fa-solid fa-check"></i> บันทึก{t.label}</>}</button></>}>
      <div className="form-grid">
        <div className="form-field"><label>โครงการ *</label><select value={project} onChange={e=>{ setProject(e.target.value); setLines([{itemKey:"",qty:""}]); }}><option value="">— เลือกโครงการ —</option>{projOpts.map(p=><option key={p} value={p}>{p}</option>)}</select></div>
        <div className="form-field"><label>วันที่</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} /></div>
        {type!=="adjust" && <div className="form-field"><label>เลขที่{type==="in"?"ใบรับ":"ใบเบิก"} {refAuto&&<span style={{fontWeight:400,fontSize:11.5,color:"#047857"}}>ออกเลขอัตโนมัติ</span>}</label><input className="mono" value={ref} onChange={e=>{ setRefAuto(false); setRef(e.target.value); }} placeholder={type==="in"?"หรือเลขที่ใบส่งของ/ใบกำกับ":""} /></div>}
        {type==="out" && <div className="form-field"><label>ผู้รับของ *</label><input value={receiver} onChange={e=>setReceiver(e.target.value)} placeholder="ชื่อคนที่มารับของ" /></div>}
        {type==="in" && <div className="form-field"><label>รับจาก</label><input value={receiver} onChange={e=>setReceiver(e.target.value)} placeholder="ผู้ขาย / ส่งมาจากโครงการไหน" /></div>}
        {type==="out" && <div className="form-field" style={{gridColumn:"1/-1"}}><label>ใช้สำหรับ (งาน / เครื่องจักร)</label><input value={purpose} onChange={e=>setPurpose(e.target.value)} list="stock-purpose" placeholder="เช่น เติมน้ำมัน XCMG-001, งานเจาะ Rig1" /><datalist id="stock-purpose">{machines.map(m=><option key={m.id} value={`${m.code} ${m.name||""}`.trim()}/>)}</datalist></div>}
        <div className="form-field" style={{gridColumn:"1/-1"}}>
          <label>รายการ</label>
          {!project ? <div style={{fontSize:13,color:"var(--muted)"}}>เลือกโครงการก่อน</div> : pool.length===0 ? <div style={{fontSize:13,color:"#92400E"}}>โครงการนี้ยังไม่มีรายการในคลัง{type==="in"?" — กดปุ่ม ของใหม่ ด้านล่างเพื่อเพิ่ม":""}</div> : (
          <div className="table-wrap" style={{border:"1px solid var(--line)",borderRadius:10,overflow:"hidden"}}><table className="data">
            <thead><tr><th>รายการ</th><th style={{width:120}}>คงเหลือ</th><th style={{width:150}}>{type==="adjust"?"ยอดที่นับได้":"จำนวน"}</th><th style={{width:44}}></th></tr></thead>
            <tbody>{lines.map((l,idx)=>{ const it=itemOf(l.itemKey); const cur=it?(Number(it.qty)||0):0; const n=Number(l.qty)||0; const after = it ? (type==="in"?cur+n:type==="out"?cur-n:n) : null; return (
              <tr key={idx}>
                <td><select value={l.itemKey} onChange={e=>setLine(idx,"itemKey",e.target.value)} style={{width:"100%"}}><option value="">— เลือกรายการ —</option>{pool.map(i=><option key={i.key} value={i.key}>{i.code?`[${i.code}] `:""}{i.name} ({i.unit})</option>)}</select></td>
                <td style={{whiteSpace:"nowrap",fontSize:13}}>{it?`${fmtQty(it.qty)} ${it.unit||""}`:"—"}</td>
                <td><input type="number" min="0" step="any" value={l.qty} onChange={e=>setLine(idx,"qty",e.target.value)} />{it && l.qty!=="" && <div style={{fontSize:11,color:after<0?"#B91C1C":"var(--muted)"}}>{after<0?"เกินยอดคงเหลือ":`หลังทำรายการ ${fmtQty(after)}`}</div>}</td>
                <td><button type="button" className="ia danger" onClick={()=>setLines(prev=>prev.length<=1?[{itemKey:"",qty:""}]:prev.filter((_,i)=>i!==idx))}><i className="fa-solid fa-trash"></i></button></td>
              </tr>); })}</tbody>
          </table></div>)}
          {project && pool.length>0 && type!=="adjust" && <button type="button" className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={()=>setLines(prev=>[...prev,{itemKey:"",qty:""}])}><i className="fa-solid fa-plus"></i> เพิ่มบรรทัด</button>}
          {project && type==="in" && onNewItem && <button type="button" className="btn btn-ghost btn-sm" style={{marginTop:8,marginLeft:6,color:"#0E7490"}} onClick={()=>onNewItem(project)}><i className="fa-solid fa-square-plus"></i> ของใหม่ (ยังไม่มีในคลัง)</button>}
        </div>
        <div className="form-field" style={{gridColumn:"1/-1"}}><label>หมายเหตุ</label><input value={note} onChange={e=>setNote(e.target.value)} placeholder={type==="adjust"?"เช่น ตรวจนับประจำเดือน":""} /></div>
      </div>
      <div style={{fontSize:12,color:"var(--muted)",marginTop:8}}>บันทึกโดย {user.name}</div>
    </Modal>
  );
}

function DocPJ2({user}){
  const [rows,setRows] = React.useState(()=>window.filterByUserProjects(user,window.__DATA.machines,"project"));
  const [q,setQ] = React.useState("");
  const [filterProj,setFilterProj] = React.useState("all");
  const [editCell,setEditCell] = React.useState(null); // {id,field,value}
  const [uploading,setUploading] = React.useState(null); // machineId:slot
  // จป. (Safety Officer) แก้ไข/อัปโหลดเอกสาร ปจ2 ได้ เพราะเป็นงานตรวจสอบความปลอดภัยโดยตรง
  const canEdit = ["Admin","Officer","Engineer","Safety Officer"].includes(window.effectiveRole(user));
  const today = React.useMemo(()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; },[]);
  const toDateStr = (d) => { try{ return new Date(d).toISOString().slice(0,10); }catch(e){ return ""; } };

  const fileToUpload = (file) => new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || "");
      resolve({
        name: file.name,
        mimeType: file.type || "application/octet-stream",
        data: dataUrl.includes(",") ? dataUrl.split(",").pop() : dataUrl,
      });
    };
    reader.onerror = () => reject(reader.error || new Error("อ่านไฟล์ไม่สำเร็จ"));
    reader.readAsDataURL(file);
  });

  const uploadDoc = async (m, slot, file) => {
    if(!file) return;
    const field = slot==="PL" ? "driveLinkPL" : (slot===2 ? "driveLink2" : "driveLink1");
    const key = `${m.id}:${slot}`;
    setUploading(key);
    try{
      const upload = await fileToUpload(file);
      const saved = await window.api("uploadPJ2Document",{machineId:m.id,machineCode:m.code,slot,upload});
      const patch = {[field]:saved.url};
      await window.api("updateMachine",{id:m.id,patch});
      const upd = rows.map(x=>x.id===m.id?{...x,...patch}:x);
      setRows(upd);
      window.__DATA.machines = window.__DATA.machines.map(x=>x.id===m.id?{...x,...patch}:x);
      if(saved.sharing && saved.sharing.ok===false){
        Swal.fire({icon:"warning",title:"อัปโหลดสำเร็จ แต่แชร์ลิงก์ไม่ได้",text:"ไฟล์ถูกบันทึกใน Drive แล้ว แต่บัญชี Google/Workspace ไม่อนุญาตให้แชร์ Anyone with link",confirmButtonColor:"#1E40AF"});
      } else {
        Swal.fire({icon:"success",title:"อัปโหลดเอกสารสำเร็จ",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
      }
    }catch(err){
      Swal.fire({icon:"error",title:"อัปโหลดไม่สำเร็จ",text:err.message});
    }finally{
      setUploading(null);
    }
  };

  const projects = React.useMemo(()=>[...new Set(rows.map(m=>m.project).filter(Boolean))].sort(),[rows]);
  const filtered = React.useMemo(()=>rows.filter(m=>{
    if(filterProj!=="all" && m.project!==filterProj) return false;
    if(q){ const qq=q.toLowerCase(); if(!([m.code,m.name,m.project,m.subSite,m.serial].map(x=>(x||"").toLowerCase()).join(" ").includes(qq))) return false; }
    return true;
  }).sort((a,b)=>{
    const da = a.nextInspectionDate ? new Date(a.nextInspectionDate) : null;
    const db = b.nextInspectionDate ? new Date(b.nextInspectionDate) : null;
    if(!da && !db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return da - db;
  }),[rows,q,filterProj]);

  const saveDate = async () => {
    if(!editCell) return;
    const {id,field,value} = editCell;
    try{
      await window.api("updateMachine",{id,patch:{[field]:value}});
      const upd = rows.map(m=>m.id===id?{...m,[field]:value}:m);
      setRows(upd); window.__DATA.machines=window.__DATA.machines.map(m=>m.id===id?{...m,[field]:value}:m);
      setEditCell(null);
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const nextDateColor = (val) => {
    if(!val) return null;
    const d=new Date(val); d.setHours(0,0,0,0);
    const diff=Math.floor((d-today)/(1000*60*60*24));
    if(diff<0) return "#EF4444";
    if(diff<=30) return "#F59E0B";
    return "#10B981";
  };

  const renderDateCell = (m,field) => {
    const val = m[field]||"";
    const isEditing = editCell&&editCell.id===m.id&&editCell.field===field;
    const color = field==="nextInspectionDate"?nextDateColor(val):null;
    if(isEditing) return (
      <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
        <input type="date" value={editCell.value} onChange={e=>setEditCell(ec=>({...ec,value:e.target.value}))}
          style={{padding:"3px 7px",border:"1px solid var(--primary)",borderRadius:6,fontSize:12,fontFamily:"Kanit"}} autoFocus/>
        <button onClick={saveDate} style={{padding:"3px 10px",background:"var(--primary)",color:"#fff",border:"none",borderRadius:6,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>บันทึก</button>
        <button onClick={()=>setEditCell(null)} style={{padding:"3px 8px",background:"none",border:"1px solid var(--line)",borderRadius:6,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>ยกเลิก</button>
      </div>
    );
    return (
      <div style={{display:"flex",alignItems:"center",gap:5}}>
        {val ? (
          <span style={{fontSize:12,fontWeight:color?"600":"400",color:color?color:"inherit",background:color?color+"18":"transparent",padding:color?"2px 7px":"0",borderRadius:5,display:"inline-flex",alignItems:"center",gap:4}}>
            {window.fmtDateTH(val)}
            {color==="#EF4444"&&<span style={{fontSize:10}}>⚠ เกินกำหนด</span>}
            {color==="#F59E0B"&&<span style={{fontSize:10}}>ใกล้ถึงกำหนด</span>}
          </span>
        ) : <span style={{color:"var(--muted)",fontSize:12}}>—</span>}
        {canEdit&&<button onClick={()=>setEditCell({id:m.id,field,value:val||toDateStr(new Date())})}
          style={{padding:"1px 5px",background:"none",border:"1px solid var(--line)",borderRadius:4,fontSize:10,cursor:"pointer",color:"var(--muted)"}}>
          <i className={`fa-solid ${val?"fa-pen":"fa-plus"}`}></i>
        </button>}
      </div>
    );
  };

  const linkBtn = (m, slot) => {
    const url = slot==="PL" ? m.driveLinkPL : (slot===2 ? m.driveLink2 : m.driveLink1);
    const key = `${m.id}:${slot}`;
    return (
      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
        {url
          ? <a href={url} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:6,background:"#EFF6FF",border:"1px solid #BFDBFE",color:"#1E40AF",fontSize:12,textDecoration:"none",whiteSpace:"nowrap"}}><i className="fa-brands fa-google-drive" style={{color:"#4285F4"}}></i>เปิดไฟล์<i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:9,opacity:.6}}></i></a>
          : <span style={{color:"var(--muted)"}}>—</span>}
        {canEdit && (
          <label className="btn btn-sm btn-ghost" style={{padding:"4px 8px",fontSize:12,cursor:uploading?"not-allowed":"pointer",opacity:uploading&&uploading!==key ? .7 : 1}}>
            {uploading===key ? <><span className="spinner" style={{width:12,height:12,borderWidth:2}}></span> อัปโหลด...</> : <><i className="fa-solid fa-upload"></i> อัปโหลด</>}
            <input type="file" style={{display:"none"}} disabled={!!uploading} onChange={e=>{ const file=e.target.files&&e.target.files[0]; e.target.value=""; uploadDoc(m,slot,file); }} />
          </label>
        )}
      </div>
    );
  };

  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา รหัส / ชื่อ / ซีเรียล..." value={q} onChange={e=>setQ(e.target.value)}/></div>
        <select value={filterProj} onChange={e=>setFilterProj(e.target.value)}>
          <option value="all">ทุกโครงการ</option>
          {projects.map(p=>(<option key={p} value={p}>{p}</option>))}
        </select>
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>{filtered.length} / {rows.length} รายการ</div>
      </div>
      <div style={{padding:"8px 16px",borderBottom:"1px solid var(--line)",background:"#FAFBFC",display:"flex",gap:16,flexWrap:"wrap",fontSize:12,color:"var(--muted)"}}>
        <span style={{fontWeight:500,color:"var(--text)"}}>หมายเหตุ:</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:"50%",background:"#10B981",display:"inline-block"}}></span>เขียว — ยังไม่ถึงกำหนด (&gt;30 วัน)</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:"50%",background:"#F59E0B",display:"inline-block"}}></span>เหลือง — ใกล้ถึงกำหนด (≤30 วัน)</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:"50%",background:"#EF4444",display:"inline-block"}}></span>แดง — เกินกำหนดแล้ว ⚠</span>
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr>
            <th>รหัส / ชื่อเครื่องจักร</th>
            <th>เอกสาร (1)</th>
            <th>เอกสาร (2)</th>
            <th>PL (ประกัน)</th>
            <th className="hide-on-mobile">โครงการ</th>
            <th>วันที่ตรวจสอบ</th>
            <th>วันที่ตรวจสอบครั้งถัดไป</th>
          </tr></thead>
          <tbody>
            {filtered.map(m=>(
              <tr key={m.id}>
                <td>
                  {/* รวมรหัส + ชื่อเครื่องจักรไว้คอลัมน์เดียว — มือถือตรึงคอลัมน์แรกไว้ เลื่อนดูเอกสารแล้วยังรู้ว่าเป็นเครื่องไหน */}
                  <div className="mono" style={{fontSize:12,fontWeight:600}}>{m.code||"—"}</div>
                  <div style={{fontWeight:500,fontSize:13,marginTop:2}}>{m.name||"—"}</div>
                  {m.subSite&&<div style={{marginTop:3}}><SubSiteTag value={m.subSite} project={m.project}/></div>}
                  {m.brand&&<div style={{fontSize:11,color:"var(--muted)"}}>{m.brand}{m.model?` ${m.model}`:""}</div>}
                  {m.serial && <div className="mono" style={{fontSize:11,color:"var(--muted)",marginTop:3}}>SN: {m.serial}</div>}
                </td>
                <td>{linkBtn(m,1)}</td>
                <td>{linkBtn(m,2)}</td>
                <td>{linkBtn(m,"PL")}</td>
                <td className="hide-on-mobile" style={{fontSize:13}}><ProjectLabel name={m.project}/></td>
                <td>{renderDateCell(m,"inspectionDate")}</td>
                <td>{renderDateCell(m,"nextInspectionDate")}</td>
              </tr>
            ))}
            {filtered.length===0&&(<tr><td colSpan="7"><div className="empty"><i className="fa-solid fa-file-circle-xmark"></i><div className="t">ไม่พบข้อมูล</div><div>ลองเปลี่ยนเงื่อนไขการค้นหา</div></div></td></tr>)}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function LoginLogs(){

  const [keep, setKeep] = React.useState(100);   // จำนวนที่ระบบเก็บไว้ ที่เกินถูกลบอัตโนมัติ
  const [loading, setLoading] = React.useState(true);
  const [err, setErr] = React.useState(null);
  const [q, setQ] = React.useState("");
  const [filterRole, setFilterRole] = React.useState("all");
  const [filterUser, setFilterUser] = React.useState("all");
  const [filterVia, setFilterVia] = React.useState("all");   // รหัสผ่าน / PIN

  const fetchLogs = () => {
    setLoading(true); setErr(null);
    window.api("getLoginLogs").then(r=>{
      setLogs(r.logs||[]);
      if(r.keep) setKeep(r.keep);
      if(r.removed>0) Swal.fire({icon:"info",title:`ลบประวัติเก่า ${r.removed} รายการ`,text:`ระบบเก็บประวัติการล็อกอินล่าสุด ${r.keep} รายการ`,timer:2600,showConfirmButton:false,toast:true,position:"top-end"});
      setLoading(false);
    }).catch(e=>{
      setErr(e.message||"โหลดข้อมูลไม่สำเร็จ");
      setLoading(false);
    });
  };

  React.useEffect(()=>{ fetchLogs(); },[]);

  const roleColor = {"Admin":"#7C3AED","Officer":"#1D4ED8","Engineer":"#0369A1","Safety Officer":"#DB2777","Technician":"#047857","Director":"#B45309","Reporter":"#64748B"};

  const todayStr = new Date().toISOString().slice(0,10);
  const todayLogs = logs.filter(l=>(l.when||"").slice(0,10)===todayStr);
  const uniqueToday = new Set(todayLogs.map(l=>l.userId)).size;

  const userNames = React.useMemo(()=>[...new Set(logs.map(l=>l.username).filter(Boolean))].sort(),[logs]);
  const roles = React.useMemo(()=>[...new Set(logs.map(l=>l.role).filter(Boolean))].sort(),[logs]);

  // ประวัติเก่าที่บันทึกก่อนมีฟีเจอร์ PIN ไม่มีฟิลด์ via — ถือว่าเข้าด้วยรหัสผ่าน
  const viaOf = (l) => (l && l.via === "pin") ? "pin" : "password";
  const pinCount = React.useMemo(()=>logs.filter(l=>viaOf(l)==="pin").length,[logs]);

  const filtered = React.useMemo(()=>logs.filter(l=>{
    if(filterRole!=="all" && l.role!==filterRole) return false;
    if(filterUser!=="all" && l.username!==filterUser) return false;
    if(filterVia!=="all" && viaOf(l)!==filterVia) return false;
    if(q){
      const qq=q.toLowerCase();
      if(![l.username,l.name,l.role,l.dept].map(x=>(x||"").toLowerCase()).join(" ").includes(qq)) return false;
    }
    return true;
  }),[logs,q,filterRole,filterUser,filterVia]);

  const fmtWhen = (iso) => {
    if(!iso) return "—";
    const d = new Date(iso);
    const date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const time = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
    return `${date} ${time}`;
  };

  const stats = [
    {label:"ล็อกอินทั้งหมด",val:logs.length,icon:"fa-clock-rotate-left",color:"#3B82F6"},
    {label:"ล็อกอินวันนี้",val:todayLogs.length,icon:"fa-calendar-day",color:"#10B981"},
    {label:"ผู้ใช้ที่ active วันนี้",val:uniqueToday,icon:"fa-user-check",color:"#8B5CF6"},
    {label:"ผู้ใช้ทั้งหมด",val:userNames.length,icon:"fa-users",color:"#F59E0B"},
    {label:"ปลดล็อกด้วย PIN",val:pinCount,icon:"fa-shield-halved",color:"#0EA5E9"},
  ];

  return (
    <>
    <div className="stat-grid" style={{marginBottom:18}}>
      {stats.map((s,i)=>(<div className="stat" key={i}><div className="ic" style={{background:s.color+"1a",color:s.color}}><i className={`fa-solid ${s.icon}`}></i></div><div className="label">{s.label}</div><div className="val">{s.val}</div></div>))}
    </div>
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา ชื่อ / Username / แผนก..." value={q} onChange={e=>setQ(e.target.value)}/></div>
        <select value={filterUser} onChange={e=>setFilterUser(e.target.value)}>
          <option value="all">ทุก Username</option>
          {userNames.map(u=>(<option key={u} value={u}>{u}</option>))}
        </select>
        <select value={filterRole} onChange={e=>setFilterRole(e.target.value)}>
          <option value="all">ทุก Role</option>
          {roles.map(r=>(<option key={r} value={r}>{r}</option>))}
        </select>
        <select value={filterVia} onChange={e=>setFilterVia(e.target.value)} title="วิธีเข้าใช้งาน">
          <option value="all">ทุกวิธีเข้าใช้</option>
          <option value="password">ด้วยรหัสผ่าน</option>
          <option value="pin">ด้วย PIN</option>
        </select>
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>
          {filtered.length} / {logs.length} รายการ
          <span title={`ระบบเก็บประวัติล่าสุด ${keep} รายการ ที่เกินมาจะถูกลบอัตโนมัติ`} style={{marginLeft:8,color:"#B45309"}}>
            <i className="fa-solid fa-clock-rotate-left" style={{marginRight:4}}></i>เก็บล่าสุด {keep} รายการ
          </span>
        </div>
        <button className="btn btn-ghost" onClick={fetchLogs} disabled={loading} title="โหลดใหม่">
          <i className={`fa-solid fa-rotate${loading?" fa-spin":""}`}></i>
        </button>
      </div>
      {loading ? (
        <div style={{display:"grid",placeItems:"center",padding:60,gap:12}}>
          <div className="spinner" style={{width:32,height:32,borderWidth:3}}></div>
          <div style={{color:"var(--muted)",fontSize:13}}>กำลังโหลด...</div>
        </div>
      ) : err ? (
        <div style={{padding:32,textAlign:"center"}}>
          <i className="fa-solid fa-triangle-exclamation" style={{fontSize:32,color:"var(--danger)",marginBottom:10,display:"block"}}></i>
          <div style={{fontWeight:500,marginBottom:6}}>โหลดข้อมูลไม่สำเร็จ</div>
          <div style={{fontSize:13,color:"var(--muted)",marginBottom:14}}>{err}</div>
          <button className="btn btn-primary" onClick={fetchLogs}><i className="fa-solid fa-rotate"></i> ลองใหม่</button>
        </div>
      ) : logs.length===0 ? (
        <div style={{padding:40,textAlign:"center"}}>
          <i className="fa-solid fa-clock-rotate-left" style={{fontSize:36,color:"var(--muted)",marginBottom:12,display:"block"}}></i>
          <div style={{fontWeight:600,fontSize:15,marginBottom:6}}>ยังไม่มีประวัติการล็อกอิน</div>
          <div style={{fontSize:13,color:"var(--muted)",marginBottom:4}}>ระบบเพิ่งเปิดใช้งานฟีเจอร์นี้</div>
          <div style={{fontSize:13,color:"var(--muted)"}}>Log จะเริ่มบันทึกเมื่อ user แต่ละคน <strong>ออกจากระบบแล้วล็อกอินใหม่</strong></div>
        </div>
      ) : (
        <div className="table-wrap">
          <table className="data">
            <thead><tr>
              <th style={{width:36}}>#</th>
              <th>เวลาที่ล็อกอิน</th>
              <th>ชื่อ-สกุล</th>
              <th>Username</th>
              <th>วิธีเข้าใช้</th>
              <th>Role</th>
              <th>แผนก</th>
            </tr></thead>
            <tbody>
              {filtered.map((l,i)=>{
                const rc = roleColor[l.role]||"#64748B";
                const isToday = (l.when||"").slice(0,10)===todayStr;
                return (
                  <tr key={l.id||i} style={isToday?{background:"#F0FDF4"}:{}}>
                    <td style={{color:"var(--muted)",fontSize:11,textAlign:"center"}}>{i+1}</td>
                    <td>
                      <div style={{fontFamily:"JetBrains Mono,monospace",fontSize:12,fontWeight:isToday?600:400,color:isToday?"#065F46":"var(--text)"}}>
                        {fmtWhen(l.when)}
                      </div>
                      {isToday&&<div style={{fontSize:10,color:"#10B981",fontWeight:500,marginTop:1}}>● วันนี้</div>}
                    </td>
                    <td><div style={{fontWeight:500,fontSize:13}}>{l.name||"—"}</div></td>
                    <td><span className="mono" style={{fontSize:12,padding:"2px 7px",background:"#F1F5F9",borderRadius:5}}>{l.username||"—"}</span></td>
                    <td style={{whiteSpace:"nowrap"}}>
                      {viaOf(l)==="pin"
                        ? <span style={{padding:"2px 9px",borderRadius:999,fontSize:11,fontWeight:600,background:"#E0F2FE",color:"#0369A1"}}><i className="fa-solid fa-shield-halved" style={{marginRight:4}}></i>PIN</span>
                        : <span style={{padding:"2px 9px",borderRadius:999,fontSize:11,fontWeight:600,background:"#F1F5F9",color:"#475569"}}><i className="fa-solid fa-key" style={{marginRight:4}}></i>รหัสผ่าน</span>}
                    </td>
                    <td><span style={{padding:"2px 9px",borderRadius:999,fontSize:11,fontWeight:600,background:rc+"18",color:rc}}>{l.role||"—"}</span></td>
                    <td style={{fontSize:13,color:"var(--muted)"}}>{l.dept||"—"}</td>
                  </tr>
                );
              })}
              {filtered.length===0&&(<tr><td colSpan="7"><div className="empty"><i className="fa-solid fa-magnifying-glass"></i><div className="t">ไม่พบข้อมูลที่ค้นหา</div><div>ลองเปลี่ยนเงื่อนไขการค้นหา</div></div></td></tr>)}
            </tbody>
          </table>
        </div>
      )}
    </div>
    </>
  );
}

function MachineTransferHistory({user}){
  const allTransfers = React.useMemo(()=>{
    const visible = window.filterByUserProjects(user, window.__DATA.machines, "project");
    const list=[];
    visible.forEach(m=>{
      (m.transferHistory||[]).forEach(t=>list.push({...t,machineCode:m.code,machineName:m.name,currentProject:m.project}));
    });
    return list.sort((a,b)=>new Date(b.when)-new Date(a.when));
  },[user]);
  const [q,setQ] = React.useState("");
  const [filterProj,setFilterProj] = React.useState("all");
  const projects = React.useMemo(()=>{
    const s=new Set(); allTransfers.forEach(t=>{if(t.from)s.add(t.from);if(t.to)s.add(t.to);}); return [...s].sort();
  },[allTransfers]);
  const filtered = React.useMemo(()=>allTransfers.filter(t=>{
    if(filterProj!=="all" && t.from!==filterProj && t.to!==filterProj) return false;
    if(q){ const qq=q.toLowerCase(); if(!([t.machineCode,t.machineName,t.from,t.to,t.fromSubSite,t.toSubSite,t.by,t.note].map(x=>(x||"").toLowerCase()).join(" ").includes(qq))) return false; }
    return true;
  }),[allTransfers,q,filterProj]);
  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา รหัส / ชื่อ / โครงการ..." value={q} onChange={e=>setQ(e.target.value)}/></div>
        <select value={filterProj} onChange={e=>setFilterProj(e.target.value)}>
          <option value="all">ทุกโครงการ</option>
          {projects.map(p=>(<option key={p} value={p}>{p}</option>))}
        </select>
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>{filtered.length} รายการ</div>
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr><th>วันที่ย้าย</th><th>รหัส</th><th>ชื่อเครื่องจักร</th><th>จากโครงการ</th><th style={{width:24}}></th><th>ไปโครงการ</th><th className="hide-on-mobile">โดย</th><th className="hide-on-mobile">เหตุผล</th></tr></thead>
          <tbody>
            {filtered.map((t,i)=>(
              <tr key={i}>
                <td style={{color:"var(--muted)",whiteSpace:"nowrap",fontSize:13}}>{window.__DATA.fmtDate(t.when)}</td>
                <td><span className="mono" style={{fontSize:12}}>{t.machineCode||"—"}</span></td>
                <td style={{fontWeight:500,fontSize:13}}>{t.machineName||"—"}</td>
                <td>
                  <span style={{background:"#F5F3FF",color:"#6D28D9",padding:"2px 8px",borderRadius:5,fontSize:12,fontWeight:500}}>{t.from||"ไม่ระบุ"}</span>
                  {t.fromSubSite && <div style={{fontSize:11,color:"#6D28D9",marginTop:3}}><i className="fa-solid fa-sitemap" style={{fontSize:9,marginRight:3}}></i>{t.fromSubSite}</div>}
                </td>
                <td style={{textAlign:"center"}}><i className="fa-solid fa-arrow-right" style={{color:"var(--muted)",fontSize:11}}></i></td>
                <td>
                  <span style={{background:"#EFF6FF",color:"#1E40AF",padding:"2px 8px",borderRadius:5,fontSize:12,fontWeight:600}}>{t.to}</span>
                  {t.toSubSite && <div style={{fontSize:11,color:"#1E40AF",marginTop:3}}><i className="fa-solid fa-sitemap" style={{fontSize:9,marginRight:3}}></i>{t.toSubSite}</div>}
                </td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{t.by||"—"}</td>
                <td className="hide-on-mobile" style={{fontSize:12,color:"#4B5563",maxWidth:200}}>{t.note||"—"}</td>
              </tr>
            ))}
            {filtered.length===0&&(<tr><td colSpan="8"><div className="empty"><i className="fa-solid fa-right-left"></i><div className="t">ไม่พบประวัติการย้าย</div><div>ยังไม่มีการย้ายเครื่องจักรระหว่างโครงการ</div></div></td></tr>)}
          </tbody>
        </table>
      </div>
    </div>
  );
}
</script>


<script type="text/babel">
function ReporterDashboard({user,goTo}){
  const mine = React.useMemo(()=>{
    if(user.role==="Engineer") return window.filterByUserProjects(user,window.__DATA.repairs,"project");
    return window.filterByUserProjects(user,window.__DATA.repairs.filter(r=>r.reporterId===user.id),"project");
  },[user]);
  const counts = { all:mine.length, progress:mine.filter(r=>["progress","assess","new"].includes(r.status)).length, parts:mine.filter(r=>r.status==="parts").length, done:mine.filter(r=>r.status==="done").length };
  const recent = mine.slice(0,5);

    {label:"รายการทั้งหมด",val:counts.all,icon:"fa-clipboard-list",color:"#3B82F6"},
    {label:"กำลังดำเนินการ",val:counts.progress,icon:"fa-screwdriver-wrench",color:"#F59E0B"},
    {label:"รออะไหล่",val:counts.parts,icon:"fa-box-open",color:"#EF4444"},

      </div>
      <div className="card" style={{marginBottom:18}}>
        <div className="card-body" style={{display:"flex",alignItems:"center",gap:22,flexWrap:"wrap"}}>

          <div style={{flex:1,minWidth:220}}><div style={{fontSize:17,fontWeight:600,marginBottom:4}}>พบปัญหาเครื่องจักร?</div><div style={{color:"var(--muted)",fontSize:13.5}}>แจ้งซ่อมได้ทันที ระบบจะส่งต่อให้ช่างประเมินและดำเนินการ</div></div>
          <button className="btn btn-primary" onClick={()=>goTo("r-new")}><i className="fa-solid fa-plus"></i> แจ้งซ่อมใหม่</button>
        </div>

      <div className="card">
        <div className="card-h"><div><h3>งานแจ้งซ่อมล่าสุดของฉัน</h3><div className="sub">{mine.length} รายการทั้งหมด</div></div><button className="btn btn-ghost btn-sm" onClick={()=>goTo("r-mine")}>ดูทั้งหมด <i className="fa-solid fa-arrow-right"></i></button></div>
        <div className="table-wrap">

            <tbody>
              {recent.map(r=>(<tr key={r.id}><td><span className="ticket-id">{r.running}</span></td><td className="hide-on-mobile" style={{color:"var(--muted)",whiteSpace:"nowrap"}}>{window.__DATA.fmtDate(r.createdAt)}</td><td><div className="cell-title"><ProblemLines title={r.title} max={4}/></div></td><td className="hide-on-mobile"><CategoryChip categoryId={r.categoryId}/></td><td><Badge status={r.status}/></td></tr>))}
              {recent.length===0 && (<tr><td colSpan="5"><div className="empty"><i className="fa-solid fa-clipboard"></i><div className="t">ยังไม่มีรายการ</div><div>คลิก "แจ้งซ่อมใหม่" เพื่อเริ่มต้น</div></div></td></tr>)}
