            {icons.map(ic=>(<button type="button" key={ic} onClick={()=>up("icon",ic)} style={{height:50,borderRadius:10,border:f.icon===ic?"2px solid var(--primary)":"1px solid var(--line)",background:f.icon===ic?"var(--accent-soft)":"#fff",color:f.icon===ic?"var(--primary)":"var(--muted)",fontSize:18,cursor:"pointer",display:"grid",placeItems:"center"}}><i className={`fa-solid ${ic}`}></i></button>))}

function TransferMachineModal({m,user,onClose,onSave}){
  // ย้ายได้เฉพาะไปโครงการที่ตัวเองมีสิทธิ์ — กันย้ายเครื่องจักรหายเข้าโครงการที่มองไม่เห็น
  const projects = window.visibleProjects(user).filter(p=>p.name!==m.project);
  const [toProject,setToProject] = React.useState("");
  const [toSubSite,setToSubSite] = React.useState("");
  const [note,setNote] = React.useState("");
  // วันที่ย้ายจริง — บางครั้งมาบันทึกย้อนหลัง จึงไม่ผูกกับเวลาที่กดบันทึก
  const [moveDate,setMoveDate] = React.useState(()=>{
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  });
  const toSites = window.projectSites(toProject);
  const inSt = {width:"100%",padding:"9px 11px",border:"1px solid var(--line)",borderRadius:8,fontFamily:"Kanit",fontSize:13.5,background:"#fff"};
  const submit = () => {
    if(!toProject){ Swal.fire({icon:"warning",title:"กรุณาเลือกโครงการปลายทาง"}); return; }
    if(!moveDate){ Swal.fire({icon:"warning",title:"กรุณาระบุวันที่ย้าย"}); return; }
    onSave({toProject,toSubSite,note,moveDate});
  };
  return (
    <Modal open={true} onClose={onClose} title={<><i className="fa-solid fa-right-left" style={{color:"#7C3AED",marginRight:8}}></i>ย้ายโครงการ</>} size="sm"
      footer={<><button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button><button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-check"></i> ยืนยันการย้าย</button></>}>
      <div style={{display:"grid",gap:16}}>
        <div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:11,color:"#92400E",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>โครงการปัจจุบัน</div>
          <div style={{fontWeight:600,fontSize:15,color:"#78350F"}}>{m.project ? window.projectShort(m.project) : "— ไม่ระบุ —"}</div>
          {m.project && window.projectShort(m.project)!==m.project && <div style={{fontSize:12,color:"#B45309",marginTop:2}}>{m.project}</div>}
          {m.subSite && <div style={{fontSize:12,color:"#B45309",marginTop:3}}><i className="fa-solid fa-sitemap" style={{marginRight:5}}></i>ไซต์งานย่อย: {m.subSite}</div>}
        </div>
        <div>
          <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>ย้ายไปยังโครงการ <span style={{color:"#EF4444"}}>*</span></label>
          <select style={inSt} value={toProject} onChange={e=>{ setToProject(e.target.value); setToSubSite(""); }}>
            <option value="">— เลือกโครงการปลายทาง —</option>
            {projects.map(p=>(<option key={p.id} value={p.name}>{p.name}</option>))}
          </select>
          {projects.length===0 && <div style={{fontSize:12,color:"var(--muted)",marginTop:5}}>ไม่มีโครงการอื่นในระบบ กรุณาเพิ่มโครงการก่อน</div>}
        </div>
        {toSites.length>0 && (
          <div>
            <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}><i className="fa-solid fa-sitemap" style={{marginRight:5}}></i>ไซต์งานย่อยปลายทาง</label>
            <select style={inSt} value={toSubSite} onChange={e=>setToSubSite(e.target.value)}>
              <option value="">— ทั้งโครงการ (ไม่ระบุไซต์) —</option>
              {toSites.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        )}
        <div>
          <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>
            <i className="fa-solid fa-calendar-day" style={{marginRight:5}}></i>วันที่ย้าย <span style={{color:"#EF4444"}}>*</span>
          </label>
          <input type="date" style={inSt} value={moveDate} onChange={e=>setMoveDate(e.target.value)} />
          <div style={{fontSize:11.5,color:"var(--muted)",marginTop:4}}>บันทึกย้อนหลังได้ — วันที่นี้คือวันที่ขึ้นในประวัติการย้ายโครงการ</div>
        </div>
        <div>
          <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>เหตุผล / หมายเหตุ</label>
          <textarea style={{...inSt,resize:"vertical"}} rows="3" value={note} onChange={e=>setNote(e.target.value)} placeholder="เช่น ย้ายตามแผนปรับโครงสร้าง, ส่งมอบให้โครงการ B..." />
        </div>
      </div>
    </Modal>
  );
}

function MachineDetail({m,user,onClose,onEdit,onDelete,onTransfer,onPatchMachine}){
  const [relatedRows, setRelatedRows] = React.useState(()=>window.__DATA.repairs.filter(r=>r.machineCode===m.code).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));
  const statusColor = ({"ใช้งาน":"#10B981","ซ่อม":"#EF4444","รอซ่อม":"#F59E0B","ส่งคืน":"#6366F1"})[m.status]||"#64748B";
  const canEdit = ["Admin","Officer","Engineer"].includes(window.effectiveRole(user));
  // ตารางงานซ่อมด้านล่างเป็นข้อมูลของระบบงานซ่อม ไม่ใช่ทะเบียนทรัพย์สิน — ใช้ role จริงเสมอ
  // ไม่งั้น Reporter ที่เข้าระบบ Asset จะแก้ใบแจ้งซ่อมได้ตรงๆ ข้ามขั้นตอนขออนุมัติ
  const canEditRepairs = ["Admin","Officer","Engineer"].includes(user.role);
  const [viewRepair, setViewRepair] = React.useState(null);
  const [editRepair, setEditRepair] = React.useState(null);
  const [transferModal, setTransferModal] = React.useState(false);
  const [editTrIdx, setEditTrIdx] = React.useState(null);
  const [editTrForm, setEditTrForm] = React.useState(null);
  const [savingTr, setSavingTr] = React.useState(false);
  const projectNames = React.useMemo(()=>{
    const names = window.visibleProjects(user).map(p=>p.name);
    (m.transferHistory||[]).forEach(t=>{ [t.from,t.to].forEach(n=>{ if(n && !names.includes(n)) names.push(n); }); });
    return names;
  },[m.transferHistory,user]);
  const toDateStr = (d) => { try{ return new Date(d).toISOString().slice(0,10); }catch(e){ return ""; } };
  const trLabelSt = {fontSize:10.5,color:"#6D28D9",fontWeight:500,marginBottom:2};
  const trInputSt = {width:"100%",padding:"5px 8px",border:"1px solid #C4B5FD",borderRadius:6,fontSize:12.5,fontFamily:"Kanit",color:"#3B0764",background:"#fff",outline:"none"};
  const [editDateField, setEditDateField] = React.useState(null);
  const [editDateValue, setEditDateValue] = React.useState("");
  const [savingDate, setSavingDate] = React.useState(false);
  const today = React.useMemo(()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; },[]);
  const nextDateColor = (val) => {
    if(!val) return null;
    const d=new Date(val); d.setHours(0,0,0,0);
    const diff=Math.floor((d-today)/(1000*60*60*24));
    if(diff<0) return "#EF4444";
    if(diff<=30) return "#F59E0B";
    return "#10B981";
  };
  const saveInspectionDate = async () => {
    if(!editDateField) return;
    setSavingDate(true);
    try{ await onPatchMachine({[editDateField]:editDateValue}); setEditDateField(null); }
    catch(e){}
    setSavingDate(false);
  };
  const renderInspectionCell = (field) => {
    const val = m[field]||"";
    const color = field==="nextInspectionDate" ? nextDateColor(val) : null;
    if(editDateField===field) return (
      <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
        <input type="date" value={editDateValue} onChange={e=>setEditDateValue(e.target.value)}
          style={{padding:"3px 7px",border:"1px solid var(--primary)",borderRadius:6,fontSize:12,fontFamily:"Kanit"}} autoFocus/>
        <button onClick={saveInspectionDate} disabled={savingDate} style={{padding:"3px 10px",background:"var(--primary)",color:"#fff",border:"none",borderRadius:6,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>
          {savingDate?"...":"บันทึก"}
        </button>
        <button onClick={()=>setEditDateField(null)} style={{padding:"3px 8px",background:"none",border:"1px solid var(--line)",borderRadius:6,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>ยกเลิก</button>
      </div>
    );
    return (
      <div style={{display:"flex",alignItems:"center",gap:5}}>
        {val ? (
          <span style={{fontSize:12,fontWeight:color?"600":"400",color:color||"inherit",background:color?color+"18":"transparent",padding:color?"2px 7px":"0",borderRadius:5,display:"inline-flex",alignItems:"center",gap:4}}>
            {window.__DATA.fmtDate(val)}
            {color==="#EF4444"&&<span style={{fontSize:10}}>⚠ เกินกำหนด</span>}
            {color==="#F59E0B"&&<span style={{fontSize:10}}>ใกล้ถึงกำหนด</span>}
          </span>
        ) : <span style={{color:"var(--muted)",fontSize:12}}>—</span>}
        {canEdit && <button onClick={()=>{setEditDateField(field);setEditDateValue(val||toDateStr(new Date()));}}
          style={{padding:"1px 5px",background:"none",border:"1px solid var(--line)",borderRadius:4,fontSize:10,cursor:"pointer",color:"var(--muted)"}} title="แก้ไขวันที่">
          <i className={`fa-solid ${val?"fa-pen":"fa-plus"}`}></i>
        </button>}
      </div>
    );
  };
  // บันทึกว่าทำ PM แล้ว → ตั้งฐานรอบใหม่ (วันที่ + ชั่วโมง) และเก็บประวัติ
  const recordPm = async () => {
    const patch = await window.pmRecordDialog(m, user);
    if(!patch) return;
    await onPatchMachine(patch);
    Swal.fire({icon:"success",title:"บันทึก PM แล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
  };

  const startEditTransfer = (idx, t) => {
    setEditTrIdx(idx);
    setEditTrForm({from:t.from||"", to:t.to||"", when:toDateStr(t.when), note:t.note||"", by:t.by||""});
  };

  const saveTransferEntry = async () => {
    if(editTrIdx===null || !editTrForm) return;
    if(!editTrForm.to.trim()){ Swal.fire({icon:"warning",title:"กรุณาระบุโครงการปลายทาง"}); return; }
    const hist = m.transferHistory||[];
    const newHistory = hist.map((t,i)=>i!==editTrIdx?t:({
      ...t,
      from: editTrForm.from.trim(),
      to: editTrForm.to.trim(),
      note: editTrForm.note,
      by: editTrForm.by.trim(),
      when: editTrForm.when ? new Date(editTrForm.when).toISOString() : t.when,
      editedBy: user.name,
      editedAt: new Date().toISOString()
    }));
    // แก้รายการล่าสุด = ปลายทางเปลี่ยน ให้โครงการปัจจุบันของเครื่องจักรตามไปด้วย
    const patch = {transferHistory:newHistory};
    if(editTrIdx===hist.length-1) patch.project = newHistory[editTrIdx].to;
    setSavingTr(true);
    try{
      await onPatchMachine(patch);
      setEditTrIdx(null); setEditTrForm(null);
      Swal.fire({icon:"success",title:"แก้ไขประวัติแล้ว",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    } finally { setSavingTr(false); }
  };

  const deleteTransferEntry = async (idx, t) => {
    const res = await window.deleteWithApproval({
      user, action:"deleteTransferEntry",
      payload:{ machineId:m.id, index:idx, when:t.when, to:t.to||"" },
      entityLabel:"ประวัติการย้ายเครื่องจักร",
      targetName:`${m.name||""} (${m.code||""})`, project:m.project||"",
      targetInfo:`${t.from||"ไม่ระบุ"} → ${t.to||""} · ${window.__DATA.fmtDate(t.when)}`,
      warnHtml:"ลบแล้วกู้คืนไม่ได้ และไม่กระทบโครงการปัจจุบันของเครื่องจักร",
    });
    if(!res) return;
    // อัปเดตหน้าจอด้วยประวัติชุดที่ backend ลบให้จริง (localOnly = ไม่เขียนซ้ำลงฐานข้อมูล)
    const history = (res && res.transferHistory) || (m.transferHistory||[]).filter((_,i)=>i!==idx);
    await onPatchMachine({transferHistory:history}, true);
    setEditTrIdx(null); setEditTrForm(null);
  };

  const saveEdit = async (r, patch) => {
    try{
      try{ await window.api("updateRepair",{id:r.id,patch,by:user.name}); }
      catch(e1){
        if(/Unknown action/i.test(String(e1.message||e1))){
          const {status,cost,...rest}=patch;
          await window.api("updateRepairStatus",{id:r.id,status:status||r.status,cost,by:user.name,note:"แก้ไขข้อมูล",patch:rest});
        } else { throw e1; }
      }
      const updated={...r,...patch,timeline:[...r.timeline,{status:patch.status||r.status,when:new Date(),by:user.name,note:"แก้ไขข้อมูล"}]};
      setRelatedRows(prev=>prev.map(x=>x.id===r.id?updated:x));
      window.__DATA.repairs=window.__DATA.repairs.map(x=>x.id===r.id?updated:x);
      setEditRepair(null);
      Swal.fire({icon:"success",title:"บันทึกการแก้ไขแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };
  return (
    <>
    <Modal open={true} onClose={onClose} title={<>เครื่องจักร <span className="mono" style={{marginLeft:6,color:"var(--primary)"}}>{m.code}</span></>} size="lg"
      footer={<>{canEdit&&<button className="btn btn-danger" onClick={onDelete}><i className="fa-solid fa-trash"></i> ลบ</button>}<div style={{flex:1}}></div><button className="btn btn-ghost" onClick={onClose}>ปิด</button>{canEdit&&<button className="btn btn-ghost" style={{color:"#7C3AED",border:"1px solid #DDD6FE"}} onClick={()=>setTransferModal(true)}><i className="fa-solid fa-right-left"></i> ย้ายโครงการ</button>}{canEdit&&<button className="btn btn-primary" onClick={onEdit}><i className="fa-solid fa-pen-to-square"></i> แก้ไข</button>}</>}>
      <div className="detail-header" style={{display:"grid",gridTemplateColumns:"240px 1fr",gap:22,marginBottom:18}}>
        <div style={{borderRadius:12,overflow:"hidden",aspectRatio:"1",background:"var(--bg)",position:"relative"}}>
          <div className="machine-thumb" style={{position:"absolute",inset:0,borderRadius:0}}>
            <div className="pattern"></div>
            <div className="ic"><i className={`fa-solid ${m.icon||"fa-gears"}`}></i></div>
            {window.machinePhotos(m)[0] && <img src={gdriveThumb(window.machinePhotos(m)[0])} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"} />}
          </div>
          {window.machinePhotos(m).length>1 && (
            <div style={{position:"absolute",left:8,right:8,bottom:8,display:"flex",gap:6,justifyContent:"center"}}>
              {window.machinePhotos(m).map((url,i)=><PhotoThumb key={i} url={url} size={52}/>)}
            </div>
          )}
        </div>
        <div>
          <div style={{fontSize:20,fontWeight:600,marginBottom:4}}>{m.name}</div>
          <div style={{color:"var(--muted)",marginBottom:14}}>{m.brand||"—"} {m.model||""} {m.size?`· ${m.size}`:""}</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <span className="badge" style={{background:statusColor+"22",color:statusColor,fontSize:13}}><span className="dot"></span>{m.status}</span>
            {m.categoryId && (()=>{ const cat=window.getCategory(m.categoryId); return <span className="badge" style={{background:cat.color+"22",color:cat.color,fontSize:13}}><i className={`fa-solid ${cat.icon}`} style={{marginRight:4}}></i>{cat.name}</span>; })()}
            {m.ownership && <span className="badge" style={{background:"var(--accent-soft)",color:"var(--primary)",fontSize:13}}><i className="fa-solid fa-handshake" style={{marginRight:4}}></i>{m.ownership}</span>}
          </div>
          <div className="detail-grid" style={{marginTop:16,gridTemplateColumns:"1fr 1fr"}}>
            <div><div className="k">โครงการ</div><div className="v"><ProjectLabel name={m.project}/></div></div>
            <div><div className="k">ไซต์งานย่อย</div><div className="v">{m.subSite ? <SubSiteTag value={m.subSite} project={m.project}/> : "—"}</div></div>

            <div><div className="k">สถานที่ติดตั้ง</div><div className="v">{m.location||"—"}</div></div>
            <div><div className="k">ซ่อมบำรุงล่าสุด</div><div className="v">{m.lastService||"—"}</div></div>
            <div><div className="k">ชั่วโมงทำงาน</div><div className="v">{Number(m.hours||0).toLocaleString()} ชม.</div></div>

          {(()=>{

            return (
              <div style={{marginTop:12,padding:"10px 14px",background:"#ECFEFF",border:"1px solid #A5F3FC",borderRadius:10}}>

                  </span>}
                </div>
                {!everyD && !everyH ? (
                  <div style={{fontSize:12.5,color:"var(--muted)"}}>ยังไม่ได้ตั้งรอบ PM{canEdit?" — กด \"แก้ไข\" เพื่อตั้งรอบเป็นวันหรือชั่วโมงทำงาน":""}</div>

                {hist.length>0 && (
                  <div style={{marginTop:10,borderTop:"1px dashed #A5F3FC",paddingTop:8,display:"grid",gap:4}}>
                    <div style={{fontSize:11,color:"var(--muted)"}}>ประวัติ PM ({hist.length})</div>
                    {hist.slice(0,5).map((h,i)=>(
                      <div key={i} style={{fontSize:12}}>
                        <b>{window.__DATA.fmtDate(h.date)}</b>{h.hours!==""&&h.hours!=null?` · ${Number(h.hours).toLocaleString("th-TH")} ชม.`:""} · โดย {h.by||"—"}{h.note?<span style={{color:"var(--muted)"}}> · {h.note}</span>:null}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })()}
          {(m.driveLink1||m.driveLink2||m.driveLinkPL) && <div style={{marginTop:14,display:"grid",gap:8}}>
            <div style={{fontSize:12,fontWeight:500,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".05em"}}><i className="fa-brands fa-google-drive" style={{color:"#4285F4",marginRight:6}}></i>ไฟล์เอกสาร Google Drive</div>
            {m.driveLink1 && <a href={m.driveLink1} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:8,background:"#EFF6FF",border:"1px solid #BFDBFE",color:"#1E40AF",fontSize:13,textDecoration:"none"}}><i className="fa-brands fa-google-drive" style={{color:"#4285F4"}}></i>ไฟล์เอกสาร (1)<i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:10,opacity:.6,marginLeft:"auto"}}></i></a>}
            {m.driveLink2 && <a href={m.driveLink2} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:8,background:"#EFF6FF",border:"1px solid #BFDBFE",color:"#1E40AF",fontSize:13,textDecoration:"none"}}><i className="fa-brands fa-google-drive" style={{color:"#4285F4"}}></i>ไฟล์เอกสาร (2)<i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:10,opacity:.6,marginLeft:"auto"}}></i></a>}

          </div>}

          {m.transferHistory && m.transferHistory.length>0 && (
            <div style={{marginTop:14}}>
              <div style={{fontSize:12,fontWeight:500,color:"#7C3AED",textTransform:"uppercase",letterSpacing:".05em",marginBottom:8}}><i className="fa-solid fa-right-left" style={{marginRight:6}}></i>ประวัติการย้ายโครงการ ({m.transferHistory.length})</div>
              <datalist id="tr-projects">{projectNames.map(n=>(<option key={n} value={n} />))}</datalist>
              <div style={{display:"grid",gap:6}}>
                {[...m.transferHistory].reverse().map((t,i)=>{
                  const actualIdx = m.transferHistory.length-1-i;
                  const isEditing = editTrIdx===actualIdx;
                  return (
                    <div key={i} style={{display:"flex",gap:10,padding:"10px 12px",background:"#F5F3FF",border:`1px solid ${isEditing?"#A78BFA":"#DDD6FE"}`,borderRadius:8,fontSize:13}}>
                      <div style={{color:"#7C3AED",marginTop:1,flexShrink:0}}><i className="fa-solid fa-circle-arrow-right"></i></div>
                      <div style={{flex:1,minWidth:0}}>
                        {isEditing ? (
                          <div style={{display:"grid",gap:8}}>
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                              <div>
                                <div style={trLabelSt}>จากโครงการ</div>
                                <input list="tr-projects" value={editTrForm.from} onChange={e=>setEditTrForm(p=>({...p,from:e.target.value}))} placeholder="ไม่ระบุ" style={trInputSt} />
                              </div>
                              <div>
                                <div style={trLabelSt}>ไปโครงการ *</div>
                                <input list="tr-projects" value={editTrForm.to} onChange={e=>setEditTrForm(p=>({...p,to:e.target.value}))} placeholder="โครงการปลายทาง" style={trInputSt} />
                              </div>
                              <div>
                                <div style={trLabelSt}>วันที่ย้าย</div>
                                <input type="date" value={editTrForm.when} onChange={e=>setEditTrForm(p=>({...p,when:e.target.value}))} style={trInputSt} />
                              </div>
                              <div>
                                <div style={trLabelSt}>ผู้บันทึก</div>
                                <input value={editTrForm.by} onChange={e=>setEditTrForm(p=>({...p,by:e.target.value}))} placeholder="ชื่อผู้บันทึก" style={trInputSt} />
                              </div>
                            </div>
                            <div>
                              <div style={trLabelSt}>หมายเหตุ</div>
                              <textarea rows="2" value={editTrForm.note} onChange={e=>setEditTrForm(p=>({...p,note:e.target.value}))} placeholder="เหตุผลการย้าย..." style={{...trInputSt,resize:"vertical"}}></textarea>
                            </div>
                            {actualIdx===m.transferHistory.length-1 && editTrForm.to.trim() && editTrForm.to.trim()!==m.project && (
                              <div style={{fontSize:11,color:"#B45309",background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:6,padding:"5px 8px"}}>
                                <i className="fa-solid fa-triangle-exclamation"></i> รายการล่าสุด — บันทึกแล้วโครงการปัจจุบันของเครื่องจักรจะเปลี่ยนเป็น <strong>{editTrForm.to.trim()}</strong>
                              </div>
                            )}
                            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                              <button onClick={saveTransferEntry} disabled={savingTr} style={{padding:"4px 12px",background:"#7C3AED",color:"#fff",border:"none",borderRadius:5,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}><i className="fa-solid fa-floppy-disk"></i> {savingTr?"กำลังบันทึก...":"บันทึก"}</button>
                              <button onClick={()=>{setEditTrIdx(null);setEditTrForm(null);}} disabled={savingTr} style={{padding:"4px 10px",background:"none",border:"1px solid #DDD6FE",borderRadius:5,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>ยกเลิก</button>
                              <div style={{flex:1}}></div>
                              <button onClick={()=>deleteTransferEntry(actualIdx,t)} disabled={savingTr} style={{padding:"4px 10px",background:"none",border:"1px solid #FECACA",color:"#DC2626",borderRadius:5,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}><i className="fa-solid fa-trash"></i> ลบรายการนี้</button>
                            </div>
                          </div>
                        ) : (
                          <>
                            <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                              <span style={{color:"#6D28D9",fontWeight:500}}>{t.from||"ไม่ระบุ"}{t.fromSubSite?` · ${t.fromSubSite}`:""}</span>
                              <i className="fa-solid fa-arrow-right" style={{fontSize:10,color:"var(--muted)"}}></i>
                              <span style={{color:"#1E40AF",fontWeight:600}}>{t.to}{t.toSubSite?` · ${t.toSubSite}`:""}</span>
                            </div>
                            {t.note && <div style={{color:"#4B5563",marginTop:3,fontSize:12}}>{t.note}</div>}
                            <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3,flexWrap:"wrap"}}>
                              <span style={{color:"var(--muted)",fontSize:11}}>{window.__DATA.fmtDate(t.when)} · {t.by}</span>
                              {t.editedAt && <span style={{color:"var(--muted)",fontSize:10,fontStyle:"italic"}} title={`แก้ไขโดย ${t.editedBy} เมื่อ ${window.__DATA.fmtDate(t.editedAt)}`}><i className="fa-solid fa-pen-to-square"></i> แก้ไขแล้ว</span>}
                              {canEdit && <button onClick={()=>startEditTransfer(actualIdx,t)} title="แก้ไขรายการนี้" style={{padding:"1px 6px",background:"none",border:"1px solid #DDD6FE",borderRadius:4,fontSize:10,cursor:"pointer",color:"#7C3AED",lineHeight:1.6}}><i className="fa-solid fa-pen"></i></button>}
                              {canEdit && <button onClick={()=>deleteTransferEntry(actualIdx,t)} title="ลบรายการนี้" style={{padding:"1px 6px",background:"none",border:"1px solid #FECACA",borderRadius:4,fontSize:10,cursor:"pointer",color:"#DC2626",lineHeight:1.6}}><i className="fa-solid fa-trash"></i></button>}
                            </div>
                          </>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      </div>
      <div style={{borderTop:"1px dashed var(--line)",paddingTop:16}}>
        <div style={{fontWeight:500,marginBottom:10,fontSize:14}}><i className="fa-solid fa-clock-rotate-left" style={{color:"var(--primary)",marginRight:6}}></i>ประวัติการแจ้งซ่อม ({relatedRows.length})</div>
        {relatedRows.length>0 ? (
          <div className="table-wrap" style={{border:"1px solid var(--line)",borderRadius:8}}>
          <table className="data">
            <thead><tr><th>เลขที่</th><th>วันที่</th><th>อาการ</th><th>สถานะ</th>{canEditRepairs&&<th>จัดการ</th>}</tr></thead>
            <tbody>
              {relatedRows.map(r=>(
                <tr key={r.id} style={{cursor:"pointer"}}>
                  <td onClick={()=>setViewRepair(r)}><span className="ticket-id" style={{display:"inline-flex",alignItems:"center",gap:5}}>{r.running}<i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:9,opacity:.5}}></i></span></td>
                  <td onClick={()=>setViewRepair(r)} style={{color:"var(--muted)"}}>{window.__DATA.fmtDate(r.createdAt)}</td>
                  <td onClick={()=>setViewRepair(r)} style={{fontSize:13}}><ProblemLines title={r.title} max={4}/></td>
                  <td onClick={()=>setViewRepair(r)}><Badge status={r.status}/></td>
                  {canEditRepairs&&<td><button className="ia" title="แก้ไขข้อมูล" onClick={e=>{e.stopPropagation();setEditRepair(r);}} style={{color:"#1E40AF"}}><i className="fa-solid fa-user-pen"></i></button></td>}
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        ) : <div style={{color:"var(--muted)",fontSize:13,padding:"12px 0"}}>ยังไม่มีประวัติการซ่อม</div>}
      </div>
    </Modal>
    {viewRepair && <window.RepairDetail r={viewRepair} user={user} onClose={()=>setViewRepair(null)} onQuick={null} onEdit={canEditRepairs?(r)=>{setViewRepair(null);setEditRepair(r);}:null} onEditParts={null}/>}
    {editRepair && <window.EditRepairModal r={editRepair} onClose={()=>setEditRepair(null)} onSave={saveEdit}/>}
    {transferModal && <TransferMachineModal m={m} user={user} onClose={()=>setTransferModal(false)} onSave={(payload)=>{setTransferModal(false);onTransfer(payload);}}/>}
    </>
  );
}
window.Machines = Machines;
</script>

<script type="text/babel">

      <path d="M42 130c25-53 61-67 107-63-25 16-40 34-47 59 17-8 32-19 46-36-12 50-50 74-104 78 15-12 26-25 35-41-13 2-25 3-37 3z" fill="#155E95"/>
      <path d="M57 147c20-24 45-39 78-48-12 22-18 43-17 69-19-18-37-24-61-21z" fill="#7BC043"/>

function WithdrawalPaperPreview({doc,items}){
  const clean = v => String(v ?? "").trim();
  const formatThaiDate = (value) => {
    if(!value) return "";
    const d = new Date(value);
    if(isNaN(d)) return value;
    return d.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"});
  };
  const rows = (items || []).map((x,i)=>({no:i+1,name:clean(x.name),qty:clean(x.qty),unit:clean(x.unit),remark:clean(x.remark)})).filter(x=>x.name||x.qty||x.unit||x.remark);
  while(rows.length < 24) rows.push({no:rows.length+1,name:"",qty:"",unit:"",remark:""});
  return (
    <div className="withdrawal-paper-wrap">
      <div className="withdrawal-paper">
        <div className="paper-head">
          <div><img src={window.PNM_LOGO_DATAURL} alt="โลโก้ บริษัท พานามณี จำกัด" style={{display:"block",width:117,height:"auto"}}/></div>
          <div className="paper-title-block">
            <div className="company">บริษัท พานามณี จำกัด</div>
            <div className="doc-title">ใบขอเบิก/ขอสั่งซื้อ</div>
          </div>
          <div></div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
          <div className="paper-meta-row">เลขที่ใบเบิก <span className="paper-line">{doc.docNo || ""}</span></div>
          <div className="paper-meta-row">วันที่ <span className="paper-line">{formatThaiDate(doc.docDate)}</span></div>
        </div>
        <div className="paper-meta-row full">หน่วยงาน <span className="paper-line">{doc.department || doc.project || ""}</span></div>
        <table className="item-table">
          <thead>
            <tr><th rowSpan="2" style={{width:"8%"}}>ลำดับ</th><th rowSpan="2" style={{width:"28%"}}>รายการ</th><th colSpan="2" style={{width:"18%"}}>จำนวนเบิก/ขอสั่งซื้อ</th><th rowSpan="2" style={{width:"12%"}}>ยอดคงเหลือ</th><th rowSpan="2" style={{width:"12%"}}>วันที่เบิกล่าสุด</th><th rowSpan="2" style={{width:"8%"}}>ราคา</th><th rowSpan="2" style={{width:"9%"}}>จำนวนเงิน</th><th rowSpan="2">หมายเหตุ</th></tr>
            <tr><th>จำนวน</th><th>หน่วยนับ</th></tr>
          </thead>
          <tbody>{rows.map(item=><tr key={item.no}><td>{item.no}</td><td className="item-name">{item.name}</td><td>{item.qty}</td><td>{item.unit}</td><td>-</td><td>-</td><td>-</td><td>-</td><td>{item.remark}</td></tr>)}</tbody>
        </table>
        <div className="sign-grid"><div><div className="sign-line"></div><div>ผู้ขอเบิก/ขอสั่งซื้อ</div></div><div><div className="sign-line"></div><div>ผู้ตรวจสอบ</div></div><div><div className="sign-line"></div><div>ผู้อนุมัติ</div></div></div>
      </div>
    </div>
  );
}

function Withdrawals({user,view="docs"}){
  const canEdit = ["Admin","Officer","Director","Engineer"].includes(user.role);
  const [rows,setRows] = React.useState(()=>window.__DATA.withdrawals || []);
  const [q,setQ] = React.useState("");
  const [edit,setEdit] = React.useState(null);
  const clean = v => String(v ?? "").trim();
  const safeKey = v => (clean(v) || `WD-${Date.now()}`).replace(/[.#$/\[\]]/g,"-").replace(/\s+/g,"-");
  const parseItems = (doc) => Array.isArray(doc.items) ? doc.items : [];
  // โลโก้บริษัทตัวจริง (ไฟล์เดียวกับหน้า Login) — เลิกใช้ SVG ที่วาดเลียนแบบไว้ชั่วคราว
  const logoSvg = `<img src="${window.PNM_LOGO_DATAURL}" alt="โลโก้ บริษัท พานามณี จำกัด" style="display:block;width:31mm;height:auto">`;
  const buildPdfHtml = (doc) => {
    const fmt = v => { const d = new Date(v); return v && !isNaN(d) ? d.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"}) : (v||""); };
    const money = v => { const n = Number(v); return n ? n.toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}) : (v===undefined||v===""||v===null ? "" : "-"); };
    const items = parseItems(doc).map((x,i)=>({...x,no:i+1}));
    while(items.length < 24) items.push({no:items.length+1,name:"",qty:"",unit:"",remark:""});
    const trs = items.map(item=>`<tr><td>${item.no}</td><td style="text-align:left;padding-left:8px">${item.name||""}</td><td>${item.qty||""}</td><td>${item.unit||""}</td><td>-</td><td>-</td><td>${money(item.unitPrice)}</td><td>${money(item.amount)}</td><td style="text-align:left">${item.remark||""}</td></tr>`).join("");
    return `<div style="font-family:'TH Sarabun PSK','TH Sarabun New','Sarabun','Kanit',Arial,sans-serif;color:#000;width:210mm;min-height:297mm;padding:21mm 9mm 12mm;background:#fff;box-sizing:border-box;position:relative"><style>table.wd{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;margin-top:40px}table.wd th,table.wd td{border:1px solid #000;padding:1px 4px;height:24px;line-height:1.05;text-align:center;vertical-align:middle}table.wd th{background:#F3A26E;font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden}</style><div style="display:grid;grid-template-columns:38mm 1fr 50mm;gap:5mm;align-items:start;margin-bottom:6mm;position:relative;min-height:32mm"><div>${logoSvg}</div><div style="position:absolute;left:50%;top:2mm;transform:translateX(-50%);width:90mm;text-align:center"><div style="font-size:25px;font-weight:400">บริษัท พานามณี จำกัด</div><div style="font-size:24px;font-weight:400;margin-top:1mm">ใบขอเบิก/ขอสั่งซื้อ</div></div><div></div></div><div style="display:flex;justify-content:space-between;align-items:flex-end;font-size:18px;font-weight:400;margin-bottom:7mm"><div>เลขที่ใบเบิก <span style="border-bottom:1px dotted #000;display:inline-block;min-width:34mm;text-align:center">${doc.docNo||""}</span></div><div>วันที่ <span style="border-bottom:1px dotted #000;display:inline-block;min-width:36mm;text-align:center">${fmt(doc.docDate)}</span></div></div><div style="display:flex;align-items:flex-end;gap:2mm;font-size:18px;font-weight:400;margin-bottom:10mm"><span>หน่วยงาน</span><span style="border-bottom:1px dotted #000;display:inline-block;flex:1;padding-left:4mm">${doc.department||doc.project||""}</span></div><table class="wd"><thead><tr><th rowspan="2" style="width:11mm">ลำดับ</th><th rowspan="2" style="width:53mm">รายการ</th><th colspan="2" style="width:34mm">จำนวนเบิก/ขอสั่งซื้อ</th><th rowspan="2" style="width:21mm">ยอดคงเหลือ</th><th rowspan="2" style="width:22mm">วันที่เบิกล่าสุด</th><th rowspan="2" style="width:15mm">ราคา</th><th rowspan="2" style="width:18mm">จำนวนเงิน</th><th rowspan="2">หมายเหตุ</th></tr><tr><th>จำนวน</th><th>หน่วยนับ</th></tr></thead><tbody>${trs}</tbody></table><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12mm;margin-top:7mm;font-size:17px;text-align:center"><div><div style="height:10mm;border-bottom:1px dotted #000;display:flex;align-items:flex-end;justify-content:center">${window.__SIG.img(doc.requesterId,"display:block;max-height:10mm;max-width:90%")}</div><div style="margin-top:2mm">ผู้ขอเบิก/ขอสั่งซื้อ</div>${doc.requester?`<div style="font-size:14px;color:#333">(${String(doc.requester).replace(/</g,"&lt;")})</div>`:""}</div><div><div style="height:10mm;border-bottom:1px dotted #000"></div><div style="margin-top:2mm">ผู้ตรวจสอบ</div></div><div><div style="height:10mm;border-bottom:1px dotted #000"></div><div style="margin-top:2mm">ผู้อนุมัติ</div></div></div></div>`;
  };
  const pdfName = doc => `${clean(doc.docNo||"withdrawal").replace(/[\\/:*?"<>|]/g,"-")}.pdf`;
  const downloadPdf = async (doc) => {
    try{
      Swal.fire({title:"กำลังเตรียมไฟล์ PDF...",allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
      await Promise.all([window.__loadPdf(), window.__SIG.preload([doc.requesterId])]);
      Swal.close();
    }catch(e){ Swal.fire({icon:"error",title:"ไม่พบตัวสร้าง PDF",text:"โหลดไลบรารีไม่สำเร็จ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต"}); return; }
    const el = document.createElement("div"); el.innerHTML = buildPdfHtml(doc); document.body.appendChild(el);
    await window.__waitImages(el);
    try{ await html2pdf().set({margin:0,filename:pdfName(doc),image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(el.firstElementChild).save(); }
    finally{ el.remove(); }
  };
  const save = async (form) => {
    const key = form.key || safeKey(form.docNo);
    // เลขที่ใบเบิกเป็นคีย์ของเอกสาร — ซ้ำกับใบเดิมจะไปเขียนทับ ต้องกันไว้
    if(!form.key && rows.some(x=>x.key===key)){ Swal.fire({icon:"warning",title:"เลขที่ใบเบิกซ้ำ",text:`มีใบเบิกเลขที่ ${form.docNo} อยู่แล้ว`}); return; }
    const prev = rows.find(x=>x.key===form.key) || {};
    const requesterId = window.__SIG.resolve(form.requester, prev.requester, prev.requesterId, user);
    const saved = await window.api("upsertWithdrawal",{key,doc:{...form,requesterId,id:form.docNo||key}});
    const upd = rows.some(x=>x.key===saved.key) ? rows.map(x=>x.key===saved.key?saved:x) : [saved,...rows];
    setRows(upd); window.__DATA.withdrawals = upd; setEdit(null);
    Swal.fire({icon:"success",title:"บันทึกรายการเบิกแล้ว",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
  };
  const remove = async (doc) => {
    const done = await window.deleteWithApproval({
      user, action:"deleteWithdrawal", payload:{key:doc.key},
      entityLabel:"รายการเบิกของ", targetName:doc.docNo||doc.key, project:doc.project||"",
      targetInfo:[doc.docDate, doc.department||doc.project, doc.requester].filter(Boolean).join(" · "),
    });
    if(done){ const upd=rows.filter(x=>x.key!==doc.key); setRows(upd); window.__DATA.withdrawals=upd; }
  };
  // ── หน้า "รอจัดซื้อ/จัดหา" (เมนูแยก): รายการในใบเบิกที่ยังไม่ได้ซื้อ/จัดหา แยกตามโครงการ ──
  const tab = view;                                      // docs | pending — มาจากเมนูหลัก
  const [pendProj,setPendProj] = React.useState("");    // กรองโครงการในแท็บรอจัดหา
  const pending = React.useMemo(()=>{
    const list = [];
    rows.forEach(doc=>parseItems(doc).forEach((it,idx)=>{
      if(it && it.supplied) return;
      if(!String(it&&it.name||"").trim()) return;
      list.push({doc, it, idx, project: doc.project || "— ไม่ระบุโครงการ —"});
    }));
    return list;
  },[rows]);
  const pendingByProject = React.useMemo(()=>{
    const map = new Map();
    pending.forEach(p=>{ if(!map.has(p.project)) map.set(p.project,[]); map.get(p.project).push(p); });
    return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],"th")).map(([project,list])=>({project,list:list.sort((a,b)=>String(a.doc.docDate||"").localeCompare(String(b.doc.docDate||"")))}));
  },[pending]);
  const daysSince = d => { const t=new Date(d); if(!d||isNaN(t)) return null; const n=new Date(); n.setHours(0,0,0,0); t.setHours(0,0,0,0); return Math.max(0,Math.round((n-t)/86400000)); };
  // จัดหาแล้ว — ถามจำนวนที่จัดหาได้ · ได้ไม่ครบ = ยังค้างส่วนที่เหลือ (จัดหาหลายรอบได้ เก็บประวัติทุกรอบ)
  const reqQty = it => { const n = parseFloat(String(it.qty||"").replace(/,/g,"")); return isNaN(n) ? null : n; };
  const remainOf = it => { const r = reqQty(it); return r==null ? null : Math.max(0, r - (Number(it.suppliedQty)||0)); };
  const setSupplied = async (doc, idx) => {
    const it = parseItems(doc)[idx] || {};
    const remain = remainOf(it);
    const esc = v => String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
    const res = await Swal.fire({
      title:"บันทึกการจัดหา",
      html:`<div style="text-align:left;font-size:14px;display:grid;gap:10px">
        <div><b>${esc(it.name)}</b><div style="font-size:12.5px;color:#64748B">ขอเบิก ${esc(it.qty||"-")} ${esc(it.unit||"")}${Number(it.suppliedQty)?` · จัดหาไปแล้ว ${esc(it.suppliedQty)} · ค้าง ${esc(remain)}`:""}</div></div>
        <label>จัดหาได้จำนวน (${esc(it.unit||"หน่วย")})<input id="sp-qty" type="number" min="0" step="any" class="swal2-input" style="margin:4px 0 0;width:100%" value="${remain==null?"":esc(remain)}"></label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <label>ราคาต่อหน่วย (บาท)<input id="sp-price" type="number" min="0" step="any" class="swal2-input" style="margin:4px 0 0;width:100%" value="${it.unitPrice?esc(it.unitPrice):""}" placeholder="0.00"></label>
          <label>จำนวนเงิน (บาท)<input id="sp-amount" type="number" min="0" step="any" class="swal2-input" style="margin:4px 0 0;width:100%" placeholder="คำนวณให้อัตโนมัติ"></label>
        </div>
        <label>วันที่<input id="sp-date" type="date" class="swal2-input" style="margin:4px 0 0;width:100%" value="${window.__DATA.fmtDate(new Date())}"></label>
        <label>หมายเหตุ (เช่น ซื้อจากร้าน, เลขที่ PO)<input id="sp-note" class="swal2-input" style="margin:4px 0 0;width:100%"></label>
        ${doc.project
          ? `<label style="display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:#ECFEFF;border:1px solid #A5F3FC;border-radius:8px;cursor:pointer"><input id="sp-stock" type="checkbox" checked style="margin-top:3px;width:16px;height:16px"><span>ส่งของเข้า <b>สต๊อกหน้างาน</b> โครงการ <b>${esc(doc.project)}</b>${doc.department&&doc.department!==doc.project?` (${esc(doc.department)})`:""}<br><span style="font-size:12px;color:#64748B">ถ้ายังไม่มีรายการนี้ในคลังของโครงการ ระบบจะสร้างให้</span></span></label>`
          : `<div style="font-size:12.5px;color:#B45309">ใบเบิกนี้ไม่ได้ระบุโครงการ — จะไม่ส่งเข้าสต๊อกหน้างาน</div>`}
      </div>`,
      showCancelButton:true, confirmButtonText:"บันทึก", cancelButtonText:"ยกเลิก", confirmButtonColor:"#1E40AF",
      didOpen:()=>{
        // จำนวน × ราคาต่อหน่วย = จำนวนเงิน (ถ้าพิมพ์จำนวนเงินเอง จะไม่ทับ)
        const q=document.getElementById("sp-qty"), pr=document.getElementById("sp-price"), am=document.getElementById("sp-amount");
        let manual = false;
        const calc = ()=>{ if(manual) return; const v=(Number(q.value)||0)*(Number(pr.value)||0); am.value = v ? String(Math.round(v*100)/100) : ""; };
        q.addEventListener("input",calc); pr.addEventListener("input",calc);
        am.addEventListener("input",()=>{ manual = am.value!==""; });
        calc();
      },
      preConfirm:()=>{
        const q = Number(document.getElementById("sp-qty").value);
        if(!(q>0)){ Swal.showValidationMessage("กรอกจำนวนที่จัดหาได้"); return false; }
        const price = Number(document.getElementById("sp-price").value)||0;
        const amount = Number(document.getElementById("sp-amount").value) || Math.round(q*price*100)/100;
        const st = document.getElementById("sp-stock");
        return { qty:q, price, amount, toStock: !!(st && st.checked), date:document.getElementById("sp-date").value || window.__DATA.fmtDate(new Date()), note:document.getElementById("sp-note").value.trim() };
      },
    });
    if(!res.isConfirmed) return;
    const v = res.value;
    const total = (Number(it.suppliedQty)||0) + v.qty;
    const r = reqQty(it);
    const done = r==null || total >= r;                 // จำนวนที่ขอไม่ใช่ตัวเลข = ถือว่าครบในรอบเดียว
    // ส่งเข้าสต๊อกหน้างานก่อน — ถ้าไม่สำเร็จ ให้ผู้ใช้เลือกว่าจะบันทึกจัดหาต่อโดยไม่เข้าสต๊อกหรือไม่
    let stockRes = null;
    if(v.toStock && doc.project){
      try{
        Swal.fire({title:"กำลังส่งของเข้าสต๊อกหน้างาน...",allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
        stockRes = await window.api("receiveToStock",{ project:doc.project, name:it.name, unit:it.unit, qty:v.qty, date:v.date,
          ref:doc.docNo||"", receiver:"จัดซื้อ/จัดหา", note:[`จากใบเบิก ${doc.docNo||""}`, v.note].filter(Boolean).join(" · "), by:user.name||"", byId:user.id });
        window.__DATA.siteStock = null;   // ให้หน้าสต๊อกหน้างานโหลดยอดใหม่
        Swal.close();
      }catch(err){
        const { isConfirmed } = await Swal.fire({icon:"warning",title:"ส่งเข้าสต๊อกหน้างานไม่สำเร็จ",text:(err.message||String(err))+" · บันทึกการจัดหาต่อโดยไม่เข้าสต๊อกหรือไม่?",
          showCancelButton:true,confirmButtonText:"บันทึกต่อ",cancelButtonText:"ยกเลิก",confirmButtonColor:"#1E40AF"});
        if(!isConfirmed) return;
      }
    }
    const log = [...(Array.isArray(it.supplyLog)?it.supplyLog:[]), { qty:v.qty, price:v.price, amount:v.amount, date:v.date, note:v.note, by:user.name||"",
      toStock: !!stockRes, stockItemKey: stockRes ? stockRes.itemKey : "", stockMoveKey: stockRes && stockRes.move ? stockRes.move.key : "" }];
    const amountTotal = log.reduce((sum,l)=>sum+(Number(l.amount)||0),0);
    const items = parseItems(doc).map((x,i)=>i!==idx?x:{...x, suppliedQty:total, supplyLog:log, supplied:done,
      unitPrice: v.price || x.unitPrice || "", amount: amountTotal ? Math.round(amountTotal*100)/100 : (x.amount||""),
      suppliedAt: done ? v.date : (x.suppliedAt||""), suppliedBy: done ? (user.name||"") : (x.suppliedBy||"")});
    try{
      await window.api("upsertWithdrawal",{key:doc.key, doc:{...doc, items}});
      const upd = rows.map(x=>x.key===doc.key?{...x,items}:x);
      setRows(upd); window.__DATA.withdrawals = upd;
      Swal.fire({icon:"success",title:done?"จัดหาครบแล้ว":`บันทึกแล้ว · ยังค้าง ${(r-total).toLocaleString("th-TH")} ${it.unit||""}`,
        text: stockRes ? `ส่งเข้าสต๊อกหน้างาน ${doc.project} แล้ว · คงเหลือ ${Number(stockRes.balance).toLocaleString("th-TH")} ${it.unit||""}${stockRes.createdItem?" (สร้างรายการใหม่)":""}` : "",
        timer:2600,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };
  const supplyCount = doc => { const it=parseItems(doc).filter(x=>String(x&&x.name||"").trim()); return {done:it.filter(x=>x.supplied).length,total:it.length}; };

  const filtered = rows.filter(x=>!q || [x.docNo,x.docDate,x.project,x.department,x.requester].join(" ").toLowerCase().includes(q.toLowerCase()));
  const tabBar = tab==="pending" && pendingByProject.length>0 ? (
    <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",padding:"0 16px 12px"}}>
      <select value={pendProj} onChange={e=>setPendProj(e.target.value)} style={{maxWidth:260}}>
        <option value="">ทุกโครงการ ({pendingByProject.length})</option>
        {pendingByProject.map(g=><option key={g.project} value={g.project}>{g.project} ({g.list.length})</option>)}
      </select>
    </div>
  ) : null;
  if(tab==="pending") return <><div className="card"><div className="filters" style={{paddingBottom:6}}><div style={{fontWeight:600,fontSize:14}}><i className="fa-solid fa-cart-shopping" style={{color:"#D97706",marginRight:8}}></i>รายการที่ยังไม่ได้ซื้อ/จัดหา</div><div className="spacer"></div><div style={{fontSize:13,color:"var(--muted)",alignSelf:"center"}}>รวม {pending.length.toLocaleString("th-TH")} รายการ · {pendingByProject.length} โครงการ</div></div>{tabBar}
    {pendingByProject.length===0 ? <div className="empty" style={{padding:30}}><i className="fa-solid fa-circle-check" style={{color:"#10B981"}}></i><div className="t">ไม่มีรายการค้างจัดหา</div><div>ทุกรายการในใบเบิกถูกจัดหาครบแล้ว</div></div> :
    pendingByProject.filter(g=>!pendProj||g.project===pendProj).map(g=>(
      <div key={g.project} style={{padding:"0 16px 16px"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderTop:"2px solid var(--line)",fontWeight:600,fontSize:13.5}}>
          {g.project.startsWith("—") ? g.project : <ProjectLabel name={g.project}/>}
          <span style={{fontWeight:400,color:"var(--muted)",fontSize:12.5}}>{g.list.length.toLocaleString("th-TH")} รายการรอจัดหา</span>
        </div>
        <div className="table-wrap"><table className="data"><thead><tr><th>รายการ</th><th>จำนวน</th><th>เลขที่ใบเบิก</th><th className="hide-on-mobile">วันที่ขอ</th><th className="hide-on-mobile">ผู้เบิก</th><th>รอมาแล้ว</th>{canEdit&&<th></th>}</tr></thead><tbody>
          {g.list.map(p=>{ const age=daysSince(p.doc.docDate); return (
            <tr key={p.doc.key+":"+p.idx}>
              <td><div className="cell-title">{p.it.name}</div>{p.it.remark&&<div style={{fontSize:12,color:"var(--muted)"}}>{p.it.remark}</div>}</td>
              <td style={{whiteSpace:"nowrap"}}>{p.it.qty||"-"} {p.it.unit||""}
                {Number(p.it.suppliedQty)>0 && <div style={{fontSize:11.5,fontWeight:600,color:"#B45309"}} title={(p.it.supplyLog||[]).map(l=>`${l.date} จัดหา ${l.qty}${l.price?` @${l.price}`:""}${l.amount?` = ${l.amount} บ.`:""} โดย ${l.by}${l.note?" ("+l.note+")":""}`).join(" | ")}>จัดหาแล้ว {Number(p.it.suppliedQty).toLocaleString("th-TH")} · ค้าง {remainOf(p.it)==null?"-":remainOf(p.it).toLocaleString("th-TH")}{Number(p.it.amount)>0&&<> · {Number(p.it.amount).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2})} บ.</>}</div>}</td>
              <td><span className="ticket-id">{p.doc.docNo||"-"}</span></td>
              <td className="hide-on-mobile">{p.doc.docDate||"-"}</td>
              <td className="hide-on-mobile">{p.doc.requester||"-"}</td>
              <td style={{whiteSpace:"nowrap",color:age>14?"#B91C1C":age>7?"#B45309":"inherit",fontWeight:age>7?600:400}}>{age==null?"-":`${age} วัน`}</td>
              {canEdit&&<td><button className="btn btn-sm btn-primary" onClick={()=>setSupplied(p.doc,p.idx)}><i className="fa-solid fa-check"></i> จัดหาแล้ว</button></td>}
            </tr>); })}
        </tbody></table></div>
      </div>
    ))}
  </div></>;
  return <><div className="card"><div className="filters"><div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหาเลขที่ใบเบิก / โครงการ / หน่วยงาน..." /></div><div className="spacer"></div>{canEdit&&<button className="btn btn-primary" onClick={()=>setEdit({docNo:"",docDate:window.__DATA.fmtDate(new Date()),project:"",department:"",requester:user.name||"",items:[{name:"",qty:"",unit:"",remark:""}],note:""})}><i className="fa-solid fa-plus"></i> เพิ่มรายการเบิก</button>}</div>{tabBar}<div className="table-wrap"><table className="data"><thead><tr><th>เลขที่</th><th>วันที่</th><th>หน่วยงาน/โครงการ</th><th>ผู้เบิก</th><th>รายการ</th><th>จัดหาแล้ว</th><th>PDF</th><th></th></tr></thead><tbody>{filtered.map(doc=>{ const sc=supplyCount(doc); return <tr key={doc.key||doc.docNo}><td><span className="ticket-id">{doc.docNo||"-"}</span></td><td>{doc.docDate||"-"}</td><td>{doc.project||doc.department||"-"}{doc.department&&doc.project&&doc.department!==doc.project&&<div style={{fontSize:12,color:"var(--muted)"}}>{doc.department}</div>}</td><td>{doc.requester||"-"}</td><td>{parseItems(doc).length.toLocaleString("th-TH")}</td><td><span className="badge" style={sc.total&&sc.done===sc.total?{background:"#DCFCE7",color:"#166534"}:sc.done?{background:"#FEF3C7",color:"#92400E"}:{background:"#FEE2E2",color:"#B91C1C"}}>{sc.done}/{sc.total}</span></td><td><button className="btn btn-sm btn-ghost" onClick={()=>downloadPdf(doc)}><i className="fa-solid fa-file-pdf"></i> PDF</button></td><td>{canEdit&&<div className="row-actions"><button className="ia" onClick={()=>setEdit(doc)}><i className="fa-solid fa-pen"></i></button><button className="ia danger" onClick={()=>remove(doc)}><i className="fa-solid fa-trash"></i></button></div>}</td></tr>; })}{filtered.length===0&&<tr><td colSpan="8"><div className="empty"><i className="fa-solid fa-file-invoice"></i><div className="t">ยังไม่มีรายการเบิกของ</div><div>กดเพิ่มรายการเบิกเพื่อเริ่มต้น</div></div></td></tr>}</tbody></table></div></div>{edit&&<WithdrawalForm initial={edit} user={user} rows={rows} onClose={()=>setEdit(null)} onSave={save}/>}</>;
}

// จำนวนรายการในใบเบิกที่ยังไม่ได้ซื้อ/จัดหา — ใช้ทำตัวเลขที่เมนู
window.withdrawalPendingCount = function(){
  let n = 0;
  (window.__DATA.withdrawals||[]).forEach(doc=>(Array.isArray(doc.items)?doc.items:[]).forEach(it=>{ if(it && !it.supplied && String(it.name||"").trim()) n++; }));
  return n;
};

// เลขที่ใบเบิกอัตโนมัติ: PR-<รหัสโครงการ>-<ปีพ.ศ.><เดือน>/<ลำดับ> — นับต่อกันในโครงการเดียวกัน เดือนเดียวกัน
window.nextWithdrawalNo = function(project, docDate, rows){
  if(!project) return "";
  const code = String(window.getProjectCode(project)||project).trim().replace(/\s+/g,"-").toUpperCase();
  const d = docDate ? new Date(docDate) : new Date();
  const dt = isNaN(d) ? new Date() : d;
  const prefix = "PR-"+code+"-"+String(dt.getFullYear()+543)+String(dt.getMonth()+1).padStart(2,"0")+"/";
  let max = 0;
  (rows||window.__DATA.withdrawals||[]).forEach(x=>{
    const t = String(x.docNo||"");
    if(t.slice(0,prefix.length)===prefix){ const n=parseInt(t.slice(prefix.length),10); if(!isNaN(n)&&n>max) max=n; }
  });
  return prefix+String(max+1).padStart(3,"0");
};

function WithdrawalForm({initial,user,rows,onClose,onSave}){
  const isNew = !initial.key;
  const [f,setF] = React.useState(initial);
  const [autoNo,setAutoNo] = React.useState(isNew);   // ยังไม่ได้พิมพ์เลขเอง = ออกเลขให้อัตโนมัติ
  const [items,setItems] = React.useState(()=>Array.isArray(initial.items)&&initial.items.length?initial.items:[{name:"",qty:"",unit:"",remark:""}]);
  const projects = React.useMemo(()=>window.visibleProjects(user),[user]);
  const projOptions = (cur) => {
    const list = projects.map(p=>({value:p.name,label:(p.code?`[${p.code}] `:"")+p.name}));
    if(cur && !list.some(o=>o.value===cur)) list.unshift({value:cur,label:cur+" (ข้อมูลเดิม)"});
    return list;
  };
  React.useEffect(()=>{
    if(!autoNo) return;
    setF(p=>({...p, docNo: window.nextWithdrawalNo(p.project, p.docDate, rows)}));
  },[autoNo, f.project, f.docDate]);
  const up = (k,v)=>setF(p=>({...p,[k]:v}));
  const setProject = v => setF(p=>({...p, project:v, department:(!p.department||p.department===p.project)?v:p.department}));
  const upItem = (i,k,v)=>setItems(prev=>prev.map((x,idx)=>idx===i?{...x,[k]:v}:x));
  // ผู้เบิก = ผู้ใช้งานในระบบ (คงชื่อเดิมไว้ถ้าใบเก่าใช้ชื่อที่ไม่มีในรายชื่อ)
  const userOpts = (cur) => {
    const names = [...new Set((window.__DATA.users||[]).map(u=>String(u.name||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"th"));
    if(cur && !names.includes(cur)) names.unshift(cur);
    return names;
  };
  // ชื่อรายการที่เคยเบิก (จากใบเบิกเดิม + ของในสต๊อกหน้างาน) — ช่วยให้พิมพ์ชื่อตรงกัน และเติมหน่วยให้
  const knownItems = React.useMemo(()=>{
    const map = new Map();
    const add = (name, unit) => {
      const n = String(name||"").trim(); if(!n) return;
      const k = n.toLowerCase();
      const cur = map.get(k) || {name:n, unit:"", count:0};
      cur.count++; if(!cur.unit && unit) cur.unit = String(unit).trim();
      map.set(k, cur);
    };
    (rows||window.__DATA.withdrawals||[]).forEach(d=>(Array.isArray(d.items)?d.items:[]).forEach(it=>add(it&&it.name, it&&it.unit)));
    ((window.__DATA.siteStock&&window.__DATA.siteStock.items)||[]).forEach(it=>add(it.name, it.unit));
    return [...map.values()].sort((a,b)=>b.count-a.count || a.name.localeCompare(b.name,"th"));
  },[rows]);
  const pickName = (i, v) => setItems(prev=>prev.map((x,idx)=>{
    if(idx!==i) return x;
    const hit = knownItems.find(k=>k.name===v);
    return {...x, name:v, unit: (hit && hit.unit && !String(x.unit||"").trim()) ? hit.unit : x.unit};
  }));
  const addItem = ()=>setItems(prev=>[...prev,{name:"",qty:"",unit:"",remark:""}]);
  const removeItem = i=>setItems(prev=>prev.length<=1?[{name:"",qty:"",unit:"",remark:""}]:prev.filter((_,idx)=>idx!==i));
  const cleanItems = items.map(x=>({...x,name:String(x.name||"").trim(),qty:String(x.qty||"").trim(),unit:String(x.unit||"").trim(),remark:String(x.remark||"").trim()})).filter(x=>x.name||x.qty||x.unit||x.remark);
  const submit = e => { e&&e.preventDefault&&e.preventDefault();
    if(!f.project){ Swal.fire({icon:"warning",title:"เลือกโครงการก่อน"}); return; }
    if(!String(f.docNo||"").trim()){ Swal.fire({icon:"warning",title:"กรอกเลขที่ใบเบิกก่อน"}); return; }
    if(!cleanItems.length){ Swal.fire({icon:"warning",title:"เพิ่มรายการอย่างน้อย 1 รายการ"}); return; }
    onSave({...f,docNo:String(f.docNo).trim(),items:cleanItems}); };
  return <Modal open={true} onClose={onClose} size="xl" title={<><i className="fa-solid fa-file-invoice" style={{marginRight:8,color:"var(--primary)"}}></i>{f.key?"แก้ไขรายการเบิก":"เพิ่มรายการเบิก"}</>} footer={<><button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button><button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-floppy-disk"></i> บันทึก</button></>}><form onSubmit={submit}><div className="form-grid">
    <div className="form-field"><label>โครงการ *</label><select value={f.project||""} onChange={e=>setProject(e.target.value)}><option value="">— เลือกโครงการ —</option>{projOptions(f.project).map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select>{projects.length===0&&<div style={{fontSize:12,color:"#92400E",marginTop:4}}>ยังไม่มีโครงการ — เพิ่มที่ ระบบการจัดการ → โครงการ</div>}</div>
    <div className="form-field"><label>หน่วยงาน</label><select value={f.department||""} onChange={e=>up("department",e.target.value)}><option value="">— เลือกหน่วยงาน —</option>{projOptions(f.department).map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select></div>
    <div className="form-field"><label>เลขที่ใบเบิก * {autoNo?<span style={{fontWeight:400,fontSize:11.5,color:"#047857"}}><i className="fa-solid fa-wand-magic-sparkles"></i> ออกเลขอัตโนมัติตามโครงการ</span>:(isNew&&<button type="button" onClick={()=>setAutoNo(true)} style={{border:"none",background:"none",color:"var(--primary)",fontSize:11.5,cursor:"pointer",padding:0}}><i className="fa-solid fa-rotate"></i> กลับไปใช้เลขอัตโนมัติ</button>)}</label><input className="mono" value={f.docNo||""} onChange={e=>{ setAutoNo(false); up("docNo",e.target.value); }} placeholder={f.project?"":"เลือกโครงการก่อน ระบบจะออกเลขให้"} /></div>
    <div className="form-field"><label>วันที่</label><input type="date" value={f.docDate||""} onChange={e=>up("docDate",e.target.value)} /></div>
    <div className="form-field"><label>ผู้เบิก</label><select value={f.requester||""} onChange={e=>up("requester",e.target.value)}><option value="">— เลือกผู้เบิก —</option>{userOpts(f.requester).map(n=><option key={n} value={n}>{n}</option>)}</select></div>
    <div className="form-field" style={{gridColumn:"1/-1"}}><label>รายการเบิก</label><div className="table-wrap" style={{border:"1px solid var(--line)",borderRadius:10,overflow:"hidden"}}><table className="data"><thead><tr><th style={{width:44}}>#</th><th>ชื่อรายการ</th><th style={{width:120}}>จำนวน</th><th style={{width:120}}>หน่วย</th><th>หมายเหตุ</th><th style={{width:48}}></th></tr></thead><tbody>{items.map((item,idx)=><tr key={idx}><td style={{textAlign:"center"}}>{idx+1}</td><td><input value={item.name||""} list="wd-item-names" onChange={e=>pickName(idx,e.target.value)} placeholder="พิมพ์เพื่อค้นหารายการที่เคยเบิก" /></td><td><input value={item.qty||""} onChange={e=>upItem(idx,"qty",e.target.value)} /></td><td><input value={item.unit||""} onChange={e=>upItem(idx,"unit",e.target.value)} /></td><td><input value={item.remark||""} onChange={e=>upItem(idx,"remark",e.target.value)} /></td><td><button type="button" className="ia danger" onClick={()=>removeItem(idx)}><i className="fa-solid fa-trash"></i></button></td></tr>)}</tbody></table></div><datalist id="wd-item-names">{knownItems.map(k=><option key={k.name} value={k.name}>{k.unit?`หน่วย: ${k.unit}`:""}{k.count>1?` · เบิกแล้ว ${k.count} ครั้ง`:""}</option>)}</datalist><button type="button" className="btn btn-ghost btn-sm" style={{marginTop:10}} onClick={addItem}><i className="fa-solid fa-plus"></i> เพิ่มแถวรายการ</button>{knownItems.length>0&&<span style={{fontSize:11.5,color:"var(--muted)",marginLeft:10}}>ชื่อรายการมีตัวเลือกจากที่เคยเบิก {knownItems.length.toLocaleString("th-TH")} รายการ · เลือกแล้วเติมหน่วยให้อัตโนมัติ</span>}</div>
    <div className="form-field" style={{gridColumn:"1/-1"}}><label>หมายเหตุ</label><textarea rows="3" value={f.note||""} onChange={e=>up("note",e.target.value)}></textarea></div></div><div className="withdrawal-preview-title"><span><i className="fa-solid fa-file-lines" style={{color:"var(--primary)",marginRight:8}}></i>แบบฟอร์มใบเบิกที่จะออกเป็น PDF</span><span style={{fontSize:12,color:"var(--muted)",fontWeight:400}}>24 แถวต่อหน้า</span></div><WithdrawalPaperPreview doc={f} items={items}/></form></Modal>;
}

// ═══ สต๊อก/เบิกจ่ายหน้างาน (Consume) ═════════════════════════════════════
// หน้างานรับของเข้าและเบิกจ่ายเอง · ยอดคงเหลือแยกตามโครงการ · ทุกการเคลื่อนไหวเก็บประวัติ
const STOCK_MANAGE_ROLES = ["Admin","Director","Officer","Engineer"];   // แก้ไข/ลบรายการ และปรับยอด (เพิ่มรายการใหม่ ทุกคนที่เข้าหน้านี้ทำได้)
const STOCK_IMPORT_COLS = ["โครงการ","ไซต์งานย่อย","รหัส","รายการ","หมวด","หน่วย","ขั้นต่ำ","ยอดยกมา","ที่เก็บ","หมายเหตุ"];
const STOCK_TYPE = {
  in:     {label:"รับเข้า",  color:"#047857", bg:"#DCFCE7", icon:"fa-arrow-down", sign:"+"},
  out:    {label:"เบิกจ่าย", color:"#B91C1C", bg:"#FEE2E2", icon:"fa-arrow-up",   sign:"−"},
  adjust: {label:"ปรับยอด",  color:"#6D28D9", bg:"#EDE9FE", icon:"fa-scale-balanced", sign:"±"},
};
// เลขที่ใบรับ/ใบเบิกหน้างาน: SI- (รับเข้า) / SO- (เบิกจ่าย) -<รหัสโครงการ>-<ปีพ.ศ.><เดือน>/<ลำดับ>
const nextStockRef = (type, project, moves) => {
  const code = String(window.getProjectCode(project)||project||"").trim().replace(/\s+/g,"-").toUpperCase();
  const d = new Date();
  const prefix = (type==="in"?"SI":"SO")+"-"+code+"-"+String(d.getFullYear()+543)+String(d.getMonth()+1).padStart(2,"0")+"/";
  let max = 0;
  (moves||[]).forEach(m=>{ const t=String(m.ref||""); if(t.slice(0,prefix.length)===prefix){ const n=parseInt(t.slice(prefix.length),10); if(!isNaN(n)&&n>max) max=n; } });
  return prefix+String(max+1).padStart(3,"0");
};
const fmtQty = n => (Number(n)||0).toLocaleString("th-TH",{maximumFractionDigits:2});

function SiteStock({user}){
  const role = window.effectiveRole ? window.effectiveRole(user) : user.role;
  const canManage = STOCK_MANAGE_ROLES.includes(role);
  const [data,setData] = React.useState(()=>window.__DATA.siteStock || null);   // {items, moves}
  const [err,setErr] = React.useState("");
  const [tab,setTab] = React.useState("stock");   // stock | moves
  const [project,setProject] = React.useState("");
  const [q,setQ] = React.useState("");
  const [lowOnly,setLowOnly] = React.useState(false);
  const [typeF,setTypeF] = React.useState("");
  const [editItem,setEditItem] = React.useState(null);
  const [move,setMove] = React.useState(null);     // {type, project, lines:[{itemKey,qty}]}
  const [newItemKey,setNewItemKey] = React.useState(null);  // {keys:[...]} รายการที่เพิ่งสร้างจากหน้ารับเข้า — ให้ฟอร์มรับเข้าเติมบรรทัดให้
  const importRef = React.useRef(null);

  const load = React.useCallback(()=>{
    setErr("");
    window.api("loadStock").then(d=>{ window.__DATA.siteStock = d; setData(d); }).catch(e=>setErr(e.message||String(e)));
  },[]);
  React.useEffect(()=>{ if(!data) load(); },[]);
  const commit = (fn) => setData(prev=>{ const next = fn(prev); window.__DATA.siteStock = next; return next; });

  const projects = React.useMemo(()=>window.visibleProjects(user),[user]);
  const items = React.useMemo(()=>window.filterByUserProjects(user, (data&&data.items)||[], "project"),[data,user]);
  const moves = React.useMemo(()=>window.filterByUserProjects(user, (data&&data.moves)||[], "project")
    .slice().sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||""))),[data,user]);
  const projOpts = React.useMemo(()=>{
    const names = projects.map(p=>p.name);
    items.forEach(i=>{ if(i.project && !names.includes(i.project)) names.push(i.project); });
    return names;
  },[projects,items]);
  const isLow = i => (Number(i.minQty)||0)>0 && (Number(i.qty)||0) <= (Number(i.minQty)||0);

  const kw = q.trim().toLowerCase();
  const shownItems = items.filter(i=>(!project||i.project===project) && (!lowOnly||isLow(i))
    && (!kw || [i.code,i.name,i.category,i.location,i.subSite].some(v=>String(v||"").toLowerCase().includes(kw))))
    .sort((a,b)=>String(a.project||"").localeCompare(String(b.project||""),"th") || String(a.name||"").localeCompare(String(b.name||""),"th",{numeric:true}));
  const shownMoves = moves.filter(m=>(!project||m.project===project) && (!typeF||m.type===typeF)
    && (!kw || [m.itemName,m.itemCode,m.ref,m.receiver,m.purpose,m.by,m.note].some(v=>String(v||"").toLowerCase().includes(kw))));
  const lowCount = items.filter(i=>(!project||i.project===project) && isLow(i)).length;
  const thisMonth = window.__DATA.fmtDate(new Date()).slice(0,7);
  const monthCount = (type) => moves.filter(m=>m.type===type && (!project||m.project===project) && String(m.date||"").slice(0,7)===thisMonth).length;

  // forms = รายการเดียว (แก้ไข) หรือหลายรายการ (เพิ่มใหม่ทีละหลายบรรทัด)
  const saveItem = async (forms) => {
    const list = Array.isArray(forms) ? forms : [forms];
    const created = [], fail = [];
    for(const form of list){
      try{
        const res = await window.api("saveStockItem",{item:form, by:user.name, byId:user.id});
        commit(prev=>({
          items: (prev.items||[]).some(x=>x.key===res.item.key) ? prev.items.map(x=>x.key===res.item.key?res.item:x) : [...(prev.items||[]), res.item],
          moves: res.move ? [...(prev.moves||[]), res.move] : (prev.moves||[]),
        }));
        if(!form.key) created.push(res.item.key);
      }catch(e){ fail.push(`${form.name||"-"}: ${e.message}`); }
    }
    if(created.length && editItem && editItem.fromMove) setNewItemKey({keys:created});
    if(fail.length){
      Swal.fire({icon:created.length?"warning":"error",title:created.length?`เพิ่มแล้ว ${created.length} รายการ · ไม่สำเร็จ ${fail.length}`:"บันทึกไม่สำเร็จ",
        html:"<div style='text-align:left;font-size:13px'>"+fail.map(x=>"• "+String(x).replace(/</g,"&lt;")).join("<br/>")+"</div>",confirmButtonColor:"#1E40AF"});
      if(!created.length) return;
    }
    setEditItem(null);
    if(!fail.length) Swal.fire({icon:"success",title:list[0].key?"บันทึกการแก้ไขแล้ว":`เพิ่มรายการแล้ว ${created.length} รายการ`,timer:1300,showConfirmButton:false,toast:true,position:"top-end"});
  };

  // ── นำเข้ารายการจาก Excel (หลายรายการในครั้งเดียว) ──
  const downloadTemplate = async () => {
    try{
      const XLSX = await ensureXLSX();
      const ws = XLSX.utils.aoa_to_sheet([STOCK_IMPORT_COLS, [project||projOpts[0]||"ชื่อโครงการ","","OIL-68","น้ำมันไฮดรอลิก 68","น้ำมัน","ลิตร",20,100,"ตู้คอนเทนเนอร์ 1",""]]);
      ws["!cols"] = STOCK_IMPORT_COLS.map(c=>({wch:Math.max(12,c.length+6)}));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "รายการสต๊อก");
      XLSX.writeFile(wb, "แบบฟอร์มนำเข้าสต๊อกหน้างาน.xlsx");
    }catch(e){ Swal.fire({icon:"error",title:"สร้างไฟล์ไม่สำเร็จ",text:e.message}); }
  };
  const importExcel = async (file) => {
    if(!file) return;
    try{
      const XLSX = await ensureXLSX();
      const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
      const txt = v => String(v==null?"":v).trim();
      const rowsIn = raw.map((r,i)=>({line:i+2, project:txt(r["โครงการ"]), subSite:txt(r["ไซต์งานย่อย"]), code:txt(r["รหัส"]), name:txt(r["รายการ"]),
        category:txt(r["หมวด"]), unit:txt(r["หน่วย"]), minQty:Number(r["ขั้นต่ำ"])||0, qty:Number(r["ยอดยกมา"])||0, location:txt(r["ที่เก็บ"]), note:txt(r["หมายเหตุ"])}))
        .filter(r=>r.name||r.project);
      if(!rowsIn.length){ Swal.fire({icon:"info",title:"ไม่พบข้อมูลในไฟล์",text:"ใช้หัวคอลัมน์ตามแบบฟอร์ม: "+STOCK_IMPORT_COLS.join(", ")}); return; }
      const same = (a,b) => a.project===b.project && String(a.name||"").trim().toLowerCase()===String(b.name||"").trim().toLowerCase() && String(a.code||"")===String(b.code||"");
      const bad = [], dup = [], good = [];
      rowsIn.forEach(r=>{
        if(!r.project || !r.name || !r.unit) bad.push(`แถว ${r.line}: ต้องมี โครงการ, รายการ, หน่วย`);
        else if(!projOpts.includes(r.project)) bad.push(`แถว ${r.line}: ไม่พบโครงการ "${r.project}" หรือไม่มีสิทธิ์`);
        else if(items.some(x=>same(x,r)) || good.some(x=>same(x,r))) dup.push(`แถว ${r.line}: ${r.name} มีอยู่แล้วใน ${r.project}`);
        else good.push(r);
      });
      const esc = v => String(v).replace(/</g,"&lt;");
      const { isConfirmed } = await Swal.fire({
        title:`นำเข้า ${good.length} รายการ?`, icon: good.length?"question":"warning",
        html:`<div style="text-align:left;font-size:13px">พร้อมนำเข้า <b>${good.length}</b> รายการ`+(dup.length?`<br/>ข้าม (มีอยู่แล้ว) ${dup.length} รายการ`:"")+((bad.length||dup.length)?`<div style="max-height:140px;overflow:auto;margin-top:6px;color:#B91C1C">${bad.concat(dup).slice(0,30).map(x=>"• "+esc(x)).join("<br/>")}</div>`:"")+`</div>`,
        showCancelButton:true, confirmButtonText:"นำเข้า", cancelButtonText:"ยกเลิก", confirmButtonColor:"#1E40AF", showConfirmButton: good.length>0,
      });
      if(!isConfirmed || !good.length) return;
      let ok = 0; const fail = [];
      for(let i=0;i<good.length;i++){
        Swal.fire({title:`กำลังนำเข้า ${i+1}/${good.length}...`,allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
        const {line, ...item} = good[i];
        try{
          const res = await window.api("saveStockItem",{item, by:user.name, byId:user.id});
          ok++;
          commit(prev=>({ items:[...(prev.items||[]), res.item], moves: res.move ? [...(prev.moves||[]), res.move] : (prev.moves||[]) }));
        }catch(e){ fail.push(`แถว ${line}: ${e.message}`); }
      }
      Swal.fire({icon:fail.length?"warning":"success",title:`นำเข้าแล้ว ${ok} รายการ`+(fail.length?` · ไม่สำเร็จ ${fail.length}`:""),
        html:fail.length?"<div style='text-align:left;font-size:13px'>"+fail.map(x=>"• "+esc(x)).join("<br/>")+"</div>":"",confirmButtonColor:"#1E40AF"});
    }catch(e){ Swal.fire({icon:"error",title:"อ่านไฟล์ไม่สำเร็จ",text:e.message}); }
  };
  const removeItem = async (it) => {
    const done = await window.deleteWithApproval({
      user, action:"deleteStockItem", payload:{key:it.key},
      entityLabel:"รายการสต๊อกหน้างาน", targetName:`${it.code?it.code+" ":""}${it.name||""}`.trim(), project:it.project||"",
      targetInfo:`คงเหลือ ${fmtQty(it.qty)} ${it.unit||""}`,
    });
    if(done) commit(prev=>({...prev, items:(prev.items||[]).filter(x=>x.key!==it.key)}));
  };
  // บันทึกรับ/เบิก ทีละบรรทัด — บรรทัดที่ไม่ผ่าน (เช่น ของไม่พอ) แจ้งรายการไป ที่เหลือบันทึกตามปกติ
  const saveMove = async (form) => {
    const ok = [], fail = [];
    for(const ln of form.lines){
      try{
        const res = await window.api("stockMove",{itemKey:ln.itemKey, type:form.type, qty:ln.qty, date:form.date, ref:form.ref,
          receiver:form.receiver, purpose:form.purpose, note:form.note, by:user.name, byId:user.id});
        ok.push(res);
        commit(prev=>({ items:(prev.items||[]).map(x=>x.key===ln.itemKey?{...x,qty:res.balance}:x), moves:[...(prev.moves||[]), res.move] }));
      }catch(e){ fail.push(e.message||String(e)); }
    }
    if(fail.length){
      Swal.fire({icon:ok.length?"warning":"error",title:ok.length?`บันทึกแล้ว ${ok.length} รายการ · ไม่สำเร็จ ${fail.length}`:"บันทึกไม่สำเร็จ",
        html:"<div style='text-align:left;font-size:13px'>"+fail.map(x=>"• "+String(x).replace(/</g,"&lt;")).join("<br/>")+"</div>",confirmButtonColor:"#1E40AF"});
      if(ok.length) setMove(null);
      return;
    }
    setMove(null);
    Swal.fire({icon:"success",title:`${STOCK_TYPE[form.type].label}แล้ว ${ok.length} รายการ`,text:form.ref?`เลขที่ ${form.ref}`:"",timer:1600,showConfirmButton:false,toast:true,position:"top-end"});
  };

  const exportExcel = async () => {
    try{
      const XLSX = await ensureXLSX();
      const wb = XLSX.utils.book_new();
      const s1 = shownItems.map((i,n)=>({"ลำดับ":n+1,"โครงการ":i.project||"","ไซต์งานย่อย":i.subSite||"","รหัส":i.code||"","รายการ":i.name||"","หมวด":i.category||"",
        "คงเหลือ":Number(i.qty)||0,"หน่วย":i.unit||"","ขั้นต่ำ":Number(i.minQty)||0,"สถานะ":isLow(i)?"ต่ำกว่าขั้นต่ำ":"","ที่เก็บ":i.location||"","หมายเหตุ":i.note||""}));
      const s2 = shownMoves.map((m,n)=>({"ลำดับ":n+1,"วันที่":m.date||"","ประเภท":(STOCK_TYPE[m.type]||{}).label||m.type,"เลขที่":m.ref||"","โครงการ":m.project||"",
        "รหัส":m.itemCode||"","รายการ":m.itemName||"","จำนวน":Number(m.qty)||0,"หน่วย":m.unit||"","คงเหลือหลังทำรายการ":Number(m.balance)||0,
        "ผู้รับของ / รับจาก":m.receiver||"","ใช้สำหรับ":m.purpose||"","ผู้บันทึก":m.by||"","หมายเหตุ":m.note||""}));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(s1.length?s1:[{"ไม่มีข้อมูล":""}]), "คงคลัง");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(s2.length?s2:[{"ไม่มีข้อมูล":""}]), "ประวัติรับ-เบิก");
      XLSX.writeFile(wb, `สต๊อกหน้างาน_${window.__DATA.fmtDate(new Date()).replace(/-/g,"")}.xlsx`);
    }catch(e){ Swal.fire({icon:"error",title:"ส่งออกไม่สำเร็จ",text:e.message}); }
  };

  if(err) return <div className="card"><div className="card-body"><div className="empty"><i className="fa-solid fa-triangle-exclamation" style={{color:"#EF4444"}}></i><div className="t">โหลดสต๊อกไม่สำเร็จ</div><div>{err}</div><button className="btn btn-primary btn-sm" style={{marginTop:12}} onClick={load}><i className="fa-solid fa-rotate"></i> ลองใหม่</button></div></div></div>;
  if(!data) return <Loading show={true} text="กำลังโหลดสต๊อกหน้างาน..."/>;

  const openMove = (type, it) => setMove({type, project: it ? it.project : (project || projOpts[0] || ""), lines: it ? [{itemKey:it.key, qty:""}] : [{itemKey:"", qty:""}]});
  const totalItems = items.filter(i=>!project||i.project===project).length;

  return (
    <>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:12,marginBottom:16}}>
      {[
        {l:"รายการในคลัง",v:totalItems,i:"fa-boxes-stacked",c:"#1E40AF"},
        {l:"ต่ำกว่าขั้นต่ำ",v:lowCount,i:"fa-triangle-exclamation",c:lowCount?"#DC2626":"#64748B",click:()=>{setTab("stock");setLowOnly(true);}},
        {l:"รับเข้าเดือนนี้ (ครั้ง)",v:monthCount("in"),i:"fa-arrow-down",c:"#047857",click:()=>{setTab("moves");setTypeF("in");}},
        {l:"เบิกจ่ายเดือนนี้ (ครั้ง)",v:monthCount("out"),i:"fa-arrow-up",c:"#B91C1C",click:()=>{setTab("moves");setTypeF("out");}},
      ].map(s=>(
        <div key={s.l} className="card" onClick={s.click} style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:12,cursor:s.click?"pointer":"default",margin:0}}>
          <div style={{width:38,height:38,borderRadius:10,display:"grid",placeItems:"center",background:s.c+"18",color:s.c}}><i className={`fa-solid ${s.i}`}></i></div>
          <div><div style={{fontSize:12,color:"var(--muted)"}}>{s.l}</div><div style={{fontSize:20,fontWeight:600}}>{s.v.toLocaleString("th-TH")}</div></div>
        </div>
      ))}
    </div>
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder={tab==="stock"?"ค้นหารหัส / รายการ / หมวด / ที่เก็บ...":"ค้นหารายการ / เลขที่ / ผู้รับ / ใช้สำหรับ..."} />
        </div>
        <select value={project} onChange={e=>setProject(e.target.value)}>
          <option value="">ทุกโครงการ</option>
          {projOpts.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
        {tab==="moves" && <select value={typeF} onChange={e=>setTypeF(e.target.value)}><option value="">ทุกประเภท</option>{Object.entries(STOCK_TYPE).map(([k,t])=><option key={k} value={k}>{t.label}</option>)}</select>}
        {tab==="stock" && <label style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer"}}><input type="checkbox" checked={lowOnly} onChange={e=>setLowOnly(e.target.checked)}/> เฉพาะต่ำกว่าขั้นต่ำ</label>}
        <div className="spacer"></div>
        <button className="btn btn-ghost" onClick={exportExcel}><i className="fa-solid fa-file-excel" style={{color:"#1D6F42"}}></i> ส่งออก Excel</button>
        <button className="btn btn-ghost" onClick={load} title="โหลดข้อมูลล่าสุด"><i className="fa-solid fa-rotate"></i></button>
        <button className="btn btn-ghost" style={{color:"#047857",border:"1px solid #A7F3D0"}} onClick={()=>openMove("in")}><i className="fa-solid fa-arrow-down"></i> รับเข้า</button>
        <button className="btn btn-primary" onClick={()=>openMove("out")} disabled={!items.length}><i className="fa-solid fa-arrow-up"></i> เบิกจ่าย</button>
        <button className="btn btn-primary" style={{background:"#0E7490",borderColor:"#0E7490"}} onClick={()=>setEditItem({project:project||projOpts[0]||"",subSite:"",code:"",name:"",category:"",unit:"",minQty:"",qty:"",location:"",note:""})}><i className="fa-solid fa-plus"></i> เพิ่มรายการ</button>
        <button className="btn btn-ghost" onClick={()=>importRef.current&&importRef.current.click()} title="เพิ่มหลายรายการจากไฟล์ Excel"><i className="fa-solid fa-file-import" style={{color:"#1D6F42"}}></i> นำเข้า Excel</button>
        <button className="btn btn-ghost btn-sm" onClick={downloadTemplate} title="ดาวน์โหลดแบบฟอร์ม Excel สำหรับนำเข้า"><i className="fa-solid fa-download"></i> แบบฟอร์ม</button>
        <input ref={importRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; importExcel(f); }}/>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",padding:"0 16px 12px"}}>
        <div className="seg" style={{display:"inline-flex",background:"var(--bg)",border:"1px solid var(--line)",borderRadius:10,padding:3}}>
          {[{k:"stock",l:"คงคลัง",i:"fa-warehouse"},{k:"moves",l:"ประวัติรับ-เบิก",i:"fa-clock-rotate-left"}].map(t=>(
            <button key={t.k} onClick={()=>setTab(t.k)}
              style={{padding:"7px 14px",borderRadius:7,border:"none",fontSize:13,cursor:"pointer",fontFamily:"Kanit",
                      background:tab===t.k?"var(--primary)":"transparent",color:tab===t.k?"#fff":"var(--muted)"}}>
              <i className={`fa-solid ${t.i}`}></i> {t.l}
            </button>
          ))}
        </div>
        <span style={{fontSize:13,color:"var(--muted)"}}>{tab==="stock"?`${shownItems.length.toLocaleString("th-TH")} รายการ`:`${shownMoves.length.toLocaleString("th-TH")} ครั้ง`}</span>
      </div>

      {tab==="stock" ? (
        <div className="table-wrap"><table className="data">
          <thead><tr><th>รายการ</th><th>โครงการ</th><th>คงเหลือ</th><th className="hide-on-mobile">ขั้นต่ำ</th><th className="hide-on-mobile">ที่เก็บ</th><th>ทำรายการ</th>{canManage&&<th></th>}</tr></thead>
          <tbody>
            {shownItems.map(i=>{ const low=isLow(i); const empty=(Number(i.qty)||0)<=0; return (
              <tr key={i.key}>
                <td>{i.code&&<span className="ticket-id" style={{marginRight:6}}>{i.code}</span>}<span className="cell-title" style={{display:"inline"}}>{i.name}</span>{i.category&&<div style={{fontSize:12,color:"var(--muted)"}}>{i.category}</div>}</td>
                <td style={{fontSize:13}}>{i.project?<ProjectLabel name={i.project}/>:"—"}{i.subSite&&<div style={{marginTop:3}}><SubSiteTag value={i.subSite} project={i.project}/></div>}</td>
                <td style={{whiteSpace:"nowrap"}}><b style={{fontSize:15,color:empty?"#B91C1C":low?"#B45309":"inherit"}}>{fmtQty(i.qty)}</b> {i.unit||""}
                  {(low||empty) && <div style={{fontSize:11,color:empty?"#B91C1C":"#B45309",fontWeight:600}}><i className="fa-solid fa-triangle-exclamation"></i> {empty?"หมด":"ใกล้หมด"}</div>}</td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{Number(i.minQty)?`${fmtQty(i.minQty)} ${i.unit||""}`:"—"}</td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{i.location||"—"}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button className="btn btn-sm btn-ghost" style={{color:"#047857"}} onClick={()=>openMove("in",i)} title="รับเข้า"><i className="fa-solid fa-arrow-down"></i> รับ</button>{" "}
                  <button className="btn btn-sm btn-ghost" style={{color:"#B91C1C"}} onClick={()=>openMove("out",i)} disabled={empty} title="เบิกจ่าย"><i className="fa-solid fa-arrow-up"></i> เบิก</button>
                </td>
                {canManage && <td><div className="row-actions">
                  <button className="ia" title="ปรับยอดตามที่นับได้จริง" onClick={()=>openMove("adjust",i)} style={{color:"#6D28D9"}}><i className="fa-solid fa-scale-balanced"></i></button>
