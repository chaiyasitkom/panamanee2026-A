  const res = await Swal.fire({
    title:"บันทึกทำ PM แล้ว",
    html:`<div style="text-align:left;font-size:13px;color:#64748B;margin-bottom:8px">${esc(m.code)} · ${esc(m.name)}</div>
      <div style="text-align:left;display:grid;gap:10px;font-size:14px">
      <label>วันที่ทำ PM<input id="pm-date" type="date" class="swal2-input" style="margin:4px 0 0;width:100%" value="${today}"></label>
      <label>ชั่วโมงทำงาน ณ วันที่ทำ PM<input id="pm-hours" type="number" min="0" class="swal2-input" style="margin:4px 0 0;width:100%" value="${esc(m.hours||0)}"></label>
      <label>หมายเหตุ (เช่น เปลี่ยนถ่ายน้ำมันเครื่อง, กรองอากาศ)<input id="pm-note" class="swal2-input" style="margin:4px 0 0;width:100%"></label>
    </div>`,
    showCancelButton:true, confirmButtonText:"บันทึก", cancelButtonText:"ยกเลิก", confirmButtonColor:"#0E7490",
    preConfirm:()=>{
      const date = document.getElementById("pm-date").value;
      if(!date){ Swal.showValidationMessage("กรุณาระบุวันที่"); return false; }
      const hv = document.getElementById("pm-hours").value;
      return { date, hours: hv==="" ? "" : (Number(hv)||0), note: document.getElementById("pm-note").value.trim() };
    },
  });
  if(!res.isConfirmed) return null;
  const v = res.value;
  const entry = { date:v.date, hours:v.hours, note:v.note, by:user.name, recordedAt:new Date().toISOString() };
  const patch = { lastPmDate:v.date, lastPmHours:v.hours, lastService:v.date, pmHistory:[...(m.pmHistory||[]), entry] };
  if(v.hours!=="" && v.hours > (Number(m.hours)||0)) patch.hours = v.hours;
  return patch;
};

const PM_STATE = {
  overdue:{label:"เกินกำหนด",   color:"#DC2626", bg:"#FEF2F2", icon:"fa-triangle-exclamation", rank:0},
  soon:   {label:"ใกล้ถึงกำหนด", color:"#D97706", bg:"#FFFBEB", icon:"fa-hourglass-half",       rank:1},
  ok:     {label:"ปกติ",         color:"#0E7490", bg:"#ECFEFF", icon:"fa-circle-check",         rank:2},
  none:   {label:"ยังไม่ตั้งรอบ PM", color:"#64748B", bg:"#F1F5F9", icon:"fa-circle-minus",     rank:3},
};
const TH_MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

function PmPlan({user}){
  const [tick,setTick] = React.useState(0);       // บังคับคำนวณใหม่หลังบันทึก PM
  const [q,setQ] = React.useState("");
  const [proj,setProj] = React.useState("");
  const [stateF,setStateF] = React.useState("due");   // due = เกิน+ใกล้ถึง · all · overdue · soon · ok · none
  const [view,setView] = React.useState("list");      // list | month | project
  const [quick,setQuick] = React.useState("");
  const canRecord = ["Admin","Officer","Engineer","Technician"].includes(window.effectiveRole ? window.effectiveRole(user) : user.role);
  const short = (p)=> window.projectShort ? window.projectShort(p) : p;
  const fmtD = (d)=> d ? window.__DATA.fmtDate(d) : "—";
  const num = (n)=> (Number(n)||0).toLocaleString("th-TH");

  // เครื่องจักรที่ผู้ใช้เห็น (ไม่รวมเครื่องที่ส่งคืนแล้ว) + สถานะ PM
  const all = React.useMemo(()=>{
    let list = (window.__DATA.machines||[]).filter(m=>m.status!=="ส่งคืน");
    try{ list = window.filterByUserProjects(user, list, "project"); }catch(e){}
    return list.map(m=>{
      const pm = window.machinePmStatus(m);
      const everyD = Number(m.pmEveryDays)||0, everyH = Number(m.pmEveryHours)||0;
      // คะแนนความเร่งด่วน: วันคงเหลือ หรือแปลงชั่วโมงคงเหลือเป็น "วันโดยประมาณ" (8 ชม./วัน) แล้วเอาค่าน้อยสุด
      const u = [pm.daysLeft, pm.hoursLeft!=null ? pm.hoursLeft/8 : null].filter(x=>x!=null);
      return { m, pm, everyD, everyH, urgency: u.length ? Math.min(...u) : 1e9, pmCount:(m.pmHistory||[]).length };
    }).sort((a,b)=>PM_STATE[a.pm.state].rank-PM_STATE[b.pm.state].rank || a.urgency-b.urgency || String(a.m.code).localeCompare(String(b.m.code),"th",{numeric:true}));
  },[user,tick]);

  const projects = React.useMemo(()=>[...new Set(all.map(x=>x.m.project).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"th")),[all]);
  const kw = q.trim().toLowerCase();
  const scoped = all.filter(x=>(!proj || x.m.project===proj) &&
    (!kw || [x.m.code,x.m.name,x.m.brand,x.m.model,x.m.project,x.m.subSite,x.m.driverName].some(v=>String(v||"").toLowerCase().includes(kw))));
  const count = (st)=>scoped.filter(x=>x.pm.state===st).length;
  const cnt = {overdue:count("overdue"), soon:count("soon"), ok:count("ok"), none:count("none")};
  const planned = cnt.overdue+cnt.soon+cnt.ok;
  const filtered = scoped.filter(x=> stateF==="all" ? true : stateF==="due" ? ["overdue","soon"].includes(x.pm.state) : x.pm.state===stateF);

  // แผนรายเดือน (6 เดือนข้างหน้า) — ใช้วันที่ครบกำหนดตามรอบวัน · เครื่องที่ตั้งรอบชั่วโมงอย่างเดียวแยกไว้อีกกลุ่ม
  const months = React.useMemo(()=>{
    const now = new Date(); now.setHours(0,0,0,0);
    const buckets = [{key:"over",label:"เกินกำหนด / ยังไม่เคยบันทึก PM",color:"#DC2626",items:[]}];
    for(let i=0;i<6;i++){
      const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
      buckets.push({key:`${d.getFullYear()}-${d.getMonth()}`,label:`${TH_MONTHS[d.getMonth()]} ${d.getFullYear()+543}`,color:i===0?"#D97706":"#0E7490",items:[]});
    }
    const later = {key:"later",label:"หลังจากนั้น",color:"#64748B",items:[]};
    const hourOnly = {key:"hours",label:"ตามชั่วโมงทำงาน (ไม่มีรอบวัน)",color:"#7C3AED",items:[]};
    scoped.filter(x=>x.pm.state!=="none").forEach(x=>{
      if(!x.everyD){ hourOnly.items.push(x); return; }
      if(x.pm.noBase || (x.pm.daysLeft!=null && x.pm.daysLeft<0)){ buckets[0].items.push(x); return; }
      const nd = x.pm.nextDate; if(!nd){ later.items.push(x); return; }
      const b = buckets.find(b=>b.key===`${nd.getFullYear()}-${nd.getMonth()}`);
      (b||later).items.push(x);
    });
    buckets.forEach(b=>b.items.sort((a,c)=>(a.pm.nextDate||0)-(c.pm.nextDate||0)));
    hourOnly.items.sort((a,c)=>a.pm.hoursLeft-c.pm.hoursLeft);
    return [...buckets, later, hourOnly].filter(b=>b.items.length || b.key!=="later");
  },[scoped.map(x=>x.m.id).join(","),tick]);

  // สรุปตามโครงการ
  const byProject = React.useMemo(()=>{
    const map = {};
    scoped.forEach(x=>{
      const k = x.m.project || "— ไม่ระบุโครงการ —";
      if(!map[k]) map[k] = {name:k,total:0,overdue:0,soon:0,ok:0,none:0};
      map[k].total++; map[k][x.pm.state]++;
    });
    return Object.values(map).sort((a,b)=>b.overdue-a.overdue || b.soon-a.soon || b.total-a.total);
  },[scoped.map(x=>x.m.id).join(","),tick]);

  const record = async (x)=>{
    const patch = await window.pmRecordDialog(x.m, user);
    if(!patch) return;
    try{
      Swal.fire({title:"กำลังบันทึก...",allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
      await window.api("updateMachine",{id:x.m.id,patch});
      window.__DATA.machines = (window.__DATA.machines||[]).map(m=>m.id===x.m.id?{...m,...patch}:m);
      setTick(t=>t+1);
      Swal.fire({icon:"success",title:"บันทึก PM แล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const cycleText = (x)=>[x.everyD?`ทุก ${num(x.everyD)} วัน`:"",x.everyH?`ทุก ${num(x.everyH)} ชม.`:""].filter(Boolean).join(" หรือ ")||"—";
  const lastText = (m)=>{ const d=m.lastPmDate||m.lastService; return (d?fmtD(d):"—")+(m.lastPmHours!==""&&m.lastPmHours!=null?` · ${num(m.lastPmHours)} ชม.`:""); };
  const badge = (st, text)=>{ const s=PM_STATE[st]; return <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"2px 9px",borderRadius:999,background:s.bg,color:s.color,fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}><i className={`fa-solid ${s.icon}`}></i>{s.label}{text?<span style={{fontWeight:400}}> · {text}</span>:null}</span>; };

  const exportExcel = async ()=>{
    if(!scoped.length){ Swal.fire({icon:"info",title:"ไม่มีข้อมูลให้ส่งออก"}); return; }
    try{
      Swal.fire({title:"กำลังสร้างไฟล์ Excel...",allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
      const XLSX = await ensureXLSX();
      const iso = (d)=>{ if(!d) return ""; const x=new Date(d); return isNaN(x)?"":`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; };
      const data = filtered.map((x,i)=>({
        "ลำดับ":i+1, "รหัสเครื่องจักร":x.m.code||"", "ชื่อเครื่องจักร":x.m.name||"", "โครงการ":x.m.project||"", "ไซต์งานย่อย":x.m.subSite||"",
        "สถานะ PM":PM_STATE[x.pm.state].label, "รายละเอียด":x.pm.text||"",
        "รอบ PM (วัน)":x.everyD||"", "รอบ PM (ชม.)":x.everyH||"",
        "PM ล่าสุด (วันที่)":iso(x.m.lastPmDate||x.m.lastService), "PM ล่าสุด (ชม.)":x.m.lastPmHours??"",
        "ครบกำหนดวันที่":iso(x.pm.nextDate), "วันคงเหลือ":x.pm.daysLeft??"",
        "ชั่วโมงปัจจุบัน":Number(x.m.hours)||0, "ครบกำหนดที่ชั่วโมง":x.pm.nextHours??"", "ชั่วโมงคงเหลือ":x.pm.hoursLeft??"",
        "ทำ PM แล้ว (ครั้ง)":x.pmCount, "ผู้ควบคุม":x.m.driverName||"",
      }));
      const proj = byProject.map((p,i)=>({"ลำดับ":i+1,"โครงการ":p.name,"เครื่องจักร":p.total,"เกินกำหนด":p.overdue,"ใกล้ถึงกำหนด":p.soon,"ปกติ":p.ok,"ยังไม่ตั้งรอบ":p.none}));
      const wb = XLSX.utils.book_new();
      [[data,"แผน PM"],[proj,"สรุปตามโครงการ"]].forEach(([rows,name])=>{
        if(!rows.length) return;
        const ws = XLSX.utils.json_to_sheet(rows);
        ws["!cols"] = Object.keys(rows[0]).map(k=>({wch:Math.min(40,Math.max(k.length+4,...rows.map(r=>String(r[k]??"").length+2)))}));
        XLSX.utils.book_append_sheet(wb, ws, name);
      });
      const d=new Date(); const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
      XLSX.writeFile(wb, `แผนPM_${stamp}.xlsx`);
      Swal.fire({icon:"success",title:`ส่งออกแล้ว ${data.length} เครื่อง`,timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"ส่งออกไม่สำเร็จ",text:err.message}); }
  };

  const stats = [
    {k:"overdue",label:"เกินกำหนด",val:cnt.overdue},
    {k:"soon",label:`ใกล้ถึงกำหนด (≤${window.PM_SOON_DAYS} วัน / ${window.PM_SOON_HOURS} ชม.)`,val:cnt.soon},
    {k:"ok",label:"ปกติ",val:cnt.ok},
    {k:"none",label:"ยังไม่ตั้งรอบ PM",val:cnt.none},
  ];
  const tabBtn = (k,icon,label)=>(
    <button className="btn btn-ghost btn-sm" style={{borderRadius:0,background:view===k?"var(--accent-soft)":"#fff",color:view===k?"var(--primary)":"var(--muted)"}} onClick={()=>setView(k)}><i className={`fa-solid ${icon}`}></i> {label}</button>
  );

  return (
    <>
    <div className="stat-grid" style={{marginBottom:12}}>
      {stats.map(s=>{ const st=PM_STATE[s.k]; return (
        <div className="stat" key={s.k} style={{cursor:"pointer",outline:stateF===s.k?`2px solid ${st.color}`:"none"}} onClick={()=>{setStateF(stateF===s.k?"all":s.k); setView("list");}} title="คลิกเพื่อกรอง">
          <div className="ic" style={{background:st.color+"1a",color:st.color}}><i className={`fa-solid ${st.icon}`}></i></div>
          <div className="label">{s.label}</div>
          <div className="val" style={{color:s.val&&s.k!=="ok"&&s.k!=="none"?st.color:undefined}}>{num(s.val)} <span style={{fontSize:13,fontWeight:400,color:"var(--muted)"}}>เครื่อง</span></div>
        </div>); })}
    </div>
    <div style={{marginBottom:16,padding:"10px 14px",background:"#fff",border:"1px solid var(--line)",borderRadius:12,fontSize:13,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
      <span>ตั้งรอบ PM แล้ว <b>{num(planned)}</b> / {num(scoped.length)} เครื่อง</span>
      <div style={{flex:1,minWidth:160,height:8,borderRadius:999,background:"#F1F5F9",overflow:"hidden",display:"flex"}}>
        {["overdue","soon","ok"].map(k=> scoped.length ? <div key={k} title={`${PM_STATE[k].label} ${cnt[k]}`} style={{width:`${cnt[k]/scoped.length*100}%`,background:PM_STATE[k].color}}></div> : null)}
      </div>
      <span style={{color:"var(--muted)"}}>ทำตามแผน (ปกติ) {planned?Math.round(cnt.ok/planned*100):0}% ของเครื่องที่ตั้งรอบ</span>
    </div>
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา รหัส / ชื่อเครื่อง / ยี่ห้อ / โครงการ / ผู้ควบคุม..." value={q} onChange={e=>setQ(e.target.value)} /></div>
        <select value={proj} onChange={e=>setProj(e.target.value)} style={{maxWidth:240}}>
          <option value="">ทุกโครงการ ({num(all.length)})</option>
          {projects.map(p=><option key={p} value={p}>{short(p)}</option>)}
        </select>
        {view==="list" && <select value={stateF} onChange={e=>setStateF(e.target.value)}>
          <option value="due">ต้องทำ PM (เกิน + ใกล้ถึง)</option>
          <option value="all">ทุกสถานะ</option>
          <option value="overdue">เกินกำหนด</option>
          <option value="soon">ใกล้ถึงกำหนด</option>
          <option value="ok">ปกติ</option>
          <option value="none">ยังไม่ตั้งรอบ PM</option>
        </select>}
        <div style={{display:"inline-flex",border:"1px solid var(--line)",borderRadius:10,overflow:"hidden"}}>
          {tabBtn("list","fa-list-check","รายการตามกำหนด")}
          {tabBtn("month","fa-calendar-days","แผนรายเดือน")}
          {tabBtn("project","fa-diagram-project","สรุปตามโครงการ")}
        </div>
        <div className="spacer"></div>
        <button className="btn btn-ghost" onClick={exportExcel}><i className="fa-solid fa-file-excel" style={{color:"#1D6F42"}}></i> ส่งออก Excel</button>
      </div>

      {view==="list" && <div className="table-wrap">
        <table className="data">
          <thead><tr><th>เครื่องจักร</th><th className="hide-on-mobile">โครงการ</th><th>สถานะ</th><th className="hide-on-mobile">รอบ PM</th><th className="hide-on-mobile">PM ล่าสุด</th><th>ครบกำหนด</th><th className="hide-on-mobile">ทำแล้ว</th><th></th></tr></thead>
          <tbody>
            {filtered.map(x=>(
              <tr key={x.m.id}>
                <td><span className="ticket-id" style={{cursor:"pointer"}} onClick={()=>setQuick(x.m.code)}>{x.m.code||"—"}</span><div style={{fontSize:12.5,marginTop:2}}>{x.m.name}</div></td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{x.m.project?short(x.m.project):"—"}{x.m.subSite?<div style={{fontSize:11.5,color:"var(--muted)"}}>{x.m.subSite}</div>:null}</td>
                <td>{badge(x.pm.state)}{x.pm.text?<div style={{fontSize:12,color:PM_STATE[x.pm.state].color,marginTop:3}}>{x.pm.text}</div>:null}</td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{cycleText(x)}</td>
                <td className="hide-on-mobile" style={{fontSize:13,whiteSpace:"nowrap"}}>{x.pm.state==="none"?"—":lastText(x.m)}</td>
                <td style={{fontSize:13,whiteSpace:"nowrap"}}>
                  {x.pm.nextDate && <div><i className="fa-regular fa-calendar" style={{color:"var(--muted)",marginRight:5}}></i>{fmtD(x.pm.nextDate)}</div>}
                  {x.pm.nextHours!=null && <div><i className="fa-regular fa-clock" style={{color:"var(--muted)",marginRight:5}}></i>{num(x.pm.nextHours)} ชม. <span style={{color:"var(--muted)",fontSize:11.5}}>(ตอนนี้ {num(x.m.hours)})</span></div>}
                  {!x.pm.nextDate && x.pm.nextHours==null && <span style={{color:"var(--muted)"}}>{x.pm.noBase?"ยังไม่เคยบันทึก PM":"—"}</span>}
                </td>
                <td className="hide-on-mobile">{x.pmCount ? `${x.pmCount} ครั้ง` : <span style={{color:"var(--muted)"}}>—</span>}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  {canRecord && x.pm.state!=="none" && <button className="btn btn-sm btn-primary" style={{background:"#0E7490",borderColor:"#0E7490"}} onClick={()=>record(x)} title="บันทึกว่าทำ PM แล้ว"><i className="fa-solid fa-circle-check"></i> บันทึก PM</button>}
                  {x.pm.state==="none" && <span style={{fontSize:12,color:"var(--muted)"}}>ตั้งรอบได้ที่ทะเบียนเครื่องจักร</span>}
                </td>
              </tr>
            ))}
            {filtered.length===0 && (<tr><td colSpan="8"><div className="empty"><i className="fa-solid fa-calendar-check"></i>
              <div className="t">{stateF==="due"?"ไม่มีเครื่องที่ต้องทำ PM ตอนนี้":"ไม่พบข้อมูล"}</div>
              <div>{stateF==="due"?"เครื่องที่ตั้งรอบไว้ยังไม่ถึงกำหนด — เลือก \"ทุกสถานะ\" เพื่อดูทั้งหมด":"ลองเปลี่ยนเงื่อนไขการค้นหา"}</div></div></td></tr>)}
          </tbody>
        </table>
      </div>}

      {view==="month" && <div style={{padding:16,display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
        {months.map(b=>(
          <div key={b.key} style={{border:"1px solid var(--line)",borderRadius:12,overflow:"hidden",background:"#fff"}}>
            <div style={{padding:"10px 14px",borderBottom:"1px solid var(--line-soft)",borderTop:`3px solid ${b.color}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <b style={{color:b.color,fontSize:14}}>{b.label}</b>
              <span style={{fontSize:12.5,color:"var(--muted)"}}>{b.items.length} เครื่อง</span>
            </div>
            <div style={{maxHeight:300,overflowY:"auto"}}>
              {b.items.length===0 && <div style={{padding:"14px",fontSize:12.5,color:"var(--muted)"}}>ไม่มีเครื่องครบกำหนด</div>}
              {b.items.map(x=>(
                <div key={x.m.id} style={{padding:"8px 14px",borderBottom:"1px solid var(--line-soft)",display:"flex",gap:10,alignItems:"center",fontSize:12.5}}>
                  <div style={{flex:1,minWidth:0}}>
                    <span className="ticket-id" style={{cursor:"pointer",fontSize:11}} onClick={()=>setQuick(x.m.code)}>{x.m.code}</span> <span>{x.m.name}</span>
                    <div style={{color:"var(--muted)",fontSize:11.5,marginTop:2}}>{x.m.project?short(x.m.project):""}{x.m.project?" · ":""}{b.key==="hours" ? `ครบที่ ${num(x.pm.nextHours)} ชม.` : x.pm.nextDate ? fmtD(x.pm.nextDate) : ""}</div>
                  </div>
                  <span style={{fontSize:11.5,color:PM_STATE[x.pm.state].color,whiteSpace:"nowrap",textAlign:"right"}}>{x.pm.text}</span>
                  {canRecord && <button className="ia" title="บันทึก PM" onClick={()=>record(x)} style={{color:"#0E7490"}}><i className="fa-solid fa-circle-check"></i></button>}
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>}

      {view==="project" && <div className="table-wrap">
        <table className="data">
          <thead><tr><th>โครงการ</th><th>เครื่องจักร</th><th style={{color:PM_STATE.overdue.color}}>เกินกำหนด</th><th style={{color:PM_STATE.soon.color}}>ใกล้ถึง</th><th>ปกติ</th><th className="hide-on-mobile">ยังไม่ตั้งรอบ</th><th className="hide-on-mobile" style={{minWidth:160}}>สัดส่วน</th><th></th></tr></thead>
          <tbody>
            {byProject.map(p=>(
              <tr key={p.name}>
                <td style={{fontWeight:500}}>{short(p.name)}</td>
                <td>{p.total}</td>
                <td style={{color:p.overdue?PM_STATE.overdue.color:"var(--muted)",fontWeight:p.overdue?600:400}}>{p.overdue}</td>
                <td style={{color:p.soon?PM_STATE.soon.color:"var(--muted)",fontWeight:p.soon?600:400}}>{p.soon}</td>
                <td>{p.ok}</td>
                <td className="hide-on-mobile" style={{color:"var(--muted)"}}>{p.none}</td>
                <td className="hide-on-mobile"><div style={{height:8,borderRadius:999,background:"#F1F5F9",overflow:"hidden",display:"flex"}}>
                  {["overdue","soon","ok","none"].map(k=><div key={k} style={{width:`${p[k]/p.total*100}%`,background:k==="none"?"#CBD5E1":PM_STATE[k].color}}></div>)}
                </div></td>
                <td>{p.name!=="— ไม่ระบุโครงการ —" && <button className="ia" title="ดูรายการของโครงการนี้" onClick={()=>{setProj(p.name);setStateF("all");setView("list");}}><i className="fa-solid fa-arrow-right"></i></button>}</td>
              </tr>
            ))}
            {byProject.length===0 && (<tr><td colSpan="8"><div className="empty"><i className="fa-solid fa-diagram-project"></i><div className="t">ไม่พบข้อมูล</div></div></td></tr>)}
          </tbody>
        </table>
      </div>}
    </div>
    {quick && <window.MachineQuickView code={quick} onClose={()=>setQuick("")}/>}
    </>
  );
}
window.PmPlan = PmPlan;


// ===== หมดเวลาใช้งาน =====
// ล็อกอินทิ้งไว้แล้วไม่ได้แตะเลยเกิน 15 นาที ให้เด้งออกไปล็อกอินใหม่
const IDLE_LIMIT_MS = 15 * 60 * 1000;
const IDLE_KEY = "rms_last_active";
function touchActivity(){
  try{ localStorage.setItem(IDLE_KEY, String(Date.now())); }catch(e){}
}
function isSessionExpired(){
  const t = Number(localStorage.getItem(IDLE_KEY) || 0);
  return !t || (Date.now() - t) > IDLE_LIMIT_MS;
}
function clearSession(){
  localStorage.removeItem("rms_user");
  localStorage.removeItem("rms_workspace");
  localStorage.removeItem(IDLE_KEY);
}
window.touchActivity = touchActivity;
window.isSessionExpired = isSessionExpired;
window.clearSession = clearSession;

function App(){
  const [user,setUser] = React.useState(null);
  const [workspace,setWorkspace] = React.useState(null);
  const [page,setPage] = React.useState("dashboard");
  const [sbOpen,setSbOpen] = React.useState(false);
  const [booting,setBooting] = React.useState(true);
  const [bootErr,setBootErr] = React.useState(null);
  const [locked,setLocked] = React.useState(false);              // ล็อกหน้าจอรอกรอก PIN
  const [pinOn,setPinOn] = React.useState(()=>window.__PIN.enabled());
  const [pinSetup,setPinSetup] = React.useState(false);

  React.useEffect(()=>{
    (async()=>{
      try{
        await window.__DATA.bootstrap();
        setBooting(false);
      }catch(err){
        setBootErr(err.message||String(err));
        setBooting(false);
      }
    })();
  },[]);

  React.useEffect(()=>{
    if(booting) return;
    // ปิดแท็บทิ้งไว้นานเกิน 15 นาที ก็ถือว่าหมดเวลา ไม่ต้องกู้เซสชันคืน
    // ยกเว้นตั้ง PIN ไว้ — เซสชันไม่มีวันหมดอายุ แค่ล็อกหน้าจอรอปลดด้วย PIN
    const pinKept = window.__PIN.enabled();
    if(localStorage.getItem("rms_user") && !pinKept && isSessionExpired()){
      clearSession();
      return;
    }
    if(pinKept && localStorage.getItem("rms_user")) setLocked(window.__PIN.isLocked());
    const s = localStorage.getItem("rms_user");
    if(s){
      try{
        const u = JSON.parse(s);
        const fresh = window.__DATA.users.find(x=>x.id===u.id);
        if(fresh) {
          setUser(fresh);
          const ws = localStorage.getItem("rms_workspace");
          if(ws) {
            const parsed = JSON.parse(ws);
            // สิทธิ์อาจถูกเปลี่ยนหลังบันทึก workspace ไว้ — ตรวจซ้ำก่อนเข้าใช้งาน
            const erp = (window.__DATA.erpSystems||[]).find(x=>x.id===parsed.erp?.id) || parsed.erp;
            if(window.canUseErp(fresh, erp)){
              window.__DATA.activeErp = erp;
              // ระบบไม่มีการเลือกโครงการแล้ว — ล้างค่าที่เคยบันทึกไว้ ไม่งั้นเครื่องเก่าจะยังถูกล็อกไว้ที่โครงการเดิม
              window.__DATA.activeProject = "";
              setWorkspace({...parsed, erp, project:"", projectLabel:""});
            }else{
              localStorage.removeItem("rms_workspace");
            }
          }
        }
      }catch(e){}
    }
  },[booting]);

  // เริ่มฟังคำขออนุมัติลบข้อมูลทันทีที่รู้ว่าใครล็อกอินอยู่ (Admin จะได้เห็นแจ้งเตือนแบบเรียลไทม์)
  React.useEffect(()=>{
    if(!user){ window.__DELREQ.stop(); window.__JOBALERT.stop(); return; }
    window.__DELREQ.start(user);
    window.__JOBALERT.start(user);     // Admin/ช่าง: เตือนใบแจ้งซ่อมใหม่ + สรุปงานค้างตามรอบเวลา
    window.askNotifyPermission(user);
    window.__FCM.autoStart(user);      // ต่ออายุ token ของ push ให้อัตโนมัติ (เครื่องที่เคยเปิดไว้)
    const pmT = setTimeout(()=>window.__PMALERT.check(user), 4000);   // รอข้อมูลเครื่องจักรโหลดก่อน
    return ()=>clearTimeout(pmT);
  },[user && user.id, user && user.role]);

  // แก้ชื่อ/Username ของตัวเองที่หน้าตั้งค่า แล้วให้ทั้งแอปเห็นค่าใหม่ทันที ไม่ต้องล็อกอินใหม่
  React.useEffect(()=>{
    if(!user) return;
    const onUserUpdated = () => {
      const fresh = (window.__DATA.users||[]).find(x=>x.id===user.id);
      if(fresh) setUser(fresh);
    };
    window.addEventListener("rms-user-updated", onUserUpdated);
    return ()=>window.removeEventListener("rms-user-updated", onUserUpdated);
  },[user && user.id]);

  // ใช้งานบนมือถือครั้งแรก — ชวนตั้ง PIN หนึ่งครั้ง ตอบ "ไว้ก่อน" แล้วไม่ถามซ้ำ
  React.useEffect(()=>{
    if(!user || !workspace || locked) return;
    if(!window.__PIN.available() || window.__PIN.enabled() || window.__PIN.asked()) return;
    const t = setTimeout(()=>{
      window.__PIN.markAsked();
      Swal.fire({icon:"question",title:"ตั้ง PIN ไหม?",
        html:"ตั้ง PIN 6 หลักไว้ปลดล็อกแอป แล้วจะไม่ถูกเด้งออกเพราะหมดเวลาใช้งานอีก<br/><span style='font-size:13px;color:#64748B'>เปลี่ยนหรือปิดได้ทีหลังที่เมนู <b>ล็อกด้วย PIN</b></span>",
        showCancelButton:true,confirmButtonText:"ตั้ง PIN เลย",cancelButtonText:"ไว้ก่อน",confirmButtonColor:"#1E40AF"
      }).then(r=>{ if(r.isConfirmed) setPinSetup(true); });
    }, 1500);
    return ()=>clearTimeout(t);
  },[user && user.id, !!workspace, locked]);

  // ไม่มีการใช้งานเกิน 15 นาที → ออกจากระบบอัตโนมัติ
  React.useEffect(()=>{
    if(!user) return;
    touchActivity();
    const checkIdle = () => {
      if(!isSessionExpired()) return;
      // ตั้ง PIN ไว้ = ไม่ต้องล็อกอินใหม่ แค่ล็อกหน้าจอรอปลดด้วย PIN
      if(window.__PIN.enabled()){
        window.__PIN.lockNow();
        setLocked(true);
        touchActivity();
        return;
      }
      clearSession();
      setUser(null);
      setWorkspace(null);
      window.__DATA.activeErp = null;
      window.__DATA.activeProject = "";
      Swal.fire({icon:"info",title:"หมดเวลาใช้งาน",text:"ไม่ได้ใช้งานเกิน 15 นาที กรุณาเข้าสู่ระบบใหม่",confirmButtonText:"ตกลง"});
    };
    let lastWrite = 0;
    const onActivity = () => {
      const now = Date.now();
      if(now - lastWrite < 5000) return;   // ไม่ต้องเขียน localStorage ทุกครั้งที่ขยับเมาส์
      lastWrite = now;
      touchActivity();
    };
    const onAway = () => window.__PIN.markAway();
    const onVisible = () => {
      if(document.visibilityState !== "visible"){ onAway(); return; }
      if(window.__PIN.isLocked()){ setLocked(true); return; }
      checkIdle();
    };
    const events = ["mousedown","keydown","touchstart","click","scroll","wheel"];
    events.forEach(ev=>window.addEventListener(ev,onActivity,{passive:true,capture:true}));
    document.addEventListener("visibilitychange",onVisible);
    window.addEventListener("pagehide",onAway);
    const timer = setInterval(checkIdle, 30000);
    return ()=>{
      events.forEach(ev=>window.removeEventListener(ev,onActivity,{capture:true}));
      document.removeEventListener("visibilitychange",onVisible);
      window.removeEventListener("pagehide",onAway);
      clearInterval(timer);
    };
  },[user && user.id]);

  const login = (u) => {
    // PIN ผูกกับคนที่ตั้งไว้ — ถ้าคนอื่นมาล็อกอินบนเครื่องนี้ ให้ยกเลิก PIN เดิม
    const rec = window.__PIN.record();
    if(rec && rec.uid && rec.uid !== u.id) window.__PIN.disable();
    window.__PIN.unlock();
    setLocked(false);
    setPinOn(window.__PIN.enabled());
    setUser(u); localStorage.setItem("rms_user",JSON.stringify(u));
    setWorkspace(null); localStorage.removeItem("rms_workspace");
    touchActivity();
    setPage(window.defaultPageFor(u));
  };
  const enterWorkspace = (ws) => {
    window.__DATA.activeErp = ws.erp;
    window.__DATA.activeProject = ws.project;
    setWorkspace(ws);
    localStorage.setItem("rms_workspace", JSON.stringify(ws));
    if(ws.erp?.startPage) {
      setPage(ws.erp.startPage);
    } else {
      setPage(window.defaultPageFor(user));
    }
  };
  const clearWorkspace = () => {
    window.__DATA.activeErp = null;
    window.__DATA.activeProject = "";
    setWorkspace(null);
    localStorage.removeItem("rms_workspace");
  };
  const logout = () => {
    Swal.fire({title:"ออกจากระบบ?",icon:"question",showCancelButton:true,confirmButtonText:"ออกจากระบบ",cancelButtonText:"ยกเลิก",confirmButtonColor:"#EF4444"}).then(r=>{
      if(r.isConfirmed){
        setUser(null);
        setWorkspace(null);
        clearSession();
        window.__DATA.activeErp = null;
        window.__DATA.activeProject = "";
      }
    });
  };

  if(booting) return <div style={{display:"grid",placeItems:"center",minHeight:"100vh",gap:14,background:"var(--bg)",fontFamily:"Kanit"}}>
    <div className="spinner" style={{width:40,height:40,borderWidth:4}}></div>
    <div style={{color:"var(--muted)"}}>กำลังเชื่อมต่อ Firebase...</div>
  </div>;

  if(bootErr) return <div style={{display:"grid",placeItems:"center",minHeight:"100vh",padding:20,background:"var(--bg)"}}>
    <div className="card" style={{maxWidth:520,padding:28,textAlign:"center"}}>
      <i className="fa-solid fa-triangle-exclamation" style={{fontSize:36,color:"var(--danger)",marginBottom:10}}></i>
      <h3 style={{margin:"0 0 6px"}}>เชื่อมต่อ Firebase ไม่สำเร็จ</h3>
      <div style={{color:"var(--muted)",fontSize:13,marginBottom:14,wordBreak:"break-word"}}>{bootErr}</div>
      <div style={{color:"var(--muted)",fontSize:12.5,textAlign:"left",background:"#FAFBFC",border:"1px solid var(--line)",borderRadius:10,padding:14}}>
        <div style={{fontWeight:500,color:"var(--text)",marginBottom:6}}>ตรวจสอบ:</div>
        1. ไปที่ Firebase Console → Realtime Database → <strong>Rules</strong><br/>
        2. ตั้งค่า <span className="mono">{'"'.repeat(1)}.read{'"'.repeat(1)}: true, {'"'.repeat(1)}.write{'"'.repeat(1)}: true</span><br/>
        3. กด Publish แล้วโหลดหน้าใหม่
      </div>
      <button className="btn btn-primary" style={{marginTop:14}} onClick={()=>location.reload()}><i className="fa-solid fa-rotate"></i> ลองใหม่</button>
    </div>
  </div>;

  if(!user) return <Login onLogin={login}/>;
  if(locked) return <PinLockScreen user={user}
    onUnlock={()=>{ setLocked(false); touchActivity(); }}
    onForceLogout={()=>{
      setLocked(false); setPinOn(false); setUser(null); setWorkspace(null);
      window.__DATA.activeErp = null; window.__DATA.activeProject = "";
    }}/>;
  if(!workspace) return <WorkspacePicker user={user} onContinue={enterWorkspace} onLogout={()=>{setUser(null);setWorkspace(null);clearSession();window.__DATA.activeErp=null;window.__DATA.activeProject="";}}/>;

  const activeUser = {...user, activeErp:workspace.erp, activeProject:workspace.project};
  const systemId = workspace.erp?.id || "repairs";
  // หน้าที่เข้าได้ = หน้าของระบบงานนี้ ∩ สิทธิ์ของบัญชี (Admin ตั้งได้ที่ ระบบการจัดการ → สิทธิ์การใช้งาน)
  const myPages = window.allowedPagesFor(activeUser);
  const allowedPages = (window.SYSTEM_PAGES[systemId] || window.SYSTEM_PAGES.repairs)
    .filter(k=>myPages.has(k))
    .concat("notifications");   // หน้าแจ้งเตือน/อนุมัติลบข้อมูล เปิดได้จากทุกระบบงาน
  const startPage = workspace.erp?.startPage;
  const fallbackPage = (allowedPages.includes(startPage) ? startPage : allowedPages[0]) || "notifications";
  const safePage = allowedPages.includes(page) ? page : fallbackPage;

  const pageTitles = {
    "dashboard":{t:"แดชบอร์ด",c:"ภาพรวมและสถิติงานซ่อม"},
    "repairs":{t:"รายการแจ้งซ่อม",c:"จัดการและติดตามงานซ่อมทั้งหมด"},
    "pm-plan":{t:"แผนบำรุงรักษา (PM)",c:"สรุปแผน PM ของเครื่องจักรทุกเครื่อง · เกินกำหนด / ใกล้ถึง / แผนรายเดือน"},
    "spare-parts":{t:"อะไหล่ที่ใช้ซ่อม",c:"สรุปอะไหล่ที่ใช้จากทุกใบแจ้งซ่อม · ค่าใช้จ่ายและแหล่งซื้อ"},
    "users":{t:"จัดการผู้ใช้งาน",c:"Users · เพิ่ม / แก้ไข / ลบ"},
    "categories":{t:"จัดการหมวดหมู่งาน",c:"Categories · เพิ่ม / แก้ไข / ลบ"},
    "machines":{t:"ทะเบียนเครื่องจักร",c:"Machines · ข้อมูลจาก Firebase"},
    "asset-registry":{t:"ทะเบียนทรัพย์สิน",c:"Asset Registry · ข้อมูลจาก Firebase panamanee-3a15a"},
    "asset-do":{t:"ใบส่งของ (DO)",c:"Delivery Order · บันทึกการย้ายทรัพย์สินระหว่างโครงการ"},
    "site-stock":{t:"สต๊อก/เบิกจ่ายหน้างาน",c:"Consume · คงคลังแต่ละโครงการ รับเข้า และเบิกจ่ายของหน้างาน"},
    "withdrawal-pending":{t:"รายการรอจัดซื้อ/จัดหา",c:"Consume · รายการในใบเบิกที่ยังไม่ได้ซื้อ/จัดหา แยกตามโครงการ"},
    "withdrawals":{t:"รายการเบิกของ",c:"ERP Withdrawal · ใบขอเบิก/ขอสั่งซื้อ 24 แถวต่อหน้า"},
    "doc-pj2":{t:"ปจ2 - เอกสารรับรองการตรวจสอบและทดสอบ",c:"ลิงค์ไฟล์เอกสารตามรายการเครื่องจักร"},
    "transfer-history":{t:"ประวัติการย้ายเครื่องจักร",c:"บันทึกการย้ายโครงการของเครื่องจักรทั้งหมด"},
    "login-logs":{t:"ประวัติการล็อกอิน",c:"บันทึกการเข้าสู่ระบบล่าสุด 100 รายการ · ที่เกินมาระบบลบทิ้งอัตโนมัติ · เฉพาะ Admin"},
    "projects":{t:"โครงการ",c:"Projects · จัดการข้อมูลโครงการทั้งหมด"},
    "permissions":{t:"สิทธิ์การใช้งาน",c:"กำหนดสิทธิ์เข้าถึงฟังก์ชันตามตำแหน่ง และยกเว้นเป็นรายบุคคล · เฉพาะ Admin"},
    "r-dashboard":{t:"สรุปงานของฉัน",c:"ภาพรวมงานแจ้งซ่อมที่ฉันเป็นผู้แจ้ง"},
    "r-new":{t:"แจ้งซ่อมใหม่",c:"กรอกแบบฟอร์มแจ้งซ่อม"},
    "r-mine":{t:"ติดตามสถานะ",c:"รายการแจ้งซ่อมของฉัน"},
    "notifications":{t:"การแจ้งเตือน",c:"คำขออนุมัติลบ / แก้ไขข้อมูล · ต้องได้รับอนุมัติจากผู้ดูแลระบบ (Admin) ก่อนเสมอ"},
  };
  const pt = pageTitles[safePage] || pageTitles.dashboard;

  const renderPage = () => {
    if(safePage==="dashboard") return <Dashboard user={activeUser} goTo={setPage}/>;
    if(safePage==="repairs") return <Repairs user={activeUser}/>;
    if(safePage==="spare-parts") return <SpareParts user={activeUser}/>;
    if(safePage==="pm-plan") return <PmPlan user={activeUser}/>;
    if(safePage==="users") return <Users user={activeUser}/>;
    if(safePage==="categories") return <Categories user={activeUser}/>;
    if(safePage==="machines") return <Machines user={activeUser}/>;
    if(safePage==="asset-registry") return <AssetRegistry user={activeUser}/>;
    if(safePage==="asset-do") return <DeliveryOrders user={activeUser}/>;
    if(safePage==="withdrawals") return <Withdrawals user={activeUser}/>;
    if(safePage==="withdrawal-pending") return <Withdrawals user={activeUser} view="pending"/>;
    if(safePage==="site-stock") return <SiteStock user={activeUser}/>;
    if(safePage==="doc-pj2") return <DocPJ2 user={activeUser}/>;
    if(safePage==="transfer-history") return <MachineTransferHistory user={activeUser}/>;
    if(safePage==="login-logs") return <LoginLogs />;
    if(safePage==="permissions") return <Permissions user={activeUser}/>;
    if(safePage==="projects") return <Projects user={activeUser}/>;
    if(safePage==="r-dashboard") return <ReporterDashboard user={activeUser} goTo={setPage}/>;
    if(safePage==="r-new") return <NewRequest user={activeUser} goTo={setPage}/>;
    if(safePage==="r-mine") return <MyRepairs user={activeUser}/>;
    if(safePage==="notifications") return <DeleteApprovals user={activeUser}/>;
    return null;
  };

  return (
    <div className="shell">
      <button className="sidebar-toggle" onClick={()=>setSbOpen(true)}><i className="fa-solid fa-bars"></i></button>
      <Sidebar user={activeUser} active={safePage} onNav={setPage} onLogout={logout} open={sbOpen} onClose={()=>setSbOpen(false)}
        pinOn={pinOn} onOpenPin={()=>setPinSetup(true)} onLockNow={()=>{ window.__PIN.lockNow(); setLocked(true); }}/>
      <main className="main">
        <div className="topbar">
          <div className="title"><h1>{pt.t}</h1><div className="crumb">{pt.c}</div></div>
          <div className="actions">
            <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหาทั้งระบบ..."/></div>
            <button className="btn btn-ghost" title={`${workspace.erp?.name || "ระบบงาน"} · กดเพื่อเปลี่ยนระบบงาน`} onClick={clearWorkspace} style={{maxWidth:320,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              <i className={`fa-solid ${workspace.erp?.icon || "fa-layer-group"}`}></i> {workspace.erp?.name || "ระบบงาน"}
            </button>
            {(safePage==="repairs" && systemId==="repairs" && window.isOpsRole(user)) && (
              <button className="btn btn-primary" onClick={()=>setPage("r-new")}><i className="fa-solid fa-plus"></i> แจ้งซ่อมใหม่</button>
            )}
          </div>
        </div>
        {renderPage()}
      </main>
      {pinSetup && <PinSetupModal user={activeUser} onClose={()=>{ setPinSetup(false); setPinOn(window.__PIN.enabled()); }}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
