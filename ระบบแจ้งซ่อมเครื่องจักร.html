      <div style={{marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{fontWeight:600,fontSize:14}}><i className="fa-solid fa-box-open" style={{color:"var(--primary)",marginRight:6}}></i>รายการอะไหล่</div>
          <button className="btn btn-ghost btn-sm" onClick={addPart}><i className="fa-solid fa-plus"></i> เพิ่มรายการ</button>
        </div>
        <div style={{border:"1px solid var(--line)",borderRadius:10,overflow:"hidden"}}>
          <div className="table-scroll">
          <table style={{width:"100%",minWidth:520,borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:"#FAFBFC"}}>
                <th style={{padding:"9px 12px",textAlign:"left",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)"}}>ชื่ออะไหล่ / รายการ</th>
                <th style={{padding:"9px 10px",textAlign:"left",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:150}}>แหล่งซื้อ</th>
                <th style={{padding:"9px 8px",textAlign:"center",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:72}}>จำนวน</th>
                <th style={{padding:"9px 10px",textAlign:"right",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:130}}>ราคา/หน่วย (฿)</th>
                <th style={{padding:"9px 12px",textAlign:"right",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:100}}>รวม (฿)</th>
                <th style={{width:36,borderBottom:"1px solid var(--line)"}}></th>
              </tr>
            </thead>
            <tbody>
              {parts.map((p,i)=>(
                <tr key={i} style={{borderBottom:i<parts.length-1?"1px solid var(--line-soft)":""}}>
                  <td style={{padding:"7px 10px"}}>
                    <input value={p.name} onChange={e=>upPart(i,"name",e.target.value)} placeholder="เช่น สายพาน, น้ำมันไฮดรอลิก..." style={inStyle}/>
                  </td>
                  <td style={{padding:"7px 6px"}}>
                    <input value={p.supplier||""} onChange={e=>upPart(i,"supplier",e.target.value)} placeholder="เช่น ร้าน A, บริษัท B" style={inStyle}/>
                  </td>
                  <td style={{padding:"7px 6px"}}>
                    <input type="number" min="1" value={p.qty} onChange={e=>upPart(i,"qty",e.target.value)} style={{...inStyle,textAlign:"center"}}/>
                  </td>
                  <td style={{padding:"7px 6px"}}>
                    <input type="number" min="0" value={p.unitPrice} onChange={e=>upPart(i,"unitPrice",e.target.value)} style={{...inStyle,textAlign:"right"}}/>
                  </td>
                  <td style={{padding:"7px 12px",textAlign:"right",fontWeight:600,color:"var(--primary)",fontFamily:"JetBrains Mono,monospace",fontSize:12.5}}>
                    {fmt((Number(p.qty)||0)*(Number(p.unitPrice)||0))}
                  </td>
                  <td style={{padding:"4px 6px 4px 0"}}>
                    {parts.length>1 && <button className="ia danger" onClick={()=>removePart(i)} title="ลบ"><i className="fa-solid fa-xmark"></i></button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>{/* table-scroll */}
        </div>
      </div>

      {/* Labor cost */}
      <div style={{marginBottom:20}}>
        <div style={{fontWeight:600,fontSize:14,marginBottom:10}}><i className="fa-solid fa-person-digging" style={{color:"var(--warning)",marginRight:6}}></i>ค่าแรงช่างซ่อม</div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <input type="number" min="0" value={laborCost} onChange={e=>setLaborCost(e.target.value)} placeholder="0" style={{width:"100%",maxWidth:200,padding:"9px 12px",border:"1px solid var(--line)",borderRadius:10,fontFamily:"Kanit",fontSize:14,outline:"none"}}/>
          <span style={{color:"var(--muted)",fontSize:13}}>บาท</span>
        </div>
      </div>

      {/* Summary */}
      <div style={{background:"linear-gradient(135deg,rgba(30,64,175,.06),rgba(139,92,246,.06))",border:"1px solid rgba(30,64,175,.18)",borderRadius:12,padding:"16px 20px"}}>
        <div style={{fontWeight:600,fontSize:14,color:"var(--primary)",marginBottom:12}}><i className="fa-solid fa-calculator" style={{marginRight:6}}></i>สรุปค่าใช้จ่าย</div>
        <div style={{display:"grid",gap:8}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}>
            <span style={{color:"var(--muted)"}}>ค่าอะไหล่รวม ({parts.filter(p=>p.name.trim()).length} รายการ)</span>
            <span style={{fontWeight:500,fontFamily:"JetBrains Mono,monospace",fontSize:12.5}}>฿{fmt(partsTotal)}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}>
            <span style={{color:"var(--muted)"}}>ค่าแรงช่างซ่อม</span>
            <span style={{fontWeight:500,fontFamily:"JetBrains Mono,monospace",fontSize:12.5}}>฿{fmt(laborCost)}</span>
          </div>
          <div style={{borderTop:"1px solid rgba(30,64,175,.2)",marginTop:4,paddingTop:10,display:"flex",justifyContent:"space-between",fontSize:17,fontWeight:700}}>
            <span>รวมทั้งสิ้น</span>
            <span style={{color:"var(--primary)"}}>฿{fmt(total)}</span>
          </div>
        </div>
      </div>
    </Modal>
  );
}

window.Repairs = Repairs;
window.RepairDetail = RepairDetail;
window.EditRepairModal = EditRepairModal;
</script>

<script type="text/babel">
function Users({user}){
  const [rows,setRows] = React.useState(window.__DATA.users);
  const [edit,setEdit] = React.useState(null);
  const [q,setQ] = React.useState("");
  const filtered = rows.filter(u=>!q||(u.name.toLowerCase()+u.username).includes(q.toLowerCase()));

  const save = async (form) => {
    try{
      if(form.id){
        await window.api("updateUser",{id:form.id, patch:form});
        const upd = rows.map(x=>x.id===form.id?form:x);
        setRows(upd); window.__DATA.users = upd;
        try{
          const cur = JSON.parse(localStorage.getItem("rms_user")||"null");
          if(cur && cur.id===form.id){
            localStorage.setItem("rms_user", JSON.stringify(form));
            Swal.fire({icon:"info",title:"อัปเดตสิทธิ์แล้ว",text:"กำลังโหลดหน้าใหม่เพื่อใช้สิทธิ์ล่าสุด",timer:1500,showConfirmButton:false}).then(()=>location.reload());
            return;
          }
        }catch(e){}
      } else {
        const nu = await window.api("createUser",{user:form});
        const upd = [...rows, nu]; setRows(upd); window.__DATA.users = upd;
      }
      setEdit(null);
      Swal.fire({icon:"success",title:"บันทึกสำเร็จ",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const del = (u) => {
    Swal.fire({title:"ลบผู้ใช้งาน?",text:`ต้องการลบ "${u.name}" ใช่หรือไม่?`,icon:"warning",showCancelButton:true,confirmButtonText:"ลบ",cancelButtonText:"ยกเลิก",confirmButtonColor:"#EF4444"}).then(async r=>{
      if(r.isConfirmed){
        try{
          await window.api("deleteUser",{id:u.id});
          const upd = rows.filter(x=>x.id!==u.id); setRows(upd); window.__DATA.users = upd;
          Swal.fire({icon:"success",title:"ลบแล้ว",timer:1000,showConfirmButton:false,toast:true,position:"top-end"});
        }catch(err){ Swal.fire({icon:"error",title:"ลบไม่สำเร็จ",text:err.message}); }
      }
    });
  };

  const [revealedPw,setRevealedPw] = React.useState({});
  const togglePw = async (u) => {
    if(revealedPw[u.id]!==undefined){ setRevealedPw(p=>{const n={...p};delete n[u.id];return n;}); return; }
    try{
      const {password} = await window.api("getUserPassword",{id:u.id});
      setRevealedPw(p=>({...p,[u.id]:password}));
    }catch(err){ Swal.fire({icon:"error",title:"ไม่สำเร็จ",text:err.message}); }
  };

  const roleColors = {Admin:"#1E40AF",Officer:"#8B5CF6",Technician:"#F59E0B",Engineer:"#06B6D4",Reporter:"#10B981",Director:"#EF4444"};

  const renderProjectAccess = (u) => {
    const hasAll = ["Admin","Director"].includes(u.role) || !Array.isArray(u.projects) || u.projects.length===0;
    if(hasAll) return <span className="badge" style={{background:"rgba(30,64,175,.1)",color:"#1E40AF",fontSize:11.5}}><i className="fa-solid fa-globe" style={{marginRight:4}}></i>ทุกโครงการ</span>;
    if(u.projects.length<=2) return <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{u.projects.map(p=>(<span key={p} className="badge" style={{background:"var(--line-soft)",color:"var(--text)",fontSize:11.5}}>{p}</span>))}</div>;
    return <span className="badge" style={{background:"var(--line-soft)",color:"var(--text)",fontSize:11.5}} title={u.projects.join(", ")}><i className="fa-solid fa-folder" style={{marginRight:4}}></i>{u.projects.length} โครงการ</span>;
  };

  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหาชื่อ หรือ username..." value={q} onChange={e=>setQ(e.target.value)} /></div>
        <div className="spacer"></div>
        <button className="btn btn-primary" onClick={()=>setEdit({username:"",password:"",name:"",role:"Reporter",dept:"",email:"",projects:[]})}><i className="fa-solid fa-plus"></i> เพิ่มผู้ใช้งาน</button>
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr><th>Username</th><th>ชื่อ-นามสกุล</th><th className="hide-on-mobile">ตำแหน่ง</th><th className="hide-on-mobile">หน่วยงาน</th><th className="hide-on-mobile">สิทธิ์เข้าถึงโครงการ</th><th className="hide-on-mobile">อีเมล</th>{user.role==="Admin"&&<th>รหัสผ่าน</th>}<th>จัดการ</th></tr></thead>
          <tbody>
            {filtered.map(u=>(
              <tr key={u.id}>
                <td><span className="mono" style={{background:"var(--line-soft)",padding:"2px 7px",borderRadius:6,fontSize:12.5}}>{u.username}</span></td>
                <td><Avatar name={u.name}/>{u.name}</td>
                <td className="hide-on-mobile"><span className="badge" style={{background:roleColors[u.role]+"22",color:roleColors[u.role]}}><span className="dot"></span>{u.role}</span></td>
                <td className="hide-on-mobile">{u.dept}</td>
                <td className="hide-on-mobile">{renderProjectAccess(u)}</td>
                <td className="hide-on-mobile" style={{color:"var(--muted)",fontSize:13}}>{u.email}</td>
                {user.role==="Admin"&&<td><div style={{display:"flex",alignItems:"center",gap:6,minWidth:100}}>
                  <span className="mono" style={{fontSize:12.5,letterSpacing:revealedPw[u.id]!==undefined?".01em":".1em"}}>
                    {revealedPw[u.id]!==undefined ? revealedPw[u.id] : "••••••"}
                  </span>
                  <button className="ia" title={revealedPw[u.id]!==undefined?"ซ่อน":"แสดงรหัสผ่าน"} onClick={()=>togglePw(u)} style={{color:revealedPw[u.id]!==undefined?"var(--primary)":"var(--muted)"}}>
                    <i className={`fa-solid ${revealedPw[u.id]!==undefined?"fa-eye-slash":"fa-eye"}`}></i>
                  </button>
                </div></td>}
                <td><div className="row-actions"><button className="ia" title="แก้ไข" onClick={()=>setEdit({...u,projects:Array.isArray(u.projects)?u.projects:[]})}><i className="fa-solid fa-pen"></i></button><button className="ia danger" title="ลบ" onClick={()=>del(u)}><i className="fa-solid fa-trash"></i></button></div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {edit && <UserForm init={edit} onClose={()=>setEdit(null)} onSave={save}/>}
    </div>
  );
}

function UserForm({init,onClose,onSave}){
  const [f,setF] = React.useState({...init, projects: Array.isArray(init.projects)?init.projects:[]});
  const roles = ["Admin","Officer","Engineer","Technician","Reporter","Director"];
  const allProjects = React.useMemo(()=>Array.from(new Set((window.__DATA.machines||[]).map(m=>m.project).filter(Boolean))).sort(),[]);
  const isSuperRole = ["Admin","Director"].includes(f.role);
  const toggleProject = (p) => setF(prev=>{ const cur=prev.projects||[]; return {...prev,projects:cur.includes(p)?cur.filter(x=>x!==p):[...cur,p]}; });
  const selectAll = () => setF(prev=>({...prev,projects:[...allProjects]}));
  const clearAll = () => setF(prev=>({...prev,projects:[]}));
  const submit = () => {
    if(!f.username||!f.name){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาใส่ Username และชื่อ-นามสกุล"}); return; }
    onSave(f);
  };
  return (
    <Modal open={true} onClose={onClose} size="lg" title={init.id?"แก้ไขผู้ใช้งาน":"เพิ่มผู้ใช้งานใหม่"}
      footer={<><button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button><button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-floppy-disk"></i> บันทึก</button></>}>
      <div className="form-grid">
        <div className="form-field"><label>Username *</label><input value={f.username} onChange={e=>setF({...f,username:e.target.value})} /></div>
        <div className="form-field"><label>Password {init.id && <span style={{color:"var(--muted)",fontWeight:400}}>(เว้นว่างหากไม่เปลี่ยน)</span>}</label><input type="password" value={f.password} onChange={e=>setF({...f,password:e.target.value})} /></div>
        <div className="form-field full"><label>ชื่อ-นามสกุล *</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} /></div>
        <div className="form-field"><label>ตำแหน่ง/บทบาท</label><select value={f.role} onChange={e=>setF({...f,role:e.target.value})}>{roles.map(r=>(<option key={r} value={r}>{r}</option>))}</select></div>
        <div className="form-field"><label>หน่วยงาน</label><input value={f.dept} onChange={e=>setF({...f,dept:e.target.value})} /></div>
        <div className="form-field full"><label>อีเมล</label><input value={f.email} onChange={e=>setF({...f,email:e.target.value})} /></div>
        <div className="form-field full">
          <label style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <span><i className="fa-solid fa-folder-tree" style={{color:"var(--primary)",marginRight:6}}></i>สิทธิ์เข้าถึงโครงการ</span>
            {!isSuperRole && <span style={{fontWeight:400,fontSize:12,color:"var(--muted)"}}>{f.projects?.length?`เลือกแล้ว ${f.projects.length}/${allProjects.length}`:`ไม่เลือก = เห็นทุกโครงการ`}</span>}
          </label>
          {isSuperRole ? (
            <div style={{padding:14,background:"rgba(30,64,175,.06)",border:"1px solid rgba(30,64,175,.2)",borderRadius:10,fontSize:13,color:"var(--primary)"}}>
              <i className="fa-solid fa-shield-halved" style={{marginRight:8}}></i>บทบาท <strong>{f.role}</strong> เห็นข้อมูลได้ทุกโครงการโดยอัตโนมัติ
            </div>
          ) : (
            <>
              <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                <button type="button" className="btn btn-ghost btn-sm" onClick={selectAll}><i className="fa-solid fa-check-double"></i> เลือกทั้งหมด</button>
                <button type="button" className="btn btn-ghost btn-sm" onClick={clearAll}><i className="fa-solid fa-xmark"></i> ยกเลิกทั้งหมด</button>
                <div style={{flex:1}}></div>
                <div style={{fontSize:11.5,color:"var(--muted)",alignSelf:"center"}}>ไม่เลือกเลย = เห็นทุกโครงการ</div>
              </div>
              {allProjects.length===0 ? (
                <div style={{padding:14,background:"var(--bg)",border:"1px dashed var(--line)",borderRadius:10,fontSize:13,color:"var(--muted)",textAlign:"center"}}><i className="fa-solid fa-circle-info"></i> ยังไม่มีโครงการในระบบ</div>
              ) : (
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:8,padding:12,background:"var(--bg)",border:"1px solid var(--line)",borderRadius:10,maxHeight:260,overflowY:"auto"}}>
                  {allProjects.map(p=>{
                    const on = (f.projects||[]).includes(p);
                    return (
                      <label key={p} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:8,cursor:"pointer",background:on?"rgba(30,64,175,.08)":"#fff",border:`1px solid ${on?"rgba(30,64,175,.4)":"var(--line)"}`,fontSize:13,transition:"all .15s"}}>
                        <input type="checkbox" checked={on} onChange={()=>toggleProject(p)} style={{margin:0,cursor:"pointer",accentColor:"var(--primary)",width:16,height:16}} />
                        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p}</span>
                      </label>
                    );
                  })}
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </Modal>
  );
}
window.Users = Users;
</script>

        <div className="spacer"></div>
        <button className="btn btn-primary" onClick={()=>setEdit({name:"",color:"#3B82F6",icon:"fa-wrench"})}><i className="fa-solid fa-plus"></i> เพิ่มหมวดหมู่</button>
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr><th style={{width:80}} className="hide-on-mobile">สี</th><th style={{width:80}}>ไอคอน</th><th>ชื่อหมวดหมู่</th><th className="hide-on-mobile">FontAwesome Class</th><th className="hide-on-mobile">จำนวนงาน</th><th>จัดการ</th></tr></thead>

                  <td><div style={{width:36,height:36,borderRadius:8,background:c.color+"22",color:c.color,display:"grid",placeItems:"center",fontSize:16}}><i className={`fa-solid ${c.icon}`}></i></div></td>
                  <td style={{fontWeight:500}}>{c.name}</td>
                  <td className="hide-on-mobile"><span className="mono" style={{fontSize:12,color:"var(--muted)"}}>{c.icon}</span></td>
                  <td className="hide-on-mobile"><strong>{cnt}</strong> <span style={{color:"var(--muted)",fontSize:12}}>งาน</span></td>
                  <td><div className="row-actions"><button className="ia" onClick={()=>setEdit(c)}><i className="fa-solid fa-pen"></i></button><button className="ia danger" onClick={()=>del(c)}><i className="fa-solid fa-trash"></i></button></div></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {edit && <CatForm init={edit} onClose={()=>setEdit(null)} onSave={save}/>}
    </div>
  );
}

function CatForm({init,onClose,onSave}){
  const [f,setF] = React.useState(init);
  const palette = ["#3B82F6","#8B5CF6","#EF4444","#10B981","#F59E0B","#06B6D4","#EC4899","#6366F1","#F97316","#14B8A6","#A855F7","#0EA5E9","#DC2626","#16A34A","#D97706","#64748B"];
  const icons = ["fa-bolt","fa-solid fa-tractor","fa-wind","fa-droplet","fa-desktop","fa-building","fa-truck","fa-wrench","fa-screwdriver","fa-hammer","fa-fan","fa-temperature-high","fa-car-battery","fa-plug","fa-fire","fa-snowflake"];
  return (
    <Modal open={true} onClose={onClose} title={init.id?"แก้ไขหมวดหมู่":"เพิ่มหมวดหมู่ใหม่"}
      footer={<><button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button><button className="btn btn-primary" onClick={()=>onSave(f)}><i className="fa-solid fa-floppy-disk"></i> บันทึก</button></>}>
      <div className="form-field" style={{marginBottom:16}}><label>ชื่อหมวดหมู่</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} /></div>
      <div className="form-field" style={{marginBottom:16}}>
        <label>สี</label>
        <div className="color-grid">{palette.map(c=>(<button key={c} className={f.color===c?"sel":""} style={{background:c}} onClick={()=>setF({...f,color:c})}></button>))}</div>
      </div>
      <div className="form-field">
        <label>ไอคอน (FontAwesome)</label>
        <div className="color-grid" style={{gridTemplateColumns:"repeat(8,1fr)"}}>
          {icons.map(ic=>(<button key={ic} className={f.icon===ic?"sel":""} style={{background:f.icon===ic?f.color+"33":"#F8FAFC",color:f.icon===ic?f.color:"#64748B"}} onClick={()=>setF({...f,icon:ic})}><i className={`fa-solid ${ic}`}></i></button>))}
        </div>
        <div className="hint mono">{f.icon}</div>
      </div>
      <div style={{marginTop:20,padding:16,background:"#FAFBFC",borderRadius:10,border:"1px dashed var(--line)"}}>
        <div style={{fontSize:11,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:8,fontWeight:500}}>ตัวอย่าง</div>
        <span className="cat-chip" style={{background:f.color+"22",color:f.color}}><i className={`fa-solid ${f.icon}`}></i>{f.name || "ชื่อหมวดหมู่"}</span>
      </div>
    </Modal>
  );
}
window.Categories = Categories;
</script>

<script type="text/babel">
function Machines({user}){
  const allowAll = window.userCanSeeAllProjects(user);
  const allowed = new Set(user.projects||[]);
  const visibleRows = React.useMemo(()=>(allowAll ? window.__DATA.machines : window.__DATA.machines.filter(m=>!m.project||allowed.has(m.project))),[allowAll]);
  const [rows,setRows] = React.useState(visibleRows);
  const [q,setQ] = React.useState("");
  const [statusF,setStatusF] = React.useState("all");
  const [catF,setCatF] = React.useState("all");
  const [detail,setDetail] = React.useState(null);
  const [edit,setEdit] = React.useState(null);
  React.useEffect(()=>{ setRows(visibleRows); },[visibleRows]);

  const filtered = rows.filter(m=>{
    if(q){ const qq=q.toLowerCase(); const hay=[m.name,m.code,m.brand,m.model,m.serial,m.project].map(x=>(x||"").toLowerCase()).join(" "); if(!hay.includes(qq)) return false; }
    if(statusF!=="all" && m.status!==statusF) return false;
    if(catF!=="all" && m.categoryId!==catF) return false;
    return true;
  });

  const statusColor = (s) => ({"ใช้งาน":"#10B981","ซ่อม":"#EF4444","รอซ่อม":"#F59E0B"})[s] || "#64748B";

  const save = async (form) => {
    try{
      if(form.id){
        await window.api("updateMachine",{id:form.id,patch:form});
        const upd = rows.map(x=>x.id===form.id?form:x); setRows(upd); window.__DATA.machines=upd;
      } else {
        const nu = await window.api("createMachine",{m:form});
        const upd=[...rows,nu]; setRows(upd); window.__DATA.machines=upd;
      }
      setEdit(null);
      Swal.fire({icon:"success",title:"บันทึกสำเร็จ",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const remove = (m) => {
    Swal.fire({title:"ลบเครื่องจักร?",html:`คุณต้องการลบ <strong>${m.name}</strong> (${m.code}) ใช่หรือไม่?`,icon:"warning",showCancelButton:true,confirmButtonColor:"#EF4444",confirmButtonText:"ลบ",cancelButtonText:"ยกเลิก"}).then(async r=>{
      if(r.isConfirmed){
        try{
          await window.api("deleteMachine",{id:m.id});
          const upd=rows.filter(x=>x.id!==m.id); setRows(upd); window.__DATA.machines=upd; setDetail(null);
          Swal.fire({icon:"success",title:"ลบแล้ว",timer:1000,showConfirmButton:false,toast:true,position:"top-end"});
        }catch(err){ Swal.fire({icon:"error",title:"ลบไม่สำเร็จ",text:err.message}); }
      }
    });
  };

  const handleTransfer = async (machine, {toProject, note}) => {
    const entry = {from:machine.project||"ไม่ระบุ", to:toProject, when:new Date().toISOString(), by:user.name, note:note||""};
    const transferHistory = [...(machine.transferHistory||[]), entry];
    const patch = {project:toProject, transferHistory};
    try{
      await window.api("updateMachine",{id:machine.id, patch});
      const updated = {...machine, ...patch};
      const upd = rows.map(x=>x.id===machine.id?updated:x);
      setRows(upd); window.__DATA.machines=upd; setDetail(updated);
      Swal.fire({icon:"success",title:"ย้ายโครงการสำเร็จ",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  return (
    <>
    <div className="card" style={{marginBottom:18}}>
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา ชื่อ / รหัส / ยี่ห้อ / ซีเรียล / โครงการ..." value={q} onChange={e=>setQ(e.target.value)} /></div>
        <select value={statusF} onChange={e=>setStatusF(e.target.value)}><option value="all">ทุกสถานะ</option><option value="ใช้งาน">ใช้งานอยู่</option><option value="ซ่อม">กำลังซ่อม</option><option value="รอซ่อม">รอซ่อม</option></select>
        <select value={catF} onChange={e=>setCatF(e.target.value)}><option value="all">ทุกหมวดหมู่</option>{(window.__DATA.categories||[]).map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}</select>
        <div className="spacer"></div>
        {["Admin","Officer","Engineer"].includes(user.role) && (
          <button className="btn btn-primary" onClick={()=>setEdit({mode:"create",m:{id:"",project:"",code:"",name:"",brand:"",model:"",size:"",serial:"",ownership:"",categoryId:"",note:"",status:"ใช้งาน",location:"",lastService:window.__DATA.fmtDate(new Date()),hours:0,icon:"fa-gears",driverName:"",driveLink1:"",driveLink2:"",inspectionDate:"",nextInspectionDate:""}})}>
            <i className="fa-solid fa-plus"></i> เพิ่มเครื่องจักร
          </button>
        )}
      </div>
    </div>
    <div className="machines-grid">
      {filtered.map(m=>{
        const cat = window.getCategory(m.categoryId);
        return (
          <div className="machine-card" key={m.id} onClick={()=>setDetail(m)}>
            <div className="machine-thumb">
              {<><div className="pattern"></div><div className="ic"><i className={`fa-solid ${m.icon||"fa-gears"}`}></i></div></>}
              {m.categoryId && <div className="drive-tag" style={{background:cat.color,color:"#fff"}}><i className={`fa-solid ${cat.icon}`}></i> {cat.name}</div>}
              <div className="status-dot" style={{background:statusColor(m.status)}}><span style={{width:5,height:5,borderRadius:"50%",background:"#fff"}}></span>{m.status}</div>
            </div>
            <div className="machine-info">
              <div className="n">{m.name}</div>
              <div className="m">{m.code}{m.brand?` · ${m.brand}`:""}{m.model?` ${m.model}`:""}</div>
              <div className="meta"><span><i className="fa-solid fa-diagram-project"></i> {m.project||"—"}</span>{m.ownership&&<span><i className="fa-solid fa-handshake"></i> {m.ownership}</span>}</div>
            </div>
          </div>
        );
      })}
      {filtered.length===0 && (<div style={{gridColumn:"1/-1"}} className="card"><div className="empty"><i className="fa-solid fa-industry"></i><div className="t">ยังไม่มีเครื่องจักรในระบบ</div><div>{["Admin","Officer","Engineer"].includes(user.role)?"กดปุ่ม 'เพิ่มเครื่องจักร' ด้านบนเพื่อเริ่มต้น":"รอผู้ดูแลระบบเพิ่มข้อมูล"}</div></div></div>)}
    </div>
    {detail && <MachineDetail m={detail} user={user} onClose={()=>setDetail(null)} onEdit={()=>{setEdit({mode:"edit",m:detail});setDetail(null);}} onDelete={()=>remove(detail)} onTransfer={(payload)=>handleTransfer(detail,payload)} onPatchMachine={async (patch)=>{ try{ await window.api("updateMachine",{id:detail.id,patch}); const updated={...detail,...patch}; const upd=rows.map(x=>x.id===detail.id?updated:x); setRows(upd); window.__DATA.machines=upd; setDetail(updated); }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }}} />}
    {edit && <MachineForm initial={edit.m} mode={edit.mode} onClose={()=>setEdit(null)} onSave={save} />}
    </>
  );
}

function MachineForm({initial,mode,onClose,onSave}){
  const [f,setF] = React.useState(initial);
  const [busy,setBusy] = React.useState(false);
  const projects = React.useMemo(()=>(window.__DATA.projects||[]).filter(p=>p.status!=="inactive"),[]);
  const up = (k,v) => setF(p=>({...p,[k]:v}));

  const submit = async (e) => {
    e?.preventDefault();
    if(!f.code?.trim()||!f.name?.trim()){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณากรอก รหัสเครื่องจักร และ ชื่อเครื่องจักร"}); return; }
    setBusy(true);
    try{ await onSave({...f,hours:Number(f.hours)||0}); } finally { setBusy(false); }
  };

  const icons = ["fa-solid fa-tractor","fa-industry","fa-wind","fa-droplet","fa-snowflake","fa-bolt","fa-truck","fa-boxes-packing","fa-fan","fa-plug","fa-screwdriver-wrench","fa-gauge","fa-tractor","fa-helmet-safety"];

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className={`fa-solid ${mode==="edit"?"fa-pen-to-square":"fa-plus"}`} style={{marginRight:8,color:"var(--primary)"}}></i>{mode==="edit"?"แก้ไขเครื่องจักร":"เพิ่มเครื่องจักรใหม่"}</>}
      footer={<><button className="btn btn-ghost" onClick={onClose} disabled={busy}>ยกเลิก</button><button className="btn btn-primary" onClick={submit} disabled={busy}>{busy?<><div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> กำลังบันทึก...</>:<><i className="fa-solid fa-floppy-disk"></i> บันทึก</>}</button></>}>
      <form onSubmit={submit}>
        <div className="form-grid">
          <div className="form-field">
            <label>โครงการ</label>
            {projects.length===0 ? (
              <div style={{padding:"10px 12px",borderRadius:8,border:"1px dashed var(--line)",background:"#FFFBEB",fontSize:13,color:"#92400E"}}>
                <i className="fa-solid fa-triangle-exclamation" style={{marginRight:6}}></i>
                ยังไม่มีโครงการในระบบ — กรุณาเพิ่มโครงการในเมนู <strong>โครงการ</strong> ก่อน
              </div>
            ) : (
              <>
                <select value={f.project||""} onChange={e=>up("project",e.target.value)}>
                  <option value="">— เลือกโครงการ —</option>
                  {projects.map(p=>(<option key={p.id} value={p.name}>{p.code ? `[${p.code}] ` : ""}{p.name}</option>))}
                </select>
                {f.project && (()=>{
                  const proj = projects.find(p=>p.name===f.project);
                  return proj ? (
                    <div style={{marginTop:6,display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:999,background:(proj.color||"#3B82F6")+"22",color:proj.color||"#3B82F6",fontSize:12,fontWeight:500}}>
                      <span style={{width:8,height:8,borderRadius:"50%",background:proj.color||"#3B82F6"}}></span>
                      {proj.code && <span className="mono">{proj.code}</span>}
                      {proj.name}
                    </div>
                  ) : null;
                })()}
              </>
            )}
          </div>
          <div className="form-field"><label>รหัสเครื่องจักร *</label><input value={f.code||""} onChange={e=>up("code",e.target.value)} placeholder="เช่น XCMG-001" /></div>
          <div className="form-field" style={{gridColumn:"1/-1"}}><label>เครื่องจักร (ชื่อ) *</label><input value={f.name||""} onChange={e=>up("name",e.target.value)} placeholder="เช่น Drilling Rig, เครื่องกลึง CNC" /></div>
          <div className="form-field"><label>ยี่ห้อ</label><input value={f.brand||""} onChange={e=>up("brand",e.target.value)} placeholder="เช่น XCMG, Komatsu, HITACHI" /></div>
          <div className="form-field"><label>รุ่น</label><input value={f.model||""} onChange={e=>up("model",e.target.value)} placeholder="เช่น XR220D" /></div>
          <div className="form-field"><label>ขนาด / ความยาว</label><input value={f.size||""} onChange={e=>up("size",e.target.value)} placeholder="เช่น 22 ตัน / 12 เมตร" /></div>
          <div className="form-field"><label>ซีเรียล</label><input className="mono" value={f.serial||""} onChange={e=>up("serial",e.target.value)} placeholder="Serial Number" /></div>
          <div className="form-field"><label>กรรมสิทธิ์/เช่า</label><input value={f.ownership||""} onChange={e=>up("ownership",e.target.value)} placeholder="กรรมสิทธิ์, เช่า, ยืม..." /></div>
          <div className="form-field"><label>หมวดหมู่</label><select value={f.categoryId||""} onChange={e=>up("categoryId",e.target.value)}><option value="">— เลือกหมวดหมู่ —</option>{(window.__DATA.categories||[]).map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}</select></div>
          <div className="form-field"><label>สถานะ</label><select value={f.status||"ใช้งาน"} onChange={e=>up("status",e.target.value)}><option value="ใช้งาน">ใช้งาน</option><option value="ซ่อม">ซ่อม</option><option value="รอซ่อม">รอซ่อม</option></select></div>
          <div className="form-field" style={{gridColumn:"1/-1"}}><label>สถานที่ติดตั้ง</label><input value={f.location||""} onChange={e=>up("location",e.target.value)} placeholder="เช่น โรงงาน A - สายการผลิต 1" /></div>
          <div className="form-field"><label>ชั่วโมงทำงานสะสม</label><input type="number" min="0" value={f.hours||0} onChange={e=>up("hours",e.target.value)} /></div>
          <div className="form-field"><label>ซ่อมบำรุงล่าสุด</label><input type="date" value={f.lastService||""} onChange={e=>up("lastService",e.target.value)} /></div>
          <div className="form-field"><label><i className="fa-solid fa-certificate" style={{marginRight:5,color:"#7C3AED"}}></i>วันที่ตรวจสอบ (ปจ2)</label><input type="date" value={f.inspectionDate||""} onChange={e=>up("inspectionDate",e.target.value)} /></div>
          <div className="form-field"><label><i className="fa-solid fa-calendar-check" style={{marginRight:5,color:"#EF4444"}}></i>วันที่ตรวจสอบครั้งถัดไป</label><input type="date" value={f.nextInspectionDate||""} onChange={e=>up("nextInspectionDate",e.target.value)} /></div>
          <div className="form-field"><label>ชื่อพนักงานขับ / ผู้ควบคุม</label><input value={f.driverName||""} onChange={e=>up("driverName",e.target.value)} placeholder="เช่น นายสมชาย ใจดี" /></div>
          <div className="form-field" style={{gridColumn:"1/-1"}}>
            <label><i className="fa-brands fa-google-drive" style={{marginRight:6,color:"#4285F4"}}></i>ลิงค์ไฟล์ Google Drive (1) <span style={{fontWeight:400,fontSize:12,color:"var(--muted)"}}>เช่น คู่มือ, ใบรับประกัน</span></label>
            <input value={f.driveLink1||""} onChange={e=>up("driveLink1",e.target.value)} placeholder="https://drive.google.com/..." />
          </div>
          <div className="form-field" style={{gridColumn:"1/-1"}}>
            <label><i className="fa-brands fa-google-drive" style={{marginRight:6,color:"#4285F4"}}></i>ลิงค์ไฟล์ Google Drive (2) <span style={{fontWeight:400,fontSize:12,color:"var(--muted)"}}>เช่น แบบแปลน, ประวัติซ่อมบำรุง</span></label>
            <input value={f.driveLink2||""} onChange={e=>up("driveLink2",e.target.value)} placeholder="https://drive.google.com/..." />
          </div>
          <div className="form-field" style={{gridColumn:"1/-1"}}><label>หมายเหตุ</label><textarea rows="3" value={f.note||""} onChange={e=>up("note",e.target.value)} placeholder="หมายเหตุเพิ่มเติม..."></textarea></div>
        </div>
        <div className="form-field" style={{marginTop:14}}>
          <label>ไอคอน (ใช้แทนเมื่อไม่มีรูป)</label>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(58px,1fr))",gap:8,padding:12,background:"var(--bg)",border:"1px solid var(--line)",borderRadius:10}}>
            {icons.map(ic=>(<button type="button" key={ic} onClick={()=>up("icon",ic)} style={{height:50,borderRadius:10,border:f.icon===ic?"2px solid var(--primary)":"1px solid var(--line)",background:f.icon===ic?"var(--accent-soft)":"#fff",color:f.icon===ic?"var(--primary)":"var(--muted)",fontSize:18,cursor:"pointer",display:"grid",placeItems:"center"}}><i className={`fa-solid ${ic}`}></i></button>))}
          </div>
        </div>
      </form>
    </Modal>
  );
}

function TransferMachineModal({m,onClose,onSave}){
  const projects = (window.__DATA.projects||[]).filter(p=>p.status!=="inactive"&&p.name!==m.project);
  const [toProject,setToProject] = React.useState("");
  const [note,setNote] = React.useState("");
  const inSt = {width:"100%",padding:"9px 11px",border:"1px solid var(--line)",borderRadius:8,fontFamily:"Kanit",fontSize:13.5,background:"#fff"};
  const submit = () => {
    if(!toProject){ Swal.fire({icon:"warning",title:"กรุณาเลือกโครงการปลายทาง"}); return; }
    onSave({toProject,note});
  };
  return (
    <Modal open={true} onClose={onClose} title={<><i className="fa-solid fa-right-left" style={{color:"#7C3AED",marginRight:8}}></i>ย้ายโครงการ</>} size="sm"
      footer={<><button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button><button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-check"></i> ยืนยันการย้าย</button></>}>
      <div style={{display:"grid",gap:16}}>
        <div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:11,color:"#92400E",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>โครงการปัจจุบัน</div>
          <div style={{fontWeight:600,fontSize:15,color:"#78350F"}}>{m.project||"— ไม่ระบุ —"}</div>
        </div>
        <div>
          <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>ย้ายไปยังโครงการ <span style={{color:"#EF4444"}}>*</span></label>
          <select style={inSt} value={toProject} onChange={e=>setToProject(e.target.value)}>
            <option value="">— เลือกโครงการปลายทาง —</option>
            {projects.map(p=>(<option key={p.id} value={p.name}>{p.name}</option>))}
          </select>
          {projects.length===0 && <div style={{fontSize:12,color:"var(--muted)",marginTop:5}}>ไม่มีโครงการอื่นในระบบ กรุณาเพิ่มโครงการก่อน</div>}
        </div>
        <div>
          <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>เหตุผล / หมายเหตุ</label>

}

    if(editTrIdx===null||!editTrDate) return;

      try{ await window.api("updateRepair",{id:r.id,patch,by:user.name}); }

        if(/Unknown action/i.test(String(e1.message||e1))){
          const {status,cost,...rest}=patch;

      window.__DATA.repairs=window.__DATA.repairs.map(x=>x.id===r.id?updated:x);

        </div>

          <div style={{fontSize:20,fontWeight:600,marginBottom:4}}>{m.name}</div>
          <div style={{color:"var(--muted)",marginBottom:14}}>{m.brand||"—"} {m.model||""} {m.size?`· ${m.size}`:""}</div>

            <div><div className="k">โครงการ</div><div className="v">{m.project||"—"}</div></div>
            <div><div className="k">ซีเรียล</div><div className="v mono" style={{fontSize:12}}>{m.serial||"—"}</div></div>
            <div><div className="k">สถานที่ติดตั้ง</div><div className="v">{m.location||"—"}</div></div>
            <div><div className="k">ซ่อมบำรุงล่าสุด</div><div className="v">{m.lastService||"—"}</div></div>

          </div>}

              <div style={{display:"grid",gap:6}}>
                {[...m.transferHistory].reverse().map((t,i)=>{
                  const actualIdx = m.transferHistory.length-1-i;

                  return (
                    <div key={i} style={{display:"flex",gap:10,padding:"10px 12px",background:"#F5F3FF",border:"1px solid #DDD6FE",borderRadius:8,fontSize:13}}>

                            </>

                            <>
                              <span style={{color:"var(--muted)",fontSize:11}}>{window.__DATA.fmtDate(t.when)} · {t.by}</span>
                              {canEdit && <button onClick={()=>{setEditTrIdx(actualIdx);setEditTrDate(toDateStr(t.when));}} style={{padding:"1px 6px",background:"none",border:"1px solid #DDD6FE",borderRadius:4,fontSize:10,cursor:"pointer",color:"#7C3AED",lineHeight:1.6}}><i className="fa-solid fa-pen"></i></button>}
                            </>

              </div>
            </div>
          )}
        </div>
      </div>
      <div style={{borderTop:"1px dashed var(--line)",paddingTop:16}}>
        <div style={{fontWeight:500,marginBottom:10,fontSize:14}}><i className="fa-solid fa-clock-rotate-left" style={{color:"var(--primary)",marginRight:6}}></i>ประวัติการแจ้งซ่อม ({relatedRows.length})</div>
        {relatedRows.length>0 ? (
          <table className="data" style={{border:"1px solid var(--line)",borderRadius:8}}>
            <thead><tr><th>เลขที่</th><th>วันที่</th><th>อาการ</th><th>สถานะ</th>{canEdit&&<th>จัดการ</th>}</tr></thead>
            <tbody>
              {relatedRows.map(r=>(
                <tr key={r.id} style={{cursor:"pointer"}}>
                  <td onClick={()=>setViewRepair(r)}><span className="ticket-id" style={{display:"inline-flex",alignItems:"center",gap:5}}>{r.running}<i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:9,opacity:.5}}></i></span></td>
                  <td onClick={()=>setViewRepair(r)} style={{color:"var(--muted)"}}>{window.__DATA.fmtDate(r.createdAt)}</td>
                  <td onClick={()=>setViewRepair(r)} style={{fontSize:13}}>{r.title}</td>
                  <td onClick={()=>setViewRepair(r)}><Badge status={r.status}/></td>
                  {canEdit&&<td><button className="ia" title="แก้ไขข้อมูล" onClick={e=>{e.stopPropagation();setEditRepair(r);}} style={{color:"#1E40AF"}}><i className="fa-solid fa-user-pen"></i></button></td>}
                </tr>
              ))}
            </tbody>
          </table>
        ) : <div style={{color:"var(--muted)",fontSize:13,padding:"12px 0"}}>ยังไม่มีประวัติการซ่อม</div>}
      </div>
    </Modal>
    {viewRepair && <window.RepairDetail r={viewRepair} user={user} onClose={()=>setViewRepair(null)} onQuick={null} onEdit={canEdit?(r)=>{setViewRepair(null);setEditRepair(r);}:null} onEditParts={null}/>}
    {editRepair && <window.EditRepairModal r={editRepair} onClose={()=>setEditRepair(null)} onSave={saveEdit}/>}

<script type="text/babel">
function DocPJ2({user}){
  const [rows,setRows] = React.useState(()=>window.filterByUserProjects(user,window.__DATA.machines,"project"));
  const [q,setQ] = React.useState("");
  const [filterProj,setFilterProj] = React.useState("all");
  const [editCell,setEditCell] = React.useState(null); // {id,field,value}
  const canEdit = ["Admin","Officer","Engineer"].includes(user.role);
  const today = React.useMemo(()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; },[]);
  const toDateStr = (d) => { try{ return new Date(d).toISOString().slice(0,10); }catch(e){ return ""; } };

  const projects = React.useMemo(()=>[...new Set(rows.map(m=>m.project).filter(Boolean))].sort(),[rows]);
  const filtered = React.useMemo(()=>rows.filter(m=>{
    if(filterProj!=="all" && m.project!==filterProj) return false;
    if(q){ const qq=q.toLowerCase(); if(!([m.code,m.name,m.project].map(x=>(x||"").toLowerCase()).join(" ").includes(qq))) return false; }
    return true;
  }).sort((a,b)=>{
    const da = a.nextInspectionDate ? new Date(a.nextInspectionDate) : null;
    const db = b.nextInspectionDate ? new Date(b.nextInspectionDate) : null;
    if(!da && !db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return da - db;
  }),[rows,q,filterProj]);

  const saveDate = async () => {
    if(!editCell) return;
    const {id,field,value} = editCell;
    try{
      await window.api("updateMachine",{id,patch:{[field]:value}});
      const upd = rows.map(m=>m.id===id?{...m,[field]:value}:m);
      setRows(upd); window.__DATA.machines=window.__DATA.machines.map(m=>m.id===id?{...m,[field]:value}:m);
      setEditCell(null);
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const nextDateColor = (val) => {
    if(!val) return null;
    const d=new Date(val); d.setHours(0,0,0,0);
    const diff=Math.floor((d-today)/(1000*60*60*24));
    if(diff<0) return "#EF4444";
    if(diff<=30) return "#F59E0B";
    return "#10B981";
  };

  const renderDateCell = (m,field) => {
    const val = m[field]||"";
    const isEditing = editCell&&editCell.id===m.id&&editCell.field===field;
    const color = field==="nextInspectionDate"?nextDateColor(val):null;
    if(isEditing) return (
      <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
        <input type="date" value={editCell.value} onChange={e=>setEditCell(ec=>({...ec,value:e.target.value}))}
          style={{padding:"3px 7px",border:"1px solid var(--primary)",borderRadius:6,fontSize:12,fontFamily:"Kanit"}} autoFocus/>
        <button onClick={saveDate} style={{padding:"3px 10px",background:"var(--primary)",color:"#fff",border:"none",borderRadius:6,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>บันทึก</button>
        <button onClick={()=>setEditCell(null)} style={{padding:"3px 8px",background:"none",border:"1px solid var(--line)",borderRadius:6,fontSize:12,cursor:"pointer",fontFamily:"Kanit"}}>ยกเลิก</button>
      </div>
    );
    return (
      <div style={{display:"flex",alignItems:"center",gap:5}}>
        {val ? (
          <span style={{fontSize:12,fontWeight:color?"600":"400",color:color?color:"inherit",background:color?color+"18":"transparent",padding:color?"2px 7px":"0",borderRadius:5,display:"inline-flex",alignItems:"center",gap:4}}>
            {window.__DATA.fmtDate(val)}
            {color==="#EF4444"&&<span style={{fontSize:10}}>⚠ เกินกำหนด</span>}
            {color==="#F59E0B"&&<span style={{fontSize:10}}>ใกล้ถึงกำหนด</span>}
          </span>
        ) : <span style={{color:"var(--muted)",fontSize:12}}>—</span>}
        {canEdit&&<button onClick={()=>setEditCell({id:m.id,field,value:val||toDateStr(new Date())})}
          style={{padding:"1px 5px",background:"none",border:"1px solid var(--line)",borderRadius:4,fontSize:10,cursor:"pointer",color:"var(--muted)"}}>
          <i className={`fa-solid ${val?"fa-pen":"fa-plus"}`}></i>
        </button>}
      </div>
    );
  };

  const linkBtn = (url) => url
    ? <a href={url} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:6,background:"#EFF6FF",border:"1px solid #BFDBFE",color:"#1E40AF",fontSize:12,textDecoration:"none",whiteSpace:"nowrap"}}><i className="fa-brands fa-google-drive" style={{color:"#4285F4"}}></i>เปิดไฟล์<i className="fa-solid fa-arrow-up-right-from-square" style={{fontSize:9,opacity:.6}}></i></a>
    : <span style={{color:"var(--muted)"}}>—</span>;

  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา รหัส / ชื่อเครื่องจักร..." value={q} onChange={e=>setQ(e.target.value)}/></div>
        <select value={filterProj} onChange={e=>setFilterProj(e.target.value)}>
          <option value="all">ทุกโครงการ</option>
          {projects.map(p=>(<option key={p} value={p}>{p}</option>))}
        </select>
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>{filtered.length} / {rows.length} รายการ</div>
      </div>
      <div style={{padding:"8px 16px",borderBottom:"1px solid var(--line)",background:"#FAFBFC",display:"flex",gap:16,flexWrap:"wrap",fontSize:12,color:"var(--muted)"}}>
        <span style={{fontWeight:500,color:"var(--text)"}}>หมายเหตุ:</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:"50%",background:"#10B981",display:"inline-block"}}></span>เขียว — ยังไม่ถึงกำหนด (&gt;30 วัน)</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:"50%",background:"#F59E0B",display:"inline-block"}}></span>เหลือง — ใกล้ถึงกำหนด (≤30 วัน)</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:"50%",background:"#EF4444",display:"inline-block"}}></span>แดง — เกินกำหนดแล้ว ⚠</span>
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr>
            <th>รหัส</th><th>ชื่อเครื่องจักร</th>
            <th className="hide-on-mobile">โครงการ</th>
            <th>วันที่ตรวจสอบ</th>
            <th>วันที่ตรวจสอบครั้งถัดไป</th>
            <th>เอกสาร (1)</th>
            <th>เอกสาร (2)</th>
          </tr></thead>
          <tbody>
            {filtered.map(m=>(
              <tr key={m.id}>
                <td><span className="mono" style={{fontSize:12}}>{m.code||"—"}</span></td>
                <td><div style={{fontWeight:500,fontSize:13}}>{m.name}</div>{m.brand&&<div style={{fontSize:11,color:"var(--muted)"}}>{m.brand}{m.model?` ${m.model}`:""}</div>}</td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{m.project||"—"}</td>
                <td>{renderDateCell(m,"inspectionDate")}</td>
                <td>{renderDateCell(m,"nextInspectionDate")}</td>
                <td>{linkBtn(m.driveLink1)}</td>
                <td>{linkBtn(m.driveLink2)}</td>
              </tr>
            ))}
            {filtered.length===0&&(<tr><td colSpan="7"><div className="empty"><i className="fa-solid fa-file-circle-xmark"></i><div className="t">ไม่พบข้อมูล</div><div>ลองเปลี่ยนเงื่อนไขการค้นหา</div></div></td></tr>)}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function MachineTransferHistory({user}){
  const allTransfers = React.useMemo(()=>{
    const visible = window.filterByUserProjects(user, window.__DATA.machines, "project");
    const list=[];
    visible.forEach(m=>{
      (m.transferHistory||[]).forEach(t=>list.push({...t,machineCode:m.code,machineName:m.name,currentProject:m.project}));
    });
    return list.sort((a,b)=>new Date(b.when)-new Date(a.when));
  },[user]);
  const [q,setQ] = React.useState("");
  const [filterProj,setFilterProj] = React.useState("all");
  const projects = React.useMemo(()=>{
    const s=new Set(); allTransfers.forEach(t=>{if(t.from)s.add(t.from);if(t.to)s.add(t.to);}); return [...s].sort();
  },[allTransfers]);
  const filtered = React.useMemo(()=>allTransfers.filter(t=>{
    if(filterProj!=="all" && t.from!==filterProj && t.to!==filterProj) return false;
    if(q){ const qq=q.toLowerCase(); if(!([t.machineCode,t.machineName,t.from,t.to,t.by,t.note].map(x=>(x||"").toLowerCase()).join(" ").includes(qq))) return false; }
    return true;
  }),[allTransfers,q,filterProj]);
  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา รหัส / ชื่อ / โครงการ..." value={q} onChange={e=>setQ(e.target.value)}/></div>
        <select value={filterProj} onChange={e=>setFilterProj(e.target.value)}>
          <option value="all">ทุกโครงการ</option>
          {projects.map(p=>(<option key={p} value={p}>{p}</option>))}
        </select>
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>{filtered.length} รายการ</div>
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr><th>วันที่ย้าย</th><th>รหัส</th><th>ชื่อเครื่องจักร</th><th>จากโครงการ</th><th style={{width:24}}></th><th>ไปโครงการ</th><th className="hide-on-mobile">โดย</th><th className="hide-on-mobile">เหตุผล</th></tr></thead>
          <tbody>
            {filtered.map((t,i)=>(
              <tr key={i}>
                <td style={{color:"var(--muted)",whiteSpace:"nowrap",fontSize:13}}>{window.__DATA.fmtDate(t.when)}</td>
                <td><span className="mono" style={{fontSize:12}}>{t.machineCode||"—"}</span></td>
                <td style={{fontWeight:500,fontSize:13}}>{t.machineName||"—"}</td>
                <td><span style={{background:"#F5F3FF",color:"#6D28D9",padding:"2px 8px",borderRadius:5,fontSize:12,fontWeight:500}}>{t.from||"ไม่ระบุ"}</span></td>
                <td style={{textAlign:"center"}}><i className="fa-solid fa-arrow-right" style={{color:"var(--muted)",fontSize:11}}></i></td>
                <td><span style={{background:"#EFF6FF",color:"#1E40AF",padding:"2px 8px",borderRadius:5,fontSize:12,fontWeight:600}}>{t.to}</span></td>
                <td className="hide-on-mobile" style={{fontSize:13}}>{t.by||"—"}</td>
                <td className="hide-on-mobile" style={{fontSize:12,color:"#4B5563",maxWidth:200}}>{t.note||"—"}</td>
              </tr>
            ))}
            {filtered.length===0&&(<tr><td colSpan="8"><div className="empty"><i className="fa-solid fa-right-left"></i><div className="t">ไม่พบประวัติการย้าย</div><div>ยังไม่มีการย้ายเครื่องจักรระหว่างโครงการ</div></div></td></tr>)}
          </tbody>
        </table>
      </div>
    </div>
  );
}
</script>


<script type="text/babel">
function ReporterDashboard({user,goTo}){
  const mine = React.useMemo(()=>{
    if(user.role==="Engineer") return window.filterByUserProjects(user,window.__DATA.repairs,"project");
    return window.__DATA.repairs.filter(r=>r.reporterId===user.id);
  },[user]);
  const counts = { all:mine.length, progress:mine.filter(r=>["progress","assess","new"].includes(r.status)).length, parts:mine.filter(r=>r.status==="parts").length, done:mine.filter(r=>r.status==="done").length };
  const recent = mine.slice(0,5);
  const stats = [
    {label:"รายการทั้งหมด",val:counts.all,icon:"fa-clipboard-list",color:"#3B82F6"},
    {label:"กำลังดำเนินการ",val:counts.progress,icon:"fa-screwdriver-wrench",color:"#F59E0B"},
    {label:"รออะไหล่",val:counts.parts,icon:"fa-box-open",color:"#EF4444"},
    {label:"เสร็จสิ้น",val:counts.done,icon:"fa-circle-check",color:"#10B981"},
  ];
  return (
    <>
      <div className="stat-grid">
        {stats.map((s,i)=>(<div className="stat" key={i}><div className="ic" style={{background:s.color+"1a",color:s.color}}><i className={`fa-solid ${s.icon}`}></i></div><div className="label">{s.label}</div><div className="val">{s.val}</div></div>))}
      </div>
      <div className="card" style={{marginBottom:18}}>
        <div className="card-body" style={{display:"flex",alignItems:"center",gap:22,flexWrap:"wrap"}}>
          <div style={{width:56,height:56,borderRadius:14,background:"linear-gradient(135deg,#3B82F6,#1E40AF)",color:"#fff",display:"grid",placeItems:"center",fontSize:24}}><i className="fa-solid fa-circle-plus"></i></div>
          <div style={{flex:1,minWidth:220}}><div style={{fontSize:17,fontWeight:600,marginBottom:4}}>พบปัญหาเครื่องจักร?</div><div style={{color:"var(--muted)",fontSize:13.5}}>แจ้งซ่อมได้ทันที ระบบจะส่งต่อให้ช่างประเมินและดำเนินการ</div></div>
          <button className="btn btn-primary" onClick={()=>goTo("r-new")}><i className="fa-solid fa-plus"></i> แจ้งซ่อมใหม่</button>
        </div>
      </div>
      <div className="card">
        <div className="card-h"><div><h3>งานแจ้งซ่อมล่าสุดของฉัน</h3><div className="sub">{mine.length} รายการทั้งหมด</div></div><button className="btn btn-ghost btn-sm" onClick={()=>goTo("r-mine")}>ดูทั้งหมด <i className="fa-solid fa-arrow-right"></i></button></div>
        <div className="table-wrap">
          <table className="data">
            <thead><tr><th>เลขที่</th><th className="hide-on-mobile">วันที่</th><th>อาการ</th><th className="hide-on-mobile">หมวดหมู่</th><th>สถานะ</th></tr></thead>
            <tbody>
              {recent.map(r=>(<tr key={r.id}><td><span className="ticket-id">{r.running}</span></td><td className="hide-on-mobile" style={{color:"var(--muted)",whiteSpace:"nowrap"}}>{window.__DATA.fmtDate(r.createdAt)}</td><td><div className="cell-title">{r.title}</div></td><td className="hide-on-mobile"><CategoryChip categoryId={r.categoryId}/></td><td><Badge status={r.status}/></td></tr>))}
              {recent.length===0 && (<tr><td colSpan="5"><div className="empty"><i className="fa-solid fa-clipboard"></i><div className="t">ยังไม่มีรายการ</div><div>คลิก "แจ้งซ่อมใหม่" เพื่อเริ่มต้น</div></div></td></tr>)}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

function NewRequest({user,goTo}){
  const allProjects = React.useMemo(()=>{
    return window.userProjects(user);
  },[user]);

  const [f,setF] = React.useState({title:"",desc:"",categoryId:"",project:"",machineCode:"",siteId:""});
  const [loading,setLoading] = React.useState(false);

  const projectMachines = React.useMemo(()=>{ if(!f.project) return []; return (window.__DATA.machines||[]).filter(m=>m.project===f.project); },[f.project]);
  const filteredMachines = React.useMemo(()=>{ if(!f.categoryId) return projectMachines; return projectMachines.filter(m=>m.categoryId===f.categoryId); },[projectMachines,f.categoryId]);
  const projectCategories = React.useMemo(()=>{ const ids=new Set(projectMachines.map(m=>m.categoryId).filter(Boolean)); return (window.__DATA.categories||[]).filter(c=>ids.has(c.id)); },[projectMachines]);

  const onProjectChange = (p) => setF(prev=>({...prev,project:p,categoryId:"",machineCode:""}));
  const onCategoryChange = (cid) => setF(prev=>({...prev,categoryId:cid,machineCode:""}));

  const submit = async () => {
    if(!f.project){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาเลือกโครงการ/หน่วยงานก่อน"}); return; }
    if(!f.categoryId){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาเลือกหมวดหมู่"}); return; }
    if(!f.title||!f.desc){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาระบุอาการและรายละเอียดเพิ่มเติม"}); return; }
    setLoading(true);
    try{
      const repair = {siteId:f.siteId,title:f.title,desc:f.desc,project:f.project,categoryId:f.categoryId,status:"new",reporterId:user.id,reporterName:user.name,assignedId:"",cost:"",machineCode:f.machineCode};
      const saved = await window.api("createRepair",{repair});
      saved.createdAt = new Date(saved.createdAt);
      saved.timeline = [{status:"new",when:new Date(),by:user.name,note:"แจ้งเข้าระบบ"}];
      window.__DATA.repairs = [saved,...window.__DATA.repairs];
      setLoading(false);
      Swal.fire({icon:"success",title:"แจ้งซ่อมสำเร็จ!",html:`เลขที่ใบแจ้งซ่อม: <strong class="mono" style="color:#1E40AF">${saved.running}</strong>`,confirmButtonColor:"#1E40AF"}).then(()=>goTo(["Admin","Officer","Engineer"].includes(user.role)?"repairs":"r-mine"));
    }catch(err){ setLoading(false); Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  return (
    <>
    <Loading show={loading} text="กำลังบันทึก..."/>
    <div className="card">
      <div className="card-h"><div><h3>แบบฟอร์มแจ้งซ่อม</h3><div className="sub">ระบบจะออกเลขที่ใบแจ้งซ่อมให้อัตโนมัติหลังส่งแบบฟอร์ม</div></div></div>
      <div className="card-body">
        <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
          {[{n:1,l:"เลือกโครงการ",done:!!f.project},{n:2,l:"เลือกหมวดหมู่",done:!!f.categoryId,disabled:!f.project},{n:3,l:"เลือกเครื่องจักร",done:!!f.machineCode,disabled:!f.categoryId},{n:4,l:"รายละเอียดอาการ",done:!!f.title&&!!f.desc,disabled:!f.machineCode}].map(s=>(
            <div key={s.n} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:999,background:s.done?"rgba(16,185,129,.1)":s.disabled?"var(--bg)":"var(--accent-soft)",border:`1px solid ${s.done?"rgba(16,185,129,.3)":s.disabled?"var(--line)":"rgba(30,64,175,.2)"}`,color:s.done?"#047857":s.disabled?"var(--muted)":"var(--primary)",fontSize:13,fontWeight:500,opacity:s.disabled?0.55:1}}>
              <span style={{width:22,height:22,borderRadius:"50%",display:"grid",placeItems:"center",fontSize:11,background:s.done?"#10B981":s.disabled?"var(--line)":"var(--primary)",color:"#fff"}}>{s.done?<i className="fa-solid fa-check"></i>:s.n}</span>
              {s.l}
            </div>
          ))}
        </div>
        <div className="form-grid">
          <div className="form-field full">
            <label><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:20,height:20,borderRadius:"50%",background:"var(--primary)",color:"#fff",fontSize:11,display:"inline-grid",placeItems:"center",fontWeight:600}}>1</span>โครงการ/หน่วยงาน *</span></label>
            <select value={f.project} onChange={e=>onProjectChange(e.target.value)}><option value="">— กรุณาเลือกโครงการ —</option>{allProjects.map(p=>(<option key={p} value={p}>{p}</option>))}</select>
            <div className="hint">เลือกโครงการก่อน เพื่อกรองหมวดหมู่และเครื่องจักรในโครงการนั้น</div>
          </div>
          <div className="form-field full">
            <label><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:20,height:20,borderRadius:"50%",background:f.project?"var(--primary)":"var(--line)",color:"#fff",fontSize:11,display:"inline-grid",placeItems:"center",fontWeight:600}}>2</span>หมวดหมู่ *</span></label>
            <select value={f.categoryId} onChange={e=>onCategoryChange(e.target.value)} disabled={!f.project}><option value="">{!f.project?"— กรุณาเลือกโครงการก่อน —":projectCategories.length===0?"— ไม่พบหมวดหมู่ในโครงการนี้ —":"— เลือกหมวดหมู่ —"}</option>{projectCategories.map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}</select>
            {f.project&&projectCategories.length>0&&<div className="hint">พบ {projectCategories.length} หมวดหมู่ในโครงการ "{f.project}"</div>}
          </div>
          <div className="form-field full">
            <label><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:20,height:20,borderRadius:"50%",background:f.categoryId?"var(--primary)":"var(--line)",color:"#fff",fontSize:11,display:"inline-grid",placeItems:"center",fontWeight:600}}>3</span>เครื่องจักร</span></label>
            <select value={f.machineCode} onChange={e=>setF({...f,machineCode:e.target.value})} disabled={!f.categoryId}><option value="">{!f.project?"— กรุณาเลือกโครงการก่อน —":!f.categoryId?"— กรุณาเลือกหมวดหมู่ก่อน —":filteredMachines.length===0?"— ไม่พบเครื่องจักร —":"— เลือกเครื่องจักร —"}</option>{filteredMachines.map(m=>(<option key={m.id} value={m.code}>{m.code} — {m.name}{m.brand?` (${m.brand}${m.model?` ${m.model}`:""})`:"" }</option>))}</select>
            {f.categoryId&&filteredMachines.length>0&&<div className="hint">พบ {filteredMachines.length} เครื่องจักรในหมวดหมู่นี้</div>}
          </div>
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}><label>อาการ/ปัญหา *</label><input value={f.title} onChange={e=>setF({...f,title:e.target.value})} placeholder="เช่น มอเตอร์ไหม้ ใช้งานไม่ได้" /></div>
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}><label>เลขที่ใบแจ้งซ่อม (ที่ไซต์งาน)</label><input value={f.siteId} onChange={e=>setF({...f,siteId:e.target.value})} placeholder="เช่น WR-1234" /><div className="hint">ไม่บังคับ · กรอกเลขที่จากใบงานจริงที่ไซต์</div></div>
          <div className="form-field full" style={{opacity:f.machineCode?1:0.5,pointerEvents:f.machineCode?"auto":"none"}}><label>รายละเอียดเพิ่มเติม *</label><textarea value={f.desc} onChange={e=>setF({...f,desc:e.target.value})} placeholder="อธิบายอาการ ลักษณะปัญหา ช่วงเวลาที่เกิด ผลกระทบต่อการผลิต..." /></div>
        </div>
      </div>
      <div style={{padding:"14px 22px",borderTop:"1px solid var(--line)",display:"flex",justifyContent:"flex-end",gap:10,background:"#FAFBFC"}}>
        <button className="btn btn-ghost" onClick={()=>goTo(["Admin","Officer","Engineer"].includes(user.role)?"repairs":"r-dashboard")}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-paper-plane"></i> ส่งคำร้องแจ้งซ่อม</button>
      </div>
    </div>
    </>
  );
}

function MyRepairs({user}){
  const [rows,setRows] = React.useState(()=>{ if(user.role==="Engineer") return window.filterByUserProjects(user,window.__DATA.repairs,"project"); return window.__DATA.repairs.filter(r=>r.reporterId===user.id); });
  const [detail,setDetail] = React.useState(null);

  const cancel = (r) => {
    Swal.fire({title:"ยกเลิกคำร้อง?",text:`ต้องการยกเลิกคำร้อง "${r.running}" ใช่หรือไม่?`,icon:"warning",showCancelButton:true,confirmButtonText:"ยกเลิกคำร้อง",cancelButtonText:"ไม่",confirmButtonColor:"#EF4444"}).then(async res=>{
      if(res.isConfirmed){
        try{
          await window.api("updateRepairStatus",{id:r.id,status:"cancel",by:user.name,note:"ผู้แจ้งยกเลิกคำร้อง"});
          const upd=rows.map(x=>x.id===r.id?{...x,status:"cancel",timeline:[...x.timeline,{status:"cancel",when:new Date(),by:user.name,note:"ผู้แจ้งยกเลิกคำร้อง"}]}:x);
          setRows(upd); window.__DATA.repairs=window.__DATA.repairs.map(x=>x.id===r.id?upd.find(y=>y.id===x.id):x);
          Swal.fire({icon:"success",title:"ยกเลิกแล้ว",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
        }catch(err){ Swal.fire({icon:"error",title:"ไม่สำเร็จ",text:err.message}); }
      }
    });
  };

  return (
    <>
      <div className="card">
        <div className="filters"><div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>คำร้องแจ้งซ่อมของฉัน ({rows.length} รายการ)</div></div>
        <div className="table-wrap">
          <table className="data">
            <thead><tr><th>เลขที่</th><th className="hide-on-mobile">วันที่แจ้ง</th><th>อาการ/ปัญหา</th><th className="hide-on-mobile">หมวดหมู่</th><th>สถานะ</th><th className="hide-on-mobile">อัปเดตล่าสุด</th><th>จัดการ</th></tr></thead>
            <tbody>
              {rows.map(r=>{
                const last=r.timeline[r.timeline.length-1];
                return (<tr key={r.id}><td><span className="ticket-id">{r.running}</span></td><td className="hide-on-mobile" style={{color:"var(--muted)",whiteSpace:"nowrap"}}>{window.__DATA.fmtDate(r.createdAt)}</td><td><div className="cell-title">{r.title}</div></td><td className="hide-on-mobile"><CategoryChip categoryId={r.categoryId}/></td><td><Badge status={r.status}/></td><td className="hide-on-mobile" style={{color:"var(--muted)",fontSize:12,whiteSpace:"nowrap"}}>{window.__DATA.fmtDateTime(last.when)}</td><td><div className="row-actions"><button className="ia" onClick={()=>setDetail(r)}><i className="fa-solid fa-eye"></i></button>{r.status==="new"&&<button className="ia danger" onClick={()=>cancel(r)} title="ยกเลิกคำร้อง"><i className="fa-solid fa-ban"></i></button>}</div></td></tr>);
              })}
              {rows.length===0&&(<tr><td colSpan="7"><div className="empty"><i className="fa-solid fa-clipboard"></i><div className="t">ยังไม่มีคำร้อง</div><div>คลิก "แจ้งซ่อมใหม่" ในเมนูด้านซ้ายเพื่อเริ่มต้น</div></div></td></tr>)}
            </tbody>
          </table>
        </div>
      </div>
      {detail && <RepairDetail r={detail} user={user} onClose={()=>setDetail(null)} onQuick={()=>{}}/>}
    </>
  );
}
Object.assign(window,{ReporterDashboard,NewRequest,MyRepairs});
</script>

<script type="text/babel">
function TweaksPanel({open,onClose,density,onDensityChange}){
  if(!open) return null;
  return (
    <div className="tweaks-panel">
      <div className="tweaks-h">
        <div className="t"><i className="fa-solid fa-sliders"></i> Tweaks</div>
        <button className="x" onClick={onClose}><i className="fa-solid fa-xmark"></i></button>
      </div>
      <div className="tweaks-b">
        <div className="lbl">Table density</div>
        <div className="seg">
          <button className={density==="comfortable"?"on":""} onClick={()=>onDensityChange("comfortable")}>Comfortable</button>
          <button className={density==="compact"?"on":""} onClick={()=>onDensityChange("compact")}>Compact</button>
        </div>
      </div>
    </div>
  );
}
window.TweaksPanel = TweaksPanel;
</script>

<script type="text/babel">
const TWEAK_DEFAULTS = { "density": "comfortable", "defaultRole": "admin" };

function App(){
  const [user,setUser] = React.useState(null);
  const [page,setPage] = React.useState("dashboard");
  const [sbOpen,setSbOpen] = React.useState(false);
  const [tweakOpen,setTweakOpen] = React.useState(false);
  const [density,setDensity] = React.useState(TWEAK_DEFAULTS.density);
  const [booting,setBooting] = React.useState(true);
  const [bootErr,setBootErr] = React.useState(null);

  React.useEffect(()=>{
    (async()=>{
      try{
        await window.__DATA.bootstrap();
        setBooting(false);
      }catch(err){
        setBootErr(err.message||String(err));
        setBooting(false);
      }
    })();
  },[]);

  React.useEffect(()=>{
    const h = (e) => {
      if(e.data?.type==="__activate_edit_mode") setTweakOpen(true);
      else if(e.data?.type==="__deactivate_edit_mode") setTweakOpen(false);
    };
    window.addEventListener("message",h);
    window.parent.postMessage({type:"__edit_mode_available"},"*");
    return ()=>window.removeEventListener("message",h);
  },[]);

  React.useEffect(()=>{
    document.body.classList.toggle("density-compact",density==="compact");
  },[density]);

  React.useEffect(()=>{
    const s = localStorage.getItem("rms_user");
    if(s){
      try{
        const u = JSON.parse(s);
        const fresh = window.__DATA.users.find(x=>x.id===u.id);
        if(fresh) setUser(fresh);
      }catch(e){}
    }
  },[]);

  const login = (u) => {
    setUser(u); localStorage.setItem("rms_user",JSON.stringify(u));
    setPage(["Admin","Officer","Director"].includes(u.role) ? "dashboard" : u.role==="Technician" ? "dashboard" : "r-dashboard");
  };
  const logout = () => {
    Swal.fire({title:"ออกจากระบบ?",icon:"question",showCancelButton:true,confirmButtonText:"ออกจากระบบ",cancelButtonText:"ยกเลิก",confirmButtonColor:"#EF4444"}).then(r=>{
      if(r.isConfirmed){ setUser(null); localStorage.removeItem("rms_user"); }
    });
  };

  if(booting) return <div style={{display:"grid",placeItems:"center",minHeight:"100vh",gap:14,background:"var(--bg)",fontFamily:"Kanit"}}>
    <div className="spinner" style={{width:40,height:40,borderWidth:4}}></div>
    <div style={{color:"var(--muted)"}}>กำลังเชื่อมต่อ Firebase...</div>
  </div>;

  if(bootErr) return <div style={{display:"grid",placeItems:"center",minHeight:"100vh",padding:20,background:"var(--bg)"}}>
    <div className="card" style={{maxWidth:520,padding:28,textAlign:"center"}}>
      <i className="fa-solid fa-triangle-exclamation" style={{fontSize:36,color:"var(--danger)",marginBottom:10}}></i>
      <h3 style={{margin:"0 0 6px"}}>เชื่อมต่อ Firebase ไม่สำเร็จ</h3>
      <div style={{color:"var(--muted)",fontSize:13,marginBottom:14,wordBreak:"break-word"}}>{bootErr}</div>
      <div style={{color:"var(--muted)",fontSize:12.5,textAlign:"left",background:"#FAFBFC",border:"1px solid var(--line)",borderRadius:10,padding:14}}>
        <div style={{fontWeight:500,color:"var(--text)",marginBottom:6}}>ตรวจสอบ:</div>
        1. ไปที่ Firebase Console → Realtime Database → <strong>Rules</strong><br/>
        2. ตั้งค่า <span className="mono">{'"'.repeat(1)}.read{'"'.repeat(1)}: true, {'"'.repeat(1)}.write{'"'.repeat(1)}: true</span><br/>
        3. กด Publish แล้วโหลดหน้าใหม่
      </div>
      <button className="btn btn-primary" style={{marginTop:14}} onClick={()=>location.reload()}><i className="fa-solid fa-rotate"></i> ลองใหม่</button>
    </div>
  </div>;

  if(!user) return <Login onLogin={login}/>;

  const pageTitles = {
    "dashboard":{t:"แดชบอร์ด",c:"ภาพรวมและสถิติงานซ่อม"},
    "repairs":{t:"รายการแจ้งซ่อม",c:"จัดการและติดตามงานซ่อมทั้งหมด"},
    "users":{t:"จัดการผู้ใช้งาน",c:"Users · เพิ่ม / แก้ไข / ลบ"},
    "categories":{t:"จัดการหมวดหมู่งาน",c:"Categories · เพิ่ม / แก้ไข / ลบ"},
    "machines":{t:"ทะเบียนเครื่องจักร",c:"Machines · ข้อมูลจาก Firebase"},
    "doc-pj2":{t:"ปจ2 - เอกสารรับรองการตรวจสอบและทดสอบ",c:"ลิงค์ไฟล์เอกสารตามรายการเครื่องจักร"},
    "transfer-history":{t:"ประวัติการย้ายเครื่องจักร",c:"บันทึกการย้ายโครงการของเครื่องจักรทั้งหมด"},
    "projects":{t:"โครงการ",c:"Projects · จัดการข้อมูลโครงการทั้งหมด"},
    "r-dashboard":{t:"แดชบอร์ด",c:"สรุปงานแจ้งซ่อมของฉัน"},
    "r-new":{t:"แจ้งซ่อมใหม่",c:"กรอกแบบฟอร์มแจ้งซ่อม"},
    "r-mine":{t:"ติดตามสถานะ",c:"รายการแจ้งซ่อมของฉัน"},
  };
  const pt = pageTitles[page] || pageTitles.dashboard;

  const renderPage = () => {
    if(page==="dashboard") return <Dashboard user={user} goTo={setPage}/>;
    if(page==="repairs") return <Repairs user={user}/>;
    if(page==="users") return <Users user={user}/>;
    if(page==="categories") return <Categories user={user}/>;
    if(page==="machines") return <Machines user={user}/>;
    if(page==="doc-pj2") return <DocPJ2 user={user}/>;
    if(page==="transfer-history") return <MachineTransferHistory user={user}/>;
    if(page==="projects") return <Projects user={user}/>;
    if(page==="r-dashboard") return <ReporterDashboard user={user} goTo={setPage}/>;
    if(page==="r-new") return <NewRequest user={user} goTo={setPage}/>;
    if(page==="r-mine") return <MyRepairs user={user}/>;
    return null;
  };

  return (
    <div className="shell">
      <button className="sidebar-toggle" onClick={()=>setSbOpen(true)}><i className="fa-solid fa-bars"></i></button>
      <Sidebar user={user} active={page} onNav={setPage} onLogout={logout} open={sbOpen} onClose={()=>setSbOpen(false)}/>
      <main className="main">
        <div className="topbar">
          <div className="title"><h1>{pt.t}</h1><div className="crumb">{pt.c}</div></div>
          <div className="actions">
            <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหาทั้งระบบ..."/></div>
            <button className="btn btn-icon btn-ghost" title="Tweaks" onClick={()=>setTweakOpen(v=>!v)}><i className="fa-solid fa-sliders"></i></button>
            {(page==="repairs" && ["Admin","Officer","Engineer"].includes(user.role)) && (
              <button className="btn btn-primary" onClick={()=>setPage("r-new")}><i className="fa-solid fa-plus"></i> แจ้งซ่อมใหม่</button>
            )}
          </div>
        </div>
        {renderPage()}
      </main>
      <TweaksPanel open={tweakOpen} onClose={()=>setTweakOpen(false)} density={density} onDensityChange={setDensity}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
