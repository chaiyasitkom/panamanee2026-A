             </div>
             <div style="color:#64748B;font-size:12px">รายการที่ขอแก้</div>
             <div style="margin-top:2px">${esc(entityLabel)}${targetName ? " · <b>"+esc(targetName)+"</b>" : ""}</div>
             <div style="margin-top:10px;color:#64748B;font-size:12px">สิ่งที่เปลี่ยน (${changes.length} รายการ)</div>
             <div style="max-height:190px;overflow:auto;margin-top:4px">${rowsHtml}</div>
           </div>`,
    input: "textarea",
    inputLabel: "เหตุผลที่ต้องการแก้ไข",
    inputPlaceholder: "ระบุเหตุผล เช่น กรอกอาการผิด / ใส่เลขมิเตอร์ผิด",
    inputValidator: (v) => (!String(v||"").trim() ? "กรุณาระบุเหตุผลที่ต้องการแก้ไข" : null),
    showCancelButton: true,
    confirmButtonText: "ส่งคำขออนุมัติ", cancelButtonText: "ยกเลิก", confirmButtonColor: "#2563EB",
  });
  if(!r.isConfirmed) return false;

  try{
    await window.api("requestChange", { req:{
      action, payload, entityLabel, targetName, targetInfo, changes,
      project: project || window.getActiveProject(user) || "",
      reason: r.value,
      requesterId: user.id, requesterName: user.name, requesterRole: user.role,
    }});
    Swal.fire({
      icon:"success", title:"ส่งคำขอแก้ไขแล้ว",
      html:`ระบบแจ้งผู้ดูแลระบบ (Admin) แล้ว<br/><span style="color:#64748B;font-size:13px">ข้อมูลจะเปลี่ยนเมื่อได้รับอนุมัติ · ติดตามได้ที่เมนู "การแจ้งเตือน"</span>`,
      confirmButtonText:"รับทราบ",
    });
    return true;
  }catch(err){
    Swal.fire({icon:"error",title:"ส่งคำขอไม่สำเร็จ",text:err.message});
    return false;
  }
};

/**
 * ปุ่มลบทุกปุ่มในระบบเรียกฟังก์ชันนี้
 *   คืนค่า true  = ลบจริงแล้ว (Admin) → ให้หน้าจอตัดแถวออกได้เลย
 *   คืนค่า false = ยกเลิก หรือ ส่งคำขอไปรออนุมัติ → ห้ามตัดแถวออก
 */
// ยืนยันตัวตนซ้ำด้วยรหัสผ่านของบัญชีที่ล็อกอินอยู่ — ใช้ก่อนลบข้อมูลจริงทุกครั้ง
// คืน true = รหัสถูก · false = กดยกเลิก (รหัสผิดจะวนให้กรอกใหม่ในหน้าต่างเดิม)
window.confirmWithPassword = async function(user, {title, html, confirmText} = {}){
  if(!user || !user.id){ Swal.fire({icon:"error",title:"ไม่พบข้อมูลผู้ใช้งาน"}); return false; }
  const r = await Swal.fire({
    title: title || "ยืนยันตัวตนก่อนลบ",
    html: `<div style="text-align:left;font-size:13.5px">
             <div style="background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:8px;padding:10px 12px;margin-bottom:12px">
               <i class="fa-solid fa-shield-halved" style="margin-right:6px"></i>
               ${html || "การลบข้อมูลต้องกรอกรหัสผ่านของบัญชีคุณเพื่อยืนยันทุกครั้ง"}
             </div>
             <div style="color:#64748B;font-size:12px">บัญชี</div>
             <div style="margin-top:2px;font-weight:500">${user.name || ""} <span style="color:#64748B;font-weight:400">(${user.username || ""})</span></div>
           </div>`,
    icon: "warning",
    input: "password",
    inputLabel: "รหัสผ่านของคุณ",
    inputPlaceholder: "กรอกรหัสผ่านเพื่อยืนยัน",
    inputAttributes: { autocomplete:"current-password", "aria-label":"รหัสผ่านยืนยันการลบ" },
    showCancelButton: true,
    confirmButtonText: confirmText || "ยืนยันการลบ",
    cancelButtonText: "ยกเลิก",
    confirmButtonColor: "#EF4444",
    allowOutsideClick: () => !Swal.isLoading(),
    showLoaderOnConfirm: true,
    preConfirm: async (pw) => {
      if(!String(pw||"")){ Swal.showValidationMessage("กรุณากรอกรหัสผ่าน"); return false; }
      try{
        await window.api("verifyPassword", { userId:user.id, password:pw });
        return true;
      }catch(err){
        Swal.showValidationMessage(err.message || "ยืนยันรหัสผ่านไม่สำเร็จ");
        return false;
      }
    },
  });
  return !!(r.isConfirmed && r.value);
};

window.deleteWithApproval = async function(opts){
  const {
    user, action, payload = {},
    entityLabel, targetName = "", targetInfo = "", project = "",
    confirmHtml, warnHtml,
  } = opts || {};
  if(!user){ Swal.fire({icon:"error",title:"ไม่พบข้อมูลผู้ใช้งาน"}); return false; }

  const label = entityLabel || "ข้อมูล";
  const nameLine = targetName ? `<b>${targetName}</b>` : "";
  const infoLine = targetInfo ? `<div style="color:#64748B;font-size:13px;margin-top:2px">${targetInfo}</div>` : "";

  // ── Admin: ลบได้ทันที ────────────────────────────────────────────────
  if(user.role === "Admin"){
    const r = await Swal.fire({
      title: `ลบ${label}?`,
      html: confirmHtml || `${nameLine}${infoLine}<div style="color:#64748B;font-size:13px;margin-top:6px">${warnHtml || "การลบไม่สามารถกู้คืนได้"}</div>`,
      icon: "warning", showCancelButton: true,
      confirmButtonText: "ใช่, ลบเลย", cancelButtonText: "ยกเลิก", confirmButtonColor: "#EF4444",
    });
    if(!r.isConfirmed) return false;
    // Admin ลบได้ทันทีโดยไม่ต้องรออนุมัติ จึงต้องกรอกรหัสผ่านยืนยันตัวตนซ้ำทุกครั้ง กันลบพลาด/กันคนอื่นใช้เครื่องที่เปิดค้างไว้
    const ok = await window.confirmWithPassword(user, {
      html: `ยืนยันการลบ<b> ${label}${targetName ? " · " + targetName : ""}</b><div style="margin-top:4px">การลบไม่สามารถกู้คืนได้</div>`,
    });
    if(!ok) return false;
    try{
      const res = await window.api(action, { ...payload, role:"Admin", by:{id:user.id,name:user.name,role:user.role}, targetName });
      window.applyDeleteLocally(action, payload);
      Swal.fire({icon:"success",title:"ลบข้อมูลแล้ว",timer:1300,showConfirmButton:false,toast:true,position:"top-end"});
      return res || true;
    }catch(err){
      Swal.fire({icon:"error",title:"ลบไม่สำเร็จ",text:err.message});
      return false;
    }
  }

  // ── Role อื่น: ส่งคำขออนุมัติ ─────────────────────────────────────────
  const r = await Swal.fire({
    title: "ขออนุมัติลบข้อมูล",
    html: `<div style="text-align:left;font-size:14px">
             <div style="background:#FEF3C7;border:1px solid #FDE68A;color:#92400E;border-radius:8px;padding:10px 12px;margin-bottom:12px">
               <i class="fa-solid fa-shield-halved" style="margin-right:6px"></i>
               การลบข้อมูลต้องได้รับอนุมัติจากผู้ดูแลระบบ (Admin) ก่อนเสมอ
             </div>
             <div style="color:#64748B;font-size:12px">รายการที่ขอลบ</div>
             <div style="margin-top:2px">${label}${nameLine ? " · " + nameLine : ""}</div>
             ${infoLine}
           </div>`,
    input: "textarea",
    inputLabel: "เหตุผลที่ต้องการลบ",
    inputPlaceholder: "ระบุเหตุผล เช่น บันทึกซ้ำ / กรอกผิด / ยกเลิกงาน",
    inputAttributes: { "aria-label": "เหตุผลที่ต้องการลบ" },
    inputValidator: (v) => (!String(v||"").trim() ? "กรุณาระบุเหตุผลที่ต้องการลบ" : null),
    showCancelButton: true,
    confirmButtonText: "ส่งคำขออนุมัติ", cancelButtonText: "ยกเลิก", confirmButtonColor: "#2563EB",
  });
  if(!r.isConfirmed) return false;

  try{
    await window.api("requestDelete", { req:{
      action, payload, entityLabel: label,
      targetName, targetInfo,
      project: project || window.getActiveProject(user) || "",
      reason: r.value,
      requesterId: user.id, requesterName: user.name, requesterRole: user.role,
    }});
    Swal.fire({
      icon:"success", title:"ส่งคำขอลบแล้ว",
      html:`ระบบแจ้งผู้ดูแลระบบ (Admin) แล้ว<br/><span style="color:#64748B;font-size:13px">ข้อมูลจะถูกลบเมื่อได้รับอนุมัติ · ติดตามได้ที่เมนู "การแจ้งเตือน"</span>`,
      confirmButtonText:"รับทราบ",
    });
  }catch(err){
    Swal.fire({icon:"error",title:"ส่งคำขอไม่สำเร็จ",text:err.message});
  }
  return false;
};
</script>

<script type="text/babel">
// หน้า "การแจ้งเตือน" — Admin ใช้อนุมัติ/ปฏิเสธคำขอลบ · Role อื่นใช้ติดตามคำขอของตัวเอง
const DELREQ_STATUS = {
  pending:  { label:"รออนุมัติ",   color:"#B45309", bg:"#FEF3C7", icon:"fa-hourglass-half" },
  approved: { label:"อนุมัติแล้ว", color:"#047857", bg:"#D1FAE5", icon:"fa-circle-check" },
  rejected: { label:"ไม่อนุมัติ",  color:"#B91C1C", bg:"#FEE2E2", icon:"fa-circle-xmark" },
};

// ข้อความในคำขอมาจากผู้ใช้ (ชื่อรายการ/เหตุผล/ค่าที่แก้) และถูกยัดลง html ของ Swal — ต้อง escape ก่อนเสมอ
// ชื่อ escReq ไม่ใช่ esc เพราะบล็อกแผนที่ประกาศ const esc ไว้แล้ว — ชนกันทั้งสองตัวจะพังทั้งหน้า
const escReq = (s) => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function DeleteApprovals({user}){
  const { mine } = window.useDeleteRequests(user);
  const [tab,setTab] = React.useState("pending");
  const [busy,setBusy] = React.useState("");
  const [q,setQ] = React.useState("");
  const isAdmin = user.role === "Admin";

  React.useEffect(()=>{ window.__DELREQ.markSeen(user); },[user && user.id]);

  const counts = {
    pending:  mine.filter(r=>r.status==="pending").length,
    approved: mine.filter(r=>r.status==="approved").length,
    rejected: mine.filter(r=>r.status==="rejected").length,
  };

  const kw = q.trim().toLowerCase();
  const rows = mine
    .filter(r => tab==="all" || r.status===tab)
    .filter(r => !kw || [r.entityLabel,r.targetName,r.targetInfo,r.requesterName,r.reason,r.project].some(v=>String(v||"").toLowerCase().includes(kw)));

  const approve = async (r) => {
    const isEdit = r.kind === "edit";
    const changeHtml = isEdit && (r.changes||[]).length
      ? `<div style="margin-top:8px;color:#64748B;font-size:12px">สิ่งที่จะเปลี่ยน</div>
         <div style="max-height:170px;overflow:auto;margin-top:2px">${(r.changes||[]).map(c=>`
           <div style="padding:5px 0;border-bottom:1px dashed #E2E8F0">
             <div style="font-size:12px;color:#64748B">${escReq(c.label)}</div>
             <div style="font-size:13px"><span style="color:#B91C1C;text-decoration:line-through">${escReq(c.from)}</span>
               <i class="fa-solid fa-arrow-right" style="margin:0 6px;color:#94A3B8;font-size:10px"></i>
               <span style="color:#047857;font-weight:500">${escReq(c.to)}</span></div>
           </div>`).join("")}</div>`
      : "";
    const res = await Swal.fire({
      title: isEdit ? "อนุมัติให้แก้ไขข้อมูล?" : "อนุมัติให้ลบข้อมูล?",
      html:`<div style="text-align:left;font-size:14px">
              <div><b>${escReq(r.entityLabel||"ข้อมูล")}</b> · ${escReq(r.targetName||"-")}</div>
              <div style="color:#64748B;font-size:13px;margin-top:4px">ผู้ขอ: ${escReq(r.requesterName||"-")} (${escReq(r.requesterRole||"-")})</div>
              <div style="color:#64748B;font-size:13px">เหตุผล: ${escReq(r.reason||"-")}</div>
              ${changeHtml}
              <div style="color:${isEdit?"#1D4ED8":"#B91C1C"};font-size:13px;margin-top:8px">${isEdit?"เมื่ออนุมัติ ข้อมูลจะถูกแก้ตามรายการด้านบนทันที":"เมื่ออนุมัติ ข้อมูลจะถูกลบทันทีและกู้คืนไม่ได้"}</div>
            </div>`,
      icon:"warning", showCancelButton:true,
      input:"text", inputLabel:"หมายเหตุ (ถ้ามี)", inputPlaceholder:"เช่น ตรวจสอบแล้วถูกต้อง",
      confirmButtonText: isEdit ? "อนุมัติและแก้ไข" : "อนุมัติและลบ",
      cancelButtonText:"ยกเลิก", confirmButtonColor: isEdit ? "#2563EB" : "#EF4444",
    });
    if(!res.isConfirmed) return;
    // อนุมัติลบ = ลบจริงทันที จึงต้องยืนยันรหัสผ่านเหมือนตอน Admin กดลบเองที่หน้าอื่น (การแก้ไขย้อนกลับได้ ไม่ต้องยืนยันซ้ำ)
    if(!isEdit){
      const ok = await window.confirmWithPassword(user, {
        html: `ยืนยันการอนุมัติลบ<b> ${escReq(r.entityLabel||"ข้อมูล")} · ${escReq(r.targetName||"-")}</b><div style="margin-top:4px">ข้อมูลจะถูกลบทันทีและกู้คืนไม่ได้</div>`,
        confirmText: "ยืนยันอนุมัติและลบ",
      });
      if(!ok) return;
    }
    setBusy(r.id);
    try{
      await window.api("approveDelete",{ id:r.id, note:res.value||"", by:{id:user.id,name:user.name,role:user.role} });
      if(isEdit) window.applyEditLocally(r.action, r.payload||{});
      else window.applyDeleteLocally(r.action, r.payload||{});
      Swal.fire({icon:"success",title:isEdit?"อนุมัติและแก้ไขข้อมูลแล้ว":"อนุมัติและลบข้อมูลแล้ว",timer:1600,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){
      Swal.fire({icon:"error",title:"อนุมัติไม่สำเร็จ",text:err.message});
    }finally{ setBusy(""); }
  };

  const reject = async (r) => {
    const res = await Swal.fire({
      title:"ไม่อนุมัติคำขอนี้?",
      html:`<div style="text-align:left;font-size:14px"><b>${r.entityLabel||"ข้อมูล"}</b> · ${r.targetName||"-"}<div style="color:#64748B;font-size:13px;margin-top:4px">ผู้ขอ: ${r.requesterName||"-"}</div></div>`,
      icon:"question", showCancelButton:true,
      input:"text", inputLabel:"เหตุผลที่ไม่อนุมัติ", inputPlaceholder:"แจ้งให้ผู้ขอทราบ",
      inputValidator:(v)=>(!String(v||"").trim() ? "กรุณาระบุเหตุผล" : null),
      confirmButtonText:"ไม่อนุมัติ", cancelButtonText:"ยกเลิก", confirmButtonColor:"#64748B",
    });
    if(!res.isConfirmed) return;
    setBusy(r.id);
    try{
      await window.api("rejectDelete",{ id:r.id, note:res.value||"", by:{id:user.id,name:user.name,role:user.role} });
      Swal.fire({icon:"success",title:"บันทึกแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){
      Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message});
    }finally{ setBusy(""); }
  };

  const canPush = typeof Notification !== "undefined";
  const [pushState,setPushState] = React.useState(canPush ? Notification.permission : "unsupported");
  const enablePush = async () => {
    try{ const p = await Notification.requestPermission(); setPushState(p); }catch(e){}
  };

  const tabs = [
    {key:"pending",  label:"รออนุมัติ",   n:counts.pending},
    {key:"approved", label:"อนุมัติแล้ว", n:counts.approved},
    {key:"rejected", label:"ไม่อนุมัติ",  n:counts.rejected},
    {key:"all",      label:"ทั้งหมด",     n:mine.length},
  ];

  return (
    <>
      <div className="card" style={{marginBottom:16}}>
        <div className="card-body" style={{display:"flex",gap:12,alignItems:"flex-start",flexWrap:"wrap"}}>
          <div style={{width:42,height:42,borderRadius:11,display:"grid",placeItems:"center",background:"#FEF3C7",color:"#B45309",flex:"0 0 auto"}}>
            <i className="fa-solid fa-shield-halved"></i>
          </div>
          <div style={{flex:1,minWidth:220}}>
            <div style={{fontWeight:600}}>{isAdmin ? "คำขออนุมัติลบ / แก้ไขข้อมูล" : "คำขอของฉัน"}</div>
            <div style={{color:"var(--muted)",fontSize:13,marginTop:2}}>
              {isAdmin
                ? "การลบข้อมูลของผู้ใช้งานอื่น และการแก้ไขใบแจ้งซ่อมของผู้แจ้ง ต้องผ่านการอนุมัติที่นี่ · ข้อมูลจะเปลี่ยนเมื่อกดอนุมัติเท่านั้น"
                : "การลบข้อมูล และการแก้ไขใบแจ้งซ่อม ต้องได้รับอนุมัติจากผู้ดูแลระบบ (Admin) ก่อน"}
            </div>
          </div>
          {isAdmin && canPush && pushState==="default" && (
            <button className="btn btn-ghost" onClick={enablePush} title="เปิดแจ้งเตือนของเบราว์เซอร์">
              <i className="fa-solid fa-bell"></i> เปิดแจ้งเตือนเบราว์เซอร์
            </button>
          )}
          {isAdmin && canPush && pushState==="granted" && (
            <span className="badge" style={{background:"#D1FAE5",color:"#047857"}}><i className="fa-solid fa-bell" style={{marginRight:5}}></i>แจ้งเตือนเปิดอยู่</span>
          )}
        </div>
      </div>

      <div className="card">
        <div className="filters">
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {tabs.map(t=>(
              <button key={t.key} className={`btn btn-sm ${tab===t.key?"btn-primary":"btn-ghost"}`} onClick={()=>setTab(t.key)}>
                {t.label}{t.n>0 && <span style={{marginLeft:6,opacity:.85}}>({t.n})</span>}
              </button>
            ))}
          </div>
          <div className="spacer"></div>
          <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหา ชนิดข้อมูล / ชื่อรายการ / ผู้ขอ / เหตุผล..." /></div>
        </div>

        <div className="card-body" style={{display:"grid",gap:12}}>
          {rows.length===0 && (
            <div className="empty">
              <i className="fa-solid fa-inbox"></i>
              <div className="t">{tab==="pending" ? "ไม่มีคำขอรออนุมัติ" : "ไม่มีรายการ"}</div>
              <div>{isAdmin ? "เมื่อมีผู้ใช้งานขอลบหรือขอแก้ไขข้อมูล จะแสดงที่นี่ทันที" : "คำขอลบ/แก้ไขข้อมูลของคุณจะแสดงที่นี่"}</div>
            </div>
          )}
          {rows.map(r=>{
            const st = DELREQ_STATUS[r.status] || DELREQ_STATUS.pending;
            const isEdit = r.kind === "edit";
            return (
              <div key={r.id} style={{border:"1px solid var(--line)",borderLeft:`4px solid ${st.color}`,borderRadius:10,padding:"12px 14px",background:"#fff"}}>
                <div style={{display:"flex",gap:10,alignItems:"flex-start",flexWrap:"wrap"}}>
                  <div style={{flex:1,minWidth:240}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <span className="badge" style={{background:st.bg,color:st.color}}>
                        <i className={`fa-solid ${st.icon}`} style={{marginRight:5}}></i>{st.label}
                      </span>

                    {r.status!=="pending" && (

                        {st.label}โดย {r.decidedByName||"-"} · {window.__DATA.fmtDateTime(r.decidedAt)}
                        {r.decideNote ? ` · ${r.decideNote}` : ""}

                    )}
                    {r.status==="pending" && r.lastError && (
                      <div style={{fontSize:12.5,color:"#B91C1C",marginTop:6}}>
                        <i className="fa-solid fa-triangle-exclamation" style={{marginRight:5}}></i>ลบไม่สำเร็จครั้งล่าสุด: {r.lastError}
                      </div>
                    )}

                  {isAdmin && r.status==="pending" && (
                    <div style={{display:"flex",gap:8,alignItems:"center"}}>
                      <button className="btn btn-sm btn-ghost" disabled={busy===r.id} onClick={()=>reject(r)}>
                        <i className="fa-solid fa-xmark"></i> ไม่อนุมัติ
                      </button>
                      <button className="btn btn-sm btn-primary" disabled={busy===r.id} style={isEdit?undefined:{background:"#EF4444",borderColor:"#EF4444"}} onClick={()=>approve(r)}>
                        {busy===r.id
                          ? <><div className="spinner" style={{width:13,height:13,borderWidth:2}}></div> {isEdit?"กำลังแก้ไข...":"กำลังลบ..."}</>
                          : <><i className="fa-solid fa-check"></i> {isEdit?"อนุมัติและแก้ไข":"อนุมัติและลบ"}</>}
                      </button>
                    </div>

            );
          })}
        </div>

  );
}

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

function Badge({status}){
  const s = window.getStatus(status);
  return <span className={`badge ${s.className}`}><span className="dot"></span>{s.label}</span>;
}
function CategoryChip({categoryId}){
  const c = window.getCategory(categoryId);
  return <span className="cat-chip" style={{background:c.color+"22",color:c.color}}><i className={`fa-solid ${c.icon}`}></i>{c.name}</span>;
}
function Avatar({name,size=28}){
  const bg = window.avatarColor(name);
  return <span className="avatar-xs" style={{background:bg,width:size,height:size}}>{window.initials(name)}</span>;
}
// อาการ/ปัญหาในตาราง — หนึ่งอาการต่อหนึ่งบรรทัด · ข้อความยาวตัดขึ้นบรรทัดใหม่แทนที่จะล้นหรือถูกตัดหาย
// (r.title เก็บหลายอาการคั่นด้วย \n ซึ่ง HTML จะยุบเป็นช่องว่างถ้าไม่แยกบรรทัดให้)
function ProblemLines({title,max=0}){
  const list = String(title||"").split("\n").map(s=>s.trim()).filter(Boolean);
  if(!list.length) return <span style={{color:"var(--muted)"}}>—</span>;
  const shown = max>0 ? list.slice(0,max) : list;
  return (
    <div style={{display:"grid",gap:3}}>
      {shown.map((t,i)=>(
        <div key={i} style={{display:"flex",gap:5,alignItems:"baseline",lineHeight:1.4,overflowWrap:"anywhere",wordBreak:"break-word"}}>
          {list.length>1 && <span style={{color:"var(--muted)",fontSize:11.5,flexShrink:0}}>{i+1}.</span>}
          <span style={{flex:1,minWidth:0}}>{t}</span>
        </div>
      ))}
      {shown.length<list.length && <div style={{color:"var(--muted)",fontSize:11.5}}>+ อีก {list.length-shown.length} อาการ</div>}
    </div>
  );
}
// ชื่อโครงการ + รหัสโครงการ (รหัสเดียวกับที่ใช้ออกเลขที่ใบแจ้งซ่อม)
// หน้าเว็บแสดงชื่อย่อ · เอาเมาส์ชี้เพื่อดูชื่อเต็ม (เอกสารใช้ชื่อเต็มเสมอ)
function ProjectLabel({name}){
  if(!name) return <span style={{color:"var(--muted)"}}>—</span>;
  const short = window.projectShort(name);
  const isCode = short !== name;
  return <span className={isCode?"mono":""} title={name} style={isCode?{fontWeight:500}:undefined}>{short}</span>;
}
// ── ไซต์งานย่อยของโครงการ (เช่น Rig1 / Rig2) — ใช้ร่วมกันทุกหน้า ─────────────
// ตั้งรายชื่อไซต์ได้ที่หน้า "โครงการ" → แก้ไข → ไซต์งานย่อย
// โครงการที่ยังไม่ได้ตั้งไซต์ย่อย ช่องนี้จะซ่อนตัวเองไปเลย ฟอร์มจะได้ไม่รก
// showWhenEmpty = แสดงช่องเสมอแม้โครงการยังไม่มีไซต์ย่อย (ใช้ในหน้าทะเบียน เพื่อให้รู้ว่ามีฟิลด์นี้อยู่และตั้งค่าที่ไหน)
function SubSiteField({project,value,onChange,className="form-field",style,label,hint,disabled,placeholder,showWhenEmpty}){
  const sites = window.projectSites(project);
  const legacy = value && !sites.includes(value);   // ไซต์ที่ถูกลบ/เปลี่ยนชื่อทีหลัง — ต้องคงค่าเดิมไว้ ไม่ให้หายตอนแก้ไข
  if(!sites.length && !legacy && !showWhenEmpty) return null;
  const empty = !sites.length && !legacy;
  return (
    <div className={className} style={style}>
      <label><i className="fa-solid fa-sitemap" style={{color:"var(--primary)",marginRight:6}}></i>{label||"ไซต์งานย่อย"}</label>
      <select value={value||""} onChange={e=>onChange(e.target.value)} disabled={disabled||empty}>
        <option value="">{empty ? (project ? "— โครงการนี้ยังไม่มีไซต์งานย่อย —" : "— เลือกโครงการก่อน —") : (placeholder||"— ทั้งโครงการ (ไม่ระบุไซต์) —")}</option>
        {sites.map(s=><option key={s} value={s}>{s}</option>)}
        {legacy && <option value={value}>{value} (ไม่มีในโครงการแล้ว)</option>}
      </select>
      {empty && project
        ? <div className="hint" style={{color:"#B45309"}}><i className="fa-solid fa-circle-info" style={{marginRight:5}}></i>เพิ่มไซต์งานย่อย (เช่น Rig1, Rig2) ได้ที่เมนู <b>โครงการ</b> → แก้ไขโครงการนี้ → ไซต์งานย่อย</div>
        : (hint && <div className="hint">{hint}</div>)}
    </div>
  );
}

// ป้ายไซต์งานย่อยสำหรับตาราง/การ์ด — ไม่มีค่าก็ไม่แสดงอะไรเลย
function SubSiteTag({value,project,style}){
  if(!value) return null;
  const p = (window.__DATA.projects||[]).find(x=>x.name===project);
  const c = (p && p.color) || "#7C3AED";
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"1px 8px",borderRadius:6,background:c+"18",color:c,fontSize:11.5,fontWeight:500,whiteSpace:"nowrap",...(style||{})}}>
      <i className="fa-solid fa-sitemap" style={{fontSize:9,opacity:.8}}></i>{value}
    </span>
  );
}

function Modal({open,onClose,title,children,footer,size=""}){
  useEffect(()=>{
    if(!open) return;
    const h=(e)=>{ if(e.key==="Escape") onClose(); };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[open,onClose]);
  if(!open) return null;
  return (
    <div className="modal-scrim" onClick={onClose}>
      <div className={`modal ${size}`} onClick={e=>e.stopPropagation()}>
        <div className="modal-h"><h3>{title}</h3><button className="close" onClick={onClose}><i className="fa-solid fa-xmark"></i></button></div>
        <div className="modal-b">{children}</div>
        {footer && <div className="modal-f">{footer}</div>}
      </div>
    </div>
  );
}
function Loading({show,text="กำลังโหลด..."}){
  if(!show) return null;
  return <div className="loading-scrim"><div className="loading-box"><div className="spinner"></div><span>{text}</span></div></div>;
}
function simulate(ms=500){ return new Promise(r=>setTimeout(r,ms)); }
Object.assign(window, { Badge, CategoryChip, Avatar, ProjectLabel, Modal, Loading, simulate });
</script>

<script type="text/babel">
// ปุ่มติดตั้งแอปบนหน้า login
//   Android/Chrome/Edge → กดแล้วขึ้นกล่องติดตั้งของระบบเลย (ไม่ต้องโหลดไฟล์ ไม่ต้องผ่านสโตร์)
//   iPhone/iPad         → Safari ไม่มี API ติดตั้ง ต้องบอกวิธี "แชร์ → เพิ่มไปยังหน้าจอโฮม"
//   เปิดจากแอปที่ติดตั้งแล้ว → ซ่อนปุ่มไปเลย
function InstallAppButton(){
  const [,force] = React.useReducer(x=>x+1,0);
  const [busy,setBusy] = React.useState(false);
  React.useEffect(()=>window.__pwa.on(force),[]);

  const pwa = window.__pwa;
  if(pwa.isStandalone() || pwa.installed) return null;

  const canInstallNow = !!pwa.prompt;
  // บนคอมที่ยังไม่เข้าเงื่อนไขติดตั้ง ไม่ต้องรกหน้าจอ — โชว์เฉพาะมือถือหรือเมื่อพร้อมติดตั้งจริง
  if(!canInstallNow && !pwa.isMobile()) return null;

  const iosHowTo = () => Swal.fire({
    icon:"info",
    title:"ติดตั้งบน iPhone / iPad",
    html:`<div style="text-align:left;font-size:14px;line-height:1.9">
            <div>1. กดปุ่ม <b>แชร์</b> <i class="fa-solid fa-arrow-up-from-bracket" style="color:#1E40AF"></i> ที่แถบล่างของ Safari</div>
            <div>2. เลื่อนหาแล้วกด <b>เพิ่มไปยังหน้าจอโฮม</b></div>
            <div>3. กด <b>เพิ่ม</b> มุมขวาบน</div>
            <div style="margin-top:10px;color:#64748B;font-size:13px">
              จะได้ไอคอนแอปบนหน้าจอ เปิดใช้งานได้เหมือนแอปทั่วไป
            </div>
          </div>`,
    confirmButtonText:"เข้าใจแล้ว", confirmButtonColor:"#1E40AF",
  });

  const androidHowTo = () => Swal.fire({
    icon:"info",
    title:"ติดตั้งแอป",
    html:`<div style="text-align:left;font-size:14px;line-height:1.9">
            <div>1. กดปุ่มเมนู <b>⋮</b> มุมขวาบนของเบราว์เซอร์</div>
            <div>2. เลือก <b>ติดตั้งแอป</b> หรือ <b>เพิ่มลงในหน้าจอหลัก</b></div>
            <div style="margin-top:10px;color:#64748B;font-size:13px">
              ถ้าไม่เจอเมนูนี้ ให้เปิดเว็บด้วย Chrome แล้วลองใหม่อีกครั้ง
            </div>
          </div>`,
    confirmButtonText:"เข้าใจแล้ว", confirmButtonColor:"#1E40AF",
  });

  const click = async () => {
    if(pwa.isIOS()) return iosHowTo();
    if(!canInstallNow) return androidHowTo();
    setBusy(true);
    try{
      const outcome = await pwa.install();
      if(outcome === "accepted"){
        Swal.fire({icon:"success",title:"ติดตั้งแอปแล้ว",text:"เปิดใช้งานจากไอคอนบนหน้าจอมือถือได้เลย",timer:2600,showConfirmButton:false,toast:true,position:"top-end"});
      }else if(outcome === "unavailable"){
        androidHowTo();
      }
    }finally{ setBusy(false); }
  };

  return (
    <button type="button" onClick={click} disabled={busy}
      style={{width:"100%",marginTop:12,padding:"12px 14px",borderRadius:12,border:"1.5px solid var(--primary)",
              background:"var(--accent-soft)",color:"var(--primary)",fontFamily:"Kanit",fontSize:14.5,fontWeight:500,
              cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:9}}>
      <i className={`fa-solid ${busy?"fa-spinner fa-spin":"fa-mobile-screen-button"}`}></i>
      {canInstallNow ? "ติดตั้งแอปบนมือถือ" : "เปิดบนมือถือ · วิธีติดตั้งแอป"}
    </button>
  );
}

function Login({onLogin}){

        <div className="ow-hero">

          <div className="ow-modules">

            })}
          </div>

        <div className="ow-foot">
          <span><i className="fa-solid fa-shield-halved"></i> เชื่อมต่อ Firebase แบบเรียลไทม์</span>
          <span>© 2026 · v3.011</span>
        </div>
      </div>

      {/* ===== Auth side ===== */}
      <div className="ow-auth">
        <form className="ow-card" onSubmit={submit}>
          <div className="ow-card-badge is-img"><img src={window.PNM_LOGO_DATAURL} alt="โลโก้ พานามณี" /></div>
          <h2>เข้าสู่พื้นที่ทำงาน</h2>
          <p className="ow-card-sub">ลงชื่อเข้าใช้เพื่อเลือกระบบงานและโครงการของคุณ</p>

          <label className="ow-field">
            <span className="ow-field-label">ชื่อผู้ใช้</span>
            <span className="ow-input">
              <i className="fa-solid fa-user"></i>
              <input type="text" value={username} onChange={e=>setUsername(e.target.value)}
                placeholder="ชื่อผู้ใช้" autoComplete="username" />
            </span>
          </label>

          <label className="ow-field">
            <span className="ow-field-label">รหัสผ่าน</span>
            <span className="ow-input">
              <i className="fa-solid fa-lock"></i>
              <input type={showPw?"text":"password"} value={password} onChange={e=>setPassword(e.target.value)}
                placeholder="รหัสผ่าน" autoComplete="current-password" />
              <button type="button" className="ow-eye" onClick={()=>setShowPw(v=>!v)}
                title={showPw?"ซ่อนรหัสผ่าน":"แสดงรหัสผ่าน"} aria-label="สลับการแสดงรหัสผ่าน">
                <i className={`fa-solid ${showPw?"fa-eye-slash":"fa-eye"}`}></i>
              </button>
            </span>
          </label>

          <button className="ow-submit" type="submit">
            <i className="fa-solid fa-arrow-right-to-bracket"></i> เข้าสู่ระบบ
          </button>

          <InstallAppButton />

          <div className="ow-hint">
            <i className="fa-solid fa-circle-info"></i>
            <span>หลังเข้าสู่ระบบ คุณจะเลือกระบบงานที่ต้องการทำงานได้ทันที</span>
          </div>
        </form>
      </div>
    </div>
  );
}
window.Login = Login;
</script>

<script type="text/babel">
// ตัดขอบว่างรอบลายเซ็น + ย่อให้กว้างไม่เกิน 600px → PNG พื้นใส
// dropWhite = รูปที่อัปโหลด (สแกน/ถ่ายบนกระดาษขาว) — ทำพื้นสีอ่อนให้ใส
function sigCanvasToDataUrl(src, dropWhite){
  const w = src.width, h = src.height;
  const ctx = src.getContext("2d");
  const img = ctx.getImageData(0,0,w,h);
  const d = img.data;
  let minX=w, minY=h, maxX=-1, maxY=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i = (y*w+x)*4;
    if(dropWhite && d[i+3]>0 && (d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)>185) d[i+3]=0;
    if(d[i+3]>20){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  }
  if(maxX<0) return "";
  if(dropWhite) ctx.putImageData(img,0,0);
  const pad = 6;
  minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad); maxX=Math.min(w-1,maxX+pad); maxY=Math.min(h-1,maxY+pad);
  const cw = maxX-minX+1, ch = maxY-minY+1;
  const scale = Math.min(1, 600/cw);
  const out = document.createElement("canvas");
  out.width = Math.round(cw*scale); out.height = Math.round(ch*scale);
  out.getContext("2d").drawImage(src, minX, minY, cw, ch, 0, 0, out.width, out.height);
  return out.toDataURL("image/png");
}

function SignaturePad({onCancel,onDone}){
  const ref = React.useRef(null);
  const drawing = React.useRef(false);
  const [empty,setEmpty] = React.useState(true);
  React.useEffect(()=>{
    const c = ref.current;
    const r = c.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    c.width = Math.round(r.width*dpr); c.height = Math.round(r.height*dpr);
    const ctx = c.getContext("2d");
    ctx.scale(dpr,dpr); ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0B1F5C";
  },[]);
  const pos = e => { const r = ref.current.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  const down = e => { e.preventDefault(); ref.current.setPointerCapture(e.pointerId); drawing.current = true; const ctx=ref.current.getContext("2d"); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+0.1,y+0.1); ctx.stroke(); setEmpty(false); };
  const move = e => { if(!drawing.current) return; const ctx=ref.current.getContext("2d"); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  const up = () => { drawing.current = false; };
  const clear = () => { const c=ref.current; c.getContext("2d").clearRect(0,0,c.width,c.height); setEmpty(true); };
  return (
    <div>
      <canvas ref={ref} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
        style={{width:"100%",height:160,border:"1.5px dashed #94A3B8",borderRadius:8,background:"#fff",touchAction:"none",cursor:"crosshair",display:"block"}}/>
      <div style={{fontSize:11.5,color:"var(--muted)",margin:"5px 0 8px"}}>ใช้นิ้วหรือเมาส์เซ็นในกรอบ</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button className="btn btn-ghost btn-sm" onClick={clear} disabled={empty}><i className="fa-solid fa-eraser"></i> ล้าง</button>
        <div style={{flex:1}}></div>
        <button className="btn btn-ghost btn-sm" onClick={onCancel}>ยกเลิก</button>
        <button className="btn btn-primary btn-sm" disabled={empty} onClick={()=>onDone(sigCanvasToDataUrl(ref.current,false))}><i className="fa-solid fa-check"></i> ใช้ลายเซ็นนี้</button>
      </div>
    </div>
  );
}

// ลายเซ็น — ใช้ลงในใบแจ้งซ่อม / ใบขอเบิก / ใบส่งของ ตรงช่องที่เป็นชื่อเจ้าของลายเซ็น
// target = เจ้าของลายเซ็น (ไม่ส่ง = ตัวเอง) · ผู้มีสิทธิ์จัดการผู้ใช้งานตั้งให้คนอื่นได้จากหน้าจัดการผู้ใช้งาน
function SignatureSettings({user, target}){
  const owner = target || user;
  const isMine = String(owner.id) === String(user.id);
  const [sig,setSig] = React.useState(null);   // null = กำลังโหลด
  const [drawing,setDrawing] = React.useState(false);
  const [busy,setBusy] = React.useState(false);
  const fileRef = React.useRef(null);
  React.useEffect(()=>{ let alive=true; window.__SIG.get(owner.id).then(v=>{ if(alive) setSig(v||""); }); return ()=>{ alive=false; }; },[owner.id]);
  const save = async (dataUrl) => {
    if(!dataUrl){ Swal.fire({icon:"warning",title:"ไม่พบลายเซ็นในรูป"}); return; }
    setBusy(true);
    try{
      await window.__SIG.save(owner.id, dataUrl, user);
      setSig(dataUrl); setDrawing(false);
      Swal.fire({icon:"success",title:"บันทึกลายเซ็นแล้ว",timer:1500,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกลายเซ็นไม่สำเร็จ",text:err.message}); }
    finally{ setBusy(false); }
  };
  const remove = async () => {
    const { isConfirmed } = await Swal.fire({title:"ลบลายเซ็น?",text:isMine?"เอกสารที่ออกหลังจากนี้จะไม่มีลายเซ็นของคุณ":`เอกสารที่ออกหลังจากนี้จะไม่มีลายเซ็นของ ${owner.name||""}`,icon:"warning",showCancelButton:true,confirmButtonText:"ลบ",cancelButtonText:"ยกเลิก",confirmButtonColor:"#DC2626"});
    if(!isConfirmed) return;
    setBusy(true);
    try{ await window.__SIG.save(owner.id, "", user); setSig(""); }
    catch(err){ Swal.fire({icon:"error",title:"ลบไม่สำเร็จ",text:err.message}); }
    finally{ setBusy(false); }
  };
  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    if(!/^image\//.test(file.type)){ Swal.fire({icon:"warning",title:"กรุณาเลือกไฟล์รูปภาพ"}); return; }
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1200/Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      save(sigCanvasToDataUrl(c,true));
    };
    im.onerror = () => { URL.revokeObjectURL(url); Swal.fire({icon:"error",title:"เปิดรูปไม่ได้"}); };
    im.src = url;
  };
  return (
    <div style={{border:"1px solid var(--line)",borderRadius:10,padding:"12px 14px"}}>
      <div style={{fontWeight:500,fontSize:13.5,marginBottom:4}}>
        <i className="fa-solid fa-signature" style={{color:"var(--primary)",marginRight:7}}></i>{isMine?"ลายเซ็นของฉัน":`ลายเซ็นของ ${owner.name||""}`}
      </div>
      <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:10,lineHeight:1.6}}>
        ใช้ลงในใบแจ้งซ่อม ใบขอเบิก และใบส่งของ — ขึ้นเฉพาะช่องที่เป็นชื่อคุณ และเอกสารที่คุณเป็นคนบันทึกเอง
      </div>
      {drawing ? (
        <SignaturePad onCancel={()=>setDrawing(false)} onDone={save}/>
      ) : (
        <>
          <div style={{height:90,border:"1px solid var(--line)",borderRadius:8,background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:10}}>
            {sig===null ? <span style={{fontSize:12.5,color:"var(--muted)"}}>กำลังโหลด...</span>
              : sig ? <img src={sig} alt="ลายเซ็น" style={{maxHeight:76,maxWidth:"90%"}}/>
              : <span style={{fontSize:12.5,color:"var(--muted)"}}>ยังไม่มีลายเซ็น</span>}
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="btn btn-primary btn-sm" onClick={()=>setDrawing(true)} disabled={busy||sig===null}><i className="fa-solid fa-pen-nib"></i> {sig?"เซ็นใหม่":"เซ็นลายเซ็น"}</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>fileRef.current&&fileRef.current.click()} disabled={busy||sig===null}><i className="fa-solid fa-upload"></i> อัปโหลดรูป</button>
            {sig && <button className="btn btn-ghost btn-sm" onClick={remove} disabled={busy} style={{color:"#DC2626"}}><i className="fa-solid fa-trash"></i> ลบ</button>}
            {busy && <div className="spinner" style={{width:14,height:14,borderWidth:2,alignSelf:"center"}}></div>}
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={onFile}/>
        </>
      )}
    </div>
  );
}

function ChangePasswordModal({user,onClose}){
  const [name,setName] = React.useState(user.name||"");
  const [username,setUsername] = React.useState(user.username||"");
  const [savingProfile,setSavingProfile] = React.useState(false);
  const [oldPw,setOldPw] = React.useState("");
  const [newPw,setNewPw] = React.useState("");
  const [confirmPw,setConfirmPw] = React.useState("");
  const [loading,setLoading] = React.useState(false);
  const [showOld,setShowOld] = React.useState(false);
  const [showNew,setShowNew] = React.useState(false);
  const inSt = {width:"100%",padding:"10px 40px 10px 12px",border:"1px solid var(--line)",borderRadius:8,fontFamily:"Kanit",fontSize:14,outline:"none",background:"#fff"};
  const eyeBtn = (show,toggle) => (
    <button type="button" onClick={toggle} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"var(--muted)",padding:4,lineHeight:1}}>
      <i className={`fa-solid ${show?"fa-eye-slash":"fa-eye"}`}></i>
    </button>
  );
  // บันทึกชื่อ/Username แยกจากการเปลี่ยนรหัสผ่าน — แก้แค่ชื่อไม่ต้องกรอกรหัสผ่านเดิม
  const profileDirty = name.trim() !== String(user.name||"").trim() || username.trim() !== String(user.username||"").trim();
  const saveProfile = async () => {
    const nm = name.trim(), un = username.trim();
    if(!nm || !un){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"ชื่อ-นามสกุล และ Username ห้ามเว้นว่าง"}); return; }
    const taken = (window.__DATA.users||[]).some(u=>u.id!==user.id && String(u.username||"").toLowerCase()===un.toLowerCase());
    if(taken){ Swal.fire({icon:"warning",title:"Username นี้มีคนใช้แล้ว",text:"กรุณาตั้ง Username อื่น"}); return; }
    setSavingProfile(true);
    try{
      await window.api("updateUser",{id:user.id, patch:{name:nm, username:un}});
      window.__DATA.users = (window.__DATA.users||[]).map(u=>u.id===user.id?{...u,name:nm,username:un}:u);
      try{
        const cur = JSON.parse(localStorage.getItem("rms_user")||"null");
        if(cur && cur.id===user.id) localStorage.setItem("rms_user", JSON.stringify({...cur,name:nm,username:un}));
      }catch(e){}
      window.dispatchEvent(new CustomEvent("rms-user-updated",{detail:{id:user.id}}));
      Swal.fire({icon:"success",title:"บันทึกข้อมูลบัญชีแล้ว",timer:1600,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){
      Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message});
    }finally{ setSavingProfile(false); }
  };

  // ── แจ้งเตือนแบบ push (ปิดแอปแล้วยังเตือนได้) ──
  const [pushState,setPushState] = React.useState(null);
  const [pushBusy,setPushBusy] = React.useState(false);
  const refreshPush = React.useCallback(()=>{
    window.__FCM.status().then(setPushState).catch(()=>setPushState({code:"error",text:"ตรวจสอบสถานะไม่สำเร็จ"}));
  },[]);
  React.useEffect(()=>{ refreshPush(); },[refreshPush]);
  const togglePush = async () => {
    setPushBusy(true);
    try{
      if(pushState && pushState.code==="on"){
        await window.__FCM.unregister(user);
        Swal.fire({icon:"info",title:"ปิดการแจ้งเตือนบนเครื่องนี้แล้ว",timer:1600,showConfirmButton:false,toast:true,position:"top-end"});
      }else{
        const res = await window.__FCM.register(user,{ask:true});
        if(res.ok) Swal.fire({icon:"success",title:"เปิดการแจ้งเตือนแล้ว",text:"เครื่องนี้จะได้รับแจ้งเตือนแม้ปิดแอป",timer:2200,showConfirmButton:false,toast:true,position:"top-end"});
        else if(res.reason==="denied") Swal.fire({icon:"warning",title:"เบราว์เซอร์บล็อกการแจ้งเตือนไว้",text:"เปิดสิทธิ์แจ้งเตือนของเว็บนี้ในการตั้งค่าเบราว์เซอร์ก่อน แล้วลองใหม่"});
        else if(res.reason==="no-vapid") Swal.fire({icon:"info",title:"ยังตั้งค่าระบบแจ้งเตือนไม่เสร็จ",text:"ผู้ดูแลระบบต้องใส่ VAPID key ของ Firebase ก่อน (ดู backend/FCM-SETUP.md)"});
        else if(res.reason==="unsupported") Swal.fire({icon:"info",title:"อุปกรณ์นี้ไม่รองรับ",text:"iPhone/iPad ต้องติดตั้งเป็นแอป (Add to Home Screen) ก่อนจึงจะรับแจ้งเตือนได้"});
        else Swal.fire({icon:"error",title:"เปิดไม่สำเร็จ",text:(res.error&&res.error.message)||"ลองใหม่อีกครั้ง"});
      }
    }finally{
      setPushBusy(false);
      refreshPush();
    }
  };

  const submit = async () => {
    if(!oldPw||!newPw||!confirmPw){ Swal.fire({icon:"warning",title:"กรุณากรอกข้อมูลให้ครบทุกช่อง"}); return; }
    if(newPw.length<6){ Swal.fire({icon:"warning",title:"รหัสผ่านใหม่สั้นเกินไป",text:"ต้องมีอย่างน้อย 6 ตัวอักษร"}); return; }
    if(newPw!==confirmPw){ Swal.fire({icon:"warning",title:"รหัสผ่านใหม่ไม่ตรงกัน",text:"กรุณากรอกรหัสผ่านใหม่และยืนยันให้ตรงกัน"}); return; }
    setLoading(true);
    try{
      await window.api("login",{username:username.trim()||user.username,password:oldPw});
      await window.api("updateUser",{id:user.id,patch:{password:newPw}});
      setLoading(false); onClose();
      Swal.fire({icon:"success",title:"เปลี่ยนรหัสผ่านสำเร็จ",timer:1800,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){
      setLoading(false);
      const msg = /Username หรือ Password/i.test(err.message)?"รหัสผ่านเดิมไม่ถูกต้อง":err.message;
      Swal.fire({icon:"error",title:"ไม่สำเร็จ",text:msg});
    }
  };
  return (
    <Modal open={true} onClose={onClose} title={<><i className="fa-solid fa-gear" style={{color:"var(--primary)",marginRight:8}}></i>ตั้งค่าบัญชี</>} size="sm"
      footer={<><button className="btn btn-ghost" onClick={onClose} disabled={loading}>ยกเลิก</button><button className="btn btn-primary" onClick={submit} disabled={loading}>{loading?<><div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> กำลังบันทึก...</>:<><i className="fa-solid fa-check"></i> เปลี่ยนรหัสผ่าน</>}</button></>}>
      <div style={{display:"grid",gap:14}}>
        <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,padding:"10px 14px",fontSize:13,color:"#1E40AF"}}>
          <i className="fa-solid fa-user" style={{marginRight:6}}></i>บัญชี: <strong>{user.username}</strong> · {user.role}{user.dept ? " · " + user.dept : ""}
        </div>

        <div style={{border:"1px solid var(--line)",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontWeight:500,fontSize:13.5,marginBottom:10}}>
            <i className="fa-solid fa-id-card" style={{color:"var(--primary)",marginRight:7}}></i>ข้อมูลผู้ใช้งาน
          </div>
          <div style={{display:"grid",gap:11}}>
            <div>
              <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>ชื่อ-นามสกุล <span style={{color:"#EF4444"}}>*</span></label>
              <input style={{...inSt,paddingRight:12}} value={name} onChange={e=>setName(e.target.value)} placeholder="ชื่อที่แสดงในระบบ" />
            </div>
            <div>
              <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>Username (ชื่อที่ใช้เข้าสู่ระบบ) <span style={{color:"#EF4444"}}>*</span></label>
              <input style={{...inSt,paddingRight:12}} value={username} onChange={e=>setUsername(e.target.value)} placeholder="เช่น somchai" autoComplete="username" />
              <div style={{fontSize:11.5,color:"var(--muted)",marginTop:4}}>เปลี่ยนแล้วต้องใช้ Username ใหม่ในการเข้าสู่ระบบครั้งถัดไป</div>
            </div>
            <button className="btn btn-primary btn-sm" onClick={saveProfile} disabled={savingProfile||!profileDirty} style={{justifySelf:"start"}}>
              {savingProfile
                ? <><div className="spinner" style={{width:13,height:13,borderWidth:2}}></div> กำลังบันทึก...</>
                : <><i className="fa-solid fa-floppy-disk"></i> {profileDirty?"บันทึกข้อมูลผู้ใช้งาน":"ยังไม่มีการแก้ไข"}</>}
            </button>
          </div>
        </div>

        <SignatureSettings user={user}/>

        <div style={{border:"1px solid var(--line)",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontWeight:500,fontSize:13.5,marginBottom:4}}>
            <i className="fa-solid fa-bell" style={{color:"var(--primary)",marginRight:7}}></i>การแจ้งเตือนบนเครื่องนี้
          </div>
          <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:10,lineHeight:1.6}}>
            งานซ่อมใหม่เข้าระบบ และสรุปงานค้าง 08:00 / 11:00 / 13:00 / 17:00 — เปิดแล้วจะเตือนแม้ปิดแอปไปแล้ว
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <span className="badge" style={
              !pushState ? {background:"var(--line-soft)",color:"var(--muted)"}
              : pushState.code==="on" ? {background:"#DCFCE7",color:"#166534"}
              : pushState.code==="denied" || pushState.code==="unsupported" ? {background:"#FEE2E2",color:"#B91C1C"}
              : {background:"#FEF3C7",color:"#92400E"}}>

        <div>
          <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>ยืนยันรหัสผ่านใหม่ <span style={{color:"#EF4444"}}>*</span></label>
          <div style={{position:"relative"}}>
            <input style={{...inSt,borderColor:confirmPw&&confirmPw!==newPw?"#EF4444":"var(--line)"}} type={showNew?"text":"password"} value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} placeholder="กรอกรหัสผ่านอีกครั้ง" autoComplete="new-password"/>
            {confirmPw&&confirmPw===newPw&&<i className="fa-solid fa-circle-check" style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:"#10B981",pointerEvents:"none"}}></i>}
            {confirmPw&&confirmPw!==newPw&&<i className="fa-solid fa-circle-xmark" style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:"#EF4444",pointerEvents:"none"}}></i>}
          </div>
          {confirmPw&&confirmPw!==newPw&&<div style={{fontSize:12,color:"#EF4444",marginTop:4}}>รหัสผ่านไม่ตรงกัน</div>}
        </div>
      </div>
    </Modal>
  );
}

<script type="text/babel">
function Projects({user}){
  // เห็นเฉพาะโครงการที่ตัวเองมีสิทธิ์ (Engineer / Safety Officer = เฉพาะที่ได้รับมอบหมาย)
  const [rows,setRows] = React.useState(()=>window.visibleProjects(user,{includeInactive:true}));
  const [edit,setEdit] = React.useState(null);
  const [q,setQ] = React.useState("");

  const filtered = rows.filter(p=>{
    if(!q) return true;
    const kw = q.toLowerCase();
    return [p.name,p.shortName,p.code,p.desc,...window.projectSites(p)].some(v=>String(v||"").toLowerCase().includes(kw));
  });

  // rows = เฉพาะโครงการที่ผู้ใช้เห็น — ห้ามเอา rows ไปทับ __DATA.projects ตรงๆ ไม่งั้นโครงการที่ถูกกรองออกจะหายจากแคชทั้งระบบ
  const syncCache = (fn) => { window.__DATA.projects = fn(window.__DATA.projects||[]); };

  const save = async (form) => {
    try{
      if(form.id){
        await window.api("updateProject",{id:form.id,patch:form});
        setRows(rows.map(x=>x.id===form.id?form:x));
        syncCache(all=>all.map(x=>x.id===form.id?form:x));
      } else {
        const nu = await window.api("createProject",{project:form});
        setRows([...rows,nu]);
        syncCache(all=>[...all,nu]);
      }
      setEdit(null);
      Swal.fire({icon:"success",title:"บันทึกสำเร็จ",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const del = async (p) => {
    const machineCount = (window.__DATA.machines||[]).filter(m=>m.project===p.name).length;
    const done = await window.deleteWithApproval({
      user, action:"deleteProject", payload:{id:p.id},
      entityLabel:"โครงการ", targetName:p.name, project:p.name,
      targetInfo: machineCount>0 ? `มีเครื่องจักรในโครงการนี้ ${machineCount} รายการ` : "",
    });
    if(done) setRows(rows.filter(x=>x.id!==p.id));   // applyDeleteLocally จัดการแคชกลางให้แล้ว
  };

  const STATUS_COLOR = {active:"#10B981",inactive:"#94A3B8"};
  const STATUS_LABEL = {active:"ดำเนินการ",inactive:"ปิดโครงการ"};

  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา รหัส / ชื่อย่อ / ชื่อเต็มโครงการ..." value={q} onChange={e=>setQ(e.target.value)}/></div>
        <div className="spacer"></div>
        {["Admin","Officer"].includes(user.role) && (
          <button className="btn btn-primary" onClick={()=>setEdit({name:"",shortName:"",code:"",desc:"",status:"active",color:"#3B82F6"})}>
            <i className="fa-solid fa-plus"></i> เพิ่มโครงการ
          </button>
        )}
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr>
            <th style={{width:110}}>รหัส</th>
            <th style={{width:150}}>ชื่อย่อโครงการ</th>
            <th>ชื่อเต็มโครงการ</th>
            <th style={{width:190}}>ไซต์งานย่อย</th>
            <th className="hide-on-mobile">รายละเอียด</th>
            <th style={{width:100}}>สถานะ</th>
            <th style={{width:80}} className="hide-on-mobile">เครื่องจักร</th>
            <th style={{width:80}} className="hide-on-mobile">แจ้งซ่อม</th>
            <th style={{width:90}}>จัดการ</th>
          </tr></thead>
          <tbody>
            {filtered.map((p)=>{
              const mCnt=(window.__DATA.machines||[]).filter(m=>m.project===p.name).length;
              const rCnt=(window.__DATA.repairs||[]).filter(r=>r.project===p.name).length;
              const sc=STATUS_COLOR[p.status]||"#94A3B8";
              const sites=window.projectSites(p);
              return (
                <tr key={p.id}>
                  <td><span className="mono" style={{fontSize:12,fontWeight:500,color:"var(--primary)",background:"var(--accent-soft)",padding:"2px 8px",borderRadius:6}}>{p.code||"—"}</span></td>
                  <td>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{width:10,height:10,borderRadius:"50%",background:p.color||"#3B82F6",flexShrink:0,display:"inline-block"}}></span>
                      <span style={{fontWeight:500}}>{p.shortName || <span style={{color:"var(--muted)",fontWeight:400}}>—</span>}</span>
                    </div>
                  </td>
                  <td>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span>{p.name}</span>
                      {window.hasLatLng(p)
                        ? <i className="fa-solid fa-location-dot" title={`ปักหมุดแล้ว · ${Number(p.lat).toFixed(5)}, ${Number(p.lng).toFixed(5)}`} style={{color:"#10B981",fontSize:12}}></i>
                        : <i className="fa-solid fa-location-crosshairs" title="ยังไม่ได้ปักหมุดที่ตั้ง — จะไม่ขึ้นบนแผนที่หน้าแดชบอร์ด" style={{color:"#CBD5E1",fontSize:12}}></i>}
                    </div>
                  </td>
                  <td>
                    {sites.length ? (
                      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                        {sites.map(s=>(
                          <span key={s} style={{fontSize:11.5,padding:"2px 8px",borderRadius:6,background:(p.color||"#3B82F6")+"18",color:p.color||"#3B82F6",fontWeight:500,whiteSpace:"nowrap"}}>{s}</span>
                        ))}
                      </div>
                    ) : <span style={{color:"var(--muted)",fontSize:12}}>—</span>}
                  </td>
                  <td className="hide-on-mobile" style={{color:"var(--muted)",fontSize:13,maxWidth:260}}><div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.desc||"—"}</div></td>
                  <td><span style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:12,fontWeight:500,padding:"3px 10px",borderRadius:999,background:sc+"22",color:sc}}><span style={{width:6,height:6,borderRadius:"50%",background:sc}}></span>{STATUS_LABEL[p.status]||p.status}</span></td>
                  <td className="hide-on-mobile" style={{textAlign:"center"}}><strong>{mCnt}</strong> <span style={{color:"var(--muted)",fontSize:12}}>รายการ</span></td>
                  <td className="hide-on-mobile" style={{textAlign:"center"}}><strong>{rCnt}</strong> <span style={{color:"var(--muted)",fontSize:12}}>รายการ</span></td>
                  <td>
                    <div className="row-actions">
                      {["Admin","Officer"].includes(user.role) && <>
                        <button className="ia" onClick={()=>setEdit(p)} title="แก้ไข"><i className="fa-solid fa-pen"></i></button>
                        <button className="ia danger" onClick={()=>del(p)} title="ลบ"><i className="fa-solid fa-trash"></i></button>
                      </>}
                    </div>
                  </td>
                </tr>
              );
            })}
            {filtered.length===0 && <tr><td colSpan="9"><div className="empty"><i className="fa-solid fa-diagram-project"></i><div className="t">ยังไม่มีโครงการ</div><div>กดปุ่ม "เพิ่มโครงการ" เพื่อเริ่มต้น</div></div></td></tr>}
          </tbody>
        </table>
      </div>
      {edit && <ProjectForm init={edit} onClose={()=>setEdit(null)} onSave={save}/>}
    </div>
  );
}

function ProjectForm({init,onClose,onSave}){
  const [f,setF] = React.useState(init);
  const palette = ["#3B82F6","#8B5CF6","#EF4444","#10B981","#F59E0B","#06B6D4","#EC4899","#6366F1","#F97316","#14B8A6","#A855F7","#0EA5E9","#DC2626","#16A34A","#D97706","#64748B"];

  // ไซต์งานย่อย — พิมพ์แล้วกด Enter หรือ "," เพื่อเพิ่มทีละอัน (วางหลายชื่อคั่นด้วย , ได้)
  const [siteInput,setSiteInput] = React.useState("");
  const sites = window.projectSites(f);
  const addSites = (raw) => {
    const parts = String(raw||"").split(",").map(s=>s.trim()).filter(Boolean);
    if(!parts.length) return;
    const next = sites.slice();
    parts.forEach(s=>{ if(!next.some(x=>x.toLowerCase()===s.toLowerCase())) next.push(s); });
    setF(prev=>({...prev,sites:next}));
    setSiteInput("");
  };
  const removeSite = (s) => setF(prev=>({...prev,sites:sites.filter(x=>x!==s)}));
  const moveSite = (i,dir) => {
    const next = sites.slice();
    const j = i+dir;
    if(j<0 || j>=next.length) return;
    [next[i],next[j]] = [next[j],next[i]];
    setF(prev=>({...prev,sites:next}));
  };

  // กดบันทึกทั้งที่ยังพิมพ์ชื่อไซต์ค้างอยู่ในช่อง — เก็บให้ด้วย ไม่ให้พิมพ์แล้วหาย
  // ไม่มีไซต์เลยส่ง null เพื่อให้ Firebase ลบฟิลด์ทิ้ง (update ด้วย [] จะไม่ลบของเดิม)
  const submit = () => {
    const merged = sites.slice();
    String(siteInput||"").split(",").map(s=>s.trim()).filter(Boolean)
      .forEach(s=>{ if(!merged.some(x=>x.toLowerCase()===s.toLowerCase())) merged.push(s); });
    onSave({...f, sites: merged.length ? merged : null});
  };

  return (
    <Modal open={true} onClose={onClose} title={init.id?"แก้ไขโครงการ":"เพิ่มโครงการใหม่"}
      footer={<>
        <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-floppy-disk"></i> บันทึก</button>
      </>}>
      <div className="form-grid">
        <div className="form-field" style={{gridColumn:"1/-1"}}>
          <label>ชื่อเต็มโครงการ *</label>
          <input value={f.name||""} onChange={e=>setF({...f,name:e.target.value})} placeholder="เช่น โรงงาน A - สายการผลิต 1" />
          <div className="hint">ชื่อทางการ · ใช้ในเอกสารทุกชนิด (ใบแจ้งซ่อม · ใบส่งของ · Excel)</div>
        </div>
        <div className="form-field">
          <label>ชื่อย่อโครงการ</label>
          <input value={f.shortName||""} onChange={e=>setF({...f,shortName:e.target.value})} placeholder="เช่น โรงงาน A1" />

                  <span style={{cursor:"default"}}>{s}</span>

                    <button type="button" title="เลื่อนลง" onClick={()=>moveSite(i,1)} disabled={i===sites.length-1}

                    <button type="button" title="ลบไซต์นี้" onClick={()=>removeSite(s)}
                      style={{border:"none",background:"none",cursor:"pointer",color:"inherit",opacity:.75,padding:"0 3px",fontSize:11}}><i className="fa-solid fa-xmark"></i></button>
                  </span>
                </span>
              ))}
            </div>
          )}
          <div className="hint">ไซต์งานย่อยภายในโครงการ เช่น Rig1 · Rig2 · แคมป์คนงาน — ชื่อห้ามซ้ำกันในโครงการเดียว · เว้นว่างได้ถ้าโครงการไม่มีไซต์ย่อย</div>
        </div>
        <div className="form-field" style={{gridColumn:"1/-1"}}>
          <label>รายละเอียด</label>
          <textarea rows="2" value={f.desc||""} onChange={e=>setF({...f,desc:e.target.value})} placeholder="รายละเอียดโครงการ สถานที่ตั้ง ฯลฯ"></textarea>
        </div>
        <div className="form-field" style={{gridColumn:"1/-1"}}>
          <label>สีประจำโครงการ</label>
          <div className="color-grid">
            {palette.map(c=>(
              <button key={c} className={f.color===c?"sel":""} style={{background:c}} onClick={()=>setF({...f,color:c})}></button>
            ))}
          </div>
        </div>
        <div className="form-field" style={{gridColumn:"1/-1"}}>
          <label><i className="fa-solid fa-map-location-dot" style={{color:"var(--primary)",marginRight:6}}></i>ที่ตั้งโครงการ (แสดงบนแผนที่หน้าแดชบอร์ด)</label>
          <input value={f.address||""} onChange={e=>setF({...f,address:e.target.value})} placeholder="ที่อยู่/จุดสังเกต (ไม่บังคับ)" style={{marginBottom:10}} />
          <LocationPicker
            value={{lat:f.lat, lng:f.lng}}
            onChange={(pos)=>setF(prev=>({...prev, lat:pos.lat, lng:pos.lng}))}
          />
        </div>
      </div>
      <div style={{marginTop:16,padding:14,background:"#FAFBFC",borderRadius:10,border:"1px dashed var(--line)"}}>
        <div style={{fontSize:11,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:8,fontWeight:500}}>ตัวอย่าง</div>
        <div style={{display:"inline-flex",alignItems:"center",gap:8,padding:"6px 14px",borderRadius:999,background:(f.color||"#3B82F6")+"22",color:f.color||"#3B82F6",fontWeight:500,fontSize:13}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:f.color||"#3B82F6"}}></span>
          {f.code && <span className="mono" style={{fontSize:12}}>{f.code}</span>}
          <span>{f.name||"ชื่อโครงการ"}</span>
        </div>
      </div>
    </Modal>
  );
}
