<script type="text/babel">
// ══════════════════════════════════════════════════════════════════════════
// แผนที่ที่ตั้งโครงการ + การ์ดงานแจ้งซ่อม (ใช้ Leaflet + OpenStreetMap)
// พิกัดเก็บที่ตัวโครงการ (lat/lng) — ตั้งได้ที่หน้า "โครงการ" → แก้ไข → ที่ตั้งโครงการ
// ══════════════════════════════════════════════════════════════════════════

// อ่านพิกัดจากข้อความที่ผู้ใช้วางมา — รองรับลิงก์ Google Maps และ "13.7563, 100.5018"
window.parseLatLng = function(text){
  const s = String(text||"").trim();
  if(!s) return null;
  const pats = [
    /@(-?\d{1,3}(?:\.\d+)?),\s*(-?\d{1,3}(?:\.\d+)?)/,        // .../@13.75,100.50,17z
    /[?&](?:q|ll|center|daddr)=(-?\d{1,3}(?:\.\d+)?),\s*(-?\d{1,3}(?:\.\d+)?)/i,
    /!3d(-?\d{1,3}(?:\.\d+)?)!4d(-?\d{1,3}(?:\.\d+)?)/,       // รูปแบบภายในลิงก์ place ของ Google
    /^\s*(-?\d{1,3}(?:\.\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/,
  ];
  for(const re of pats){
    const m = s.match(re);
    if(m){
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if(isFinite(lat) && isFinite(lng) && Math.abs(lat)<=90 && Math.abs(lng)<=180) return {lat,lng};
    }
  }
  return null;
};

window.hasLatLng = (p) => p && isFinite(Number(p.lat)) && isFinite(Number(p.lng)) && !(Number(p.lat)===0 && Number(p.lng)===0);

// ป้ายและ popup ของ Leaflet รับเป็น HTML — ชื่อโครงการมาจากผู้ใช้ ต้อง escape ก่อนเสมอ
const esc = (s) => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const MAP_TILE = "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";
const MAP_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const MAP_CENTER_TH = [13.7563, 100.5018];   // กรุงเทพฯ — ใช้เมื่อยังไม่มีหมุดสักอัน

// หมุดแบบวาดเอง ไม่ต้องโหลดไฟล์รูปของ Leaflet (กันไอคอนแตก)
function pinIcon(color, count, dim){
  return window.L.divIcon({
    className: "",
    html: `<div class="map-pin-wrap${dim?" dim":""}">
             <div class="map-pin" style="background:${color}"><i class="fa-solid fa-location-dot"></i></div>
             ${count>0 ? `<div class="map-pin-count">${count>99?"99+":count}</div>` : ""}
           </div>`,
    iconSize: [34,34], iconAnchor: [17,32], popupAnchor: [0,-30],
  });
}

// ── ตัวเลือกพิกัดในฟอร์มโครงการ ───────────────────────────────────────
function LocationPicker({value, onChange}){
  const boxRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const markerRef = React.useRef(null);
  const onChangeRef = React.useRef(onChange);
  onChangeRef.current = onChange;
  const [paste,setPaste] = React.useState("");
  const [ready,setReady] = React.useState(false);
  const [err,setErr] = React.useState("");
  const has = window.hasLatLng(value);

  React.useEffect(()=>{
    let dead = false;
    window.__loadMap().then(()=>{
      if(dead || !boxRef.current || mapRef.current) return;
      const start = window.hasLatLng(value) ? [Number(value.lat),Number(value.lng)] : MAP_CENTER_TH;
      const map = window.L.map(boxRef.current,{scrollWheelZoom:false}).setView(start, window.hasLatLng(value)?15:6);
      window.L.tileLayer(MAP_TILE,{attribution:MAP_ATTR,maxZoom:19}).addTo(map);
      map.on("click",(e)=>onChangeRef.current({lat:+e.latlng.lat.toFixed(6), lng:+e.latlng.lng.toFixed(6)}));
      mapRef.current = map;
      setReady(true);
      setTimeout(()=>map.invalidateSize(),150);   // เปิดใน Modal ต้องวัดขนาดใหม่หลังแสดงผล
    }).catch(e=>setErr(e.message||String(e)));
    return ()=>{
      dead = true;
      if(mapRef.current){ mapRef.current.remove(); mapRef.current = null; markerRef.current = null; }
    };
  },[]);

  // ย้ายหมุดตามค่าที่กรอก/คลิก
  React.useEffect(()=>{
    const map = mapRef.current;
    if(!map || !ready) return;
    if(!has){
      if(markerRef.current){ map.removeLayer(markerRef.current); markerRef.current = null; }
      return;
    }
    const pos = [Number(value.lat), Number(value.lng)];
    if(markerRef.current) markerRef.current.setLatLng(pos);
    else {
      markerRef.current = window.L.marker(pos,{icon:pinIcon("#EF4444",0,false),draggable:true}).addTo(map);
      markerRef.current.on("dragend",(e)=>{
        const ll = e.target.getLatLng();
        onChangeRef.current({lat:+ll.lat.toFixed(6), lng:+ll.lng.toFixed(6)});
      });
    }
    map.setView(pos, Math.max(map.getZoom(), 15));
  },[ready,has,value && value.lat,value && value.lng]);

  const applyPaste = () => {
    const got = window.parseLatLng(paste);
    if(!got){
      Swal.fire({icon:"warning",title:"อ่านพิกัดไม่ออก",html:'วางได้ทั้งลิงก์ Google Maps (แบบเต็ม ไม่ใช่ลิงก์ย่อ goo.gl)<br/>หรือพิมพ์เป็น <b>13.7563, 100.5018</b>'});
      return;
    }
    onChange(got); setPaste("");
  };

  const useMyLocation = () => {
    if(!navigator.geolocation){ Swal.fire({icon:"info",title:"เบราว์เซอร์นี้ไม่รองรับการหาตำแหน่ง"}); return; }
    navigator.geolocation.getCurrentPosition(
      (p)=>onChange({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}),
      ()=>Swal.fire({icon:"error",title:"หาตำแหน่งไม่สำเร็จ",text:"อนุญาตให้เว็บเข้าถึงตำแหน่งก่อน แล้วลองใหม่"}),
      {enableHighAccuracy:true, timeout:8000}
    );
  };

  return (
    <div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
        <input style={{flex:"1 1 240px",minWidth:0}} value={paste} onChange={e=>setPaste(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); applyPaste(); } }}
          placeholder="วางลิงก์ Google Maps หรือพิมพ์ 13.7563, 100.5018" />
        <button type="button" className="btn btn-ghost btn-sm" onClick={applyPaste}><i className="fa-solid fa-location-crosshairs"></i> ใช้พิกัดนี้</button>
        <button type="button" className="btn btn-ghost btn-sm" onClick={useMyLocation}><i className="fa-solid fa-crosshairs"></i> ตำแหน่งปัจจุบัน</button>
        {has && <button type="button" className="btn btn-ghost btn-sm" style={{color:"#EF4444"}} onClick={()=>onChange({lat:"",lng:""})}><i className="fa-solid fa-eraser"></i> ล้างพิกัด</button>}
      </div>
      {err
        ? <div style={{padding:14,background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:10,fontSize:13,color:"#B91C1C"}}>
            <i className="fa-solid fa-triangle-exclamation" style={{marginRight:6}}></i>โหลดแผนที่ไม่สำเร็จ: {err} · ยังกรอกพิกัดเองได้
          </div>
        : <div ref={boxRef} className="map-box sm"></div>}
      <div style={{fontSize:12,color:"var(--muted)",marginTop:6}}>
        {has
          ? <><i className="fa-solid fa-location-dot" style={{color:"#EF4444",marginRight:5}}></i>
              พิกัด <span className="mono">{Number(value.lat).toFixed(6)}, {Number(value.lng).toFixed(6)}</span> · คลิกบนแผนที่หรือลากหมุดเพื่อย้าย</>
          : <>คลิกบนแผนที่เพื่อปักหมุดที่ตั้งโครงการ · โครงการที่ไม่มีพิกัดจะไม่ขึ้นบนแผนที่หน้าแดชบอร์ด</>}
      </div>
    </div>
  );
}
window.LocationPicker = LocationPicker;

// ── แผนที่รวมที่ตั้งโครงการบนแดชบอร์ด ────────────────────────────────
function ProjectMap({projects, byProject, selected, onSelect}){
  const boxRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const layerRef = React.useRef(null);
  const [err,setErr] = React.useState("");
  const [ready,setReady] = React.useState(false);
  const onSelectRef = React.useRef(onSelect);
  onSelectRef.current = onSelect;

  React.useEffect(()=>{
    let dead = false;
    window.__loadMap().then(()=>{
      if(dead || !boxRef.current || mapRef.current) return;
      const map = window.L.map(boxRef.current,{scrollWheelZoom:false}).setView(MAP_CENTER_TH,6);
      window.L.tileLayer(MAP_TILE,{attribution:MAP_ATTR,maxZoom:19}).addTo(map);
      layerRef.current = window.L.layerGroup().addTo(map);
      mapRef.current = map;
      setReady(true);
      setTimeout(()=>map.invalidateSize(),150);
    }).catch(e=>setErr(e.message||String(e)));
    return ()=>{
      dead = true;
      if(mapRef.current){ mapRef.current.remove(); mapRef.current = null; layerRef.current = null; }
    };
  },[]);

  // วาดหมุดใหม่ทุกครั้งที่จำนวนงานหรือโครงการเปลี่ยน
  React.useEffect(()=>{
    if(!ready || !layerRef.current || !mapRef.current) return;
    const L = window.L, map = mapRef.current;
    layerRef.current.clearLayers();
    const pts = [];
    projects.filter(window.hasLatLng).forEach(p=>{
      const info = byProject[p.name] || {open:0, urgent:0};
      const pos = [Number(p.lat), Number(p.lng)];
      pts.push(pos);
      const dim = !!selected && selected !== p.name;
      const m = L.marker(pos,{icon:pinIcon(p.color||"#1E40AF", info.open, dim), title:p.name}).addTo(layerRef.current);
      // ป้ายชื่อโครงการแสดงค้างไว้ ไม่ต้องคลิกก็รู้ว่าหมุดไหนคือโครงการอะไร (ใช้ชื่อย่อตามกติกาหน้าเว็บ)
      m.bindTooltip(
        `${esc(window.projectShort(p.name))}${info.open ? `<span class="ml-n">${info.open} ใบ</span>` : ""}`,
        { permanent:true, direction:"right", offset:[13,-13], opacity:1,
          className:`map-label${selected===p.name ? " on" : dim ? " dim" : ""}` }
      );
      m.bindPopup(`
        <div style="min-width:170px">
          <div style="font-weight:600;margin-bottom:4px">${esc(window.projectShort(p.name))}</div>
          <div style="font-size:11.5px;color:#64748B">${esc(p.name)}</div>
          <div style="margin-top:7px;font-size:13px">
            งานที่ยังไม่เสร็จ <b style="color:${info.open?"#EF4444":"#10B981"}">${info.open}</b> ใบ
          </div>
          ${p.address?`<div style="margin-top:5px;font-size:12px;color:#64748B">${esc(p.address)}</div>`:""}
          <div style="margin-top:8px;font-size:12px;color:#1E40AF">คลิกหมุดเพื่อกรองการ์ดด้านล่าง</div>
        </div>`);
      m.on("click",()=>onSelectRef.current(selected===p.name ? "" : p.name));
    });
    if(pts.length===1) map.setView(pts[0],14);
    else if(pts.length>1) map.fitBounds(L.latLngBounds(pts).pad(0.25));
  },[ready,projects,byProject,selected]);

  if(err) return (
    <div className="card-body">
      <div className="empty" style={{padding:26}}>
        <i className="fa-solid fa-triangle-exclamation" style={{color:"#EF4444"}}></i>
        <div className="t" style={{fontSize:14}}>โหลดแผนที่ไม่สำเร็จ</div>
        <div>{err} · ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต</div>
      </div>
    </div>
  );
  return <div ref={boxRef} className="map-box"></div>;
}
window.ProjectMap = ProjectMap;

// ── การ์ดงานแจ้งซ่อม ─────────────────────────────────────────────────
function JobCard({r, onOpen}){
  const st = window.getStatus(r.status);
  const cat = window.getCategory(r.categoryId);
  const mach = (window.__DATA.machines||[]).find(m=>m.code===r.machineCode);
  const days = Math.max(0, Math.floor((Date.now() - new Date(r.createdAt).getTime()) / 86400000));
  const stColor = {new:"#3B82F6",assess:"#F59E0B",progress:"#8B5CF6",parts:"#EC4899",done:"#10B981",cancel:"#94A3B8"}[r.status] || "#64748B";
  return (
    <div className={`job-card${r.status==="cancel"?" is-cancel":""}`} style={{"--job-color":stColor}} onClick={()=>onOpen(r)}>
      <div className="jc-top">
        <span className="jc-run">{r.running||r.id}</span>
        <span className={`badge ${st.className}`}><i className={`fa-solid ${st.icon}`} style={{marginRight:4}}></i>{st.label}</span>
      </div>
      <div className="jc-title"><ProblemLines title={r.title} max={2}/></div>
      <div className="jc-meta">
        <div className="row"><i className="fa-solid fa-diagram-project" style={{color:"#1E40AF"}}></i><span title={r.project||""}>{r.project ? window.projectShort(r.project) : "ไม่ระบุโครงการ"}</span></div>
        <div className="row"><i className="fa-solid fa-industry" style={{color:"#64748B"}}></i><span>{r.machineCode||"—"}{mach?` · ${mach.name}`:""}</span></div>
        <div className="row"><i className={`fa-solid ${cat.icon}`} style={{color:cat.color}}></i><span>{cat.name}</span></div>
      </div>
      <div className="jc-foot">
        <span><i className="fa-solid fa-user" style={{marginRight:5}}></i>{r.reporterName||"—"}</span>
        <span className="jc-age" style={{color: days>7 ? "#EF4444" : days>3 ? "#B45309" : "var(--muted)"}}>
          <i className="fa-regular fa-clock"></i>{days===0?"วันนี้":`${days} วัน`}
        </span>
      </div>
    </div>
  );
}
window.JobCard = JobCard;
</script>

<script type="text/babel">
function Dashboard({user,goTo}){
  const [loading,setLoading] = React.useState(true);
  const [costView,setCostView] = React.useState("category");
  const [dashDetail,setDashDetail] = React.useState(null);
  // แก้ไข/อัปเดตใบแจ้งซ่อมได้จากแดชบอร์ดโดยตรง ไม่ต้องย้ายไปหน้ารายการแจ้งซ่อม
  const [editFor,setEditFor] = React.useState(null);
  const [editPartsFor,setEditPartsFor] = React.useState(null);
  const [assessFor,setAssessFor] = React.useState(null);
  const [saving,setSaving] = React.useState(false);
  const [tick,setTick] = React.useState(0);
  const [mapProject,setMapProject] = React.useState("");   // โครงการที่เลือกจากหมุดบนแผนที่
  const [jobStatus,setJobStatus] = React.useState("all");
  const [jobLimit,setJobLimit] = React.useState(36);       // ทยอยแสดง กันการ์ดหลายร้อยใบทำให้หน้าหน่วง
  const [symptomMode,setSymptomMode] = React.useState("group");     // group | keyword | full
  const [symptomLimit,setSymptomLimit] = React.useState(10);
  const [openKw,setOpenKw] = React.useState("");           // คีย์เวิร์ดที่กางดูใบงานอยู่
  const doughnutRef = React.useRef(null);
  const barRef = React.useRef(null);
  const costRef = React.useRef(null);
  const chartsRef = React.useRef({});

  React.useEffect(()=>{
    const t = setTimeout(()=>setLoading(false),350);
    return ()=>clearTimeout(t);
  },[]);

  const repairs = React.useMemo(()=>{
    return window.filterByUserProjects(user, window.__DATA.repairs, "project");
  },[user,tick]);

  // ---- แก้ไขใบแจ้งซ่อมจากแดชบอร์ด (ชุดเดียวกับหน้ารายการแจ้งซ่อม) ----
  const canEditRepairs = ["Admin","Officer","Engineer"].includes(user.role);
  const applyRepair = (updated) => {
    window.__DATA.repairs = window.__DATA.repairs.map(x=>x.id===updated.id?updated:x);
    setDashDetail(d => (d && d.id===updated.id) ? updated : d);
    setTick(t=>t+1);
  };
  const quickAction = async (r, next, actionLabel) => {
    if(next==="assess"){ setDashDetail(null); setAssessFor(r); return; }
    let cost = r.cost;
    if(next==="progress"){
      const { value, isConfirmed } = await Swal.fire({
        title:"อนุมัติซ่อม",
        input:"number",inputLabel:"ค่าใช้จ่ายโดยประมาณ (บาท)",inputValue:cost||"",inputPlaceholder:"เช่น 5000",
        showCancelButton:true,confirmButtonText:"อนุมัติและเริ่มซ่อม",cancelButtonText:"ยกเลิก",confirmButtonColor:"#1E40AF"
      });
      if(!isConfirmed) return;
      cost = Number(value)||cost;
    }
    if(next==="done"){
      const { isConfirmed } = await Swal.fire({title:"ปิดงานนี้หรือไม่?",text:"ยืนยันว่างานซ่อมเสร็จสมบูรณ์แล้ว",icon:"question",showCancelButton:true,confirmButtonText:"ใช่, ปิดงาน",cancelButtonText:"ยกเลิก",confirmButtonColor:"#10B981"});
      if(!isConfirmed) return;
    }
    setSaving(true);
    try{
      await window.api("updateRepairStatus",{id:r.id,status:next,by:user.name,note:actionLabel,cost});
      applyRepair({...r,status:next,cost,timeline:[...(r.timeline||[]),{status:next,when:new Date(),by:user.name,note:actionLabel}]});
      Swal.fire({icon:"success",title:"อัปเดตสถานะสำเร็จ",text:actionLabel,timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
    finally{ setSaving(false); }
  };
  const saveDashEdit = async (r, patch) => {
    setSaving(true);
    try{
      await window.api("updateRepair",{id:r.id, patch, by:user.name});
      applyRepair({...r,...patch,timeline:[...(r.timeline||[]),{status:patch.status||r.status,when:new Date(),by:user.name,note:"แก้ไขข้อมูลจากแดชบอร์ด"}]});
      setEditFor(null);
      Swal.fire({icon:"success",title:"บันทึกการแก้ไขแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
    finally{ setSaving(false); }
  };
  const saveDashParts = async (r, {parts, laborCost, cost}, mode) => {
    const isAssess = mode==="assess";
    const note = isAssess ? "เริ่มประเมินราคา" : "แก้ไขรายการอะไหล่";
    setSaving(true);
    try{
      await window.api("updateRepairStatus",{id:r.id,status:isAssess?"assess":r.status,by:user.name,note,cost,patch:{parts,laborCost}});
      applyRepair({...r,status:isAssess?"assess":r.status,cost,parts,laborCost,
        timeline:[...(r.timeline||[]),{status:isAssess?"assess":r.status,when:new Date(),by:user.name,note}]});
      setAssessFor(null); setEditPartsFor(null);
      Swal.fire({icon:"success",title:isAssess?"บันทึกการประเมินแล้ว":"บันทึกรายการอะไหล่แล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
    finally{ setSaving(false); }
  };

  // ── งานที่ยังไม่เสร็จสมบูรณ์ (ทุกสถานะยกเว้น done) สำหรับแผนที่และการ์ด ──
  const openJobs = React.useMemo(()=>(
    repairs.filter(r=>r.status!=="done")
      .slice()
      .sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt))   // ค้างนานสุดขึ้นก่อน
  ),[repairs]);

  const jobsByProject = React.useMemo(()=>{
    const map = {};
    openJobs.forEach(r=>{
      const key = r.project || "";
      if(!key) return;
      if(!map[key]) map[key] = {open:0};
      map[key].open++;
    });
    return map;
  },[openJobs]);

  // โครงการที่ผู้ใช้เห็นได้ (ตามสิทธิ์ + โครงการที่เลือกตอนเข้าใช้งาน)
  const mapProjects = React.useMemo(()=>{
    const allowed = new Set(window.userProjects(user));
    return (window.__DATA.projects||[]).filter(p=>allowed.has(p.name));
  },[user,tick]);
  // ต้อง memo ไว้ ไม่งั้น prop เปลี่ยนทุก render แล้วแผนที่จะวาดหมุดใหม่รัวๆ จน popup ปิดเอง
  const pinned = React.useMemo(()=>mapProjects.filter(window.hasLatLng),[mapProjects]);

  const jobCards = React.useMemo(()=>(
    openJobs
      .filter(r=>!mapProject || r.project===mapProject)
      .filter(r=>jobStatus==="all" || r.status===jobStatus)
  ),[openJobs,mapProject,jobStatus]);

  React.useEffect(()=>{ setJobLimit(36); },[mapProject,jobStatus]);

  // โครงการที่เลือกดูได้ในการ์ดงานค้าง — รวมโครงการที่มีงานค้างแต่ยังไม่มีในทะเบียนโครงการด้วย
  const jobProjectOptions = React.useMemo(()=>{
    const names = new Set(mapProjects.map(p=>p.name));
    openJobs.forEach(r=>{ if(r.project) names.add(r.project); });
    return [...names].sort((a,b)=>String(a).localeCompare(String(b),"th"))
      .map(name=>({name, open:(jobsByProject[name]||{open:0}).open}));
  },[mapProjects,openJobs,jobsByProject]);

  const jobStatusChips = React.useMemo(()=>{
    const list = window.__DATA.statuses.filter(s=>s.key!=="done");
    return [{key:"all",label:"ทั้งหมด",n:openJobs.filter(r=>!mapProject||r.project===mapProject).length}].concat(
      list.map(s=>({key:s.key,label:s.label,n:openJobs.filter(r=>(!mapProject||r.project===mapProject)&&r.status===s.key).length}))
    ).filter(c=>c.key==="all"||c.n>0);
  },[openJobs,mapProject]);

  const costStats = React.useMemo(()=>{
    const total = repairs.reduce((s,r)=>s+(Number(r.cost)||0),0);
    const done  = repairs.filter(r=>r.status==="done").reduce((s,r)=>s+(Number(r.cost)||0),0);
    const pending = total - done;
    const avg = repairs.length ? total/repairs.length : 0;
    const byCatMap = {};
    repairs.forEach(r=>{
      const c = r.categoryId || "uncat";
      if(!byCatMap[c]) byCatMap[c]={count:0,cost:0};
      byCatMap[c].count++;
      byCatMap[c].cost += Number(r.cost)||0;
    });
    const byCat = Object.entries(byCatMap).map(([id,v])=>{
      const cat = window.getCategory(id);
      return {id, name:cat.name, color:cat.color, icon:cat.icon, ...v};
    }).sort((a,b)=>b.cost-a.cost);
    const byProjMap = {};
    repairs.forEach(r=>{
      const p = r.project || "ไม่ระบุโครงการ";
      if(!byProjMap[p]) byProjMap[p]={count:0,cost:0};
      byProjMap[p].count++;
      byProjMap[p].cost += Number(r.cost)||0;
    });
    const projColors = ["#1E40AF","#8B5CF6","#EF4444","#10B981","#F59E0B","#06B6D4","#EC4899","#6366F1","#14B8A6","#F97316"];
    // แสดงเป็นชื่อย่อบนกราฟ/ตาราง (หน้าเว็บ) — ชื่อเต็มเก็บไว้ใน fullName เผื่อใช้ทำเอกสาร
    const byProj = Object.entries(byProjMap).map(([name,v],i)=>({
      name: window.projectShort(name), fullName: name, color:projColors[i%projColors.length], ...v
    })).sort((a,b)=>b.cost-a.cost);
    const byMachMap = {};
    repairs.forEach(r=>{
      const mc = r.machineCode||"ไม่ระบุ";
      if(!byMachMap[mc]) byMachMap[mc]={count:0,cost:0};
      byMachMap[mc].count++;
      byMachMap[mc].cost += Number(r.cost)||0;
    });
    const machColors = ["#0EA5E9","#10B981","#F59E0B","#EF4444","#8B5CF6","#1E40AF","#EC4899","#6366F1","#14B8A6","#F97316"];
    const byMach = Object.entries(byMachMap).map(([name,v],i)=>({
      name, color:machColors[i%machColors.length], ...v
    })).sort((a,b)=>b.cost-a.cost);
    return {total,done,pending,avg,byCat,byProj,byMach};
  },[repairs]);

  const fmtBaht = (n) => "฿" + Math.round(Number(n)||0).toLocaleString();

  // สรุปอาการเสียที่พบบ่อย — รวมทุกอาการจากทุกใบแจ้งซ่อม แล้วจัดอันดับตามจำนวนครั้ง
  // มุมมอง "ข้อความเต็ม" — นับตามอาการที่พิมพ์มาทั้งบรรทัด (ของเดิม)
  const symptomStats = React.useMemo(()=>{
    const map = {};
    repairs.forEach(r=>{
      window.getProblems(r).forEach(p=>{
        const label = String(p.text||"").trim();
        if(!label) return;
        const key = label.toLowerCase().replace(/\s+/g," ");
        if(!map[key]) map[key] = { label, count:0, open:0, jobs:[] };
        map[key].count++;
        if(p.status!=="done") map[key].open++;
        if(!map[key].jobs.some(x=>x.id===r.id)) map[key].jobs.push(r);
      });
    });
    const list = Object.values(map).sort((a,b)=>b.count-a.count);
    return { list, total: list.reduce((s,x)=>s+x.count,0), max: list.length?list[0].count:0 };
  },[repairs]);

  // มุมมอง "คีย์เวิร์ด" — ตัดคำจากอาการทุกใบแล้วนับว่าคำไหนโผล่ในกี่ใบงาน (นับใบละครั้ง)
  const keywordStats = React.useMemo(()=>{
    const map = {};
    repairs.forEach(r=>{
      const text = window.getProblems(r).map(p=>p.text).filter(Boolean).join(" ") || r.title || "";
      new Set(window.extractKeywords(text)).forEach(kw=>{
        if(!map[kw]) map[kw] = { label:kw, count:0, open:0, jobs:[] };
        map[kw].count++;
        if(r.status!=="done") map[kw].open++;
        map[kw].jobs.push(r);
      });
    });
    const all = Object.values(map).sort((a,b)=>b.count-a.count || b.open-a.open);
    const repeated = all.filter(x=>x.count>1);            // คำที่โผล่ครั้งเดียวไม่ใช่ "อาการที่พบบ่อย"
    const list = repeated.length ? repeated : all;        // แต่ถ้ายังไม่มีคำซ้ำเลย ก็แสดงเท่าที่มี
    return { list, total: repairs.length, max: list.length?list[0].count:0 };
  },[repairs]);

  // มุมมอง "สรุปตามกลุ่ม" — นับใบงานต่อกลุ่มอาการ + อาการย่อยที่พบบ่อยในกลุ่ม
  const groupStats = React.useMemo(()=>{
    const defs = [...window.SYMPTOM_GROUPS, window.SYMPTOM_OTHER];
    const map = {};
    defs.forEach(g=>{ map[g.key] = { ...g, count:0, open:0, jobs:[], sub:{}, samples:[] }; });
    repairs.forEach(r=>{
      const text = window.getProblems(r).map(p=>p.text).filter(Boolean).join(" ") || r.title || "";
      if(!String(text).trim()) return;
      const hits = window.classifySymptom(text);
      const keys = Object.keys(hits);
      (keys.length ? keys : ["other"]).forEach(k=>{
        const g = map[k];
        g.count++; if(r.status!=="done") g.open++; g.jobs.push(r);
        (hits[k]||[]).forEach(d=>{ g.sub[d] = (g.sub[d]||0)+1; });
        if(k==="other" && g.samples.length<3){ const s1=String(text).split("\n")[0].trim(); if(s1) g.samples.push(s1.length>38?s1.slice(0,38)+"…":s1); }
      });
    });
    const withText = repairs.filter(r=>String(window.getProblems(r).map(p=>p.text).join(" ")||r.title||"").trim()).length;
    const list = Object.values(map).filter(g=>g.count>0)
      .map(g=>({...g, top:Object.entries(g.sub).sort((a,b)=>b[1]-a[1]).slice(0,3)}))
      .sort((a,b)=>(a.key==="other")-(b.key==="other") || b.count-a.count);
    return { list, total: withText, max: list.reduce((m,g)=>Math.max(m,g.count),0) };
  },[repairs]);

  const symptomView = symptomMode==="keyword" ? keywordStats : symptomMode==="group" ? groupStats : symptomStats;
  const symptomTop = symptomView.list.slice(0, symptomLimit);

  const counts = {
    all: repairs.length,
    assess: repairs.filter(r=>r.status==="assess").length,
    approve: repairs.filter(r=>r.status==="new").length,
    progress: repairs.filter(r=>["progress","parts"].includes(r.status)).length,
    done: repairs.filter(r=>r.status==="done").length,
  };

  React.useEffect(()=>{
    if(loading) return;
    let dead = false;
    (async()=>{
    await window.__loadChart();
    if(dead) return;
    if(doughnutRef.current){
      if(chartsRef.current.d) chartsRef.current.d.destroy();
      const catCount = {};
      repairs.forEach(r=>{ catCount[r.categoryId]=(catCount[r.categoryId]||0)+1; });
      const cats = window.__DATA.categories.filter(c=>catCount[c.id]);
      chartsRef.current.d = new Chart(doughnutRef.current,{
        type:"doughnut",
        data:{
          labels:cats.map(c=>c.name),
          datasets:[{data:cats.map(c=>catCount[c.id]),backgroundColor:cats.map(c=>c.color),borderWidth:0,hoverOffset:6}]
        },
        options:{responsive:true,maintainAspectRatio:false,cutout:"68%",plugins:{legend:{position:"right",labels:{font:{family:"Kanit",size:12},usePointStyle:true,pointStyle:"circle",padding:12}},tooltip:{titleFont:{family:"Kanit"},bodyFont:{family:"Kanit"}}}}
      });
    }
    if(barRef.current){
      if(chartsRef.current.b) chartsRef.current.b.destroy();
      const now = new Date();
      const months=[]; const labels=[]; const data=[]; const dataDone=[];
      const mThai = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
      for(let i=5;i>=0;i--){
        const d=new Date(now.getFullYear(),now.getMonth()-i,1);
        months.push(d);
        labels.push(mThai[d.getMonth()]+" "+(d.getFullYear()+543-2500));
      }
      months.forEach(m=>{
        const total = repairs.filter(r=>{const d=new Date(r.createdAt);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth();}).length;
        const done = repairs.filter(r=>{const d=new Date(r.createdAt);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth()&&r.status==="done";}).length;
        data.push(total); dataDone.push(done);
      });
      chartsRef.current.b = new Chart(barRef.current,{
        type:"bar",
        data:{labels,datasets:[{label:"งานทั้งหมด",data,backgroundColor:"#3B82F6",borderRadius:6,barThickness:18},{label:"ปิดงานแล้ว",data:dataDone,backgroundColor:"#10B981",borderRadius:6,barThickness:18}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Kanit"},usePointStyle:true,pointStyle:"circle"}},tooltip:{titleFont:{family:"Kanit"},bodyFont:{family:"Kanit"}}},scales:{x:{grid:{display:false},ticks:{font:{family:"Kanit"}}},y:{beginAtZero:true,grid:{color:"#F1F5F9"},ticks:{font:{family:"Kanit"},precision:0}}}}
      });
    }
    })();
    return ()=>{
      dead = true;
      if(chartsRef.current.d) chartsRef.current.d.destroy();
      if(chartsRef.current.b) chartsRef.current.b.destroy();
      if(chartsRef.current.c) chartsRef.current.c.destroy();
    };
  },[loading]);

  React.useEffect(()=>{
    if(loading) return;
    if(!costRef.current) return;
    let dead = false;
    (async()=>{
    await window.__loadChart();
    if(dead || !costRef.current) return;
    if(chartsRef.current.c) chartsRef.current.c.destroy();
    const src = costView==="category" ? costStats.byCat.map(x=>({label:x.name,val:x.cost,color:x.color})) : costView==="project" ? costStats.byProj.map(x=>({label:x.name,val:x.cost,color:x.color})) : costStats.byMach.map(x=>({label:x.name,val:x.cost,color:x.color}));
    chartsRef.current.c = new Chart(costRef.current,{
      type:"bar",
      data:{labels:src.map(x=>x.label),datasets:[{label:"ค่าใช้จ่าย (บาท)",data:src.map(x=>x.val),backgroundColor:src.map(x=>x.color),borderRadius:6,barThickness:22}]},
      options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{titleFont:{family:"Kanit"},bodyFont:{family:"Kanit"},callbacks:{label:(ctx)=>" ฿"+Math.round(ctx.parsed.x).toLocaleString()}}},scales:{x:{beginAtZero:true,grid:{color:"#F1F5F9"},ticks:{font:{family:"Kanit"},callback:(v)=>"฿"+Number(v).toLocaleString()}},y:{grid:{display:false},ticks:{font:{family:"Kanit",size:11.5}}}}}
    });
    })();
    return ()=>{ dead = true; };
  },[loading,costView,costStats]);

  const recent = repairs.filter(r=>r.status!=="done");
  const stats = [
    { key:"all", label:"รายการทั้งหมด", val:counts.all, icon:"fa-clipboard-list", color:"#3B82F6", delta:"+12% vs เดือนก่อน", up:true },
    { key:"assess", label:"รอประเมินราคา", val:counts.assess, icon:"fa-magnifying-glass-dollar", color:"#8B5CF6" },
    { key:"approve", label:"รออนุมัติ", val:counts.approve, icon:"fa-hourglass-half", color:"#F59E0B" },
    { key:"progress", label:"กำลังซ่อม", val:counts.progress, icon:"fa-screwdriver-wrench", color:"#EF4444" },
    { key:"done", label:"เสร็จสิ้น", val:counts.done, icon:"fa-circle-check", color:"#10B981", delta:"-3% vs เดือนก่อน", up:false },
  ];

  return (
    <>
      <Loading show={loading} />
      {!loading && <>
        <div className="stat-grid">
          {stats.map(s=>(
            <div className="stat" key={s.key}>
              <div className="ic" style={{background:s.color+"1a",color:s.color}}><i className={`fa-solid ${s.icon}`}></i></div>
              <div className="label">{s.label}</div>
              <div className="val">{s.val}</div>
              {s.delta && <div className="delta"><span className={s.up?"up":"down"}><i className={`fa-solid fa-arrow-${s.up?"up":"down"}`}></i></span> {s.delta}</div>}
            </div>
          ))}
        </div>

        {/* ── แผนที่ที่ตั้งโครงการ ────────────────────────────────── */}
        <div className="card" style={{marginBottom:18}}>
          <div className="card-h">
            <div>
              <h3><i className="fa-solid fa-map-location-dot" style={{color:"var(--primary)",marginRight:8}}></i>แผนที่ที่ตั้งโครงการ</h3>
              <div className="sub">
                ปักหมุดแล้ว {pinned.length}/{mapProjects.length} โครงการ · ตัวเลขบนหมุดคือจำนวนงานที่ยังไม่เสร็จสมบูรณ์
              </div>
            </div>
            {mapProject && (
              <button className="btn btn-ghost btn-sm" onClick={()=>setMapProject("")}>
                <i className="fa-solid fa-xmark"></i> เลิกกรอง: <span title={mapProject}>{window.projectShort(mapProject)}</span>
              </button>
            )}
          </div>
          {pinned.length===0 ? (
            <div className="card-body">
              <div className="empty" style={{padding:30}}>
                <i className="fa-solid fa-map-pin"></i>
                <div className="t" style={{fontSize:14}}>ยังไม่ได้ปักหมุดที่ตั้งโครงการ</div>
                <div>ไปที่ระบบ Asset → เมนู "โครงการ" → แก้ไขโครงการ → ปักหมุดในช่อง "ที่ตั้งโครงการ"</div>
              </div>
            </div>
          ) : (

              <tbody>
                {recent.map(r=>(
                  <tr key={r.id}>
                    <td><span className="ticket-id" style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>setDashDetail(r)}>{r.running}</span></td>

              </tbody>
            </table>
          </div>
        </div>
      </>}
      <Loading show={saving} text="กำลังบันทึก..."/>
      {dashDetail && <window.RepairDetail r={dashDetail} onClose={()=>setDashDetail(null)} user={user}

      {assessFor && <window.AssessModal r={assessFor} onClose={()=>setAssessFor(null)} onSave={(r,v)=>saveDashParts(r,v,"assess")}/>}
      {editPartsFor && <window.AssessModal r={editPartsFor} mode="edit" onClose={()=>setEditPartsFor(null)} onSave={(r,v)=>saveDashParts(r,v,"edit")}/>}
    </>
  );
}
window.Dashboard = Dashboard;
</script>

<script type="text/babel">
function Repairs({user}){
  const visibleRows = React.useMemo(()=>(
    window.filterByUserProjects(user, window.__DATA.repairs, "project")
  ),[user]);

  const [rows,setRows] = React.useState(visibleRows);
  React.useEffect(()=>{ setRows(visibleRows); },[visibleRows]);
  // ใบแจ้งซ่อมที่ส่งคำขออนุมัติลบไว้แล้ว (รอ Admin) — ขึ้นป้ายและกันกดซ้ำ
  const { mine: myDelReqs } = window.useDeleteRequests(user);
  const pendingDelIds = React.useMemo(()=>new Set(
    (myDelReqs||[]).filter(x=>x.kind!=="edit" && x.status==="pending" && x.action==="deleteRepair").map(x=>String(x.targetKey))
  ),[myDelReqs]);
  const [q,setQ] = React.useState("");
  const [status,setStatus] = React.useState("all");
  const [cat,setCat] = React.useState("all");
  const [filterProj,setFilterProj] = React.useState("all");
  const [filterMachType,setFilterMachType] = React.useState("all");
  const [detail,setDetail] = React.useState(null);
  const [editFor,setEditFor] = React.useState(null);
  const [loading,setLoading] = React.useState(false);

  const machCatMap = React.useMemo(()=>{
    const m={};
    (window.__DATA.machines||[]).forEach(x=>{if(x.code)m[x.code]=x.categoryId||"";});
    return m;
  },[]);

  const projOptions = React.useMemo(()=>[...new Set(rows.map(r=>r.project).filter(Boolean))].sort(),[rows]);
  const machTypeOptions = React.useMemo(()=>{
    const ids = new Set(rows.map(r=>machCatMap[r.machineCode]).filter(Boolean));
    return window.__DATA.categories.filter(c=>ids.has(c.id));
  },[rows,machCatMap]);

  const filtered = React.useMemo(()=>{
    return rows.filter(r=>{
      if(q){
        const qq = q.toLowerCase();
        if(!(r.running.toLowerCase().includes(qq) || r.title.toLowerCase().includes(qq) || (r.siteId||"").toLowerCase().includes(qq) || (r.subSite||"").toLowerCase().includes(qq))) return false;
      }
      if(status!=="all" && r.status!==status) return false;
      if(cat!=="all" && r.categoryId!==cat) return false;
      if(filterProj!=="all" && (r.project||"")!==filterProj) return false;
      if(filterMachType!=="all" && machCatMap[r.machineCode]!==filterMachType) return false;
      if(user.role==="Technician"){
        if(!(r.assignedId===user.id || r.status==="new" || r.status==="assess")) return false;
      }
      return true;
    });
  },[rows,q,status,cat,filterProj,filterMachType,machCatMap,user]);

  const [assessFor, setAssessFor] = React.useState(null);

  const quickAction = async (r, next, actionLabel) => {
    if(next==="assess"){ setDetail(null); setAssessFor(r); return; }
    let cost = r.cost;
    if(next==="progress"){
      const { value, isConfirmed } = await Swal.fire({
        title:"อนุมัติซ่อม",
        input:"number",inputLabel:"ค่าใช้จ่ายโดยประมาณ (บาท)",inputValue:cost||"",inputPlaceholder:"เช่น 5000",
        showCancelButton:true,confirmButtonText:"อนุมัติและเริ่มซ่อม",cancelButtonText:"ยกเลิก",confirmButtonColor:"#1E40AF"
      });
      if(!isConfirmed) return;
      cost = Number(value)||cost;
    }
    if(next==="done"){
      const { isConfirmed } = await Swal.fire({title:"ปิดงานนี้หรือไม่?",text:"ยืนยันว่างานซ่อมเสร็จสมบูรณ์แล้ว",icon:"question",showCancelButton:true,confirmButtonText:"ใช่, ปิดงาน",cancelButtonText:"ยกเลิก",confirmButtonColor:"#10B981"});
      if(!isConfirmed) return;
    }
    setLoading(true);
    try{
      await window.api("updateRepairStatus", { id:r.id, status:next, by:user.name, note:actionLabel, cost });
      const updated = {...r, status:next, cost, timeline:[...r.timeline,{status:next,when:new Date(),by:user.name,note:actionLabel}]};
      const newRows = rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs = newRows;
      setLoading(false);
      Swal.fire({icon:"success",title:"อัปเดตสถานะสำเร็จ",text:actionLabel,timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){
      setLoading(false);
      Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message});
    }
  };

  const saveAssess = async (r, {parts, laborCost, cost}) => {
    setLoading(true);
    try{
      await window.api("updateRepairStatus",{id:r.id,status:"assess",by:user.name,note:"เริ่มประเมินราคา",cost,patch:{parts,laborCost}});
      const updated={...r,status:"assess",cost,parts,laborCost,timeline:[...r.timeline,{status:"assess",when:new Date(),by:user.name,note:"เริ่มประเมินราคา"}]};
      const newRows=rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs=newRows;
      setAssessFor(null); setLoading(false);
      Swal.fire({icon:"success",title:"บันทึกการประเมินแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ setLoading(false); Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const [editPartsFor, setEditPartsFor] = React.useState(null);

  const saveEditParts = async (r, {parts, laborCost, cost}) => {
    setLoading(true);
    try{
      await window.api("updateRepairStatus",{id:r.id,status:r.status,by:user.name,note:"แก้ไขรายการอะไหล่",cost,patch:{parts,laborCost}});
      const updated={...r,cost,parts,laborCost,timeline:[...r.timeline,{status:r.status,when:new Date(),by:user.name,note:"แก้ไขรายการอะไหล่"}]};
      const newRows=rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs=newRows;
      setEditPartsFor(null); setLoading(false);
      Swal.fire({icon:"success",title:"บันทึกรายการอะไหล่แล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ setLoading(false); Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const saveEdit = async (r, patch) => {
    setLoading(true);
    try{
      try {
        await window.api("updateRepair", { id:r.id, patch, by:user.name });
      } catch(e1) {
        if(/Unknown action/i.test(String(e1.message||e1))){
          const { status, cost, ...rest } = patch;
          await window.api("updateRepairStatus", {id:r.id,status:status||r.status,cost,by:user.name,note:"แก้ไขข้อมูลโดย Admin",patch:rest});
        } else { throw e1; }
      }
      const updated = {...r,...patch,timeline:[...r.timeline,{status:patch.status||r.status,when:new Date(),by:user.name,note:"แก้ไขข้อมูลโดย Admin"}]};
      const newRows = rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs = window.__DATA.repairs.map(x=>x.id===r.id?updated:x);
      setEditFor(null); setLoading(false);
      Swal.fire({icon:"success",title:"บันทึกการแก้ไขแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){
      setLoading(false);
      Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message});
    }
  };

  const deleteRepair = async (r) => {
    const done = await window.deleteWithApproval({
      user, action:"deleteRepair", payload:{id:r.id},
      entityLabel:"ใบแจ้งซ่อม", targetName:r.running||r.id, project:r.project||"",
      targetInfo:[r.machineCode, (r.problems&&r.problems[0]&&r.problems[0].text)||r.problem||""].filter(Boolean).join(" · "),
    });
    if(done){
      setRows(rows.filter(x=>x.id!==r.id));
      window.__DATA.repairs = window.__DATA.repairs.filter(x=>x.id!==r.id);
    }
  };

  return (
    <>
      <Loading show={loading} text="กำลังบันทึก..."/>
      <div className="card">
        <div className="filters">
          <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหาเลขที่ใบงาน / อาการ..." value={q} onChange={e=>setQ(e.target.value)} /></div>
          <select value={status} onChange={e=>setStatus(e.target.value)}>
            <option value="all">ทุกสถานะ</option>
            {window.__DATA.statuses.map(s=>(<option key={s.key} value={s.key}>{s.label}</option>))}
          </select>
          <select value={cat} onChange={e=>setCat(e.target.value)}>
            <option value="all">ทุกหมวดหมู่</option>
            {window.__DATA.categories.map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}
          </select>
          <select value={filterProj} onChange={e=>setFilterProj(e.target.value)}>
            <option value="all">ทุกโครงการ</option>
            {projOptions.map(p=>(<option key={p} value={p}>{p}</option>))}
          </select>
          {machTypeOptions.length>0 && (
            <select value={filterMachType} onChange={e=>setFilterMachType(e.target.value)}>
              <option value="all">ทุกประเภทเครื่องจักร</option>
              {machTypeOptions.map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}
            </select>
          )}
          <div className="spacer"></div>
          <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>{filtered.length} / {rows.length} รายการ</div>
        </div>
        <div className="table-wrap">
          <table className="data">
            <thead><tr><th>เลขที่</th><th className="hide-on-mobile">เลขที่ไซต์งาน</th><th>วันที่แจ้ง</th><th>อาการ/ปัญหา</th><th>โครงการ/หน่วยงาน</th><th className="hide-on-mobile">หมวดหมู่</th><th>สถานะ</th><th className="hide-on-mobile">ผู้แจ้ง</th><th>จัดการ</th></tr></thead>
            <tbody>
              {filtered.map(r=>(
                <tr key={r.id}>
                  <td><span className="ticket-id" style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>setDetail(r)}>{r.running}</span></td>
                  <td className="hide-on-mobile"><span className="site-id">{r.siteId||"—"}</span></td>
                  <td style={{color:"var(--muted)",whiteSpace:"nowrap"}}>{window.__DATA.fmtDate(r.createdAt)}</td>
                  <td><div className="cell-title"><ProblemLines title={r.title} max={4}/><div className="desc">{r.machineCode&&<span className="mono" style={{marginRight:6}}>{r.machineCode}</span>}{r.desc.slice(0,60)}{r.desc.length>60?"…":""}</div></div></td>
                  <td style={{fontSize:13}}><ProjectLabel name={r.project}/>{r.subSite && <div style={{marginTop:3}}><SubSiteTag value={r.subSite} project={r.project}/></div>}</td>
                  <td className="hide-on-mobile"><CategoryChip categoryId={r.categoryId}/></td>
                  <td><Badge status={r.status}/></td>
                  <td className="hide-on-mobile"><Avatar name={r.reporterName}/>{r.reporterName}</td>
                  <td>
                    <div className="row-actions">
                      <button className="ia" title="ดูรายละเอียด" onClick={()=>setDetail(r)}><i className="fa-solid fa-eye"></i></button>
                      {user.role==="Admin"
                        ? <button className="ia" title="ลบข้อมูล" onClick={()=>deleteRepair(r)} style={{color:"#EF4444"}}><i className="fa-solid fa-trash"></i></button>
                        : pendingDelIds.has(String(r.id))
                          ? <span title="ส่งคำขอลบแล้ว รอผู้ดูแลระบบ (Admin) อนุมัติ" style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:999,background:"#FEF3C7",color:"#B45309",fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}><i className="fa-solid fa-hourglass-half"></i> รออนุมัติลบ</span>
                          : <button className="ia" title="ขออนุมัติลบรายการ (ส่งให้ Admin อนุมัติ)" onClick={()=>deleteRepair(r)} style={{color:"#EF4444"}}><i className="fa-solid fa-trash-can-arrow-up"></i></button>}
                    </div>
                  </td>
                </tr>
              ))}
              {filtered.length===0 && (<tr><td colSpan="9"><div className="empty"><i className="fa-solid fa-folder-open"></i><div className="t">ไม่พบข้อมูล</div><div>ลองเปลี่ยนเงื่อนไขการค้นหา</div></div></td></tr>)}
            </tbody>
          </table>
        </div>
      </div>
      {detail && <RepairDetail r={detail} onClose={()=>setDetail(null)} user={user} onQuick={quickAction} onProblems={(id,next,st)=>{ const upd=rows.map(x=>x.id===id?{...x,problems:next,status:st}:x); setRows(upd); window.__DATA.repairs=window.__DATA.repairs.map(x=>x.id===id?{...x,problems:next,status:st}:x); }} onEdit={["Admin","Officer","Engineer"].includes(user.role)?(r)=>{setDetail(null);setEditFor(r);}:null} onEditParts={["Admin","Officer","Engineer"].includes(user.role)?(r)=>{setDetail(null);setEditPartsFor(r);}:null}/>}
      {editFor && <EditRepairModal r={editFor} onClose={()=>setEditFor(null)} onSave={saveEdit} />}
      {assessFor && <AssessModal r={assessFor} onClose={()=>setAssessFor(null)} onSave={saveAssess}/>}
      {editPartsFor && <AssessModal r={editPartsFor} mode="edit" onClose={()=>setEditPartsFor(null)} onSave={saveEditParts}/>}
    </>
  );
}

// ข้อมูลเครื่องจักรแบบย่อ — เปิดจากใบแจ้งซ่อม (กดที่รหัสเครื่องจักร)
// อ่านอย่างเดียว ไม่มีปุ่มแก้ไข เพื่อไม่ให้ซ้อนโมดัลวนกับประวัติแจ้งซ่อมในทะเบียนเครื่องจักร
function MachineQuickView({code,onClose}){
  const [jobLimit,setJobLimit] = React.useState(12);   // ใบงานเยอะ ๆ ทยอยแสดง
  const m = (window.__DATA.machines||[]).find(x=>x.code===code) || null;
  const jobs = React.useMemo(()=>(window.__DATA.repairs||[])
    .filter(r=>r.machineCode===code)
    .slice()
    .sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt)),[code]);
  const openJobs = jobs.filter(r=>r.status!=="done" && r.status!=="cancel");
  const cost = jobs.reduce((s,r)=>s+(Number(r.cost)||0),0);
  const statusColor = ({"ใช้งาน":"#10B981","ซ่อม":"#EF4444","รอซ่อม":"#F59E0B","ส่งคืน":"#6366F1"})[m&&m.status]||"#64748B";
  const cat = m ? window.getCategory(m.categoryId) : null;
  const row = (k,v) => (<div><div className="k">{k}</div><div className="v">{v || <span style={{color:"var(--muted)"}}>—</span>}</div></div>);

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className="fa-solid fa-industry" style={{color:"var(--primary)",marginRight:8}}></i>ข้อมูลเครื่องจักร <span className="mono" style={{marginLeft:6}}>{code||"—"}</span></>}
      footer={<button className="btn btn-ghost" onClick={onClose}>ปิด</button>}>
      {!m ? (
        <div className="empty" style={{padding:30}}>
          <i className="fa-solid fa-circle-question"></i>
          <div className="t" style={{fontSize:14}}>ไม่พบรหัส "{code||"—"}" ในทะเบียนเครื่องจักร</div>
          <div>ใบแจ้งซ่อมอาจพิมพ์รหัสไว้เอง หรือเครื่องจักรถูกลบออกจากทะเบียนแล้ว</div>
        </div>
      ) : (
        <>
          <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",marginBottom:14}}>
            <span style={{width:44,height:44,borderRadius:12,display:"grid",placeItems:"center",background:"var(--accent-soft)",color:"var(--primary)",fontSize:18,flexShrink:0}}>
              <i className={`fa-solid ${m.icon||"fa-gears"}`}></i>
            </span>
            <div style={{flex:1,minWidth:160}}>
              <div style={{fontWeight:600,fontSize:16}}>{m.name||"—"}</div>
              <div style={{fontSize:12.5,color:"var(--muted)"}}>{[m.brand,m.model].filter(Boolean).join(" ")||"ไม่ระบุยี่ห้อ/รุ่น"}</div>
            </div>
            <span style={{padding:"3px 11px",borderRadius:999,fontSize:12,fontWeight:600,background:statusColor+"18",color:statusColor}}>{m.status||"—"}</span>
          </div>

          <div className="detail-grid">
            {row("รหัสเครื่องจักร", <span className="mono">{m.code}</span>)}
            {row("หมวดหมู่", cat ? <CategoryChip categoryId={m.categoryId}/> : null)}
            {row("โครงการ/หน่วยงาน", <><ProjectLabel name={m.project}/>{m.subSite && <SubSiteTag value={m.subSite} project={m.project} style={{marginLeft:6}}/>}</>)}
            {row("ซีเรียล", <span className="mono">{m.serial}</span>)}
            {row("ปีที่ผลิต", m.year)}
            {row("ขนาด", m.size)}
            {row("กรรมสิทธิ์", m.ownership)}
            {row("พนักงานขับ / ผู้ควบคุม", m.driverName)}
            {row("เลขชั่วโมงใช้งาน", m.hours ? Number(m.hours).toLocaleString("th-TH") : null)}
            {row("วันที่ตรวจสอบล่าสุด", m.inspectionDate ? window.fmtDateTH(m.inspectionDate) : null)}
            {row("ตรวจสอบครั้งถัดไป", m.nextInspectionDate ? window.fmtDateTH(m.nextInspectionDate) : null)}
            {row("ที่ตั้ง/จุดจอด", m.location)}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginTop:16}}>
            {[{l:"ใบแจ้งซ่อมทั้งหมด",v:jobs.length.toLocaleString("th-TH"),c:"#1E40AF",i:"fa-clipboard-list"},
              {l:"ที่ยังไม่เสร็จ",v:openJobs.length.toLocaleString("th-TH"),c:openJobs.length?"#B45309":"#10B981",i:"fa-screwdriver-wrench"},
              {l:"ค่าใช้จ่ายรวม (บาท)",v:cost.toLocaleString("th-TH"),c:"#047857",i:"fa-coins"}].map(s=>(
              <div key={s.l} style={{border:"1px solid var(--line)",borderRadius:10,padding:"11px 13px",background:"#fff"}}>
                <div style={{fontSize:11.5,color:"var(--muted)",marginBottom:3}}><i className={`fa-solid ${s.i}`} style={{marginRight:5,color:s.c}}></i>{s.l}</div>
                <div style={{fontWeight:600,fontSize:17,color:s.c}}>{s.v}</div>
              </div>
            ))}
          </div>

          {m.note && (
            <div style={{marginTop:14,padding:12,background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10,fontSize:13}}>
              <div style={{fontWeight:500,color:"#92400E",marginBottom:4}}><i className="fa-solid fa-note-sticky"></i> หมายเหตุ</div>
              <div style={{color:"#78350F",whiteSpace:"pre-wrap"}}>{m.note}</div>
            </div>
          )}

          {/* ประวัติการแจ้งซ่อมของเครื่องนี้ — อ่านอย่างเดียว กันเปิดใบงานซ้อนใบงานวนไปมา */}
          <div style={{marginTop:18,borderTop:"1px dashed var(--line)",paddingTop:14}}>
            <div style={{fontWeight:500,fontSize:14,marginBottom:10}}>
              <i className="fa-solid fa-clock-rotate-left" style={{color:"var(--primary)",marginRight:7}}></i>
              ประวัติการแจ้งซ่อม ({jobs.length.toLocaleString("th-TH")})
            </div>
            {jobs.length===0 ? (
              <div style={{color:"var(--muted)",fontSize:13,padding:"10px 0"}}>ยังไม่มีประวัติการแจ้งซ่อมของเครื่องจักรนี้</div>
            ) : (
              <>
                <div className="table-wrap" style={{border:"1px solid var(--line)",borderRadius:8}}>
                  <table className="data">
                    <thead><tr>
                      <th>เลขที่</th><th>วันที่แจ้ง</th><th>อาการ/ปัญหา</th>
                      <th className="hide-on-mobile">ผู้แจ้ง</th><th>สถานะ</th>
                      <th className="hide-on-mobile">ค่าใช้จ่าย</th>
                    </tr></thead>
                    <tbody>
                      {jobs.slice(0,jobLimit).map(r=>(
                        <tr key={r.id}>
                          <td><span className="ticket-id">{r.running||r.id}</span></td>
                          <td style={{color:"var(--muted)",whiteSpace:"nowrap"}}>{window.fmtDateTH(r.createdAt)}</td>
                          <td style={{fontSize:13}}><div className="cell-title"><ProblemLines title={r.title} max={3}/></div></td>
                          <td className="hide-on-mobile" style={{fontSize:13,color:"var(--muted)"}}>{r.reporterName||"—"}</td>
                          <td><Badge status={r.status}/></td>
                          <td className="hide-on-mobile" style={{whiteSpace:"nowrap",fontFamily:"JetBrains Mono,monospace",fontSize:12}}>
                            {r.cost ? "฿"+Number(r.cost).toLocaleString("th-TH") : <span style={{color:"var(--muted)"}}>—</span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                {jobs.length>jobLimit && (
                  <div style={{textAlign:"center",marginTop:10}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setJobLimit(x=>x+20)}>
                      <i className="fa-solid fa-chevron-down"></i> แสดงเพิ่ม (เหลืออีก {(jobs.length-jobLimit).toLocaleString("th-TH")} ใบ)
                    </button>
                  </div>
                )}
              </>
            )}
          </div>

          <div style={{marginTop:14,fontSize:12,color:"var(--muted)"}}>
            <i className="fa-solid fa-circle-info" style={{marginRight:6}}></i>

window.getProblems = function(r){
  if(Array.isArray(r.problems) && r.problems.length){
    return r.problems.map(p=>({text:String(p.text||""),status:p.status||r.status||"new"}));
  }
  return String(r.title||"").split("\n").map(s=>s.trim()).filter(Boolean).map(t=>({text:t,status:r.status||"new"}));
};

// สรุปสถานะรวมของใบแจ้งซ่อมจากสถานะรายอาการ — ใบงานจะ "เสร็จสมบูรณ์" ก็ต่อเมื่อทุกอาการเสร็จ
// และจะแสดงสถานะของอาการที่คืบหน้าน้อยที่สุดที่ยังไม่เสร็จ (ยกเว้นอาการที่ถูกยกเลิก)
window.deriveStatus = function(problems, fallback){
  const list = (problems||[]).filter(p=>p && p.status);
  if(!list.length) return fallback || "new";
  const active = list.filter(p=>p.status!=="cancel");
  if(!active.length) return "cancel";
  if(active.every(p=>p.status==="done")) return "done";
  const order = { new:0, assess:1, parts:2, progress:3, done:4 };
  let best = fallback || "new", bestRank = 99;
  active.forEach(p=>{
    if(p.status==="done") return;
    const rank = (p.status in order) ? order[p.status] : 0;
    if(rank < bestRank){ bestRank = rank; best = p.status; }
  });
  return best;
};

window.getRepairPlace = function(r){
  const base = {mode:"", onsite:"", other:"", reportAt:"", note:""};
  const p = r.repairPlace;
  return (p && typeof p==="object" && !Array.isArray(p)) ? Object.assign(base, p) : base;
};

// ═══ ลายเซ็นผู้ใช้งาน ═══════════════════════════════════════════════════
// เอกสารเก็บชื่อผู้ลงนามเป็นข้อความ + รหัสผู้ใช้ที่ลงนาม (เช่น senderId) แยกกัน
// ลายเซ็นจะขึ้นเฉพาะช่องที่มีรหัสผู้ใช้ — และรหัสจะถูกใส่ก็ต่อเมื่อ "เจ้าของชื่อนั้นเป็นคนบันทึกเอง"
// คนอื่นพิมพ์ชื่อเราลงเอกสาร ลายเซ็นเราจะไม่ขึ้น
const SIG_DATAURL_RE = /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/;
window.__SIG = {
  _cache: {},
  async get(userId){
    if(!userId) return "";
    if(userId in this._cache) return this._cache[userId];
    try{
      const r = await window.api("getSignature",{id:userId});
      const v = (r && r.dataUrl) || "";
      this._cache[userId] = SIG_DATAURL_RE.test(v) ? v : "";
    }catch(e){ return ""; }
    return this._cache[userId];
  },
  cached(userId){ return (userId && this._cache[userId]) || ""; },
  preload(ids){ return Promise.all([...new Set((ids||[]).filter(Boolean))].map(id=>this.get(id))); },
  async save(userId, dataUrl, by){
    if(dataUrl && !SIG_DATAURL_RE.test(dataUrl)) throw new Error("รูปแบบลายเซ็นไม่ถูกต้อง");
    await window.api("saveSignature",{id:userId, dataUrl:dataUrl||"", by: by ? {id:by.id, role:by.role, name:by.name} : undefined});
    this._cache[userId] = dataUrl || "";
  },
  // ผู้ลงนามของช่องหนึ่ง: ชื่อตรงกับคนที่บันทึก = คนนั้นเซ็น · ชื่อเดิมไม่เปลี่ยน = คงผู้ลงนามเดิม · เปลี่ยนชื่อ = ล้าง
  resolve(name, prevName, prevId, user){
    const n = String(name||"").trim();
    if(!n) return "";
    if(user && n===String(user.name||"").trim()) return user.id;
    if(n===String(prevName||"").trim()) return prevId || "";
    return "";
  },
  img(userId, style){
    const s = this.cached(userId);
    return s ? `<img src="${s}" alt="" style="${style||"display:block;margin:0 auto;max-height:11mm;max-width:90%"}">` : "";
  },
};

// ผู้แจ้งเซ็นได้เมื่อชื่อผู้แจ้งบนใบงานยังเป็นชื่อของบัญชีที่แจ้ง (ถ้ามีคนแก้ชื่อผู้แจ้งเป็นคนอื่น จะไม่ใส่ลายเซ็น)
function repairReporterSigner(r){
  if(!r || !r.reporterId) return "";
  const u = (window.__DATA.users||[]).find(x=>String(x.id)===String(r.reporterId));
  const nm = String(r.reporterName||"").trim();
  return (!nm || (u && String(u.name||"").trim()===nm)) ? r.reporterId : "";
}
