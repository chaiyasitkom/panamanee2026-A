<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1E3A8A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>ระบบแจ้งซ่อมเครื่องจักร</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" />
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
:root{
  --primary:#1E40AF;
  --primary-dark:#1E3A8A;
  --primary-darker:#172554;
  --accent:#3B82F6;
  --accent-soft:#DBEAFE;
  --bg:#F3F4F6;
  --card:#FFFFFF;
  --text:#0F172A;
  --muted:#64748B;
  --line:#E5E7EB;
  --line-soft:#F1F5F9;
  --success:#10B981;
  --warning:#F59E0B;
  --danger:#EF4444;
  --info:#0EA5E9;
  --violet:#8B5CF6;
  --amber:#D97706;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.03);
  --shadow:0 4px 14px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
  --shadow-lg:0 20px 40px -8px rgba(15,23,42,.18);
  --radius:12px;
  --radius-sm:8px;
  --radius-lg:16px;
  --row-h:52px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:"Kanit",system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html{scroll-behavior:smooth}
button{font-family:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:inherit;text-decoration:none}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
.login-brand{position:relative;overflow:hidden;padding:56px;color:#fff;background:linear-gradient(135deg,#172554 0%,#1E3A8A 45%,#1E40AF 100%);display:flex;flex-direction:column;justify-content:space-between;}
.login-brand::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 10%, rgba(59,130,246,.35), transparent 45%),radial-gradient(circle at 80% 90%, rgba(139,92,246,.25), transparent 50%);pointer-events:none;}
.login-brand .grid-bg{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:48px 48px}
.login-logo{display:flex;align-items:center;gap:12px;font-weight:600;font-size:18px;position:relative;z-index:1}
.login-logo .mark{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.2)}
.login-hero{position:relative;z-index:1}
.login-hero h1{font-size:44px;line-height:1.15;margin:0 0 16px;font-weight:600;letter-spacing:-.01em}
.login-hero p{font-size:17px;color:rgba(255,255,255,.75);max-width:440px;margin:0 0 28px;line-height:1.55}
.login-hero .chips{display:flex;gap:8px;flex-wrap:wrap}
.login-hero .chip{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-size:13px}
.login-foot{position:relative;z-index:1;font-size:13px;color:rgba(255,255,255,.55)}
.login-card-wrap{display:grid;place-items:center;padding:40px}
.login-card{width:100%;max-width:420px}
.login-card h2{font-size:28px;margin:0 0 6px;font-weight:600}
.login-card .sub{color:var(--muted);margin:0 0 28px}
.login-card label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.login-card .field{margin-bottom:16px;position:relative}
.login-card input{width:100%;padding:13px 14px 13px 42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.1)}
.login-card .field i{position:absolute;left:14px;top:40px;color:var(--muted);font-size:14px}
.login-btn{width:100%;padding:13px;border-radius:10px;background:var(--primary);color:#fff;font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .05s}
.login-btn:hover{background:var(--primary-dark)}
.login-btn:active{transform:translateY(1px)}
@media (max-width:900px){.login-wrap{grid-template-columns:1fr}.login-brand{padding:32px;min-height:200px}.login-hero h1{font-size:28px}.login-hero p{font-size:15px}}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh;min-height:100dvh}
.sidebar{background:linear-gradient(180deg,#1E3A8A 0%,#172554 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:20;}
.sidebar .brand{padding:22px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .brand .mark{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;border:1px solid rgba(255,255,255,.18)}
.sidebar .brand .t{font-weight:600;font-size:15px;line-height:1.2}
.sidebar .brand .t small{display:block;font-weight:300;font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}
.sidebar .nav{flex:1;padding:14px 10px;overflow-y:auto}
.sidebar .nav .section{font-size:11px;color:rgba(255,255,255,.4);padding:14px 12px 6px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,.75);font-size:14px;cursor:pointer;transition:background .12s,color .12s;margin-bottom:2px;font-weight:400}
.nav-item i{width:18px;text-align:center;font-size:14px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(59,130,246,.25);color:#fff;box-shadow:inset 2px 0 0 var(--accent);font-weight:500}
.nav-item .badge{margin-left:auto;background:rgba(255,255,255,.14);font-size:11px;padding:1px 7px;border-radius:999px;font-weight:500}
.sidebar .me{border-top:1px solid rgba(255,255,255,.08);padding:14px;display:flex;align-items:center;gap:10px}
.sidebar .me .avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);display:grid;place-items:center;font-weight:500}
.sidebar .me .who{flex:1;min-width:0}
.sidebar .me .who .name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar .me .who .role{font-size:11px;color:rgba(255,255,255,.55)}
.sidebar .me .logout{color:rgba(255,255,255,.55);padding:6px;border-radius:8px}
.sidebar .me .logout:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar-toggle{display:none;position:fixed;top:14px;left:14px;z-index:30;width:44px;height:44px;border-radius:12px;background:#fff;box-shadow:var(--shadow);color:var(--text);place-items:center;font-size:16px}
.sidebar-scrim{display:none}
@media (max-width:1024px){
  .shell{grid-template-columns:1fr;overflow-x:clip;max-width:100vw}
  .sidebar{position:fixed;left:0;top:0;width:280px;transform:translateX(-100%);transition:transform .22s ease-out;height:100dvh;z-index:25}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar-toggle{display:grid}
  .sidebar-scrim.show{display:block;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:19;backdrop-filter:blur(2px)}
  .main{padding:70px 18px 80px !important}
  .topbar{margin-bottom:16px;flex-wrap:wrap}
  .topbar .actions{width:100%;order:2;flex-wrap:wrap}
  .topbar .actions .search-input{display:none}
  .search-input input{width:100%}
  .role-quick{flex:1}
  .charts-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .machines-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .filters .search-input input{width:100%}
}
@media (max-width:640px){
  .main{padding:62px 12px 60px !important}
  .topbar{flex-direction:column;align-items:stretch;gap:10px}
  .topbar .title h1{font-size:19px}
  .topbar .title .crumb{font-size:12px}
  .topbar .actions{flex-wrap:wrap;gap:8px}
  .topbar .actions .btn-primary{flex:1;justify-content:center}
  .topbar .actions .search-input{display:none}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:13px}
  .stat .val{font-size:22px}
  .stat .ic{width:34px;height:34px;margin-bottom:10px}
  .card-h{padding:13px 14px}
  .card-body{padding:14px}
  .filters{flex-direction:column;align-items:stretch;padding:10px;gap:8px}
  .filters .search-input input,.filters select{width:100%;min-width:0}
  .filters .spacer{display:none}
  table.data{font-size:12.5px}
  table.data th,table.data td{padding:9px 10px}
  .cell-title{max-width:160px}
  .modal{max-height:94dvh;border-radius:16px 16px 0 0;align-self:end}
  .modal-scrim{padding:0;align-items:flex-end}
  .modal.lg,.modal.xl{max-width:100%}
  .modal-b{padding:16px;overflow-x:hidden}
  .modal-b .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .modal-h{padding:14px 16px}
  .modal-f{padding:12px 16px;flex-wrap:wrap;gap:8px}
  .modal-f .btn{flex:1;min-width:0;justify-content:center}
  .form-grid{grid-template-columns:1fr !important}
  .form-grid .full{grid-column:1/-1}
  .detail-grid{grid-template-columns:1fr !important}
  .detail-header{grid-template-columns:1fr !important}
  .kpi-line{grid-template-columns:1fr !important}
  .machines-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .status-actions{gap:4px}
  .quick-action{flex:1;justify-content:center;font-size:11.5px;padding:6px 8px}
  .tweaks-panel{bottom:12px;right:8px;left:8px;width:auto}
  .login-wrap{grid-template-columns:1fr}
  .login-brand{padding:22px;min-height:auto}
  .login-hero h1{font-size:24px}
  .login-hero p{font-size:13.5px}
  .login-card-wrap{padding:22px 18px}
  .sidebar-toggle{top:10px;left:10px;width:40px;height:40px}
  .ticket-id{font-size:11px;padding:2px 6px}
  .badge{font-size:11px;padding:2px 8px}
  .cat-chip{font-size:11px;padding:2px 7px}
  .row-actions{gap:2px}
  .ia{width:28px;height:28px}
  .hide-on-mobile{display:none !important}
}
@media (max-width:420px){
  .main{padding:58px 10px 56px !important}
  .topbar .title h1{font-size:17px}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{padding:11px}
  .stat .val{font-size:20px}
  .stat .ic{width:30px;height:30px;font-size:14px;margin-bottom:8px}
  .machines-grid{grid-template-columns:1fr}
  .btn{padding:8px 12px;font-size:13px}
  .login-hero h1{font-size:20px}
  .login-card h2{font-size:22px}
  .modal-h h3{font-size:15px}
}
@media (hover:none) and (pointer:coarse){.btn,.nav-item,.quick-action{min-height:44px}.ia{min-width:40px;min-height:40px}.btn-sm{min-height:36px}input,select,textarea{font-size:16px !important}table.data td{padding:13px 12px}}
@media (min-width:641px) and (max-width:900px){.stat-grid{grid-template-columns:repeat(3,1fr)}.charts-grid{grid-template-columns:1fr}.machines-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
.main{padding:28px 32px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.topbar .title h1{font-size:24px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
.topbar .title .crumb{color:var(--muted);font-size:13px}
.topbar .actions{display:flex;gap:10px;align-items:center}
.search-input{position:relative}
.search-input input{padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:#fff;width:260px;outline:none;font-size:13.5px}
.search-input input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.search-input i{position:absolute;left:12px;top:11px;color:var(--muted);font-size:13px}
.role-quick{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13px}
.role-quick select{border:0;background:transparent;outline:none;font-weight:500;color:var(--primary);padding-right:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:500;border:1px solid transparent;transition:background .12s,border-color .12s,color .12s,transform .05s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:#2563EB}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:#CBD5E1;background:#F8FAFC}
.btn-danger{background:#FEE2E2;color:#B91C1C}
.btn-danger:hover{background:#FECACA}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center}
.btn-sm{padding:6px 10px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:600}
.card-h .sub{color:var(--muted);font-size:12px;margin-top:2px}
.card-body{padding:22px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.stat .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:16px;margin-bottom:14px}
.stat .label{color:var(--muted);font-size:13px;margin-bottom:4px}
.stat .val{font-size:28px;font-weight:600;letter-spacing:-.02em}
.stat .delta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:4px}
.stat .delta .up{color:var(--success)}
.stat .delta .down{color:var(--danger)}
.charts-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:22px}
@media (max-width:1100px){.charts-grid{grid-template-columns:1fr}}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);background:#FAFBFC;border-radius:var(--radius) var(--radius) 0 0}
.filters .search-input input{width:320px}
.filters select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;font-size:13.5px;min-width:150px}
.filters .spacer{flex:1}
.table-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{text-align:left;padding:12px 14px;background:#FAFBFC;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.data tr:hover td{background:#FAFBFC}
table.data tr:last-child td{border-bottom:0}
body.density-compact table.data td{padding:8px 14px}
body.density-compact table.data th{padding:8px 14px}
.ticket-id{font-family:"JetBrains Mono",monospace;font-weight:500;color:var(--primary);font-size:12.5px;background:var(--accent-soft);padding:3px 8px;border-radius:6px;display:inline-block}
.site-id{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:12px}
.cell-title{font-weight:500;color:var(--text);line-height:1.3;max-width:280px}
.cell-title .desc{font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-new{background:#E0F2FE;color:#0369A1}
.b-progress{background:#FEF3C7;color:#92400E}
.b-parts{background:#FEE2E2;color:#991B1B}
.b-assess{background:#EDE9FE;color:#5B21B6}
.b-done{background:#D1FAE5;color:#065F46}
.b-cancel{background:#F1F5F9;color:#475569}
.cat-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:500}
.cat-chip i{font-size:10px}
.avatar-xs{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:500;color:#fff;margin-right:6px;vertical-align:middle}
.row-actions{display:flex;gap:4px}
@media (max-width:900px){.hide-on-mobile{display:none !important}}
@media (max-width:640px){.detail-header{grid-template-columns:1fr !important}}
.ia{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .12s,color .12s}
.ia:hover{background:var(--accent-soft);color:var(--primary)}
.ia.danger:hover{background:#FEE2E2;color:var(--danger)}
.modal-scrim{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:20px;animation:fadeIn .15s}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slideUp .2s}
.modal.lg{max-width:820px}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{margin:0;font-size:17px;font-weight:600}
.modal-h .close{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.modal-h .close:hover{background:var(--line-soft);color:var(--text)}
.modal-b{padding:22px;overflow-y:auto;overflow-x:hidden;flex:1;-webkit-overflow-scrolling:touch}
.modal-b .table-wrap,.modal-b .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#FAFBFC}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.form-field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.form-field textarea{min-height:90px;resize:vertical;font-size:14px}
.form-field .hint{color:var(--muted);font-size:11.5px;margin-top:4px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
.detail-grid .full{grid-column:1/-1}
.detail-grid .k{color:var(--muted);font-size:12px;margin-bottom:3px}
.detail-grid .v{font-size:14px;font-weight:400}
.timeline{margin-top:18px;border-top:1px dashed var(--line);padding-top:18px}

// Firebase API client — เชื่อมต่อ Firebase Realtime Database

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const _db = firebase.database();

async function _nextId(collection, prefix, pad) {
  const snap = await _db.ref('/' + collection).get();
  const items = Object.values(snap.val() || {});
  let max = 0;
  items.forEach(item => {
    const m = String(item.id || '').match(/\d+/);
    if (m) max = Math.max(max, parseInt(m[0], 10));
  });
  return prefix + String(max + 1).padStart(pad, '0');
}

async function _seedIfEmpty() {
  const snap = await _db.ref('/users').get();
  if (snap.val()) return;

  const now = new Date().toISOString();
  await _db.ref('/users/U001').set({

window.setupDatabase = async function() {

async function api(action, payload = {}) {
  switch (action) {

    case 'login': {
      const { username, password } = payload;
      const snap = await _db.ref('/users').get();
      const user = Object.values(snap.val() || {}).find(
        u => String(u.username) === String(username) && String(u.password) === String(password)
      );
      if (!user) throw new Error('Username หรือ Password ไม่ถูกต้อง');
      const safe = { ...user };
      delete safe.password;
      return safe;
    }

    case 'bootstrap': {
      await _seedIfEmpty();
      const [usersSnap, catSnap, machSnap, repSnap, projSnap] = await Promise.all([
        _db.ref('/users').get(),
        _db.ref('/categories').get(),
        _db.ref('/machines').get(),
        _db.ref('/repairs').get(),
        _db.ref('/projects').get(),
      ]);
      const users = Object.values(usersSnap.val() || {}).map(u => {
        const x = { ...u }; delete x.password; return x;
      });
      const categories = Object.values(catSnap.val() || {});
      const machines = Object.values(machSnap.val() || {});
      const repairs = Object.values(repSnap.val() || {}).map(r => ({
        ...r,
        timeline: r.timeline ? Object.values(r.timeline) : [],
      }));
      const projects = Object.values(projSnap.val() || {});
      return { users, categories, machines, repairs, projects };
    }

    case 'createProject': {
      const { project } = payload;
      if (!project.id) project.id = await _nextId('projects', 'PJ', 3);
      project.createdAt = new Date().toISOString();
      await _db.ref('/projects/' + project.id).set(project);
      return project;
    }

    case 'updateProject': {
      const { id, patch } = payload;
      await _db.ref('/projects/' + id).update(patch);
      return { updated: true };
    }

    case 'deleteProject': {
      const { id } = payload;
      await _db.ref('/projects/' + id).remove();
      return { deleted: true };
    }

    case 'createUser': {
      const { user } = payload;
      if (!user.id) user.id = await _nextId('users', 'U', 3);
      user.createdAt = new Date().toISOString();
      await _db.ref('/users/' + user.id).set(user);
      const safe = { ...user };
      delete safe.password;
      return safe;
    }

    case 'updateUser': {
      const { id, patch } = payload;
      const update = { ...patch };
      if (!update.password) delete update.password;
      await _db.ref('/users/' + id).update(update);
      return { updated: true };
    }

    case 'getUserPassword': {
      const { id } = payload;
      const snap = await _db.ref('/users/' + id + '/password').get();
      return { password: snap.val() || "" };
    }

    case 'deleteUser': {
      const { id } = payload;
      await _db.ref('/users/' + id).remove();
      return { deleted: true };
    }

    case 'createCategory': {
      const { cat } = payload;
      if (!cat.id) cat.id = await _nextId('categories', 'C', 2);
      await _db.ref('/categories/' + cat.id).set(cat);
      return cat;
    }

    case 'updateCategory': {
      const { id, patch } = payload;
      await _db.ref('/categories/' + id).update(patch);
      return { updated: true };
    }

    case 'deleteCategory': {
      const { id } = payload;
      await _db.ref('/categories/' + id).remove();
      return { deleted: true };
    }

    case 'createMachine': {
      const { m } = payload;
      if (!m.id) m.id = await _nextId('machines', 'M', 3);
      await _db.ref('/machines/' + m.id).set(m);
      return m;
    }

    case 'updateMachine': {
      const { id, patch } = payload;
      await _db.ref('/machines/' + id).update(patch);
      return { updated: true };
    }

    case 'deleteMachine': {
      const { id } = payload;
      await _db.ref('/machines/' + id).remove();
      return { deleted: true };
    }

    case 'createRepair': {
      const { repair } = payload;
      if (!repair.id) repair.id = await _nextId('repairs', 'R', 4);
      if (!repair.running) {
        const snap = await _db.ref('/repairs').get();
        const count = Object.keys(snap.val() || {}).length + 1;
        repair.running = 'RE-69/' + String(count).padStart(3, '0');
      }
      repair.createdAt = repair.createdAt || new Date().toISOString();
      repair.updatedAt = new Date().toISOString();
      repair.status = repair.status || 'new';
      repair.photos = [];
      const tlKey = _db.ref('/repairs/' + repair.id + '/timeline').push().key;
      repair.timeline = {
        [tlKey]: { id: tlKey, status: 'new', when: new Date().toISOString(), by: repair.reporterName || '', note: 'แจ้งเข้าระบบ' }
      };
      await _db.ref('/repairs/' + repair.id).set(repair);
      return { ...repair, timeline: Object.values(repair.timeline) };
    }

    case 'updateRepair': {
      const { id, patch, by } = payload;
      const clean = { ...patch };
      clean.updatedAt = new Date().toISOString();
      delete clean.id; delete clean.running; delete clean.timeline;
      const tlKey = _db.ref('/repairs/' + id + '/timeline').push().key;
      clean['timeline/' + tlKey] = {
        id: tlKey, status: clean.status || '', when: new Date().toISOString(), by: by || '', note: 'แก้ไขข้อมูลโดย Admin'
      };
      await _db.ref('/repairs/' + id).update(clean);
      return { ok: true };
    }

    case 'updateRepairStatus': {
      const { id, status, by, note, cost, patch: extraPatch } = payload;
      const ALLOW = ['title','desc','repairNote','siteId','machineCode','project','categoryId','reporterName','assignedId','parts','laborCost'];
      const clean = {};
      ALLOW.forEach(k => { if (extraPatch && extraPatch[k] !== undefined) clean[k] = extraPatch[k]; });
      clean.updatedAt = new Date().toISOString();
      if (status !== undefined) clean.status = status;
      if (cost !== undefined) clean.cost = cost;
      const tlKey = _db.ref('/repairs/' + id + '/timeline').push().key;
      clean['timeline/' + tlKey] = {
        id: tlKey, status: status || '', when: new Date().toISOString(), by: by || '', note: note || ''
      };
      await _db.ref('/repairs/' + id).update(clean);
      return { ok: true };
    }

    default:
      throw new Error('Unknown action: ' + action);
  }
}

window.api = api;

<script type="text/babel">
// Data layer — connects to Firebase Realtime Database

const STATUSES = [
  { key:"new",      label:"ใหม่",             className:"b-new",      icon:"fa-circle-plus" },
  { key:"assess",   label:"รอประเมินราคา",    className:"b-assess",   icon:"fa-magnifying-glass-dollar" },
  { key:"progress", label:"กำลังดำเนินการ",  className:"b-progress", icon:"fa-screwdriver-wrench" },
  { key:"parts",    label:"รอชิ้นส่วน",       className:"b-parts",    icon:"fa-box-open" },
  { key:"done",     label:"เสร็จสมบูรณ์",    className:"b-done",     icon:"fa-circle-check" },
  { key:"cancel",   label:"ยกเลิก",           className:"b-cancel",   icon:"fa-ban" },
];


function fmtDate(d){ if(!d) return ""; if(typeof d==="string") d=new Date(d); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtDateTime(d){ if(!d) return ""; if(typeof d==="string") d=new Date(d); return `${fmtDate(d)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

window.__DATA = {
  users: [],
  categories: [],
  machines: [],
  repairs: [],
  projects: [],
  statuses: STATUSES,
  fmtDate, fmtDateTime
};

window.__DATA.bootstrap = async function(){
  const d = await window.api("bootstrap");
  (d.repairs||[]).forEach(r=>{
    r.createdAt = r.createdAt ? new Date(r.createdAt) : new Date();
    if (!Array.isArray(r.timeline)) r.timeline = [];
    r.timeline.forEach(t => { if(t.when) t.when = new Date(t.when); });
    r.timeline.sort((a,b) => (a.when||0) - (b.when||0));
  });
  (d.repairs||[]).sort((a,b) => b.createdAt - a.createdAt);
  window.__DATA.users      = d.users      || [];
  window.__DATA.categories = d.categories || [];
  window.__DATA.machines   = d.machines   || [];
  window.__DATA.repairs    = d.repairs    || [];
  window.__DATA.projects   = d.projects   || [];
  return window.__DATA;
};

window.getStatus = (key) => STATUSES.find(s=>s.key===key) || STATUSES[0];
window.getCategory = (id) => window.__DATA.categories.find(c=>c.id===id) || {name:"-",color:"#64748B",icon:"fa-circle"};
window.getUser = (id) => window.__DATA.users.find(u=>u.id===id);

window.userCanSeeAllProjects = (user) => {
  if(!user) return false;
  if(["Admin","Director"].includes(user.role)) return true;
  if(user.role==="Engineer") return false;
  return !user.projects || !Array.isArray(user.projects) || user.projects.length===0;
};
window.userProjects = (user) => {
  if(!user) return [];
  const allNames = (window.__DATA.projects||[]).map(p=>p.name).filter(Boolean);
  if(window.userCanSeeAllProjects(user)) return allNames;
  return (Array.isArray(user.projects) ? user.projects : []).filter(p=>allNames.includes(p));
};
window.getProject = (name) => (window.__DATA.projects||[]).find(p=>p.name===name) || null;
window.userCanSeeProject = (user, project) => {
  if(window.userCanSeeAllProjects(user)) return true;
  if(!project) return true;
  return (user.projects||[]).includes(project);
};
window.filterByUserProjects = (user, items, projectKey="project") => {
  if(window.userCanSeeAllProjects(user)) return items;
  const allowed = new Set(user.projects||[]);
  return items.filter(x => !x[projectKey] || allowed.has(x[projectKey]));
};

window.avatarColor = (name) => {
  const colors=["#3B82F6","#8B5CF6","#EF4444","#10B981","#F59E0B","#06B6D4","#EC4899","#6366F1"];
  let h=0; for(const c of (name||"")) h=(h*31+c.charCodeAt(0))>>>0;
  return colors[h%colors.length];
};
window.initials = (name) => (name||"").split(" ").map(s=>s[0]).join("").slice(0,2).toUpperCase();
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

function Badge({status}){
  const s = window.getStatus(status);
  return <span className={`badge ${s.className}`}><span className="dot"></span>{s.label}</span>;
}
function CategoryChip({categoryId}){
  const c = window.getCategory(categoryId);
  return <span className="cat-chip" style={{background:c.color+"22",color:c.color}}><i className={`fa-solid ${c.icon}`}></i>{c.name}</span>;
}
function Avatar({name,size=28}){
  const bg = window.avatarColor(name);
  return <span className="avatar-xs" style={{background:bg,width:size,height:size}}>{window.initials(name)}</span>;
}
function Modal({open,onClose,title,children,footer,size=""}){
  useEffect(()=>{
    if(!open) return;
    const h=(e)=>{ if(e.key==="Escape") onClose(); };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[open,onClose]);
  if(!open) return null;
  return (
    <div className="modal-scrim" onClick={onClose}>
      <div className={`modal ${size}`} onClick={e=>e.stopPropagation()}>
        <div className="modal-h"><h3>{title}</h3><button className="close" onClick={onClose}><i className="fa-solid fa-xmark"></i></button></div>
        <div className="modal-b">{children}</div>
        {footer && <div className="modal-f">{footer}</div>}
      </div>
    </div>
  );
}
function Loading({show,text="กำลังโหลด..."}){
  if(!show) return null;
  return <div className="loading-scrim"><div className="loading-box"><div className="spinner"></div><span>{text}</span></div></div>;
}
function simulate(ms=500){ return new Promise(r=>setTimeout(r,ms)); }
Object.assign(window, { Badge, CategoryChip, Avatar, Modal, Loading, simulate });
</script>

<script type="text/babel">
function ChangePasswordModal({user,onClose}){
  const [oldPw,setOldPw] = React.useState("");
  const [newPw,setNewPw] = React.useState("");
  const [confirmPw,setConfirmPw] = React.useState("");
  const [loading,setLoading] = React.useState(false);
  const [showOld,setShowOld] = React.useState(false);
  const [showNew,setShowNew] = React.useState(false);
  const inSt = {width:"100%",padding:"10px 40px 10px 12px",border:"1px solid var(--line)",borderRadius:8,fontFamily:"Kanit",fontSize:14,outline:"none",background:"#fff"};
  const eyeBtn = (show,toggle) => (
    <button type="button" onClick={toggle} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"var(--muted)",padding:4,lineHeight:1}}>
      <i className={`fa-solid ${show?"fa-eye-slash":"fa-eye"}`}></i>
    </button>
  );
  const submit = async () => {
    if(!oldPw||!newPw||!confirmPw){ Swal.fire({icon:"warning",title:"กรุณากรอกข้อมูลให้ครบทุกช่อง"}); return; }
    if(newPw.length<6){ Swal.fire({icon:"warning",title:"รหัสผ่านใหม่สั้นเกินไป",text:"ต้องมีอย่างน้อย 6 ตัวอักษร"}); return; }
    if(newPw!==confirmPw){ Swal.fire({icon:"warning",title:"รหัสผ่านใหม่ไม่ตรงกัน",text:"กรุณากรอกรหัสผ่านใหม่และยืนยันให้ตรงกัน"}); return; }
    setLoading(true);
    try{
      await window.api("login",{username:user.username,password:oldPw});
      await window.api("updateUser",{id:user.id,patch:{password:newPw}});
      setLoading(false); onClose();
      Swal.fire({icon:"success",title:"เปลี่ยนรหัสผ่านสำเร็จ",timer:1800,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){
      setLoading(false);
      const msg = /Username หรือ Password/i.test(err.message)?"รหัสผ่านเดิมไม่ถูกต้อง":err.message;
      Swal.fire({icon:"error",title:"ไม่สำเร็จ",text:msg});
    }
  };
  return (
    <Modal open={true} onClose={onClose} title={<><i className="fa-solid fa-key" style={{color:"var(--primary)",marginRight:8}}></i>เปลี่ยนรหัสผ่าน</>} size="sm"
      footer={<><button className="btn btn-ghost" onClick={onClose} disabled={loading}>ยกเลิก</button><button className="btn btn-primary" onClick={submit} disabled={loading}>{loading?<><div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> กำลังบันทึก...</>:<><i className="fa-solid fa-check"></i> เปลี่ยนรหัสผ่าน</>}</button></>}>
      <div style={{display:"grid",gap:14}}>
        <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,padding:"10px 14px",fontSize:13,color:"#1E40AF"}}>
          <i className="fa-solid fa-user" style={{marginRight:6}}></i>บัญชี: <strong>{user.username}</strong> · {user.name}
        </div>
        <div>
          <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>รหัสผ่านเดิม <span style={{color:"#EF4444"}}>*</span></label>
          <div style={{position:"relative"}}><input style={inSt} type={showOld?"text":"password"} value={oldPw} onChange={e=>setOldPw(e.target.value)} placeholder="กรอกรหัสผ่านเดิม" autoComplete="current-password"/>{eyeBtn(showOld,()=>setShowOld(v=>!v))}</div>
        </div>
        <div>
          <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>รหัสผ่านใหม่ <span style={{color:"#EF4444"}}>*</span> <span style={{fontWeight:400}}>(อย่างน้อย 6 ตัวอักษร)</span></label>
          <div style={{position:"relative"}}><input style={inSt} type={showNew?"text":"password"} value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="กรอกรหัสผ่านใหม่" autoComplete="new-password"/>{eyeBtn(showNew,()=>setShowNew(v=>!v))}</div>
        </div>
        <div>
          <label style={{fontSize:12,color:"var(--muted)",display:"block",marginBottom:5}}>ยืนยันรหัสผ่านใหม่ <span style={{color:"#EF4444"}}>*</span></label>
          <div style={{position:"relative"}}>
            <input style={{...inSt,borderColor:confirmPw&&confirmPw!==newPw?"#EF4444":"var(--line)"}} type={showNew?"text":"password"} value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} placeholder="กรอกรหัสผ่านอีกครั้ง" autoComplete="new-password"/>
            {confirmPw&&confirmPw===newPw&&<i className="fa-solid fa-circle-check" style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:"#10B981",pointerEvents:"none"}}></i>}
            {confirmPw&&confirmPw!==newPw&&<i className="fa-solid fa-circle-xmark" style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:"#EF4444",pointerEvents:"none"}}></i>}
          </div>
          {confirmPw&&confirmPw!==newPw&&<div style={{fontSize:12,color:"#EF4444",marginTop:4}}>รหัสผ่านไม่ตรงกัน</div>}
        </div>
      </div>
    </Modal>
  );
}

<script type="text/babel">
function Projects({user}){
  const [rows,setRows] = React.useState(window.__DATA.projects||[]);
  const [edit,setEdit] = React.useState(null);
  const [q,setQ] = React.useState("");

  const filtered = rows.filter(p=>{
    if(!q) return true;
    return (p.name||"").toLowerCase().includes(q.toLowerCase()) || (p.code||"").toLowerCase().includes(q.toLowerCase());
  });

  const save = async (form) => {
    try{
      if(form.id){
        await window.api("updateProject",{id:form.id,patch:form});
        const upd = rows.map(x=>x.id===form.id?form:x);
        setRows(upd); window.__DATA.projects=upd;
      } else {
        const nu = await window.api("createProject",{project:form});
        const upd=[...rows,nu]; setRows(upd); window.__DATA.projects=upd;
      }
      setEdit(null);
      Swal.fire({icon:"success",title:"บันทึกสำเร็จ",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const del = (p) => {
    const machineCount = (window.__DATA.machines||[]).filter(m=>m.project===p.name).length;
    const html = machineCount>0
      ? `ต้องการลบโครงการ "<strong>${p.name}</strong>"?<br/><span style="color:#EF4444;font-size:13px">มีเครื่องจักรในโครงการนี้ ${machineCount} รายการ</span>`
      : `ต้องการลบโครงการ "<strong>${p.name}</strong>" ใช่หรือไม่?`;
    Swal.fire({title:"ลบโครงการ?",html,icon:"warning",showCancelButton:true,confirmButtonText:"ลบ",cancelButtonText:"ยกเลิก",confirmButtonColor:"#EF4444"}).then(async r=>{
      if(r.isConfirmed){
        try{
          await window.api("deleteProject",{id:p.id});
          const upd=rows.filter(x=>x.id!==p.id); setRows(upd); window.__DATA.projects=upd;
          Swal.fire({icon:"success",title:"ลบแล้ว",timer:1000,showConfirmButton:false,toast:true,position:"top-end"});
        }catch(err){ Swal.fire({icon:"error",title:"ลบไม่สำเร็จ",text:err.message}); }
      }
    });
  };

  const STATUS_COLOR = {active:"#10B981",inactive:"#94A3B8"};
  const STATUS_LABEL = {active:"ดำเนินการ",inactive:"ปิดโครงการ"};

  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหาชื่อ / รหัสโครงการ..." value={q} onChange={e=>setQ(e.target.value)}/></div>
        <div className="spacer"></div>
        {["Admin","Officer"].includes(user.role) && (
          <button className="btn btn-primary" onClick={()=>setEdit({name:"",code:"",desc:"",status:"active",color:"#3B82F6"})}>
            <i className="fa-solid fa-plus"></i> เพิ่มโครงการ
          </button>
        )}
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr>
            <th style={{width:44}} className="hide-on-mobile">#</th>
            <th style={{width:100}} className="hide-on-mobile">รหัส</th>
            <th>ชื่อโครงการ</th>
            <th className="hide-on-mobile">รายละเอียด</th>
            <th style={{width:100}}>สถานะ</th>
            <th style={{width:80}} className="hide-on-mobile">เครื่องจักร</th>
            <th style={{width:80}} className="hide-on-mobile">แจ้งซ่อม</th>
            <th style={{width:90}}>จัดการ</th>
          </tr></thead>
          <tbody>
            {filtered.map((p,i)=>{
              const mCnt=(window.__DATA.machines||[]).filter(m=>m.project===p.name).length;
              const rCnt=(window.__DATA.repairs||[]).filter(r=>r.project===p.name).length;
              const sc=STATUS_COLOR[p.status]||"#94A3B8";
              return (
                <tr key={p.id}>
                  <td className="hide-on-mobile" style={{color:"var(--muted)",fontSize:12}}>{i+1}</td>
                  <td className="hide-on-mobile"><span className="mono" style={{fontSize:12,fontWeight:500,color:"var(--primary)",background:"var(--accent-soft)",padding:"2px 8px",borderRadius:6}}>{p.code||"—"}</span></td>
                  <td>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{width:10,height:10,borderRadius:"50%",background:p.color||"#3B82F6",flexShrink:0,display:"inline-block"}}></span>
                      <span style={{fontWeight:500}}>{p.name}</span>
                    </div>
                  </td>
                  <td className="hide-on-mobile" style={{color:"var(--muted)",fontSize:13,maxWidth:260}}><div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.desc||"—"}</div></td>
                  <td><span style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:12,fontWeight:500,padding:"3px 10px",borderRadius:999,background:sc+"22",color:sc}}><span style={{width:6,height:6,borderRadius:"50%",background:sc}}></span>{STATUS_LABEL[p.status]||p.status}</span></td>
                  <td className="hide-on-mobile" style={{textAlign:"center"}}><strong>{mCnt}</strong> <span style={{color:"var(--muted)",fontSize:12}}>รายการ</span></td>
                  <td className="hide-on-mobile" style={{textAlign:"center"}}><strong>{rCnt}</strong> <span style={{color:"var(--muted)",fontSize:12}}>รายการ</span></td>
                  <td>
                    <div className="row-actions">
                      {["Admin","Officer"].includes(user.role) && <>
                        <button className="ia" onClick={()=>setEdit(p)} title="แก้ไข"><i className="fa-solid fa-pen"></i></button>
                        <button className="ia danger" onClick={()=>del(p)} title="ลบ"><i className="fa-solid fa-trash"></i></button>
                      </>}
                    </div>
                  </td>
                </tr>
              );
            })}
            {filtered.length===0 && <tr><td colSpan="8"><div className="empty"><i className="fa-solid fa-diagram-project"></i><div className="t">ยังไม่มีโครงการ</div><div>กดปุ่ม "เพิ่มโครงการ" เพื่อเริ่มต้น</div></div></td></tr>}
          </tbody>
        </table>
      </div>
      {edit && <ProjectForm init={edit} onClose={()=>setEdit(null)} onSave={save}/>}
    </div>
  );
}

function ProjectForm({init,onClose,onSave}){
  const [f,setF] = React.useState(init);
  const palette = ["#3B82F6","#8B5CF6","#EF4444","#10B981","#F59E0B","#06B6D4","#EC4899","#6366F1","#F97316","#14B8A6","#A855F7","#0EA5E9","#DC2626","#16A34A","#D97706","#64748B"];

  return (
    <Modal open={true} onClose={onClose} title={init.id?"แก้ไขโครงการ":"เพิ่มโครงการใหม่"}
      footer={<>
        <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={()=>onSave(f)}><i className="fa-solid fa-floppy-disk"></i> บันทึก</button>
      </>}>
      <div className="form-grid">
        <div className="form-field" style={{gridColumn:"1/-1"}}>
          <label>ชื่อโครงการ *</label>
          <input value={f.name||""} onChange={e=>setF({...f,name:e.target.value})} placeholder="เช่น โรงงาน A - สายการผลิต 1" />
        </div>
        <div className="form-field">
          <label>รหัสโครงการ</label>
          <input className="mono" value={f.code||""} onChange={e=>setF({...f,code:e.target.value})} placeholder="เช่น PRJ-001" />
        </div>
        <div className="form-field">
          <label>สถานะ</label>
          <select value={f.status||"active"} onChange={e=>setF({...f,status:e.target.value})}>
            <option value="active">ดำเนินการ</option>
            <option value="inactive">ปิดโครงการ</option>
          </select>
        </div>
        <div className="form-field" style={{gridColumn:"1/-1"}}>
          <label>รายละเอียด</label>
          <textarea rows="2" value={f.desc||""} onChange={e=>setF({...f,desc:e.target.value})} placeholder="รายละเอียดโครงการ สถานที่ตั้ง ฯลฯ"></textarea>
        </div>
        <div className="form-field" style={{gridColumn:"1/-1"}}>
          <label>สีประจำโครงการ</label>
          <div className="color-grid">
            {palette.map(c=>(
              <button key={c} className={f.color===c?"sel":""} style={{background:c}} onClick={()=>setF({...f,color:c})}></button>
            ))}
          </div>
        </div>
      </div>
      <div style={{marginTop:16,padding:14,background:"#FAFBFC",borderRadius:10,border:"1px dashed var(--line)"}}>
        <div style={{fontSize:11,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:8,fontWeight:500}}>ตัวอย่าง</div>
        <div style={{display:"inline-flex",alignItems:"center",gap:8,padding:"6px 14px",borderRadius:999,background:(f.color||"#3B82F6")+"22",color:f.color||"#3B82F6",fontWeight:500,fontSize:13}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:f.color||"#3B82F6"}}></span>
          {f.code && <span className="mono" style={{fontSize:12}}>{f.code}</span>}
          <span>{f.name||"ชื่อโครงการ"}</span>
        </div>
      </div>
    </Modal>
  );
}

window.Projects = Projects;
</script>


<script type="text/babel">
function Dashboard({user,goTo}){
  const [loading,setLoading] = React.useState(true);
  const [costView,setCostView] = React.useState("category");
  const [dashDetail,setDashDetail] = React.useState(null);
  const doughnutRef = React.useRef(null);
  const barRef = React.useRef(null);
  const costRef = React.useRef(null);
  const chartsRef = React.useRef({});

  React.useEffect(()=>{
    const t = setTimeout(()=>setLoading(false),350);
    return ()=>clearTimeout(t);
  },[]);

  const repairs = React.useMemo(()=>{
    if(window.userCanSeeAllProjects(user)) return window.__DATA.repairs;
    const allowed = new Set(user.projects||[]);
    return window.__DATA.repairs.filter(r=>!r.project || allowed.has(r.project));
  },[user]);

  const costStats = React.useMemo(()=>{
    const total = repairs.reduce((s,r)=>s+(Number(r.cost)||0),0);
    const done  = repairs.filter(r=>r.status==="done").reduce((s,r)=>s+(Number(r.cost)||0),0);
    const pending = total - done;
    const avg = repairs.length ? total/repairs.length : 0;
    const byCatMap = {};
    repairs.forEach(r=>{
      const c = r.categoryId || "uncat";
      if(!byCatMap[c]) byCatMap[c]={count:0,cost:0};
      byCatMap[c].count++;
      byCatMap[c].cost += Number(r.cost)||0;
    });
    const byCat = Object.entries(byCatMap).map(([id,v])=>{
      const cat = window.getCategory(id);
      return {id, name:cat.name, color:cat.color, icon:cat.icon, ...v};
    }).sort((a,b)=>b.cost-a.cost);
    const byProjMap = {};
    repairs.forEach(r=>{
      const p = r.project || "ไม่ระบุโครงการ";
      if(!byProjMap[p]) byProjMap[p]={count:0,cost:0};
      byProjMap[p].count++;
      byProjMap[p].cost += Number(r.cost)||0;
    });
    const projColors = ["#1E40AF","#8B5CF6","#EF4444","#10B981","#F59E0B","#06B6D4","#EC4899","#6366F1","#14B8A6","#F97316"];
    const byProj = Object.entries(byProjMap).map(([name,v],i)=>({
      name, color:projColors[i%projColors.length], ...v
    })).sort((a,b)=>b.cost-a.cost);
    const byMachMap = {};
    repairs.forEach(r=>{
      const mc = r.machineCode||"ไม่ระบุ";
      if(!byMachMap[mc]) byMachMap[mc]={count:0,cost:0};
      byMachMap[mc].count++;
      byMachMap[mc].cost += Number(r.cost)||0;
    });
    const machColors = ["#0EA5E9","#10B981","#F59E0B","#EF4444","#8B5CF6","#1E40AF","#EC4899","#6366F1","#14B8A6","#F97316"];
    const byMach = Object.entries(byMachMap).map(([name,v],i)=>({
      name, color:machColors[i%machColors.length], ...v
    })).sort((a,b)=>b.cost-a.cost);
    return {total,done,pending,avg,byCat,byProj,byMach};
  },[repairs]);

  const fmtBaht = (n) => "฿" + Math.round(Number(n)||0).toLocaleString();

  const counts = {
    all: repairs.length,
    assess: repairs.filter(r=>r.status==="assess").length,
    approve: repairs.filter(r=>r.status==="new").length,
    progress: repairs.filter(r=>["progress","parts"].includes(r.status)).length,
    done: repairs.filter(r=>r.status==="done").length,
  };

  React.useEffect(()=>{
    if(loading) return;
    if(doughnutRef.current){
      if(chartsRef.current.d) chartsRef.current.d.destroy();
      const catCount = {};
      repairs.forEach(r=>{ catCount[r.categoryId]=(catCount[r.categoryId]||0)+1; });
      const cats = window.__DATA.categories.filter(c=>catCount[c.id]);
      chartsRef.current.d = new Chart(doughnutRef.current,{
        type:"doughnut",
        data:{
          labels:cats.map(c=>c.name),
          datasets:[{data:cats.map(c=>catCount[c.id]),backgroundColor:cats.map(c=>c.color),borderWidth:0,hoverOffset:6}]
        },
        options:{responsive:true,maintainAspectRatio:false,cutout:"68%",plugins:{legend:{position:"right",labels:{font:{family:"Kanit",size:12},usePointStyle:true,pointStyle:"circle",padding:12}},tooltip:{titleFont:{family:"Kanit"},bodyFont:{family:"Kanit"}}}}
      });
    }
    if(barRef.current){
      if(chartsRef.current.b) chartsRef.current.b.destroy();
      const now = new Date();
      const months=[]; const labels=[]; const data=[]; const dataDone=[];
      const mThai = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
      for(let i=5;i>=0;i--){
        const d=new Date(now.getFullYear(),now.getMonth()-i,1);
        months.push(d);
        labels.push(mThai[d.getMonth()]+" "+(d.getFullYear()+543-2500));
      }
      months.forEach(m=>{
        const total = repairs.filter(r=>{const d=new Date(r.createdAt);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth();}).length;
        const done = repairs.filter(r=>{const d=new Date(r.createdAt);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth()&&r.status==="done";}).length;
        data.push(total); dataDone.push(done);
      });
      chartsRef.current.b = new Chart(barRef.current,{
        type:"bar",
        data:{labels,datasets:[{label:"งานทั้งหมด",data,backgroundColor:"#3B82F6",borderRadius:6,barThickness:18},{label:"ปิดงานแล้ว",data:dataDone,backgroundColor:"#10B981",borderRadius:6,barThickness:18}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Kanit"},usePointStyle:true,pointStyle:"circle"}},tooltip:{titleFont:{family:"Kanit"},bodyFont:{family:"Kanit"}}},scales:{x:{grid:{display:false},ticks:{font:{family:"Kanit"}}},y:{beginAtZero:true,grid:{color:"#F1F5F9"},ticks:{font:{family:"Kanit"},precision:0}}}}
      });
    }
    return ()=>{
      if(chartsRef.current.d) chartsRef.current.d.destroy();
      if(chartsRef.current.b) chartsRef.current.b.destroy();
      if(chartsRef.current.c) chartsRef.current.c.destroy();
    };
  },[loading]);

  React.useEffect(()=>{
    if(loading) return;
    if(!costRef.current) return;
    if(chartsRef.current.c) chartsRef.current.c.destroy();
    const src = costView==="category" ? costStats.byCat.map(x=>({label:x.name,val:x.cost,color:x.color})) : costView==="project" ? costStats.byProj.map(x=>({label:x.name,val:x.cost,color:x.color})) : costStats.byMach.map(x=>({label:x.name,val:x.cost,color:x.color}));
    chartsRef.current.c = new Chart(costRef.current,{
      type:"bar",
      data:{labels:src.map(x=>x.label),datasets:[{label:"ค่าใช้จ่าย (บาท)",data:src.map(x=>x.val),backgroundColor:src.map(x=>x.color),borderRadius:6,barThickness:22}]},
      options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{titleFont:{family:"Kanit"},bodyFont:{family:"Kanit"},callbacks:{label:(ctx)=>" ฿"+Math.round(ctx.parsed.x).toLocaleString()}}},scales:{x:{beginAtZero:true,grid:{color:"#F1F5F9"},ticks:{font:{family:"Kanit"},callback:(v)=>"฿"+Number(v).toLocaleString()}},y:{grid:{display:false},ticks:{font:{family:"Kanit",size:11.5}}}}}
    });
  },[loading,costView,costStats]);

  const recent = repairs.filter(r=>r.status!=="done");
  const stats = [
    { key:"all", label:"รายการทั้งหมด", val:counts.all, icon:"fa-clipboard-list", color:"#3B82F6", delta:"+12% vs เดือนก่อน", up:true },
    { key:"assess", label:"รอประเมินราคา", val:counts.assess, icon:"fa-magnifying-glass-dollar", color:"#8B5CF6" },
    { key:"approve", label:"รออนุมัติ", val:counts.approve, icon:"fa-hourglass-half", color:"#F59E0B" },
    { key:"progress", label:"กำลังซ่อม", val:counts.progress, icon:"fa-screwdriver-wrench", color:"#EF4444" },
    { key:"done", label:"เสร็จสิ้น", val:counts.done, icon:"fa-circle-check", color:"#10B981", delta:"-3% vs เดือนก่อน", up:false },
  ];

  return (
    <>
      <Loading show={loading} />
      {!loading && <>
        <div className="stat-grid">
          {stats.map(s=>(
            <div className="stat" key={s.key}>
              <div className="ic" style={{background:s.color+"1a",color:s.color}}><i className={`fa-solid ${s.icon}`}></i></div>
              <div className="label">{s.label}</div>
              <div className="val">{s.val}</div>
              {s.delta && <div className="delta"><span className={s.up?"up":"down"}><i className={`fa-solid fa-arrow-${s.up?"up":"down"}`}></i></span> {s.delta}</div>}
            </div>
          ))}
        </div>
        <div className="charts-grid">
          <div className="card">
            <div className="card-h"><div><h3>สถิติย้อนหลัง 6 เดือน</h3><div className="sub">เปรียบเทียบจำนวนงานแจ้งเข้าและงานที่ปิดแล้ว</div></div><button className="btn btn-ghost btn-sm"><i className="fa-solid fa-download"></i> Export</button></div>
            <div className="card-body" style={{height:320}}><canvas ref={barRef}></canvas></div>
          </div>
          <div className="card">
            <div className="card-h"><div><h3>สัดส่วนตามหมวดหมู่</h3><div className="sub">งานซ่อมทั้งหมดแยกตามประเภท</div></div></div>
            <div className="card-body" style={{height:320}}><canvas ref={doughnutRef}></canvas></div>
          </div>
        </div>
        <div className="stat-grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",marginBottom:18}}>
          <div className="stat"><div className="ic" style={{background:"rgba(30,64,175,.1)",color:"#1E40AF"}}><i className="fa-solid fa-sack-dollar"></i></div><div className="label">ประเมินค่าใช้จ่ายรวม</div><div className="val" style={{fontSize:22}}>{fmtBaht(costStats.total)}</div></div>
          <div className="stat"><div className="ic" style={{background:"rgba(16,185,129,.1)",color:"#10B981"}}><i className="fa-solid fa-circle-check"></i></div><div className="label">ปิดงาน/จ่ายแล้ว</div><div className="val" style={{fontSize:22}}>{fmtBaht(costStats.done)}</div></div>
          <div className="stat"><div className="ic" style={{background:"rgba(245,158,11,.1)",color:"#F59E0B"}}><i className="fa-solid fa-clock"></i></div><div className="label">ค้างอยู่ในระบบ</div><div className="val" style={{fontSize:22}}>{fmtBaht(costStats.pending)}</div></div>
          <div className="stat"><div className="ic" style={{background:"rgba(139,92,246,.1)",color:"#8B5CF6"}}><i className="fa-solid fa-chart-line"></i></div><div className="label">เฉลี่ย/งาน</div><div className="val" style={{fontSize:22}}>{fmtBaht(costStats.avg)}</div></div>
        </div>
        <div className="card" style={{marginBottom:18}}>
          <div className="card-h">
            <div><h3>ประเมินค่าใช้จ่าย</h3><div className="sub">แยกตาม{costView==="category"?"หมวดหมู่":costView==="project"?"โครงการ":"เครื่องจักร"} · {repairs.length} งาน · รวม {fmtBaht(costStats.total)}</div></div>
            <div className="seg" style={{display:"inline-flex",background:"var(--bg)",border:"1px solid var(--line)",borderRadius:10,padding:3}}>
              <button onClick={()=>setCostView("category")} style={{padding:"7px 14px",borderRadius:7,border:"none",fontSize:13,cursor:"pointer",background:costView==="category"?"var(--primary)":"transparent",color:costView==="category"?"#fff":"var(--muted)",fontFamily:"Kanit"}}><i className="fa-solid fa-tags"></i> หมวดหมู่</button>
              <button onClick={()=>setCostView("project")} style={{padding:"7px 14px",borderRadius:7,border:"none",fontSize:13,cursor:"pointer",background:costView==="project"?"var(--primary)":"transparent",color:costView==="project"?"#fff":"var(--muted)",fontFamily:"Kanit"}}><i className="fa-solid fa-diagram-project"></i> โครงการ</button>
              <button onClick={()=>setCostView("machine")} style={{padding:"7px 14px",borderRadius:7,border:"none",fontSize:13,cursor:"pointer",background:costView==="machine"?"var(--primary)":"transparent",color:costView==="machine"?"#fff":"var(--muted)",fontFamily:"Kanit"}}><i className="fa-solid fa-industry"></i> เครื่องจักร</button>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1.2fr 1fr",gap:0}}>
            <div className="card-body" style={{height:360,borderRight:"1px solid var(--line)"}}><canvas ref={costRef}></canvas></div>
            <div style={{maxHeight:360,overflowY:"auto"}}>
              <table className="data">
                <thead><tr><th>{costView==="category"?"หมวดหมู่":costView==="project"?"โครงการ":"เครื่องจักร"}</th><th style={{textAlign:"right"}}>งาน</th><th style={{textAlign:"right"}}>ค่าใช้จ่าย</th><th style={{textAlign:"right"}}>%</th></tr></thead>
                <tbody>
                  {(costView==="category"?costStats.byCat:costView==="project"?costStats.byProj:costStats.byMach).map((x,i)=>{
                    const pct = costStats.total ? (x.cost/costStats.total*100) : 0;
                    return (
                      <tr key={i}>
                        <td><span style={{display:"inline-flex",alignItems:"center",gap:8}}><span style={{width:10,height:10,borderRadius:"50%",background:x.color,display:"inline-block"}}></span><span style={{fontSize:13}}>{x.name}</span></span></td>
                        <td style={{textAlign:"right",color:"var(--muted)",fontSize:12.5}}>{x.count}</td>
                        <td style={{textAlign:"right",fontWeight:500,fontSize:13}}>{fmtBaht(x.cost)}</td>
                        <td style={{textAlign:"right",color:"var(--muted)",fontSize:12}}>{pct.toFixed(1)}%</td>
                      </tr>
                    );
                  })}
                  {(costView==="category"?costStats.byCat:costView==="project"?costStats.byProj:costStats.byMach).length===0 && (
                    <tr><td colSpan="4"><div className="empty" style={{padding:30}}><i className="fa-solid fa-chart-column"></i><div className="t" style={{fontSize:14}}>ยังไม่มีข้อมูลค่าใช้จ่าย</div></div></td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div className="card">
          <div className="card-h"><div><h3>รายการแจ้งซ่อมที่ยังดำเนินการอยู่</h3><div className="sub">{recent.length} รายการ · ยกเว้นงานที่เสร็จสมบูรณ์แล้ว</div></div><button className="btn btn-ghost btn-sm" onClick={()=>goTo("repairs")}>ดูทั้งหมด <i className="fa-solid fa-arrow-right"></i></button></div>
          <div className="table-wrap">
            <table className="data">
              <thead><tr><th>เลขที่</th><th>อาการ/ปัญหา</th><th className="hide-on-mobile">หมวดหมู่</th><th>สถานะ</th><th className="hide-on-mobile">ผู้แจ้ง</th><th className="hide-on-mobile">วันที่</th></tr></thead>
              <tbody>
                {recent.map(r=>(
                  <tr key={r.id}>
                    <td><span className="ticket-id" style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>setDashDetail(r)}>{r.running}</span></td>
                    <td><div className="cell-title">{r.title}</div></td>
                    <td className="hide-on-mobile"><CategoryChip categoryId={r.categoryId}/></td>
                    <td><Badge status={r.status}/></td>
                    <td className="hide-on-mobile"><Avatar name={r.reporterName}/>{r.reporterName}</td>
                    <td className="hide-on-mobile" style={{color:"var(--muted)"}}>{window.__DATA.fmtDate(r.createdAt)}</td>
                  </tr>
                ))}
                {recent.length===0&&(<tr><td colSpan="6"><div className="empty"><i className="fa-solid fa-circle-check" style={{color:"#10B981"}}></i><div className="t">ไม่มีงานค้างอยู่</div><div>งานทั้งหมดเสร็จสมบูรณ์แล้ว</div></div></td></tr>)}
              </tbody>
            </table>
          </div>
        </div>
      </>}
      {dashDetail && <window.RepairDetail r={dashDetail} onClose={()=>setDashDetail(null)} user={user} onQuick={null} onEdit={null} onEditParts={null}/>}
    </>
  );
}
window.Dashboard = Dashboard;
</script>

<script type="text/babel">
function Repairs({user}){
  const allowAll = window.userCanSeeAllProjects(user);
  const allowed = new Set(user.projects||[]);
  const visibleRows = React.useMemo(()=>(
    allowAll ? window.__DATA.repairs : window.__DATA.repairs.filter(r=>!r.project || allowed.has(r.project))
  ),[allowAll]);

  const [rows,setRows] = React.useState(visibleRows);
  React.useEffect(()=>{ setRows(visibleRows); },[visibleRows]);
  const [q,setQ] = React.useState("");
  const [status,setStatus] = React.useState("all");
  const [cat,setCat] = React.useState("all");
  const [filterProj,setFilterProj] = React.useState("all");
  const [filterMachType,setFilterMachType] = React.useState("all");
  const [detail,setDetail] = React.useState(null);
  const [statusFor,setStatusFor] = React.useState(null);
  const [editFor,setEditFor] = React.useState(null);
  const [loading,setLoading] = React.useState(false);

  const machCatMap = React.useMemo(()=>{
    const m={};
    (window.__DATA.machines||[]).forEach(x=>{if(x.code)m[x.code]=x.categoryId||"";});
    return m;
  },[]);

  const projOptions = React.useMemo(()=>[...new Set(rows.map(r=>r.project).filter(Boolean))].sort(),[rows]);
  const machTypeOptions = React.useMemo(()=>{
    const ids = new Set(rows.map(r=>machCatMap[r.machineCode]).filter(Boolean));
    return window.__DATA.categories.filter(c=>ids.has(c.id));
  },[rows,machCatMap]);

  const filtered = React.useMemo(()=>{
    return rows.filter(r=>{
      if(q){
        const qq = q.toLowerCase();
        if(!(r.running.toLowerCase().includes(qq) || r.title.toLowerCase().includes(qq) || (r.siteId||"").toLowerCase().includes(qq))) return false;
      }
      if(status!=="all" && r.status!==status) return false;
      if(cat!=="all" && r.categoryId!==cat) return false;
      if(filterProj!=="all" && (r.project||"")!==filterProj) return false;
      if(filterMachType!=="all" && machCatMap[r.machineCode]!==filterMachType) return false;
      if(user.role==="Technician"){
        if(!(r.assignedId===user.id || r.status==="new" || r.status==="assess")) return false;
      }
      return true;
    });
  },[rows,q,status,cat,filterProj,filterMachType,machCatMap,user]);

  const [assessFor, setAssessFor] = React.useState(null);

  const quickAction = async (r, next, actionLabel) => {
    if(next==="assess"){ setDetail(null); setAssessFor(r); return; }
    let cost = r.cost;
    if(next==="progress"){
      const { value, isConfirmed } = await Swal.fire({
        title:"อนุมัติซ่อม",
        input:"number",inputLabel:"ค่าใช้จ่ายโดยประมาณ (บาท)",inputValue:cost||"",inputPlaceholder:"เช่น 5000",
        showCancelButton:true,confirmButtonText:"อนุมัติและเริ่มซ่อม",cancelButtonText:"ยกเลิก",confirmButtonColor:"#1E40AF"
      });
      if(!isConfirmed) return;
      cost = Number(value)||cost;
    }
    if(next==="done"){
      const { isConfirmed } = await Swal.fire({title:"ปิดงานนี้หรือไม่?",text:"ยืนยันว่างานซ่อมเสร็จสมบูรณ์แล้ว",icon:"question",showCancelButton:true,confirmButtonText:"ใช่, ปิดงาน",cancelButtonText:"ยกเลิก",confirmButtonColor:"#10B981"});
      if(!isConfirmed) return;
    }
    setLoading(true);
    try{
      await window.api("updateRepairStatus", { id:r.id, status:next, by:user.name, note:actionLabel, cost });
      const updated = {...r, status:next, cost, timeline:[...r.timeline,{status:next,when:new Date(),by:user.name,note:actionLabel}]};
      const newRows = rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs = newRows;
      setLoading(false);
      Swal.fire({icon:"success",title:"อัปเดตสถานะสำเร็จ",text:actionLabel,timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){
      setLoading(false);
      Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message});
    }
  };

  const saveAssess = async (r, {parts, laborCost, cost}) => {
    setLoading(true);
    try{
      await window.api("updateRepairStatus",{id:r.id,status:"assess",by:user.name,note:"เริ่มประเมินราคา",cost,patch:{parts,laborCost}});
      const updated={...r,status:"assess",cost,parts,laborCost,timeline:[...r.timeline,{status:"assess",when:new Date(),by:user.name,note:"เริ่มประเมินราคา"}]};
      const newRows=rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs=newRows;
      setAssessFor(null); setLoading(false);
      Swal.fire({icon:"success",title:"บันทึกการประเมินแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ setLoading(false); Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const [editPartsFor, setEditPartsFor] = React.useState(null);

  const saveEditParts = async (r, {parts, laborCost, cost}) => {
    setLoading(true);
    try{
      await window.api("updateRepairStatus",{id:r.id,status:r.status,by:user.name,note:"แก้ไขรายการอะไหล่",cost,patch:{parts,laborCost}});
      const updated={...r,cost,parts,laborCost,timeline:[...r.timeline,{status:r.status,when:new Date(),by:user.name,note:"แก้ไขรายการอะไหล่"}]};
      const newRows=rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs=newRows;
      setEditPartsFor(null); setLoading(false);
      Swal.fire({icon:"success",title:"บันทึกรายการอะไหล่แล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ setLoading(false); Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const saveEdit = async (r, patch) => {
    setLoading(true);
    try{
      try {
        await window.api("updateRepair", { id:r.id, patch, by:user.name });
      } catch(e1) {
        if(/Unknown action/i.test(String(e1.message||e1))){
          const { status, cost, ...rest } = patch;
          await window.api("updateRepairStatus", {id:r.id,status:status||r.status,cost,by:user.name,note:"แก้ไขข้อมูลโดย Admin",patch:rest});
        } else { throw e1; }
      }
      const updated = {...r,...patch,timeline:[...r.timeline,{status:patch.status||r.status,when:new Date(),by:user.name,note:"แก้ไขข้อมูลโดย Admin"}]};
      const newRows = rows.map(x=>x.id===r.id?updated:x);
      setRows(newRows); window.__DATA.repairs = window.__DATA.repairs.map(x=>x.id===r.id?updated:x);
      setEditFor(null); setLoading(false);
      Swal.fire({icon:"success",title:"บันทึกการแก้ไขแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});

        <div className="table-wrap">

            <tbody>
              {filtered.map(r=>(
                <tr key={r.id}>
                  <td><span className="ticket-id" style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>setDetail(r)}>{r.running}</span></td>
                  <td className="hide-on-mobile"><span className="site-id">{r.siteId||"—"}</span></td>
                  <td className="hide-on-mobile" style={{color:"var(--muted)",whiteSpace:"nowrap"}}>{window.__DATA.fmtDate(r.createdAt)}</td>
                  <td><div className="cell-title">{r.title}<div className="desc">{r.machineCode&&<span className="mono" style={{marginRight:6}}>{r.machineCode}</span>}{r.desc.slice(0,60)}{r.desc.length>60?"…":""}</div></div></td>
                  <td className="hide-on-mobile" style={{fontSize:13}}>{r.project}</td>
                  <td className="hide-on-mobile"><CategoryChip categoryId={r.categoryId}/></td>

                    <div className="row-actions">

                      {["Admin","Officer","Engineer"].includes(user.role) && <button className="ia" title="เปลี่ยนสถานะ" onClick={()=>setStatusFor(r)}><i className="fa-solid fa-pen-to-square"></i></button>}
                      {["Admin","Officer","Engineer"].includes(user.role) && <button className="ia" title="แก้ไขข้อมูล" onClick={()=>setEditFor(r)} style={{color:"#1E40AF"}}><i className="fa-solid fa-user-pen"></i></button>}
                    </div>
                  </td>
                </tr>
              ))}
              {filtered.length===0 && (<tr><td colSpan="9"><div className="empty"><i className="fa-solid fa-folder-open"></i><div className="t">ไม่พบข้อมูล</div><div>ลองเปลี่ยนเงื่อนไขการค้นหา</div></div></td></tr>)}
            </tbody>
          </table>
        </div>
      </div>
      {detail && <RepairDetail r={detail} onClose={()=>setDetail(null)} user={user} onQuick={quickAction} onEdit={["Admin","Officer","Engineer"].includes(user.role)?(r)=>{setDetail(null);setEditFor(r);}:null} onEditParts={["Admin","Officer","Engineer"].includes(user.role)?(r)=>{setDetail(null);setEditPartsFor(r);}:null}/>}

}

    </Modal>
  );
}
function AssessModal({r, onClose, onSave, mode="assess"}){
  const initParts = (r.parts && r.parts.length>0)
    ? r.parts.map(p=>({name:p.name||"",qty:p.qty||1,unitPrice:p.unitPrice||0,supplier:p.supplier||""}))
    : [{name:"",qty:1,unitPrice:0,supplier:""}];
  const [parts,setParts] = React.useState(initParts);
  const [laborCost,setLaborCost] = React.useState(r.laborCost||"");

  const addPart = () => setParts(p=>[...p,{name:"",qty:1,unitPrice:0,supplier:""}]);
  const removePart = (i) => setParts(p=>p.filter((_,idx)=>idx!==i));
  const upPart = (i,k,v) => setParts(p=>{ const a=[...p]; a[i]={...a[i],[k]:v}; return a; });

  const partsTotal = parts.reduce((s,p)=>s+(Number(p.qty)||0)*(Number(p.unitPrice)||0),0);
  const total = partsTotal + (Number(laborCost)||0);
  const fmt = (n) => Math.round(Number(n)||0).toLocaleString();

        : <><i className="fa-solid fa-magnifying-glass-dollar" style={{color:"#8B5CF6",marginRight:8}}></i>ประเมินราคา · <span className="ticket-id" style={{marginLeft:4}}>{r.running}</span></>}
      footer={<>
        <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-floppy-disk"></i> {mode==="edit"?"บันทึกการแก้ไข":"บันทึกการประเมิน"}</button>
