<script>
// ── ตัวช่วยติดตั้งแอป ────────────────────────────────────────────────────
// ต้องดักไว้ตั้งแต่ต้น เพราะ beforeinstallprompt ยิงครั้งเดียวและมักมาก่อน React พร้อม
window.__pwa = {
  prompt: null,          // event ที่เบราว์เซอร์ให้มา ใช้เรียกกล่องติดตั้งของระบบ
  installed: false,
  _subs: new Set(),
  on: function(fn){ this._subs.add(fn); return function(){ window.__pwa._subs.delete(fn); }; },
  _emit: function(){ this._subs.forEach(function(f){ try{ f(); }catch(e){} }); },
  isStandalone: function(){
    try{
      return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    }catch(e){ return false; }
  },
  isIOS: function(){ return /iPad|iPhone|iPod/.test(navigator.userAgent||"") && !window.MSStream; },
  isMobile: function(){ return /Android|iPad|iPhone|iPod|Mobile/i.test(navigator.userAgent||""); },
  // เรียกกล่องติดตั้งของเบราว์เซอร์ → คืน "accepted" | "dismissed" | "unavailable"
  install: function(){
    var p = this.prompt;
    if(!p) return Promise.resolve("unavailable");
    this.prompt = null;                     // ใช้ได้ครั้งเดียวตามสเปก
    try{ p.prompt(); }catch(e){ return Promise.resolve("unavailable"); }
    var self = this;
    return p.userChoice.then(function(r){ self._emit(); return (r && r.outcome) || "dismissed"; });
  }
};
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();                        // กันแถบติดตั้งอัตโนมัติ เพื่อให้กดจากปุ่มในหน้า login แทน
  window.__pwa.prompt = e;
  window.__pwa._emit();
});
window.addEventListener("appinstalled", function(){
  window.__pwa.prompt = null;
  window.__pwa.installed = true;
  window.__pwa._emit();
});
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(err){
      console.warn("[pwa] ลงทะเบียน service worker ไม่สำเร็จ:", err && err.message);
    });
  });
}
</script>

<!-- chart.js กับ html2pdf หนักมากและใช้เฉพาะบางหน้า — โหลดตอนเรียกใช้จริงเท่านั้น -->
<script>
window.__lazyScript = (function(){
  var cache = {};
  return function(src){
    if(cache[src]) return cache[src];
    cache[src] = new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.onload = function(){ resolve(); };
      s.onerror = function(){ delete cache[src]; reject(new Error("โหลดไม่สำเร็จ: " + src)); };
      document.head.appendChild(s);
    });
    return cache[src];
  };
})();
window.__loadChart = function(){
  return window.Chart ? Promise.resolve()
    : window.__lazyScript("https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js");
};
window.__loadPdf = function(){
  return window.html2pdf ? Promise.resolve()
    : window.__lazyScript("https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js");
};
// รอรูปในเอกสาร (โลโก้บริษัท) โหลดเสร็จก่อนสั่งแปลงเป็น PDF — กันหัวกระดาษออกมาว่าง
window.__waitImages = function(el){
  var imgs = Array.prototype.slice.call((el || document).querySelectorAll("img"));
  return Promise.all(imgs.map(function(im){
    if(im.complete) return null;
    return new Promise(function(res){
      im.addEventListener("load", res, {once:true});
      im.addEventListener("error", res, {once:true});
      setTimeout(res, 3000);                 // รูปเสียหรือค้าง ก็ไม่ปล่อยให้ค้างทั้งหน้า
    });
  }));
};
// แผนที่ (Leaflet + แผนที่ฐานจาก OpenStreetMap — ไม่ต้องใช้ API key)
window.__loadMap = function(){
  if(window.L) return Promise.resolve();
  if(!document.getElementById("leaflet-css")){
    var l = document.createElement("link");
    l.id = "leaflet-css";
    l.rel = "stylesheet";
    l.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(l);
  }
  return window.__lazyScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js");
};
</script>

/* ── ตารางบนมือถือ: เลื่อนแนวนอนได้จริง + ตรึงคอลัมน์แรก + แสดงครบทุกคอลัมน์ ── */
@media (max-width:1024px){
  .table-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin;
    background:
      linear-gradient(90deg,#fff 30%,rgba(255,255,255,0)) 0 0/28px 100% no-repeat local,
      linear-gradient(90deg,rgba(255,255,255,0),#fff 70%) 100% 0/28px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%,rgba(15,23,42,.13),rgba(15,23,42,0)) 0 0/12px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%,rgba(15,23,42,.13),rgba(15,23,42,0)) 100% 0/12px 100% no-repeat scroll;}
  .table-wrap::-webkit-scrollbar{height:6px}
  .table-wrap::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:99px}
  table.data{min-width:max-content}
  table.data td{max-width:210px;overflow-wrap:anywhere}
  table.data th:first-child,table.data td:first-child{position:sticky;left:0;z-index:2;
    background:#fff;box-shadow:1px 0 0 var(--line);max-width:150px}
  table.data th:first-child{background:#FAFBFC;z-index:3}
  table.data tr:hover td:first-child{background:#FAFBFC}
  /* แถวหัวกลุ่ม / แถวว่าง ที่ใช้ colspan ไม่ต้องตรึงทั้งช่อง — ตรึงเฉพาะข้อความข้างใน */
  table.data td[colspan],table.data th[colspan]{position:static;max-width:none;box-shadow:none}
  table.data td[colspan] .group-label{position:sticky;left:0;display:inline-flex;align-items:center;
    max-width:calc(100vw - 60px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.data td[colspan] .empty{position:sticky;left:0;max-width:calc(100vw - 60px)}
  .hide-on-mobile{display:table-cell !important}
  .cell-title{max-width:210px}
}

async function getAppsScriptUrl() {
  const current = window.APPS_SCRIPT_URL || localStorage.getItem('APPS_SCRIPT_URL') || CONFIG_APPS_SCRIPT_URL;
  if (current) return current;
  if (!window.Swal) return '';
  const r = await Swal.fire({
    icon: 'info',
    title: 'ตั้งค่า Google Apps Script URL',
    input: 'url',
    inputPlaceholder: 'https://script.google.com/macros/s/XXXXXXXXXXXX/exec',
    text: 'วาง Web app URL ที่ Deploy จาก backend/Code.gs เพื่อให้อัปโหลดไฟล์ไป Google Drive ได้',
    showCancelButton: true,
    confirmButtonText: 'บันทึก',
    cancelButtonText: 'ยกเลิก',
    inputValidator: (v) => {
      if (!v) return 'กรุณาวาง Web app URL';
      if (!String(v).includes('script.google.com') || !String(v).includes('/exec')) return 'URL ต้องเป็น Google Apps Script Web app ที่ลงท้าย /exec';
      return null;
    }
  });
  if (!r.isConfirmed) return '';
  localStorage.setItem('APPS_SCRIPT_URL', r.value);
  window.APPS_SCRIPT_URL = r.value;
  return r.value;
}

async function callAppsScript(action, payload = {}) {
  const APPS_SCRIPT_URL = await getAppsScriptUrl();
  if (!APPS_SCRIPT_URL) {
    throw new Error('ยังไม่ได้ตั้งค่า APPS_SCRIPT_URL สำหรับอัปโหลดไฟล์ไป Google Drive');
  }
  const body = JSON.stringify({ action, ...payload });
  let res;
  try {
    res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body,
    });
  } catch (firstErr) {
    try {
      const form = new FormData();
      form.append('payload', body);
      res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: form });
    } catch (secondErr) {
      throw new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ: ตรวจสอบว่า Web app URL ลงท้าย /exec, Deploy เป็น New version แล้ว, Execute as: Me และ Who has access: Anyone');
    }
  }
  if (!res.ok) {
    if (res.status === 401) {
      throw new Error('Apps Script ตอบ 401 Unauthorized: Deployment ยังบังคับให้ login อยู่ กรุณาตั้ง Who has access: Anyone');
    }
    if (res.status === 403) {
      throw new Error('Apps Script ตอบ 403 Forbidden: กรุณา Deploy เป็น Web app โดยตั้ง Execute as: Me และ Who has access: Anyone');
    }
    throw new Error(`Apps Script HTTP ${res.status}`);
  }
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Apps Script error');
  return json.data;
}

async function _nextId(collection, prefix, pad) {
  const snap = await _db.ref('/' + collection).get();
  const items = Object.values(snap.val() || {});
  let max = 0;
  items.forEach(item => {
    const m = String(item.id || '').match(/\d+/);
    if (m) max = Math.max(max, parseInt(m[0], 10));
  });
  return prefix + String(max + 1).padStart(pad, '0');
}

// เลขที่ใบแจ้งซ่อม: RE-<รหัสโครงการ>-<ปีพ.ศ.><เดือน>/<ลำดับ>  เช่น RE-PRJ-A1-256807/001
// ลำดับเริ่มนับใหม่ทุกเดือน แยกตามโครงการ
function _buildRunning(projectName, repairs, projects) {
  const proj = (projects || []).find(p => p && p.name === projectName);
  const code = String((proj && proj.code) || projectName || 'GEN').trim().replace(/\s+/g, '-').toUpperCase();
  const d = new Date();
  const ym = String(d.getFullYear() + 543) + String(d.getMonth() + 1).padStart(2, '0');
  const prefix = 'RE-' + code + '-' + ym + '/';
  let max = 0;
  (repairs || []).forEach(r => {
    const s = String((r && r.running) || '');
    if (s.slice(0, prefix.length) === prefix) {
      const n = parseInt(s.slice(prefix.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return prefix + String(max + 1).padStart(3, '0');
}

  deleteAssetRegistry: { label:'ทะเบียนทรัพย์สิน',    key:'key', exec: async (p) => { await _assetDb.ref('/assets/' + p.key).remove(); } },
  deleteDeliveryOrder: { label:'ใบส่งของ (DO)',      key:'key', exec: async (p) => {
    // ใบที่ยังไม่ยกเลิก = ทรัพย์สินยังถูกย้ายตามใบนี้อยู่ ลบเอกสารทิ้งแล้วทะเบียนจะไม่มีที่มา → ต้องยกเลิก (คืนของ) ก่อน
    const d = (await _assetDb.ref('/deliveryOrders/' + p.key).get()).val();
    if (d && !d.cancelled) throw new Error('ใบส่งของนี้ยังมีผลกับทะเบียนทรัพย์สินอยู่ — กรุณา "ยกเลิก" (เลือกคืนของกลับต้นทาง) ก่อน แล้วจึงลบ');
    await _assetDb.ref('/deliveryOrders/' + p.key).remove();
  } },
  // ลบรายการในคลัง — ประวัติรับ/เบิกเก็บไว้ตามเดิมเพื่อตรวจย้อนหลัง
  deleteStockItem:     { label:'รายการสต๊อกหน้างาน',  key:'key', exec: async (p) => { await _db.ref('/stockItems/' + p.key).remove(); } },
  // ประวัติการย้ายเก็บเป็น array ในตัวเครื่องจักร — อ่านของจริงตอนลบเสมอ เผื่อมีการย้ายเพิ่มระหว่างรออนุมัติ
  deleteTransferEntry: {
    label:'ประวัติการย้ายเครื่องจักร', key:'machineId',
    exec: async (p) => {
      const ref = _db.ref('/machines/' + p.machineId + '/transferHistory');
      const raw = (await ref.get()).val();
      const arr = Array.isArray(raw) ? raw.slice() : Object.values(raw || {});
      let idx = -1;
      if (typeof p.index === 'number' && arr[p.index] && String(arr[p.index].when || '') === String(p.when || '')) idx = p.index;
      if (idx < 0) idx = arr.findIndex(t => t && String(t.when || '') === String(p.when || '') && String(t.to || '') === String(p.to || ''));
      if (idx < 0) throw new Error('ไม่พบรายการประวัติการย้ายนี้ (อาจถูกลบไปแล้ว)');
      arr.splice(idx, 1);
      await ref.set(arr);
      return { transferHistory: arr };
    }
  },
};

// การ "แก้ไข" ที่ส่งขออนุมัติได้ — จำกัดรายการไว้ กัน action อื่นหลุดเข้ามาทำงานผ่านคำขอ
// ใช้กล่องเดียวกับคำขอลบ (/deleteRequests) แยกกันด้วยฟิลด์ kind: 'delete' | 'edit'
const _CHANGE_OPS = {
  updateRepair:      { label: 'ใบแจ้งซ่อม',       key: 'id'  },
  updateMachine:     { label: 'เครื่องจักร',       key: 'id'  },
  saveAssetRegistry: { label: 'ทะเบียนทรัพย์สิน', key: 'key' },
};

function _delTargetKey(action, payload = {}) {
  const op = _DELETE_OPS[action];
  const base = String((op && payload[op.key]) || payload.id || payload.key || '');
  return action === 'deleteTransferEntry' ? base + '|' + String(payload.when || '') : base;
}

// ประวัติการล็อกอิน: เก็บแค่ 100 รายการล่าสุด ที่เกินมาลบทิ้งอัตโนมัติ
// (เป็นการหมุนเวียน log ตามนโยบายระบบ ไม่ผ่านขั้นตอนขออนุมัติลบเหมือนข้อมูลงาน)
const LOGIN_LOG_KEEP = 100;

async function _pruneLoginLogs() {
  try {
    const snap = await _db.ref('/loginLogs').get();
    const all = Object.entries(snap.val() || {});
    if (all.length <= LOGIN_LOG_KEEP) return 0;
    // เรียงใหม่→เก่า · รายการที่ไม่มีเวลาถือว่าเก่าสุด จะถูกลบก่อน
    const ts = (e) => { const t = Date.parse((e[1] && e[1].when) || ''); return isNaN(t) ? 0 : t; };
    all.sort((a, b) => ts(b) - ts(a));
    const updates = {};
    all.slice(LOGIN_LOG_KEEP).forEach(([key]) => { updates[key] = null; });
    await _db.ref('/loginLogs').update(updates);
    return Object.keys(updates).length;
  } catch (e) {
    console.warn('[loginLogs] ลบประวัติเก่าไม่สำเร็จ:', e && e.message);
    return 0;
  }
}

// บันทึกหลักฐานการลบทุกครั้ง (ลบเองโดย Admin หรือลบผ่านการอนุมัติ) — ใช้ตรวจย้อนหลังได้
async function _logDelete(entry) {
  try {
    const ref = _db.ref('/deleteLogs').push();
    await ref.set({ id: ref.key, when: new Date().toISOString(), ...entry });
  } catch (e) { /* บันทึก log ไม่สำเร็จ ไม่ควรทำให้การลบล้มเหลว */ }
}

async function api(action, payload = {}) {
  switch (action) {

    // ── การลบข้อมูลทุกชนิด: Admin เท่านั้น ────────────────────────────────
    case 'deleteProject':
    case 'deleteUser':
    case 'deleteCategory':
    case 'deleteMachine':
    case 'deleteRepair':
    case 'deleteWithdrawal':
    case 'deleteAssetRegistry':
    case 'deleteDeliveryOrder':
    case 'deleteStockItem':
    case 'deleteTransferEntry': {
      const by = payload.by || {};
      const role = String(payload.role || by.role || '');
      if (role !== 'Admin') {
        throw new Error('เฉพาะผู้ดูแลระบบ (Admin) เท่านั้นที่ลบข้อมูลได้ · กรุณาส่งคำขออนุมัติลบ');
      }
      const result = await _DELETE_OPS[action].exec(payload);
      const targetKey = _delTargetKey(action, payload);
      await _logDelete({
        action, via: 'admin',
        entityLabel: _DELETE_OPS[action].label,
        targetKey,
        targetName: payload.targetName || '',
        byId: by.id || '', byName: by.name || '', byRole: role,
      });
      // ถ้ามีคำขอลบรายการเดียวกันค้างอยู่ ให้ปิดคำขอนั้นด้วย จะได้ไม่ค้างเป็นตัวเลขบนกระดิ่ง
      try {
        const all = ((await _db.ref('/deleteRequests').get()).val()) || {};
        const closes = Object.values(all).filter(x => x && x.status === 'pending' && x.action === action && String(x.targetKey) === targetKey);
        for (const c of closes) {
          await _db.ref('/deleteRequests/' + c.id).update({
            status: 'approved', decidedAt: new Date().toISOString(),
            decidedById: by.id || '', decidedByName: by.name || '',
            decideNote: 'ผู้ดูแลระบบลบข้อมูลนี้เองแล้ว', lastError: null,
          });
        }
      } catch (e) { /* ปิดคำขอไม่สำเร็จ ไม่กระทบการลบที่ทำไปแล้ว */ }
      return { deleted: true, ...(result || {}) };
    }

    // ── Role อื่นขออนุมัติลบ ──────────────────────────────────────────────
    case 'requestDelete': {
      const req = payload.req || {};
      const op = _DELETE_OPS[req.action];
      if (!op) throw new Error('ไม่รองรับการขอลบข้อมูลประเภทนี้');
      if (!String(req.reason || '').trim()) throw new Error('กรุณาระบุเหตุผลที่ต้องการลบ');
      const targetKey = _delTargetKey(req.action, req.payload || {});
      const all = Object.values(((await _db.ref('/deleteRequests').get()).val()) || {});
      if (all.some(x => x && x.status === 'pending' && x.action === req.action && String(x.targetKey) === targetKey)) {
        throw new Error('รายการนี้มีคำขอลบรออนุมัติอยู่แล้ว');
      }
      const ref = _db.ref('/deleteRequests').push();
      const rec = {
        id: ref.key,
        kind: 'delete',
        action: req.action,
        entityLabel: req.entityLabel || op.label,
        targetKey,
        targetName: String(req.targetName || ''),
        targetInfo: String(req.targetInfo || ''),
        project: String(req.project || ''),
        // ล้าง undefined / Date ออกก่อนเขียนลง Firebase (Firebase ไม่รับค่า undefined)
        payload: JSON.parse(JSON.stringify(req.payload || {})),
        reason: String(req.reason).trim(),
        requesterId: String(req.requesterId || ''),
        requesterName: String(req.requesterName || ''),
        requesterRole: String(req.requesterRole || ''),
        requestedAt: new Date().toISOString(),
        status: 'pending',
      };
      await ref.set(rec);
      return rec;
    }

    // ── ขออนุมัติ "แก้ไข" ข้อมูล (เช่น Reporter แก้ใบแจ้งซ่อมของตัวเอง) ────────
    case 'requestChange': {
      const req = payload.req || {};
      if (!_CHANGE_OPS[req.action]) throw new Error('ไม่รองรับการขอแก้ไขข้อมูลประเภทนี้');
      if (!String(req.reason || '').trim()) throw new Error('กรุณาระบุเหตุผลที่ต้องการแก้ไข');
      const idKey = _CHANGE_OPS[req.action].key || 'id';
      const targetKey = String((req.payload && req.payload[idKey]) || '');
      if (!targetKey) throw new Error('ไม่พบรายการที่ต้องการแก้ไข');
      const all = Object.values(((await _db.ref('/deleteRequests').get()).val()) || {});
      if (all.some(x => x && x.status === 'pending' && x.kind === 'edit' && x.action === req.action && String(x.targetKey) === targetKey)) {
        throw new Error('รายการนี้มีคำขอแก้ไขรออนุมัติอยู่แล้ว กรุณารอผลอนุมัติก่อน');
      }
      const ref = _db.ref('/deleteRequests').push();
      const rec = {
        id: ref.key,
        kind: 'edit',
        action: req.action,
        entityLabel: req.entityLabel || _CHANGE_OPS[req.action].label,
        targetKey,
        targetName: String(req.targetName || ''),
        targetInfo: String(req.targetInfo || ''),
        project: String(req.project || ''),
        payload: JSON.parse(JSON.stringify(req.payload || {})),
        changes: JSON.parse(JSON.stringify(req.changes || [])),   // สรุปว่าแก้อะไรบ้าง ให้ Admin ตัดสินใจได้โดยไม่ต้องเปิดเทียบเอง
        reason: String(req.reason).trim(),
        requesterId: String(req.requesterId || ''),
        requesterName: String(req.requesterName || ''),
        requesterRole: String(req.requesterRole || ''),
        requestedAt: new Date().toISOString(),
        status: 'pending',
      };
      await ref.set(rec);
      return rec;
    }

    case 'listDeleteRequests': {
      const all = Object.values(((await _db.ref('/deleteRequests').get()).val()) || {});
      return all.sort((a, b) => String(b.requestedAt || '').localeCompare(String(a.requestedAt || '')));
    }

    case 'approveDelete': {
      const { id, note } = payload;
      const by = payload.by || {};
      if (String(by.role || '') !== 'Admin') throw new Error('เฉพาะผู้ดูแลระบบ (Admin) เท่านั้นที่อนุมัติได้');
      const ref = _db.ref('/deleteRequests/' + id);
      const rec = (await ref.get()).val();
      if (!rec) throw new Error('ไม่พบคำขอนี้');
      if (rec.status !== 'pending') throw new Error('คำขอนี้ถูกดำเนินการไปแล้ว');
      const isEdit = rec.kind === 'edit';
      const op = isEdit ? _CHANGE_OPS[rec.action] : _DELETE_OPS[rec.action];
      if (!op) throw new Error(isEdit ? 'ไม่รองรับการแก้ไขข้อมูลประเภทนี้' : 'ไม่รองรับการลบข้อมูลประเภทนี้');
      let result = null;
      try {
        // อนุมัติแก้ไข = สั่งงานตัวเดียวกับที่ Admin กดแก้เอง (เช่น updateRepair) จึงผ่าน ALLOW list เดิมทุกอย่าง
        result = isEdit
          ? await api(rec.action, {
              ...(rec.payload || {}),
              by: by.name || 'ผู้ดูแลระบบ',
              note: 'อนุมัติคำขอแก้ไขของ ' + (rec.requesterName || 'ผู้แจ้ง'),
            })
          : await op.exec(rec.payload || {});
      } catch (e) {
        // ทำไม่สำเร็จ = คำขอต้องยังค้างอยู่ ไม่ตีตราว่าอนุมัติแล้ว
        await ref.update({ lastError: String((e && e.message) || e) });
        throw e;
      }
      const patch = {
        status: 'approved',
        decidedAt: new Date().toISOString(),
        decidedById: by.id || '', decidedByName: by.name || '',
        decideNote: String(note || ''), lastError: null,
      };
      await ref.update(patch);
      // /deleteLogs เก็บเฉพาะหลักฐานการลบ — คำขอแก้ไขไม่ต้องลง ไม่งั้นรายงานการลบจะเพี้ยน
      if (!isEdit) await _logDelete({
        action: rec.action, via: 'approved', requestId: rec.id,
        entityLabel: rec.entityLabel, targetKey: rec.targetKey, targetName: rec.targetName,
        byId: by.id || '', byName: by.name || '', byRole: 'Admin',
        requesterId: rec.requesterId, requesterName: rec.requesterName, reason: rec.reason,
      });
      return { ...rec, ...patch, result };
    }

    case 'rejectDelete': {
      const { id, note } = payload;
      const by = payload.by || {};
      if (String(by.role || '') !== 'Admin') throw new Error('เฉพาะผู้ดูแลระบบ (Admin) เท่านั้นที่ปฏิเสธคำขอได้');
      const ref = _db.ref('/deleteRequests/' + id);
      const rec = (await ref.get()).val();
      if (!rec) throw new Error('ไม่พบคำขอนี้');
      if (rec.status !== 'pending') throw new Error('คำขอนี้ถูกดำเนินการไปแล้ว');
      const patch = {
        status: 'rejected',
        decidedAt: new Date().toISOString(),
        decidedById: by.id || '', decidedByName: by.name || '',
        decideNote: String(note || ''), lastError: null,
      };
      await ref.update(patch);
      return { ...rec, ...patch };
    }

    case 'login': {
      const { username, password } = payload;
      const snap = await _db.ref('/users').get();
      const user = Object.values(snap.val() || {}).find(
        u => String(u.username) === String(username) && String(u.password) === String(password)
      );
      if (!user) throw new Error('Username หรือ Password ไม่ถูกต้อง');
      const logRef = _db.ref('/loginLogs').push();
      await logRef.set({
        id: logRef.key,
        userId: user.id || "",
        username: user.username || "",
        name: user.name || "",
        role: user.role || "",
        dept: user.dept || "",
        via: 'password',
        when: new Date().toISOString()
      });
      // ตัดประวัติที่เกิน 100 รายการทิ้ง — ไม่ await เพราะไม่ควรทำให้การล็อกอินช้าหรือล้มเหลว
      _pruneLoginLogs();
      const safe = { ...user };
      delete safe.password;
      return safe;
    }

    // ปลดล็อกหน้าจอด้วย PIN บนเครื่องที่ค้างล็อกอินไว้ — นับเป็นการเข้าใช้งานครั้งใหม่ ต้องขึ้นประวัติเหมือนล็อกอินปกติ
    case 'logUnlock': {
      const u = payload.user || {};
      if (!u.id) throw new Error('ไม่พบบัญชีผู้ใช้');
      const logRef = _db.ref('/loginLogs').push();
      await logRef.set({
        id: logRef.key,
        userId: u.id,
        username: u.username || '',
        name: u.name || '',
        role: u.role || '',
        dept: u.dept || '',
        via: payload.via === 'pin' ? 'pin' : 'password',
        when: new Date().toISOString(),
      });
      _pruneLoginLogs();
      return { logged: true };
    }

    // ยืนยันตัวตนซ้ำก่อนทำงานสำคัญ (เช่น Admin ลบข้อมูล) — ไม่บันทึกลงประวัติล็อกอิน เพราะไม่ใช่การเข้าใช้งานใหม่
    case 'verifyPassword': {
      const { userId, password } = payload;
      const snap = await _db.ref('/users/' + userId).get();
      const user = snap.val();
      if (!user) throw new Error('ไม่พบบัญชีผู้ใช้นี้');
      if (String(user.password) !== String(password)) throw new Error('รหัสผ่านไม่ถูกต้อง');
      return { ok: true };
    }

    case 'bootstrap': {
      // ดึงทุกอย่างพร้อมกันรอบเดียว — ไม่เช็ค seed ก่อน เพราะทำให้เสีย round-trip ฟรีทุกครั้งที่เปิดเว็บ
      let [usersSnap, catSnap, machSnap, repSnap, projSnap, wdSnap, permSnap] = await Promise.all([
        _db.ref('/users').get(),
        _db.ref('/categories').get(),
        _db.ref('/machines').get(),
        _db.ref('/repairs').get(),
        _db.ref('/projects').get(),
        _db.ref('/withdrawals').get(),
        _db.ref('/permissions').get(),
      ]);
      // ฐานข้อมูลว่างจริง (ติดตั้งใหม่) ค่อยสร้างข้อมูลตั้งต้นแล้วดึงเฉพาะส่วนที่ seed ซ้ำ
      if (!usersSnap.val()) {
        await _seedIfEmpty();
        [usersSnap, catSnap, projSnap] = await Promise.all([
          _db.ref('/users').get(),
          _db.ref('/categories').get(),
          _db.ref('/projects').get(),
        ]);
      }
      const users = Object.values(usersSnap.val() || {}).map(u => {
        const x = { ...u }; delete x.password; return x;
      });
      const categories = Object.values(catSnap.val() || {});
      const machines = Object.values(machSnap.val() || {});
      const repairs = Object.values(repSnap.val() || {}).map(r => ({
        ...r,
        timeline: r.timeline ? Object.values(r.timeline) : [],
      }));
      const projects = Object.values(projSnap.val() || {});
      const withdrawals = Object.entries(wdSnap.val() || {}).map(([key, value]) => ({ ...value, key }));
      const permissions = permSnap.val() || {};
      return { users, categories, machines, repairs, projects, withdrawals, permissions };
    }

    case 'savePermissions': {
      const { cfg, by } = payload;
      if (String((by || {}).role || '') !== 'Admin') {
        throw new Error('เฉพาะผู้ดูแลระบบ (Admin) เท่านั้นที่ตั้งสิทธิ์การใช้งานได้');
      }
      await _db.ref('/permissions').set({
        roles: (cfg && cfg.roles) || {},
        users: (cfg && cfg.users) || {},
        updatedAt: new Date().toISOString(),
        updatedBy: (by || {}).name || '',
      });
      return { saved: true };
    }

    case 'upsertWithdrawal': {
      const { key, doc } = payload;
      const cleanKey = String(key || doc.docNo || doc.id || Date.now()).replace(/[.#$/\[\]]/g, '-').replace(/\s+/g, '-');
      await _db.ref('/withdrawals/' + cleanKey).update({ ...doc, updatedAt: new Date().toISOString() });
      return { ...doc, key: cleanKey };
    }

    // ── สต๊อกหน้างาน (Consume) ──────────────────────────────────────────
    // /stockItems/{key}  รายการของในคลังแต่ละโครงการ (qty = ยอดคงเหลือ)
    // /stockMoves/{key}  ประวัติรับเข้า (in) / เบิกจ่าย (out) / ปรับยอด (adjust)
    case 'loadStock': {
      const [iSnap, mSnap] = await Promise.all([
        _db.ref('/stockItems').get(),
        // push key เรียงตามเวลาอยู่แล้ว — ใช้ลำดับ key ไม่ต้องตั้ง .indexOn ใน Firebase rules
        _db.ref('/stockMoves').limitToLast(2000).get(),
      ]);
      const items = Object.entries(iSnap.val() || {}).map(([key, v]) => ({ ...v, key }));
      const moves = Object.entries(mSnap.val() || {}).map(([key, v]) => ({ ...v, key }));
      return { items, moves };
    }

    case 'saveStockItem': {
      const { item, by, byId } = payload;
      const now = new Date().toISOString();
      if (item.key) {
        const { key, qty, ...rest } = item;           // แก้ไขรายละเอียดเท่านั้น — ยอดคงเหลือเปลี่ยนผ่านการรับ/เบิกเท่านั้น
        await _db.ref('/stockItems/' + key).update({ ...rest, updatedAt: now });
        const snap = await _db.ref('/stockItems/' + key).get();
        return { item: { ...snap.val(), key }, move: null };
      }
      const ref = _db.ref('/stockItems').push();
      const qty0 = Math.max(0, Number(item.qty) || 0);
      const rec = { ...item, qty: qty0, createdAt: now, updatedAt: now };
      delete rec.key;
      await ref.set(rec);
      let move = null;
      if (qty0 > 0) {

            if (!dk) { warnings.push(`${label}: ไม่พบทรัพย์สินที่ ${destSite || '-'} จึงคืนของกลับต้นทางไม่ได้`); return; }
            const have = getQty(dk);
            if (have < need) throw new Error(`จำนวนที่ ${destSite} ไม่พอคืนสำหรับ ${code || label} (มี ${have}, ต้องคืน ${need}) — ตรวจสอบสต๊อกก่อนยกเลิก`);
            curQty[dk] = have - need;
            if (curQty[dk] === 0 && (assets[dk] || {}).splitFrom) dropKeys[dk] = true;   // แถวที่แตกออกมาโดยเฉพาะ คืนหมดแล้วลบทิ้ง
            else pushHist(dk, { ...hist, splitOut: need });

            const sk = (srcKey && assets[srcKey] && String(assets[srcKey].site || '') === String(srcSite))
              ? srcKey : (code ? findAsset(code, srcSite) : null);
            if (sk) {
              curQty[sk] = getQty(sk) + need;
              pushHist(sk, { ...hist, note: 'รับคืนจากการยกเลิกใบส่งของ' });
              restored.push({ key: sk, code, name: label, qty: need, to: srcSite, mode: 'qty' });
            } else {
              const base = assets[dk] || { assetCode: code, name: it.name || '', unit: it.unit || '', brand: it.brand || '', model: it.model || '', serial: it.serial || '' };
              const nk = _assetDb.ref('/assets').push().key;
              const { splitFrom, ...cleanBase } = base;
              newAssets[nk] = { ...cleanBase, quantity: need, site: srcSite, subSite: it.fromSubSite || '', updatedAt: when, transferHistory: [{ ...hist, note: 'สร้างคืนจากการยกเลิกใบส่งของ' }] };
              restored.push({ key: nk, code, name: label, qty: need, to: srcSite, mode: 'new' });
            }
          }
        });

        Object.keys(curQty).forEach((k) => {
          if (dropKeys[k]) return;
          updates['/assets/' + k + '/quantity'] = curQty[k];
          updates['/assets/' + k + '/updatedAt'] = when;
        });
        Object.keys(siteBack).forEach((k) => {
          updates['/assets/' + k + '/site'] = siteBack[k];
          updates['/assets/' + k + '/subSite'] = subSiteBack[k] || '';
          updates['/assets/' + k + '/updatedAt'] = when;
        });
        Object.keys(histAdd).forEach((k) => {
          if (dropKeys[k]) return;
          const cur = Array.isArray(assets[k] && assets[k].transferHistory) ? assets[k].transferHistory.slice() : [];
          updates['/assets/' + k + '/transferHistory'] = cur.concat(histAdd[k]);
        });
        Object.keys(newAssets).forEach((k) => { updates['/assets/' + k] = newAssets[k]; });
        Object.keys(dropKeys).forEach((k) => { updates['/assets/' + k] = null; });   // ลบแถวที่แตกออกมาแล้วคืนหมด

        restoredSummary = restored;
      }

      const mark = {
        cancelled: true,
        cancelledAt: when,
        cancelledBy: by || '',
        cancelReason: reason || '',
        stockRestored: !!restoreStock,
      };
      Object.keys(mark).forEach((kk) => { updates['/deliveryOrders/' + key + '/' + kk] = mark[kk]; });

      await _assetDb.ref().update(updates);
      return { ok: true, warnings, restored: restoredSummary, ...mark };
    }

    // แก้ไขข้อมูลใบส่งของ (DO)
    // adjustStock=false : แก้เฉพาะข้อมูลบนเอกสาร ไม่กระทบสต๊อก
    // adjustStock=true  : แก้จำนวนแล้วปรับสต๊อกทรัพย์สินตามส่วนต่าง (ต้นทาง<->ปลายทาง) ในทรานแซกชันเดียว
    //   - อ้างอิงตำแหน่งจริงจากใบส่งของเดิม (ปลายทาง=doc.toProject, ต้นทาง=item.from) การแก้ชื่อโครงการบนเอกสารไม่ย้ายสต๊อก
    //   - จับคู่ทรัพย์สินด้วยรหัส (assetCode) + โครงการ; รายการที่ไม่มีรหัสจะข้ามการปรับสต๊อก
    //   - ตรวจจำนวนให้พอก่อนเสมอ ถ้าไม่พอจะยกเลิกทั้งใบ (ไม่เขียนบางส่วน)
    case 'updateDeliveryOrder': {
      const { key, patch, by, adjustStock } = payload;
      if (!key) throw new Error('ไม่พบรหัสใบส่งของ');
      const when = new Date().toISOString();
      const updates = {};
      const warnings = [];

      if (adjustStock) {
        const [doSnap, aSnap] = await Promise.all([
          _assetDb.ref('/deliveryOrders/' + key).get(),
          _assetDb.ref('/assets').get(),
        ]);
        const old = doSnap.val() || {};
        if (old.cancelled) throw new Error('ใบส่งของนี้ถูกยกเลิกแล้ว จึงแก้ไขจำนวนไม่ได้');
        const assets = aSnap.val() || {};
        const toArr = (v) => Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : []);
        const oldItems = toArr(old.items);
        const newItems = Array.isArray(patch.items) ? patch.items : oldItems;
        const destSite = old.toProject || '';
        const docNo = old.docNo || (patch && patch.docNo) || '';

        const curQty = {};
        const getQty = (k) => (curQty[k] !== undefined ? curQty[k] : (Number(assets[k].quantity) || 0));
        const histAdd = {};
        const pushHist = (k, e) => { (histAdd[k] = histAdd[k] || []).push(e); };
        const newAssets = {};
        const findAsset = (code, site) => Object.keys(assets).find((k) => {
          const a = assets[k] || {};
          return String(a.assetCode || a.id || '') === String(code) && String(a.site || '') === String(site);
        });

        newItems.forEach((ni, i) => {
          const oi = oldItems[i] || {};
          const oldQty = Number(oi.quantity) || 0;
          const newQty = Number(ni.quantity) || 0;
          const delta = newQty - oldQty;
          if (delta === 0) return;
          const code = ni.assetCode || oi.assetCode || '';
          const srcSite = oi.from || ni.from || '';
          const label = ni.name || oi.name || code || ('รายการที่ ' + (i + 1));
          if (!code) { warnings.push(label + ': ไม่มีรหัสทรัพย์สิน จึงไม่ปรับสต๊อกให้'); return; }

          if (delta > 0) {
            // ย้ายเพิ่ม delta หน่วย จากต้นทาง -> ปลายทาง
            const sk = srcSite ? findAsset(code, srcSite) : null;
            if (sk) {
              const have = getQty(sk);
              if (have < delta) throw new Error(`สต๊อกต้นทางไม่พอสำหรับ ${code} ที่ ${srcSite} (มี ${have}, ต้องเพิ่ม ${delta})`);
              curQty[sk] = have - delta;
              pushHist(sk, { from: srcSite, to: destSite, when, by: by || '', note: 'ปรับลดจากการแก้ไขใบส่งของ', docNo, qty: delta, adjust: true, splitOut: delta });
            } else {
              warnings.push(`${code}: ไม่พบทรัพย์สินต้นทางที่ ${srcSite || '-'} จึงเพิ่มจำนวนปลายทางโดยไม่ตัดต้นทาง`);
            }
            const dk = findAsset(code, destSite);
            if (dk) {
              curQty[dk] = getQty(dk) + delta;
              pushHist(dk, { from: srcSite, to: destSite, when, by: by || '', note: 'ปรับเพิ่มจากการแก้ไขใบส่งของ', docNo, qty: delta, adjust: true });
            } else {
              const base = sk ? assets[sk] : { assetCode: code, name: ni.name || '', unit: ni.unit || '', brand: ni.brand || '', model: ni.model || '', serial: ni.serial || '' };
              const nk = _assetDb.ref('/assets').push().key;
              newAssets[nk] = { ...base, quantity: delta, site: destSite, updatedAt: when, transferHistory: [{ from: srcSite, to: destSite, when, by: by || '', note: 'สร้างจากการแก้ไขใบส่งของ', docNo, qty: delta, adjust: true }] };
            }
          } else {
            // ลดจำนวน => คืน need หน่วย จากปลายทาง -> ต้นทาง
            const need = -delta;
            const dk = findAsset(code, destSite);
            if (!dk) throw new Error(`ไม่พบทรัพย์สินปลายทางที่ ${destSite || '-'} สำหรับ ${code} จึงลดจำนวนไม่ได้`);
            const have = getQty(dk);
            if (have < need) throw new Error(`จำนวนปลายทางไม่พอลดสำหรับ ${code} ที่ ${destSite} (มี ${have}, ต้องลด ${need})`);
            curQty[dk] = have - need;
            pushHist(dk, { from: destSite, to: srcSite, when, by: by || '', note: 'ปรับลด/คืนจากการแก้ไขใบส่งของ', docNo, qty: need, adjust: true, splitOut: need });
            const sk = srcSite ? findAsset(code, srcSite) : null;
            if (sk) {
              curQty[sk] = getQty(sk) + need;
              pushHist(sk, { from: destSite, to: srcSite, when, by: by || '', note: 'คืนจำนวนจากการแก้ไขใบส่งของ', docNo, qty: need, adjust: true });
            } else if (srcSite) {
              const base = assets[dk] ? assets[dk] : { assetCode: code, name: ni.name || '', unit: ni.unit || '' };
              const nk = _assetDb.ref('/assets').push().key;
              newAssets[nk] = { ...base, quantity: need, site: srcSite, updatedAt: when, transferHistory: [{ from: destSite, to: srcSite, when, by: by || '', note: 'คืนจากการแก้ไขใบส่งของ', docNo, qty: need, adjust: true }] };
            } else {
              warnings.push(`${code}: ไม่ทราบโครงการต้นทาง จึงลดปลายทางโดยไม่คืนต้นทาง`);
            }
          }
        });

        Object.keys(curQty).forEach((k) => {
          updates['/assets/' + k + '/quantity'] = curQty[k];
          updates['/assets/' + k + '/updatedAt'] = when;
        });
        Object.keys(histAdd).forEach((k) => {
          const cur = Array.isArray(assets[k] && assets[k].transferHistory) ? assets[k].transferHistory.slice() : [];
          updates['/assets/' + k + '/transferHistory'] = cur.concat(histAdd[k]);
        });
        Object.keys(newAssets).forEach((k) => { updates['/assets/' + k] = newAssets[k]; });
      }

      const clean = { ...(patch || {}) };
      delete clean.key; delete clean.when;
      clean.updatedAt = when;
      clean.updatedBy = by || '';
      Object.keys(clean).forEach((kk) => { updates['/deliveryOrders/' + key + '/' + kk] = clean[kk]; });

      await _assetDb.ref().update(updates);
      return { ok: true, warnings };
    }

    case 'updateRepairProblems': {
      const { id, problems, status, by, note } = payload;
      const tlKey = _db.ref('/repairs/' + id + '/timeline').push().key;
      const upd = {
        problems: problems || [],
        updatedAt: new Date().toISOString(),
        ['timeline/' + tlKey]: { id: tlKey, status: status || '', when: new Date().toISOString(), by: by || '', note: note || 'ปรับสถานะรายการอาการ' },
      };
      if (status !== undefined) upd.status = status;
      await _db.ref('/repairs/' + id).update(upd);
      return { ok: true };
    }

    case 'updateRepair': {
      const { id, patch, by, note } = payload;
      const clean = { ...patch };
      clean.updatedAt = new Date().toISOString();
      delete clean.id; delete clean.running; delete clean.timeline;
      const tlKey = _db.ref('/repairs/' + id + '/timeline').push().key;
      clean['timeline/' + tlKey] = {
        id: tlKey, status: clean.status || '', when: new Date().toISOString(), by: by || '', note: note || 'แก้ไขข้อมูลโดย Admin'
      };
      await _db.ref('/repairs/' + id).update(clean);
      return { ok: true };
    }

    case 'updateRepairStatus': {
      const { id, status, by, note, cost, patch: extraPatch } = payload;
      const ALLOW = ['title','desc','repairNote','siteId','subSite','machineCode','project','categoryId','reporterName','assignedId','parts','laborCost','odometerKm','hourMeter','driverName'];
      const clean = {};
      ALLOW.forEach(k => { if (extraPatch && extraPatch[k] !== undefined) clean[k] = extraPatch[k]; });
      clean.updatedAt = new Date().toISOString();
      if (status !== undefined) clean.status = status;
      if (cost !== undefined) clean.cost = cost;
      const tlKey = _db.ref('/repairs/' + id + '/timeline').push().key;
      clean['timeline/' + tlKey] = {
        id: tlKey, status: status || '', when: new Date().toISOString(), by: by || '', note: note || ''
      };
      await _db.ref('/repairs/' + id).update(clean);
      return { ok: true };
    }

    case 'getLoginLogs': {
      // เผื่อฐานข้อมูลเดิมมีค้างเกิน 100 (หรือมีคนล็อกอินพร้อมกันจนเกิน) — เก็บกวาดตอนเปิดหน้าด้วย
      const removed = await _pruneLoginLogs();
      const snap = await _db.ref('/loginLogs').get();
      const logs = snap.val() ? Object.values(snap.val()) : [];
      logs.sort((a,b) => new Date(b.when) - new Date(a.when));
      return { logs: logs.slice(0, LOGIN_LOG_KEEP), keep: LOGIN_LOG_KEEP, removed };
    }

    default:
      throw new Error('Unknown action: ' + action);
  }
}

window.api = api;
</script>

function fmtDate(d){ if(!d) return ""; if(typeof d==="string") d=new Date(d); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtDateTime(d){ if(!d) return ""; if(typeof d==="string") d=new Date(d); return `${fmtDate(d)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

// หน้าที่อยู่ในแต่ละระบบงาน (หน้า "การแจ้งเตือน" เปิดได้จากทุกระบบ จึงไม่อยู่ในนี้)
window.SYSTEM_PAGES = {
  repairs: ["dashboard","repairs","spare-parts","pm-plan","machines","r-dashboard","r-new","r-mine"],
  assets:  ["machines","pm-plan","asset-registry","asset-do","doc-pj2","transfer-history"],
  consume: ["withdrawals","withdrawal-pending","site-stock"],
  manage:  ["projects","users","categories","login-logs","permissions"],
};

window.defaultPagesFor = (role) => window.APP_FEATURES.filter(f=>(f.roles||[]).includes(role)).map(f=>f.key);

// หน้าที่ตำแหน่งนี้เข้าได้ = ที่ Admin ตั้งไว้ + หน้าที่เพิ่มเข้าระบบทีหลัง (ตอนตั้งยังไม่มี) ใช้ค่าเริ่มต้น
// ไม่งั้นเพิ่มหน้าใหม่เมื่อไร ตำแหน่งที่เคยตั้งสิทธิ์ไว้จะมองไม่เห็นเมนูใหม่เลย
window.roleAllowList = (role, byRole) => {
  if(!(byRole && byRole.set)) return window.defaultPagesFor(role);
  const known = new Set(Array.isArray(byRole.known) ? byRole.known
    : window.APP_FEATURES.filter(f=>!f.addedLater).map(f=>f.key));
  const extra = window.APP_FEATURES.filter(f=>!known.has(f.key) && (f.roles||[]).includes(role)).map(f=>f.key);
  return [...new Set([...(byRole.allow||[]), ...extra])];
};

// สิทธิ์จริงของคนนี้ = ค่าตามตำแหน่ง (ค่าเริ่มต้น หรือที่ Admin ตั้งไว้) + ที่ยกเว้นไว้เป็นรายคน
window.allowedPagesFor = (user) => {
  if(!user) return new Set();
  const cfg = window.__DATA.permissions || {};
  const byRole = (cfg.roles||{})[user.role];
  // set:true = Admin ตั้งค่าตำแหน่งนี้เองแล้ว ให้ยึดตามนั้น (ติ๊กออกหมด = เข้าไม่ได้เลย ไม่ใช่กลับไปใช้ค่าเริ่มต้น)
  const base = window.roleAllowList(user.role, byRole);
  const set = new Set(base);
  const mine = (cfg.users||{})[user.id];
  if(mine){
    (mine.allow||[]).forEach(k=>set.add(k));
    (mine.deny||[]).forEach(k=>set.delete(k));
  }
  set.add("notifications");                            // ทุกคนต้องเห็นคำขอ/สถานะของตัวเอง
  if(user.role === "Admin") set.add("permissions");    // กันตั้งค่าพลาดแล้วปิดทางเข้าหน้าสิทธิ์ของตัวเอง
  return set;
};
window.canAccessPage = (user, key) => !!key && window.allowedPagesFor(user).has(key);

// ระบบงานที่เข้าได้ = สถานะพร้อมใช้ + ไม่ติด roles ที่ล็อกไว้ + มีสิทธิ์อย่างน้อย 1 ฟังก์ชันในระบบนั้น
window.canUseErp = (user, sys) => {
  if(!sys || sys.status !== "ready") return false;
  if(Array.isArray(sys.roles) && sys.roles.length && !sys.roles.includes(user?.role)) return false;
  const pages = window.SYSTEM_PAGES[sys.id];
  if(!pages || !pages.length) return true;
  const allowed = window.allowedPagesFor(user);
  return pages.some(k => allowed.has(k));
};

// สิทธิ์ที่ "ขึ้นกับระบบงานที่กำลังใช้อยู่" — Reporter ที่เข้าระบบ Asset Management ทำงานได้เท่า Engineer
// ใช้เฉพาะตอนเช็คว่า "แก้ไขได้ไหม" · ไม่เปลี่ยน role จริงของบัญชี และไม่มีผลกับระบบงานซ่อม
window.effectiveRole = (user) => {
  if(!user) return "";
  const sysId = (window.getActiveErp(user) || {}).id || "";
  if(user.role === "Reporter" && sysId === "assets") return "Engineer";
  return user.role;
};

// Role ที่ต้องระบุโครงการเสมอ — ไม่มีสิทธิ์เห็นข้ามโครงการไม่ว่ากรณีใด
// (ไม่ได้มอบหมายโครงการไว้ = ไม่เห็นข้อมูลของโครงการใดเลย ไม่ใช่เห็นทั้งหมด)
window.PROJECT_LOCKED_ROLES = ["Engineer","Safety Officer"];

window.userCanSeeAllProjects = (user) => {
  if(!user) return false;
  if(window.getActiveProject(user)) return false;
  if(["Admin","Director"].includes(user.role)) return true;
  if(window.PROJECT_LOCKED_ROLES.includes(user.role)) return false;
  return !user.projects || !Array.isArray(user.projects) || user.projects.length===0;
};
window.userProjects = (user) => {
  if(!user) return [];
  const activeProject = window.getActiveProject(user);
  if(activeProject) return [activeProject];
  const allNames = window.allProjectNames();
  if(window.userCanSeeAllProjects(user)) return allNames;
  return (Array.isArray(user.projects) ? user.projects : []).filter(p=>allNames.includes(p));
};
window.getProject = (name) => (window.__DATA.projects||[]).find(p=>p.name===name) || null;

// Role ที่ทำงานกับ "ภาพรวมงานซ่อมทั้งหมด" (เห็นเมนูแดชบอร์ด/รายการแจ้งซ่อมของฝั่งจัดการ)
window.isOpsRole = (user) => ["Admin","Officer","Engineer","Safety Officer"].includes(user?.role);
// Reporter เริ่มที่สรุปงานของตัวเอง (งานหลักของเขาคือแจ้งซ่อม) · role อื่นเริ่มที่แดชบอร์ดรวม
// ทุก role เข้าหน้าแดชบอร์ดได้หมด ต่างกันแค่หน้าแรกที่เปิดให้
window.defaultPageFor = (user) => (user?.role === "Reporter" ? "r-dashboard" : "dashboard");
window.userCanSeeProject = (user, project) => {
  const activeProject = window.getActiveProject(user);
  if(activeProject) return !project || project === activeProject;
  if(window.userCanSeeAllProjects(user)) return true;
  if(!project) return true;
  return (user.projects||[]).includes(project);
};
window.filterByUserProjects = (user, items, projectKey="project") => {
  const activeProject = window.getActiveProject(user);
  if(activeProject) return items.filter(x => !x[projectKey] || x[projectKey] === activeProject);
  if(window.userCanSeeAllProjects(user)) return items;
  const allowed = new Set(user.projects||[]);
  return items.filter(x => !x[projectKey] || allowed.has(x[projectKey]));
};

// ชื่อโครงการที่ "บัญชีนี้มีสิทธิ์" — คิดจาก role + โครงการที่มอบหมายเท่านั้น
// ไม่ผูกกับโครงการที่เลือกตอนเข้าใช้งาน (workspace) เพราะบางงานต้องเลือกข้ามโครงการได้ เช่น ย้ายเครื่องจักร
// ชื่อโครงการทั้งหมดที่ระบบรู้จัก = ทะเบียนโครงการ + ชื่อโครงการที่ติดอยู่กับเครื่องจักร
// ต้องใช้ตัวเดียวกันทั้งตอนมอบหมายสิทธิ์ (หน้าจัดการผู้ใช้งาน) และตอนตรวจสิทธิ์
// ไม่งั้นชื่อที่มีแค่ฝั่งเดียวจะติ๊กให้ไม่ได้ หรือติ๊กแล้วถูกกรองทิ้งจนไม่มีผลอะไรเลย
window.allProjectNames = () => {
  const names = new Set();
  (window.__DATA.projects||[]).forEach(p=>{
    const nm = (p && typeof p === "object") ? p.name : p;
    if(nm) names.add(nm);
  });
  (window.__DATA.machines||[]).forEach(m=>{ if(m && m.project) names.add(m.project); });
  return [...names].sort((a,b)=>String(a).localeCompare(String(b),"th"));
};

window.allowedProjectNames = (user) => {
  const all = window.allProjectNames();
  if(!user) return [];
  if(["Admin","Director"].includes(user.role)) return all;
  const assigned = (Array.isArray(user.projects) ? user.projects : []).filter(p=>all.includes(p));
  if(window.PROJECT_LOCKED_ROLES.includes(user.role)) return assigned;   // ไม่มอบหมาย = ไม่ได้เลย
  return assigned.length ? assigned : all;                               // role อื่น: ไม่ระบุ = ได้ทุกโครงการ (พฤติกรรมเดิม)
};

// รายการโครงการ (ทั้ง object) ที่ผู้ใช้คนนี้เลือก/เห็นได้ในฟอร์มและหน้าโครงการ
// ใช้แทน window.__DATA.projects ทุกที่ที่แสดงให้ผู้ใช้เห็น — ไม่งั้น role ที่ถูกล็อกโครงการจะเห็นชื่อโครงการอื่นหลุดออกไป
window.visibleProjects = (user, {includeInactive=false} = {}) => {
  const allowed = new Set(window.allowedProjectNames(user));
  return (window.__DATA.projects||[])
    .filter(p => includeInactive || p.status !== "inactive")
    .filter(p => allowed.has(p.name));
};

// ไซต์งานย่อยของโครงการ (เช่น Rig1 / Rig2) — ตั้งได้ที่หน้า "โครงการ" → แก้ไข → ไซต์งานย่อย
// รับได้ทั้ง object โครงการ และชื่อโครงการ · Firebase จะตัดฟิลด์ทิ้งเมื่อลบครบทุกไซต์ จึงต้องกัน undefined เสมอ
window.projectSites = (projectOrName) => {
  const p = (projectOrName && typeof projectOrName === "object")
    ? projectOrName
    : (window.__DATA.projects||[]).find(x => x.name === projectOrName);
  const raw = p && p.sites;
  if(Array.isArray(raw)) return raw.map(s=>String(s||"").trim()).filter(Boolean);
  if(typeof raw === "string") return raw.split(",").map(s=>s.trim()).filter(Boolean);
  if(raw && typeof raw === "object") return Object.values(raw).map(s=>String(s||"").trim()).filter(Boolean);
  return [];
};

window.avatarColor = (name) => {
  const colors=["#3B82F6","#8B5CF6","#EF4444","#10B981","#F59E0B","#06B6D4","#EC4899","#6366F1"];
  let h=0; for(const c of (name||"")) h=(h*31+c.charCodeAt(0))>>>0;
  return colors[h%colors.length];
};
window.initials = (name) => (name||"").split(" ").map(s=>s[0]).join("").slice(0,2).toUpperCase();

  if(!t.trim()) return out;
  window.SYMPTOM_GROUPS.forEach(g=>{
    g.terms.forEach(([needle,disp])=>{
      // คำภาษาอังกฤษสั้นๆ (เช่น pm) ต้องเป็นคำเดี่ยว ไม่ใช่ส่วนหนึ่งของคำอื่น
      const hit = /^[a-z ]+$/.test(needle) ? new RegExp("(^|[^a-z])"+needle+"([^a-z]|$)").test(t) : t.includes(needle);
      if(hit) (out[g.key] = out[g.key] || new Set()).add(disp);
    });
  });
  return out;
};

window.extractKeywords = function(text){
  // \p{M} ต้องมีด้วย ไม่งั้นสระ/วรรณยุกต์ไทยจะถูกลบทิ้งจนตัดคำไม่ออก
  let raw = String(text||"").toLowerCase()
    .replace(/[0-9๐-๙]+/g," ")
    .replace(/[^\p{L}\p{M}\s]+/gu," ");
  if(!raw.trim()) return [];

  // คนพิมพ์ "สาย ไฮดรอลิค แตก" ก็ต้องเจอวลีเดียวกัน — ลบช่องว่างที่คั่นกลางอักษรไทย
  for(let i=0;i<4;i++){
    const next = raw.replace(/([฀-๿])[ \t]+([฀-๿])/g,"$1$2");
    if(next===raw) break;
    raw = next;
  }

  const found = [];
  const add = (w)=>{ if(w && found.indexOf(w)<0) found.push(w); };
  for(const e of KW_LOOKUP){
    if(raw.indexOf(e.alias) >= 0){
      add(e.k);
      if(e.g) add(e.g);                      // นับเข้ากลุ่มกว้างด้วย เช่น ไฮดรอลิค / เครื่องยนต์
      raw = raw.split(e.alias).join(" ");    // ตัดออกไม่ให้ถูกตัดคำซ้ำเป็นเศษคำ
    }
  }

  let toks = [];
  try{
    if(typeof Intl !== "undefined" && Intl.Segmenter){
      const seg = window.__thSeg || (window.__thSeg = new Intl.Segmenter("th",{granularity:"word"}));
      for(const s of seg.segment(raw)) if(s.isWordLike) toks.push(String(s.segment).trim());
    }else{
      toks = raw.split(/\s+/);
    }
  }catch(e){ toks = raw.split(/\s+/); }

  const out = [];
  for(let i=0;i<toks.length;i++){
    let t = toks[i];
    if(!t) continue;
    if(KW_NEG.has(t)){                       // "ไม่ติด" / "ไม่ทำงาน" มีความหมายกว่า "ติด" เดี่ยวๆ
      const nxt = toks[i+1];
      if(nxt && !KW_STOP.has(nxt) && nxt.length>=2){ out.push(t+nxt); i++; continue; }
      continue;
    }
    if(KW_STOP.has(t)) continue;
    const isThai = /[฀-๿]/.test(t);
    if(t.length < (isThai ? 2 : 3)) continue;
    out.push(t);
  }
  return found.concat(out);
};
</script>

<script type="text/babel">
// ══════════════════════════════════════════════════════════════════════════
// ระบบอนุมัติการลบข้อมูล
//   ทุกปุ่มลบในเว็บเรียก window.deleteWithApproval() ตัวเดียวกัน
//     · Admin        → ยืนยันแล้วลบได้ทันที (เป็นผู้อนุมัติเอง)
//     · Role อื่น     → กรอกเหตุผล → ส่งคำขอเข้า /deleteRequests → รอ Admin อนุมัติ
//   Admin ที่เปิดเว็บอยู่จะเห็นแจ้งเตือนทันที (Firebase realtime) + ตัวเลขบนเมนู "การแจ้งเตือน"
// ══════════════════════════════════════════════════════════════════════════

const DELREQ_SEEN_KEY = "rms_delreq_seen";

window.__DELREQ = {
  list: [],
  ready: false,
  user: null,
  _subs: new Set(),
  _ref: null,
  _prev: null,            // Map(id → status) ของ snapshot ก่อนหน้า ใช้ดูว่าอะไร "เพิ่งเกิด"

  subscribe(fn){ this._subs.add(fn); return () => this._subs.delete(fn); },
  _emit(){ this._subs.forEach(fn => { try{ fn(this.list); }catch(e){} }); },

  start(user){
    this.user = user || null;
    if(this._ref) { this._emit(); return; }
    try{
      this._ref = firebase.database().ref("/deleteRequests").limitToLast(400);
      this._ref.on("value", (snap) => {
        const arr = Object.values(snap.val() || {})
          .filter(Boolean)
          .sort((a,b) => String(b.requestedAt||"").localeCompare(String(a.requestedAt||"")));
        const prev = this._prev;
        this.list = arr;
        this.ready = true;
        if(prev) arr.forEach(r => {
          const before = prev.get(r.id);
          if(before === undefined && r.status === "pending") this._announceNew(r);
          else if(before === "pending" && r.status !== "pending"){
            // อนุมัติแล้ว = ข้อมูลถูกลบ/แก้จริง → อัปเดตแคชของทุกเครื่องที่เปิดเว็บอยู่
            if(r.status === "approved") {
              try{
                if(r.kind === "edit") window.applyEditLocally(r.action, r.payload || {});
                else window.applyDeleteLocally(r.action, r.payload || {});
              }catch(e){}
            }
            this._announceDecision(r);
          }
        });
        this._prev = new Map(arr.map(r => [r.id, r.status]));
        this._emit();
      }, (err) => { console.warn("[deleteRequests] ฟังข้อมูลไม่สำเร็จ:", err && err.message); });
    }catch(e){ console.warn("[deleteRequests]", e); }
  },

  stop(){
    if(this._ref){ try{ this._ref.off(); }catch(e){} }
    this._ref = null; this._prev = null; this.list = []; this.ready = false; this.user = null;
    this._emit();
  },

  // ── นับตัวเลขบนเมนูแจ้งเตือน ──────────────────────────────────────────
  pending(){ return this.list.filter(r => r.status === "pending"); },
  visibleTo(user){
    if(!user) return [];
    if(user.role === "Admin") return this.list;
    return this.list.filter(r => r.requesterId === user.id);
  },
  badgeFor(user){
    if(!user) return 0;
    if(user.role === "Admin") return this.pending().length;
    const seen = Number(localStorage.getItem(DELREQ_SEEN_KEY + ":" + user.id) || 0);
    return this.list.filter(r =>
      r.requesterId === user.id && r.status !== "pending" && new Date(r.decidedAt || 0).getTime() > seen
    ).length;
  },
  markSeen(user){
    if(!user) return;
    localStorage.setItem(DELREQ_SEEN_KEY + ":" + user.id, String(Date.now()));
    this._emit();
  },

  // ── แจ้งเตือน ─────────────────────────────────────────────────────────
  _announceNew(r){
    if(!this.user || this.user.role !== "Admin") return;
    const isEdit = r.kind === "edit";
    const title = isEdit ? "มีคำขอแก้ไขข้อมูลรออนุมัติ" : "มีคำขอลบข้อมูลรออนุมัติ";
    const text  = `${r.requesterName || "ผู้ใช้งาน"} ขอ${isEdit?"แก้ไข":"ลบ"}${r.entityLabel || "ข้อมูล"} "${r.targetName || "-"}"`;
    if(window.Swal) Swal.fire({
      toast:true, position:"top-end", icon:"warning", title, text,
      showConfirmButton:false, timer:6000, timerProgressBar:true
    });
    this._beep();
    this._push(title, text);
  },
  _announceDecision(r){
    if(!this.user || r.requesterId !== this.user.id) return;
    const ok = r.status === "approved";
    const kindTxt = r.kind === "edit" ? "คำขอแก้ไข" : "คำขอลบ";
    const title = ok ? `${kindTxt}ได้รับการอนุมัติแล้ว` : `${kindTxt}ไม่ได้รับอนุมัติ`;
    const text  = `${r.entityLabel || "ข้อมูล"} "${r.targetName || "-"}" · โดย ${r.decidedByName || "ผู้ดูแลระบบ"}`;
    if(window.Swal) Swal.fire({
      toast:true, position:"top-end", icon: ok ? "success" : "info", title, text,
      showConfirmButton:false, timer:6000, timerProgressBar:true
    });
    this._push(title, text);
  },
  // แจ้งเตือนระดับเบราว์เซอร์ — เห็นได้แม้สลับไปแท็บอื่น
  _push(title, body){
    try{
      if(!("Notification" in window) || Notification.permission !== "granted") return;
      new Notification(title, { body, icon:"logo.png", tag:"rms-delete-request" });
    }catch(e){}
  },
  _beep(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      const ctx = new Ctx(), osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.06, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.35);
      setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 600);
    }catch(e){}
  },
};

</script>

<script type="text/babel">
/* ═══ แจ้งเตือนงานซ่อม (Admin / ช่าง) ═══════════════════════════════════
   · มีใบแจ้งซ่อมใหม่เข้าระบบ → เด้งเตือนทันที (ฟัง Firebase แบบเรียลไทม์)
   · เตือนสรุปงานที่ยังค้างอยู่ทุกวัน เวลา 08:00 / 11:00 / 13:00 / 17:00
   ทำงานบนเครื่องที่เปิดเว็บ/แอปค้างไว้ (ไม่ใช่ push จากเซิร์ฟเวอร์)
   เปิดแอปหลังเวลาที่กำหนด จะได้สรุปของรอบล่าสุดที่ยังไม่เคยเตือนในวันนั้น
   ────────────────────────────────────────────────────────────────── */
const JOBALERT_ROLES  = ["Admin","Technician"];
const JOBALERT_HOURS  = [8,11,13,17];
const JOBALERT_SEEN   = "rms_jobalert_seen";    // รอบสรุปที่เตือนไปแล้วของวันนี้
const JOBALERT_KNOWN  = "rms_jobalert_known";   // ใบงานที่เคยเห็นแล้ว กันเตือนซ้ำตอนโหลดหน้าใหม่

window.__JOBALERT = {
  user: null,
  _ref: null,
  _timer: null,
  _known: null,
  _first: true,

  enabledFor(user){ return !!user && JOBALERT_ROLES.includes(user.role); },

  start(user){
    if(!this.enabledFor(user)){ this.stop(); return; }
    if(this._ref && this.user && this.user.id === user.id){ this.user = user; return; }
    this.stop();
    this.user = user;
    this._known = this._loadKnown();
    this._first = true;
    try{
      this._ref = firebase.database().ref("/repairs").limitToLast(80);
      this._ref.on("value", (snap)=>{
        const arr = Object.values(snap.val() || {}).filter(Boolean);
        if(this._first){
          // รอบแรกคือใบงานที่มีอยู่ก่อนแล้ว — ไม่เตือนย้อนหลัง
          arr.forEach(r=>this._known.add(String(r.id)));
          this._saveKnown();
          this._first = false;
          return;
        }
        arr.forEach(r=>{
          const id = String(r.id||"");
          if(!id || this._known.has(id)) return;
          this._known.add(id);
          if(this._inScope(r) && String(r.reporterId||"") !== String(this.user.id)) this._announceNew(r);
        });
        this._saveKnown();
      }, (err)=>console.warn("[jobAlert] ฟังใบแจ้งซ่อมไม่สำเร็จ:", err && err.message));
    }catch(e){ console.warn("[jobAlert]", e); }

    this._timer = setInterval(()=>this._checkDigest(), 60000);
    this._checkDigest();
  },

  stop(){
    if(this._ref){ try{ this._ref.off(); }catch(e){} }
    if(this._timer){ clearInterval(this._timer); }
    this._ref = null; this._timer = null; this._known = null; this.user = null; this._first = true;
  },

  // ── ขอบเขตข้อมูลที่คนนี้เห็นได้ (สิทธิ์โครงการเดิมของระบบ) ──
  _inScope(r){
    try{ return window.userCanSeeProject(this.user, r && r.project); }catch(e){ return true; }
  },

  _loadKnown(){
    try{ return new Set(JSON.parse(localStorage.getItem(JOBALERT_KNOWN) || "[]")); }
    catch(e){ return new Set(); }
  },
  _saveKnown(){
    try{
      const arr = [...this._known];
      localStorage.setItem(JOBALERT_KNOWN, JSON.stringify(arr.slice(-300)));   // เก็บแค่ล่าสุดพอ
    }catch(e){}
  },

  // ── ใบแจ้งซ่อมใหม่ ──
  _announceNew(r){
    const problems = window.getProblems ? window.getProblems(r) : [];
    const what = (problems[0] && problems[0].text) || r.title || "ไม่ระบุอาการ";
    const title = "มีใบแจ้งซ่อมใหม่ " + (r.running || r.id || "");
    const text  = `${what} · ${r.machineCode || "ไม่ระบุเครื่องจักร"} · ${r.project ? window.projectShort(r.project) : "ไม่ระบุโครงการ"}`;
    if(window.Swal) Swal.fire({toast:true,position:"top-end",icon:"info",title,text,
      showConfirmButton:false,timer:8000,timerProgressBar:true});
    this._beep();
    this._push(title, text, "rms-new-repair");
  },

  // ── สรุปงานค้างตามรอบเวลา ──
  _dayKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; },

  _checkDigest(){
    if(!this.user) return;
    if(window.__FCM && window.__FCM.wanted()) return;   // เปิด push ไว้แล้ว ฝั่งเซิร์ฟเวอร์ส่งสรุปให้เอง
    const now = new Date();
    const key = `${JOBALERT_SEEN}:${this.user.id}:${this._dayKey(now)}`;
    let done = [];
    try{ done = JSON.parse(localStorage.getItem(key) || "[]"); }catch(e){}
    const due = JOBALERT_HOURS.filter(hr => now.getHours() >= hr && !done.includes(hr));
    if(!due.length) return;
    // เปิดแอปตอนเย็นหลังพลาดมาหลายรอบ — เตือนแค่รอบล่าสุดรอบเดียว ไม่ถล่มทีละ 4 อัน
    try{ localStorage.setItem(key, JSON.stringify(done.concat(due))); }catch(e){}
    this._announceDigest(due[due.length-1]);
  },

  _announceDigest(hr){
    const open = (window.__DATA.repairs || []).filter(r =>
      r && r.status !== "done" && r.status !== "cancel" && this._inScope(r));
    if(!open.length) return;                      // ไม่มีงานค้าง ก็ไม่ต้องกวน
    const byStatus = {};
    open.forEach(r=>{ byStatus[r.status] = (byStatus[r.status]||0) + 1; });
    const parts = (window.__DATA.statuses||[])
      .filter(s=>byStatus[s.key])
      .map(s=>`${s.label} ${byStatus[s.key]}`);
    const mine = open.filter(r=>String(r.assignedId||"") === String(this.user.id)).length;
    const title = `งานซ่อมค้าง ${open.length} ใบ (รอบ ${String(hr).padStart(2,"0")}:00)`;
    const text  = parts.join(" · ") + (mine ? ` · ที่คุณรับผิดชอบ ${mine} ใบ` : "");
    if(window.Swal) Swal.fire({toast:true,position:"top-end",icon:"warning",title,text,
      showConfirmButton:false,timer:10000,timerProgressBar:true});
    this._beep();
    this._push(title, text, "rms-job-digest");
  },

  _push(title, body, tag){
    try{
      if(window.__FCM && window.__FCM.wanted()) return;   // กันเด้งซ้ำกับ push ที่เซิร์ฟเวอร์ส่งมา
      if(!("Notification" in window) || Notification.permission !== "granted") return;
      new Notification(title, { body, icon:"logo.png", tag: tag || "rms-job" });
    }catch(e){}
  },
  _beep(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      const ctx = new Ctx(), osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = 740;
      gain.gain.setValueAtTime(0.06, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.35);
      setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 600);
    }catch(e){}
  },
};
</script>

<script type="text/babel">
/* ═══ แจ้งเตือนแบบ Push (Firebase Cloud Messaging) ════════════════════════
   ต่างจาก __JOBALERT ตรงที่ "ปิดแอปแล้วยังเตือนได้" เพราะเซิร์ฟเวอร์เป็นคนยิงมา
   · เครื่องนี้ขอ token จาก FCM แล้วเก็บไว้ที่ /fcmTokens/{userId}/{token}
   · ฝั่งส่ง = Google Apps Script (backend/Notify.gs) อ่าน token แล้วยิงเข้า FCM
   · ตัวรับตอนปิดแอปอยู่ใน sw.js (onBackgroundMessage)
   ตั้งค่าครั้งเดียวตาม backend/FCM-SETUP.md — ต้องมี VAPID key จาก Firebase Console
   ────────────────────────────────────────────────────────────────────── */
const FCM_VAPID_KEY = "";          // ใส่ Web Push certificate ตรงนี้ก็ได้ (เว้นว่าง = อ่านจาก /config/fcmVapidKey)
const FCM_ON_KEY = "rms_fcm_on";   // จำว่าเครื่องนี้เปิดรับ push ไว้

window.__FCM = {
  _msg: null,
  _vapid: null,
  _listening: false,

  supported(){
    try{
      return !!(window.firebase && firebase.messaging && "serviceWorker" in navigator
                && "Notification" in window && "PushManager" in window);
    }catch(e){ return false; }
  },

  // เปิดรับ push ไว้บนเครื่องนี้หรือเปล่า
  wanted(){ try{ return localStorage.getItem(FCM_ON_KEY) === "1"; }catch(e){ return false; } },

  messaging(){
    if(this._msg) return this._msg;
    this._msg = firebase.messaging();
    return this._msg;
  },

  async getVapid(){
    if(this._vapid !== null) return this._vapid;
    if(FCM_VAPID_KEY){ this._vapid = FCM_VAPID_KEY; return this._vapid; }
    try{
      const snap = await firebase.database().ref("/config/fcmVapidKey").get();
      this._vapid = String(snap.val() || "").trim();
    }catch(e){ this._vapid = ""; }
    return this._vapid;
  },

  // token มีอักขระที่ใช้เป็น key ใน Realtime Database ไม่ได้ ต้องแปลงก่อน
  _key(token){ return String(token).replace(/[.#$\[\]\/]/g, "_"); },

  // สถานะสำหรับแสดงในหน้าตั้งค่า
  async status(){
    if(!this.supported()) return {code:"unsupported", text:"อุปกรณ์/เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือนแบบ push"};
    if(!(await this.getVapid())) return {code:"no-vapid", text:"ยังไม่ได้ตั้งค่า VAPID key ของ Firebase (ดู backend/FCM-SETUP.md)"};
    if(Notification.permission === "denied") return {code:"denied", text:"เบราว์เซอร์ถูกตั้งให้บล็อกการแจ้งเตือนไว้ ต้องไปปลดที่การตั้งค่าเบราว์เซอร์"};
    if(this.wanted() && Notification.permission === "granted") return {code:"on", text:"เปิดอยู่ — ปิดแอปแล้วยังได้รับแจ้งเตือน"};
    return {code:"off", text:"ยังไม่ได้เปิดบนเครื่องนี้"};
  },

  // ขอ token แล้วบันทึกไว้ให้ฝั่งเซิร์ฟเวอร์ยิงเข้ามาได้
  async register(user, {ask=false} = {}){
    if(!this.supported() || !user) return {ok:false, reason:"unsupported"};
    const vapid = await this.getVapid();
    if(!vapid) return {ok:false, reason:"no-vapid"};
    if(Notification.permission === "denied") return {ok:false, reason:"denied"};
    if(Notification.permission !== "granted"){
      if(!ask) return {ok:false, reason:"not-asked"};
      let p = "denied";
      try{ p = await Notification.requestPermission(); }catch(e){}
      if(p !== "granted") return {ok:false, reason:"denied"};
    }
    try{
      const reg = await navigator.serviceWorker.ready;       // ใช้ sw.js ตัวเดิม ไม่ลงทะเบียน service worker ซ้อน
      const token = await this.messaging().getToken({vapidKey:vapid, serviceWorkerRegistration:reg});
      if(!token) return {ok:false, reason:"no-token"};
      await firebase.database().ref("/fcmTokens/" + user.id + "/" + this._key(token)).set({
        token,
        userId: user.id,
        name: user.name || "",
        role: user.role || "",
        updatedAt: new Date().toISOString(),
        ua: String(navigator.userAgent || "").slice(0,180),
      });
      try{ localStorage.setItem(FCM_ON_KEY, "1"); }catch(e){}
      this.listen();
      return {ok:true, token};
    }catch(err){
      console.warn("[fcm] ขอ token ไม่สำเร็จ:", err && err.message);
      return {ok:false, reason:"error", error:err};
    }
  },

  async unregister(user){
    try{
      const vapid = await this.getVapid();
      const reg = await navigator.serviceWorker.ready;
      const token = await this.messaging().getToken({vapidKey:vapid, serviceWorkerRegistration:reg});
      if(token && user) await firebase.database().ref("/fcmTokens/" + user.id + "/" + this._key(token)).remove();
      await this.messaging().deleteToken();
    }catch(e){ /* ลบไม่ได้ก็ไม่เป็นไร token จะหมดอายุเอง */ }
    try{ localStorage.removeItem(FCM_ON_KEY); }catch(e){}
    return {ok:true};
  },

  // เปิดแอปค้างไว้แล้วมี push เข้ามา — เบราว์เซอร์ไม่เด้งให้ ต้องโชว์เอง
  listen(){
    if(this._listening || !this.supported()) return;
    try{
      this.messaging().onMessage((payload)=>{
        const d = (payload && payload.data) || {};
        if(window.Swal) Swal.fire({
          toast:true, position:"top-end",
          icon: d.kind === "digest" ? "warning" : "info",
          title: d.title || "แจ้งเตือน", text: d.body || "",
          showConfirmButton:false, timer:8000, timerProgressBar:true,
        });
      });
      this._listening = true;
    }catch(e){}
  },

  // เรียกตอนล็อกอิน — ต่ออายุ token ให้อัตโนมัติ ไม่ต้องให้ผู้ใช้มากดเอง
  async autoStart(user){
    if(!this.supported() || !user) return;
    if(!(window.NOTIFY_ROLES||[]).includes(user.role)) return;
    if(Notification.permission === "granted" || this.wanted()){
      await this.register(user, {ask:false});
    }
  },
};
</script>

// ===== ซิงค์ทะเบียนทรัพย์สิน ↔ ใบส่งของ (DO) แบบ realtime =====
// ทั้งสองหน้าใช้ฐานข้อมูลเดียวกัน (panamanee-3a15a) — ฟัง /assets และ /deliveryOrders ตลอดเวลา
// ใครออก/แก้/ยกเลิกใบส่งของ หรือแก้ทะเบียน จากเครื่องไหนก็ตาม ทุกหน้าที่เปิดอยู่จะเห็นค่าล่าสุดทันที
window.__ASSETSYNC = {
  assets: null, orders: null, live: false, _subs: new Set(), _refs: null,
  subscribe(fn){
    this._subs.add(fn); this.start();
    // หน้าที่เพิ่งเปิดทีหลัง — ส่งข้อมูลที่มีอยู่แล้วให้ทันที ไม่ต้องรอการเปลี่ยนแปลงครั้งถัดไป
    if(this.assets) { try{ fn('assets'); }catch(e){} }
    if(this.orders) { try{ fn('orders'); }catch(e){} }
    return () => this._subs.delete(fn);
  },
  _emit(kind){ this._subs.forEach(fn => { try{ fn(kind); }catch(e){} }); },
  start(){
    if(this._refs) return;
    const db = window.__assetDb;
    if(!db) return;
    const aRef = db.ref('/assets'), dRef = db.ref('/deliveryOrders');
    this._refs = [aRef, dRef];

      const list = Object.entries(snap.val() || {}).map(([key, v]) => ({ key, ...(v || {}) }))
        .sort((a,b)=>String(a.assetCode||a.id||"").localeCompare(String(b.assetCode||b.id||""),"th"));
      this.assets = list; this.live = true;
      window.__DATA.assetRegistry = list;
      this._emit('assets');

        .sort((a,b)=>String(b.when||"").localeCompare(String(a.when||"")));
      this.orders = list;
      window.__DATA.deliveryOrders = list;
      this._emit('orders');
    }, fail('ใบส่งของ'));
  },
  stop(){
    (this._refs||[]).forEach(r => { try{ r.off(); }catch(e){} });

  },
};

// ตัดข้อมูลที่ถูกลบออกจากแคชในหน้าเว็บ ไม่ต้องโหลดใหม่ทั้งหน้า
window.applyDeleteLocally = function(action, payload = {}){
  const D = window.__DATA;
  const byId  = (arr) => (arr||[]).filter(x => x.id !== payload.id);
  const byKey = (arr) => (arr||[]).filter(x => x.key !== payload.key);
  if(action === "deleteProject")       D.projects   = byId(D.projects);
  else if(action === "deleteUser")     D.users      = byId(D.users);
  else if(action === "deleteCategory") D.categories = byId(D.categories);
  else if(action === "deleteMachine")  D.machines   = byId(D.machines);
  else if(action === "deleteRepair")   D.repairs    = byId(D.repairs);
  else if(action === "deleteWithdrawal")    D.withdrawals    = byKey(D.withdrawals);
  else if(action === "deleteAssetRegistry") { if(Array.isArray(D.assetRegistry))  D.assetRegistry  = byKey(D.assetRegistry); }
  else if(action === "deleteDeliveryOrder") { if(Array.isArray(D.deliveryOrders)) D.deliveryOrders = byKey(D.deliveryOrders); }
  else if(action === "deleteStockItem")     { if(D.siteStock) D.siteStock = {...D.siteStock, items: byKey(D.siteStock.items)}; }
  else if(action === "deleteTransferEntry"){
    const m = (D.machines||[]).find(x => x.id === payload.machineId);
    if(m) m.transferHistory = (m.transferHistory||[]).filter(t => !(String(t.when||"") === String(payload.when||"") && String(t.to||"") === String(payload.to||"")));
  }
};

// อัปเดตแคชในหน้าเว็บหลังคำขอ "แก้ไข" ถูกอนุมัติ ไม่ต้องโหลดใหม่ทั้งหน้า
window.applyEditLocally = function(action, payload = {}){
  const D = window.__DATA;
  if(action === "updateRepair"){
    const patch = payload.patch || {};
    D.repairs = (D.repairs||[]).map(x => x.id === payload.id ? {...x, ...patch} : x);
  } else if(action === "updateMachine"){
    const patch = payload.patch || {};
    D.machines = (D.machines||[]).map(x => x.id === payload.id ? {...x, ...patch} : x);
  } else if(action === "saveAssetRegistry"){
    // ทะเบียนทรัพย์สินโหลดแบบ lazy — ยังไม่เคยเปิดหน้า (null) ก็ไม่ต้องทำอะไร เดี๋ยวโหลดใหม่เอง
    if(Array.isArray(D.assetRegistry)){

};

// ═══ PM (บำรุงรักษาตามรอบ) ═══════════════════════════════════════════════
// ตั้งรอบได้ 2 แบบ (ใช้แบบเดียวหรือทั้งคู่ก็ได้): ทุก N วัน นับจาก PM ล่าสุด · ทุก N ชั่วโมงทำงาน
// ถึงกำหนดแบบใดแบบหนึ่ง = ต้องทำ PM · เครื่องที่ "ส่งคืน" แล้วไม่นับ
window.PM_SOON_DAYS = 7;     // เตือนล่วงหน้ากี่วัน
window.PM_SOON_HOURS = 50;   // เตือนล่วงหน้ากี่ชั่วโมงทำงาน
window.machinePmStatus = function(m){
  const none = { state:"none" };
  if(!m || m.status==="ส่งคืน") return none;
  const everyD = Number(m.pmEveryDays)||0, everyH = Number(m.pmEveryHours)||0;
  if(!everyD && !everyH) return none;
  const out = { state:"ok" };
  if(everyD){
    const base = m.lastPmDate || m.lastService;
    const b = base ? new Date(base) : null;
    if(b && !isNaN(b)){
      b.setHours(0,0,0,0);
      const next = new Date(b); next.setDate(next.getDate()+everyD);
      const today = new Date(); today.setHours(0,0,0,0);
      out.nextDate = next;
      out.daysLeft = Math.round((next-today)/86400000);
    } else {
      out.daysLeft = -1;   // ตั้งรอบไว้แต่ไม่เคยบันทึก PM — ถือว่าถึงกำหนด
      out.noBase = true;
    }
  }
  if(everyH){
    out.nextHours = (Number(m.lastPmHours)||0) + everyH;
    out.hoursLeft = out.nextHours - (Number(m.hours)||0);
  }
  const over = (out.daysLeft!=null && out.daysLeft<0) || (out.hoursLeft!=null && out.hoursLeft<=0);
  const soon = (out.daysLeft!=null && out.daysLeft<=window.PM_SOON_DAYS) || (out.hoursLeft!=null && out.hoursLeft<=window.PM_SOON_HOURS);
  out.state = over ? "overdue" : soon ? "soon" : "ok";
  const parts = [];
  if(out.noBase) parts.push("ยังไม่เคยบันทึก PM");
  else if(out.daysLeft!=null) parts.push(out.daysLeft<0 ? `เลยกำหนด ${-out.daysLeft} วัน` : out.daysLeft===0 ? "ครบกำหนดวันนี้" : `อีก ${out.daysLeft} วัน`);
  if(out.hoursLeft!=null) parts.push(out.hoursLeft<=0 ? `เกินรอบ ${Math.abs(out.hoursLeft).toLocaleString("th-TH")} ชม.` : `อีก ${out.hoursLeft.toLocaleString("th-TH")} ชม.`);
  out.text = parts.join(" · ");
  return out;
};
// เครื่องจักรที่ต้องทำ PM (เกินกำหนด + ใกล้ถึง) เฉพาะโครงการที่ผู้ใช้เห็น
window.machinesPmDue = function(user){
  let list = window.__DATA.machines || [];

  list.forEach(m=>{ const s = window.machinePmStatus(m); if(s.state==="overdue") overdue.push(m); else if(s.state==="soon") soon.push(m); });
  return { overdue, soon, total: overdue.length + soon.length };
};

// เทียบค่าก่อน/หลัง คืนเฉพาะฟิลด์ที่เปลี่ยนจริง → [{field,label,from,to}]
window.diffFields = function(before, patch, labels){
  const out = [];
  Object.keys(labels||{}).forEach(k=>{
    if(!(k in (patch||{}))) return;
    const meta = labels[k];
    const fmt = meta.fmt || (v => (v===0 || v) ? String(v) : "");
    const a = fmt(before ? before[k] : "");
    const b = fmt(patch[k]);
    if(String(a) !== String(b)) out.push({ field:k, label:meta.label, from:a||"— ว่าง —", to:b||"— ว่าง —" });
  });
  return out;
};
