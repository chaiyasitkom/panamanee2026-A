window.printRepairForm = async function(r, user){
  const w = window.open("", "_blank");   // ต้องเปิดก่อน await ไม่งั้นเบราว์เซอร์บล็อก popup
  if(!w){ Swal.fire({icon:"warning",title:"เปิดหน้าต่างพิมพ์ไม่ได้",text:"กรุณาอนุญาต popup ของเบราว์เซอร์"}); return; }
  await window.__SIG.preload([repairReporterSigner(r)]);
  w.document.open(); w.document.write(window.buildRepairFormDoc(r,user)); w.document.close(); w.focus();
  w.onload = ()=>{ try{ w.print(); }catch(e){} };
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 500);
};

window.shareRepairImage = async function(r, user){
  const ensureH2C = async () => {
    if(window.html2canvas) return window.html2canvas;
    await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"; s.onload=res; s.onerror=()=>rej(new Error("โหลดตัวแปลงรูปไม่ได้")); document.head.appendChild(s); });
    return window.html2canvas;
  };
  let iframe;
  try{
    Swal.fire({title:"กำลังสร้างรูป...",allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
    const H2C = await ensureH2C();
    await window.__SIG.preload([repairReporterSigner(r)]);
    iframe = document.createElement("iframe");
    iframe.style.cssText = "position:fixed;left:-100000px;top:0;width:760px;height:1200px;border:0;background:#fff";
    document.body.appendChild(iframe);
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open(); doc.write(window.buildRepairFormDoc(r,user)); doc.close();
    await new Promise(res=>setTimeout(res, 500));
    // เว้นขอบขาวรอบใบงานก่อนแปลงเป็นรูป (แคปทั้ง body ที่ใส่ padding ไว้ — ไม่กระทบตอนสั่งพิมพ์)
    doc.body.style.padding = "28px 24px";
    doc.body.style.background = "#ffffff";
    const node = doc.body;
    const canvas = await H2C(node, {scale:2, backgroundColor:"#ffffff", useCORS:true, windowWidth:node.scrollWidth||760});
    const blob = await new Promise(res=>canvas.toBlob(res,"image/png"));
    const dataUrl = canvas.toDataURL("image/png");
    const fname = "ใบแจ้งซ่อม-"+String(r.running||"").replace(/[\\/]/g,"-")+".png";
    const file = new File([blob], fname, {type:"image/png"});
    Swal.close();
    window.__showShareSheet(r, blob, dataUrl, file, fname);
  }catch(err){
    Swal.close();
    if(!(err && err.name==="AbortError")) Swal.fire({icon:"error",title:"แชร์รูปไม่สำเร็จ",text:(err&&err.message)||String(err)});
  }finally{
    if(iframe) iframe.remove();
  }
};

// ป็อปอัพพรีวิว + ปุ่มแชร์ (ต้องเรียก navigator.share ใน gesture ที่ผู้ใช้กดปุ่มเอง ไม่งั้นมือถือจะบล็อก)
window.__showShareSheet = function(r, blob, dataUrl, file, fname){
  const runTxt = String(r.running||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const canShareFiles = !!(navigator.canShare && navigator.canShare({files:[file]}));
  const canCopy = !!(navigator.clipboard && window.ClipboardItem && window.isSecureContext);
  const hint = canShareFiles
    ? "มือถือ: กด &quot;ส่ง / แชร์&quot; แล้วเลือก LINE&nbsp;&nbsp;·&nbsp;&nbsp;คอม: กด &quot;คัดลอกรูป&quot; แล้ววางในแชท (Ctrl+V)"
    : (canCopy ? "กด &quot;คัดลอกรูป&quot; แล้ววางในแชท LINE ได้เลย (Ctrl+V)" : "กด &quot;ดาวน์โหลด&quot; แล้วส่งรูปเข้า LINE เอง");
  const dl = ()=>{ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); };
  const btn = (act,bg,color,border,label,icon)=>"<button data-act='"+act+"' style='flex:1;min-width:120px;padding:11px 14px;border:"+border+";border-radius:8px;background:"+bg+";color:"+color+";font-weight:600;cursor:pointer'><i class='fa-solid "+icon+"'></i> "+label+"</button>";
  const scrim = document.createElement("div");
  scrim.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px";
  scrim.innerHTML = "<div style='background:#fff;color:#111827;border-radius:14px;max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)'>"
    + "<div style='font-weight:700;font-size:15px;margin-bottom:2px'>ใบแจ้งซ่อม "+runTxt+"</div>"
    + "<div style='font-size:12px;color:#64748B;margin-bottom:10px'>"+hint+"</div>"
    + "<img src='"+dataUrl+"' style='max-width:100%;border:1px solid #e5e7eb;border-radius:8px'/>"
    + "<div style='display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center'>"
    + (canShareFiles?btn("share","#06C755","#fff","0","ส่ง / แชร์","fa-share-nodes"):"")
    + (canCopy?btn("copy","#1E40AF","#fff","0","คัดลอกรูป","fa-copy"):"")
    + btn("dl","#fff","#111","1px solid #cbd5e1","ดาวน์โหลด","fa-download")
    + "</div>"
    + "<button data-act='close' style='margin-top:8px;width:100%;padding:9px;border:0;border-radius:8px;background:#f1f5f9;color:#475569;cursor:pointer'>ปิด</button>"
    + "</div>";
  document.body.appendChild(scrim);
  const close = ()=>scrim.remove();
  scrim.addEventListener("click", e=>{ if(e.target===scrim) close(); });
  scrim.querySelector("[data-act='close']").onclick = close;
  scrim.querySelector("[data-act='dl']").onclick = ()=>{ dl(); close(); };
  const sb = scrim.querySelector("[data-act='share']");
  if(sb) sb.onclick = async ()=>{
    try{ await navigator.share({files:[file], title:"ใบแจ้งซ่อม "+(r.running||""), text:"ใบแจ้งซ่อม "+(r.running||"")}); close(); }
    catch(err){ if(err && err.name!=="AbortError") Swal.fire({icon:"error",title:"แชร์ไม่สำเร็จ",text:(err&&err.message)||String(err)}); }
  };
  const cp = scrim.querySelector("[data-act='copy']");
  if(cp) cp.onclick = async ()=>{
    try{
      await navigator.clipboard.write([new ClipboardItem({[blob.type||"image/png"]: blob})]);
      close();
      Swal.fire({icon:"success",title:"คัดลอกรูปแล้ว",text:"ไปที่แชท LINE แล้ววาง (Ctrl+V) ได้เลย",timer:2600,showConfirmButton:false});
    }catch(e){ Swal.fire({icon:"error",title:"คัดลอกไม่ได้",text:"เบราว์เซอร์นี้อาจไม่รองรับ ลองใช้ดาวน์โหลดแทน"}); }
  };
};

// ช่องกรอกอาการ/ปัญหา — หนึ่งบรรทัดต่อหนึ่งอาการ (เก็บเป็นข้อความคั่นด้วย \n)
// ช่องยืดลงเองเมื่อข้อความยาวเกินความกว้าง · Enter = ขึ้นอาการใหม่ · วางข้อความหลายบรรทัด = แตกเป็นหลายอาการ
function ProblemsField({value,onChange,disabled,placeholder}){
  const list = (value && value.length) ? value.split("\n") : [""];
  const refs = React.useRef([]);
  const focusNext = React.useRef(null);
  const commit = (arr)=>onChange(arr.join("\n"));
  const fit = (el)=>{ if(!el) return; el.style.height="auto"; el.style.height=el.scrollHeight+"px"; };
  React.useLayoutEffect(()=>{
    refs.current.forEach(fit);
    if(focusNext.current!==null){
      const el = refs.current[focusNext.current];
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      focusNext.current = null;
    }
  });
  const setAt = (i,v)=>{
    const parts = String(v).split(/\r?\n/);      // วางข้อความหลายบรรทัด → แตกเป็นหลายอาการ
    const a = list.slice();
    a.splice(i, 1, ...parts);
    if(parts.length>1) focusNext.current = i + parts.length - 1;
    commit(a);
  };
  const addAfter = (i)=>{ const a=list.slice(); a.splice(i+1,0,""); focusNext.current=i+1; commit(a); };
  const add = ()=>{ focusNext.current=list.length; commit(list.concat([""])); };
  const removeAt = (i)=>{ const a=list.filter((_,idx)=>idx!==i); refs.current.splice(i,1); commit(a.length?a:[""]); };
  const taSt = {flex:1,width:"100%",padding:"9px 11px",border:"1px solid var(--line)",borderRadius:8,fontFamily:"Kanit",fontSize:13.5,lineHeight:1.5,background:"#fff",
    resize:"none",overflow:"hidden",minHeight:38,display:"block",outline:"none"};
  return (
    <div style={{display:"grid",gap:8}}>
      {list.map((p,i)=>(
        <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
          <span style={{width:20,textAlign:"right",color:"var(--muted)",fontSize:13,flexShrink:0,paddingTop:10}}>{i+1}.</span>
          <textarea
            ref={el=>{ refs.current[i]=el; fit(el); }}
            rows={1} style={taSt} value={p} disabled={disabled}
            onChange={e=>setAt(i,e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey && !e.nativeEvent.isComposing){ e.preventDefault(); addAfter(i); } }}
            onFocus={e=>{ e.target.style.borderColor="var(--primary)"; e.target.style.boxShadow="0 0 0 3px rgba(30,64,175,.1)"; }}
            onBlur={e=>{ e.target.style.borderColor="var(--line)"; e.target.style.boxShadow="none"; }}
            placeholder={placeholder||"เช่น มอเตอร์ไหม้ ใช้งานไม่ได้"} />
          <button type="button" className="ia" title="ลบอาการนี้" disabled={disabled||list.length<=1} onClick={()=>removeAt(i)} style={{color:"#EF4444",opacity:(disabled||list.length<=1)?0.35:1,flexShrink:0,marginTop:2}}><i className="fa-solid fa-trash"></i></button>
        </div>
      ))}
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <button type="button" className="btn btn-ghost btn-sm" disabled={disabled} onClick={add}><i className="fa-solid fa-plus"></i> เพิ่มอาการ</button>
        <span style={{fontSize:11.5,color:"var(--muted)"}}>ข้อความยาวจะขึ้นบรรทัดใหม่ในช่องเดิม · กด Enter เพื่อขึ้นอาการถัดไป</span>
      </div>
    </div>
  );
}

// scope="reporter" = โหมดผู้แจ้งแก้ใบของตัวเอง — แก้ได้เฉพาะข้อมูลที่ตัวเองกรอกตอนแจ้ง
// ซ่อนช่องฝั่งปฏิบัติการ (สถานะ / ค่าใช้จ่าย / ผู้รับผิดชอบ / รายละเอียดการซ่อม / ผู้แจ้ง / โครงการ)
function EditRepairModal({r,onClose,onSave,scope}){
  const toDateStr = (d) => { if(!d) return ""; const dt = typeof d==="string"?new Date(d):d; return dt.toISOString().slice(0,10); };
  const [f,setF] = React.useState({title:r.title||"",desc:r.desc||"",repairNote:r.repairNote||"",siteId:r.siteId||"",subSite:r.subSite||"",machineCode:r.machineCode||"",odometerKm:r.odometerKm||"",hourMeter:r.hourMeter||"",driverName:r.driverName||"",project:r.project||"",categoryId:r.categoryId||"",status:r.status||"new",reporterName:r.reporterName||"",assignedId:r.assignedId||"",cost:r.cost||"",photos:Array.isArray(r.photos)?r.photos.filter(Boolean):[],createdAt:toDateStr(r.createdAt)});
  const set = (k,v)=>setF(p=>({...p,[k]:v}));
  const isReporter = scope === "reporter";
  // ฟิลด์ที่ผู้แจ้งแก้ได้ — ตัดฝั่งปฏิบัติการออกที่ตัว patch ด้วย ไม่ใช่แค่ซ่อนช่องบนหน้าจอ
  const REPORTER_FIELDS = ["title","desc","siteId","subSite","machineCode","odometerKm","hourMeter","driverName","categoryId","createdAt","photos","problems"];
  const submit = () => {
    const title = (f.title||"").split("\n").map(s=>s.trim()).filter(Boolean).join("\n");
    const existing = window.getProblems(r);
    const problems = title.split("\n").filter(Boolean).map((t,i)=>({text:t, status:(existing[i]&&existing[i].status)||r.status||"new"}));
    const full = {...f, title, problems, photos:(f.photos||[]).filter(Boolean).slice(0,5), cost: f.cost===""?"":Number(f.cost)||0, createdAt: f.createdAt ? new Date(f.createdAt).toISOString() : r.createdAt};
    if(!isReporter){ onSave(r, full); return; }
    const patch = {};
    REPORTER_FIELDS.forEach(k=>{ if(k in full) patch[k] = full[k]; });
    onSave(r, patch);
  };
  const technicians = (window.__DATA.users||[]).filter(u=>["Technician","Officer","Admin","Engineer"].includes(u.role));
  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className="fa-solid fa-user-pen" style={{color:"#1E40AF",marginRight:8}}></i>{isReporter?"ขอแก้ไขใบแจ้งซ่อม":"แก้ไขข้อมูล"} · <span className="ticket-id" style={{marginLeft:6}}>{r.running}</span></>}
      footer={<><button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button><button className="btn btn-primary" onClick={submit}><i className={`fa-solid ${isReporter?"fa-paper-plane":"fa-floppy-disk"}`}></i> {isReporter?"ส่งคำขอแก้ไข":"บันทึกการแก้ไข"}</button></>}>
      {isReporter ? (
        <div style={{background:"#FEF3C7",border:"1px solid #FDE68A",color:"#92400E",padding:"10px 14px",borderRadius:8,fontSize:13,marginBottom:16}}>
          <i className="fa-solid fa-shield-halved" style={{marginRight:6}}></i>
          แก้ได้เฉพาะข้อมูลที่คุณกรอกตอนแจ้ง · กดส่งแล้ว <b>ต้องรอผู้ดูแลระบบ (Admin) อนุมัติ</b> ข้อมูลเดิมจะยังไม่เปลี่ยนจนกว่าจะอนุมัติ
        </div>
      ) : (
        <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",color:"#1E40AF",padding:"10px 14px",borderRadius:8,fontSize:13,marginBottom:16}}>
          <i className="fa-solid fa-pen-to-square" style={{marginRight:6}}></i>โหมดแก้ไข — แก้ไขข้อมูลใบแจ้งซ่อมได้ทุกฟิลด์ ประวัติการแก้ไขจะถูกบันทึกไว้ใน Timeline
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:14}}>
        <div style={{gridColumn:"1 / -1"}}><label className="k">อาการ/ปัญหา</label><ProblemsField value={f.title} onChange={v=>set("title",v)} /></div>
        <div style={{gridColumn:"1 / -1"}}><label className="k">รายละเอียดปัญหา</label><textarea className="inp" rows="2" value={f.desc} onChange={e=>set("desc",e.target.value)} /></div>
        {!isReporter && <div style={{gridColumn:"1 / -1"}}><label className="k" style={{color:"var(--primary)",fontWeight:500}}>รายละเอียดการซ่อม <span style={{fontWeight:400,color:"var(--muted)"}}>(บันทึกโดยช่าง/เจ้าหน้าที่)</span></label><textarea className="inp" rows="3" placeholder="บันทึกขั้นตอนการซ่อม วิธีแก้ไข อุปกรณ์ที่ใช้..." value={f.repairNote} onChange={e=>set("repairNote",e.target.value)} /></div>}
        <div style={{gridColumn:"1 / -1"}}><label className="k"><i className="fa-solid fa-images" style={{color:"var(--primary)",marginRight:6}}></i>รูปภาพประกอบ <span style={{fontWeight:400,color:"var(--muted)"}}>(สูงสุด 5 รูป)</span></label><PhotosField value={f.photos} onChange={v=>set("photos",v)} uploadContext={{running:r.running}} /></div>
        <div><label className="k">เลขที่ไซต์งาน</label><input className="inp" value={f.siteId} onChange={e=>set("siteId",e.target.value)} /></div>
        <div><label className="k">รหัสเครื่องจักร</label>
          <input className="inp" list="edit-machine-dl" value={f.machineCode} onChange={e=>{const code=e.target.value;const m=(window.__DATA.machines||[]).find(x=>x.code===code);setF(p=>({...p,machineCode:code,...(m&&!p.project?{project:m.project||""}:{})}));}} placeholder="พิมพ์หรือเลือกรหัสเครื่องจักร..." />
          <datalist id="edit-machine-dl">{(window.__DATA.machines||[]).map(m=>(<option key={m.id} value={m.code}>{m.name}{m.project?` · ${m.project}`:""}</option>))}</datalist>
        </div>
        {/* โครงการล็อกไว้สำหรับผู้แจ้ง — เลขที่ใบแจ้งซ่อมออกตามรหัสโครงการ เปลี่ยนแล้วเลขที่จะไม่ตรงกับโครงการ */}
        {isReporter
          ? <div><label className="k">โครงการ/หน่วยงาน</label><input className="inp" value={f.project||"— ไม่ระบุ —"} disabled style={{background:"#F8FAFC",color:"var(--muted)"}} /></div>
          : <div><label className="k">โครงการ/หน่วยงาน</label><select className="inp" value={f.project} onChange={e=>setF(p=>({...p,project:e.target.value,subSite:""}))}><option value="">— ไม่ระบุ —</option>{Array.from(new Set((window.__DATA.machines||[]).map(m=>m.project).filter(Boolean))).sort().map(p=>(<option key={p} value={p}>{p}</option>))}</select></div>}
        {(()=>{ const sites=window.projectSites(f.project); const legacy=f.subSite&&!sites.includes(f.subSite);
          return (sites.length||legacy) ? (
            <div><label className="k">ไซต์งานย่อย</label>
              <select className="inp" value={f.subSite} onChange={e=>set("subSite",e.target.value)}>
                <option value="">— ทั้งโครงการ (ไม่ระบุไซต์) —</option>
                {sites.map(s=><option key={s} value={s}>{s}</option>)}
                {legacy && <option value={f.subSite}>{f.subSite} (ไม่มีในโครงการแล้ว)</option>}
              </select>
            </div>
          ) : null; })()}
        <div><label className="k">เลขมิเตอร์กิโลเมตร</label><input className="inp" type="number" min="0" step="any" value={f.odometerKm} onChange={e=>set("odometerKm",e.target.value)} /></div>
        <div><label className="k">เลขมิเตอร์ชั่วโมง</label><input className="inp" type="number" min="0" step="any" value={f.hourMeter} onChange={e=>set("hourMeter",e.target.value)} /></div>
        <div><label className="k">พนักงานขับ / ผู้ควบคุม</label><input className="inp" value={f.driverName} onChange={e=>set("driverName",e.target.value)} /></div>
        <div><label className="k">หมวดหมู่</label><select className="inp" value={f.categoryId} onChange={e=>set("categoryId",e.target.value)}>{window.__DATA.categories.map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}</select></div>
        {!isReporter && <div><label className="k">สถานะ</label><select className="inp" value={f.status} onChange={e=>set("status",e.target.value)}>{window.__DATA.statuses.map(s=>(<option key={s.key} value={s.key}>{s.label}</option>))}</select></div>}
        {!isReporter && <div><label className="k">ค่าใช้จ่าย (บาท)</label><input className="inp" type="number" value={f.cost} onChange={e=>set("cost",e.target.value)} /></div>}
        <div><label className="k">วันที่แจ้ง</label><input className="inp" type="date" value={f.createdAt} onChange={e=>set("createdAt",e.target.value)} /></div>
        {!isReporter && <div><label className="k">ผู้แจ้ง</label><input className="inp" value={f.reporterName} onChange={e=>set("reporterName",e.target.value)} /></div>}
        {!isReporter && <div><label className="k">ผู้รับผิดชอบ</label><select className="inp" value={f.assignedId} onChange={e=>set("assignedId",e.target.value)}><option value="">— ยังไม่มอบหมาย —</option>{technicians.map(u=>(<option key={u.id} value={u.id}>{u.name} ({u.role})</option>))}</select></div>}
      </div>
      <style>{`.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-family:Kanit;font-size:13.5;background:#fff}.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1)}label.k{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}`}</style>
    </Modal>
  );
}
function AssessModal({r, onClose, onSave, mode="assess"}){
  const initParts = (r.parts && r.parts.length>0)
    ? r.parts.map(p=>({name:p.name||"",qty:p.qty||1,unitPrice:p.unitPrice||0,supplier:p.supplier||"",photos:Array.isArray(p.photos)?p.photos.filter(Boolean):[]}))
    : [{name:"",qty:1,unitPrice:0,supplier:"",photos:[]}];
  const [parts,setParts] = React.useState(initParts);
  const [laborCost,setLaborCost] = React.useState(r.laborCost||"");

  const addPart = () => setParts(p=>[...p,{name:"",qty:1,unitPrice:0,supplier:"",photos:[]}]);
  const removePart = (i) => setParts(p=>p.filter((_,idx)=>idx!==i));
  const upPart = (i,k,v) => setParts(p=>{ const a=[...p]; a[i]={...a[i],[k]:v}; return a; });

  const partsTotal = parts.reduce((s,p)=>s+(Number(p.qty)||0)*(Number(p.unitPrice)||0),0);
  const total = partsTotal + (Number(laborCost)||0);
  const fmt = (n) => (Number(n)||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
  const r2 = (n) => Math.round((Number(n)||0)*100)/100;

  const inStyle = {width:"100%",padding:"7px 10px",border:"1px solid var(--line)",borderRadius:7,fontFamily:"Kanit",fontSize:13,outline:"none",background:"#fff"};

  const submit = () => {
    const cleanParts = parts.filter(p=>p.name.trim()).map(p=>({name:p.name.trim(),qty:Number(p.qty)||1,unitPrice:r2(p.unitPrice),total:r2((Number(p.qty)||1)*(Number(p.unitPrice)||0)),supplier:p.supplier.trim(),photos:(p.photos||[]).filter(Boolean).slice(0,2)}));
    onSave(r,{parts:cleanParts,laborCost:r2(laborCost),cost:r2(total)});
  };

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={mode==="edit"
        ? <><i className="fa-solid fa-list-check" style={{color:"var(--primary)",marginRight:8}}></i>แก้ไขรายการอะไหล่ · <span className="ticket-id" style={{marginLeft:4}}>{r.running}</span></>
        : <><i className="fa-solid fa-magnifying-glass-dollar" style={{color:"#8B5CF6",marginRight:8}}></i>ประเมินราคา · <span className="ticket-id" style={{marginLeft:4}}>{r.running}</span></>}
      footer={<>
        <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit}><i className="fa-solid fa-floppy-disk"></i> {mode==="edit"?"บันทึกการแก้ไข":"บันทึกการประเมิน"}</button>
      </>}>

      {/* Parts */}
      <div style={{marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{fontWeight:600,fontSize:14}}><i className="fa-solid fa-box-open" style={{color:"var(--primary)",marginRight:6}}></i>รายการอะไหล่</div>
          <button className="btn btn-ghost btn-sm" onClick={addPart}><i className="fa-solid fa-plus"></i> เพิ่มรายการ</button>
        </div>
        <div style={{border:"1px solid var(--line)",borderRadius:10,overflow:"hidden"}}>
          <div className="table-scroll">
          <table style={{width:"100%",minWidth:520,borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:"#FAFBFC"}}>
                <th style={{padding:"9px 12px",textAlign:"left",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)"}}>ชื่ออะไหล่ / รายการ</th>
                <th style={{padding:"9px 10px",textAlign:"left",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:150}}>แหล่งซื้อ</th>
                <th style={{padding:"9px 8px",textAlign:"center",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:72}}>จำนวน</th>
                <th style={{padding:"9px 10px",textAlign:"right",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:130}}>ราคา/หน่วย (฿)</th>
                <th style={{padding:"9px 12px",textAlign:"right",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:100}}>รวม (฿)</th>
                <th style={{padding:"9px 10px",textAlign:"left",fontWeight:500,color:"var(--muted)",fontSize:12,borderBottom:"1px solid var(--line)",width:120}}>รูป (สูงสุด 2)</th>
                <th style={{width:36,borderBottom:"1px solid var(--line)"}}></th>
              </tr>
            </thead>
            <tbody>
              {parts.map((p,i)=>(
                <tr key={i} style={{borderBottom:i<parts.length-1?"1px solid var(--line-soft)":""}}>
                  <td style={{padding:"7px 10px"}}>
                    <input value={p.name} onChange={e=>upPart(i,"name",e.target.value)} placeholder="เช่น สายพาน, น้ำมันไฮดรอลิก..." style={inStyle}/>
                  </td>
                  <td style={{padding:"7px 6px"}}>
                    <input value={p.supplier||""} onChange={e=>upPart(i,"supplier",e.target.value)} placeholder="เช่น ร้าน A, บริษัท B" style={inStyle}/>
                  </td>
                  <td style={{padding:"7px 6px"}}>
                    <input type="number" min="1" value={p.qty} onChange={e=>upPart(i,"qty",e.target.value)} style={{...inStyle,textAlign:"center"}}/>
                  </td>
                  <td style={{padding:"7px 6px"}}>
                    <input type="number" min="0" step="0.01" value={p.unitPrice} onChange={e=>upPart(i,"unitPrice",e.target.value)} style={{...inStyle,textAlign:"right"}}/>
                  </td>
                  <td style={{padding:"7px 12px",textAlign:"right",fontWeight:600,color:"var(--primary)",fontFamily:"JetBrains Mono,monospace",fontSize:12.5}}>
                    {fmt((Number(p.qty)||0)*(Number(p.unitPrice)||0))}
                  </td>
                  <td style={{padding:"7px 10px"}}>
                    <PartPhotosCell photos={p.photos} onChange={v=>upPart(i,"photos",v)} max={2} uploadContext={{running:r.running}} />
                  </td>
                  <td style={{padding:"4px 6px 4px 0"}}>
                    {parts.length>1 && <button className="ia danger" onClick={()=>removePart(i)} title="ลบ"><i className="fa-solid fa-xmark"></i></button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>{/* table-scroll */}
        </div>
      </div>

      {/* Labor cost */}
      <div style={{marginBottom:20}}>
        <div style={{fontWeight:600,fontSize:14,marginBottom:10}}><i className="fa-solid fa-person-digging" style={{color:"var(--warning)",marginRight:6}}></i>ค่าแรงช่างซ่อม</div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <input type="number" min="0" step="0.01" value={laborCost} onChange={e=>setLaborCost(e.target.value)} placeholder="0" style={{width:"100%",maxWidth:200,padding:"9px 12px",border:"1px solid var(--line)",borderRadius:10,fontFamily:"Kanit",fontSize:14,outline:"none"}}/>
          <span style={{color:"var(--muted)",fontSize:13}}>บาท</span>
        </div>
      </div>

      {/* Summary */}
      <div style={{background:"linear-gradient(135deg,rgba(30,64,175,.06),rgba(139,92,246,.06))",border:"1px solid rgba(30,64,175,.18)",borderRadius:12,padding:"16px 20px"}}>
        <div style={{fontWeight:600,fontSize:14,color:"var(--primary)",marginBottom:12}}><i className="fa-solid fa-calculator" style={{marginRight:6}}></i>สรุปค่าใช้จ่าย</div>
        <div style={{display:"grid",gap:8}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}>
            <span style={{color:"var(--muted)"}}>ค่าอะไหล่รวม ({parts.filter(p=>p.name.trim()).length} รายการ)</span>
            <span style={{fontWeight:500,fontFamily:"JetBrains Mono,monospace",fontSize:12.5}}>฿{fmt(partsTotal)}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}>
            <span style={{color:"var(--muted)"}}>ค่าแรงช่างซ่อม</span>
            <span style={{fontWeight:500,fontFamily:"JetBrains Mono,monospace",fontSize:12.5}}>฿{fmt(laborCost)}</span>
          </div>
          <div style={{borderTop:"1px solid rgba(30,64,175,.2)",marginTop:4,paddingTop:10,display:"flex",justifyContent:"space-between",fontSize:17,fontWeight:700}}>
            <span>รวมทั้งสิ้น</span>
            <span style={{color:"var(--primary)"}}>฿{fmt(total)}</span>
          </div>
        </div>
      </div>
    </Modal>
  );
}

window.Repairs = Repairs;
window.RepairDetail = RepairDetail;
window.EditRepairModal = EditRepairModal;
window.AssessModal = AssessModal;
</script>

<script type="text/babel">
function Users({user}){
  const [rows,setRows] = React.useState(window.__DATA.users);
  const [edit,setEdit] = React.useState(null);
  const [sigFor,setSigFor] = React.useState(null);   // ผู้ใช้ที่กำลังตั้งลายเซ็นให้
  const [q,setQ] = React.useState("");
  const filtered = rows.filter(u=>!q||(u.name.toLowerCase()+u.username).includes(q.toLowerCase()));

  const save = async (form) => {
    try{
      if(form.id){
        await window.api("updateUser",{id:form.id, patch:form});
        const upd = rows.map(x=>x.id===form.id?form:x);
        setRows(upd); window.__DATA.users = upd;
        try{
          const cur = JSON.parse(localStorage.getItem("rms_user")||"null");
          if(cur && cur.id===form.id){
            localStorage.setItem("rms_user", JSON.stringify(form));
            Swal.fire({icon:"info",title:"อัปเดตสิทธิ์แล้ว",text:"กำลังโหลดหน้าใหม่เพื่อใช้สิทธิ์ล่าสุด",timer:1500,showConfirmButton:false}).then(()=>location.reload());
            return;
          }
        }catch(e){}
      } else {
        const nu = await window.api("createUser",{user:form});
        const upd = [...rows, nu]; setRows(upd); window.__DATA.users = upd;
      }
      setEdit(null);
      Swal.fire({icon:"success",title:"บันทึกสำเร็จ",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const del = async (u) => {
    const done = await window.deleteWithApproval({
      user, action:"deleteUser", payload:{id:u.id},
      entityLabel:"ผู้ใช้งาน", targetName:u.name,
      targetInfo:`${u.username||"-"} · ${u.role||"-"} · ${u.dept||"-"}`,
    });
    if(done){ const upd = rows.filter(x=>x.id!==u.id); setRows(upd); window.__DATA.users = upd; }
  };

  const [revealedPw,setRevealedPw] = React.useState({});
  const togglePw = async (u) => {
    if(revealedPw[u.id]!==undefined){ setRevealedPw(p=>{const n={...p};delete n[u.id];return n;}); return; }
    try{
      const {password} = await window.api("getUserPassword",{id:u.id});
      setRevealedPw(p=>({...p,[u.id]:password}));
    }catch(err){ Swal.fire({icon:"error",title:"ไม่สำเร็จ",text:err.message}); }
  };

  const roleColors = {Admin:"#1E40AF",Officer:"#8B5CF6",Technician:"#F59E0B",Engineer:"#06B6D4","Safety Officer":"#DB2777",Reporter:"#10B981",Director:"#EF4444"};

  const renderProjectAccess = (u) => {
    const hasAll = ["Admin","Director"].includes(u.role) || !Array.isArray(u.projects) || u.projects.length===0;
    if(hasAll) return <span className="badge" style={{background:"rgba(30,64,175,.1)",color:"#1E40AF",fontSize:11.5}}><i className="fa-solid fa-globe" style={{marginRight:4}}></i>ทุกโครงการ</span>;
    if(u.projects.length<=2) return <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{u.projects.map(p=>(<span key={p} className="badge" style={{background:"var(--line-soft)",color:"var(--text)",fontSize:11.5}}>{p}</span>))}</div>;
    return <span className="badge" style={{background:"var(--line-soft)",color:"var(--text)",fontSize:11.5}} title={u.projects.join(", ")}><i className="fa-solid fa-folder" style={{marginRight:4}}></i>{u.projects.length} โครงการ</span>;
  };

  return (
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหาชื่อ หรือ username..." value={q} onChange={e=>setQ(e.target.value)} /></div>
        <div className="spacer"></div>
        <button className="btn btn-primary" onClick={()=>setEdit({username:"",password:"",name:"",role:"Reporter",dept:"",email:"",projects:[]})}><i className="fa-solid fa-plus"></i> เพิ่มผู้ใช้งาน</button>
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr><th>Username</th><th>ชื่อ-นามสกุล</th><th className="hide-on-mobile">ตำแหน่ง</th><th className="hide-on-mobile">หน่วยงาน</th><th className="hide-on-mobile">สิทธิ์เข้าถึงโครงการ</th><th className="hide-on-mobile">อีเมล</th>{user.role==="Admin"&&<th>รหัสผ่าน</th>}<th>จัดการ</th></tr></thead>
          <tbody>
            {filtered.map(u=>(
              <tr key={u.id}>
                <td><span className="mono" style={{background:"var(--line-soft)",padding:"2px 7px",borderRadius:6,fontSize:12.5}}>{u.username}</span></td>
                <td><Avatar name={u.name}/>{u.name}</td>
                <td className="hide-on-mobile"><span className="badge" style={{background:roleColors[u.role]+"22",color:roleColors[u.role]}}><span className="dot"></span>{u.role}</span></td>
                <td className="hide-on-mobile">{u.dept}</td>
                <td className="hide-on-mobile">{renderProjectAccess(u)}</td>
                <td className="hide-on-mobile" style={{color:"var(--muted)",fontSize:13}}>{u.email}</td>
                {user.role==="Admin"&&<td><div style={{display:"flex",alignItems:"center",gap:6,minWidth:100}}>
                  <span className="mono" style={{fontSize:12.5,letterSpacing:revealedPw[u.id]!==undefined?".01em":".1em"}}>
                    {revealedPw[u.id]!==undefined ? revealedPw[u.id] : "••••••"}
                  </span>
                  <button className="ia" title={revealedPw[u.id]!==undefined?"ซ่อน":"แสดงรหัสผ่าน"} onClick={()=>togglePw(u)} style={{color:revealedPw[u.id]!==undefined?"var(--primary)":"var(--muted)"}}>
                    <i className={`fa-solid ${revealedPw[u.id]!==undefined?"fa-eye-slash":"fa-eye"}`}></i>
                  </button>
                </div></td>}
                <td><div className="row-actions"><button className="ia" title="ลายเซ็น (เพิ่ม / เปลี่ยน / ลบ)" style={{color:"#0B1F5C"}} onClick={()=>setSigFor(u)}><i className="fa-solid fa-signature"></i></button><button className="ia" title="แก้ไข" onClick={()=>setEdit({...u,projects:Array.isArray(u.projects)?u.projects:[]})}><i className="fa-solid fa-pen"></i></button><button className="ia danger" title="ลบ" onClick={()=>del(u)}><i className="fa-solid fa-trash"></i></button></div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {edit && <UserForm init={edit} onClose={()=>setEdit(null)} onSave={save}/>}
      {sigFor && <Modal open={true} onClose={()=>setSigFor(null)} title={<><i className="fa-solid fa-signature" style={{color:"var(--primary)",marginRight:8}}></i>ลายเซ็น · {sigFor.name}</>}
        footer={<button className="btn btn-ghost" onClick={()=>setSigFor(null)}>ปิด</button>}>
        <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:10,lineHeight:1.6}}>
          ลายเซ็นนี้จะขึ้นบนเอกสารที่ <b>{sigFor.name}</b> เป็นผู้ลงชื่อ (ใบแจ้งซ่อม ใบขอเบิก ใบส่งของ) — เซ็นในกรอบ หรืออัปโหลดรูปลายเซ็นบนกระดาษขาว
        </div>
        <SignatureSettings user={user} target={sigFor}/>
      </Modal>}
    </div>
  );
}

function UserForm({init,onClose,onSave}){
  const [f,setF] = React.useState({...init, projects: Array.isArray(init.projects)?init.projects:[]});
  const roles = ["Admin","Officer","Engineer","Safety Officer","Technician","Reporter","Director"];
  const allProjects = React.useMemo(()=>window.allProjectNames(),[]);
  // ชื่อที่ไม่มีในทะเบียนโครงการ (มีแต่บนเครื่องจักร) — ทำป้ายบอกไว้ เผื่อชื่อพิมพ์ไม่ตรงกัน
  const registryNames = React.useMemo(()=>new Set((window.__DATA.projects||[]).map(p=>p && p.name).filter(Boolean)),[]);
  const isSuperRole = ["Admin","Director"].includes(f.role);
  const isProjectLocked = (window.PROJECT_LOCKED_ROLES||[]).includes(f.role);   // ต้องเลือกโครงการเสมอ ไม่เลือก = ไม่เห็นอะไรเลย
  const toggleProject = (p) => setF(prev=>{ const cur=prev.projects||[]; return {...prev,projects:cur.includes(p)?cur.filter(x=>x!==p):[...cur,p]}; });
  const selectAll = () => setF(prev=>({...prev,projects:[...allProjects]}));
  const clearAll = () => setF(prev=>({...prev,projects:[]}));
  const submit = () => {
    if(!f.username||!f.name){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณาใส่ Username และชื่อ-นามสกุล"}); return; }
    if(isProjectLocked && !(f.projects||[]).length){

        <div className="form-field"><label>Password {init.id && <span style={{color:"var(--muted)",fontWeight:400}}>(เว้นว่างหากไม่เปลี่ยน)</span>}</label><input type="password" value={f.password} onChange={e=>setF({...f,password:e.target.value})} /></div>
        <div className="form-field full"><label>ชื่อ-นามสกุล *</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} /></div>
        <div className="form-field"><label>ตำแหน่ง/บทบาท</label><select value={f.role} onChange={e=>setF({...f,role:e.target.value})}>{roles.map(r=>(<option key={r} value={r}>{r}</option>))}</select></div>
        <div className="form-field"><label>หน่วยงาน</label><input value={f.dept} onChange={e=>setF({...f,dept:e.target.value})} /></div>
        <div className="form-field full"><label>อีเมล</label><input value={f.email} onChange={e=>setF({...f,email:e.target.value})} /></div>
        <div className="form-field full">
          <label style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <span><i className="fa-solid fa-folder-tree" style={{color:"var(--primary)",marginRight:6}}></i>สิทธิ์เข้าถึงโครงการ</span>
            {!isSuperRole && <span style={{fontWeight:400,fontSize:12,color:isProjectLocked&&!f.projects?.length?"#B91C1C":"var(--muted)"}}>{f.projects?.length?`เลือกแล้ว ${f.projects.length}/${allProjects.length}`:(isProjectLocked?`ยังไม่เลือก = ไม่เห็นข้อมูลเลย`:`ไม่เลือก = เห็นทุกโครงการ`)}</span>}
          </label>
          {isSuperRole ? (
            <div style={{padding:14,background:"rgba(30,64,175,.06)",border:"1px solid rgba(30,64,175,.2)",borderRadius:10,fontSize:13,color:"var(--primary)"}}>
              <i className="fa-solid fa-shield-halved" style={{marginRight:8}}></i>บทบาท <strong>{f.role}</strong> เห็นข้อมูลได้ทุกโครงการโดยอัตโนมัติ
            </div>
          ) : (
            <>
              <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                <button type="button" className="btn btn-ghost btn-sm" onClick={selectAll}><i className="fa-solid fa-check-double"></i> เลือกทั้งหมด</button>
                <button type="button" className="btn btn-ghost btn-sm" onClick={clearAll}><i className="fa-solid fa-xmark"></i> ยกเลิกทั้งหมด</button>
                <div style={{flex:1}}></div>
                <div style={{fontSize:11.5,color:isProjectLocked?"#B45309":"var(--muted)",alignSelf:"center"}}>
                  {isProjectLocked
                    ? <><i className="fa-solid fa-lock" style={{marginRight:5}}></i>บทบาท {f.role} ถูกล็อกโครงการ — ต้องเลือกอย่างน้อย 1 โครงการ</>
                    : "ไม่เลือกเลย = เห็นทุกโครงการ"}
                </div>
              </div>
              {allProjects.length===0 ? (
                <div style={{padding:14,background:"var(--bg)",border:"1px dashed var(--line)",borderRadius:10,fontSize:13,color:"var(--muted)",textAlign:"center"}}><i className="fa-solid fa-circle-info"></i> ยังไม่มีโครงการในระบบ</div>
              ) : (
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:8,padding:12,background:"var(--bg)",border:"1px solid var(--line)",borderRadius:10,maxHeight:260,overflowY:"auto"}}>
                  {allProjects.map(p=>{
                    const on = (f.projects||[]).includes(p);
                    return (
                      <label key={p} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:8,cursor:"pointer",background:on?"rgba(30,64,175,.08)":"#fff",border:`1px solid ${on?"rgba(30,64,175,.4)":"var(--line)"}`,fontSize:13,transition:"all .15s"}}>
                        <input type="checkbox" checked={on} onChange={()=>toggleProject(p)} style={{margin:0,cursor:"pointer",accentColor:"var(--primary)",width:16,height:16}} />
                        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p}</span>
                        {!registryNames.has(p) && (
                          <span title="ชื่อนี้มีแต่บนข้อมูลเครื่องจักร ยังไม่มีในทะเบียนโครงการ"
                                style={{fontSize:10,color:"#B45309",background:"#FEF3C7",borderRadius:5,padding:"1px 5px",whiteSpace:"nowrap"}}>
                            ไม่มีในทะเบียน
                          </span>
                        )}
                      </label>
                    );
                  })}
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </Modal>
  );
}
window.Users = Users;
</script>

<script type="text/babel">
function gdriveThumb(url, sz=600){
  if(!url) return null;
  let m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(!m) m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(!m) return null;
  return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${sz}`;
}

// โฟลเดอร์ Google Drive ปลายทางสำหรับเก็บรูปใบแจ้งซ่อม
window.REPAIR_PHOTOS_FOLDER = "https://drive.google.com/drive/folders/1pKk6d1dGdw1637D2ZjbZiHF9hdBbpy_5?usp=sharing";

// แปลงไฟล์รูปเป็น payload base64 สำหรับส่งขึ้น Drive — ย่อขนาดรูปฝั่ง client ก่อนเพื่อความเร็ว
window.fileToDrivePayload = async function(file, {maxDim=1600, quality=0.85}={}){
  const isImg = /^image\//.test(file.type||"");
  const readBase64 = ()=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const d=String(r.result||""); res(d.includes(",")?d.split(",").pop():d); }; r.onerror=()=>rej(r.error||new Error("อ่านไฟล์ไม่สำเร็จ")); r.readAsDataURL(file); });
  if(!isImg || typeof document==="undefined"){
    return { name:file.name, mimeType:file.type||"application/octet-stream", data: await readBase64() };
  }
  try{
    const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result||"")); r.onerror=()=>rej(r.error); r.readAsDataURL(file); });
    const img = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("โหลดรูปไม่ได้")); im.src=dataUrl; });
    const scale = Math.min(1, maxDim/Math.max(img.width,img.height));
    const cw=Math.max(1,Math.round(img.width*scale)), ch=Math.max(1,Math.round(img.height*scale));
    const canvas=document.createElement("canvas"); canvas.width=cw; canvas.height=ch;
    canvas.getContext("2d").drawImage(img,0,0,cw,ch);
    const out=canvas.toDataURL("image/jpeg",quality);
    const base=(file.name||"photo").replace(/\.[^.]+$/,"")+".jpg";
    return { name:base, mimeType:"image/jpeg", data: out.split(",").pop() };
  }catch(e){
    // ย่อไม่สำเร็จ (เช่น HEIC) → ส่งไฟล์ดิบ
    return { name:file.name, mimeType:file.type||"application/octet-stream", data: await readBase64() };
  }
};

// อัปโหลดรูปหนึ่งไฟล์ไป Drive ผ่าน Apps Script แล้วคืน { url, shared }
// shared=false = ไฟล์ขึ้น Drive แล้วแต่แชร์รายไฟล์ไม่ได้ (ต้องตั้งโฟลเดอร์เป็นสาธารณะแทน)
window.uploadPhotoToDrive = async function(action, context, file){
  const upload = await window.fileToDrivePayload(file);
  const saved = await window.api(action, {...(context||{}), upload});
  return { url: saved && saved.url, shared: !(saved && saved.sharing && saved.sharing.ok===false) };
};

// ดึง file id จากลิงก์ Google Drive
function gdriveId(url){
  if(!url) return null;
  let m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/) || String(url).match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

// รูปย่อหนึ่งช่อง — placeholder อยู่ข้างหลัง · ถ้า thumbnail โหลดไม่ได้ ลองแหล่งสำรอง (lh3) ก่อนซ่อน
function PhotoThumb({url,size=96,onRemove,index}){
  const id = gdriveId(url);
  const thumb = id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${Math.max(200,Math.round(size*2))}` : null;
  const alt = id ? `https://lh3.googleusercontent.com/d/${id}=w${Math.max(200,Math.round(size*2))}` : null;
  return (
    <div style={{position:"relative",width:size,height:size,borderRadius:10,overflow:"hidden",border:"1px solid var(--line)",background:"var(--bg)",flexShrink:0}}>
      <a href={url} target="_blank" rel="noreferrer" title="เปิดรูปเต็มใน Google Drive" style={{display:"block",width:"100%",height:"100%",position:"absolute",inset:0}}>
        <div style={{position:"absolute",inset:0,display:"grid",placeItems:"center",color:"#94A3B8",fontSize:22}}><i className={`fa-solid ${thumb?"fa-image":"fa-link"}`}></i></div>
        {thumb && <img src={thumb} alt="" loading="lazy" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}} onError={e=>{ if(alt && e.target.src!==alt && !e.target.dataset.tried){ e.target.dataset.tried="1"; e.target.src=alt; } else { e.target.style.display="none"; } }} />}
      </a>
      {typeof index==="number" && <span style={{position:"absolute",left:4,top:4,background:"rgba(15,23,42,.6)",color:"#fff",borderRadius:6,fontSize:11,padding:"0 6px",lineHeight:"17px"}}>{index+1}</span>}
      {onRemove && <button type="button" onClick={onRemove} title="ลบรูปนี้" style={{position:"absolute",right:4,top:4,width:22,height:22,borderRadius:"50%",border:"none",background:"rgba(220,38,38,.92)",color:"#fff",cursor:"pointer",display:"grid",placeItems:"center",fontSize:11}}><i className="fa-solid fa-xmark"></i></button>}
    </div>
  );
}

// ช่องแนบรูป — เลือกรูปจากเครื่องแล้วอัปขึ้น Google Drive โดยตรง เก็บ URL เป็น array ใน field "photos"
function PhotosField({value,onChange,max=5,disabled,uploadAction="uploadRepairPhoto",uploadContext,folder}){
  const list = Array.isArray(value) ? value : [];
  const [busy,setBusy] = React.useState(false);
  const inputRef = React.useRef(null);
  const full = list.length>=max;
  const folderLink = folder || window.REPAIR_PHOTOS_FOLDER;
  const onFiles = async (files)=>{
    const arr = Array.from(files||[]);   // ช่องเลือกไฟล์จำกัด image อยู่แล้ว ไม่กรองซ้ำเพื่อกันไฟล์หายเงียบ ๆ
    if(!arr.length) return;
    const room = max-list.length;
    if(room<=0){ Swal.fire({icon:"info",title:`แนบได้สูงสุด ${max} รูป`}); return; }
    const take = arr.slice(0,room);
    setBusy(true);
    const added=[];
    try{
      for(let i=0;i<take.length;i++){
        Swal.fire({title:`กำลังอัปโหลดรูป ${i+1}/${take.length}...`,allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
        try{ const res=await window.uploadPhotoToDrive(uploadAction, uploadContext, take[i]); if(res&&res.url){ added.push(res.url); } }
        catch(err){ Swal.close(); Swal.fire({icon:"error",title:"อัปโหลดไม่สำเร็จ",text:(err&&err.message)||String(err)}); break; }
      }
      if(added.length){ onChange([...list,...added]); }
      Swal.close();
      if(arr.length>room){ Swal.fire({icon:"info",title:`เพิ่มได้อีก ${room} รูปเท่านั้น`,timer:1900,showConfirmButton:false,toast:true,position:"top-end"}); }
      else if(added.length){ Swal.fire({icon:"success",title:`เพิ่มรูปแล้ว ${added.length} รูป`,timer:1200,showConfirmButton:false,toast:true,position:"top-end"}); }
    } finally { setBusy(false); }
  };
  return (
    <div style={{display:"grid",gap:10}}>
      {list.length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
        {list.map((url,i)=><PhotoThumb key={i} url={url} index={i} onRemove={disabled?null:()=>onChange(list.filter((_,idx)=>idx!==i))} />)}
      </div>}
      {!disabled && <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <input ref={inputRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{ const fs=Array.from(e.target.files||[]); e.target.value=""; onFiles(fs); }} />
        <button type="button" className="btn btn-primary btn-sm" onClick={()=>inputRef.current&&inputRef.current.click()} disabled={full||busy}>
          {busy ? <><div className="spinner" style={{width:13,height:13,borderWidth:2}}></div> กำลังอัปโหลด...</> : <><i className="fa-solid fa-camera"></i> {full?`ครบ ${max} รูปแล้ว`:"เพิ่มรูป"}</>}
        </button>
        <span style={{fontSize:11.5,color:"var(--muted)"}}>ถ่าย/เลือกรูปจากเครื่อง อัปขึ้น Google Drive อัตโนมัติ</span>
      </div>}
      <div className="hint" style={{margin:0}}>
        แนบได้สูงสุด {max} รูป ({list.length}/{max}) · รูปถูกเก็บใน
        <a href={folderLink} target="_blank" rel="noreferrer" style={{color:"var(--primary)",marginLeft:4,fontWeight:500}}><i className="fa-brands fa-google-drive"></i> โฟลเดอร์ Drive</a>
      </div>
    </div>
  );
}

// โฟลเดอร์ Google Drive สำหรับเก็บรูปอะไหล่ (คนละโฟลเดอร์กับรูปใบแจ้งซ่อม)
window.PART_PHOTOS_FOLDER = "https://drive.google.com/drive/folders/1Br_yEp-N2kN2TQep87UuEcMyd3hf1EXW?usp=sharing";

// ช่องรูปแบบกะทัดรัดสำหรับใส่ในเซลล์ตาราง (เช่น รูปอะไหล่รายรายการ) — เลือกไฟล์แล้วอัปขึ้น Drive โดยตรง
function PartPhotosCell({photos,onChange,max=2,uploadContext}){
  const list = Array.isArray(photos) ? photos.filter(Boolean) : [];
  const [busy,setBusy] = React.useState(false);
  const inputRef = React.useRef(null);
  const onFiles = async (files)=>{
    const arr = Array.from(files||[]);
    if(!arr.length) return;
    const room = max-list.length;
    if(room<=0){ Swal.fire({icon:"info",title:`ใส่ได้สูงสุด ${max} รูป`}); return; }
    const take = arr.slice(0,room);
    setBusy(true);
    const added=[];
    try{
      for(let i=0;i<take.length;i++){
        Swal.fire({title:`กำลังอัปโหลดรูป ${i+1}/${take.length}...`,allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
        try{ const res=await window.uploadPhotoToDrive("uploadPartPhoto", uploadContext, take[i]); if(res&&res.url){ added.push(res.url); } }
        catch(err){ Swal.close(); Swal.fire({icon:"error",title:"อัปโหลดไม่สำเร็จ",text:(err&&err.message)||String(err)}); break; }
      }
      if(added.length) onChange([...list,...added]);
      Swal.close();
      if(added.length){ Swal.fire({icon:"success",title:`เพิ่มรูปแล้ว ${added.length} รูป`,timer:1000,showConfirmButton:false,toast:true,position:"top-end"}); }
    } finally { setBusy(false); }
  };
  return (
    <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
      {list.map((url,i)=><PhotoThumb key={i} url={url} size={40} onRemove={()=>onChange(list.filter((_,idx)=>idx!==i))} />)}
      <input ref={inputRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{ const fs=Array.from(e.target.files||[]); e.target.value=""; onFiles(fs); }} />
      {list.length<max && (
        <button type="button" onClick={()=>inputRef.current&&inputRef.current.click()} disabled={busy} title="เพิ่มรูปอะไหล่ (อัปขึ้น Drive)"
          style={{width:40,height:40,borderRadius:8,border:"1px dashed var(--line)",background:"var(--bg)",color:busy?"var(--primary)":"var(--muted)",cursor:busy?"default":"pointer",display:"grid",placeItems:"center",fontSize:14,flexShrink:0}}>
          {busy ? <div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> : <i className="fa-solid fa-camera"></i>}
        </button>
      )}
    </div>
  );
}

// โหลดไลบรารีสร้างไฟล์ Excel แบบ on-demand (ไม่ถ่วงตอนเปิดเว็บ)
async function ensureXLSX(){
  if(window.XLSX) return window.XLSX;
  await new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload=res; s.onerror=()=>rej(new Error("โหลดตัวสร้างไฟล์ Excel ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต"));
    document.head.appendChild(s);
  });
  return window.XLSX;
}

async function exportMachinesExcel(list){
  if(!list || list.length===0){ Swal.fire({icon:"info",title:"ไม่มีข้อมูลให้ส่งออก"}); return; }
  try{
    Swal.fire({title:"กำลังสร้างไฟล์ Excel...",allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
    const XLSX = await ensureXLSX();
    const data = list.map((m,i)=>({
      "ลำดับ": i+1,
      "รหัสเครื่องจักร": m.code||"",
      "ชื่อเครื่องจักร": m.name||"",
      "หมวดหมู่": (window.getCategory(m.categoryId)||{}).name||"",
      "ยี่ห้อ": m.brand||"",
      "รุ่น": m.model||"",
      "ปีที่ผลิต": m.year||"",
      "ขนาด": m.size||"",
      "หมายเลขเครื่อง (Serial)": m.serial||"",
      "โครงการ": m.project||"",
      "ไซต์งานย่อย": m.subSite||"",
      "สถานที่": m.location||"",
      "กรรมสิทธิ์": m.ownership||"",
      "สถานะ": m.status||"",
      "พนักงานขับ/ผู้ควบคุม": m.driverName||"",
      "ชั่วโมงใช้งาน": Number(m.hours)||0,
      "บำรุงรักษาล่าสุด": m.lastService||"",
      "วันที่ตรวจสภาพ": m.inspectionDate||"",
      "ตรวจสภาพครั้งถัดไป": m.nextInspectionDate||"",
      "ลิงก์รูปภาพ": m.drivePhoto||"",
      "ลิงก์เอกสาร 1": m.driveLink1||"",
      "ลิงก์เอกสาร 2": m.driveLink2||"",
      "ลิงก์ Part List": m.driveLinkPL||"",
      "หมายเหตุ": m.note||""
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws["!cols"] = Object.keys(data[0]).map(k=>({wch: Math.min(40, Math.max(k.length+4, ...data.map(r=>String(r[k]??"").length+2)))}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "ทะเบียนเครื่องจักร");
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    XLSX.writeFile(wb, `ทะเบียนเครื่องจักร_${stamp}.xlsx`);
    Swal.fire({icon:"success",title:`ส่งออกแล้ว ${data.length} รายการ`,timer:1500,showConfirmButton:false,toast:true,position:"top-end"});
  }catch(err){
    Swal.fire({icon:"error",title:"ส่งออกไม่สำเร็จ",text:err.message});
  }
}

// ตัวกรองแบบติ๊กเลือกหลายรายการ (ไม่ติ๊กเลย = แสดงทั้งหมด)
function CheckFilter({label,icon,options,selected,onChange,minWidth=170}){
  const [open,setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(()=>{
    if(!open) return;
    const onDown = (e)=>{ if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onEsc = (e)=>{ if(e.key==="Escape") setOpen(false); };
    document.addEventListener("mousedown",onDown);
    document.addEventListener("keydown",onEsc);
    return ()=>{ document.removeEventListener("mousedown",onDown); document.removeEventListener("keydown",onEsc); };
  },[open]);
  const toggle = (v)=>onChange(selected.includes(v)?selected.filter(x=>x!==v):[...selected,v]);
  const active = selected.length>0;
  return (
    <div ref={ref} style={{position:"relative",display:"flex"}}>
      <button type="button" onClick={()=>setOpen(o=>!o)}
        style={{flex:1,display:"flex",alignItems:"center",gap:8,padding:"9px 12px",minWidth,borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:13.5,textAlign:"left",
          border:`1px solid ${active?"var(--primary)":"var(--line)"}`,background:active?"var(--accent-soft)":"#fff",color:active?"var(--primary)":"inherit"}}>
        {icon && <i className={`fa-solid ${icon}`} style={{opacity:.7}}></i>}
        <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{label}</span>
        {active && <span style={{background:"var(--primary)",color:"#fff",borderRadius:999,fontSize:11,fontWeight:600,padding:"1px 7px"}}>{selected.length}</span>}
        <i className={`fa-solid fa-chevron-${open?"up":"down"}`} style={{fontSize:10,opacity:.6}}></i>
      </button>
      {open && (
        <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:60,minWidth:Math.max(minWidth,230),background:"#fff",border:"1px solid var(--line)",borderRadius:12,boxShadow:"0 12px 32px rgba(15,23,42,.16)",overflow:"hidden"}}>
          <div style={{display:"flex",gap:6,padding:"8px 10px",borderBottom:"1px solid var(--line)",background:"#FAFBFC"}}>
            <button type="button" onClick={()=>onChange(options.map(o=>o.value))} style={{flex:1,padding:"5px 8px",fontSize:12,fontFamily:"inherit",border:"1px solid var(--line)",borderRadius:7,background:"#fff",cursor:"pointer"}}>เลือกทั้งหมด</button>
            <button type="button" onClick={()=>onChange([])} style={{flex:1,padding:"5px 8px",fontSize:12,fontFamily:"inherit",border:"1px solid var(--line)",borderRadius:7,background:"#fff",cursor:"pointer"}}>ล้าง</button>
          </div>
          <div style={{maxHeight:280,overflowY:"auto",padding:6}}>
            {options.length===0 && <div style={{padding:"12px 10px",fontSize:12.5,color:"var(--muted)",textAlign:"center"}}>ไม่มีข้อมูล</div>}
            {options.map(o=>{
              const on = selected.includes(o.value);
              return (
                <label key={o.value} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",borderRadius:8,cursor:"pointer",fontSize:13,background:on?"var(--accent-soft)":"transparent"}}>
                  <input type="checkbox" checked={on} onChange={()=>toggle(o.value)} style={{margin:0,cursor:"pointer",accentColor:"var(--primary)",width:16,height:16}} />
                  {o.color && <span style={{width:9,height:9,borderRadius:"50%",background:o.color,flexShrink:0}}></span>}
                  {o.icon && <i className={`fa-solid ${o.icon}`} style={{color:o.color||"var(--muted)",fontSize:12,width:14}}></i>}
                  <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.label}</span>
                </label>
              );
            })}
          </div>
          <div style={{padding:"7px 12px",borderTop:"1px solid var(--line)",background:"#FAFBFC",fontSize:11,color:"var(--muted)"}}>ไม่ติ๊กเลย = แสดงทั้งหมด</div>
        </div>
      )}
    </div>
  );
}

function Machines({user}){
  const visibleRows = React.useMemo(()=>(window.filterByUserProjects(user, window.__DATA.machines, "project")),[user]);
  const [rows,setRows] = React.useState(visibleRows);
  const [q,setQ] = React.useState("");
  const [catF,setCatF] = React.useState([]);   // ติ๊กหลายหมวดหมู่ได้ — ว่าง = ทุกหมวดหมู่
  const [ownF,setOwnF] = React.useState([]);   // ติ๊กหลายกรรมสิทธิ์ได้ — ว่าง = ทุกกรรมสิทธิ์
  const [siteF,setSiteF] = React.useState([]); // ติ๊กหลายไซต์งานย่อยได้ — ว่าง = ทุกไซต์
  const [sortF,setSortF] = React.useState("none");
  const [pmOnly,setPmOnly] = React.useState(false);   // แสดงเฉพาะเครื่องที่ต้องทำ PM
  const [detail,setDetail] = React.useState(null);
  const [edit,setEdit] = React.useState(null);
  React.useEffect(()=>{ setRows(visibleRows); },[visibleRows]);

  // คำขอแก้ไขทะเบียนเครื่องจักรที่ตัวเองส่งไว้ — ใช้ขึ้นป้าย "รออนุมัติ" และดึงค่าใหม่ลงตารางหลังอนุมัติ
  const { mine: myReqs } = window.useDeleteRequests(user);
  const pendingEditIds = React.useMemo(()=>new Set(
    (myReqs||[]).filter(x=>x.kind==="edit" && x.status==="pending" && x.action==="updateMachine").map(x=>String(x.targetKey))
  ),[myReqs]);
  const decidedCount = (myReqs||[]).filter(x=>x.status!=="pending").length;
  React.useEffect(()=>{ setRows(window.filterByUserProjects(user, window.__DATA.machines, "project")); },[decidedCount]);

  // ตัวเลือกหมวดหมู่ — แสดงจำนวนเครื่องในแต่ละหมวด + ตัวเลือก "ไม่ระบุ"
  const catOptions = React.useMemo(()=>{
    const count = (id)=>rows.filter(m=>(m.categoryId||"")===id).length;
    const opts = (window.__DATA.categories||[]).map(c=>({value:c.id,label:`${c.name} (${count(c.id)})`,color:c.color,icon:c.icon}));
    const none = count("");
    if(none) opts.push({value:"__none__",label:`— ไม่ระบุ — (${none})`});
    return opts;
  },[rows]);

  // ตัวเลือกกรรมสิทธิ์ — สร้างจากค่าที่มีจริงในข้อมูล (เช่น กรรมสิทธิ์, เช่า, ยืม)
  const ownOptions = React.useMemo(()=>{
    const tally = {};
    rows.forEach(m=>{ const o=(m.ownership||"").trim()||"__none__"; tally[o]=(tally[o]||0)+1; });
    const opts = Object.keys(tally).filter(o=>o!=="__none__").sort((a,b)=>a.localeCompare(b,"th")).map(o=>({value:o,label:`${o} (${tally[o]})`}));
    if(tally.__none__) opts.push({value:"__none__",label:`— ไม่ระบุ — (${tally.__none__})`});
    return opts;
  },[rows]);

  // ตัวเลือกไซต์งานย่อย — รวมทุกโครงการที่ผู้ใช้เห็น (ชื่อซ้ำข้ามโครงการถือเป็นตัวเลือกเดียวกัน)
  const siteOptions = React.useMemo(()=>{
    const tally = {};
    rows.forEach(m=>{ const s=(m.subSite||"").trim()||"__none__"; tally[s]=(tally[s]||0)+1; });
    const opts = Object.keys(tally).filter(s=>s!=="__none__").sort((a,b)=>a.localeCompare(b,"th",{numeric:true})).map(s=>({value:s,label:`${s} (${tally[s]})`}));
    if(opts.length && tally.__none__) opts.push({value:"__none__",label:`— ไม่ระบุไซต์ — (${tally.__none__})`});
    return opts;
  },[rows]);

  const filtered = rows.filter(m=>{
    if(q){ const qq=q.toLowerCase(); const hay=[m.name,m.code,m.brand,m.model,m.year,m.serial,m.project,m.subSite].map(x=>String(x||"").toLowerCase()).join(" "); if(!hay.includes(qq)) return false; }
    if(catF.length && !catF.includes(m.categoryId||"__none__")) return false;
    if(ownF.length && !ownF.includes((m.ownership||"").trim()||"__none__")) return false;
    if(siteF.length && !siteF.includes((m.subSite||"").trim()||"__none__")) return false;
    if(pmOnly && !["overdue","soon"].includes(window.machinePmStatus(m).state)) return false;
    return true;
  });
  const pmDue = React.useMemo(()=>{
    let over=0, soon=0;
    rows.forEach(m=>{ const s=window.machinePmStatus(m).state; if(s==="overdue") over++; else if(s==="soon") soon++; });
    return {over, soon};
  },[rows]);

  if(sortF!=="none"){
    // ค่าว่างให้ไปอยู่ท้ายสุดเสมอ
    const txt = (v) => String(v??"").trim();
    const cmp = {
      ownership: (a,b)=>{ const x=txt(a.ownership),y=txt(b.ownership); if(!x!==!y) return x?-1:1; return x.localeCompare(y,"th") || txt(a.name).localeCompare(txt(b.name),"th"); },
      name:      (a,b)=>txt(a.name).localeCompare(txt(b.name),"th"),
      code:      (a,b)=>txt(a.code).localeCompare(txt(b.code),"th",{numeric:true}),
      status:    (a,b)=>txt(a.status).localeCompare(txt(b.status),"th"),
      yearDesc:  (a,b)=>{ const x=Number(a.year)||0,y=Number(b.year)||0; if(!x!==!y) return x?-1:1; return y-x; }
    }[sortF];
    if(cmp) filtered.sort(cmp);
  }

  const statusColor = (s) => ({"ใช้งาน":"#10B981","ซ่อม":"#EF4444","รอซ่อม":"#F59E0B","ส่งคืน":"#6366F1"})[s] || "#64748B";

  // rows = เครื่องจักรเฉพาะโครงการที่ผู้ใช้เห็น — ต้องแก้แคชกลางแบบทีละรายการ ห้ามเอา rows ไปทับทั้งก้อน
  const syncCache = (fn) => { window.__DATA.machines = fn(window.__DATA.machines||[]); };

  const save = async (form) => {
    try{
      if(form.id){
        // แก้ไขทะเบียนเครื่องจักรต้องผ่านการอนุมัติของ Admin (เพิ่มเครื่องใหม่ไม่ต้อง)
        if(user.role !== "Admin"){
          const before = (window.__DATA.machines||[]).find(x=>x.id===form.id) || {};
          const changes = window.diffFields(before, form, window.MACHINE_FIELD_LABELS);
          const sent = await window.requestEditApproval({
            user, action:"updateMachine", payload:{ id:form.id, patch:form },
            entityLabel:"เครื่องจักร", targetName:`${form.name||""} (${form.code||""})`.trim(), project:form.project||"",
            targetInfo:[form.brand,form.model,form.serial].filter(Boolean).join(" · "),
            changes,
          });
          if(sent) setEdit(null);
          return;
        }
        await window.api("updateMachine",{id:form.id,patch:form});
        setRows(rows.map(x=>x.id===form.id?form:x));
        syncCache(all=>all.map(x=>x.id===form.id?form:x));
      } else {
        const nu = await window.api("createMachine",{m:form});
        setRows([...rows,nu]);
        syncCache(all=>[...all,nu]);
      }
      setEdit(null);
      Swal.fire({icon:"success",title:"บันทึกสำเร็จ",timer:1200,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  const remove = async (m) => {
    const done = await window.deleteWithApproval({
      user, action:"deleteMachine", payload:{id:m.id},
      entityLabel:"เครื่องจักร", targetName:`${m.name} (${m.code})`, project:m.project||"",
      targetInfo:[m.brand,m.model,m.serial].filter(Boolean).join(" · "),
    });
    if(done){ setRows(rows.filter(x=>x.id!==m.id)); setDetail(null); }   // applyDeleteLocally จัดการแคชกลางให้แล้ว
  };

  const handleTransfer = async (machine, {toProject, toSubSite, note, moveDate}) => {
    // ไซต์งานย่อยผูกกับโครงการ — ย้ายโครงการแล้วต้องเปลี่ยนตาม (ไม่เลือก = ทั้งโครงการ)
    // when = วันที่ย้ายที่ผู้ใช้ระบุ (ย้อนหลังได้) · recordedAt = เวลาที่กดบันทึกจริง
    const now = new Date();
    const when = moveDate ? new Date(moveDate + "T" + String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0") + ":00") : now;
    const entry = {from:machine.project||"ไม่ระบุ", to:toProject, fromSubSite:machine.subSite||"", toSubSite:toSubSite||"",
                   when:when.toISOString(), recordedAt:now.toISOString(), by:user.name, note:note||""};
    const transferHistory = [...(machine.transferHistory||[]), entry];
    const patch = {project:toProject, subSite:toSubSite||"", transferHistory};
    try{
      await window.api("updateMachine",{id:machine.id, patch});
      const updated = {...machine, ...patch};
      setRows(rows.map(x=>x.id===machine.id?updated:x));
      syncCache(all=>all.map(x=>x.id===machine.id?updated:x));
      setDetail(updated);
      Swal.fire({icon:"success",title:"ย้ายโครงการสำเร็จ",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }
  };

  return (
    <>
    <div className="card" style={{marginBottom:18}}>
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i><input placeholder="ค้นหา ชื่อ / รหัส / ยี่ห้อ / ซีเรียล / โครงการ..." value={q} onChange={e=>setQ(e.target.value)} /></div>
        <CheckFilter label="ทุกหมวดหมู่" icon="fa-layer-group" selected={catF} onChange={setCatF} options={catOptions} />
        <CheckFilter label="ทุกกรรมสิทธิ์" icon="fa-handshake" selected={ownF} onChange={setOwnF} options={ownOptions} />
        {siteOptions.length>0 && <CheckFilter label="ทุกไซต์งานย่อย" icon="fa-sitemap" selected={siteF} onChange={setSiteF} options={siteOptions} />}
        <select value={sortF} onChange={e=>setSortF(e.target.value)} title="เรียงลำดับ">
          <option value="none">เรียง: ค่าเริ่มต้น</option>
          <option value="ownership">เรียง: กรรมสิทธิ์</option>
          <option value="name">เรียง: ชื่อเครื่องจักร</option>
          <option value="code">เรียง: รหัสเครื่องจักร</option>
          <option value="status">เรียง: สถานะ</option>
          <option value="yearDesc">เรียง: ปีที่ผลิต (ใหม่→เก่า)</option>
        </select>
        <div className="spacer"></div>
        <button className="btn btn-ghost" onClick={()=>exportMachinesExcel(filtered)} title="ส่งออกข้อมูลที่แสดงอยู่เป็นไฟล์ Excel">
          <i className="fa-solid fa-file-excel" style={{color:"#1D6F42"}}></i> ส่งออก Excel
        </button>
        {["Admin","Officer","Engineer"].includes(window.effectiveRole(user)) && (
          <button className="btn btn-primary" onClick={()=>setEdit({mode:"create",m:{id:"",project:"",subSite:"",code:"",name:"",brand:"",model:"",year:"",size:"",serial:"",ownership:"",categoryId:"",note:"",status:"ใช้งาน",location:"",lastService:window.__DATA.fmtDate(new Date()),hours:0,icon:"fa-gears",driverName:"",drivePhoto:"",photos:[],pmEveryDays:"",pmEveryHours:"",lastPmDate:"",lastPmHours:"",driveLink1:"",driveLink2:"",driveLinkPL:"",inspectionDate:"",nextInspectionDate:""}})}>
            <i className="fa-solid fa-plus"></i> เพิ่มเครื่องจักร
          </button>
        )}
      </div>
    </div>
    {(pmDue.over+pmDue.soon>0 || pmOnly) && (
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",padding:"11px 16px",marginBottom:16,borderRadius:12,
                   background:pmDue.over?"#FEF2F2":"#FFFBEB",border:`1px solid ${pmDue.over?"#FECACA":"#FDE68A"}`}}>
        <i className="fa-solid fa-calendar-days" style={{fontSize:20,color:pmDue.over?"#DC2626":"#D97706"}}></i>
        <div style={{flex:1,minWidth:200,fontSize:13.5}}>
          <b>แจ้งเตือน PM</b> ·{" "}
          {pmDue.over>0 && <span style={{color:"#B91C1C",fontWeight:600}}>เกินกำหนด {pmDue.over} เครื่อง</span>}
          {pmDue.over>0 && pmDue.soon>0 && " · "}
          {pmDue.soon>0 && <span style={{color:"#B45309",fontWeight:600}}>ใกล้ถึงกำหนด {pmDue.soon} เครื่อง</span>}
          {pmDue.over+pmDue.soon===0 && <span style={{color:"var(--muted)"}}>ไม่มีเครื่องที่ต้องทำ PM แล้ว</span>}
        </div>
        <button className={`btn btn-sm ${pmOnly?"btn-primary":"btn-ghost"}`} onClick={()=>setPmOnly(v=>!v)}>
          <i className={`fa-solid ${pmOnly?"fa-xmark":"fa-filter"}`}></i> {pmOnly?"แสดงทั้งหมด":"แสดงเฉพาะที่ต้องทำ PM"}
        </button>
      </div>
    )}
    <div className="machines-grid">
      {filtered.map(m=>{
        const cat = window.getCategory(m.categoryId);
        const pm = window.machinePmStatus(m);
        const photo = window.machinePhotos(m)[0];
        return (
          <div className="machine-card" key={m.id} onClick={()=>setDetail(m)}>
            <div className="machine-thumb">
              <div className="pattern"></div>
              <div className="ic"><i className={`fa-solid ${m.icon||"fa-gears"}`}></i></div>
              {photo && <img src={gdriveThumb(photo)} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"} />}
              {(pm.state==="overdue"||pm.state==="soon") && <div title={pm.text} style={{position:"absolute",right:8,bottom:8,display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:999,background:pm.state==="overdue"?"#DC2626":"#F59E0B",color:"#fff",fontSize:10.5,fontWeight:600,boxShadow:"0 1px 3px rgba(0,0,0,.25)"}}><i className="fa-solid fa-wrench"></i> {pm.state==="overdue"?"เกินกำหนด PM":"ใกล้ถึง PM"}</div>}
              {m.categoryId && <div className="drive-tag" style={{background:cat.color,color:"#fff"}}><i className={`fa-solid ${cat.icon}`}></i> {cat.name}</div>}
              {pendingEditIds.has(String(m.id)) && <div style={{position:"absolute",left:8,bottom:8,display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:999,background:"#FEF3C7",color:"#B45309",fontSize:10.5,fontWeight:600}} title="ส่งคำขอแก้ไขแล้ว รอผู้ดูแลระบบอนุมัติ"><i className="fa-solid fa-hourglass-half"></i> รออนุมัติแก้ไข</div>}
              <div className="status-dot" style={{background:statusColor(m.status)}}><span style={{width:5,height:5,borderRadius:"50%",background:"#fff"}}></span>{m.status}</div>
            </div>
            <div className="machine-info">
              <div className="n">{m.name}</div>
              <div className="m">{m.code}{m.brand?` · ${m.brand}`:""}{m.model?` ${m.model}`:""}</div>
              {m.serial && <div className="m mono" style={{fontSize:11,marginTop:1,opacity:.75}}>{m.serial}</div>}
              <div className="meta"><span><i className="fa-solid fa-diagram-project"></i> <ProjectLabel name={m.project}/></span>{m.subSite&&<span><i className="fa-solid fa-sitemap"></i> {m.subSite}</span>}{m.ownership&&<span><i className="fa-solid fa-handshake"></i> {m.ownership}</span>}</div>
            </div>
          </div>
        );
      })}
      {filtered.length===0 && (<div style={{gridColumn:"1/-1"}} className="card"><div className="empty"><i className="fa-solid fa-industry"></i><div className="t">ยังไม่มีเครื่องจักรในระบบ</div><div>{["Admin","Officer","Engineer"].includes(window.effectiveRole(user))?"กดปุ่ม 'เพิ่มเครื่องจักร' ด้านบนเพื่อเริ่มต้น":"รอผู้ดูแลระบบเพิ่มข้อมูล"}</div></div></div>)}
    </div>
    {detail && <MachineDetail m={detail} user={user} onClose={()=>setDetail(null)} onEdit={()=>{setEdit({mode:"edit",m:detail});setDetail(null);}} onDelete={()=>remove(detail)} onTransfer={(payload)=>handleTransfer(detail,payload)} onPatchMachine={async (patch, localOnly)=>{ try{ if(!localOnly) await window.api("updateMachine",{id:detail.id,patch}); const updated={...detail,...patch}; setRows(rows.map(x=>x.id===detail.id?updated:x)); syncCache(all=>all.map(x=>x.id===detail.id?updated:x)); setDetail(updated); }catch(err){ Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message}); }}} />}
    {edit && <MachineForm initial={edit.m} mode={edit.mode} user={user} onClose={()=>setEdit(null)} onSave={save} />}
    </>
  );
}

function MachineForm({initial,mode,user,onClose,onSave}){
  const [f,setF] = React.useState(initial);
  const [busy,setBusy] = React.useState(false);
  const projects = React.useMemo(()=>window.visibleProjects(user),[user]);
  const up = (k,v) => setF(p=>({...p,[k]:v}));

  const submit = async (e) => {
    e?.preventDefault();
    if(!f.code?.trim()||!f.name?.trim()){ Swal.fire({icon:"warning",title:"กรอกข้อมูลไม่ครบ",text:"กรุณากรอก รหัสเครื่องจักร และ ชื่อเครื่องจักร"}); return; }
    setBusy(true);
    const num = v => (v===""||v==null) ? "" : (Number(v)||0);
    try{ await onSave({...f,hours:Number(f.hours)||0,photos:window.machinePhotos(f),drivePhoto:window.machinePhotos(f)[0]||"",
      pmEveryDays:num(f.pmEveryDays),pmEveryHours:num(f.pmEveryHours),lastPmHours:num(f.lastPmHours),lastPmDate:f.lastPmDate||""}); } finally { setBusy(false); }
  };

  const icons = ["fa-solid fa-tractor","fa-industry","fa-wind","fa-droplet","fa-snowflake","fa-bolt","fa-truck","fa-boxes-packing","fa-fan","fa-plug","fa-screwdriver-wrench","fa-gauge","fa-tractor","fa-helmet-safety"];

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className={`fa-solid ${mode==="edit"?"fa-pen-to-square":"fa-plus"}`} style={{marginRight:8,color:"var(--primary)"}}></i>{mode==="edit"?"แก้ไขเครื่องจักร":"เพิ่มเครื่องจักรใหม่"}</>}
      footer={<><button className="btn btn-ghost" onClick={onClose} disabled={busy}>ยกเลิก</button><button className="btn btn-primary" onClick={submit} disabled={busy}>{busy?<><div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> กำลังบันทึก...</>:<><i className="fa-solid fa-floppy-disk"></i> บันทึก</>}</button></>}>
      <form onSubmit={submit}>
        <div className="form-grid">
          <div className="form-field">
            <label>โครงการ</label>
            {projects.length===0 ? (
              <div style={{padding:"10px 12px",borderRadius:8,border:"1px dashed var(--line)",background:"#FFFBEB",fontSize:13,color:"#92400E"}}>
                <i className="fa-solid fa-triangle-exclamation" style={{marginRight:6}}></i>
                ยังไม่มีโครงการในระบบ — กรุณาเพิ่มโครงการในเมนู <strong>โครงการ</strong> ก่อน
              </div>
            ) : (
              <>
                <select value={f.project||""} onChange={e=>setF(p=>({...p,project:e.target.value,subSite:""}))}>
                  <option value="">— เลือกโครงการ —</option>
                  {projects.map(p=>(<option key={p.id} value={p.name}>{p.code ? `[${p.code}] ` : ""}{p.name}</option>))}
                </select>
                {f.project && (()=>{
                  const proj = projects.find(p=>p.name===f.project);
                  return proj ? (
                    <div style={{marginTop:6,display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:999,background:(proj.color||"#3B82F6")+"22",color:proj.color||"#3B82F6",fontSize:12,fontWeight:500}}>
                      <span style={{width:8,height:8,borderRadius:"50%",background:proj.color||"#3B82F6"}}></span>
                      {proj.code && <span className="mono">{proj.code}</span>}
                      {proj.name}
                    </div>
                  ) : null;
                })()}
              </>
            )}
          </div>
          <SubSiteField project={f.project} value={f.subSite} onChange={v=>up("subSite",v)} showWhenEmpty
            hint="ไซต์งานย่อยที่เครื่องจักรนี้ประจำอยู่ · เปลี่ยนโครงการแล้วต้องเลือกใหม่" />
          <div className="form-field"><label>รหัสเครื่องจักร *</label><input value={f.code||""} onChange={e=>up("code",e.target.value)} placeholder="เช่น XCMG-001" /></div>
          <div className="form-field" style={{gridColumn:"1/-1"}}><label>เครื่องจักร (ชื่อ) *</label><input value={f.name||""} onChange={e=>up("name",e.target.value)} placeholder="เช่น Drilling Rig, เครื่องกลึง CNC" /></div>
          <div className="form-field"><label>ยี่ห้อ</label><input value={f.brand||""} onChange={e=>up("brand",e.target.value)} placeholder="เช่น XCMG, Komatsu, HITACHI" /></div>
          <div className="form-field"><label>รุ่น</label><input value={f.model||""} onChange={e=>up("model",e.target.value)} placeholder="เช่น XR220D" /></div>
          <div className="form-field"><label>ปีที่ผลิต</label><input type="number" min="1900" max="2200" value={f.year||""} onChange={e=>up("year",e.target.value)} placeholder="เช่น 2018" /></div>
          <div className="form-field"><label>ขนาด / ความยาว</label><input value={f.size||""} onChange={e=>up("size",e.target.value)} placeholder="เช่น 22 ตัน / 12 เมตร" /></div>
          <div className="form-field"><label>ซีเรียล</label><input className="mono" value={f.serial||""} onChange={e=>up("serial",e.target.value)} placeholder="Serial Number" /></div>
          <div className="form-field"><label>กรรมสิทธิ์/เช่า</label><input value={f.ownership||""} onChange={e=>up("ownership",e.target.value)} placeholder="กรรมสิทธิ์, เช่า, ยืม..." /></div>
          <div className="form-field"><label>หมวดหมู่</label><select value={f.categoryId||""} onChange={e=>up("categoryId",e.target.value)}><option value="">— เลือกหมวดหมู่ —</option>{(window.__DATA.categories||[]).map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}</select></div>
          <div className="form-field"><label>สถานะ</label><select value={f.status||"ใช้งาน"} onChange={e=>up("status",e.target.value)}><option value="ใช้งาน">ใช้งาน</option><option value="ซ่อม">ซ่อม</option><option value="รอซ่อม">รอซ่อม</option><option value="ส่งคืน">ส่งคืน</option></select></div>
          <div className="form-field" style={{gridColumn:"1/-1"}}><label>สถานที่ติดตั้ง</label><input value={f.location||""} onChange={e=>up("location",e.target.value)} placeholder="เช่น โรงงาน A - สายการผลิต 1" /></div>
          <div className="form-field"><label>ชั่วโมงทำงานสะสม</label><input type="number" min="0" value={f.hours||0} onChange={e=>up("hours",e.target.value)} /></div>
          <div className="form-field"><label>ซ่อมบำรุงล่าสุด</label><input type="date" value={f.lastService||""} onChange={e=>up("lastService",e.target.value)} /></div>
          <div className="form-field"><label><i className="fa-solid fa-certificate" style={{marginRight:5,color:"#7C3AED"}}></i>วันที่ตรวจสอบ (ปจ2)</label><input type="date" value={f.inspectionDate||""} onChange={e=>up("inspectionDate",e.target.value)} /></div>
          <div className="form-field"><label><i className="fa-solid fa-calendar-check" style={{marginRight:5,color:"#EF4444"}}></i>วันที่ตรวจสอบครั้งถัดไป</label><input type="date" value={f.nextInspectionDate||""} onChange={e=>up("nextInspectionDate",e.target.value)} /></div>
          <div className="form-field"><label>ชื่อพนักงานขับ / ผู้ควบคุม</label><input value={f.driverName||""} onChange={e=>up("driverName",e.target.value)} placeholder="เช่น นายสมชาย ใจดี" /></div>
          <div className="form-field" style={{gridColumn:"1/-1"}}>
            <label><i className="fa-solid fa-image" style={{marginRight:6,color:"#10B981"}}></i>รูปถ่ายเครื่องจักร <span style={{fontWeight:400,fontSize:12,color:"var(--muted)"}}>สูงสุด 3 รูป · รูปแรกจะแสดงในการ์ด</span></label>
            <PhotosField value={window.machinePhotos(f)} max={3}
              onChange={v=>setF(p=>({...p,photos:v,drivePhoto:v[0]||""}))}
              uploadAction="uploadPartPhoto" folder={window.PART_PHOTOS_FOLDER}
              uploadContext={{running:[f.code,f.name].filter(Boolean).join(" ")||"machine"}} />
          </div>
          <div className="form-field" style={{gridColumn:"1/-1",margin:0}}>
            <div style={{padding:"12px 14px",background:"#ECFEFF",border:"1px solid #A5F3FC",borderRadius:10}}>
              <div style={{fontSize:12,fontWeight:600,color:"#0E7490",marginBottom:4}}><i className="fa-solid fa-calendar-days" style={{marginRight:6}}></i>แผนบำรุงรักษา (PM)</div>
              <div style={{fontSize:11.5,color:"var(--muted)",marginBottom:10}}>ตั้งรอบเป็นวัน หรือชั่วโมงทำงาน หรือทั้งสองแบบ ระบบจะเตือนเมื่อใกล้ครบรอบ ({window.PM_SOON_DAYS} วัน / {window.PM_SOON_HOURS} ชม. ล่วงหน้า) · เว้นว่าง = ไม่เตือน</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10}}>
                <div><label style={{fontSize:12}}>ทำ PM ทุก (วัน)</label><input type="number" min="0" value={f.pmEveryDays||""} onChange={e=>up("pmEveryDays",e.target.value)} placeholder="เช่น 90" /></div>
                <div><label style={{fontSize:12}}>ทำ PM ทุก (ชั่วโมง)</label><input type="number" min="0" value={f.pmEveryHours||""} onChange={e=>up("pmEveryHours",e.target.value)} placeholder="เช่น 250" /></div>
                <div><label style={{fontSize:12}}>PM ครั้งล่าสุด</label><input type="date" value={f.lastPmDate||""} onChange={e=>up("lastPmDate",e.target.value)} /></div>
                <div><label style={{fontSize:12}}>ชั่วโมง ณ PM ล่าสุด</label><input type="number" min="0" value={f.lastPmHours||""} onChange={e=>up("lastPmHours",e.target.value)} placeholder={String(f.hours||0)} /></div>

            </div>

          <div className="form-field" style={{gridColumn:"1/-1"}}>
