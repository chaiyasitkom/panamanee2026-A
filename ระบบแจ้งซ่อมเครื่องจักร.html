    await html2pdf().set({margin:0,filename:name,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(el.firstElementChild).save();
  }finally{ el.remove(); }
};

// หน้ารายการใบส่งของทั้งหมด
function DeliveryOrders({user}){
  const canEdit = ["Admin","Officer","Engineer"].includes(window.effectiveRole(user));
  const [rows,setRows] = React.useState(()=>window.__DATA.deliveryOrders || null);
  const [err,setErr] = React.useState("");
  const [q,setQ] = React.useState("");
  const [view,setView] = React.useState(null);
  const [edit,setEdit] = React.useState(null);
  const [transferOpen,setTransferOpen] = React.useState(false);
  const [hideCancelled,setHideCancelled] = React.useState(false);

  const saveEdit = async (doc, patch) => {
    patch = { ...patch,
      senderId: window.__SIG.resolve(patch.sender, doc.sender, doc.senderId, user),
      receiverId: window.__SIG.resolve(patch.receiver, doc.receiver, doc.receiverId, user),
      approverId: patch.approver ? window.__SIG.resolve(patch.approver, doc.approver, doc.approverId, user) : "" };
    const res = await window.api("updateDeliveryOrder",{key:doc.key, patch, by:user.name, adjustStock:true});
    const upd = rows.map(x=>x.key===doc.key?{...x,...patch}:x);
    window.__DATA.deliveryOrders = upd; setRows(upd);
    window.__DATA.assetRegistry = null;   // ให้หน้าทะเบียนทรัพย์สินโหลดสต๊อกใหม่หลังปรับ
    setEdit(null);
    const warns = (res && res.warnings) || [];
    if(warns.length){
      Swal.fire({icon:"warning",title:"บันทึกแล้ว · แต่มีบางรายการที่ปรับสต๊อกไม่ได้",html:"<div style='text-align:left;font-size:13px'>"+warns.map(w=>"• "+w).join("<br/>")+"</div>",confirmButtonColor:"#1E40AF"});
    }else{
      Swal.fire({icon:"success",title:"บันทึกและปรับสต๊อกแล้ว",timer:1400,showConfirmButton:false,toast:true,position:"top-end"});
    }
  };

  const [,setSyncTick] = React.useState(0);
  React.useEffect(()=>window.__ASSETSYNC.subscribe(kind=>{
    if(kind==="orders" && window.__ASSETSYNC.orders){ setErr(""); setRows(window.__ASSETSYNC.orders); }
    setSyncTick(t=>t+1);
  }),[]);

  React.useEffect(()=>{
    if(rows) return;
    let alive = true;
    window.api("loadDeliveryOrders")
      .then(list=>{
        if(!alive) return;
        const sorted = list.slice().sort((a,b)=>String(b.when||"").localeCompare(String(a.when||"")));
        window.__DATA.deliveryOrders = sorted;
        setRows(sorted);
      })
      .catch(e=>{ if(alive) setErr(e.message||String(e)); });
    return ()=>{ alive = false; };
  },[rows]);

  const cancel = async (doc) => {
    const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const totalQty = (doc.items||[]).reduce((s,x)=>s+(Number(x.quantity)||0),0);
    const res = await Swal.fire({
      title:"ยกเลิกใบส่งของนี้?",
      html:`
        <div style="text-align:left;font-size:13.5px">
          <div>เลขที่ <b class="mono">${esc(doc.docNo||doc.key)}</b> → <b>${esc(doc.toProject||"")}</b></div>
          <div style="color:#64748B;font-size:12.5px;margin-bottom:10px">${(doc.items||[]).length} รายการ · ${totalQty.toLocaleString("th-TH")} หน่วย</div>
          <label style="display:flex;align-items:flex-start;gap:8px;padding:9px 10px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;cursor:pointer;font-size:13px">
            <input type="checkbox" id="do-restore" checked style="margin-top:3px;width:16px;height:16px;accent-color:#B45309" />
            <span>คืนทรัพย์สินกลับโครงการต้นทางด้วย<br/><span style="color:#92400E;font-size:11.5px">ไม่ติ๊ก = ยกเลิกเฉพาะเอกสาร ไม่แตะสต๊อก</span></span>
          </label>
          <div style="margin-top:10px">
            <div style="font-size:12px;color:#475569;margin-bottom:3px">เหตุผลการยกเลิก</div>
            <textarea id="do-reason" rows="2" placeholder="เช่น ออกใบผิด, ยกเลิกการส่ง..." style="width:100%;padding:7px 9px;border:1px solid #CBD5E1;border-radius:7px;font-family:Kanit;font-size:13px;resize:vertical"></textarea>
          </div>
          <div style="margin-top:8px;font-size:11.5px;color:#64748B">เอกสารจะยังอยู่ในระบบและพิมพ์ได้ แต่จะมีตรา "ยกเลิก" กำกับ</div>
        </div>`,
      icon:"warning", showCancelButton:true, confirmButtonText:"ยืนยันยกเลิกใบส่งของ", cancelButtonText:"ไม่ยกเลิก", confirmButtonColor:"#D97706", focusConfirm:false,
      preConfirm:()=>({ restoreStock: document.getElementById("do-restore").checked, reason: document.getElementById("do-reason").value.trim() })
    });
    if(!res.isConfirmed) return;
    try{
      const out = await window.api("cancelDeliveryOrder",{key:doc.key, by:user.name, reason:res.value.reason, restoreStock:res.value.restoreStock});
      const patch = {cancelled:true, cancelledAt:out.cancelledAt, cancelledBy:out.cancelledBy, cancelReason:out.cancelReason, stockRestored:out.stockRestored};
      const upd = rows.map(x=>x.key===doc.key?{...x,...patch}:x);
      window.__DATA.deliveryOrders = upd; setRows(upd);
      if(res.value.restoreStock) window.__DATA.assetRegistry = null;   // ให้หน้าทะเบียนทรัพย์สินโหลดสต๊อกใหม่
      const warns = (out && out.warnings) || [];
      const nRestored = ((out && out.restored) || []).length;
      if(warns.length){
        Swal.fire({icon:"warning",title:"ยกเลิกแล้ว · แต่มีบางรายการที่คืนสต๊อกไม่ได้",
          html:`<div style='text-align:left;font-size:13px'>${nRestored?`<div style="color:#047857;margin-bottom:6px">✓ คืนเข้าทะเบียนทรัพย์สินแล้ว ${nRestored} รายการ</div>`:""}`+warns.map(w=>"• "+w).join("<br/>")+"</div>",confirmButtonColor:"#1E40AF"});
      }else{
        Swal.fire({icon:"success",title:res.value.restoreStock?`ยกเลิกและคืนของแล้ว ${nRestored} รายการ`:"ยกเลิกเอกสารแล้ว",
          text:res.value.restoreStock?"ทะเบียนทรัพย์สินอัพเดตแล้ว":"",timer:2000,showConfirmButton:false,toast:true,position:"top-end"});
      }
    }catch(e){ Swal.fire({icon:"error",title:"ยกเลิกไม่สำเร็จ",text:e.message}); }
  };

  const remove = async (doc) => {
    if(!doc.cancelled){
      const r = await Swal.fire({icon:"info",title:"ต้องยกเลิกใบส่งของก่อน",
        html:"ใบส่งของนี้ยังมีผลกับทะเบียนทรัพย์สินอยู่ (ของยังอยู่ที่ <b>"+String(doc.toProject||"-").replace(/</g,"&lt;")+"</b>)<br/>ถ้าลบเอกสารทิ้งเลย ทะเบียนจะไม่มีที่มาของการย้าย<br/><br/>กรุณา <b>ยกเลิก</b> ใบนี้ก่อน (เลือกคืนของกลับต้นทางได้) แล้วจึงลบ",
        showCancelButton:true,confirmButtonText:"ยกเลิกใบส่งของนี้",cancelButtonText:"ปิด",confirmButtonColor:"#D97706"});
      if(r.isConfirmed) cancel(doc);
      return;
    }
    const done = await window.deleteWithApproval({
      user, action:"deleteDeliveryOrder", payload:{key:doc.key},
      entityLabel:"ใบส่งของ (DO)", targetName:doc.docNo||doc.key, project:doc.toProject||"",
      targetInfo:[doc.toProject && ("ปลายทาง: "+doc.toProject), doc.by && ("ผู้ทำรายการ: "+doc.by)].filter(Boolean).join(" · "),
      warnHtml:"ประวัติการย้ายของทรัพย์สินจะยังอยู่ · การลบไม่สามารถกู้คืนได้",
    });
    if(done){ const upd = rows.filter(x=>x.key!==doc.key); window.__DATA.deliveryOrders = upd; setRows(upd); }
  };

  if(err) return (
    <div className="card"><div className="card-body"><div className="empty">
      <i className="fa-solid fa-triangle-exclamation" style={{color:"#EF4444"}}></i>
      <div className="t">โหลดใบส่งของไม่สำเร็จ</div><div>{err}</div>
      <button className="btn btn-primary btn-sm" style={{marginTop:12}} onClick={()=>{setErr("");setRows(null);}}><i className="fa-solid fa-rotate"></i> ลองใหม่</button>
    </div></div></div>
  );
  if(!rows) return <Loading show={true} text="กำลังโหลดใบส่งของ..."/>;

  // เห็นใบส่งของได้เมื่อมีสิทธิ์ในโครงการปลายทาง หรือโครงการต้นทางของรายการใดรายการหนึ่ง
  const scoped = rows.filter(d =>
    window.userCanSeeProject(user, d.toProject) ||
    (d.items||[]).some(it => window.userCanSeeProject(user, it.from))
  );
  const cancelledCount = scoped.filter(d=>d.cancelled).length;
  const filtered = scoped.filter(d=>{
    if(hideCancelled && d.cancelled) return false;
    return !q || [d.docNo,d.toProject,d.fromProjectLabel,d.sender,d.receiver,d.note].join(" ").toLowerCase().includes(q.toLowerCase());
  });

  return (
    <>
    <div className="card">
      <div className="filters">
        <div className="search-input"><i className="fa-solid fa-magnifying-glass"></i>
          <input placeholder="ค้นหาเลขที่ / โครงการ / ผู้ส่ง / ผู้รับ..." value={q} onChange={e=>setQ(e.target.value)} />
        </div>
        {cancelledCount>0 && (
          <label style={{display:"flex",alignItems:"center",gap:7,padding:"9px 12px",border:`1px solid ${hideCancelled?"var(--primary)":"var(--line)"}`,borderRadius:10,background:hideCancelled?"var(--accent-soft)":"#fff",fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>
            <input type="checkbox" checked={hideCancelled} onChange={e=>setHideCancelled(e.target.checked)} style={{margin:0,cursor:"pointer",accentColor:"var(--primary)",width:15,height:15}} />
            ซ่อนใบที่ยกเลิก ({cancelledCount})
          </label>
        )}
        <div className="spacer"></div>
        <div style={{color:"var(--muted)",fontSize:13,alignSelf:"center"}}>{filtered.length.toLocaleString("th-TH")} / {scoped.length.toLocaleString("th-TH")} ใบ</div>
        <div style={{alignSelf:"center"}}><window.AssetSyncBadge/></div>
        {canEdit && (
          <button className="btn btn-primary" onClick={()=>setTransferOpen(true)}>
            <i className="fa-solid fa-right-left"></i> ย้ายโครงการ / ออกใบส่งของ
          </button>
        )}
      </div>
      <div className="table-wrap">
        <table className="data">

function DeliveryOrderEdit({doc,onClose,onSave}){
  const toDateStr = (d)=>{ if(!d) return ""; if(/^\d{4}-\d{2}-\d{2}/.test(String(d))) return String(d).slice(0,10); const dt=new Date(d); return isNaN(dt)?"":dt.toISOString().slice(0,10); };
  const [f,setF] = React.useState({
    docNo: doc.docNo||"",
    docDate: toDateStr(doc.docDate || doc.when),
    fromProjectLabel: doc.fromProjectLabel||"",
    toProject: doc.toProject||"",
    toSubSite: doc.toSubSite||"",
    sender: doc.sender||"",
    receiver: doc.receiver||"",
    approver: doc.approver||"",
    vehicleType: doc.vehicleType||"",
    vehiclePlate: doc.vehiclePlate||"",
    driverName: doc.driverName||"",
    note: doc.note||"",
  });
  const [items,setItems] = React.useState(()=>(doc.items||[]).map(it=>({...it})));
  const [saving,setSaving] = React.useState(false);
  const set = (k,v)=>setF(prev=>({...prev,[k]:v}));
  const setItem = (i,k,v)=>setItems(prev=>prev.map((it,idx)=>idx===i?{...it,[k]:v}:it));

  const submit = async () => {
    if(!String(f.docNo||"").trim()){ Swal.fire({icon:"warning",title:"กรุณากรอกเลขที่ใบส่งของ"}); return; }
    const patch = {
      docNo: f.docNo.trim(),
      docDate: f.docDate,
      fromProjectLabel: f.fromProjectLabel,
      toProject: f.toProject,
      toSubSite: f.toSubSite,
      sender: f.sender,
      receiver: f.receiver,
      approver: f.approver,
      vehicleType: f.vehicleType,
      vehiclePlate: f.vehiclePlate,
      driverName: f.driverName,
      note: f.note,
      items: items.map(it=>({...it, name: it.name, quantity: Number(it.quantity)||0, unit: it.unit||""})),
    };
    const changedQty = (doc.items||[]).some((oi,i)=>(Number(oi.quantity)||0)!==(Number((items[i]||{}).quantity)||0));
    if(changedQty){
      const { isConfirmed } = await Swal.fire({
        title:"ยืนยันปรับสต๊อกตามจำนวนใหม่?",
        text:"ระบบจะย้ายส่วนต่างของจำนวนระหว่างโครงการต้นทางและปลายทางให้ตรงกับใบส่งของ",
        icon:"question", showCancelButton:true, confirmButtonText:"ใช่, บันทึกและปรับสต๊อก", cancelButtonText:"ยกเลิก", confirmButtonColor:"#1E40AF"
      });
      if(!isConfirmed) return;
    }
    setSaving(true);
    try{
      await onSave(doc, patch);
    }catch(e){
      Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:e.message});
      setSaving(false);
    }
  };

  return (
    <Modal open={true} onClose={onClose} size="lg"
      title={<><i className="fa-solid fa-pen" style={{color:"var(--primary)",marginRight:8}}></i>แก้ไขใบส่งของ <span className="ticket-id" style={{marginLeft:6}}>{doc.docNo||doc.key}</span></>}
      footer={<>
        <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" onClick={submit} disabled={saving}><i className="fa-solid fa-floppy-disk"></i> {saving?"กำลังบันทึก...":"บันทึกการแก้ไข"}</button>
      </>}>
      <div className="form-grid">
        <div className="form-field"><label>เลขที่ใบส่งของ</label><input value={f.docNo} onChange={e=>set("docNo",e.target.value)} /></div>
        <div className="form-field"><label>วันที่</label><input type="date" value={f.docDate} onChange={e=>set("docDate",e.target.value)} /></div>
        <div className="form-field"><label>จากโครงการ</label><input value={f.fromProjectLabel} onChange={e=>set("fromProjectLabel",e.target.value)} placeholder="เช่น [PRJ-A1] โรงงาน A" /></div>
        <div className="form-field"><label>ไปยังโครงการ</label><input value={f.toProject} onChange={e=>set("toProject",e.target.value)} /></div>
        {(()=>{ const sites=window.projectSites(f.toProject); const legacy=f.toSubSite&&!sites.includes(f.toSubSite);
          return (sites.length||legacy) ? (
            <div className="form-field"><label>ไซต์งานย่อยปลายทาง</label>
              <select value={f.toSubSite} onChange={e=>set("toSubSite",e.target.value)}>
                <option value="">— ทั้งโครงการ (ไม่ระบุไซต์) —</option>
                {sites.map(s=><option key={s} value={s}>{s}</option>)}
                {legacy && <option value={f.toSubSite}>{f.toSubSite} (ไม่มีในโครงการแล้ว)</option>}
              </select>
              <div className="hint">แก้เฉพาะข้อความบนเอกสาร ไม่ย้ายสต๊อกทรัพย์สิน</div>
            </div>
          ) : null; })()}
        <div className="form-field"><label>ผู้จัดเตรียม (ต้นทาง / ผู้ส่ง)</label><input value={f.sender} onChange={e=>set("sender",e.target.value)} /></div>
        <div className="form-field"><label>ผู้อนุมัติ (ต้นทาง)</label><input value={f.approver} onChange={e=>set("approver",e.target.value)} /></div>

        <div className="form-field"><label>ประเภทรถขนส่ง</label><input value={f.vehicleType} onChange={e=>set("vehicleType",e.target.value)} placeholder="เช่น กระบะ, 6 ล้อ" /></div>
        <div className="form-field"><label>ทะเบียนรถ</label><input value={f.vehiclePlate} onChange={e=>set("vehiclePlate",e.target.value)} /></div>
        <div className="form-field"><label>ชื่อพนักงานขับ</label><input value={f.driverName} onChange={e=>set("driverName",e.target.value)} /></div>
        <div className="form-field full"><label>หมายเหตุ</label><textarea className="inp" rows={2} value={f.note} onChange={e=>set("note",e.target.value)} /></div>
      </div>
      <div style={{marginTop:16,fontWeight:500,fontSize:14,display:"flex",alignItems:"center",gap:8}}>
        <i className="fa-solid fa-boxes-stacked" style={{color:"var(--primary)"}}></i>รายการในใบส่งของ ({items.length})
      </div>
      <div className="hint" style={{margin:"4px 0 10px",color:"#B45309"}}><i className="fa-solid fa-triangle-exclamation" style={{marginRight:5}}></i>การแก้ "จำนวน" จะปรับสต๊อกทรัพย์สินตามส่วนต่าง (ย้ายเพิ่ม/คืนระหว่างต้นทาง-ปลายทาง) และบันทึกลงประวัติการย้าย · จับคู่ด้วยรหัสทรัพย์สิน รายการที่ไม่มีรหัสจะปรับสต๊อกให้ไม่ได้</div>
      <div className="table-wrap">
        <table className="data" style={{fontSize:13}}>
          <thead><tr><th>รหัส</th><th>รายการ</th><th style={{width:110}}>จำนวน</th><th style={{width:110}}>หน่วย</th></tr></thead>
          <tbody>
            {items.map((it,i)=>(
              <tr key={i}>
                <td style={{whiteSpace:"nowrap"}}>{it.assetCode ? <span className="ticket-id">{it.assetCode}</span> : <span style={{color:"var(--muted)",fontSize:12}}>ไม่มีรหัส</span>}</td>
                <td><input className="inp" value={it.name||""} onChange={e=>setItem(i,"name",e.target.value)} /></td>
                <td><input className="inp" type="number" min="0" value={it.quantity} onChange={e=>setItem(i,"quantity",e.target.value)} /></td>
                <td><input className="inp" value={it.unit||""} onChange={e=>setItem(i,"unit",e.target.value)} placeholder="เช่น ชิ้น" /></td>
              </tr>
            ))}
            {items.length===0 && (<tr><td colSpan="4"><div className="empty" style={{padding:20}}><div className="t" style={{fontSize:13}}>ไม่มีรายการ</div></div></td></tr>)}
          </tbody>
        </table>
      </div>
    </Modal>
  );
}

<script type="text/babel">
/* ===== ล็อกแอปด้วย PIN =====
   ตั้ง PIN แล้วเซสชันบนเครื่องนี้จะไม่หมดอายุอีกเลย (ไม่ต้องกรอก username/password ใหม่)
   เปลี่ยนจาก "เด้งออกเมื่อไม่ได้ใช้งาน 15 นาที" เป็น "ล็อกหน้าจอ แล้วปลดด้วย PIN 6 หลัก"
   แอปจะล็อกเมื่อ: สลับ/ปิดแอปทิ้งไว้เกิน 1 นาที · ไม่ได้แตะเกิน 15 นาที · กดล็อกเอง
   PIN เก็บเฉพาะในเครื่อง (localStorage) เป็นค่าแฮช SHA-256 + salt ไม่ได้ส่งขึ้น Firebase
*/
const PIN_LEN = 6;
const PIN_MAX_FAIL = 5;
const PIN_GRACE_MS = 60 * 1000;          // สลับไปแอปอื่นแป๊บเดียวแล้วกลับมา ไม่ต้องกรอก PIN ซ้ำ
const PIN_KEY = "rms_pin";
const PIN_LOCK_KEY = "rms_pin_locked";
const PIN_AWAY_KEY = "rms_pin_away_at";
const PIN_FAIL_KEY = "rms_pin_fail";
const PIN_ASK_KEY = "rms_pin_asked";

function pinRead(){
  try{ return JSON.parse(localStorage.getItem(PIN_KEY) || "null"); }catch(e){ return null; }
}
function pinSalt(){
  try{
    const a = new Uint8Array(16);
    crypto.getRandomValues(a);
    return Array.from(a).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return Date.now().toString(16) + Math.random().toString(16).slice(2); }
}
async function pinDigest(pin, salt){
  const bytes = new TextEncoder().encode(salt + ":" + pin);
  try{
    const buf = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    // เปิดผ่าน http ธรรมดา (ไม่ใช่ https/localhost) เบราว์เซอร์จะไม่ให้ใช้ crypto.subtle
    let h = 0x811c9dc5;
    for(let i=0;i<bytes.length;i++) h = Math.imul(h ^ bytes[i], 16777619) >>> 0;
    return "fnv-" + h.toString(16) + "-" + bytes.length;
  }
}

window.__PIN = {
  LEN: PIN_LEN,
  MAX_FAIL: PIN_MAX_FAIL,
  record(){ return pinRead(); },
  enabled(){ const r = pinRead(); return !!(r && r.hash); },
  async set(pin, uid){
    const salt = pinSalt();
    const hash = await pinDigest(pin, salt);
    localStorage.setItem(PIN_KEY, JSON.stringify({salt, hash, uid: uid||"", at: Date.now()}));
    this.unlock();
  },
  async verify(pin){
    const r = pinRead();
    if(!r || !r.hash) return false;
    return (await pinDigest(pin, r.salt)) === r.hash;
  },
  disable(){
    [PIN_KEY, PIN_LOCK_KEY, PIN_AWAY_KEY, PIN_FAIL_KEY].forEach(k=>{
      try{ localStorage.removeItem(k); }catch(e){}
    });
  },
  fails(){ return Number(localStorage.getItem(PIN_FAIL_KEY) || 0); },
  bumpFail(){ const n = this.fails() + 1; try{ localStorage.setItem(PIN_FAIL_KEY, String(n)); }catch(e){} return n; },
  // ล็อกเดี๋ยวนี้ ไม่มีช่วงผ่อนผัน (กดปุ่มล็อกเอง / ไม่ได้ใช้งานนานเกินกำหนด)
  lockNow(){
    if(!this.enabled()) return;
    try{ localStorage.setItem(PIN_LOCK_KEY,"1"); localStorage.setItem(PIN_AWAY_KEY,"0"); }catch(e){}
  },
  // ออกจากหน้าจอไป (ปิดแอป/สลับแอป) — กลับมาภายใน 1 นาที ยังไม่ต้องกรอก PIN
  markAway(){
    if(!this.enabled()) return;
    if(localStorage.getItem(PIN_LOCK_KEY)==="1") return;   // ล็อกค้างอยู่แล้ว อย่ารีเซ็ตเวลาให้ปลดง่ายขึ้น
    try{ localStorage.setItem(PIN_LOCK_KEY,"1"); localStorage.setItem(PIN_AWAY_KEY, String(Date.now())); }catch(e){}
  },
  isLocked(){
    if(!this.enabled()) return false;
    if(localStorage.getItem(PIN_LOCK_KEY) !== "1") return false;
    const away = Number(localStorage.getItem(PIN_AWAY_KEY) || 0);
    return !away || (Date.now() - away) > PIN_GRACE_MS;
  },
  unlock(){
    [PIN_LOCK_KEY, PIN_AWAY_KEY, PIN_FAIL_KEY].forEach(k=>{
      try{ localStorage.removeItem(k); }catch(e){}
    });
    if(window.touchActivity) window.touchActivity();
  },
  asked(){ return localStorage.getItem(PIN_ASK_KEY) === "1"; },
  markAsked(){ try{ localStorage.setItem(PIN_ASK_KEY,"1"); }catch(e){} },
  // เมนู PIN โผล่เฉพาะเครื่องมือถือ / แอปที่ติดตั้งแล้ว
  available(){ return !!(window.__pwa && (window.__pwa.isMobile() || window.__pwa.isStandalone())); },
};

// เปิดแอปขึ้นมาใหม่ทั้งที่เปิด PIN ไว้ → ถือว่าเพิ่งออกจากหน้าจอไป
// (บางครั้งแอปถูกปิดแบบ force kill จน pagehide ไม่ทำงาน ต้องกันไว้ที่นี่ด้วย)
if(window.__PIN.enabled() && localStorage.getItem(PIN_LOCK_KEY) !== "1"){
  try{
    localStorage.setItem(PIN_LOCK_KEY,"1");
    localStorage.setItem(PIN_AWAY_KEY, localStorage.getItem("rms_last_active") || "0");
  }catch(e){}
}

// ---- ช่องกรอก PIN (จุด + แป้นตัวเลข) -------------------------------------
function PinDots({count,shake}){
  return (
    <div className={`pin-dots${shake?" pin-shake":""}`}>
      {Array.from({length:PIN_LEN}).map((_,i)=><span key={i} className={`pin-dot${i<count?" on":""}`}></span>)}
    </div>
  );
}

function PinPad({onDigit,onBack,disabled}){
  return (
    <div className="pin-pad">
      {["1","2","3","4","5","6","7","8","9"].map(k=>(
        <button key={k} type="button" className="pin-key" disabled={disabled} onClick={()=>onDigit(k)}>{k}</button>
      ))}
      <span></span>
      <button type="button" className="pin-key" disabled={disabled} onClick={()=>onDigit("0")}>0</button>
      <button type="button" className="pin-key is-fn" disabled={disabled} onClick={onBack} aria-label="ลบตัวเลขล่าสุด">
        <i className="fa-solid fa-delete-left"></i>
      </button>
    </div>
  );
}

/* กรอกครบ PIN_LEN หลักแล้วเรียก onFull(pin) ให้เอง
   onFull คืน true = ผ่าน (ล้างช่องเฉยๆ) · false = ไม่ผ่าน (สั่น + ล้างช่อง) */
function usePinEntry(onFull){
  const [pin,setPin] = React.useState("");
  const [shake,setShake] = React.useState(false);
  const [busy,setBusy] = React.useState(false);
  const cb = React.useRef(onFull);
  cb.current = onFull;

  React.useEffect(()=>{
    if(pin.length !== PIN_LEN) return;
    let alive = true;
    setBusy(true);
    (async()=>{
      let ok = false;
      try{ ok = await cb.current(pin); }catch(e){ ok = false; }
      if(!alive) return;
      setBusy(false);
      setPin("");
      if(!ok){
        setShake(true);
        setTimeout(()=>setShake(false), 420);
      }
    })();
    return ()=>{ alive = false; };
  },[pin]);

  const push = (d)=> setPin(p => (p.length>=PIN_LEN ? p : p + d));
  const back = ()=> setPin(p => p.slice(0,-1));

  // เผื่อเครื่องที่มีแป้นพิมพ์ (แท็บเล็ตต่อคีย์บอร์ด / เปิดบนเดสก์ท็อป)
  React.useEffect(()=>{
    const h = (e)=>{
      if(/^[0-9]$/.test(e.key)) push(e.key);
      else if(e.key === "Backspace") back();
      else return;
      e.preventDefault();
    };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[]);

  return {pin,push,back,shake,busy,clear:()=>setPin("")};
}

// ---- จอล็อก ---------------------------------------------------------------
function PinLockScreen({user,onUnlock,onForceLogout}){
  const [msg,setMsg] = React.useState("");
  const entry = usePinEntry(async (pin)=>{
    if(await window.__PIN.verify(pin)){
      window.__PIN.unlock();
      // ปลดล็อกได้ = เข้าใช้งานครั้งใหม่ บันทึกลงประวัติล็อกอิน (ถ้าเน็ตล่มก็ไม่ขวางการใช้งาน)
      window.api("logUnlock",{user, via:"pin"}).catch(()=>{});
      onUnlock();
      return true;
    }
    const n = window.__PIN.bumpFail();
    if(n >= PIN_MAX_FAIL){
      window.__PIN.disable();
      window.clearSession();
      onForceLogout();
      Swal.fire({icon:"error",title:"กรอก PIN ผิดเกินกำหนด",
        text:`กรอกผิด ${PIN_MAX_FAIL} ครั้ง ระบบปิดการใช้ PIN และออกจากระบบแล้ว กรุณาเข้าสู่ระบบด้วยรหัสผ่านอีกครั้ง`,
        confirmButtonColor:"#1E40AF"});
      return true;
    }
    setMsg(`PIN ไม่ถูกต้อง · เหลืออีก ${PIN_MAX_FAIL - n} ครั้ง`);
    return false;
  });

  const forgot = () => {
    Swal.fire({icon:"question",title:"ลืม PIN?",
      text:"ระบบจะปิดการใช้ PIN และออกจากระบบ ให้เข้าสู่ระบบด้วยรหัสผ่านใหม่ แล้วตั้ง PIN อีกครั้งได้",
      showCancelButton:true,confirmButtonText:"ออกจากระบบ",cancelButtonText:"ยกเลิก",confirmButtonColor:"#EF4444"
    }).then(r=>{
      if(!r.isConfirmed) return;
      window.__PIN.disable();
      window.clearSession();
      onForceLogout();
    });
  };

  return (
    <div className="pin-screen pin-ui">
      <div className="pin-head">
        <div className="pin-avatar">{window.initials(user.name)}</div>
        <div>
          <div className="pin-name">{user.name}</div>
          <div className="pin-role">{user.role}{user.dept?` · ${user.dept}`:""}</div>
        </div>
        <div className="pin-title"><i className="fa-solid fa-lock"></i> กรอก PIN {PIN_LEN} หลักเพื่อเข้าใช้งาน</div>
      </div>

      <div className="pin-body">
        <PinDots count={entry.pin.length} shake={entry.shake}/>
        <div className="pin-msg">{msg}</div>
        <PinPad onDigit={entry.push} onBack={entry.back} disabled={entry.busy}/>
      </div>

      <div className="pin-foot">
        <button type="button" className="pin-link" onClick={forgot}>
          <i className="fa-solid fa-circle-question"></i> ลืม PIN — เข้าด้วยรหัสผ่าน
        </button>
        <div className="pin-note">ล็อกอินค้างไว้ได้ถาวร ไม่มีหมดอายุ · ปลดล็อกด้วย PIN เท่านั้น</div>
      </div>
    </div>
  );
}

// ---- ตั้งค่า PIN ----------------------------------------------------------
function PinSetupModal({user,onClose}){
  const on = window.__PIN.enabled();
  // menu = มี PIN อยู่แล้ว · current = ยืนยัน PIN เดิม · new = ตั้ง PIN ใหม่ · confirm = กรอกซ้ำ
  const [mode,setMode] = React.useState(on ? "menu" : "new");
  const [pending,setPending] = React.useState("");     // PIN ใหม่ที่รอกรอกยืนยัน
  const [after,setAfter] = React.useState("");         // ยืนยัน PIN เดิมเสร็จแล้วจะไปทำอะไร
  const [msg,setMsg] = React.useState("");

  const done = (title, text) => {
    Swal.fire({icon:"success",title,text,timer:2200,showConfirmButton:false});
    onClose();
  };

  const entry = usePinEntry(async (pin)=>{
    if(mode === "current"){
      if(!(await window.__PIN.verify(pin))){
        setMsg("PIN เดิมไม่ถูกต้อง");
        return false;
      }
      setMsg("");
      if(after === "off"){
        window.__PIN.disable();
        done("ปิดการใช้ PIN แล้ว","กลับไปใช้การหมดเวลาใช้งาน 15 นาทีตามเดิม");
        return true;
      }
      setMode("new");
      return true;
    }
    if(mode === "new"){
      setPending(pin);
      setMsg("");
      setMode("confirm");
      return true;
    }
    if(mode === "confirm"){
      if(pin !== pending){
        setPending("");
        setMode("new");
        setMsg("PIN ที่กรอกไม่ตรงกัน ลองตั้งใหม่อีกครั้ง");
        return false;
      }
      await window.__PIN.set(pin, user.id);
      setPending("");
      done(on ? "เปลี่ยน PIN แล้ว" : "เปิดใช้ PIN แล้ว","ตั้งแต่นี้ล็อกอินค้างไว้ได้ถาวร ปลดล็อกด้วย PIN");
      return true;
    }
    return true;
  });

  const heads = {
    current:{t:"ยืนยัน PIN เดิม", s:"กรอก PIN ที่ใช้อยู่ตอนนี้"},
    new:{t: on ? "ตั้ง PIN ใหม่" : `ตั้ง PIN ${PIN_LEN} หลัก`, s:"เลือกเลขที่จำได้ แต่คนอื่นเดาไม่ได้"},
    confirm:{t:"กรอก PIN อีกครั้ง", s:"เพื่อยืนยันว่าไม่ได้กดพลาด"},
  };
  const head = heads[mode] || heads.new;

  return (
    <Modal open={true} onClose={onClose} title="ล็อกแอปด้วย PIN">
      {mode === "menu" ? (
        <div style={{display:"grid",gap:10}}>
          <div style={{display:"flex",gap:10,alignItems:"flex-start",background:"#ECFDF5",border:"1px solid #A7F3D0",
                       borderRadius:12,padding:"12px 13px",fontSize:13,color:"#065F46"}}>
            <i className="fa-solid fa-circle-check" style={{marginTop:2}}></i>
            <span>เปิดใช้ PIN อยู่ · ล็อกอินค้างไว้ได้ถาวร ไม่มีหมดอายุ แอปจะล็อกหน้าจอเมื่อปิดแอปทิ้งไว้ หรือไม่ได้ใช้งานเกิน 15 นาที</span>
          </div>
          <button type="button" className="pin-opt" onClick={()=>{setAfter("change");setMsg("");setMode("current");}}>
            <i className="fa-solid fa-key" style={{background:"var(--accent-soft)",color:"var(--primary)"}}></i>
            <span>เปลี่ยน PIN<small>ตั้งรหัส {PIN_LEN} หลักใหม่</small></span>
          </button>
          <button type="button" className="pin-opt is-danger" onClick={()=>{setAfter("off");setMsg("");setMode("current");}}>
            <i className="fa-solid fa-lock-open" style={{background:"#FEE2E2",color:"var(--danger)"}}></i>
            <span>ปิดการใช้ PIN<small>กลับไปเด้งออกเมื่อไม่ได้ใช้งาน 15 นาที</small></span>
          </button>
        </div>
      ) : (
        <div className="pin-ui on-light">
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:15,fontWeight:500}}>{head.t}</div>
            <div style={{fontSize:12.5,color:"var(--muted)",marginTop:3}}>{head.s}</div>
          </div>
          <PinDots count={entry.pin.length} shake={entry.shake}/>
          <div className="pin-msg">{msg}</div>
          <PinPad onDigit={entry.push} onBack={entry.back} disabled={entry.busy}/>
          {mode === "new" && !on && (
            <div style={{display:"flex",gap:9,alignItems:"flex-start",marginTop:16,background:"var(--line-soft)",
                         borderRadius:11,padding:"11px 12px",fontSize:12,color:"var(--muted)",lineHeight:1.6}}>
              <i className="fa-solid fa-shield-halved" style={{marginTop:2,color:"var(--primary)"}}></i>
              <span>เปิด PIN แล้วจะไม่ถูกเด้งออกเพราะหมดเวลาอีก · PIN เก็บไว้ในเครื่องนี้เท่านั้น
                    ถ้ากรอกผิด {PIN_MAX_FAIL} ครั้งระบบจะปิด PIN และให้ล็อกอินด้วยรหัสผ่านใหม่</span>
            </div>
          )}
        </div>
      )}
    </Modal>
  );
}

window.PinLockScreen = PinLockScreen;
window.PinSetupModal = PinSetupModal;
</script>

<script type="text/babel">
/* ===== สิทธิ์การใช้งาน (ระบบการจัดการ) =====
   ตั้งได้ 2 ชั้น
     1) ตามตำแหน่ง (role) — ติ๊กว่าตำแหน่งนี้เข้าฟังก์ชันไหนได้
     2) รายบุคคล — ยกเว้นเฉพาะคน "เปิดเพิ่ม" หรือ "ปิดกั้น" ทับค่าของตำแหน่ง
   เก็บที่ /permissions ใน Firebase · ไม่ได้ตั้งไว้ = ใช้ค่าเริ่มต้นใน window.APP_FEATURES
*/
function Permissions({user}){
  const [tab,setTab] = React.useState("role");
  const [cfg,setCfg] = React.useState(()=>{
    const p = window.__DATA.permissions || {};
    return { roles:{...(p.roles||{})}, users:{...(p.users||{})} };
  });
  const [dirty,setDirty] = React.useState(false);
  const [saving,setSaving] = React.useState(false);
  const [pickUser,setPickUser] = React.useState("");

  const roles = window.APP_ROLES;
  const features = window.APP_FEATURES;
  const groups = React.useMemo(()=>[...new Set(features.map(f=>f.group))],[features]);
  const users = React.useMemo(()=>(window.__DATA.users||[]).slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"","th")),[]);

  // ---- ชั้นที่ 1: ตามตำแหน่ง ----
  const roleAllow = (role) => {
    const c = cfg.roles[role];
    return new Set(window.roleAllowList(role, c));
  };
  const setRoleAllow = (role, s) => {
    setCfg(c=>({...c, roles:{...c.roles, [role]:{set:true, allow:[...s], known:window.APP_FEATURES.map(f=>f.key)}}}));
    setDirty(true);
  };
  const toggleRole = (role, key) => {
    const s = roleAllow(role);
    if(s.has(key)) s.delete(key); else s.add(key);
    setRoleAllow(role, s);
  };
  const resetRole = (role) => {
    setCfg(c=>{ const r = {...c.roles}; delete r[role]; return {...c, roles:r}; });
    setDirty(true);
  };
  const roleTouched = (role) => !!(cfg.roles[role] && cfg.roles[role].set);
  const allOfGroup = (role, group, on) => {
    const s = roleAllow(role);
    features.filter(f=>f.group===group).forEach(f=>{ if(on) s.add(f.key); else s.delete(f.key); });
    setRoleAllow(role, s);
  };

  // ---- ชั้นที่ 2: รายบุคคล ----
  const userState = (uid,key) => {
    const c = cfg.users[uid] || {};
    if((c.allow||[]).includes(key)) return "allow";
    if((c.deny||[]).includes(key)) return "deny";
    return "role";
  };
  const setUserState = (uid,key,st) => {
    setCfg(c=>{
      const cur = c.users[uid] || {};
      const allow = new Set(cur.allow||[]);
      const deny = new Set(cur.deny||[]);
      allow.delete(key); deny.delete(key);
      if(st==="allow") allow.add(key);
      if(st==="deny") deny.add(key);
      const next = {...c.users};
      if(allow.size || deny.size) next[uid] = {allow:[...allow], deny:[...deny]};
      else delete next[uid];
      return {...c, users:next};
    });
    setDirty(true);
  };
  const clearUser = (uid) => {
    setCfg(c=>{ const u = {...c.users}; delete u[uid]; return {...c, users:u}; });
    setDirty(true);
  };
  const overrideCount = (uid) => {
    const c = cfg.users[uid] || {};
    return (c.allow||[]).length + (c.deny||[]).length;
  };

  const valid = new Set(features.map(f=>f.key));
  const save = async () => {
    setSaving(true);
    try{
      const clean = {roles:{}, users:{}};
      Object.entries(cfg.roles).forEach(([r,v])=>{
        if(!roles.includes(r)) return;
        // known = หน้าที่มีอยู่ตอนบันทึก — หน้าที่เพิ่มทีหลังจะได้ใช้ค่าเริ่มต้นของตำแหน่ง
        clean.roles[r] = { set:true, allow:window.roleAllowList(r, v).filter(k=>valid.has(k)), known:[...valid] };
      });
      Object.entries(cfg.users).forEach(([uid,v])=>{
        const allow = (v.allow||[]).filter(k=>valid.has(k));
        const deny = (v.deny||[]).filter(k=>valid.has(k));
        if(allow.length || deny.length) clean.users[uid] = {allow, deny};
      });
      await window.api("savePermissions",{cfg:clean, by:{id:user.id,name:user.name,role:user.role}});
      window.__DATA.permissions = clean;
      setDirty(false);
      const r = await Swal.fire({icon:"success",title:"บันทึกสิทธิ์แล้ว",
        text:"ผู้ใช้คนอื่นจะเห็นผลเมื่อเข้าสู่ระบบใหม่ · เครื่องนี้ควรโหลดหน้าใหม่เพื่อให้เมนูตรงกับสิทธิ์ล่าสุด",
        showCancelButton:true, confirmButtonText:"โหลดหน้าใหม่", cancelButtonText:"ไว้ทีหลัง", confirmButtonColor:"#1E40AF"});
      if(r.isConfirmed) location.reload();
    }catch(err){
      Swal.fire({icon:"error",title:"บันทึกไม่สำเร็จ",text:err.message});
    }finally{
      setSaving(false);
    }
  };

  const chk = {width:17,height:17,accentColor:"#1E40AF",cursor:"pointer"};
  const segBtn = (on) => ({padding:"7px 14px",borderRadius:7,border:"none",fontSize:13,cursor:"pointer",fontFamily:"Kanit",
    background:on?"var(--primary)":"transparent",color:on?"#fff":"var(--muted)"});

  const target = users.find(u=>u.id===pickUser) || null;
  const targetRoleSet = target ? roleAllow(target.role) : null;
  // คิดจากค่าที่กำลังแก้อยู่ในหน้านี้ (ยังไม่บันทึกก็เห็นผลทันที)
  const targetAllowed = React.useMemo(()=>{
    if(!target) return null;
    const s = new Set(targetRoleSet);
    const c = cfg.users[target.id] || {};
    (c.allow||[]).forEach(k=>s.add(k));
    (c.deny||[]).forEach(k=>s.delete(k));
    return s;
  },[target,cfg]);

  return (
    <>
      <div className="card" style={{marginBottom:14}}>
        <div className="card-h">
          <div>
            <h3><i className="fa-solid fa-user-shield" style={{color:"var(--primary)",marginRight:8}}></i>สิทธิ์เข้าถึงฟังก์ชัน</h3>
            <div className="sub">กำหนดว่าตำแหน่งไหนเข้าใช้ฟังก์ชันอะไรได้ · ยกเว้นเป็นรายคนได้ในแท็บ "รายบุคคล"</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <div style={{display:"inline-flex",background:"var(--bg)",border:"1px solid var(--line)",borderRadius:10,padding:3}}>
              <button style={segBtn(tab==="role")} onClick={()=>setTab("role")}><i className="fa-solid fa-user-tag"></i> ตามตำแหน่ง</button>
              <button style={segBtn(tab==="user")} onClick={()=>setTab("user")}><i className="fa-solid fa-user-pen"></i> รายบุคคล</button>
            </div>
            <button className="btn btn-primary" onClick={save} disabled={saving||!dirty}>
              {saving
                ? <><div className="spinner" style={{width:14,height:14,borderWidth:2}}></div> กำลังบันทึก...</>
                : <><i className="fa-solid fa-floppy-disk"></i> {dirty?"บันทึกสิทธิ์":"บันทึกแล้ว"}</>}
            </button>
          </div>
        </div>
        {dirty && (
          <div style={{margin:"0 16px 14px",display:"flex",gap:9,alignItems:"flex-start",background:"#FFFBEB",
                       border:"1px solid #FDE68A",borderRadius:10,padding:"10px 12px",fontSize:12.5,color:"#92400E"}}>
            <i className="fa-solid fa-triangle-exclamation" style={{marginTop:2}}></i>
            <span>แก้ไขแล้วยังไม่บันทึก — กด "บันทึกสิทธิ์" ก่อนออกจากหน้านี้ ไม่งั้นค่าที่แก้จะหายไป</span>
          </div>
        )}
      </div>

      {tab==="role" ? (
        <div className="card">
          <div className="card-h">
            <div>
              <h3>ตารางสิทธิ์ตามตำแหน่ง</h3>
              <div className="sub">ติ๊ก = เข้าใช้ได้ · ตำแหน่งที่ยังไม่เคยตั้งค่าจะใช้ค่าเริ่มต้นของระบบ</div>
            </div>
          </div>
          <div className="card-body">
            <div className="table-wrap">
              <table className="data">
                <thead>
                  <tr>
                    <th style={{minWidth:190}}>ฟังก์ชัน</th>
                    {roles.map(r=>(
                      <th key={r} style={{textAlign:"center",whiteSpace:"nowrap"}}>
                        {r}
                        <div style={{fontSize:10,fontWeight:400,color:"var(--muted)",marginTop:2}}>
                          {roleTouched(r)
                            ? <button onClick={()=>resetRole(r)} title="กลับไปใช้ค่าเริ่มต้นของระบบ"
                                style={{border:"none",background:"none",color:"var(--primary)",cursor:"pointer",fontSize:10,fontFamily:"Kanit",padding:0}}>
                                <i className="fa-solid fa-rotate-left"></i> คืนค่าเริ่มต้น
                              </button>
                            : "ค่าเริ่มต้น"}
                        </div>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {groups.map(g=>(
                    <React.Fragment key={g}>
                      <tr>
                        <td colSpan={roles.length+1} style={{background:"var(--line-soft)"}}>
                          <span className="group-label" style={{fontWeight:500,fontSize:12.5,color:"var(--primary)"}}>
                            <i className="fa-solid fa-layer-group" style={{marginRight:7}}></i>{g}
                          </span>
                        </td>
                      </tr>
                      {features.filter(f=>f.group===g).map(f=>(
                        <tr key={f.key}>
                          <td>
                            <div style={{display:"flex",alignItems:"center",gap:8}}>
                              <i className={`fa-solid ${f.icon}`} style={{color:"var(--muted)",width:15,textAlign:"center"}}></i>
                              <span style={{fontSize:13}}>{f.label}</span>
                            </div>
                            <div className="mono" style={{fontSize:10.5,color:"var(--muted)",marginTop:2}}>{f.key}</div>
                          </td>
                          {roles.map(r=>{

                              style={{border:"1px solid var(--line)",background:"#fff",borderRadius:5,cursor:"pointer",fontSize:10,padding:"1px 5px"}}>
                              <i className="fa-solid fa-xmark" style={{color:"var(--danger)"}}></i>

          <div className="card-body">

<script type="text/babel">
// เลือกระบบงานอย่างเดียว — เลือกแล้วเข้าใช้งานทันที ไม่มีขั้นตอนเลือกโครงการ

function WorkspacePicker({user,onContinue,onLogout}){
  const erpSystems = window.__DATA.erpSystems || [];

  const seesAll = window.userCanSeeAllProjects(user);
  const stats = {
    repairs:(window.__DATA.repairs||[]).length,
    assets:(window.__DATA.machines||[]).length,
    users:(window.__DATA.users||[]).length,
    withdrawals:(window.__DATA.withdrawals||[]).length,
  };
  const systemLine = (sys) => {
    if(sys.id==="repairs") return `${stats.repairs} ใบงาน · เชื่อม Asset ${stats.assets} รายการ`;
    if(sys.id==="assets") return `${stats.assets} รายการ · เชื่อมงานซ่อม ${stats.repairs} ใบงาน`;
    if(sys.id==="production") return `เตรียมเชื่อม Asset ${stats.assets} รายการ`;
    if(sys.id==="consume") return `เตรียมเชื่อมสต๊อก/เบิกจ่าย ${stats.withdrawals} รายการ`;
    if(sys.id==="manage") return `${stats.users} ผู้ใช้งาน · ${(window.__DATA.projects||[]).length} โครงการ`;
    if(sys.id==="pc") return `เตรียมเชื่อมผู้ใช้งาน ${stats.users} คน`;
    if(sys.id==="hr-time") return `เชื่อมข้อมูลผู้ใช้งาน ${stats.users} คน`;
    return "พร้อมเชื่อมข้อมูล";
  };

  const selectSystem = (sys) => {
    if(!window.canUseErp(user,sys)){
      if(sys.status==="ready") Swal.fire({icon:"info",title:"ไม่มีสิทธิ์เข้าใช้ระบบนี้",
        text:(sys.roles||[]).length ? `${sys.name} เปิดใช้เฉพาะ ${sys.roles.join(" / ")}` : `บัญชีของคุณยังไม่ได้รับสิทธิ์ใช้งาน ${sys.name} · แจ้งผู้ดูแลระบบให้เปิดสิทธิ์ที่ ระบบการจัดการ → สิทธิ์การใช้งาน`});
      else Swal.fire({icon:"info",title:"ระบบนี้รอพัฒนา",text:sys.name});
      return;
    }
    onContinue({erp:sys, project:"", projectLabel:""});
  };

  return (
    <div className="login-wrap">
      <div className="login-brand">
        <div className="grid-bg"></div>
        <div className="login-logo">
          <div className="mark"><i className="fa-solid fa-layer-group"></i></div>
          <div style={{lineHeight:1.3}}>
            <div>ศูนย์ระบบงาน</div>
            <div style={{fontSize:12,fontWeight:300,color:"rgba(255,255,255,.6)",marginTop:2}}>เลือกระบบงานที่จะเข้าใช้</div>
          </div>
        </div>
        <div className="login-hero">
          <h1>เลือกระบบงาน<br/>ก่อนเข้าใช้งาน</h1>
          <p>เลือกว่าจะเข้าใช้งานระบบใด กดแล้วเข้าใช้งานได้ทันที · รายการที่รอพัฒนาจะแสดงไว้เพื่อเตรียมต่อยอดในอนาคต</p>
          <div className="chips">
            <span className="chip"><i className="fa-solid fa-user-check" style={{marginRight:6}}></i>{user.name}</span>
            <span className="chip"><i className="fa-solid fa-shield-halved" style={{marginRight:6}}></i>{user.role}</span>
            <span className="chip"><i className="fa-solid fa-diagram-project" style={{marginRight:6}}></i>
              {seesAll ? "ทุกโครงการ" : `${projects.length} โครงการที่ได้รับมอบหมาย`}
            </span>
          </div>
        </div>
        <div className="login-foot">Repair Management System</div>
      </div>
      <div className="login-card-wrap">
        <form className="login-card" onSubmit={e=>e.preventDefault()}>
          <h2>เลือกระบบงาน</h2>
          <p className="sub">กดที่ระบบงานเพื่อเข้าใช้งานทันที</p>
          <div style={{display:"grid",gap:10,marginBottom:16}}>
                {erpSystems.map(s=>{
                  const ready = window.canUseErp(user,s);
                  const restricted = !ready && s.status==="ready";
                  return (
                    <button key={s.id} type="button" onClick={()=>selectSystem(s)}
                      style={{display:"flex",alignItems:"center",gap:12,textAlign:"left",padding:"13px 14px",border:"1.5px solid var(--line)",borderRadius:10,background:ready?"#fff":"#F8FAFC",color:ready?"var(--text)":"var(--muted)",opacity:ready?1:.75}}>
                      <span style={{width:38,height:38,borderRadius:10,display:"grid",placeItems:"center",background:ready?"var(--accent-soft)":"var(--line-soft)",color:ready?"var(--primary)":"var(--muted)",flex:"0 0 auto"}}>
                        <i className={`fa-solid ${s.icon}`}></i>
                      </span>
                      <span style={{flex:1,minWidth:0}}>
                        <span style={{display:"flex",alignItems:"center",gap:8,fontWeight:600}}>
                          {s.name}
                          {restricted
                            ? <span className="badge" style={{fontSize:11,background:"#E0E7FF",color:"#3730A3"}}>
                                {(s.roles||[]).length ? `เฉพาะ ${s.roles.join(" / ")}` : "ยังไม่ได้รับสิทธิ์"}
                              </span>
                            : !ready && <span className="badge" style={{fontSize:11,background:"#FEF3C7",color:"#92400E"}}>รอพัฒนา</span>}
                        </span>
                        <span style={{display:"block",fontSize:12.5,color:"var(--muted)",marginTop:2}}>{s.desc}</span>
                        <span style={{display:"block",fontSize:12,color:ready?"var(--primary)":"var(--muted)",marginTop:4}}>
                          <i className="fa-solid fa-link" style={{marginRight:5}}></i>{systemLine(s)}
                        </span>
                      </span>
                      {ready && <i className="fa-solid fa-chevron-right" style={{color:"var(--muted)"}}></i>}
                    </button>
                  );
                })}
              </div>
          {readySystems.length===0 && <div style={{fontSize:13,color:"var(--danger)",marginBottom:14}}>ยังไม่มีระบบที่พร้อมใช้งาน</div>}
          {!seesAll && projects.length===0 && (
            <div style={{fontSize:13,color:"#B45309",background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:8,padding:"10px 12px",marginBottom:14}}>
              <i className="fa-solid fa-triangle-exclamation" style={{marginRight:6}}></i>
              บัญชีนี้ยังไม่ได้รับมอบหมายโครงการ จะไม่เห็นข้อมูลใดเลย · แจ้งผู้ดูแลระบบให้กำหนดสิทธิ์โครงการก่อน
            </div>
          )}
          <button className="btn btn-ghost" type="button" onClick={onLogout} style={{width:"100%",marginTop:10}}>ออกจากระบบ</button>
        </form>
      </div>
    </div>
  );
}

// อะไหล่ที่ใช้ซ่อม — รวมอะไหล่จาก r.parts ของทุกใบแจ้งซ่อมมาสรุปในที่เดียว
function SpareParts({user}){
  const [q,setQ] = React.useState("");
  const [view,setView] = React.useState("list");   // list | grouped | machine | type
  const [closedType,setClosedType] = React.useState({});   // กลุ่มรูปแบบการซ่อมที่ย่อไว้
  const [openMc,setOpenMc] = React.useState({});   // แถวเครื่องจักรที่กางดูอะไหล่
  const [detail,setDetail] = React.useState(null);

  const machineName = (code)=>{ const m=(window.__DATA.machines||[]).find(x=>x.code===code); return m?m.name:""; };

  // แตกอะไหล่ทุกชิ้นออกมาเป็นแถว พร้อมอ้างอิงใบแจ้งซ่อม
  const rows = React.useMemo(()=>{
    const visible = window.filterByUserProjects(user, window.__DATA.repairs, "project");
    const out = [];
    visible.forEach(r=>{
      (r.parts||[]).forEach((p,idx)=>{
        if(!p || !String(p.name||"").trim()) return;
        const qty = Number(p.qty)||0, unitPrice = Number(p.unitPrice)||0;
        out.push({
          key:`${r.id}:${idx}`, repair:r, running:r.running, machineCode:r.machineCode||"", machineName:machineName(r.machineCode),
          project:r.project||"", status:r.status, createdAt:r.createdAt,
          name:String(p.name).trim(), qty, unitPrice, total:Number(p.total)|| (qty*unitPrice), supplier:String(p.supplier||"").trim(), photos:Array.isArray(p.photos)?p.photos.filter(Boolean):[],
        });
      });
    });
    return out.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  },[user]);

  const kw = q.trim().toLowerCase();
  const filtered = rows.filter(r=>!kw || [r.name,r.supplier,r.running,r.machineCode,r.machineName,r.project].some(v=>String(v||"").toLowerCase().includes(kw)));

  // รวมตามชื่ออะไหล่
  const grouped = React.useMemo(()=>{
    const map = {};
    filtered.forEach(r=>{
      const k = r.name.toLowerCase();
      if(!map[k]) map[k] = { name:r.name, qty:0, total:0, count:0, suppliers:new Set(), photos:[] };
      const g = map[k];
      g.qty += r.qty; g.total += r.total; g.count += 1;
      if(r.supplier) g.suppliers.add(r.supplier);
      r.photos.forEach(u=>{ if(g.photos.length<4) g.photos.push(u); });
    });
    return Object.values(map).map(g=>({...g,suppliers:[...g.suppliers]})).sort((a,b)=>b.total-a.total);
  },[filtered]);

  // รวมตามเครื่องจักร — ใบแจ้งซ่อมที่ไม่ได้ระบุเครื่องจักรรวมไว้กลุ่มเดียว
  const byMachine = React.useMemo(()=>{
    const map = {};
    filtered.forEach(r=>{
      const k = r.machineCode || "__none__";
      if(!map[k]) map[k] = { key:k, code:r.machineCode, name:r.machineName, projects:new Set(), repairs:new Set(), count:0, qty:0, total:0, parts:{} };
      const g = map[k];
      g.count += 1; g.qty += r.qty; g.total += r.total;
      if(r.project) g.projects.add(r.project);
      g.repairs.add(r.running);
      const pk = r.name.toLowerCase();
      if(!g.parts[pk]) g.parts[pk] = { name:r.name, qty:0, total:0, count:0, suppliers:new Set(), runnings:new Set() };
      const pp = g.parts[pk];
      pp.qty += r.qty; pp.total += r.total; pp.count += 1;
      if(r.supplier) pp.suppliers.add(r.supplier);
      pp.runnings.add(r.running);
    });
    return Object.values(map).map(g=>({
      ...g, projects:[...g.projects], repairs:[...g.repairs],
      parts:Object.values(g.parts).map(x=>({...x,suppliers:[...x.suppliers],runnings:[...x.runnings]})).sort((a,b)=>b.total-a.total),
    })).sort((a,b)=>(a.key==="__none__")-(b.key==="__none__") || b.total-a.total);
  },[filtered]);

  // รวมตามรูปแบบการซ่อม — ใช้กลุ่มเดียวกับ "สรุปอาการเสียที่พบบ่อย"
  // ดูจากชื่ออะไหล่ก่อน (เช่น "สายไฮดรอลิก") ไม่เข้ากลุ่มค่อยดูจากอาการในใบแจ้งซ่อม
  // ใต้แต่ละอะไหล่: ร้าน/แหล่งซื้อทั้งหมด พร้อมราคาล่าสุดและราคาถูกสุด — ใช้หาร้านตอนสั่งซื้อครั้งต่อไป
  const byType = React.useMemo(()=>{
    const order = window.SYMPTOM_GROUPS.map(g=>g.key);
    const pick = (hits)=>order.find(k=>hits[k]);
    const groups = {};
    [...window.SYMPTOM_GROUPS, window.SYMPTOM_OTHER].forEach(g=>{ groups[g.key] = { ...g, parts:{}, count:0, total:0 }; });
    filtered.forEach(r=>{
      const k = pick(window.classifySymptom(r.name))
        || pick(window.classifySymptom(window.getProblems(r.repair).map(p=>p.text).filter(Boolean).join(" ") || r.repair.title || ""))
        || "other";
      const g = groups[k];
      g.count++; g.total += r.total;
      const pk = r.name.toLowerCase().replace(/\s+/g," ");
      if(!g.parts[pk]) g.parts[pk] = { name:r.name, count:0, qty:0, total:0, suppliers:{}, last:null, machines:new Set() };
      const pp = g.parts[pk];
      pp.count++; pp.qty += r.qty; pp.total += r.total;
      if(r.machineCode) pp.machines.add(r.machineCode);
      const t = new Date(r.createdAt).getTime() || 0;
      if(!pp.last || t > pp.last.t) pp.last = { t, price:r.unitPrice, supplier:r.supplier, running:r.running, repair:r.repair };
      const sk = r.supplier || "— ไม่ระบุแหล่งซื้อ —";
      const sp = pp.suppliers[sk] || (pp.suppliers[sk] = { name:sk, count:0, lastT:0, lastPrice:0, minPrice:Infinity });
      sp.count++;
      if(t >= sp.lastT){ sp.lastT = t; sp.lastPrice = r.unitPrice; }
      if(r.unitPrice>0) sp.minPrice = Math.min(sp.minPrice, r.unitPrice);
    });
    return Object.values(groups).filter(g=>g.count>0).map(g=>{
      const parts = Object.values(g.parts).map(pp=>{
        const sups = Object.values(pp.suppliers).sort((a,b)=>b.lastT-a.lastT);
        const priced = sups.filter(x=>x.minPrice!==Infinity);
        const cheapest = priced.length>1 ? priced.reduce((m,x)=>x.minPrice<m.minPrice?x:m) : null;
        return { ...pp, suppliers:sups, cheapest: cheapest && cheapest.name, machines:[...pp.machines] };
      }).sort((a,b)=>b.count-a.count || b.total-a.total);
      return { ...g, parts };
    }).sort((a,b)=>(a.key==="other")-(b.key==="other") || b.total-a.total);
  },[filtered]);

  const totalQty = filtered.reduce((s,r)=>s+r.qty,0);

  const fmt = (n)=>(Number(n)||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
  const r2 = (n)=>Math.round((Number(n)||0)*100)/100;

  const exportExcel = async ()=>{
    if(!filtered.length){ Swal.fire({icon:"info",title:"ไม่มีข้อมูลให้ส่งออก"}); return; }
    try{

      const XLSX = await ensureXLSX();

      } else if(view==="machine"){

        })));
        // ชีตสรุปยอดต่อเครื่อง
        var machineSum = byMachine.map((g,i)=>({ "ลำดับ":i+1, "รหัสเครื่องจักร":g.code||"(ไม่ระบุ)", "ชื่อเครื่องจักร":g.name||"", "โครงการ":g.projects.join(", "), "จำนวนใบแจ้งซ่อม":g.repairs.length, "รายการอะไหล่":g.count, "จำนวนชิ้นรวม":g.qty, "มูลค่าอะไหล่รวม (บาท)":r2(g.total) }));

      if(view==="machine" && machineSum && machineSum.length){

        XLSX.utils.book_append_sheet(wb, ws0, "สรุปรายเครื่องจักร");

      XLSX.writeFile(wb, `อะไหล่ที่ใช้ซ่อม_${stamp}.xlsx`);
      Swal.fire({icon:"success",title:`ส่งออกแล้ว ${data.length} รายการ`,timer:1400,showConfirmButton:false,toast:true,position:"top-end"});

                          </td>
                          <td className="hide-on-mobile" style={{fontSize:12.5,whiteSpace:"nowrap"}}>
                            {pp.last && <>{window.__DATA.fmtDate(pp.last.t)}<div><span className="ticket-id" style={{cursor:"pointer",fontSize:11}} onClick={()=>setDetail(pp.last.repair)}>{pp.last.running}</span></div></>}

                    </table>

                </React.Fragment>);
              })}
              {byMachine.length===0 && (<tr><td colSpan="7"><div className="empty"><i className="fa-solid fa-industry"></i><div className="t">ยังไม่มีอะไหล่ที่บันทึกไว้</div></div></td></tr>)}
            </tbody>
          </table>
        ) : (
          <table className="data">
            <thead><tr><th>อะไหล่ / รายการ</th><th className="hide-on-mobile">รูป</th><th>ใช้ (ครั้ง)</th><th>จำนวนรวม</th><th>มูลค่ารวม</th><th className="hide-on-mobile">แหล่งซื้อ</th></tr></thead>
            <tbody>
              {grouped.map((g,i)=>(
                <tr key={i}>
                  <td style={{fontWeight:500}}>{g.name}</td>
                  <td className="hide-on-mobile">{g.photos.length>0 ? <div style={{display:"flex",gap:4}}>{g.photos.slice(0,2).map((u,k)=><PhotoThumb key={k} url={u} size={36} />)}</div> : <span style={{color:"var(--muted)",fontSize:12}}>—</span>}</td>
                  <td>{g.count.toLocaleString("th-TH")}</td>
                  <td style={{whiteSpace:"nowrap"}}>{g.qty.toLocaleString("th-TH")}</td>

            </tbody>
          </table>
        )}
      </div>
    </div>
    {detail && <RepairDetail r={detail} onClose={()=>setDetail(null)} user={user} onQuick={null} onEdit={null} onEditParts={null} onProblems={()=>{}} />}
    </>
  );
}
